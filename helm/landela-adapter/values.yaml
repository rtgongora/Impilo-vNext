replicaCount: 2

image:
  repository: impilo/landela-adapter-service
  tag: latest
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  httpPort: 8092

env:
  SPRING_DATASOURCE_URL: jdbc:postgresql://postgresql:5432/landela_adapter
  SPRING_DATASOURCE_USERNAME: impilo
  SPRING_DATASOURCE_PASSWORD: impilo
  SPRING_DATA_REDIS_HOST: redis
  SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: http://keycloak:8080/realms/impilo
  LANDELA_MODE: INTERNAL
  MINIO_ENDPOINT: http://minio:9000
  MINIO_BUCKET: impilo-documents
  MINIO_ACCESS_KEY: minioadmin
  MINIO_SECRET_KEY: minioadmin

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: "1"
    memory: 1Gi

livenessProbe:
  httpGet:
    path: /actuator/health/liveness
    port: 8092
  initialDelaySeconds: 30

readinessProbe:
  httpGet:
    path: /actuator/health/readiness
    port: 8092
  initialDelaySeconds: 15
