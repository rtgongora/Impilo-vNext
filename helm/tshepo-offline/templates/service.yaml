apiVersion: v1
kind: Service
metadata:
  name: {{ include "tshepo-offline.fullname" . }}
  labels:
    {{- include "tshepo-offline.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port | default .Values.service.httpPort }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "tshepo-offline.selectorLabels" . | nindent 4 }}
