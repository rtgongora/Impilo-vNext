replicaCount: 2

image:
  repository: impilo/tshepo-authz-service
  tag: latest
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  httpPort: 8081
  grpcPort: 9090

env:
  SPRING_DATASOURCE_URL: jdbc:postgresql://postgresql:5432/tshepo_authz
  SPRING_DATASOURCE_USERNAME: impilo
  SPRING_DATASOURCE_PASSWORD: impilo
  SPRING_DATA_REDIS_HOST: redis
  SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  TSHEPO_CONSENT_URL: http://tshepo-consent-service:8182
  TSHEPO_IDENTITY_URL: http://tshepo-identity-service:8181
  TSHEPO_AUDIT_URL: http://tshepo-audit-service:8183
  TSHEPO_KEYS_URL: http://tshepo-keys-service:8184
  SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: http://keycloak:8080/realms/impilo

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: "1"
    memory: 1Gi

livenessProbe:
  httpGet:
    path: /actuator/health/liveness
    port: 8081
  initialDelaySeconds: 30

readinessProbe:
  httpGet:
    path: /actuator/health/readiness
    port: 8081
  initialDelaySeconds: 15
