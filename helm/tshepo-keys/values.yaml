replicaCount: 1

image:
  repository: impilo/tshepo-keys-service
  tag: latest
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8184

env:
  SPRING_DATASOURCE_URL: jdbc:postgresql://postgresql:5432/tshepo_keys
  SPRING_DATASOURCE_USERNAME: impilo
  SPRING_DATASOURCE_PASSWORD: impilo
  SPRING_DATA_REDIS_HOST: redis
  TSHEPO_KEYS_KEK: change-me-in-production-use-vault

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 250m
    memory: 512Mi

livenessProbe:
  httpGet:
    path: /actuator/health/liveness
    port: 8184
  initialDelaySeconds: 30

readinessProbe:
  httpGet:
    path: /actuator/health/readiness
    port: 8184
  initialDelaySeconds: 15
