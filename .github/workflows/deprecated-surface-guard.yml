name: Deprecated Surface Guard

on:
  pull_request:
    paths:
      - "ui/experience/**"
      - "ui/ehr/**"
      - "ui/mushex-finance-console/**"
      - "ui/mushex-ops-console/**"
      - "ui/mushex-payer-portal/**"
  push:
    branches: [main, develop, "claude/**"]
    paths:
      - "ui/experience/**"
      - "ui/ehr/**"
      - "ui/mushex-finance-console/**"
      - "ui/mushex-ops-console/**"
      - "ui/mushex-payer-portal/**"

jobs:
  block-deprecated-ui-paths:
    name: Block new files under retired UI paths
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fail if new files appear under retired UI sidecar paths
        run: bash scripts/guard/check-deprecated-surfaces.sh
