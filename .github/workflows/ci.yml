name: CI

# Canonical test logic lives in repo scripts (VM + Actions share the same gates):
#   bash scripts/pipeline/run-local-quality-gates.sh
# Sub-scripts under scripts/test/ and scripts/guard/ must stay in sync with YAML orchestration only.

on:
  push:
    branches: [main, develop, 'claude/**']
  pull_request:
    branches: [main, develop]

env:
  JAVA_VERSION: '21'
  NODE_VERSION: '20'

jobs:
  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Build shared libraries
        run: |
          cd services && mvn install -pl shared-core -am -DskipTests -q
          cd ../libs/shared-kernel-java && mvn install -DskipTests -q

      - name: Build tech-companion
        working-directory: libs/tech-companion
        run: mvn install -DskipTests -q

      - name: Build tech-companion-harness
        working-directory: libs/tech-companion-harness
        run: mvn install -DskipTests -q

      - name: Test experience-bff
        working-directory: services/experience-bff
        env:
          SPRING_PROFILES_ACTIVE: test,test-ci
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/test_db
          SPRING_DATASOURCE_USERNAME: test
          SPRING_DATASOURCE_PASSWORD: test
          KEYCLOAK_URL: http://127.0.0.1:1
        run: mvn test -Dspring.profiles.active=test,test-ci

      - name: Test Tshepo authz + shared visibility
        working-directory: services
        run: |
          mvn test -pl zw.gov.mohcc.impilo:tshepo-authz-service,zw.gov.mohcc.impilo:shared-core -am

  # F4: non-canonical branches never reached backend-reactor-tests (gated inside
  # preview-pipeline-gates on the staging-ux branch only). Diff-scoped -pl/-am
  # covers the changed modules at bounded runner cost; the full reactor stays
  # on canonical push via preview-pipeline-gates.
  backend-diff-scoped-tests:
    name: Backend Diff-Scoped Tests
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'pull_request' ||
      (github.event_name == 'push' && github.ref != 'refs/heads/claude/staging-ux-orchestration-remediation-Yypyl')
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Resolve affected Maven modules
        id: affected
        env:
          GITHUB_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          GITHUB_EVENT_BEFORE: ${{ github.event.before || '' }}
        run: |
          chmod +x scripts/build/affected-maven-modules.sh
          MODULES="$(bash scripts/build/affected-maven-modules.sh)"
          echo "modules=$MODULES" >> "$GITHUB_OUTPUT"
          echo "Affected modules: ${MODULES:-none}"

      - name: Test affected modules (-pl -am)
        if: steps.affected.outputs.modules != '' && steps.affected.outputs.modules != 'ALL'
        working-directory: services
        run: |
          mvn test -pl "${{ steps.affected.outputs.modules }}" -am -Dspring.profiles.active=test

      - name: Test full reactor (shared inputs changed)
        if: steps.affected.outputs.modules == 'ALL'
        working-directory: services
        run: |
          mvn test -Dspring.profiles.active=test \
            -pl '!oros-service,!experience-bff,!zw.gov.mohcc.impilo:tshepo-authz-service'

      - name: Nothing to test
        if: steps.affected.outputs.modules == ''
        run: echo "No Java module changes since baseline — skipping."

  oros-imaging-test:
    name: OROS Imaging Tests (dcm4che)
    runs-on: ubuntu-latest
    # oros-service pulls dcm4che from https://maven.dcm4che.org (not on Maven
    # Central); GitHub-hosted runners have open internet so the repo resolves.
    # The suite (DicomMwlTest etc.) builds DICOM MWL datasets in-memory — no
    # dcm4chee-arc / Orthanc / database needed. This job closes the WS-P6-B
    # verification gap: oros-service was in no CI gate, so its imaging modality
    # changes were never test-verified in automation.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Build shared libraries
        run: |
          cd services && mvn install -pl shared-core -am -DskipTests -q
          cd ../libs/shared-kernel-java && mvn install -DskipTests -q

      - name: Build tech-companion
        working-directory: libs/tech-companion
        run: mvn install -DskipTests -q

      - name: Test oros-service
        working-directory: services
        run: mvn test -pl oros-service -am

  trust-e2e-gates:
    name: Trust E2E Gates
    runs-on: ubuntu-latest
    needs: [backend-test]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: MVUMO remote session integration gate
        working-directory: services
        run: mvn -pl mvumo-service -am -Dtest=MvumoCrossServiceFlowIT test

      - name: TSHEPO Authz denial gate
        working-directory: services
        run: mvn -pl tshepo-authz-service -am -Dtest=PolicyEngineTest test

      - name: TSHEPO Consent denial + audit gate
        working-directory: services
        run: mvn -pl tshepo-consent-service -am -Dtest=ConsentEvaluationServiceTest test

      - name: Legacy compatibility telemetry gate
        working-directory: services
        run: mvn -pl tshepo-service -am -Dtest=LegacyRouteTelemetryTest,LegacyRouteInventoryGuardTest test

  trust-fullstack-runtime:
    name: Trust Fullstack Runtime E2E
    runs-on: ubuntu-latest
    needs: [trust-e2e-gates]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Build trust service jars for compose
        working-directory: services
        run: |
          mvn -pl tshepo-authz-service,tshepo-consent-service,tshepo-audit-service,mvumo-service,tshepo-service -am -DskipTests package

      - name: Docker/Compose preflight
        run: |
          docker version
          docker compose version
          docker info
          docker compose -f compose/trust/docker-compose.trust-e2e.yml config > /dev/null

      - name: Ensure harness is executable
        run: chmod +x test/integration/trust-fullstack-runtime.sh

      - name: Run trust fullstack runtime integration harness
        env:
          TRUST_E2E_COMPOSE_PROJECT: trust-e2e-${{ github.run_id }}-${{ github.run_attempt }}
          TRUST_E2E_ARTIFACT_DIR: ${{ github.workspace }}/.tmp/trust-e2e-artifacts
        run: bash test/integration/trust-fullstack-runtime.sh

      - name: Upload trust runtime diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: trust-fullstack-runtime-diagnostics
          path: .tmp/trust-e2e-artifacts
          retention-days: 14

  registry-fullstack-runtime:
    name: Registry Fullstack Runtime E2E
    runs-on: ubuntu-latest
    needs: [backend-test]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Build registry runtime jars for compose
        working-directory: services
        run: |
          mvn -pl tshepo-authz-service,vito-service,varapi-service,tuso-service,zibo-service,msika-service,ubomi-service,experience-bff -am -DskipTests package

      - name: Docker/Compose preflight
        run: |
          docker version
          docker compose version
          docker info
          docker compose -f compose/registry/docker-compose.registry-e2e.yml config > /dev/null

      - name: Ensure harness is executable
        run: chmod +x test/integration/registry-fullstack-runtime.sh

      - name: Run registry fullstack runtime integration harness
        env:
          REGISTRY_E2E_COMPOSE_PROJECT: registry-e2e-${{ github.run_id }}-${{ github.run_attempt }}
          REGISTRY_E2E_ARTIFACT_DIR: ${{ github.workspace }}/.tmp/registry-e2e-artifacts
        run: bash test/integration/registry-fullstack-runtime.sh

      - name: Upload registry runtime diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: registry-fullstack-runtime-diagnostics
          path: .tmp/registry-e2e-artifacts
          retention-days: 14

  core-transaction-runtime:
    name: Core Transaction Runtime E2E
    runs-on: ubuntu-latest
    needs: [backend-test]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Build experience-bff jar for compose
        working-directory: services
        run: |
          mvn -pl experience-bff -am -DskipTests package

      - name: Docker/Compose preflight
        run: |
          docker version
          docker compose version
          docker info
          docker compose -f compose/core-transaction/docker-compose.core-transaction-e2e.yml config > /dev/null

      - name: Ensure harness is executable
        run: chmod +x test/integration/core-transaction-runtime.sh

      - name: Run core transaction runtime integration harness
        env:
          CORE_TX_E2E_COMPOSE_PROJECT: core-tx-e2e-${{ github.run_id }}-${{ github.run_attempt }}
          CORE_TX_E2E_ARTIFACT_DIR: ${{ github.workspace }}/.tmp/core-tx-e2e-artifacts
        run: bash test/integration/core-transaction-runtime.sh

      - name: Upload core transaction runtime diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: core-transaction-runtime-diagnostics
          path: .tmp/core-tx-e2e-artifacts
          retention-days: 14

  core-transaction-doctrine-compliance:
    name: Core Transaction Doctrine Compliance
    runs-on: ubuntu-latest
    needs: [core-transaction-runtime]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install compliance audit dependencies
        run: pip install pyyaml

      - name: Run core transaction doctrine audit
        run: python scripts/architecture/audit-core-transaction-compliance.py

      - name: Upload core transaction compliance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-transaction-compliance-report
          path: |
            docs/reports/core-transaction-compliance-report.json
            docs/reports/core-transaction-compliance-report.md
          retention-days: 14

  core-transaction-load-baseline:
    name: Core Transaction Load Baseline
    runs-on: ubuntu-latest
    needs: [core-transaction-doctrine-compliance]
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Install k6
        run: |
          sudo apt-get update
          sudo apt-get install -y gnupg ca-certificates
          sudo mkdir -p /etc/apt/keyrings
          curl -fsSL https://dl.k6.io/key.gpg | sudo gpg --dearmor -o /etc/apt/keyrings/k6-archive-keyring.gpg
          echo "deb [signed-by=/etc/apt/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install -y k6

      - name: Build experience-bff jar for compose
        working-directory: services
        run: |
          mvn -pl experience-bff -am -DskipTests package

      - name: Start core transaction compose stack
        run: docker compose -p core-tx-k6-${{ github.run_id }}-${{ github.run_attempt }} -f compose/core-transaction/docker-compose.core-transaction-e2e.yml up -d --build

      - name: Wait for BFF health
        run: |
          for i in {1..60}; do
            if curl -fsS http://localhost:48161/actuator/health | python -c 'import json,sys; d=json.load(sys.stdin); assert d.get("status")=="UP"; print("UP")'; then
              exit 0
            fi
            sleep 2
          done
          echo "BFF did not become healthy in time" >&2
          exit 1

      - name: Run k6 core transaction baseline
        run: |
          mkdir -p tests/performance/results
          BFF_URL=http://localhost:48161 TENANT_ID=tenant-core-tx-ci k6 run tests/performance/k6-core-transaction.js

      - name: Upload k6 result artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-transaction-k6-results
          path: tests/performance/results
          retention-days: 14

      - name: Stop core transaction compose stack
        if: always()
        run: docker compose -p core-tx-k6-${{ github.run_id }}-${{ github.run_attempt }} -f compose/core-transaction/docker-compose.core-transaction-e2e.yml down -v

  frontend-lint:
    name: Frontend Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install dependencies
        working-directory: ui
        run: npm ci --ignore-scripts -w one-ui-shell

      - name: Canonical frontend + static + parity gates (VM scripts)
        env:
          PIPELINE_CI_MODE: "1"
          PIPELINE_SKIP_TOOLCHECK: "1"
          PIPELINE_SKIP_BACKEND: "1"
          PIPELINE_SKIP_INTEGRATION: "1"
          PIPELINE_SKIP_REGRESSION: "1"
          PIPELINE_SKIP_E2E: "1"
          PIPELINE_ONLY: "security,static,frontend,parity-web"
        run: bash scripts/pipeline/run-local-quality-gates.sh

  backend-frontend-parity-gate:
    name: Backend-to-Frontend Parity Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install UI deps for no-stub guard
        working-directory: ui
        run: npm ci --ignore-scripts -w one-ui-shell

      - name: Run backend-frontend parity gate
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_EVENT_BEFORE: ${{ github.event.before || '' }}
          GUARD_BASE_REF: ${{ github.event_name == 'push' && github.event.before || '' }}
        run: bash scripts/guard/check-backend-frontend-parity.sh

  mobile-parity-gate:
    name: Mobile Parity Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Run mobile parity gate
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_EVENT_BEFORE: ${{ github.event.before || '' }}
          GUARD_BASE_REF: ${{ github.event_name == 'push' && github.event.before || '' }}
        run: bash scripts/guard/check-mobile-parity.sh

  completeness-report:
    name: Completeness report (informational)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Generate Phase A2 report
        working-directory: scripts/completeness
        run: |
          npm ci
          npm run report

      - name: Upload report artifacts
        uses: actions/upload-artifact@v4
        with:
          name: completeness-report
          path: |
            docs/reports/completeness-report.json
            docs/reports/completeness-report.md
          retention-days: 14

  architecture-registry-advisory:
    name: Service Registry Validation (Advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install validator dependencies
        run: pip install pyyaml

      - name: Run architecture registry validation in advisory mode
        env:
          SERVICE_REGISTRY_VALIDATION_MODE: advisory
          OPENAPI_LEGACY_DEADLINE: 2026-10-31
        run: python scripts/architecture/validate-service-registry.py

  architecture-registry-soft-gate-readiness:
    name: Service Registry Soft-Gate Readiness (Advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install validator dependencies
        run: pip install pyyaml

      - name: Run registry validator in soft mode with contract-closure readiness policy
        env:
          SERVICE_REGISTRY_VALIDATION_MODE: soft
          SERVICE_REGISTRY_REQUIRE_SOFT_GATE_CONTRACT_CLOSURE: 'true'
          OPENAPI_LEGACY_DEADLINE: 2026-10-31
        run: python scripts/architecture/validate-service-registry.py

  learning-rollout-readiness:
    name: Learning rollout readiness gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.15.4

      - name: Helm render validation (learning chart)
        run: |
          helm template helm/learning
          helm template helm/learning -f helm/learning/values.minimal.yaml

      - name: Run learning OpenAPI + rollout evidence checks
        working-directory: scripts/completeness
        run: |
          npm ci
          npm run lint-learning-openapi-local
          npm run check-lms-rollout-evidence

  parity-matrix-check:
    name: Parity matrix up-to-date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Regenerate matrix
        run: node tools/parity/generate-mobile-parity-matrix.mjs

      - name: Fail if generated parity docs drifted
        run: |
          git diff -- docs/mobile/*parity* || true
          git diff --exit-code -- docs/mobile/*parity*

  parity-docs-check:
    name: Frontend parity docs up-to-date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # --check renders the registry and compares it to the tracked docs without
      # writing them. Regenerating then diffing failed on the generated date
      # header alone, so this job went red on any day the docs were not
      # regenerated, whatever the actual content.
      - name: Fail if parity docs drifted
        run: node scripts/frontend/generate-parity-docs.mjs --check

  frontend-test:
    name: Frontend Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install dependencies
        working-directory: ui
        run: npm ci --ignore-scripts -w one-ui-shell

      - name: Run unit tests
        working-directory: ui/one-ui-shell
        run: npm test

      - name: Route parity check
        working-directory: ui/one-ui-shell
        run: npm run test:routes

      # The experience BFF filters mobile provider hub sections against a generated projection
      # of routes.ts. If a guard changes here and the projection is not regenerated, the BFF
      # filters against stale guards and offers links that bounce back to /home.
      - name: Route-guard export up to date
        working-directory: ui/one-ui-shell
        run: npm run test:route-guard-export

  e2e-test:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [frontend-lint, frontend-test]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install dependencies
        working-directory: ui
        run: npm ci --ignore-scripts -w one-ui-shell

      - name: Install Playwright browsers
        working-directory: ui/one-ui-shell
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        working-directory: ui/one-ui-shell
        run: npm run e2e -- --project=chromium --reporter=list

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: ui/one-ui-shell/playwright-report/
          retention-days: 7

  e2e-compose-smoke:
    name: E2E Compose Smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Start compose stack
        run: |
          docker compose -f compose/experience/docker-compose.yml up -d --build

      - name: Wait for BFF health
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8160/actuator/health >/dev/null; then exit 0; fi
            sleep 5
          done
          echo "BFF did not become healthy in time"
          exit 1

      - name: Verify demo journey probes
        run: node scripts/production-readiness/verify-demo-journeys.mjs | tee verify-demo-journeys.log

      - name: Generate Wave 20 parity matrix
        run: node scripts/production-readiness/generate-wave20-parity-matrix.mjs

      - name: Upload verify probe log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: verify-demo-journeys-log
          path: verify-demo-journeys.log
          retention-days: 7

      - name: Install UI deps
        working-directory: ui
        run: npm ci --ignore-scripts -w one-ui-shell

      - name: Install Playwright browsers
        working-directory: ui/one-ui-shell
        run: npx playwright install --with-deps chromium

      - name: Run compose smoke specs
        working-directory: ui/one-ui-shell
        env:
          PLAYWRIGHT_COMPOSE_E2E: "1"
          PLAYWRIGHT_SKIP_WEBSERVER: "1"
          PLAYWRIGHT_BASE_URL: "http://localhost:3000"
        run: npx playwright test --project=chromium --reporter=list e2e/citizen-life-compose.spec.ts e2e/production-readiness.spec.ts --workers=1

      - name: Compose logs on failure
        if: failure()
        run: |
          docker compose -f compose/experience/docker-compose.yml ps
          docker compose -f compose/experience/docker-compose.yml logs --no-color | tail -n 400

      - name: Shutdown compose
        if: always()
        run: docker compose -f compose/experience/docker-compose.yml down -v

  e2e-sovereign-smoke:
    name: E2E Sovereign Smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Build sovereign JARs
        working-directory: services
        run: >
          mvn -B -pl wellness-service,inpatient-service,pct-service,integration-hub,experience-bff,
          pharmacy-service,mushex-service,dispatch-service,costing-engine-service,surveillance-service,ndila-service,nhume-service
          -am -DskipTests package

      - name: Start compose stack (sovereign overlay)
        run: |
          docker compose -f compose/experience/docker-compose.yml \
            -f compose/experience/docker-compose.sovereign.yml up -d --build

      - name: Wait for sovereign health
        run: node scripts/production-readiness/wait-sovereign-health.mjs

      - name: Verify demo journey probes (sovereign)
        run: node scripts/production-readiness/verify-demo-journeys.mjs --sovereign | tee verify-demo-journeys-sovereign.log

      - name: Generate Wave 20 parity matrix
        run: node scripts/production-readiness/generate-wave20-parity-matrix.mjs

      - name: Upload verify probe log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: verify-demo-journeys-sovereign-log
          path: verify-demo-journeys-sovereign.log
          retention-days: 7

      - name: Compose logs on failure
        if: failure()
        run: |
          docker compose -f compose/experience/docker-compose.yml \
            -f compose/experience/docker-compose.sovereign.yml ps
          docker compose -f compose/experience/docker-compose.yml \
            -f compose/experience/docker-compose.sovereign.yml logs --no-color | tail -n 400

      - name: Shutdown compose
        if: always()
        run: |
          docker compose -f compose/experience/docker-compose.yml \
            -f compose/experience/docker-compose.sovereign.yml down -v

  mobile-e2e-maestro:
    name: Mobile E2E smoke (Maestro, Android emulator)
    runs-on: ubuntu-latest
    continue-on-error: false
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: apps/mobile/pnpm-lock.yaml

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Install mobile workspace dependencies
        working-directory: apps/mobile
        run: pnpm install

      - name: Install Expo CLI
        working-directory: apps/mobile
        run: pnpm dlx expo --version

      - name: Install Maestro
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
          maestro --version

      - name: Prebuild + build citizen debug APK
        working-directory: apps/mobile/citizen-app
        env:
          CI: "1"
        run: |
          pnpm dlx expo prebuild --platform android --no-install --clean
          cd android
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/citizen-debug.apk"

      - name: Upload citizen debug APK
        uses: actions/upload-artifact@v4
        with:
          name: citizen-debug-apk
          path: ${{ runner.temp }}/citizen-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Prebuild + build provider debug APK
        working-directory: apps/mobile/provider-app
        env:
          CI: "1"
        run: |
          pnpm dlx expo prebuild --platform android --no-install --clean
          cd android
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/provider-debug.apk"

      - name: Upload provider debug APK
        uses: actions/upload-artifact@v4
        with:
          name: provider-debug-apk
          path: ${{ runner.temp }}/provider-debug.apk
          if-no-files-found: error
          retention-days: 14

      # Unauthenticated smokes. Flows tagged `auth` (login/journey) are
      # excluded here — they need real preview credentials and a reachable
      # preview stack, and run in the guarded step below instead.
      - name: Run Maestro flows on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_5
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          disable-animations: true
          script: |
            adb wait-for-device
            adb install -r "$RUNNER_TEMP/citizen-debug.apk"
            adb install -r "$RUNNER_TEMP/provider-debug.apk"
            maestro test --exclude-tags auth apps/mobile/maestro/flows

      # OPTIONAL login/journey flows against the live preview environment.
      # Runs only when the repo secret MAESTRO_PREVIEW_CREDENTIALS is set.
      # Secret format: newline-separated KEY=VALUE pairs, e.g.
      #   MAESTRO_CITIZEN_USERNAME=...
      #   MAESTRO_CITIZEN_PASSWORD=...
      #   MAESTRO_PROVIDER_USERNAME=...
      #   MAESTRO_PROVIDER_PASSWORD=...
      #   MAESTRO_PROVIDER_ID=...
      #   MAESTRO_PATIENT_QUERY=...
      # Maestro forwards MAESTRO_-prefixed env vars into the flows; nothing
      # is ever echoed or committed. Requires the preview stack
      # (impilo.mohcc.gov.zw) to be reachable from the runner.
      - name: Run Maestro login/journey flows (preview credentials)
        if: ${{ secrets.MAESTRO_PREVIEW_CREDENTIALS != '' }}
        uses: reactivecircus/android-emulator-runner@v2
        env:
          MAESTRO_PREVIEW_CREDENTIALS: ${{ secrets.MAESTRO_PREVIEW_CREDENTIALS }}
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_5
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          disable-animations: true
          script: |
            adb wait-for-device
            adb install -r "$RUNNER_TEMP/citizen-debug.apk"
            adb install -r "$RUNNER_TEMP/provider-debug.apk"
            printf '%s\n' "$MAESTRO_PREVIEW_CREDENTIALS" > "$RUNNER_TEMP/maestro-preview.env"
            set -a
            # shellcheck disable=SC1090
            . "$RUNNER_TEMP/maestro-preview.env"
            set +a
            rm -f "$RUNNER_TEMP/maestro-preview.env"
            maestro test --include-tags auth apps/mobile/maestro/flows

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so gitleaks can scan the push/PR commit range.
          fetch-depth: 0

      # P0 secrets guardrail — fails on NEW committed placeholder/secret tokens
      # (helm values, runtime-values generator, realm JSON, service config, env).
      # Existing occurrences are baselined; the set shrinks as the migration
      # phases land. See docs/security/secrets-management-migration-plan.md.
      - name: No new committed secrets (baseline guard)
        run: bash scripts/guard/check-committed-secrets.sh

      # High-entropy secret gate — scans ONLY the new commits (fast; ignores the
      # already-committed preview placeholders, so no findings-baseline needed).
      - name: Install gitleaks
        run: |
          ver=8.21.2
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${ver}/gitleaks_${ver}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version
      - name: gitleaks (new commits only)
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            bash scripts/guard/gitleaks-diff-scan.sh "${{ github.event.pull_request.base.sha }}" "${{ github.sha }}"
          else
            bash scripts/guard/gitleaks-diff-scan.sh "${{ github.event.before }}" "${{ github.sha }}"
          fi

  change-safety-gates:
    name: Change Safety Gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run change-safety guards
        env:
          GITHUB_BASE_REF: ${{ github.event.pull_request.base.ref || '' }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_EVENT_BEFORE: ${{ github.event.before || '' }}
          GUARD_BASE_REF: ${{ github.event_name == 'push' && github.event.before || '' }}
        run: bash scripts/guard/run-change-safety-gates.sh

  preview-pipeline-gates:
    name: Preview Pipeline Gates (VM parity)
    runs-on: ubuntu-latest
    needs:
      - backend-test
      - frontend-lint
      - frontend-test
      - backend-frontend-parity-gate
      - mobile-parity-gate
      - change-safety-gates
    if: github.event_name == 'push' && github.ref == 'refs/heads/claude/staging-ux-orchestration-remediation-Yypyl'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Canonical VM parity gates (no deploy)
        env:
          PIPELINE_CI_MODE: "1"
          PIPELINE_SKIP_TOOLCHECK: "1"
          PIPELINE_SKIP_FRONTEND: "1"
          PIPELINE_SKIP_STATIC: "1"
          PIPELINE_SKIP_BACKEND: "0"
          PIPELINE_SKIP: "parity-web,parity-mobile"
          PREVIEW_GATES_SKIP_E2E: "1"
          PIPELINE_SKIP_E2E: "1"
        run: bash scripts/pipeline/run-local-quality-gates.sh
