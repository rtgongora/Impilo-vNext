name: Deploy Preview

# Manual user-authorized preview deploy only. CI runs separately and does NOT deploy.
on:
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to deploy
        required: true
        default: claude/staging-ux-orchestration-remediation-Yypyl
      commit_sha:
        description: Optional full commit SHA to deploy (defaults to branch HEAD on VM)
        required: false
        default: ""
      deploy_reason:
        description: Why this deploy is authorized
        required: true
        default: "Manual user-authorized preview deploy"
      bypass_ci_check:
        description: Allow deploy when CI failed/unknown (risk override)
        required: false
        type: boolean
        default: false

concurrency:
  group: preview-deploy-${{ inputs.branch }}
  cancel-in-progress: true

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Deploy over SSH (authorized)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.PREVIEW_HOST }}
          port: ${{ secrets.PREVIEW_PORT }}
          username: ${{ secrets.PREVIEW_USER }}
          key: ${{ secrets.PREVIEW_SSH_KEY }}
          script: |
            set -euo pipefail
            export DEPLOY_BRANCH="${{ inputs.branch }}"
            export DEPLOY_COMMIT_SHA="${{ inputs.commit_sha }}"
            export BYPASS_CI="${{ inputs.bypass_ci_check && '1' || '0' }}"
            export BYPASS_REASON="${{ inputs.deploy_reason }}"
            export NON_INTERACTIVE=1
            cd /opt/impilo/repos/Impilo-vNext
            bash scripts/deploy/manual-authorized-preview-deploy.sh
