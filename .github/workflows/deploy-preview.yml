name: Deploy Preview

# Manual redeploy anytime. Automatic deploy after CI runs from ci.yml
# (deploy-preview-sandbox job) on the active preview branch.
on:
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to deploy
        required: true
        default: claude/staging-ux-orchestration-remediation-Yypyl

concurrency:
  group: preview-deploy-${{ inputs.branch }}
  cancel-in-progress: true

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.PREVIEW_HOST }}
          port: ${{ secrets.PREVIEW_PORT }}
          username: ${{ secrets.PREVIEW_USER }}
          key: ${{ secrets.PREVIEW_SSH_KEY }}
          script: |
            set -euo pipefail
            export DEPLOY_BRANCH="${{ inputs.branch }}"
            bash /opt/impilo/repos/Impilo-vNext/scripts/deploy/github-actions-remote-preview-deploy.sh
