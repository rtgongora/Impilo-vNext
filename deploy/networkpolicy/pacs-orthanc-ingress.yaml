# Containment for the PACS store (Orthanc), 2026-08-03.
#
# WHY: `GET http://orthanc:8042/patients` returned 200 to any pod in the namespace with no
# credential. Same class as the SHR finding in `shr-hapi-fhir-ingress.yaml`, found in the same
# sweep. Orthanc holds imaging studies -- DICOM carries patient demographics in the pixel data
# headers themselves, so unlike the SHR there is no "identifiers only" bound to fall back on.
#
# The store was empty when measured, so nothing was disclosed. The control was absent, which is the
# part that matters: anything ingested afterwards would have been readable by every workload.
#
# CONTAINMENT IS NOT AUTHENTICATION. Orthanc's own auth is not configured; a permitted caller still
# reaches it with no credential. See `docs/security/trust-audit/NEXT_SESSION_BRIEF.md` §4a for why
# the authentication half is a sequence rather than a switch -- the same reasoning applies here.
#
# ── CALLERS: TWO, BOTH VERIFIED AS CLIENTS ──────────────────────────────────────────────────
#
#   experience-bff         ORTHANC_BASE_URL     = http://orthanc:8042
#                          ORTHANC_DICOMWEB_URL = http://orthanc:8042/dicom-web
#   pacs-adapter-service   ORTHANC_BASE_URL     = http://orthanc:8042
#
# Direction checked in source, not inferred from the env name -- the SHR policy initially admitted
# butano-service on exactly that mistake, where the URL turned out to be a self-advertised server
# address rather than a client target:
#
#   - experience-bff: `PacsController` proxies to Orthanc deliberately, and says so -- "This keeps
#     Orthanc unexposed to the public", with a C-STORE style ingest posting raw application/dicom
#     to Orthanc `/instances` and a study list off its REST API. A real client.
#   - pacs-adapter-service: `OrthancClientConfig` builds a dedicated `orthancRestTemplate` and
#     `OrthancClient` is the live consumer. A real client.
#
# ── THE DICOM PORT (4242) IS DELIBERATELY NOT ALLOWED ───────────────────────────────────────
#
# The Service exposes 8042 (REST) and 4242 (DIMSE, the DICOM network protocol). Selecting this pod
# denies everything not explicitly allowed, so omitting 4242 closes it to in-cluster traffic.
#
# On 4242 Orthanc is a DICOM Service Class Provider: C-STORE (a modality or peer PACS pushes images
# in), C-FIND (query), C-MOVE / C-GET (retrieve), C-ECHO (the DICOM ping). In a hospital this is
# normally THE ingest path from imaging equipment, so closing it is not a trivial call.
#
# It is closed for three reasons, in order of weight:
#
#   1. THIS ESTATE DOES NOT INGEST OVER DIMSE. `PacsController` performs "C-STORE *style* ingest:
#      POST raw application/dicom to Orthanc /instances" -- that is HTTP on 8042. Routing ingest
#      through the BFF is the deliberate architecture; the DIMSE listener is not merely unused, it
#      is bypassed by design.
#   2. No in-cluster DICOM client exists. Every `4242` match under `services/*/src/main` is a
#      facility code such as `ZW014242` in seed SQL.
#   3. The Service is ClusterIP, so nothing outside the cluster can reach 4242 today regardless.
#
# AND THE CONTROL MATTERS MORE HERE THAN ON 8042. DICOM has effectively no authentication: peers
# identify each other by AE Title, which is a self-asserted string, not a credential. DICOM TLS
# exists in the standard and is rarely deployed. So for 4242 a NetworkPolicy is not a weaker stand-in
# for authentication -- it is the primary control available.
#
# ── IF A MODALITY INTEGRATION IS ADDED LATER ────────────────────────────────────────────────
#
# Do NOT reach for a podSelector. A modality is hospital hardware on the facility network, not a pod
# in this namespace, so no podSelector can ever match it and the rule will look broken.
#
# It needs BOTH:
#   - an external path that does not exist today -- this Service is ClusterIP, so a NodePort or
#     LoadBalancer would have to be introduced first; and
#   - an `ipBlock` here for the device address or its subnet, scoped as tightly as the estate
#     allows.
#
# Enumerate the device. Do not widen this policy to "all ports" or to a broad CIDR to make one
# machine work -- that is how a containment policy becomes decoration.
#
# Ports are the POD's ports. Orthanc maps 8042->8042 and 4242->4242, so the numbers coincide here --
# but see the SHR policy, where the Service maps 8090->8080 and using the Service port partitioned
# every legitimate caller while the negative control still passed.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: pacs-orthanc-ingress
  namespace: impilo-full-preview
  labels:
    impilo.io/trust-cohort: "pacs"
  annotations:
    impilo.io/rollback: "kubectl -n impilo-full-preview delete networkpolicy pacs-orthanc-ingress"
    impilo.io/caller-evidence: "PacsController and OrthancClient are live outbound clients; verified by call-direction, not env name-match (2026-08-03)"
spec:
  podSelector:
    matchLabels:
      app: orthanc
  policyTypes:
    - Ingress
  ingress:
    # The two enumerated callers, REST port only.
    - from:
        - podSelector:
            matchLabels:
              app: experience-bff
        - podSelector:
            matchLabels:
              app: pacs-adapter-service
      ports:
        - protocol: TCP
          port: 8042

    # Kubelet liveness/readiness probes arrive from the NODE, not from a pod, so no podSelector can
    # match them. Both probes are httpGet on 8042 (verified), so omitting this would fail them,
    # mark Orthanc unready and take the PACS store down while the policy looked like a hardening.
    #
    # SINGLE ADDRESSES ONLY, never the pod CIDR -- 10.42.0.1 is the cni0 bridge the probe actually
    # arrives from, plus the node's own address.
    - from:
        - ipBlock:
            cidr: 10.42.0.1/32
        - ipBlock:
            cidr: 10.50.1.67/32
      ports:
        - protocol: TCP
          port: 8042
