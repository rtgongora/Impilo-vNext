# TURN-over-TLS reachability for LiveKit telemedicine relay on impilo.mohcc.gov.zw.
#
# WHY: LiveKit v1.13.3 advertises its embedded TURN server to browsers as
# `turns:<turn.domain>:443?transport=tcp` (the :443 is HARDCODED, independent of
# turn.tls_port). The node's :443 is already Traefik (HTTPS + wss signaling for
# impilo.mohcc.gov.zw), and TURN-TLS cannot share that SNI with HTTPS. So LiveKit's
# turn.domain is a DEDICATED SNI — turn.impilo.mohcc.gov.zw — and Traefik TCP-routes
# that exact SNI, WITHOUT terminating TLS (passthrough), straight to the LiveKit
# TURN listener (Service livekit:5349). LiveKit terminates the TLS itself with its
# mounted cert (external_tls: false); that cert MUST carry turn.impilo.mohcc.gov.zw
# as a SAN.
#
# PATH: turns:turn.impilo.mohcc.gov.zw:443
#         -> 41.57.127.235:443 (existing pfSense 443 forward — NO new rule)
#         -> Traefik `websecure` entrypoint
#         -> HostSNI(turn.impilo.mohcc.gov.zw) TLS passthrough
#         -> Service livekit:5349 -> LiveKit embedded TURN/TLS (hostNetwork *:5349)
#
# SAFETY: exact HostSNI only (no wildcard). TLS passthrough means Traefik never
# terminates and never sees the existing HTTPS cert here. Different SNI from
# `impilo.mohcc.gov.zw`, so the existing HTTP/HTTPS IngressRoutes and /rtc
# signaling on the same websecure entrypoint are untouched.
#
# Standalone (not Helm), like its sibling livekit-ingressroute.yaml — the
# impilo.mohcc.gov.zw public edge lives outside the chart and is (re)applied by
# scripts/tls/restore-public-edge.sh. References the chart-owned `livekit` Service.
#
# EXTERNAL PREREQUISITES before this carries live relay traffic:
#   1. DNS: turn.impilo.mohcc.gov.zw. A 41.57.127.235 (TTL 300) — GTA/ZCHPC zone.
#   2. Cert: turn.impilo.mohcc.gov.zw added as a SAN on impilo-mohcc-gov-zw-tls
#      (certbot --webroot expand; see README.md / PUBLIC-MEDIA-PLAN.md).
apiVersion: traefik.io/v1alpha1
kind: IngressRouteTCP
metadata:
  name: impilo-mohcc-gov-livekit-turn
  namespace: impilo-full-preview
spec:
  entryPoints:
    - websecure
  routes:
    - match: HostSNI(`turn.impilo.mohcc.gov.zw`)
      services:
        - name: livekit
          port: 5349
  tls:
    passthrough: true
