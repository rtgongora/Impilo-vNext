# ACME HTTP-01 challenge routing for impilo.mohcc.gov.zw
#
# Routes Let's Encrypt's /.well-known/acme-challenge/ requests (arriving at
# Traefik :80 for host impilo.mohcc.gov.zw) to the acme-host-nginx Service, whose
# Endpoints point at the host nginx on :8089 serving /var/www/letsencrypt.
#
# This is the .gov.zw analogue of the (manually-applied) acme-host-nginx Ingress
# that was created for impilo.mohcc.org.zw. It lets host-side certbot --webroot
# validate impilo.mohcc.gov.zw. See README.md for the full pipeline.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: acme-host-nginx-gov
  namespace: impilo-full-preview
  annotations:
    # HTTP-01 challenges are plain HTTP on :80 — bind ONLY the web entrypoint.
    # Without this, k3s binds Ingresses to ALL entrypoints, and the
    # turn.impilo.mohcc.gov.zw rule below would create a TLS-TERMINATING route
    # for that SNI on websecure — which beats (and silently breaks) the
    # IngressRouteTCP TLS-passthrough route that must own that SNI for TURN
    # relay (livekit-turn-ingressroutetcp.yaml). Empirically root-caused
    # 2026-07-20: Traefik DEBUG showed both "Adding Passthrough route" and
    # "Adding route ... with TLS options default" for the same SNI, with
    # termination winning.
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  ingressClassName: traefik
  rules:
    - host: impilo.mohcc.gov.zw
      http:
        paths:
          - path: /.well-known/acme-challenge/
            pathType: Prefix
            backend:
              service:
                name: acme-host-nginx
                port:
                  number: 80
    # SAN for LiveKit TURN-over-TLS (turn.impilo.mohcc.gov.zw). Lets host-side
    # certbot --webroot HTTP-01-validate the extra SAN when expanding the cert.
    # Inert until the turn.impilo.mohcc.gov.zw A record exists (GTA/ZCHPC zone).
    - host: turn.impilo.mohcc.gov.zw
      http:
        paths:
          - path: /.well-known/acme-challenge/
            pathType: Prefix
            backend:
              service:
                name: acme-host-nginx
                port:
                  number: 80
