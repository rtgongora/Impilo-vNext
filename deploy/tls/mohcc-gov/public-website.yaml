# Impilo public gateway website at impilo.mohcc.gov.zw (edge split).
# The website owns the PUBLIC paths; vNext keeps everything else — including
# /auth/* (the "Log in for work" handoff), /learning (Fundo) and all app routes.
# Priority sits between the UI catch-all (1) and the BFF surfaces (100000).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: public-website
  namespace: impilo-full-preview
  labels: { app: public-website }
spec:
  # Public front door → 2 replicas + zero-downtime RollingUpdate (maxUnavailable=0 keeps
  # the old site serving until the new pod is Ready). No more blip on a website repin.
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  selector: { matchLabels: { app: public-website } }
  template:
    metadata:
      labels: { app: public-website }
    spec:
      containers:
        - name: public-website
          image: 127.0.0.1:5000/impilo/public-website@sha256:7a1e3ee8ba631b249ec582501b0e57c676a9c01b2371054e76be694dee79aa77
          ports: [{ containerPort: 8080 }]
          readinessProbe:
            httpGet: { path: /, port: 8080 }
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            requests: { cpu: 25m, memory: 32Mi }
            limits: { cpu: 200m, memory: 128Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: public-website
  namespace: impilo-full-preview
spec:
  selector: { app: public-website }
  ports: [{ port: 8080, targetPort: 8080 }]
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: impilo-mohcc-gov-https-public-website
  namespace: impilo-full-preview
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      # Public marketing/informational paths served by the website. NOT claimed
      # (→ vNext): /learning (Fundo), /get-involved + /community (the REAL vNext
      # participation feature), /download (vNext get-app page). /apps + /.well-known
      # ARE the website's (app-discovery surface + universal-link association files).
      match: >-
        Host(`impilo.mohcc.gov.zw`) && (Path(`/`) || PathPrefix(`/about`) ||
        PathPrefix(`/services`) || PathPrefix(`/solutions`) ||
        PathPrefix(`/features`) || PathPrefix(`/resources`) ||
        PathPrefix(`/docs`) || PathPrefix(`/training`) ||
        PathPrefix(`/apps`) || PathPrefix(`/.well-known`) ||
        PathPrefix(`/technical`) || PathPrefix(`/contact`) ||
        PathPrefix(`/assets`) || Path(`/logo.png`))
      priority: 50000
      services:
        - name: public-website
          port: 8080
  tls:
    secretName: impilo-mohcc-gov-zw-tls
