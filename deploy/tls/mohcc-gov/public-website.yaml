# Legacy public-site static compatibility service.
#
# User-visible public routes, including "/", now belong to one-ui-shell so Impilo
# presents one coherent public-to-authenticated experience. This deployment remains
# temporarily only for the mobile universal-link association files under
# /.well-known; it no longer owns any page, navigation or visual asset route.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: public-website
  namespace: impilo-full-preview
  labels: { app: public-website }
spec:
  # Public front door → 2 replicas + zero-downtime RollingUpdate (maxUnavailable=0 keeps
  # the old site serving until the new pod is Ready). No more blip on a website repin.
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  selector: { matchLabels: { app: public-website } }
  template:
    metadata:
      labels: { app: public-website }
    spec:
      containers:
        - name: public-website
          image: 127.0.0.1:5000/impilo/public-website@sha256:de1235a219801a1e37569ff6963d0d7c2c2bebde00b888edd670eee46921458e
          ports: [{ containerPort: 8080 }]
          readinessProbe:
            httpGet: { path: /, port: 8080 }
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            requests: { cpu: 25m, memory: 32Mi }
            limits: { cpu: 200m, memory: 128Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: public-website
  namespace: impilo-full-preview
spec:
  selector: { app: public-website }
  ports: [{ port: 8080, targetPort: 8080 }]
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: impilo-mohcc-gov-https-public-website
  namespace: impilo-full-preview
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      # Static mobile association files only. Every human-facing route falls
      # through to the one-ui-shell catch-all.
      match: Host(`impilo.mohcc.gov.zw`) && PathPrefix(`/.well-known`)
      priority: 50000
      services:
        - name: public-website
          port: 8080
  tls:
    secretName: impilo-mohcc-gov-zw-tls
