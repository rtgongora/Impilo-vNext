# Full boot target values for namespace impilo-full-preview.
# Safe preview/demo only — no production secrets. gitBranch/gitCommit/buildDate set at deploy time.
global:
  environment: full-preview
  publicHost: "impilo.mohcc.gov.zw"
  imageTag: preview
  imagePullPolicy: IfNotPresent
  imageRegistry: "127.0.0.1:5000"
  # Single-node preview: Recreate avoids RollingUpdate surge pods that exceed the 110 pod cap.
  deploymentStrategy: Recreate
  database:
    enabled: true
    jdbcUrl: jdbc:postgresql://postgres:5432/impilo
    username: impilo
  redis:
    enabled: true
    host: redis
    port: "6379"
  kafka:
    bootstrapServers: kafka:9092
  # Images already set -XX:+UseZGC on the java command; do not add a second GC via JAVA_TOOL_OPTIONS.
  javaToolOptions: "-XX:MaxRAMPercentage=70.0"
  # Preview has no OTLP collector; empty endpoint crashes Spring Boot 3.3 OTLP autoconfig.
  previewDisableTracing: true
  defaultResources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1536Mi

# Keycloak/MinIO admin credentials are provisioned out-of-band into Secret
# impilo-app-secrets (keys keycloak-admin-*, minio-root-*) by
# scripts/secrets/bootstrap-secrets.sh — never committed. See P3 of
# docs/security/secrets-management-migration-plan.md.

images:
  experienceBff:
    repository: 127.0.0.1:5000/impilo/experience-bff
    tag: preview
    pullPolicy: IfNotPresent
  oneUiShell:
    repository: 127.0.0.1:5000/impilo/one-ui-shell
    tag: preview
    pullPolicy: IfNotPresent

# Highest-Validated-Stack-Wins: the public IP (https://impilo.mohcc.gov.zw) surfaces the latest
# CI/CD-passed preview generation. The full stack now owns the public ingress; the legacy
# 4-service impilo-preview slice is a short-lived rollback fallback only and must not also
# serve the IP (its ingress is disabled). See docs/environment/FIRST_FULL_BOOT_ATTEMPT_PLAN.md.
ingress:
  enabled: true
  className: traefik

postgres:
  enabled: true
  image: postgres:16-alpine
  username: impilo
  database: impilo
  password: preview-postgres-change-me
  # Full preview: max_connections + per-service DB list come from
  # values-full-preview-runtime.generated.yaml (regenerated on each deploy).
  maxConnections: 600
  sharedBuffers: 256MB
  # Durable data volume (PVC, local-path). 2026-07-18: emptyDir wiped the estate twice.
  storageSize: 50Gi

redis:
  enabled: true
  image: redis:7-alpine

kafka:
  enabled: true
  storageSize: 10Gi
  image:
    repository: apache/kafka
    tag: "3.7.1"
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi

keycloak:
  enabled: true
  storageSize: 2Gi
  # Seed the impilo realm (client experience-ui + users/roles) at FIRST boot.
  # H2 now lives on the keycloak-data PVC (2026-07-18), so --import-realm only runs
  # into an empty database; later restarts keep users (incl. citizen signups).
  realmImport:
    enabled: true
  image:
    repository: quay.io/keycloak/keycloak
    tag: "25.0"
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi

envoy:
  enabled: true
  image:
    repository: envoyproxy/envoy
    tag: v1.31-latest
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

minio:
  enabled: true
  storageSize: 20Gi
  image:
    repository: minio/minio
    tag: latest
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

livekit:
  enabled: true
  image:
    # docker.io unreachable from the preview VM; mirror carries livekit-server.
    # v1.13.x pairs with livekit-client 2.19 (protocol 17): older servers never
    # acknowledge the client's offer IDs, so every publisher negotiation "times
    # out" after 15s and all rooms churn through NegotiationError/resume cycles.
    repository: mirror.gcr.io/livekit/livekit-server
    tag: "v1.13.3"
    pullPolicy: IfNotPresent
  # apiKey is not a secret. The signing secret is injected out-of-band: livekit
  # server via LIVEKIT_KEYS env, rtc-gateway via LIVEKIT_API_SECRET, egress via its
  # render initContainer — all from Secret impilo-app-secrets (key livekit-*).
  # See docs/security/secrets-management-migration-plan.md (P2).
  apiKey: "impilo-preview-key"
  # rtc-gateway ingests LiveKit webhooks (room/participant/track/egress lifecycle)
  # and translates them onto the impilo.rtc.* outbox events. Service name + port
  # match the fullBootServices entry for rtc-gateway-service (8196).
  webhookUrl: "http://rtc-gateway-service:8196/internal/v1/rtc/webhooks/livekit"
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi

# LiveKit Egress worker — room-composite recordings requested by rtc-gateway,
# uploaded to the in-chart MinIO bucket. v1.13.0 pairs with livekit-server 1.13.x.
livekitEgress:
  enabled: true
  bucket: impilo-recordings
  image:
    # docker.io unreachable from the preview VM; mirror carries livekit/egress.
    repository: mirror.gcr.io/livekit/egress
    tag: "v1.13.0"
    pullPolicy: IfNotPresent
  # Egress is CPU-heavy (headless-Chrome compositing + encoding). Room
  # composite requires 4 CPUs by egress's own admission control ("not enough
  # cpu for some egress types" at 2); the VM has 32 cores.
  resources:
    requests:
      cpu: "1"
      memory: 1Gi
    limits:
      cpu: "4"
      memory: 2Gi

orthanc:
  enabled: true
  storageSize: 10Gi
  image:
    # docker.io is unreachable from the preview VM; the gcr mirror carries the
    # jodogne images (orthanc-plugins ships the DICOMweb plugin).
    repository: mirror.gcr.io/jodogne/orthanc-plugins
    tag: "1.12.4"
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 768Mi

# Ndila Tier B — Martin PMTiles street basemap (self-hosted OSM-derived rasters).
# Ndila proxies tiles via NDILA_OSM_TILE_BASE_URL=http://ndila-martin:3000/…
# Populate PVC with scripts/operator/setup-ndila-street-stack.sh or pmtilesDownloadUrl.
ndilaStreetStack:
  enabled: true
  storageSize: 2Gi
  pmtilesDownloadUrl: ""
  image:
    repository: ghcr.io/maplibre/martin
    tag: v0.15.0
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

hapiFhir:
  enabled: true
  image:
    repository: hapiproject/hapi
    tag: v7.4.0
    pullPolicy: IfNotPresent
  database:
    jdbcUrl: jdbc:postgresql://postgres:5432/hapi
  resources:
    requests:
      cpu: 300m
      memory: 1Gi
    limits:
      cpu: "2"
      memory: 2Gi

experienceBff:
  enabled: true
  # Public front door → 2 replicas for HA + zero-downtime RollingUpdate (node maxPods=250,
  # ample headroom). Rest of estate stays replicas:1 / Recreate.
  replicaCount: 2
  secretEnv:
    KEYCLOAK_BACKEND_SECRET:
      name: impilo-app-secrets
      key: keycloak-backend-secret
  env:
    REDIS_HOST: redis
    REDIS_PORT: "6379"
    KEYCLOAK_URL: http://keycloak:8080
    KEYCLOAK_REALM: impilo
    KEYCLOAK_CLIENT_ID: experience-ui
    KEYCLOAK_BACKEND_CLIENT_ID: impilo-backend
    AUTH_FALLBACK_ENABLED: "false"
    IMPILO_SECURITY_ALLOW_ANONYMOUS: "true"
    IMPILO_BOOTSTRAP_ENABLED: "true"
    IMPILO_BOOTSTRAP_ENVIRONMENT: "preview"
    IMPILO_BOOTSTRAP_REQUIRE_MFA: "false"
    IMPILO_BOOTSTRAP_TOKEN_HASH: "303dae0752dd6b788e2e7f4896f02e0e2929a8fdfad3412abd26765e521197a1"
    IMPILO_BOOTSTRAP_TOKEN_EXPIRES_AT: "2027-12-31T23:59:59Z"
    IMPILO_BOOTSTRAP_ALLOWED_METHODS: "one_time_token,signed_authorisation"
    TSHEPO_AUTHZ_BASE_URL: http://tshepo-authz-service:8081
    VITO_BASE_URL: http://vito-service:8082
    VARAPI_BASE_URL: http://varapi-service:8083
    TUSO_BASE_URL: http://tuso-service:8084
    WORKFORCE_GOVERNANCE_BASE_URL: http://workforce-governance-service:8165
    VASHANDI_BASE_URL: http://vashandi-workforce-service:8167
    FHIR_GATEWAY_BASE_URL: http://fhir-gateway-service:8091
    # Booking/scheduling downstreams — unset previously, so the BFF called localhost
    # and citizen/provider appointment surfaces returned 500 (connection refused).
    BOOKING_BASE_URL: http://booking-service:8265
    SCHEDULING_SERVICE_BASE_URL: http://scheduling-service:8128
    # Gateway W1 public lanes + R1 rung — unset previously, so the BFF called localhost
    # and the guidance explainer lane, R1 contact-attestation hop and OTP delivery all
    # failed in-cluster (same class as the booking/scheduling fix above). Rig-flagged.
    GUIDANCE_BASE_URL: http://guidance-service:8260
    IDENTITY_ASSURANCE_BASE_URL: http://identity-assurance-service:8201
    NOTIFICATION_BASE_URL: http://notification-service:8200
    SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    SPRING_KAFKA_LISTENER_AUTO_STARTUP: "false"
    MANAGEMENT_HEALTH_KAFKA_ENABLED: "false"
    SPRING_AUTOCONFIGURE_EXCLUDE: "org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration,org.springframework.boot.autoconfigure.security.oauth2.resource.servlet.OAuth2ResourceServerAutoConfiguration"

oneUiShell:
  enabled: true
  # Public front door → 2 replicas for HA + zero-downtime RollingUpdate.
  replicaCount: 2
  env:
    NEXT_PUBLIC_BFF_URL: ""
    NEXT_PUBLIC_IMPILO_ENV: full-preview
    # Defense-in-depth: UI /internal/* rewrites must not target localhost:10000.
    API_GATEWAY_URL: "http://experience-bff:8160"
    NEXT_PUBLIC_API_GATEWAY_URL: "http://experience-bff:8160"

# Domain microservices: see values-full-preview-runtime.generated.yaml (wave-enabled set).
# Regenerate: node scripts/full-boot/generate-full-preview-runtime-values.mjs --max-wave <N>
#
# Governed login orchestration requires workforce-governance (wave 7 optional) even when
# FULL_BOOT_MAX_WAVE=0 — session contract work-tab resolution depends on it.
# Vashandi operational workforce BFF routes require vashandi-workforce-service.
fullBootServices:
  workforce-governance-service:
    enabled: true
  vashandi-workforce-service:
    enabled: true
  # Subject-context ratchet (Identity Contract B5): burn-in LOG mode on the
  # subject-write services — mismatched/missing X-Subject-Context-Token on
  # subject-scoped writes is logged (SUBJECT_CONTEXT_VIOLATION), never blocked.
  # ENFORCE only after the gateway journey pack proves token plumbing end-to-end.
  vito-service:
    env:
      IMPILO_SUBJECT_CONTEXT_MODE: "log"
  tshepo-identity-service:
    env:
      IMPILO_SUBJECT_CONTEXT_MODE: "log"
  pct-service:
    env:
      IMPILO_SUBJECT_CONTEXT_MODE: "log"
  butano-service:
    env:
      IMPILO_SUBJECT_CONTEXT_MODE: "log"
  butano-fhir:
    env:
      IMPILO_SUBJECT_CONTEXT_MODE: "log"
  daidzai-service:
    env:
      IMPILO_SUBJECT_CONTEXT_MODE: "log"
  # Preview-scoped boot requirements discovered by the 2026-07-02 full-boot
  # runtime checkpoint. Fail-closed guards in these services are correct for
  # production; preview supplies the explicit opt-ins / preview key material.
  tshepo-authz-service:
    env:
      # Estate DB predates HEAD's V010 (renumbered against live estate);
      # preview applies it out of order instead of renumbering history.
      SPRING_FLYWAY_OUT_OF_ORDER: "true"
  llm-orchestration-service:
    env:
      LLM_SECURITY_ALLOW_INSECURE_PERMIT_ALL: "true"
  ai-model-registry-service:
    env:
      AIR_SECURITY_ALLOW_INSECURE_PERMIT_ALL: "true"
  mushe-wallet-service:
    env:
      # Preview-only key material — NOT production key management.
      WALLET_CARD_ENCRYPTION_MASTER_KEY: "preview-only-card-master-key-0123456789abcdef01"
  tuso-service:
    env:
      # Diagnostic rider for the silent import row-approve 403 (task #9):
      # surfaces the authorization decision path in pod logs. Preview-only.
      LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_SECURITY: "DEBUG"
  notification-service:
    env:
      # Channel adapters stay log-mode until an operator provides real SMTP/SMS
      # credentials (scripts/secrets/bootstrap-secrets.sh seeds placeholders so
      # the secretKeyRef mounts schedule). Flip to smtp/http once real values
      # are in impilo-app-secrets. GET /internal/v1/channels/status reports the
      # live posture honestly — the admin panel shows stub-mode as NOT delivered.
      NOTIFICATION_EMAIL_PROVIDER: log
      NOTIFICATION_SMS_PROVIDER: log
      NOTIFICATION_EMAIL_SMTP_FROM: noreply@impilo.mohcc.gov.zw
    secretEnv:
      NOTIFICATION_EMAIL_SMTP_HOST:
        name: impilo-app-secrets
        key: smtp-host
      NOTIFICATION_EMAIL_SMTP_USERNAME:
        name: impilo-app-secrets
        key: smtp-username
      NOTIFICATION_EMAIL_SMTP_PASSWORD:
        name: impilo-app-secrets
        key: smtp-password
      NOTIFICATION_SMS_GATEWAY_URL:
        name: impilo-app-secrets
        key: sms-gateway-url
      NOTIFICATION_SMS_GATEWAY_API_KEY:
        name: impilo-app-secrets
        key: sms-gateway-api-key
  # Kafka listener opt-ins — the estate default is auto-startup=false; these
  # services' event loops are journey-load-bearing (PACS study → OROS imaging
  # result; PCT encounter → COSTA draft bill; MusheX status → COSTA settlement;
  # pharmacy dispense → Dura stock). Rollback = remove the env line.
  oros-service:
    env:
      SPRING_KAFKA_LISTENER_AUTO_STARTUP: "true"
  pacs-adapter-service:
    env:
      SPRING_KAFKA_LISTENER_AUTO_STARTUP: "true"
  costing-engine-service:
    env:
      SPRING_KAFKA_LISTENER_AUTO_STARTUP: "true"
      MUSHEX_BASE_URL: http://mushex-service:8102
      COVERAGE_BASE_URL: http://coverage-service:8140
  mushex-service:
    env:
      SPRING_KAFKA_LISTENER_AUTO_STARTUP: "true"
      # Intent creation verifies payee credentials — default pointed at localhost.
      CREDENTIAL_BASE_URL: http://credential-verification-service:8094
      CREDENTIAL_VERIFICATION_BASE_URL: http://credential-verification-service:8094
  coverage-service:
    env:
      SPRING_KAFKA_LISTENER_AUTO_STARTUP: "true"
  inventory-service:
    env:
      SPRING_KAFKA_LISTENER_AUTO_STARTUP: "true"
  pharmacy-service:
    env:
      SPRING_KAFKA_LISTENER_AUTO_STARTUP: "true"
  learning-service:
    env:
      SPRING_KAFKA_LISTENER_AUTO_STARTUP: "true"
      # ⑤ Fundo notification flip: dispatch through the real notification-service
      # instead of the default STUB provider.
      LEARNING_NOTIFICATION_PROVIDER: NOTIFICATION_SERVICE
      LEARNING_NOTIFICATION_BASE_URL: http://notification-service:8200
      LEARNING_NOTIFICATION_DISPATCH_POLL_MS: "30000"
      # LEARNING_LIVE: schedule Fundo webinars on the in-chart Impilo Live —
      # the localhost default silently no-ops LiveSessionIntegration.
      LEARNING_LIVE_BASE_URL: http://live-service:8380
  varapi-service:
    env:
      # CPD writeback: consume impilo.learning.certificate.issued.v1.
      SPRING_KAFKA_LISTENER_AUTO_STARTUP: "true"
  document-service:
    env:
      # Artifact SoR must reach the in-chart MinIO — the localhost default
      # broke recording adoption (register-external) and any real storage IO.
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: impilo-preview
    secretEnv:
      MINIO_SECRET_KEY:
        name: impilo-app-secrets
        key: minio-root-password
  rtc-gateway-service:
    env:
      # Recording lifecycle: template-driven policy gates in RtcRecordingService
      # (rtc.gateway.recording-enabled / egress-enabled stay false by default;
      # preview opts in). S3 secret comes from Secret impilo-app-secrets
      # (minio-root-password); LiveKit egress carries the request-level S3 target.
      RTC_RECORDING_ENABLED: "true"
      RTC_EGRESS_ENABLED: "true"
      RTC_RECORDING_S3_ACCESS_KEY: "impilo-preview"
      RTC_RECORDING_S3_ENDPOINT: "http://minio:9000"
      RTC_RECORDING_BUCKET: "impilo-recordings"
    secretEnv:
      RTC_RECORDING_S3_SECRET_KEY:
        name: impilo-app-secrets
        key: minio-root-password
  live-service:
    env:
      # Real media sessions: without this the LocalDevMediaProvider mints
      # dev tokens and no rtc room ever exists (classroom joins were theatre).
      LIVE_MEDIA_PROVIDER: rtc-gateway
      RTC_GATEWAY_BASE_URL: http://rtc-gateway-service:8196
      DOCUMENT_SERVICE_BASE_URL: http://document-service:8093
      NOTIFICATION_BASE_URL: http://notification-service:8200
      # RTC media truth: consume impilo.rtc.session/participant events so the LiveKit
      # room lifecycle drives live-event state (SCHEDULED→LIVE→ENDED) + attendance.
      SPRING_KAFKA_LISTENER_AUTO_STARTUP: "true"
  khuluma-service:
    env:
      # RTC media truth: consume impilo.rtc.* events so call participant state and
      # call end follow the actual media room (khuluma_call_events audit + ACTIVE→ENDED).
      SPRING_KAFKA_LISTENER_AUTO_STARTUP: "true"
      # W5 MEETING invite links: stable HMAC secret so links survive pod restarts.
      # Preview-only value — production must source this from a real secret store.
      KHULUMA_MEETING_INVITE_SECRET: "preview-khuluma-meeting-invite-secret-2026"
      # W5 MEETING media: khuluma schedules the meeting's live event and drives the
      # rtc lobby — localhost defaults would silently degrade meetings to no-media.
      LIVE_BASE_URL: http://live-service:8380
      RTC_GATEWAY_BASE_URL: http://rtc-gateway-service:8196
