# Full boot target values for namespace impilo-full-preview.
# Safe preview/demo only — no production secrets. gitBranch/gitCommit/buildDate set at deploy time.
global:
  environment: full-preview
  publicHost: "impilo.mohcc.gov.zw"
  imageTag: preview
  imagePullPolicy: IfNotPresent
  imageRegistry: "127.0.0.1:5000"
  # Single-node preview: Recreate avoids RollingUpdate surge pods that exceed the 110 pod cap.
  deploymentStrategy: Recreate
  database:
    enabled: true
    jdbcUrl: jdbc:postgresql://postgres:5432/impilo
    username: impilo
  redis:
    enabled: true
    host: redis
    port: "6379"
  kafka:
    bootstrapServers: kafka:9092
  # Images already set -XX:+UseZGC on the java command; do not add a second GC via JAVA_TOOL_OPTIONS.
  javaToolOptions: "-XX:MaxRAMPercentage=70.0"
  # Preview has no OTLP collector; empty endpoint crashes Spring Boot 3.3 OTLP autoconfig.
  previewDisableTracing: true
  defaultResources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1536Mi

# Keycloak/MinIO admin credentials are provisioned out-of-band into Secret
# impilo-app-secrets (keys keycloak-admin-*, minio-root-*) by
# scripts/secrets/bootstrap-secrets.sh — never committed. See P3 of
# docs/security/secrets-management-migration-plan.md.

images:
  experienceBff:
    repository: 127.0.0.1:5000/impilo/experience-bff
    tag: preview
    pullPolicy: IfNotPresent
  oneUiShell:
    repository: 127.0.0.1:5000/impilo/one-ui-shell
    tag: preview
    pullPolicy: IfNotPresent

# Highest-Validated-Stack-Wins: the public IP (https://impilo.mohcc.gov.zw) surfaces the latest
# CI/CD-passed preview generation. The full stack now owns the public ingress; the legacy
# 4-service impilo-preview slice is a short-lived rollback fallback only and must not also
# serve the IP (its ingress is disabled). See docs/environment/FIRST_FULL_BOOT_ATTEMPT_PLAN.md.
ingress:
  enabled: true
  className: traefik

postgres:
  enabled: true
  image: postgres:16-alpine
  username: impilo
  database: impilo
  password: preview-postgres-change-me
  # Full preview: max_connections + per-service DB list come from
  # values-full-preview-runtime.generated.yaml (regenerated on each deploy).
  maxConnections: 600
  sharedBuffers: 256MB
  # Hand-registered service databases that the generator does NOT emit (abis-service
  # is not in config/full-boot-service-classification.yml, so it never appears in the
  # regenerated postgres.initDatabases list). extraInitDatabases is created ALONGSIDE
  # initDatabases by templates/postgres-init-databases.yaml and survives regeneration
  # because the generated overlay never sets this key.
  extraInitDatabases:
    - abis
  # Durable data volume (PVC, local-path). 2026-07-18: emptyDir wiped the estate twice.
  storageSize: 50Gi

redis:
  enabled: true
  image: redis:7-alpine

kafka:
  enabled: true
  storageSize: 10Gi
  image:
    repository: apache/kafka
    tag: "3.7.1"
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi

keycloak:
  enabled: true
  storageSize: 2Gi
  # Seed the impilo realm (client experience-ui + users/roles) at FIRST boot.
  # H2 now lives on the keycloak-data PVC (2026-07-18), so --import-realm only runs
  # into an empty database; later restarts keep users (incl. citizen signups).
  realmImport:
    enabled: true
  image:
    repository: quay.io/keycloak/keycloak
    tag: "25.0"
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi

envoy:
  enabled: true
  image:
    repository: envoyproxy/envoy
    tag: v1.31-latest
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
  # Work Context Resolution programme, Phase D (D1): the TSHEPO ext_authz gate
  # on the actual ingress path. Defaults false — nothing changes until this is
  # deliberately flipped per-environment as one of the staged D7 cutover flips
  # (alongside TSHEPO_WORK_CONTEXT_MODE=ENFORCE and V055 boundary-rule
  # activation). Do not flip in any environment carrying real traffic without
  # first confirming: failure_mode_allow=false is intentional (a PDP outage
  # denies, it does not fail open), the bypass route list below is complete
  # for that environment's public surface, and TSHEPO_WORK_CONTEXT_MODE is
  # already ENFORCE (flipping the gateway gate before the PDP itself enforces
  # duty-context mismatches achieves nothing extra; flipping it AFTER is the
  # ordering that matters).
  extAuthz:
    enabled: false

minio:
  enabled: true
  storageSize: 20Gi
  image:
    repository: minio/minio
    tag: latest
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

livekit:
  enabled: true
  image:
    # docker.io unreachable from the preview VM; mirror carries livekit-server.
    # v1.13.x pairs with livekit-client 2.19 (protocol 17): older servers never
    # acknowledge the client's offer IDs, so every publisher negotiation "times
    # out" after 15s and all rooms churn through NegotiationError/resume cycles.
    repository: mirror.gcr.io/livekit/livekit-server
    tag: "v1.13.3"
    pullPolicy: IfNotPresent
  # apiKey is not a secret. The signing secret is injected out-of-band: livekit
  # server via LIVEKIT_KEYS env, rtc-gateway via LIVEKIT_API_SECRET, egress via its
  # render initContainer — all from Secret impilo-app-secrets (key livekit-*).
  # See docs/security/secrets-management-migration-plan.md (P2).
  apiKey: "impilo-preview-key"
  # rtc-gateway ingests LiveKit webhooks (room/participant/track/egress lifecycle)
  # and translates them onto the impilo.rtc.* outbox events. Service name + port
  # match the fullBootServices entry for rtc-gateway-service (8196).
  webhookUrl: "http://rtc-gateway-service:8196/internal/v1/rtc/webhooks/livekit"
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi

# LiveKit Egress worker — room-composite recordings requested by rtc-gateway,
# uploaded to the in-chart MinIO bucket. v1.13.0 pairs with livekit-server 1.13.x.
livekitEgress:
  enabled: true
  bucket: impilo-recordings
  image:
    # docker.io unreachable from the preview VM; mirror carries livekit/egress.
    repository: mirror.gcr.io/livekit/egress
    tag: "v1.13.0"
    pullPolicy: IfNotPresent
  # Egress is CPU-heavy (headless-Chrome compositing + encoding). Room
  # composite requires 4 CPUs by egress's own admission control ("not enough
  # cpu for some egress types" at 2); the VM has 32 cores.
  resources:
    requests:
      cpu: "1"
      memory: 1Gi
    limits:
      cpu: "4"
      memory: 2Gi

matcherEngine:
  # Biometric matching engine — core-infra component (SourceAFIS fingerprint real;
  # ONNX face/iris fail-closed until a model is mounted). Stateless (no PVC).
  # Built image from the estate registry, deployed in the infra lane like Orthanc.
  enabled: true
  replicaCount: 1
  image:
    # global.imageRegistry/impilo/matcher-engine:preview (our built engine image)
    tag: "preview"
    pullPolicy: IfNotPresent
  env:
    MATCHER_FP_THRESHOLD: "40"
    # Face EXTRACTION model path (ArcFace/MobileFaceNet ONNX). The model blob is an
    # external artifact — NOT committed — fetched into the engine image / a mounted
    # volume by scripts/dev/vendor-biometric-deps.sh (MATCHER_FACE_MODEL_URL). The
    # WIRING + fail-closed default are ours: empty here → OnnxFaceEmbedder logs
    # "face extraction fails closed" and never fabricates an embedding. Fingerprint
    # (SourceAFIS) + iris (Gabor) are real with jars alone and need no model. Set to
    # the mounted path (e.g. /models/face-embedding.onnx) to enable face extraction.
    MATCHER_FACE_MODEL_PATH: ""
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi

orthanc:
  enabled: true
  storageSize: 10Gi
  image:
    # docker.io is unreachable from the preview VM; the gcr mirror carries the
    # jodogne images (orthanc-plugins ships the DICOMweb plugin).
    repository: mirror.gcr.io/jodogne/orthanc-plugins
    tag: "1.12.4"
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 768Mi

# Ndila Tier B — Martin PMTiles street basemap (self-hosted OSM-derived rasters).
# Ndila proxies tiles via NDILA_OSM_TILE_BASE_URL=http://ndila-martin:3000/…
# Populate PVC with scripts/operator/setup-ndila-street-stack.sh or pmtilesDownloadUrl.
ndilaStreetStack:
  enabled: true
  storageSize: 2Gi
  pmtilesDownloadUrl: ""
  image:
    repository: ghcr.io/maplibre/martin
    tag: v0.15.0
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

# Estate health watch — continuous detection of silent service death.
# Exists because Keycloak sat with ZERO endpoints for 9 days (2026-07-20 outage)
# with every other signal green. Emits pod logs + a Kubernetes Event + a failed
# Job; set webhookUrlSecret to turn detection into an actual page.
estateHealthWatch:
  enabled: true
  schedule: "*/10 * * * *"
  # Services whose Service object must always have >=1 ready endpoint.
  # Keycloak first: it has no partial-failure mode — when it is down, ALL web
  # and mobile authentication is down, and nothing else reports it.
  requiredEndpoints:
    - keycloak
    - experience-bff
    - postgres
  image:
    # docker.io is unreachable from the preview VM; use the gcr mirror.
    repository: mirror.gcr.io/curlimages/curl
    tag: "8.11.1"
    pullPolicy: IfNotPresent
  # OPTIONAL — the only setting that produces a real page rather than a trace.
  # Create the secret out-of-band, then uncomment:
  #   kubectl -n impilo-full-preview create secret generic impilo-alert-webhook \
  #     --from-literal=url='https://hooks.slack.com/services/...'
  # webhookUrlSecret:
  #   name: impilo-alert-webhook
  #   key: url
  webhookUrlSecret: null

# redroid — Android-in-container mobile runtime fixture (adb :5555 internal).
# Image mirrored to the local registry (docker.io direct pull is unreliable
# from this VM): docker pull redroid/redroid:13.0.0-latest && docker tag …
# 127.0.0.1:5000/redroid/redroid:13.0.0 && docker push.
# Host prerequisite: binder_linux module loaded (see
# docs/runbooks/redroid-android-sandbox-runbook.md).
redroid:
  # DISABLED pending k3s/containerd compatibility: the image boots perfectly
  # under docker on this host, but the k3s CRI kills Android init at/after
  # exec (pty-close SIGHUP with tty, exit 255 without). The STANDING fixture
  # runs docker-managed instead: scripts/mobile/redroid-docker-fixture.sh
  # (adb on 127.0.0.1:15555). Findings + future k8s pass:
  # docs/runbooks/redroid-android-sandbox-runbook.md.
  enabled: false
  storageSize: 8Gi
  width: 1080
  height: 2340
  dpi: 440
  # Preview hairpin: the pod must reach impilo.mohcc.gov.zw via the internal
  # LB address (public IP is not hairpin-routable from inside the estate).
  hostAliases:
    - ip: "10.50.1.67"
      hostnames:
        - impilo.mohcc.gov.zw
  image:
    repository: 127.0.0.1:5000/redroid/redroid
    # -k3s = symlink-rewritten variant produced by
    # scripts/mobile/fix-redroid-image-for-containerd.sh (upstream image's
    # absolute rootfs symlinks break containerd: "path escapes from parent").
    tag: "13.0.0-k3s"
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: "2"
      memory: 3Gi
    limits:
      cpu: "4"
      memory: 6Gi

hapiFhir:
  enabled: true
  image:
    repository: hapiproject/hapi
    tag: v7.4.0
    pullPolicy: IfNotPresent
  database:
    jdbcUrl: jdbc:postgresql://postgres:5432/hapi
  resources:
    requests:
      cpu: 300m
      memory: 1Gi
    limits:
      cpu: "2"
      memory: 2Gi

experienceBff:
  enabled: true
  # Public front door → 2 replicas for HA + zero-downtime RollingUpdate (node maxPods=250,
  # ample headroom). Rest of estate stays replicas:1 / Recreate.
  replicaCount: 2
  secretEnv:
    KEYCLOAK_BACKEND_SECRET:
      name: impilo-app-secrets
      key: keycloak-backend-secret
  env:
    REDIS_HOST: redis
    REDIS_PORT: "6379"
    KEYCLOAK_URL: http://keycloak:8080
    KEYCLOAK_REALM: impilo
    KEYCLOAK_CLIENT_ID: experience-ui
    KEYCLOAK_BACKEND_CLIENT_ID: impilo-backend
    AUTH_FALLBACK_ENABLED: "false"
    IMPILO_SECURITY_ALLOW_ANONYMOUS: "true"
    IMPILO_BOOTSTRAP_ENABLED: "true"
    IMPILO_BOOTSTRAP_ENVIRONMENT: "preview"
    IMPILO_BOOTSTRAP_REQUIRE_MFA: "false"
    IMPILO_BOOTSTRAP_TOKEN_HASH: "303dae0752dd6b788e2e7f4896f02e0e2929a8fdfad3412abd26765e521197a1"
    IMPILO_BOOTSTRAP_TOKEN_EXPIRES_AT: "2027-12-31T23:59:59Z"
    IMPILO_BOOTSTRAP_ALLOWED_METHODS: "one_time_token,signed_authorisation"
    TSHEPO_AUTHZ_BASE_URL: http://tshepo-authz-service:8081
    VITO_BASE_URL: http://vito-service:8082
    VARAPI_BASE_URL: http://varapi-service:8083
    TUSO_BASE_URL: http://tuso-service:8084
    WORKFORCE_GOVERNANCE_BASE_URL: http://workforce-governance-service:8165
    VASHANDI_BASE_URL: http://vashandi-workforce-service:8167
    FHIR_GATEWAY_BASE_URL: http://fhir-gateway-service:8091
    # fhir-gateway downstreams — both were unset, so the gateway used its localhost:8182
    # / NO_ROUTE defaults and EVERY governed FHIR write failed in-cluster (consent PEP
    # fail-closed to DENY + no delivery target). Same class as the booking/guidance/abis
    # fixes above. CONSENT points at tshepo-consent-service; DEFAULT_TARGET_BASE lets writes
    # route to the SHR (HAPI) without a per-(tenant×resource) fhir_route row.
    CONSENT_SERVICE_BASE_URL: http://tshepo-consent-service:8182
    FHIR_GATEWAY_DEFAULT_TARGET_BASE: http://hapi-fhir:8090/fhir
    # Booking/scheduling downstreams — unset previously, so the BFF called localhost
    # and citizen/provider appointment surfaces returned 500 (connection refused).
    BOOKING_BASE_URL: http://booking-service:8265
    SCHEDULING_SERVICE_BASE_URL: http://scheduling-service:8128
    # Gateway W1 public lanes + R1 rung — unset previously, so the BFF called localhost
    # and the guidance explainer lane, R1 contact-attestation hop and OTP delivery all
    # failed in-cluster (same class as the booking/scheduling fix above). Rig-flagged.
    GUIDANCE_BASE_URL: http://guidance-service:8260
    IDENTITY_ASSURANCE_BASE_URL: http://identity-assurance-service:8201
    NOTIFICATION_BASE_URL: http://notification-service:8200
    # Biometric SoR (ABIS). Unset previously, so AbisBiometricClient +
    # AbisAdjudicationClient fell back to their localhost:8186 defaults and every
    # biometric enrol/verify/onboard + adjudication-console call failed in-cluster
    # (same class as the booking/scheduling/guidance fixes above).
    ABIS_BASE_URL: http://abis-service:8186
    SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    SPRING_KAFKA_LISTENER_AUTO_STARTUP: "false"
    MANAGEMENT_HEALTH_KAFKA_ENABLED: "false"
    SPRING_AUTOCONFIGURE_EXCLUDE: "org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration,org.springframework.boot.autoconfigure.security.oauth2.resource.servlet.OAuth2ResourceServerAutoConfiguration"

oneUiShell:
  enabled: true
  # Public front door → 2 replicas for HA + zero-downtime RollingUpdate.
  replicaCount: 2
  env:
    NEXT_PUBLIC_BFF_URL: ""
    NEXT_PUBLIC_IMPILO_ENV: full-preview
    # Defense-in-depth: UI /internal/* rewrites must not target localhost:10000.
    API_GATEWAY_URL: "http://experience-bff:8160"
    NEXT_PUBLIC_API_GATEWAY_URL: "http://experience-bff:8160"

# Domain microservices: see values-full-preview-runtime.generated.yaml (wave-enabled set).
# Regenerate: node scripts/full-boot/generate-full-preview-runtime-values.mjs --max-wave <N>
#
# Governed login orchestration requires workforce-governance (wave 7 optional) even when
# FULL_BOOT_MAX_WAVE=0 — session contract work-tab resolution depends on it.
# Vashandi operational workforce BFF routes require vashandi-workforce-service.
fullBootServices:
  workforce-governance-service:
    enabled: true
  vashandi-workforce-service:
    enabled: true
    env:
      # Downstream service URLs — unset previously, so vashandi-workforce-service fell back to
      # its localhost:8083/8165/8084/8235 application.yml defaults and the workforce-profile
      # reconcile's varapi + workforce-governance dependency checks failed with Connection
      # refused (persona provisioning could not verify provider/employment). Same class as the
      # tshepo-identity TSHEPO_KEYS_SERVICE_URL fix below. Flagged 2026-07-20.
      VARAPI_BASE_URL: http://varapi-service:8083
      WORKFORCE_GOVERNANCE_BASE_URL: http://workforce-governance-service:8165
      TUSO_BASE_URL: http://tuso-service:8084
      FUNDO_BASE_URL: http://learning-service:8235
  # Subject-context ratchet (Identity Contract B5): burn-in LOG mode on the
  # subject-write services — mismatched/missing X-Subject-Context-Token on
  # subject-scoped writes is logged (SUBJECT_CONTEXT_VIOLATION), never blocked.
  # ENFORCE only after the gateway journey pack proves token plumbing end-to-end.
  vito-service:
    env:
      IMPILO_SUBJECT_CONTEXT_MODE: "log"
  tshepo-identity-service:
    env:
      IMPILO_SUBJECT_CONTEXT_MODE: "log"
      # Unset previously, so scoped-token signing called localhost:8184 and
      # ALL estate token issuance (patient-context, WORK_CONTEXT, check-in)
      # 500'd with Connection refused. Live-harness-flagged 2026-07-19.
      TSHEPO_KEYS_SERVICE_URL: http://tshepo-keys-service:8184
  pct-service:
    env:
      IMPILO_SUBJECT_CONTEXT_MODE: "log"
  butano-service:
    env:
      IMPILO_SUBJECT_CONTEXT_MODE: "log"
  butano-fhir:
    env:
      IMPILO_SUBJECT_CONTEXT_MODE: "log"
  daidzai-service:
    env:
      IMPILO_SUBJECT_CONTEXT_MODE: "log"
  # Preview-scoped boot requirements discovered by the 2026-07-02 full-boot
  # runtime checkpoint. Fail-closed guards in these services are correct for
  # production; preview supplies the explicit opt-ins / preview key material.
  tshepo-authz-service:
    env:
      # Estate DB predates HEAD's V010 (renumbered against live estate);
      # preview applies it out of order instead of renumbering history.
      SPRING_FLYWAY_OUT_OF_ORDER: "true"
  llm-orchestration-service:
    env:
      LLM_SECURITY_ALLOW_INSECURE_PERMIT_ALL: "true"
  ai-model-registry-service:
    env:
      AIR_SECURITY_ALLOW_INSECURE_PERMIT_ALL: "true"
  # mushe-wallet-service: WALLET_CARD_ENCRYPTION_MASTER_KEY comes from
  # impilo-app-secrets via specialSecretEnv (bootstrap-secrets.sh) — never committed.
  tuso-service:
    env:
      # Diagnostic rider for the silent import row-approve 403 (task #9):
      # surfaces the authorization decision path in pod logs. Preview-only.
      LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_SECURITY: "DEBUG"
  notification-service:
    env:
      # TM-B19: consume queue lifecycle + SLA-breach streams (ops alerts) — preview default is off.
      SPRING_KAFKA_LISTENER_AUTO_STARTUP: "true"
      # Channel adapters stay log-mode until an operator provides real SMTP/SMS
      # credentials (scripts/secrets/bootstrap-secrets.sh seeds placeholders so
      # the secretKeyRef mounts schedule). Flip to smtp/http once real values
      # are in impilo-app-secrets. GET /internal/v1/channels/status reports the
      # live posture honestly — the admin panel shows stub-mode as NOT delivered.
      NOTIFICATION_EMAIL_PROVIDER: log
      NOTIFICATION_SMS_PROVIDER: log
      NOTIFICATION_EMAIL_SMTP_FROM: noreply@impilo.mohcc.gov.zw
    secretEnv:
      NOTIFICATION_EMAIL_SMTP_HOST:
        name: impilo-app-secrets
        key: smtp-host
      NOTIFICATION_EMAIL_SMTP_USERNAME:
        name: impilo-app-secrets
        key: smtp-username
      NOTIFICATION_EMAIL_SMTP_PASSWORD:
        name: impilo-app-secrets
        key: smtp-password
      NOTIFICATION_SMS_GATEWAY_URL:
        name: impilo-app-secrets
        key: sms-gateway-url
      NOTIFICATION_SMS_GATEWAY_API_KEY:
        name: impilo-app-secrets
        key: sms-gateway-api-key
  # Kafka listener opt-ins — the estate default is auto-startup=false; these
  # services' event loops are journey-load-bearing (PACS study → OROS imaging
  # result; PCT encounter → COSTA draft bill; MusheX status → COSTA settlement;
  # pharmacy dispense → Dura stock). Rollback = remove the env line.
  oros-service:
    env:
      SPRING_KAFKA_LISTENER_AUTO_STARTUP: "true"
  # OF-B11: msika-flow's InventoryEventConsumer mirrors DURA reservation events into the
  # mf_reservations projection and fail-closes SELECTED offers on reservation expiry —
  # silent listeners would silently break the §9.4 TTL fail-close contract.
  # OF-C M4 gate finding: iot-ingestion gates on its own impilo.security.mode knob
  # (ignores the platform disable-oauth flag) and its issuer defaulted to localhost —
  # no in-cluster JWT could ever validate. Preview parity + a valid issuer for defence.
  iot-ingestion-service:
    env:
      IMPILO_SECURITY_MODE: "permit-all"
      KEYCLOAK_ISSUER: "http://keycloak:8080/realms/impilo"
  msika-flow-service:
    env:
      SPRING_KAFKA_LISTENER_AUTO_STARTUP: "true"
      # OF-A M2 F1: eligibility registry clients (application.yml
      # msika-flow.integration.{varapi,tuso}-url read ${VARAPI_URL}/${TUSO_URL});
      # without these the pod falls back to localhost and every eligibility
      # precondition fail-closes UNVERIFIED.
      VARAPI_URL: "http://varapi-service:8083"
      TUSO_URL: "http://tuso-service:8084"
      # OF-B M3 CFG-1: money-stack clients (application.yml
      # msika-flow.integration.mushex-url reads ${MUSHEX_URL}; CostaClient/
      # CoverageClient @Value defaults msika-flow.integration.costa-url /
      # coverage-url point at localhost:8101/8140) — without these, commitment
      # steps 7–8 (financials + payment) are dead on the estate.
      MUSHEX_URL: "http://mushex-service:8102"
      MSIKAFLOW_INTEGRATION_COSTAURL: "http://costing-engine-service:8101"
      MSIKAFLOW_INTEGRATION_COVERAGEURL: "http://coverage-service:8140"
  # OF-B22: telemonitoring's OrosEnrolmentConsumer turns oros.order.placed
  # (OrderType OTHER + TM-MON order-code prefix) into DRAFT monitoring plans —
  # a silent listener would silently break the §14.2 enrolment spine.
  telemonitoring-service:
    env:
      SPRING_KAFKA_LISTENER_AUTO_STARTUP: "true"
  # TM-B17: Rito consumes clinical.teleconsult.lifecycle (verified interactions → feedback loop);
  # analytics-pipeline consumes the same stream ("§24 metrics from events only").
  rito-quality-safety-service:
    env:
      SPRING_KAFKA_LISTENER_AUTO_STARTUP: "true"
  # BUTANO is the shared health record, and every one of its consumers is an ingestion path:
  # impilo.identity.subject creates the FHIR Patients everything else references,
  # platform.consent.events applies revocations, the pacs.* topics archive imaging, and
  # pct.observation.recorded archives clinical observations. With auto-startup off none of them
  # ran, so the SHR held one Patient and nothing else — a shared record that had never been
  # written to. Rollback = remove the env line.
  butano-service:
    env:
      SPRING_KAFKA_LISTENER_AUTO_STARTUP: "true"
  # brief.md Wave 1 item 1: clinical-knowledge-platform-service's outbox relay
  # (ClinicalKafkaConfig / ClinicalKafkaOutboxRelay) is @ConditionalOnProperty on
  # impilo.clinical.kafka.relay-enabled, which defaults false — so §9 multimorbidity
  # DetectedIssue findings sat in clinical.event_outbox and never reached the
  # impilo.clinical.multimorbidity.issue.detected topic butano-service listens on above.
  # Proven against a real embedded broker in ClinicalKafkaOutboxRelayIT before this line
  # was added. Rollback = remove the env line (rows keep accumulating in the outbox either
  # way — nothing is lost by rolling back).
  clinical-knowledge-platform-service:
    env:
      CLINICAL_KAFKA_RELAY_ENABLED: "true"
  analytics-pipeline-service:
    env:
      SPRING_KAFKA_LISTENER_AUTO_STARTUP: "true"
  pacs-adapter-service:
    env:
      SPRING_KAFKA_LISTENER_AUTO_STARTUP: "true"
  costing-engine-service:
    env:
      SPRING_KAFKA_LISTENER_AUTO_STARTUP: "true"
      MUSHEX_BASE_URL: http://mushex-service:8102
      COVERAGE_BASE_URL: http://coverage-service:8140
  mushex-service:
    env:
      SPRING_KAFKA_LISTENER_AUTO_STARTUP: "true"
      # Intent creation verifies payee credentials — default pointed at localhost.
      CREDENTIAL_BASE_URL: http://credential-verification-service:8094
      CREDENTIAL_VERIFICATION_BASE_URL: http://credential-verification-service:8094
  coverage-service:
    env:
      SPRING_KAFKA_LISTENER_AUTO_STARTUP: "true"
  inventory-service:
    env:
      SPRING_KAFKA_LISTENER_AUTO_STARTUP: "true"
  pharmacy-service:
    env:
      SPRING_KAFKA_LISTENER_AUTO_STARTUP: "true"
      # OF-B M3 CFG-2: OrosIntegration @Value default
      # pharmacy.integration.oros.base-url is localhost:8089 — without this the
      # §13.3.1 claim bind-episode / §9.2 claim release / M3 lazy external-refs
      # re-fetch can never reach OROS.
      PHARMACY_INTEGRATION_OROS_BASEURL: "http://oros-service:8089"
  learning-service:
    env:
      SPRING_KAFKA_LISTENER_AUTO_STARTUP: "true"
      # ⑤ Fundo notification flip: dispatch through the real notification-service
      # instead of the default STUB provider.
      LEARNING_NOTIFICATION_PROVIDER: NOTIFICATION_SERVICE
      LEARNING_NOTIFICATION_BASE_URL: http://notification-service:8200
      LEARNING_NOTIFICATION_DISPATCH_POLL_MS: "30000"
      # LEARNING_LIVE: schedule Fundo webinars on the in-chart Impilo Live —
      # the localhost default silently no-ops LiveSessionIntegration.
      LEARNING_LIVE_BASE_URL: http://live-service:8380
  varapi-service:
    env:
      # CPD writeback: consume impilo.learning.certificate.issued.v1.
      SPRING_KAFKA_LISTENER_AUTO_STARTUP: "true"
  document-service:
    env:
      # Artifact SoR must reach the in-chart MinIO — the localhost default
      # broke recording adoption (register-external) and any real storage IO.
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: impilo-preview
    secretEnv:
      MINIO_SECRET_KEY:
        name: impilo-app-secrets
        key: minio-root-password
  rtc-gateway-service:
    env:
      # Recording lifecycle: template-driven policy gates in RtcRecordingService
      # (rtc.gateway.recording-enabled / egress-enabled stay false by default;
      # preview opts in). S3 secret comes from Secret impilo-app-secrets
      # (minio-root-password); LiveKit egress carries the request-level S3 target.
      RTC_RECORDING_ENABLED: "true"
      RTC_EGRESS_ENABLED: "true"
      RTC_RECORDING_S3_ACCESS_KEY: "impilo-preview"
      RTC_RECORDING_S3_ENDPOINT: "http://minio:9000"
      RTC_RECORDING_BUCKET: "impilo-recordings"
    secretEnv:
      RTC_RECORDING_S3_SECRET_KEY:
        name: impilo-app-secrets
        key: minio-root-password
  live-service:
    env:
      # Real media sessions: without this the LocalDevMediaProvider mints
      # dev tokens and no rtc room ever exists (classroom joins were theatre).
      LIVE_MEDIA_PROVIDER: rtc-gateway
      RTC_GATEWAY_BASE_URL: http://rtc-gateway-service:8196
      DOCUMENT_SERVICE_BASE_URL: http://document-service:8093
      NOTIFICATION_BASE_URL: http://notification-service:8200
      # RTC media truth: consume impilo.rtc.session/participant events so the LiveKit
      # room lifecycle drives live-event state (SCHEDULED→LIVE→ENDED) + attendance.
      SPRING_KAFKA_LISTENER_AUTO_STARTUP: "true"
  khuluma-service:
    env:
      # RTC media truth: consume impilo.rtc.* events so call participant state and
      # call end follow the actual media room (khuluma_call_events audit + ACTIVE→ENDED).
      SPRING_KAFKA_LISTENER_AUTO_STARTUP: "true"
      # W5 MEETING invite links: stable HMAC secret so links survive pod restarts.
      # Preview-only value — production must source this from a real secret store.
      KHULUMA_MEETING_INVITE_SECRET: "preview-khuluma-meeting-invite-secret-2026"
      # W5 MEETING media: khuluma schedules the meeting's live event and drives the
      # rtc lobby — localhost defaults would silently degrade meetings to no-media.
      LIVE_BASE_URL: http://live-service:8380
      RTC_GATEWAY_BASE_URL: http://rtc-gateway-service:8196
  # ABIS — biometric template SoR + adjudication platform (port 8186, DB `abis`).
  # Hand-registered here because abis-service is NOT in
  # config/full-boot-service-classification.yml, so the generator never emits it into
  # values-full-preview-runtime.generated.yaml. Deep-merges cleanly with the generated
  # overlay (no abis-service key there to collide). Governance adapter over the
  # chart-deployed core-infra matcher-engine (templates/matcher-engine.yaml) — the same
  # pattern as pacs-adapter-service → Orthanc. Its `abis` database is created via
  # postgres.extraInitDatabases above.
  abis-service:
    enabled: true
    port: 8186
    database: abis
    env:
      # Real matching delegated to the core-infra engine (BmeClientMatchingEngine is
      # @Primary when true). Any transport/protocol error fails closed — never a
      # fabricated match, never a merge.
      ABIS_MATCHER_ENABLED: "true"
      MATCHER_ENGINE_URL: http://matcher-engine:9200
      # Enrol-time dedup (W3b): bounded 1:N against the tenant gallery on enrol;
      # candidates >= threshold OPEN a duplicate-investigation case (never auto-merge).
      ABIS_DEDUP_ENABLED: "true"
      ABIS_DEDUP_THRESHOLD: "0.85"
    resources:
      requests:
        cpu: 150m
        memory: 512Mi
      limits:
        cpu: "1"
        memory: 1Gi
