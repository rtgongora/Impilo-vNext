global:
  environment: preview
  publicHost: "impilo.mohcc.gov.zw"

images:
  experienceBff:
    repository: impilo/experience-bff
    tag: preview
    pullPolicy: IfNotPresent
  oneUiShell:
    repository: impilo/one-ui-shell
    tag: preview
    pullPolicy: IfNotPresent

ingress:
  enabled: true
  className: traefik
  # Where the BFF lane (/internal, /actuator, /health) terminates. Defaults to the BFF directly,
  # which is the pre-Checkpoint-4 topology. Set to envoy/10000 to put the edge PEP on the path
  # (Stage 1: header stripping, no PDP gate -- see checkpoint-4/INGRESS_STAGE1.md).
  bffService: experience-bff
  bffPort: 8160

redis:
  enabled: true
  image: redis:7-alpine

postgres:
  enabled: true
  image: postgres:16-alpine
  username: impilo
  database: impilo
  password: preview-change-me

keycloak:
  enabled: false
  image:
    repository: 127.0.0.1:5000/impilo/keycloak
    tag: "26.7.0"
    digest: ""
    pullPolicy: IfNotPresent
  hostname: ""
  database:
    vendor: postgres
    host: postgres
    port: 5432
    name: keycloak
    credentialsSecret: impilo-app-secrets
    usernameKey: keycloak-db-user
    passwordKey: keycloak-db-password
  legacyH2:
    preservePvc: false
    storageSize: 2Gi
  realmImport:
    enabled: false
  smtp:
    enabled: false
    credentialsSecret: impilo-app-secrets
    hostKey: keycloak-smtp-host
    portKey: keycloak-smtp-port
    usernameKey: keycloak-smtp-username
    passwordKey: keycloak-smtp-password
    fromKey: keycloak-smtp-from

# OPA policy evaluator for the Tshepo strangler (Checkpoint 4). Deployed in SHADOW only:
# tshepo-authz compares OPA's verdict to the Java PolicyEngine and logs divergence. OPA cannot
# become authoritative by deploying it — tshepo-authz refuses to start in ENFORCE without cited
# parity evidence (OpaEnforceGate).
opa:
  enabled: false
  image:
    # mirror.gcr.io, not docker.io: this cluster cannot reach registry-1.docker.io (the first
    # deploy attempt died in ImagePullBackOff on an i/o timeout). Every other third-party image
    # in the estate — curl, livekit, orthanc — already comes through the same mirror.
    # Digest-pinned so the deployed evaluator is immutable and traceable.
    repository: mirror.gcr.io/openpolicyagent/opa
    tag: "0.68.0"
    digest: "sha256:dd4cb51598c79825fc7e006a0317777f3a0f8eda3fdcaad997d75337fa7e739d"
    pullPolicy: IfNotPresent
  # Built from infra/opa/authz/*.rego by scripts/deploy/apply-opa-shadow.sh, never hand-edited.
  policyConfigMap: opa-authz-policy
  # Set by the deploy script to the corpus checksum, so a policy change rolls the pod.
  policyChecksum: ""
  decisionLogs: false
  logLevel: error
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { cpu: 500m, memory: 256Mi }

# Tshepo trust plane, Checkpoint 4 — per-workload identity.
#
# Two independent switches, deliberately separated:
#   createServiceAccounts  creates the identities. Additive: a ServiceAccount that no
#                          pod references changes nothing, so these land estate-wide
#                          with zero pod churn.
#   cohort                 the workloads whose pod spec actually uses its identity.
#                          Empty by default, so the rendered Deployment is byte-identical
#                          to the pre-Checkpoint-4 estate. Enforcement advances by adding
#                          names here, one cohort at a time, each with its own rollback.
workloadIdentity:
  createServiceAccounts: true
  cohort: []
  environment: preview
  cluster: k3s-impilo
  audiencePrefix: "urn:impilo:tshepo"
  # Short-lived by design; the kubelet rotates a projected token well before expiry.
  tokenExpirationSeconds: 3600
  tokenMountPath: /var/run/secrets/impilo/tshepo
  # Workloads rendered by their own template rather than the fullBootServices loop.
  additionalServiceAccounts:
    - experience-bff
    - one-ui-shell
    - envoy
    - matcher-engine
    - opa

experienceBff:
  enabled: true
  replicaCount: 1

oneUiShell:
  enabled: true
  replicaCount: 1

# Android-in-container runtime (preview infra); off in the minimal slice.
redroid:
  enabled: false
  image:
    repository: 127.0.0.1:5000/redroid/redroid
    tag: "13.0.0"
  resources:
    requests: { cpu: "2", memory: 3Gi }
    limits: { cpu: "4", memory: 6Gi }

# Continuous health watch (see templates/estate-health-watch.yaml); off in the minimal slice.
estateHealthWatch:
  enabled: false
  schedule: "*/10 * * * *"
  requiredEndpoints: [keycloak]
  image:
    repository: mirror.gcr.io/curlimages/curl
    tag: "8.11.1"
  webhookUrlSecret: null
