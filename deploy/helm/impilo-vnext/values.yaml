global:
  environment: preview
  publicHost: "impilo.mohcc.gov.zw"

images:
  experienceBff:
    repository: impilo/experience-bff
    tag: preview
    pullPolicy: IfNotPresent
  oneUiShell:
    repository: impilo/one-ui-shell
    tag: preview
    pullPolicy: IfNotPresent

ingress:
  enabled: true
  className: traefik

redis:
  enabled: true
  image: redis:7-alpine

postgres:
  enabled: true
  image: postgres:16-alpine
  username: impilo
  database: impilo
  password: preview-change-me

keycloak:
  enabled: false

experienceBff:
  enabled: true
  replicaCount: 1

oneUiShell:
  enabled: true
  replicaCount: 1

# Android-in-container runtime (preview infra); off in the minimal slice.
redroid:
  enabled: false
  image:
    repository: 127.0.0.1:5000/redroid/redroid
    tag: "13.0.0"
  resources:
    requests: { cpu: "2", memory: 3Gi }
    limits: { cpu: "4", memory: 6Gi }
