{{- if .Values.oneUiShell.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: one-ui-shell
  namespace: {{ .Release.Namespace }}
spec:
  # Public front door: zero-downtime rollout (see experience-bff.yaml). RollingUpdate
  # maxUnavailable=0 keeps the old shell serving until the new one is Ready. This is the
  # page citizens land on at impilo.mohcc.gov.zw, so it does NOT use the estate-wide
  # global.deploymentStrategy=Recreate.
  strategy:
    type: {{ .Values.oneUiShell.deploymentStrategy | default "RollingUpdate" }}
    {{- if eq (.Values.oneUiShell.deploymentStrategy | default "RollingUpdate") "RollingUpdate" }}
    rollingUpdate:
      maxSurge: {{ .Values.oneUiShell.maxSurge | default 1 }}
      maxUnavailable: {{ .Values.oneUiShell.maxUnavailable | default 0 }}
    {{- end }}
  replicas: {{ .Values.oneUiShell.replicaCount }}
  selector:
    matchLabels:
      app: one-ui-shell
  template:
    metadata:
      labels:
        app: one-ui-shell
    spec:
      containers:
        - name: one-ui-shell
          {{- $shellImg := .Values.images.oneUiShell }}
          {{- if and $shellImg.digest (hasPrefix "sha256:" $shellImg.digest) }}
          image: "{{ $shellImg.repository }}@{{ $shellImg.digest }}"
          {{- else }}
          image: "{{ $shellImg.repository }}:{{ $shellImg.tag }}"
          {{- end }}
          imagePullPolicy: {{ $shellImg.pullPolicy }}
          ports:
            - containerPort: 3000
          env:
            - name: NEXT_PUBLIC_IMPILO_ENV
              value: {{ .Values.global.environment | quote }}
            - name: NEXT_PUBLIC_GIT_BRANCH
              value: {{ .Values.global.gitBranch | default "" | quote }}
            - name: NEXT_PUBLIC_GIT_COMMIT
              value: {{ .Values.global.shellGitCommit | default .Values.global.gitCommit | default "" | quote }}
            - name: NEXT_PUBLIC_BUILD_DATE
              value: {{ .Values.global.buildDate | default "" | quote }}
            {{- range $k, $v := omit .Values.oneUiShell.env "NEXT_PUBLIC_IMPILO_ENV" }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: one-ui-shell
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    app: one-ui-shell
  ports:
    - port: 3000
      targetPort: 3000
{{- end }}
