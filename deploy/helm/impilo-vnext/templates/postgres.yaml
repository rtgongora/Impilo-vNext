{{- if .Values.postgres.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
  namespace: {{ .Release.Namespace }}
type: Opaque
stringData:
  POSTGRES_PASSWORD: {{ .Values.postgres.password | quote }}
  POSTGRES_USER: {{ .Values.postgres.username | quote }}
  POSTGRES_DB: {{ .Values.postgres.database | quote }}
---
# Durable data volume (2026-07-18): postgres previously ran on emptyDir, so ANY pod
# restart erased every database in the estate (it happened — twice). local-path PVC
# (cluster default StorageClass), same pattern as ndila-martin-data.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
  namespace: {{ .Release.Namespace }}
  annotations:
    # Survives 'helm uninstall' — data volumes are only destroyed by the explicit
    # FULL_BOOT_WIPE_DATA=1 namespace wipe (see scripts/operator/fullboot.sh).
    "helm.sh/resource-policy": keep
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: {{ .Values.postgres.storageSize | default "50Gi" }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: {{ .Release.Namespace }}
spec:
  strategy:
    type: {{ .Values.global.deploymentStrategy | default "Recreate" }}
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: {{ .Values.postgres.image }}
          {{- if or .Values.postgres.maxConnections .Values.postgres.sharedBuffers }}
          args:
            {{- if .Values.postgres.maxConnections }}
            - -c
            - max_connections={{ .Values.postgres.maxConnections }}
            {{- end }}
            {{- if .Values.postgres.sharedBuffers }}
            - -c
            - shared_buffers={{ .Values.postgres.sharedBuffers }}
            {{- end }}
          {{- end }}
          envFrom:
            - secretRef:
                name: postgres-credentials
          ports:
            - containerPort: 5432
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "{{ .Values.postgres.username }}"]
            initialDelaySeconds: 10
            periodSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            {{- if .Values.postgres.initDatabases }}
            - name: init-scripts
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
            {{- end }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: postgres-data
        {{- if .Values.postgres.initDatabases }}
        - name: init-scripts
          configMap:
            name: postgres-init-databases
        {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
{{- end }}
