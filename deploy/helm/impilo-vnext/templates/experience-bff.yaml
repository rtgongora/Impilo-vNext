{{- if .Values.experienceBff.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: experience-bff
  namespace: {{ .Release.Namespace }}
spec:
  strategy:
    type: {{ .Values.global.deploymentStrategy | default "Recreate" }}
  replicas: {{ .Values.experienceBff.replicaCount }}
  selector:
    matchLabels:
      app: experience-bff
  template:
    metadata:
      labels:
        app: experience-bff
    spec:
      enableServiceLinks: false
      containers:
        - name: experience-bff
          {{- $bffImg := .Values.images.experienceBff }}
          {{- if and $bffImg.digest (hasPrefix "sha256:" $bffImg.digest) }}
          image: "{{ $bffImg.repository }}@{{ $bffImg.digest }}"
          {{- else }}
          image: "{{ $bffImg.repository }}:{{ $bffImg.tag }}"
          {{- end }}
          imagePullPolicy: {{ $bffImg.pullPolicy }}
          ports:
            - containerPort: 8160
          env:
            - name: IMPILO_ENV
              value: {{ .Values.global.environment | quote }}
            {{- if .Values.global.gitBranch }}
            - name: IMPILO_GIT_BRANCH
              value: {{ .Values.global.gitBranch | quote }}
            {{- end }}
            {{- $bffCommit := .Values.global.bffGitCommit | default .Values.global.gitCommit }}
            {{- if $bffCommit }}
            - name: IMPILO_GIT_COMMIT
              value: {{ $bffCommit | quote }}
            - name: IMPILO_BFF_GIT_COMMIT
              value: {{ $bffCommit | quote }}
            {{- end }}
            {{- if .Values.global.buildDate }}
            - name: IMPILO_BUILD_DATE
              value: {{ .Values.global.buildDate | quote }}
            {{- end }}
            {{- if .Values.global.deploymentMode }}
            - name: IMPILO_DEPLOYMENT_MODE
              value: {{ .Values.global.deploymentMode | quote }}
            {{- end }}
            {{- if .Values.global.shellGitCommit }}
            - name: IMPILO_SHELL_GIT_COMMIT
              value: {{ .Values.global.shellGitCommit | quote }}
            {{- end }}
            {{- if .Values.global.fullEstateCommit }}
            - name: IMPILO_FULL_ESTATE_COMMIT
              value: {{ .Values.global.fullEstateCommit | quote }}
            {{- end }}
            {{- if .Values.global.fullEstateCertifiedCommit }}
            - name: IMPILO_FULL_ESTATE_CERTIFIED_COMMIT
              value: {{ .Values.global.fullEstateCertifiedCommit | quote }}
            {{- end }}
            {{- if .Values.global.helmRelease }}
            - name: IMPILO_HELM_RELEASE
              value: {{ .Values.global.helmRelease | quote }}
            {{- end }}
            {{- if .Values.global.helmRevision }}
            - name: IMPILO_HELM_REVISION
              value: {{ .Values.global.helmRevision | quote }}
            {{- end }}
            {{- if .Values.global.versionGeneratedAt }}
            - name: IMPILO_VERSION_GENERATED_AT
              value: {{ .Values.global.versionGeneratedAt | quote }}
            {{- end }}
            {{- if .Values.global.imageDigestsJson }}
            - name: IMPILO_IMAGE_DIGESTS_JSON
              value: {{ .Values.global.imageDigestsJson | quote }}
            {{- end }}
            {{- range $k, $v := .Values.experienceBff.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8160
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8160
            initialDelaySeconds: 60
            periodSeconds: 20
            failureThreshold: 6
---
apiVersion: v1
kind: Service
metadata:
  name: experience-bff
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    app: experience-bff
  ports:
    - port: 8160
      targetPort: 8160
{{- end }}
