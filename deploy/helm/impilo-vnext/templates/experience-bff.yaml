{{- if .Values.experienceBff.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: experience-bff
  namespace: {{ .Release.Namespace }}
spec:
  strategy:
    type: {{ .Values.global.deploymentStrategy | default "Recreate" }}
  replicas: {{ .Values.experienceBff.replicaCount }}
  selector:
    matchLabels:
      app: experience-bff
  template:
    metadata:
      labels:
        app: experience-bff
    spec:
      enableServiceLinks: false
      containers:
        - name: experience-bff
          {{- $bffImg := .Values.images.experienceBff }}
          {{- if and $bffImg.digest (hasPrefix "sha256:" $bffImg.digest) }}
          image: "{{ $bffImg.repository }}@{{ $bffImg.digest }}"
          {{- else }}
          image: "{{ $bffImg.repository }}:{{ $bffImg.tag }}"
          {{- end }}
          imagePullPolicy: {{ $bffImg.pullPolicy }}
          ports:
            - containerPort: 8160
          env:
            - name: IMPILO_ENV
              value: {{ .Values.global.environment | quote }}
            {{- /* Only override the image-baked provenance when explicitly provided, so an
                   empty Helm value never blanks out the commit/branch baked into the image. */}}
            {{- if .Values.global.gitBranch }}
            - name: IMPILO_GIT_BRANCH
              value: {{ .Values.global.gitBranch | quote }}
            {{- end }}
            {{- if .Values.global.gitCommit }}
            - name: IMPILO_GIT_COMMIT
              value: {{ .Values.global.gitCommit | quote }}
            {{- end }}
            {{- if .Values.global.buildDate }}
            - name: IMPILO_BUILD_DATE
              value: {{ .Values.global.buildDate | quote }}
            {{- end }}
            {{- range $k, $v := .Values.experienceBff.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8160
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8160
            initialDelaySeconds: 60
            periodSeconds: 20
            failureThreshold: 6
---
apiVersion: v1
kind: Service
metadata:
  name: experience-bff
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    app: experience-bff
  ports:
    - port: 8160
      targetPort: 8160
{{- end }}
