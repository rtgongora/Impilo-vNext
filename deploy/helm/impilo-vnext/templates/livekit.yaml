{{- if .Values.livekit.enabled }}
# LiveKit SFU — preview video backend for rtc-gateway-service.
# Preview-scoped: dev API key/secret committed in values (never production key
# management), single node, ephemeral state. Browser media requires the VM
# firewall to allow 7880/7881 TCP + 7882/UDP (signal ws + ICE-TCP + ICE-UDP).
# Runs on the HOST network: ICE then advertises the node's real interfaces
# (LAN clients connect directly) plus the STUN-discovered public IP
# (use_external_ip) for internet clients behind the router NAT. The previous
# CNI+hostPort setup pushed RTP through conntrack DNAT, which dropped sustained
# UDP flows (PEER_CONNECTION_DISCONNECTED ~20s after join).
# Server config lives in livekit-config.yaml (hashed below for pod rolls).
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: livekit
  namespace: {{ .Release.Namespace }}
spec:
  strategy:
    type: {{ .Values.global.deploymentStrategy | default "Recreate" }}
  replicas: 1
  selector:
    matchLabels:
      app: livekit
  template:
    metadata:
      labels:
        app: livekit
      annotations:
        # Roll the pod when the ConfigMap changes — livekit reads config at
        # startup only, and a data-only change never restarts the pod.
        checksum/config: {{ include (print $.Template.BasePath "/livekit-config.yaml") . | sha256sum }}
    spec:
      # The Service named "livekit" injects LIVEKIT_PORT=tcp://... service-link
      # env, which livekit-server parses as its --port flag and crashes.
      enableServiceLinks: false
      # Host network: WebRTC media must not traverse CNI/hostPort conntrack
      # DNAT (it destabilizes sustained UDP flows and breaks ICE candidates).
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      containers:
        - name: livekit
          image: "{{ .Values.livekit.image.repository }}:{{ .Values.livekit.image.tag }}"
          imagePullPolicy: {{ .Values.livekit.image.pullPolicy }}
          args: ["--config", "/etc/livekit/livekit.yaml"]
          env:
            # API keys injected out-of-band (never committed). Format "key: secret".
            - name: LIVEKIT_KEYS
              valueFrom:
                secretKeyRef:
                  name: impilo-app-secrets
                  key: livekit-keys
          ports:
            - containerPort: 7880
              protocol: TCP
            - containerPort: 7881
              protocol: TCP
            - containerPort: 7882
              protocol: UDP
          volumeMounts:
            - name: livekit-config
              mountPath: /etc/livekit/livekit.yaml
              subPath: livekit.yaml
          readinessProbe:
            httpGet:
              path: /
              port: 7880
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 7880
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            {{- toYaml .Values.livekit.resources | nindent 12 }}
      volumes:
        - name: livekit-config
          configMap:
            name: livekit-config
---
apiVersion: v1
kind: Service
metadata:
  name: livekit
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    app: livekit
  ports:
    - name: http
      port: 7880
      targetPort: 7880
{{- end }}
