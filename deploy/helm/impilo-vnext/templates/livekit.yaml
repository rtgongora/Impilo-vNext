{{- if .Values.livekit.enabled }}
# LiveKit SFU — preview video backend for rtc-gateway-service.
# Preview-scoped: dev API key/secret committed in values (never production key
# management), single node, ephemeral state. Browser media requires the VM
# firewall to allow 7880/7881 TCP + 7882/UDP (signal ws + ICE-TCP + ICE-UDP).
# Runs on the HOST network: ICE then advertises the node's real interfaces
# (LAN clients connect directly) plus the STUN-discovered public IP
# (use_external_ip) for internet clients behind the router NAT. The previous
# CNI+hostPort setup pushed RTP through conntrack DNAT, which dropped sustained
# UDP flows (PEER_CONNECTION_DISCONNECTED ~20s after join).
# Server config lives in livekit-config.yaml (hashed below for pod rolls).
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: livekit
  namespace: {{ .Release.Namespace }}
spec:
  strategy:
    type: {{ .Values.global.deploymentStrategy | default "Recreate" }}
  replicas: 1
  selector:
    matchLabels:
      app: livekit
  template:
    metadata:
      labels:
        app: livekit
      annotations:
        # Roll the pod when the ConfigMap changes — livekit reads config at
        # startup only, and a data-only change never restarts the pod.
        checksum/config: {{ include (print $.Template.BasePath "/livekit-config.yaml") . | sha256sum }}
    spec:
      # The Service named "livekit" injects LIVEKIT_PORT=tcp://... service-link
      # env, which livekit-server parses as its --port flag and crashes.
      enableServiceLinks: false
      # Host network: WebRTC media must not traverse CNI/hostPort conntrack
      # DNAT (it destabilizes sustained UDP flows and breaks ICE candidates).
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      containers:
        - name: livekit
          image: "{{ .Values.livekit.image.repository }}:{{ .Values.livekit.image.tag }}"
          imagePullPolicy: {{ .Values.livekit.image.pullPolicy }}
          args: ["--config", "/etc/livekit/livekit.yaml"]
          env:
            # API keys injected out-of-band (never committed). Format "key: secret".
            - name: LIVEKIT_KEYS
              valueFrom:
                secretKeyRef:
                  name: impilo-app-secrets
                  key: livekit-keys
          ports:
            - containerPort: 7880
              protocol: TCP
            - containerPort: 7881
              protocol: TCP
            - containerPort: 7882
              protocol: UDP
            # TURN-over-TLS. hostNetwork makes the host listener authoritative;
            # this entry is documentation of the port the process opens.
            - containerPort: 5349
              protocol: TCP
          volumeMounts:
            - name: livekit-config
              mountPath: /etc/livekit/livekit.yaml
              subPath: livekit.yaml
            # TURN-TLS cert/key for the embedded TURN server. Read-only; the
            # Secret's own tls.crt/tls.key land at /etc/livekit/tls/{tls.crt,tls.key}
            # (the paths referenced by turn.cert_file / turn.key_file).
            - name: livekit-tls
              mountPath: /etc/livekit/tls
              readOnly: true
          readinessProbe:
            httpGet:
              path: /
              port: 7880
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 7880
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            {{- toYaml .Values.livekit.resources | nindent 12 }}
      volumes:
        - name: livekit-config
          configMap:
            name: livekit-config
        # Existing Let's Encrypt cert for impilo.mohcc.gov.zw (the same Secret
        # Traefik serves for signaling). Mounted so the embedded TURN server can
        # terminate TURN-TLS. defaultMode 0400 keeps tls.key non-world-readable;
        # the LiveKit process runs as root (uid 0) so it reads the 0400 files
        # without needing an fsGroup. Private-key material is never copied into
        # the ConfigMap, image, or repo — it stays in the Secret.
        - name: livekit-tls
          secret:
            secretName: impilo-mohcc-gov-zw-tls
            defaultMode: 0400
---
apiVersion: v1
kind: Service
metadata:
  name: livekit
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    app: livekit
  ports:
    - name: http
      port: 7880
      targetPort: 7880
    # TURN-over-TLS backend for the Traefik HostSNI(turn.impilo.mohcc.gov.zw)
    # TLS-passthrough route (deploy/tls/mohcc-gov/livekit-turn-ingressroutetcp.yaml).
    # hostNetwork means the endpoint is the node IP:5349 (LiveKit binds *:5349).
    - name: turn-tls
      port: 5349
      targetPort: 5349
      protocol: TCP
{{- end }}
