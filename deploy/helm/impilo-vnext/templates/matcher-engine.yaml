{{- if .Values.matcherEngine.enabled }}
# Biometric Matching Engine — core-infra compute appliance (like Orthanc/LiveKit).
# Stateless: ABIS holds encrypted templates and supplies them per request, so there
# is no PVC. Reached only by the abis-service adapter via MATCHER_ENGINE_URL.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: matcher-engine
  namespace: {{ .Release.Namespace }}
spec:
  strategy:
    type: {{ .Values.global.deploymentStrategy | default "Recreate" }}
  replicas: {{ .Values.matcherEngine.replicaCount | default 1 }}
  selector:
    matchLabels:
      app: matcher-engine
  template:
    metadata:
      labels:
        app: matcher-engine
    spec:
      containers:
        - name: matcher-engine
          image: "{{ .Values.matcherEngine.image.repository | default (printf "%s/impilo/matcher-engine" .Values.global.imageRegistry) }}:{{ .Values.matcherEngine.image.tag | default "preview" }}"
          imagePullPolicy: {{ .Values.matcherEngine.image.pullPolicy | default "IfNotPresent" }}
          ports:
            - containerPort: 9200
          env:
            {{- range $k, $v := .Values.matcherEngine.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 9200
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 9200
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            {{- toYaml .Values.matcherEngine.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: matcher-engine
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    app: matcher-engine
  ports:
    - name: http
      port: 9200
      targetPort: 9200
{{- end }}
