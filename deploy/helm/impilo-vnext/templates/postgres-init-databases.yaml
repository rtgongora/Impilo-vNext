{{- /* Merge the generated per-service DB list with hand-registered extraInitDatabases
       (services not in the classification generator, e.g. abis-service). uniq guards
       against overlap. */}}
{{- $allInitDatabases := concat (.Values.postgres.initDatabases | default list) (.Values.postgres.extraInitDatabases | default list) | uniq }}
{{- if and .Values.postgres.enabled $allInitDatabases }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init-databases
  namespace: {{ .Release.Namespace }}
data:
  01-create-preview-databases.sql: |
    -- Preview-only: idempotent database creation (first empty postgres data dir).
    {{- $owner := .Values.postgres.username | default "impilo" }}
    {{- range $allInitDatabases }}
    SELECT 'CREATE DATABASE {{ . }} OWNER {{ $owner }}' WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = '{{ . }}')\gexec
    {{- end }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: postgres-init-databases
  namespace: {{ .Release.Namespace }}
  annotations:
    # pre-upgrade, NOT post-upgrade: with `helm --wait`, a post-upgrade hook can
    # never run before newly-added services need their databases to become
    # ready — deadlock until the wait times out. First install is covered by
    # postgres initdb (this configmap seeds the empty data dir), so post-install
    # remains only as a safety net there.
    helm.sh/hook: post-install,pre-upgrade
    helm.sh/hook-weight: "10"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  activeDeadlineSeconds: 3600
  ttlSecondsAfterFinished: 300
  backoffLimit: 8
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: init-databases
          image: {{ .Values.postgres.image }}
          command: ["/bin/sh", "-ec"]
          args:
            - |
              set -e
              export PGHOST="${PGHOST:-postgres}"
              export PGPORT="${PGPORT:-5432}"
              export PGUSER="${POSTGRES_USER}"
              export PGPASSWORD="${POSTGRES_PASSWORD}"
              until pg_isready -h "$PGHOST" -p "$PGPORT" -U "$PGUSER"; do
                echo "waiting for postgres at $PGHOST:$PGPORT..."
                sleep 3
              done
              PGOWNER="${POSTGRES_USER:-impilo}"
              {{- range $allInitDatabases }}
              exists=$(psql -h "$PGHOST" -p "$PGPORT" -U "$PGUSER" -d postgres -tAc "SELECT 1 FROM pg_database WHERE datname='{{ . }}'" 2>/dev/null || echo "")
              if [ "$exists" = "1" ]; then
                echo "Database {{ . }} already exists."
              else
                echo "Creating database {{ . }} (owner=$PGOWNER)..."
                psql -h "$PGHOST" -p "$PGPORT" -U "$PGUSER" -d postgres -v ON_ERROR_STOP=1 -c "CREATE DATABASE {{ . }} OWNER \"$PGOWNER\";"
              fi
              echo "Ensuring owner and pg_trgm in database {{ . }}..."
              psql -h "$PGHOST" -p "$PGPORT" -U "$PGUSER" -d postgres -v ON_ERROR_STOP=1 -c "ALTER DATABASE {{ . }} OWNER TO \"$PGOWNER\";"
              psql -h "$PGHOST" -p "$PGPORT" -U "$PGUSER" -d {{ . }} -v ON_ERROR_STOP=1 -c "CREATE EXTENSION IF NOT EXISTS pg_trgm;"
              {{- end }}
              echo "postgres init-databases complete"
          env:
            - name: PGHOST
              value: postgres
            - name: PGPORT
              value: "5432"
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_PASSWORD
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_PASSWORD
{{- end }}
