{{- if and .Values.postgres.enabled .Values.postgres.initDatabases }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init-databases
  namespace: {{ .Release.Namespace }}
data:
  01-create-preview-databases.sql: |
    -- Preview-only: idempotent database creation for full boot (runs on first empty data dir).
    {{- range .Values.postgres.initDatabases }}
    DO $$
    BEGIN
      IF NOT EXISTS (SELECT FROM pg_database WHERE datname = '{{ . }}') THEN
        CREATE DATABASE {{ . }};
      END IF;
    END
    $$;
    {{- end }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: postgres-init-databases
  namespace: {{ .Release.Namespace }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "10"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  ttlSecondsAfterFinished: 300
  backoffLimit: 6
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: init-databases
          image: {{ .Values.postgres.image }}
          command: ["/bin/sh", "-ec"]
          args:
            - |
              until pg_isready -h postgres -U "$POSTGRES_USER"; do
                echo "waiting for postgres..."
                sleep 3
              done
              {{- range .Values.postgres.initDatabases }}
              exists=$(psql -h postgres -U "$POSTGRES_USER" -d postgres -tAc "SELECT 1 FROM pg_database WHERE datname='{{ . }}'" || echo "")
              if [ "$exists" != "1" ]; then
                echo "Creating database {{ . }}..."
                psql -h postgres -U "$POSTGRES_USER" -d postgres -c "CREATE DATABASE {{ . }};"
              else
                echo "Database {{ . }} already exists."
              fi
              {{- end }}
              echo "postgres init-databases complete"
          envFrom:
            - secretRef:
                name: postgres-credentials
{{- end }}
