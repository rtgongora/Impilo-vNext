{{- if .Values.livekit.enabled }}
# LiveKit server config — separate template so the Deployment can hash it
# (checksum/config) and roll the pod on config-only changes; livekit reads
# config at startup only.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: livekit-config
  namespace: {{ .Release.Namespace }}
data:
  livekit.yaml: |
    port: 7880
    bind_addresses:
      - ""
    # API keys are NOT inlined here — injected at runtime via the LIVEKIT_KEYS env
    # from Secret impilo-app-secrets (key livekit-keys), so the signing secret is
    # never committed. See docs/security/secrets-management-migration-plan.md (P2).
    # Redis is REQUIRED for egress coordination: livekit-server dispatches
    # StartEgress requests to egress workers over the shared redis bus.
    redis:
      address: redis:6379
    rtc:
      tcp_port: 7881
      udp_port: 7882
      # Public-internet media (2026-07-20): advertise BOTH the STUN-discovered
      # public IP (41.57.127.235, for off-network clients) AND the node's private
      # interfaces (hospital-LAN clients) so neither audience is starved of a
      # usable ICE candidate. skip_external_ip_validation bypasses LiveKit's
      # external-IP self-hairpin check, which the upstream 1:1 NAT does not
      # support — without it the discovered public IP is dropped as "unvalidated"
      # (empirically observed). Keeps the existing 7881/TCP + 7882/UDP direct
      # ports unchanged; no UDP media range is introduced.
      use_external_ip: true
      advertise_internal_ip: true
      skip_external_ip_validation: true
    # Embedded TURN-over-TLS relay (2026-07-20): off-network clients whose network
    # blocks direct ICE (UDP/TCP) fall back to TURN/TLS on 5349 (looks like HTTPS
    # → firewall-friendly). LiveKit terminates TURN-TLS itself with the mounted
    # impilo.mohcc.gov.zw cert (external_tls: false — TLS is NOT offloaded to
    # Traefik, which has no 5349 entrypoint). No turn.udp_port is set: this slice
    # is TURN over TLS on TCP 5349 only (no 5349/UDP, no 3478/UDP).
    # allow_restricted_peer_cidrs whitelists ONLY the host-network SFU
    # (10.50.1.67/32): LiveKit denies TURN relay to private/RFC1918 peer IPs by
    # default, which would block the relayed path to the SFU on the node's private
    # address; the /32 is the narrowest grant that restores it.
    turn:
      enabled: true
      domain: impilo.mohcc.gov.zw
      tls_port: 5349
      external_tls: false
      cert_file: /etc/livekit/tls/tls.crt
      key_file: /etc/livekit/tls/tls.key
      ttl_seconds: 300
      allow_restricted_peer_cidrs:
        - 10.50.1.67/32
    room:
      empty_timeout: 900
      max_participants: 8
    # Push room/participant/track/egress lifecycle events to rtc-gateway, which
    # verifies the HS256-signed webhook (api_key selects the signing key from
    # `keys` above) and translates events onto the impilo.rtc.* outbox.
    webhook:
      urls:
        - {{ .Values.livekit.webhookUrl | default "http://rtc-gateway-service:8196/internal/v1/rtc/webhooks/livekit" }}
      api_key: {{ .Values.livekit.apiKey }}
    logging:
      level: info
{{- end }}
