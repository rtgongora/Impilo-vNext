{{- if and .Values.postgres.enabled .Values.keycloak.enabled }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: keycloak-database-reconcile
  namespace: {{ .Release.Namespace }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "11"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  activeDeadlineSeconds: 900
  ttlSecondsAfterFinished: 300
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/name: keycloak-database-reconcile
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: reconcile
          image: {{ .Values.postgres.image }}
          command: ["/bin/sh", "-ec"]
          args:
            - |
              until pg_isready -h "$PGHOST" -p "$PGPORT" -U "$PGUSER"; do sleep 3; done
              case "$KEYCLOAK_DB_USER" in
                ''|*[!A-Za-z0-9_]* ) echo "invalid Keycloak database user" >&2; exit 1 ;;
              esac
              case "$KEYCLOAK_DB_NAME" in
                ''|*[!A-Za-z0-9_]* ) echo "invalid Keycloak database name" >&2; exit 1 ;;
              esac
              printf '%s\n' \
                "SELECT format('CREATE ROLE %I LOGIN PASSWORD %L', :'kc_user', :'kc_password') WHERE NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = :'kc_user') \\gexec" \
                "SELECT format('ALTER ROLE %I LOGIN PASSWORD %L', :'kc_user', :'kc_password') \\gexec" |
                psql -X -v ON_ERROR_STOP=1 -d postgres -v kc_user="$KEYCLOAK_DB_USER" -v kc_password="$KEYCLOAK_DB_PASSWORD"
              printf '%s\n' \
                "SELECT format('CREATE DATABASE %I OWNER %I', :'kc_db', :'kc_user') WHERE NOT EXISTS (SELECT 1 FROM pg_database WHERE datname = :'kc_db') \\gexec" |
                psql -X -v ON_ERROR_STOP=1 -d postgres -v kc_db="$KEYCLOAK_DB_NAME" -v kc_user="$KEYCLOAK_DB_USER"
              printf '%s\n' "SELECT format('ALTER DATABASE %I OWNER TO %I', :'kc_db', :'kc_user') \\gexec" |
                psql -X -v ON_ERROR_STOP=1 -d postgres -v kc_db="$KEYCLOAK_DB_NAME" -v kc_user="$KEYCLOAK_DB_USER"
              echo "Keycloak PostgreSQL database and owner are present"
          env:
            - name: PGHOST
              value: postgres
            - name: PGPORT
              value: "5432"
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_USER
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_PASSWORD
            - name: KEYCLOAK_DB_NAME
              value: {{ .Values.keycloak.database.name | quote }}
            - name: KEYCLOAK_DB_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.keycloak.database.credentialsSecret }}
                  key: {{ .Values.keycloak.database.usernameKey }}
            - name: KEYCLOAK_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.keycloak.database.credentialsSecret }}
                  key: {{ .Values.keycloak.database.passwordKey }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
{{- end }}
