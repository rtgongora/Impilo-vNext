{{/*
Per-workload ServiceAccounts (Tshepo trust plane, Checkpoint 4).

Doctrine: "Workloads authenticate as themselves… no shared estate-wide service token"
(tshepo-trust-plane-doctrine §6), and Kubernetes is the workload identity substrate that
must not "share one `default` SA across the estate" (§4).

Creating a ServiceAccount changes nothing on its own -- no pod references it until
.Values.workloadIdentity.cohort names that workload. That separation is deliberate: the
identities can land across the whole estate with zero pod churn, and enforcement then
advances one cohort at a time with its own rollback.
*/}}
{{- if .Values.workloadIdentity.createServiceAccounts }}
{{- range $name, $svc := .Values.fullBootServices }}
{{- if $svc.enabled }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "impilo.labels" (dict "name" $name "Release" $.Release "Values" $.Values) | nindent 4 }}
    impilo.io/workload-identity: "true"
  annotations:
    impilo.io/workload-id: {{ include "impilo.workloadId" (dict "root" $ "name" $name) | quote }}
    impilo.io/tshepo-audience: {{ include "impilo.workloadAudience" (dict "root" $ "name" $name) | quote }}
# A workload never needs the API server. Anything that does gets an explicit RoleBinding.
automountServiceAccountToken: false
{{- end }}
{{- end }}
{{- range $name := .Values.workloadIdentity.additionalServiceAccounts }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "impilo.labels" (dict "name" $name "Release" $.Release "Values" $.Values) | nindent 4 }}
    impilo.io/workload-identity: "true"
  annotations:
    impilo.io/workload-id: {{ include "impilo.workloadId" (dict "root" $ "name" $name) | quote }}
    impilo.io/tshepo-audience: {{ include "impilo.workloadAudience" (dict "root" $ "name" $name) | quote }}
automountServiceAccountToken: false
{{- end }}
{{- end }}
