{{- range $name, $svc := .Values.fullBootServices }}
{{- if $svc.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "impilo.labels" (dict "name" $name "Release" $.Release "Values" $.Values) | nindent 4 }}
spec:
  strategy:
    type: {{ $.Values.global.deploymentStrategy | default "Recreate" }}
  replicas: {{ $svc.replicaCount | default 1 }}
  selector:
    matchLabels:
      app: {{ $name }}
  template:
    metadata:
      labels:
        app: {{ $name }}
        {{- include "impilo.labels" (dict "name" $name "Release" $.Release "Values" $.Values) | nindent 8 }}
    spec:
      enableServiceLinks: false
      {{- if has $name $.Values.workloadIdentity.cohort }}
      # Checkpoint 4 workload identity. Applied only to named cohort members so that
      # enforcement advances one cohort at a time; an empty cohort renders the exact
      # pre-Checkpoint-4 pod spec.
      serviceAccountName: {{ $name }}
      automountServiceAccountToken: false
      volumes:
        {{- include "impilo.workloadTokenVolume" (dict "root" $ "name" $name) | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ $name }}
          {{- $img := $svc.image | default dict }}
          image: "{{ include "impilo.image" (dict "root" $ "repository" ($img.repository | default (printf "impilo/%s" $name)) "tag" ($img.tag | default $.Values.global.imageTag | default "preview") "digest" ($img.digest | default "")) }}"
          imagePullPolicy: {{ $img.pullPolicy | default $.Values.global.imagePullPolicy | default "IfNotPresent" }}
          ports:
            - containerPort: {{ $svc.port }}
          env:
            {{- include "impilo.globalEnv" (dict "root" $) | nindent 12 }}
            - name: SERVER_PORT
              value: {{ $svc.port | quote }}
            {{- if $.Values.global.javaToolOptions }}
            - name: JAVA_TOOL_OPTIONS
              value: {{ $.Values.global.javaToolOptions | quote }}
            {{- end }}
            {{- if $.Values.global.previewDisableTracing }}
            - name: MANAGEMENT_TRACING_ENABLED
              value: "false"
            {{- end }}
            {{- if $.Values.global.database.enabled }}
            - name: POSTGRES_HOST
              value: postgres
            - name: POSTGRES_PORT
              value: "5432"
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_PASSWORD
            - name: DB_HOST
              value: postgres
            - name: DB_PORT
              value: "5432"
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_PASSWORD
            {{- if $svc.database }}
            - name: DB_NAME
              value: {{ $svc.database | quote }}
            - name: SPRING_DATASOURCE_URL
              value: {{ printf "jdbc:postgresql://postgres:5432/%s" $svc.database | quote }}
            {{- end }}
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_USER
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_PASSWORD
            - name: SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE
              value: "3"
            - name: SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE
              value: "1"
            {{- end }}
            {{- if $.Values.global.redis.enabled }}
            - name: REDIS_HOST
              value: {{ $.Values.global.redis.host | quote }}
            - name: REDIS_PORT
              value: {{ $.Values.global.redis.port | quote }}
            {{- end }}
            {{- /* When cluster Kafka is enabled, wire outbox services unless explicitly disabled per service.
                   Listener auto-startup defaults OFF; services opt in via fullBootServices.<id>.env
                   (the guard prevents a duplicate env key when they do). */}}
            {{- if and $.Values.kafka.enabled (or (not (hasKey ($svc.kafka | default dict) "enabled")) $svc.kafka.enabled) }}
            - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
              value: {{ $.Values.global.kafka.bootstrapServers | quote }}
            {{- if not (hasKey ($svc.env | default dict) "SPRING_KAFKA_LISTENER_AUTO_STARTUP") }}
            - name: SPRING_KAFKA_LISTENER_AUTO_STARTUP
              value: "false"
            {{- end }}
            - name: MANAGEMENT_HEALTH_KAFKA_ENABLED
              value: "false"
            {{- else }}
            - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
              value: "127.0.0.1:9092"
            {{- if not (hasKey ($svc.env | default dict) "SPRING_KAFKA_LISTENER_AUTO_STARTUP") }}
            - name: SPRING_KAFKA_LISTENER_AUTO_STARTUP
              value: "false"
            {{- end }}
            - name: MANAGEMENT_HEALTH_KAFKA_ENABLED
              value: "false"
            - name: SPRING_AUTOCONFIGURE_EXCLUDE
              value: "org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration"
            {{- end }}
            {{- /* OAuth resource-server defaults. Measured 2026-08-08: THIRTY-SIX services rejected
                   every real token with

                     401 invalid_token -- "The iss claim is not valid"

                   Their application.yml all carry the same line,
                     issuer-uri: ${KEYCLOAK_URL:...}/realms/${KEYCLOAK_REALM:impilo}
                   which resolves the issuer to the INTERNAL http://keycloak:8080/... while tokens
                   carry the PUBLIC iss. The JWKS half of that pair is right, so every pod starts
                   clean and the fault appears only on a request that actually presents a bearer --
                   which is why it survived: an unauthenticated probe sees 401 and reads it as
                   enforcement.

                   Set here rather than in 36 per-service blocks so the default is correct for any
                   service added later, and so no image rebuild is needed to fix it.

                   PUBLIC issuer (it is what the iss claim carries) with the INTERNAL JWKS route
                   (this VM cannot reach its own public address). Setting jwk-set-uri also stops
                   Spring attempting OIDC discovery against the public address at startup, which is
                   the G046 "no JwtDecoder bean, pod fails to start" trap.

                   Guarded by hasKey and emitted BEFORE $svc.env, so a service that sets either key
                   explicitly still wins. */}}
            {{- if $.Values.global.keycloak }}
            {{- if and $.Values.global.keycloak.publicIssuerUri (not (hasKey ($svc.env | default dict) "SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI")) }}
            - name: SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI
              value: {{ $.Values.global.keycloak.publicIssuerUri | quote }}
            {{- end }}
            {{- if and $.Values.global.keycloak.internalJwksUri (not (hasKey ($svc.env | default dict) "SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI")) }}
            - name: SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI
              value: {{ $.Values.global.keycloak.internalJwksUri | quote }}
            {{- end }}
            {{- end }}
            {{- range $k, $v := $svc.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
            {{- /* Secret-backed env: map of ENV_NAME -> {name, key} rendered as
                   secretKeyRef, so signing keys/secrets come from out-of-band
                   Secrets (e.g. impilo-app-secrets) instead of committed values.
                   See docs/security/secrets-management-migration-plan.md. */}}
            {{- /* optional: a MISSING secret leaves the value unset instead of refusing to
                   start the pod. Only for env whose absence is safe by construction — the
                   shadow probe key fails closed on blank at both ends, so a missing secret
                   disables a temporary measurement rather than taking the PDP off the request
                   path. Defaults to required, which is correct for every other entry here. */}}
            {{- range $ek, $ref := ($svc.secretEnv | default dict) }}
            - name: {{ $ek }}
              valueFrom:
                secretKeyRef:
                  name: {{ $ref.name | quote }}
                  key: {{ $ref.key | quote }}
                  {{- if $ref.optional }}
                  optional: true
                  {{- end }}
            {{- end }}
          {{- if $svc.startupProbe }}
          startupProbe:
            {{- toYaml $svc.startupProbe | nindent 12 }}
          {{- else if $svc.healthPath }}
          startupProbe:
            httpGet:
              path: {{ $svc.healthPath }}
              port: {{ $svc.port }}
            failureThreshold: 30
            periodSeconds: 10
          {{- end }}
          readinessProbe:
            {{- if $svc.readinessProbe }}
            {{- toYaml $svc.readinessProbe | nindent 12 }}
            {{- else }}
            httpGet:
              path: {{ $svc.healthPath | default "/actuator/health" }}
              port: {{ $svc.port }}
            initialDelaySeconds: {{ $svc.readinessInitialDelay | default 45 }}
            periodSeconds: 10
            failureThreshold: 6
            {{- end }}
          livenessProbe:
            {{- if $svc.livenessProbe }}
            {{- toYaml $svc.livenessProbe | nindent 12 }}
            {{- else }}
            httpGet:
              path: {{ $svc.healthPath | default "/actuator/health" }}
              port: {{ $svc.port }}
            initialDelaySeconds: {{ $svc.livenessInitialDelay | default 90 }}
            periodSeconds: 20
            failureThreshold: 6
            {{- end }}
          resources:
            {{- toYaml ($svc.resources | default $.Values.global.defaultResources) | nindent 12 }}
          {{- if has $name $.Values.workloadIdentity.cohort }}
          volumeMounts:
            {{- include "impilo.workloadTokenMount" (dict "root" $ "name" $name) | nindent 12 }}
          {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "impilo.labels" (dict "name" $name "Release" $.Release "Values" $.Values) | nindent 4 }}
spec:
  selector:
    app: {{ $name }}
  ports:
    - port: {{ $svc.port }}
      targetPort: {{ $svc.port }}
{{- end }}
{{- end }}
