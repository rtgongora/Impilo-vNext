{{- range $name, $svc := .Values.fullBootServices }}
{{- if $svc.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "impilo.labels" (dict "name" $name "Release" $.Release "Values" $.Values) | nindent 4 }}
spec:
  replicas: {{ $svc.replicaCount | default 1 }}
  selector:
    matchLabels:
      app: {{ $name }}
  template:
    metadata:
      labels:
        app: {{ $name }}
        {{- include "impilo.labels" (dict "name" $name "Release" $.Release "Values" $.Values) | nindent 8 }}
    spec:
      enableServiceLinks: false
      containers:
        - name: {{ $name }}
          {{- $img := $svc.image | default dict }}
          image: "{{ include "impilo.image" (dict "repository" ($img.repository | default (printf "impilo/%s" $name)) "tag" ($img.tag | default $.Values.global.imageTag | default "preview")) }}"
          imagePullPolicy: {{ $img.pullPolicy | default $.Values.global.imagePullPolicy | default "IfNotPresent" }}
          ports:
            - containerPort: {{ $svc.port }}
          env:
            {{- include "impilo.globalEnv" (dict "root" $) | nindent 12 }}
            {{- if $.Values.global.database.enabled }}
            - name: SPRING_DATASOURCE_URL
              value: {{ $.Values.global.database.jdbcUrl | quote }}
            - name: SPRING_DATASOURCE_USERNAME
              value: {{ $.Values.global.database.username | quote }}
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_PASSWORD
            {{- end }}
            {{- if $.Values.global.redis.enabled }}
            - name: REDIS_HOST
              value: {{ $.Values.global.redis.host | quote }}
            - name: REDIS_PORT
              value: {{ $.Values.global.redis.port | quote }}
            {{- end }}
            {{- $kafka := $svc.kafka | default dict }}
            {{- if not ($kafka.enabled | default false) }}
            - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
              value: "127.0.0.1:9092"
            - name: SPRING_KAFKA_LISTENER_AUTO_STARTUP
              value: "false"
            - name: MANAGEMENT_HEALTH_KAFKA_ENABLED
              value: "false"
            - name: SPRING_AUTOCONFIGURE_EXCLUDE
              value: "org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration"
            {{- else }}
            - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
              value: {{ $.Values.global.kafka.bootstrapServers | quote }}
            {{- end }}
            {{- range $k, $v := $svc.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
          {{- if $svc.startupProbe }}
          startupProbe:
            {{- toYaml $svc.startupProbe | nindent 12 }}
          {{- else if $svc.healthPath }}
          startupProbe:
            httpGet:
              path: {{ $svc.healthPath }}
              port: {{ $svc.port }}
            failureThreshold: 30
            periodSeconds: 10
          {{- end }}
          readinessProbe:
            {{- if $svc.readinessProbe }}
            {{- toYaml $svc.readinessProbe | nindent 12 }}
            {{- else }}
            httpGet:
              path: {{ $svc.healthPath | default "/actuator/health" }}
              port: {{ $svc.port }}
            initialDelaySeconds: {{ $svc.readinessInitialDelay | default 45 }}
            periodSeconds: 10
            failureThreshold: 6
            {{- end }}
          livenessProbe:
            {{- if $svc.livenessProbe }}
            {{- toYaml $svc.livenessProbe | nindent 12 }}
            {{- else }}
            httpGet:
              path: {{ $svc.healthPath | default "/actuator/health" }}
              port: {{ $svc.port }}
            initialDelaySeconds: {{ $svc.livenessInitialDelay | default 90 }}
            periodSeconds: 20
            failureThreshold: 6
            {{- end }}
          resources:
            {{- toYaml ($svc.resources | default $.Values.global.defaultResources) | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "impilo.labels" (dict "name" $name "Release" $.Release "Values" $.Values) | nindent 4 }}
spec:
  selector:
    app: {{ $name }}
  ports:
    - port: {{ $svc.port }}
      targetPort: {{ $svc.port }}
{{- end }}
{{- end }}
