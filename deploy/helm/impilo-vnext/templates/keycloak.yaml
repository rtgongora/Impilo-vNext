{{- if .Values.keycloak.enabled }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: keycloak-data
  namespace: {{ .Release.Namespace }}
  annotations:
    # Survives 'helm uninstall' — data volumes are only destroyed by the explicit
    # FULL_BOOT_WIPE_DATA=1 namespace wipe (see scripts/operator/fullboot.sh).
    "helm.sh/resource-policy": keep
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: {{ .Values.keycloak.storageSize | default "2Gi" }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  namespace: {{ .Release.Namespace }}
spec:
  strategy:
    type: {{ .Values.global.deploymentStrategy | default "Recreate" }}
  replicas: 1
  selector:
    matchLabels:
      app: keycloak
  template:
    metadata:
      labels:
        app: keycloak
    spec:
      containers:
        - name: keycloak
          image: "{{ .Values.keycloak.image.repository }}:{{ .Values.keycloak.image.tag }}"
          imagePullPolicy: {{ .Values.keycloak.image.pullPolicy }}
          {{- if (.Values.keycloak.realmImport | default dict).enabled }}
          args: ["start-dev", "--http-port=8080", "--import-realm"]
          {{- else }}
          args: ["start-dev", "--http-port=8080"]
          {{- end }}
          ports:
            - containerPort: 8080
          env:
            - name: KEYCLOAK_ADMIN
              valueFrom:
                secretKeyRef:
                  name: impilo-app-secrets
                  key: keycloak-admin-user
            - name: KEYCLOAK_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: impilo-app-secrets
                  key: keycloak-admin-password
            # Client secrets for realm import ${env.*} substitution — never
            # committed (Secret impilo-app-secrets). Applied only at first import;
            # rotate an already-imported realm via the admin API (see runbook).
            - name: KC_CLIENT_SECRET_BFF
              valueFrom:
                secretKeyRef:
                  name: impilo-app-secrets
                  key: keycloak-client-secret-bff
            - name: KC_CLIENT_SECRET_OPS_CONSOLE
              valueFrom:
                secretKeyRef:
                  name: impilo-app-secrets
                  key: keycloak-client-secret-ops-console
            - name: KC_CLIENT_SECRET_ADMIN_CLI
              valueFrom:
                secretKeyRef:
                  name: impilo-app-secrets
                  key: keycloak-client-secret-admin-cli
            - name: KC_CLIENT_SECRET_BACKEND
              valueFrom:
                secretKeyRef:
                  name: impilo-app-secrets
                  key: keycloak-backend-secret
            # Traefik terminates TLS at the edge and forwards plain HTTP to this
            # pod. Without this, Keycloak advertises the scheme it sees on the
            # wire — `issuer: http://impilo.mohcc.gov.zw/realms/impilo` — and any
            # client doing strict issuer/`iss` validation (mobile PKCE especially,
            # and anything building redirect URIs from discovery) fails AFTER a
            # successful credential check, which misreads as "login broken" while
            # discovery returns 200. `xforwarded` makes Keycloak honour Traefik's
            # X-Forwarded-Proto/Host so it advertises https.
            - name: KC_PROXY_HEADERS
              value: "xforwarded"
            - name: KC_HEALTH_ENABLED
              value: "true"
            - name: KC_METRICS_ENABLED
              value: "true"
            - name: KC_HTTP_MANAGEMENT_PORT
              value: "9000"
          startupProbe:
            tcpSocket:
              port: 8080
            failureThreshold: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 9000
            initialDelaySeconds: 90
            periodSeconds: 10
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /health/live
              port: 9000
            initialDelaySeconds: 120
            periodSeconds: 20
            failureThreshold: 6
          resources:
            {{- toYaml .Values.keycloak.resources | nindent 12 }}
          volumeMounts:
            # Durable H2 volume (2026-07-18): start-dev keeps its embedded H2 under
            # /opt/keycloak/data on the container's writable layer, so any pod restart
            # erased every user (incl. real citizen signups) and session. The realm-import
            # ConfigMap stays nested below the PVC mount; import only runs into an empty
            # H2, so the first boot imports and later restarts keep users.
            - name: data
              mountPath: /opt/keycloak/data
            {{- if (.Values.keycloak.realmImport | default dict).enabled }}
            - name: realm-import
              mountPath: /opt/keycloak/data/import
              readOnly: true
            {{- end }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: keycloak-data
        {{- if (.Values.keycloak.realmImport | default dict).enabled }}
        - name: realm-import
          configMap:
            name: keycloak-realm-import
        {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    app: keycloak
  ports:
    - port: 8080
      targetPort: 8080
{{- end }}
