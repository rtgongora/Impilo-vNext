{{- if .Values.keycloak.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  namespace: {{ .Release.Namespace }}
spec:
  strategy:
    type: {{ .Values.global.deploymentStrategy | default "Recreate" }}
  replicas: 1
  selector:
    matchLabels:
      app: keycloak
  template:
    metadata:
      labels:
        app: keycloak
    spec:
      containers:
        - name: keycloak
          image: "{{ .Values.keycloak.image.repository }}:{{ .Values.keycloak.image.tag }}"
          imagePullPolicy: {{ .Values.keycloak.image.pullPolicy }}
          {{- if (.Values.keycloak.realmImport | default dict).enabled }}
          args: ["start-dev", "--http-port=8080", "--import-realm"]
          {{- else }}
          args: ["start-dev", "--http-port=8080"]
          {{- end }}
          ports:
            - containerPort: 8080
          env:
            - name: KEYCLOAK_ADMIN
              valueFrom:
                secretKeyRef:
                  name: impilo-app-secrets
                  key: keycloak-admin-user
            - name: KEYCLOAK_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: impilo-app-secrets
                  key: keycloak-admin-password
            # Client secrets for realm import ${env.*} substitution — never
            # committed (Secret impilo-app-secrets). Applied only at first import;
            # rotate an already-imported realm via the admin API (see runbook).
            - name: KC_CLIENT_SECRET_BFF
              valueFrom:
                secretKeyRef:
                  name: impilo-app-secrets
                  key: keycloak-client-secret-bff
            - name: KC_CLIENT_SECRET_OPS_CONSOLE
              valueFrom:
                secretKeyRef:
                  name: impilo-app-secrets
                  key: keycloak-client-secret-ops-console
            - name: KC_CLIENT_SECRET_ADMIN_CLI
              valueFrom:
                secretKeyRef:
                  name: impilo-app-secrets
                  key: keycloak-client-secret-admin-cli
            - name: KC_CLIENT_SECRET_BACKEND
              valueFrom:
                secretKeyRef:
                  name: impilo-app-secrets
                  key: keycloak-backend-secret
            - name: KC_HEALTH_ENABLED
              value: "true"
            - name: KC_METRICS_ENABLED
              value: "true"
            - name: KC_HTTP_MANAGEMENT_PORT
              value: "9000"
          startupProbe:
            tcpSocket:
              port: 8080
            failureThreshold: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 9000
            initialDelaySeconds: 90
            periodSeconds: 10
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /health/live
              port: 9000
            initialDelaySeconds: 120
            periodSeconds: 20
            failureThreshold: 6
          resources:
            {{- toYaml .Values.keycloak.resources | nindent 12 }}
          {{- if (.Values.keycloak.realmImport | default dict).enabled }}
          volumeMounts:
            - name: realm-import
              mountPath: /opt/keycloak/data/import
              readOnly: true
          {{- end }}
      {{- if (.Values.keycloak.realmImport | default dict).enabled }}
      volumes:
        - name: realm-import
          configMap:
            name: keycloak-realm-import
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    app: keycloak
  ports:
    - port: 8080
      targetPort: 8080
{{- end }}
