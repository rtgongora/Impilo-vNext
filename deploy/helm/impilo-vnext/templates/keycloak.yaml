{{- if .Values.keycloak.enabled }}
{{- if (.Values.keycloak.realmImport | default dict).enabled }}
{{- fail "keycloak.realmImport is a first-boot seed and is forbidden for the managed MFA runtime; use the reconciler" }}
{{- end }}
{{- if ne (.Values.keycloak.database.vendor | default "postgres") "postgres" }}
{{- fail "the managed MFA runtime requires keycloak.database.vendor=postgres" }}
{{- end }}
{{- if not .Values.keycloak.hostname }}
{{- fail "keycloak.hostname must be the exact external HTTPS issuer" }}
{{- end }}
{{- if (.Values.keycloak.legacyH2 | default dict).preservePvc }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: keycloak-data
  namespace: {{ .Release.Namespace }}
  annotations:
    # The former H2 store is a rollback artifact. It is mounted read-only and is
    # never removed by Helm. Deletion requires a separate, explicit retention decision.
    "helm.sh/resource-policy": keep
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: {{ .Values.keycloak.legacyH2.storageSize | default "2Gi" }}
{{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: keycloak
    app.kubernetes.io/component: identity-provider
spec:
  strategy:
    # Keycloak schema upgrades are deliberately single-writer. A migration backup
    # is required before a new image is admitted.
    type: Recreate
  replicas: 1
  selector:
    matchLabels:
      app: keycloak
  template:
    metadata:
      labels:
        app: keycloak
        app.kubernetes.io/name: keycloak
        impilo.io/security-plane: trust
      annotations:
        impilo.io/keycloak-policy-version: "1.0.0"
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: keycloak
          image: "{{ include "impilo.image" (dict "root" . "repository" .Values.keycloak.image.repository "tag" .Values.keycloak.image.tag "digest" (.Values.keycloak.image.digest | default "")) }}"
          imagePullPolicy: {{ .Values.keycloak.image.pullPolicy }}
          args:
            - start
            - --optimized
            - --http-enabled=true
            - --http-port=8080
          ports:
            - name: http
              containerPort: 8080
            - name: management
              containerPort: 9000
          env:
            - name: KC_BOOTSTRAP_ADMIN_USERNAME
              valueFrom:
                secretKeyRef:
                  name: impilo-app-secrets
                  key: keycloak-admin-user
            - name: KC_BOOTSTRAP_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: impilo-app-secrets
                  key: keycloak-admin-password
            - name: KC_DB
              value: postgres
            - name: KC_DB_URL_HOST
              value: {{ .Values.keycloak.database.host | quote }}
            - name: KC_DB_URL_PORT
              value: {{ .Values.keycloak.database.port | quote }}
            - name: KC_DB_URL_DATABASE
              value: {{ .Values.keycloak.database.name | quote }}
            - name: KC_DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.keycloak.database.credentialsSecret }}
                  key: {{ .Values.keycloak.database.usernameKey }}
            - name: KC_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.keycloak.database.credentialsSecret }}
                  key: {{ .Values.keycloak.database.passwordKey }}
            - name: KC_HOSTNAME
              value: {{ .Values.keycloak.hostname | quote }}
            - name: KC_PROXY_HEADERS
              value: xforwarded
            - name: KC_PROXY_TRUSTED_ADDRESSES
              value: {{ .Values.keycloak.proxyTrustedAddresses | default "10.0.0.0/8" | quote }}
            - name: KC_HEALTH_ENABLED
              value: "true"
            - name: KC_METRICS_ENABLED
              value: "true"
            - name: KC_HTTP_MANAGEMENT_PORT
              value: "9000"
            - name: KC_CACHE
              value: local
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]
          startupProbe:
            httpGet:
              path: /health/started
              port: management
            failureThreshold: 60
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /health/ready
              port: management
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health/live
              port: management
            periodSeconds: 20
            failureThreshold: 6
          resources:
            {{- toYaml .Values.keycloak.resources | nindent 12 }}
          {{- if (.Values.keycloak.legacyH2 | default dict).preservePvc }}
          volumeMounts:
            - name: legacy-h2
              mountPath: /opt/keycloak/legacy-h2
              readOnly: true
          {{- end }}
      {{- if (.Values.keycloak.legacyH2 | default dict).preservePvc }}
      volumes:
        - name: legacy-h2
          persistentVolumeClaim:
            claimName: keycloak-data
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    app: keycloak
  ports:
    - name: http
      port: 8080
      targetPort: http
    - name: management
      port: 9000
      targetPort: management
{{- end }}
