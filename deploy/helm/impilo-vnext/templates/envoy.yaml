{{- if .Values.envoy.enabled }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: envoy-config
  namespace: {{ .Release.Namespace }}
data:
  envoy.yaml: |
    admin:
      address:
        socket_address: { address: 0.0.0.0, port_value: 9901 }
    static_resources:
      listeners:
        - name: listener_0
          address:
            socket_address: { address: 0.0.0.0, port_value: 10000 }
          filter_chains:
            - filters:
                - name: envoy.filters.network.http_connection_manager
                  typed_config:
                    "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                    stat_prefix: ingress_http
                    codec_type: AUTO
                    route_config:
                      name: local_route
                      virtual_hosts:
                        - name: local_service
                          domains: ["*"]
                          routes:
                            # ── Narrow ext_authz bypass list (Phase D, D1) ──────────────
                            # Only these three families skip the PDP gate, mirroring the
                            # BFF's own SecurityConfig permitAll set: readiness/liveness,
                            # authentication initiation/callback, and the governed public
                            # gateway lane (which the BFF's own permitAll list already
                            # gates — see docs/architecture/gateway-public-lane-security-adr.md).
                            # No other service or path family is exempted wholesale.
                            - match: { prefix: "/actuator/health" }
                              route: { cluster: experience_bff }
                              {{- if .Values.envoy.extAuthz.enabled }}
                              typed_per_filter_config:
                                envoy.filters.http.ext_authz:
                                  "@type": type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthzPerRoute
                                  disabled: true
                              {{- end }}
                            - match: { prefix: "/internal/v1/auth/" }
                              route: { cluster: experience_bff }
                              request_headers_to_remove:
                                - "x-actor-id"
                                # Decision inputs: a client that could set these would choose which
                                # resource its own request is authorized against.
                                - "x-original-method"
                                - "x-original-path"
                                - "x-actor-type"
                                - "x-assurance-level"
                                - "x-authentication-aal"
                                - "x-authentication-amr"
                                - "x-authentication-time"
                                - "x-authentication-step-up-time"
                                - "x-authentication-phishing-resistant"
                                - "x-authentication-session-id"
                                - "x-authentication-flow-id"
                              {{- if .Values.envoy.extAuthz.enabled }}
                              typed_per_filter_config:
                                envoy.filters.http.ext_authz:
                                  "@type": type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthzPerRoute
                                  disabled: true
                              {{- end }}
                            # Governed public gateway lane (R0, anonymous). Client-supplied
                            # trust headers are stripped here so an anonymous caller can never
                            # smuggle authority into the BFF — the BFF's own permitAll list is
                            # the actual gate for this lane; ext_authz is disabled ONLY here.
                            - match: { prefix: "/internal/v1/public/" }
                              route: { cluster: experience_bff }
                              request_headers_to_remove:
                                - "x-actor-id"
                                # Decision inputs: a client that could set these would choose which
                                # resource its own request is authorized against.
                                - "x-original-method"
                                - "x-original-path"
                                - "x-actor-type"
                                - "x-assurance-level"
                                - "x-ial"
                                - "x-aal"
                                - "x-authentication-aal"
                                - "x-authentication-amr"
                                - "x-authentication-time"
                                - "x-authentication-step-up-time"
                                - "x-authentication-phishing-resistant"
                                - "x-authentication-session-id"
                                - "x-authentication-flow-id"
                                - "x-purpose-of-use"
                                - "x-subject-id"
                                - "x-work-context-token"
                                - "x-facility-id"
                                - "x-workspace-id"
                                - "x-department-id"
                                - "x-ward-id"
                                - "x-programme-id"
                                - "x-provider-id"
                                - "x-obligations"
                                - "x-visibility-tier"
                                - "x-pii-access"
                                - "x-clinical-access"
                                - "x-aggregate-only"
                                - "x-resource-sensitivity"
                                - "x-escalation-grant-id"
                                - "x-export-policy"
                                - "x-suppress-fields"
                                - "x-drill-down-allowed"
                                - "x-confidential-categories"
                              {{- if .Values.envoy.extAuthz.enabled }}
                              typed_per_filter_config:
                                envoy.filters.http.ext_authz:
                                  "@type": type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthzPerRoute
                                  disabled: true
                              {{- end }}
                            # ── Everything else: PDP-gated when extAuthz.enabled ────────
                            - match: { prefix: "/" }
                              route:
                                cluster: experience_bff
                              request_headers_to_remove:
                                {{- if .Values.envoy.extAuthz.enabled }}
                                # ── Identity, stripped ONLY when the PDP can regenerate it ──
                                # Checkpoint 4. These were never stripped on this route, so a
                                # client could set its own x-actor-id / x-tenant-id /
                                # x-provider-id and have it survive to the service — the
                                # anti-impersonation control ended at the gate.
                                #
                                # Strip and regenerate are ONE control, and this list is
                                # deliberately gated on extAuthz being enabled: every header
                                # below is re-added from validated evidence by
                                # PolicyEngine.buildHeaderMutations via allowed_upstream_headers.
                                # Stripping them with the PDP off would not harden anything, it
                                # would DELETE the identity the upstream needs.
                                #
                                # Context headers (x-facility-id, x-workspace-id, x-department-id,
                                # x-ward-id, x-programme-id, x-shift-id, x-work-context-token,
                                # x-purpose-of-use, x-workflow-state) are deliberately NOT here:
                                # the browser shell genuinely supplies them and the PDP does not
                                # regenerate them, so stripping would remove real operating
                                # context. They remain client-supplied — a retained gap recorded
                                # in checkpoint-4/HEADER_CONTAINMENT.md, to be closed by teaching
                                # the PDP to emit them, not by stripping them blind.
                                - "x-actor-id"
                                # Decision inputs: a client that could set these would choose which
                                # resource its own request is authorized against.
                                - "x-original-method"
                                - "x-original-path"
                                - "x-actor-type"
                                - "x-tenant-id"
                                - "x-subject-id"
                                - "x-provider-id"
                                - "x-assurance-level"
                                {{- end }}
                                # Authentication assurance is derived from the validated
                                # token by Tshepo and copied back below. A browser value
                                # must never survive when a token has no such assurance.
                                - "x-authentication-aal"
                                - "x-authentication-amr"
                                - "x-authentication-time"
                                - "x-authentication-step-up-time"
                                - "x-authentication-phishing-resistant"
                                - "x-authentication-session-id"
                                - "x-authentication-flow-id"
                                - "x-obligations"
                                - "x-visibility-tier"
                                - "x-pii-access"
                                - "x-clinical-access"
                                - "x-aggregate-only"
                                - "x-resource-sensitivity"
                                - "x-escalation-grant-id"
                                - "x-export-policy"
                                - "x-suppress-fields"
                                - "x-drill-down-allowed"
                                - "x-confidential-categories"
                    http_filters:
                      {{- if .Values.envoy.extAuthz.enabled }}
                      # ---------------------------------------------------------------
                      # TSHEPO PDP gate (Work Context Resolution programme, Phase D).
                      # HTTP ext_authz against tshepo-authz-service's existing
                      # /v1/authorize endpoint (AuthorizeController) — the k8s Service
                      # for tshepo-authz-service exposes only its HTTP port (8081), not
                      # the gRPC ext_authz port (9090) the local-dev config uses, so
                      # HTTP is the deployable choice here, not a lesser fallback: same
                      # PolicyEngine, same decision.
                      #
                      # failure_mode_allow: false is deliberate — a PDP outage DENIES,
                      # it does not fail the gateway open. This is the load-bearing
                      # guarantee: "PDP unavailability does not allow access."
                      # ---------------------------------------------------------------
                      - name: envoy.filters.http.ext_authz
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthz
                          transport_api_version: V3
                          failure_mode_allow: false
                          http_service:
                            server_uri:
                              uri: http://tshepo-authz-service:8081
                              cluster: tshepo_authz_service
                              timeout: 0.5s
                            path_prefix: "/v1/authorize"
                            authorization_request:
                              allowed_headers:
                                patterns:
                                  - exact: "authorization"
                                  - exact: "x-tenant-id"
                                  - exact: "x-pod-id"
                                  - exact: "x-request-id"
                                  - exact: "x-correlation-id"
                                  - exact: "x-actor-id"
                                  - exact: "x-actor-type"
                                  - exact: "x-purpose-of-use"
                                  - exact: "x-device-fingerprint"
                                  - exact: "x-facility-id"
                                  - exact: "x-workspace-id"
                                  - exact: "x-shift-id"
                                  - exact: "x-department-id"
                                  - exact: "x-ward-id"
                                  - exact: "x-programme-id"
                                  - exact: "x-provider-id"
                                  - exact: "x-work-context-token"
                                  - exact: "x-assurance-level"
                                  # The PDP reads all three, and until now Envoy forwarded
                                  # none of them, so every consent check, subject-relationship
                                  # check and workflow-state rule evaluated against a null.
                                  # Forwarding them makes the gate stricter, not looser: a
                                  # forged x-escalation-grant-id denies, because the grant is
                                  # resolved server-side and must be bound to this actor.
                                  - exact: "x-subject-id"
                                  - exact: "x-escalation-grant-id"
                                  - exact: "x-workflow-state"
                            headers_to_add:
                              - key: ":method"
                                value: "%REQ(:METHOD)%"
                              - key: ":path"
                                value: "%REQ(:PATH)%"
                          authorization_response:
                            # Only headers listed here are copied from the PDP's response onto
                            # the upstream request. Anything the PDP sets and this list omits is
                            # silently dropped, and the client's own value survives in its place.
                            allowed_upstream_headers:
                              patterns:
                                - exact: "x-obligations"
                                - exact: "x-decision"
                                - exact: "x-max-scope"
                                - exact: "x-mask-fields"
                                - exact: "x-logging-level"
                                # The authoritative identity. PolicyEngine overrides these from
                                # the validated session precisely so a client cannot impersonate
                                # by setting them (TPL-1) — but the override only reached Envoy,
                                # not the service, so upstream kept reading the client's values
                                # and the anti-impersonation control ended at the gate.
                                - exact: "x-actor-id"
                                - exact: "x-actor-type"
                                - exact: "x-tenant-id"
                                - exact: "x-correlation-id"
                                - exact: "x-provider-id"
                                - exact: "x-subject-id"
                                - exact: "x-assurance-level"
                                - exact: "x-authentication-aal"
                                - exact: "x-authentication-amr"
                                - exact: "x-authentication-time"
                                - exact: "x-authentication-step-up-time"
                                - exact: "x-authentication-phishing-resistant"
                                - exact: "x-authentication-session-id"
                                - exact: "x-authentication-flow-id"
                                # Visibility obligations. A service that masks or suppresses
                                # fields cannot honour an obligation it never received.
                                - exact: "x-visibility-tier"
                                - exact: "x-pii-access"
                                - exact: "x-clinical-access"
                                - exact: "x-aggregate-only"
                                - exact: "x-resource-sensitivity"
                                - exact: "x-escalation-grant-id"
                                - exact: "x-export-policy"
                                - exact: "x-suppress-fields"
                                - exact: "x-drill-down-allowed"
                                # Phase 0 step 2 (§22). The nine operating-context headers.
                                # These are NOT stripped on the catch-all route (see the
                                # strip-order trap note above), so today they arrive
                                # client-supplied and survive untouched. Listing them here is
                                # what makes context-header-mode=AUTHORITATIVE mean anything:
                                # once the PDP regenerates them from validated evidence, this
                                # allow-list is the only thing that lets the regenerated value
                                # reach the service instead of being silently dropped in favour
                                # of the client's own. Adding them while the mode is SHADOW is
                                # inert — the PDP emits nothing, so nothing is copied.
                                - exact: "x-facility-id"
                                - exact: "x-workspace-id"
                                - exact: "x-department-id"
                                - exact: "x-ward-id"
                                - exact: "x-programme-id"
                                - exact: "x-shift-id"
                                - exact: "x-work-context-token"
                                - exact: "x-purpose-of-use"
                                - exact: "x-workflow-state"
                                # Phase 0 step 3 (§21.3). The catch-all route strips
                                # x-confidential-categories; until this entry existed the PDP
                                # had no way to put it back, so enabling ext_authz deleted the
                                # confidentiality grant rather than governing it. Paired with
                                # the emit in PolicyEngine.buildHeaderMutations — strip and
                                # regenerate are one control, and half of it is a data-loss bug.
                                - exact: "x-confidential-categories"
                                # The signed proof that the PDP issued this decision (D2).
                                # Without it here, the envelope stops at Envoy and D3's
                                # downstream verification has nothing to verify.
                                - exact: "x-decision-envelope"
                          with_request_body:
                            max_request_bytes: 8192
                            allow_partial_message: true
                      {{- end }}
                      - name: envoy.filters.http.router
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
      clusters:
        - name: experience_bff
          connect_timeout: 5s
          type: STRICT_DNS
          lb_policy: ROUND_ROBIN
          load_assignment:
            cluster_name: experience_bff
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        socket_address:
                          address: experience-bff
                          port_value: 8160
        {{- if .Values.envoy.extAuthz.enabled }}
        - name: tshepo_authz_service
          connect_timeout: 1s
          type: STRICT_DNS
          lb_policy: ROUND_ROBIN
          load_assignment:
            cluster_name: tshepo_authz_service
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        socket_address:
                          address: tshepo-authz-service
                          port_value: 8081
        {{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: envoy
  namespace: {{ .Release.Namespace }}
spec:
  strategy:
    type: {{ .Values.global.deploymentStrategy | default "Recreate" }}
  replicas: 1
  selector:
    matchLabels:
      app: envoy
  template:
    metadata:
      labels:
        app: envoy
    spec:
      containers:
        - name: envoy
          image: "{{ .Values.envoy.image.repository }}:{{ .Values.envoy.image.tag }}"
          imagePullPolicy: {{ .Values.envoy.image.pullPolicy }}
          args: ["-c", "/etc/envoy/envoy.yaml", "--log-level", "info"]
          ports:
            - containerPort: 10000
            - containerPort: 9901
          volumeMounts:
            - name: envoy-config
              mountPath: /etc/envoy
          readinessProbe:
            httpGet:
              path: /ready
              port: 9901
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /server_info
              port: 9901
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            {{- toYaml .Values.envoy.resources | nindent 12 }}
      volumes:
        - name: envoy-config
          configMap:
            name: envoy-config
---
apiVersion: v1
kind: Service
metadata:
  name: envoy
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    app: envoy
  ports:
    - name: http
      port: 10000
      targetPort: 10000
    - name: admin
      port: 9901
      targetPort: 9901
{{- end }}
