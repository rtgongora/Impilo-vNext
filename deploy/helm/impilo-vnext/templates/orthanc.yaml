{{- if .Values.orthanc.enabled }}
# Orthanc DICOM server — preview imaging backend for pacs-adapter-service.
# Preview-scoped: authentication disabled (ClusterIP-only, never exposed via
# ingress). Storage is a durable PVC (2026-07-18) — studies survive pod restarts.
# Real deployments must additionally front Orthanc with auth.
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: orthanc-data
  namespace: {{ .Release.Namespace }}
  annotations:
    # Survives 'helm uninstall' — data volumes are only destroyed by the explicit
    # FULL_BOOT_WIPE_DATA=1 namespace wipe (see scripts/operator/fullboot.sh).
    "helm.sh/resource-policy": keep
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: {{ .Values.orthanc.storageSize | default "10Gi" }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: orthanc-config
  namespace: {{ .Release.Namespace }}
data:
  # Replaces the image's /etc/orthanc/orthanc.json entirely — Orthanc treats a
  # key defined in two config files as a fatal error, and the image default
  # defines nearly every key we need to change.
  orthanc.json: |
    {
      "Name": "impilo-preview",
      "AuthenticationEnabled": false,
      "RemoteAccessAllowed": true,
      "DicomServerEnabled": true,
      "DicomAet": "IMPILO",
      "HttpPort": 8042,
      "DicomPort": 4242,
      "StorageDirectory": "/var/lib/orthanc/db",
      "IndexDirectory": "/var/lib/orthanc/db",
      "Plugins": ["/usr/local/share/orthanc/plugins/libOrthancDicomWeb.so"],
      "DicomWeb": { "Enable": true, "Root": "/dicom-web/" }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orthanc
  namespace: {{ .Release.Namespace }}
spec:
  strategy:
    type: {{ .Values.global.deploymentStrategy | default "Recreate" }}
  replicas: 1
  selector:
    matchLabels:
      app: orthanc
  template:
    metadata:
      labels:
        app: orthanc
    spec:
      containers:
        - name: orthanc
          image: "{{ .Values.orthanc.image.repository }}:{{ .Values.orthanc.image.tag }}"
          imagePullPolicy: {{ .Values.orthanc.image.pullPolicy }}
          ports:
            - containerPort: 8042
            - containerPort: 4242
          volumeMounts:
            - name: orthanc-config
              mountPath: /etc/orthanc/orthanc.json
              subPath: orthanc.json
            - name: orthanc-storage
              mountPath: /var/lib/orthanc/db
          readinessProbe:
            httpGet:
              path: /system
              port: 8042
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /system
              port: 8042
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            {{- toYaml .Values.orthanc.resources | nindent 12 }}
      volumes:
        - name: orthanc-config
          configMap:
            name: orthanc-config
        - name: orthanc-storage
          persistentVolumeClaim:
            claimName: orthanc-data
---
apiVersion: v1
kind: Service
metadata:
  name: orthanc
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    app: orthanc
  ports:
    - name: http
      port: 8042
      targetPort: 8042
    - name: dicom
      port: 4242
      targetPort: 4242
{{- end }}
