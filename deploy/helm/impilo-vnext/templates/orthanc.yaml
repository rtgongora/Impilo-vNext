{{- if .Values.orthanc.enabled }}
# Orthanc DICOM server — preview imaging backend for pacs-adapter-service.
# Preview-scoped: authentication disabled (ClusterIP-only, never exposed via
# ingress) and ephemeral storage (studies do not survive pod restarts). Real
# deployments must front Orthanc with auth and persistent volumes.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: orthanc-config
  namespace: {{ .Release.Namespace }}
data:
  # Replaces the image's /etc/orthanc/orthanc.json entirely — Orthanc treats a
  # key defined in two config files as a fatal error, and the image default
  # defines nearly every key we need to change.
  orthanc.json: |
    {
      "Name": "impilo-preview",
      "AuthenticationEnabled": false,
      "RemoteAccessAllowed": true,
      "DicomServerEnabled": true,
      "DicomAet": "IMPILO",
      "HttpPort": 8042,
      "DicomPort": 4242,
      "StorageDirectory": "/var/lib/orthanc/db",
      "IndexDirectory": "/var/lib/orthanc/db",
      "Plugins": ["/usr/local/share/orthanc/plugins/libOrthancDicomWeb.so"],
      "DicomWeb": { "Enable": true, "Root": "/dicom-web/" }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orthanc
  namespace: {{ .Release.Namespace }}
spec:
  strategy:
    type: {{ .Values.global.deploymentStrategy | default "Recreate" }}
  replicas: 1
  selector:
    matchLabels:
      app: orthanc
  template:
    metadata:
      labels:
        app: orthanc
    spec:
      containers:
        - name: orthanc
          image: "{{ .Values.orthanc.image.repository }}:{{ .Values.orthanc.image.tag }}"
          imagePullPolicy: {{ .Values.orthanc.image.pullPolicy }}
          ports:
            - containerPort: 8042
            - containerPort: 4242
          volumeMounts:
            - name: orthanc-config
              mountPath: /etc/orthanc/orthanc.json
              subPath: orthanc.json
            - name: orthanc-storage
              mountPath: /var/lib/orthanc/db
          readinessProbe:
            httpGet:
              path: /system
              port: 8042
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /system
              port: 8042
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            {{- toYaml .Values.orthanc.resources | nindent 12 }}
      volumes:
        - name: orthanc-config
          configMap:
            name: orthanc-config
        - name: orthanc-storage
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: orthanc
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    app: orthanc
  ports:
    - name: http
      port: 8042
      targetPort: 8042
    - name: dicom
      port: 4242
      targetPort: 4242
{{- end }}
