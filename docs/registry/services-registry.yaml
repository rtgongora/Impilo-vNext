  - id: daidzai-service
    maven_module: daidzai-service
    primary_plane: experience
    plane: experience
    domain: workflow-orchestration
    secondary_planes: []
    sovereign: false
    sovereign_group: null
    primary_protocol: rest
    default_http_port: 8392
    product_names:
      - Daidzai
    owner_team: TBD
    system_of_record_for:
      - Daidzai emergency/disaster response command canonical records
      - emergency_request, emergency_incident, mission status timeline, resource_request, affected_site
      - assistance_request (crowdfunding case aggregate, verification lifecycle, timeline; money in mushe, attestation in credential-verification — referenced by id)
      - EMS clinical dispatch — ems_mission crew/vehicle clinical state machine (CREATED..HANDOVER) and prehospital ePCR (patient vitals/GCS/interventions time-series), bound to the trauma incident and trauma_episode_id. This is the clinical dispatch of a crew to a patient, distinct from nhume logistics (parcel) dispatch; crew resolves from vashandi, routing/ETA from ndila, ambulance is an asset-registry Object ID.
      - canonical trauma_episode correlation spine (trauma_episode + trauma_episode_phase read-model); phase-owner SoR rows (pct/inpatient/madi) carry trauma_episode_id and remain owned by their services
    consumes_from:
      - tshepo-authz-service
      - nhume-service
      - ndila-service
      - pct-service
      - tuso-service
      - indawo-service
      - khuluma-service
      - rito-quality-safety-service
    exposes_to:
      - experience-bff
    forbidden_responsibilities:
      - must-not-own-logistics-dispatch-execution   # parcel/last-mile logistics dispatch is nhume; daidzai DOES own EMS clinical (crew-to-patient) dispatch
      - must-not-own-maps-routing
      - must-not-own-clinical-record-source-of-truth  # owns the ePCR prehospital record + trauma_episode spine; does NOT own facility clinical encounter/record (pct/butano)
      - must-not-bypass-bff-authz-audit-controls
    production_status: baseline-assessed
    implementation_status: implemented-or-partial
    frontend_wiring_status: wired
    api_contract_status: partial
    authz_audit_status: partial
    observability_status: partial
