              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Pathway code already taken (`PATHWAY_CODE_TAKEN`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    get:
      tags:
        - FundoNativeLMS
      summary: List native Fundo learning pathways
      operationId: listFundoPathways
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
        - name: limit
          in: query
          required: false
