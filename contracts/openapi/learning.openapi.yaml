        '200':
          description: Progress recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelope_Map'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Enrolment / lesson / module not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
