openapi: 3.0.3
info:
  title: Learning Service (Impilo Fundo) — Internal API
  description: >
    Internal API surface for **Impilo Fundo**, the **native learning
    management, certification, in-service training, pre-service training
    and CPD support capability of Impilo vNext**. Fundo is designed to
    operate as a complete modern LMS at national scale — its own
    catalogue, paths, enrolment, progress, assessments, certificates,
    learning records and analytics — without depending on any external
    LMS to function.


    External LMS platforms (Moodle, Open edX, Canvas, Chamilo, …) may be
    connected through **optional adapters** where useful, but Fundo must
    not depend on any external LMS. The existing Moodle orchestration
    endpoints documented below are one such optional adapter, preserved
    verbatim for backwards compatibility — not the Fundo runtime.


    This contract is **descriptive of the current implementation only** —
    it documents the endpoints that exist in `services/learning-service`
    today and does not assert new behaviour, new fields, or future
    surfaces. Endpoints under `/internal/v1/learning/integrations/**`
    and `/internal/v1/learning/orchestration/**` are server-to-server
    only and use shared internal keys (see `securitySchemes`), not
    end-user JWT.


    CPD authority remains with `varapi-service`. The Impilo Fundo brand
    is the product/UX name; `learning-service` is its technical home.
  version: 0.1.0
  contact:
    name: MoHCC Digital Health Division

servers:
  - url: http://localhost:10000
    description: Local Envoy gateway (learning-service is internal-only today; gateway entry is for parity with peer contracts)
  - url: http://localhost:8235
    description: Direct service access

tags:
  - name: Internal
    description: Read/write endpoints called by the Experience BFF over the internal network. Native Fundo surface.
  - name: InternalV11
    description: >
      Additive **v1.1-compliant** native Fundo read/write surface under `/internal/v1/learning/v11/**`.
      Enforces platform v1.1 headers and the standard error envelope. Coexists with the legacy
      `/internal/v1/learning/**` endpoints, which remain unchanged.
  - name: FundoNativeLMS
    description: >
      **Phase 5 native Impilo Fundo LMS surface** — catalogue, course structure, pathways,
      enrolment, progress, assessment foundation, certificate metadata, and learning record.
      All endpoints live under `/internal/v1/learning/v11/**` and are governed by the platform
      v1.1 contract. This is the native LMS runtime — no Moodle, no external LMS dependency.
  - name: FundoStudio
    description: Native intelligent authoring studio and creator/admin operations.
  - name: FundoAI
    description: Provider-agnostic AI-assisted authoring endpoints (safe draft-only generation).
  - name: FundoLibrary
    description: Native learning resource library and usage linking.
  - name: FundoMedia
    description: Native media studio metadata and asset management.
  - name: FundoInteractive
    description: Interactive learning activities and response aggregation.
  - name: FundoComms
    description: Learning notification scheduling and learner messaging hooks.
  - name: FundoSchedule
    description: Cohorts, memberships, and scheduled learning sessions.
  - name: Integration
    description: Trusted ingress from Varapi after an external-LMS completion webhook (governed CPD candidate creation)
  - name: Orchestration
    description: >
      Server-to-server orchestration (path assignment, prerequisite registration, **optional Moodle
      adapter relay**). The Moodle endpoints are legacy/optional — Fundo does not depend on Moodle.

paths:
  /internal/v1/learning/workflow-context:
    get:
      tags:
        - Internal
      summary: Resolve the workflow surface for a given app / route / roles
      description: >
        Returns the contextual learning surface (resources, hints, role requirements) for the supplied
        app/route/workflow tuple. Source for the contextual learning panels in the One Experience Shell.
      operationId: getWorkflowContext
      parameters:
        - name: appCode
          in: query
          required: true
          schema:
            type: string
        - name: routeRef
          in: query
          required: true
          schema:
            type: string
        - name: workflowCode
          in: query
          required: false
          schema:
            type: string
        - name: roles
          in: query
          required: false
          description: Comma-separated role codes
          schema:
            type: string
        - name: subjectType
          in: query
          required: false
          schema:
            type: string
        - name: subjectId
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Workflow surface resolved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelope_Map'
  /internal/v1/learning/helpdesk/{issueType}:
    get:
      tags:
        - Internal
      summary: List helpdesk knowledge-base entries for an issue type or topic
      operationId: listHelpdeskKnowledge
      parameters:
        - name: issueType
          in: path
          required: true
          schema:
            type: string
        - name: subjectType
          in: query
          required: false
          schema:
            type: string
        - name: subjectId
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Helpdesk items
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelope_ItemsList'
  /internal/v1/learning/search-hits:
    get:
      tags:
        - Internal
      summary: Search learning resources
      operationId: searchLearningResources
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 8
      responses:
        '200':
          description: Paged search results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelope_SearchPage'
  /internal/v1/learning/resource-opened:
    post:
      tags:
        - Internal
      summary: Record that a user opened a learning resource (audit + progress)
      operationId: recordResourceOpened
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResourceOpenedRequest'
      responses:
        '200':
          description: Event recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelope_Status'
  /internal/v1/learning/resources/{resourceId}:
    get:
      tags:
        - Internal
      summary: Get the public view of a learning resource by id
      operationId: getResourceById
      parameters:
        - name: resourceId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Resource public view
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelope_Map'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /internal/v1/learning/subject-completions:
    get:
      tags:
        - Internal
      summary: List learning completions for a subject (user / provider / etc.)
      operationId: listSubjectCompletions
      parameters:
        - name: subjectType
          in: query
          required: true
          schema:
            type: string
        - name: subjectId
          in: query
          required: true
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 25
      responses:
        '200':
          description: Completion rows
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelope_ItemsList'
  /internal/v1/learning/v11/subject-completions:
    get:
      tags:
        - InternalV11
      summary: List learning completions for a subject — native v1.1 read surface (Phase 3C)
      description: >
        Additive **v1.1-compliant** read endpoint for Impilo Fundo. Delegates to the same native facade as the legacy
        `GET /internal/v1/learning/subject-completions` and never invokes Moodle or any external LMS. Enforces the
        platform v1.1 contract (companion header enforcement, error envelope, client-timeout enforcement) via the shared
        tech-companion filter chain. The legacy endpoint remains unchanged.


        When `subjectType` / `subjectId` are omitted, or when the `X-Tenant-ID` header is not a valid UUID, the endpoint
        returns a successful empty page (HTTP 200 with `data.items = []`) rather than a 4xx — the surface is
        intentionally read-only and side-effect-free.
      operationId: listSubjectCompletionsV11
      parameters:
        - name: subjectType
          in: query
          required: false
          schema:
            type: string
        - name: subjectId
          in: query
          required: false
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 25
      responses:
        '200':
          description: Completion rows (v1.1 envelope; may be empty)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelope_ItemsList'
        '400':
          description: Required v1.1 header missing (`X-Tenant-ID`, `X-Pod-ID`, `X-Request-ID`, `X-Correlation-ID`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '504':
          description: Client timeout exceeded (`X-Client-Timeout-MS` reached)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /internal/v1/learning/v11/resource-opened-acknowledgements:
    post:
      tags:
        - InternalV11
      summary: Acknowledge that a learning resource was opened — native v1.1 write surface (Phase 4A)
      description: >
        Additive **v1.1-compliant** write endpoint for Impilo Fundo. Delegates to the same native facade method as the
        legacy `POST /internal/v1/learning/resource-opened` (`LearningPlatformFacade.recordResourceOpened`) and never
        invokes Moodle or any external LMS. Enforces the platform v1.1 contract (companion header enforcement, error
        envelope, client-timeout enforcement, `Idempotency-Key` requirement) via the shared tech-companion filter chain.
        The legacy endpoint remains unchanged and continues to serve BFF traffic.


        **Tolerant inputs.** When `resourceId` is missing or not a valid UUID, or when the `X-Tenant-ID` header is not a
        valid UUID, the endpoint returns a side-effect-free `{"data": {"status": "acknowledged", "noOp": true, "reason":
        "..."}}` envelope with HTTP 200 rather than 4xx. This keeps the v1.1 envelope contract honest (2xx for "all
        headers + idempotency key present" callers) without leaking domain-specific validation through the platform
        error envelope. Production callers supplying a valid UUID tenant and `resourceId` receive `{"data": {"status":
        "recorded", "resourceId": "..."}}`.
      operationId: acknowledgeResourceOpenedV11
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                resourceId:
                  type: string
                  format: uuid
                actorId:
                  type: string
                actorType:
                  type: string
                workflowContext:
                  type: object
                  additionalProperties: true
      responses:
        '200':
          description: Acknowledgement recorded or accepted as no-op (v1.1 envelope)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelope_Map'
        '400':
          description: Required v1.1 header missing or `Idempotency-Key` absent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Same `Idempotency-Key` reused with a different body (`IDENTITY_CONFLICT`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '504':
          description: Client timeout exceeded (`X-Client-Timeout-MS` reached)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /internal/v1/learning/v11/catalog:
    post:
      tags:
        - FundoNativeLMS
      summary: Create a native Fundo course (Phase 6A)
      description: >
        Creates a new course in the calling tenant's native Fundo catalogue. On `DRAFT → PUBLISHED` status transitions
        (either at create-time when `status=PUBLISHED` is supplied, or on a subsequent PUT), the service emits a single
        `impilo.learning.course.published.v1` outbox row in the same transaction.
      operationId: createFundoCourse
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FundoCourseUpsert'
      responses:
        '200':
          description: Course created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelope_Map'
        '400':
          description: Missing required fields (`BAD_REQUEST`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Course code already taken in the tenant (`COURSE_CODE_TAKEN`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    get:
      tags:
        - FundoNativeLMS
      summary: List native Fundo courses (catalogue)
      description: >
        Returns published courses for the calling tenant. Supports filter by `status`, `category`, `level`,
        `cpdEligible`, `mandatory` and `language`. Defaults to `status=PUBLISHED`.
      operationId: listFundoCatalog
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
        - name: category
          in: query
          required: false
          schema:
            type: string
        - name: level
          in: query
          required: false
          schema:
            type: string
        - name: cpdEligible
          in: query
          required: false
          schema:
            type: boolean
        - name: mandatory
          in: query
          required: false
          schema:
            type: boolean
        - name: language
          in: query
          required: false
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 25
            minimum: 1
            maximum: 100
      responses:
        '200':
          description: Catalogue page (v1.1 envelope)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelope_Map'
  /internal/v1/learning/v11/catalog/{courseId}:
    get:
      tags:
        - FundoNativeLMS
      summary: Get native Fundo course detail
      operationId: getFundoCourse
      parameters:
        - name: courseId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Course detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelope_Map'
        '404':
          description: Course not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      tags:
        - FundoNativeLMS
      summary: Update a native Fundo course (Phase 6A)
      description: >
        Partially updates the course identified by `{courseId}`. Fields omitted from the request body are left
        unchanged. A `DRAFT → PUBLISHED` status transition emits a single `impilo.learning.course.published.v1` outbox
        row; re-publishing a course that is already `PUBLISHED` does not re-emit.
      operationId: updateFundoCourse
      parameters:
        - name: courseId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FundoCourseUpsert'
      responses:
        '200':
          description: Course updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelope_Map'
        '404':
          description: Course not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Course code already taken in the tenant (`COURSE_CODE_TAKEN`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /internal/v1/learning/v11/courses/{courseId}/modules:
    post:
      tags:
        - FundoNativeLMS
      summary: Add a module to a native course (Phase 6A)
      operationId: createFundoModule
      parameters:
        - name: courseId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FundoModuleUpsert'
      responses:
        '200':
          description: Module created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelope_Map'
        '404':
          description: Course not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Module sequence already used in this course (`MODULE_SEQUENCE_TAKEN`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /internal/v1/learning/v11/modules/{moduleId}:
    put:
      tags:
        - FundoNativeLMS
      summary: Update a native module (Phase 6A)
      operationId: updateFundoModule
      parameters:
        - name: moduleId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FundoModuleUpsert'
      responses:
        '200':
          description: Module updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelope_Map'
        '404':
          description: Module not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Module sequence already used (`MODULE_SEQUENCE_TAKEN`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /internal/v1/learning/v11/modules/{moduleId}/lessons:
    post:
      tags:
        - FundoNativeLMS
      summary: Add a lesson to a native module (Phase 6A)
      operationId: createFundoLesson
      parameters:
        - name: moduleId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FundoLessonUpsert'
      responses:
        '200':
          description: Lesson created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelope_Map'
        '404':
          description: Module not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Lesson sequence already used (`LESSON_SEQUENCE_TAKEN`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /internal/v1/learning/v11/lessons/{lessonId}:
    put:
      tags:
        - FundoNativeLMS
      summary: Update a native lesson (Phase 6A)
      operationId: updateFundoLesson
      parameters:
        - name: lessonId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FundoLessonUpsert'
      responses:
        '200':
          description: Lesson updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelope_Map'
        '404':
          description: Lesson not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Lesson sequence already used (`LESSON_SEQUENCE_TAKEN`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /internal/v1/learning/v11/courses/{courseId}/structure:
    get:
      tags:
        - FundoNativeLMS
      summary: Get course with its modules and lessons
      operationId: getFundoCourseStructure
      parameters:
        - name: courseId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Course structure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelope_Map'
        '404':
          description: Course not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /internal/v1/learning/v11/courses/{courseId}/assessments:
    get:
      tags:
        - FundoNativeLMS
      summary: List published native assessments for a course
      operationId: listFundoCourseAssessments
      parameters:
        - name: courseId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Assessment list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelope_Map'
  /internal/v1/learning/v11/pathways:
    post:
      tags:
        - FundoNativeLMS
      summary: Create a native learning pathway (Phase 6A)
      operationId: createFundoPathway
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FundoPathwayUpsert'
      responses:
        '200':
          description: Pathway created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelope_Map'
