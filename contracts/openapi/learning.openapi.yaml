              $ref: '#/components/schemas/SubjectProfileUpsertRequest'
      responses:
        '200':
          description: Profile upserted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelope_Map'
  /v1/internal/fundo/learners/{providerWorkerId}/cpd-summary:
    get:
      tags:
        - Integration
      summary: Training-evidence / workforce-readiness summary for a provider worker
      description: >
        Trusted server-to-server read consumed by `vashandi-workforce-service`
        (`FundoIntegrationClient#fetchTrainingEvidence`) to populate workforce
        readiness and eligibility. Returns a compact, Fundo-owned readiness signal
        (mandatory learning satisfied / at-risk / overdue, certificate validity) plus
        CPD-eligible completions as candidates only — Varapi remains the CPD ledger
        authority and no regulated CPD points are awarded here. Tenant is resolved
        from the `X-Tenant-ID` companion trust header; not OAuth/JWT protected.
      operationId: fundoLearnerCpdSummary
      parameters:
        - name: providerWorkerId
          in: path
          required: true
          schema:
            type: string
          description: Provider worker identifier, used as the Fundo subjectId (PROVIDER subject type).
        - name: subjectType
          in: query
          required: false
          schema:
            type: string
            default: PROVIDER
      responses:
        '200':
          description: Readiness summary (raw object, no data envelope — consumed directly by Vashandi)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Map_StringObject'
        '400':
          description: Missing tenant context
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/internal/fundo/learners/{subjectId}/training-gate:
    get:
      tags:
        - Integration
      summary: Training-gate read-model for Tshepo policy (required learning satisfied?)
      description: >
        Trusted server-to-server read consumed by `tshepo-authz-service` to gate
        role/workspace enablement on completed learning. Given native Fundo course
        codes, returns a per-requirement decision and an overall `satisfied` flag. A
        requirement is satisfied only when the subject has a COMPLETED enrolment and
        (where applicable) a non-expired certificate. Fundo is the data source; the
        access decision remains authoritative in Tshepo. See
        docs/policy/fundo-training-gated-access.md.
      operationId: fundoLearnerTrainingGate
      parameters:
        - name: subjectId
          in: path
          required: true
          schema:
            type: string
        - name: subjectType
          in: query
          required: false
          schema:
            type: string
            default: PROVIDER
        - name: courseCodes
          in: query
          required: false
          description: Comma-separated native Fundo course codes to evaluate.
          schema:
            type: string
      responses:
        '200':
          description: Training-gate decision (raw object, no data envelope)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Map_StringObject'
        '400':
          description: Missing tenant context
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /internal/v1/learning/integrations/varapi-fundo-completion:
    post:
      tags:
        - Integration
      summary: Ingest a Fundo course completion forwarded from Varapi
      description: >
        Called by `varapi-service` after a Fundo webhook produces a governed CPD candidate. Authenticated by a shared
        internal key supplied via the `X-Impilo-Learning-Internal-Key` header (not OAuth/JWT). Records the learning-side
        completion fact only — the CPD credit decision remains authoritative in Varapi.
      operationId: ingestVarapiFundoCompletion
      security:
        - integrationKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VarapiFundoCompletionPayload'
      responses:
        '200':
          description: Completion ingested
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Map_StringObject'
        '400':
          description: Invalid payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Bad or missing internal key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
