components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        Used by the default security chain when `learning.security.oauth2-enabled=true`.
        Compose dev environments run with this disabled (see
        `ops/runtime/docker-compose.operations.yml`); Helm defaults to true.
    integrationKey:
      type: apiKey
      in: header
      name: X-Impilo-Learning-Internal-Key
      description: >
        Shared internal key for trusted ingress from `varapi-service` after a
        Fundo webhook creates a governed CPD candidate.
    orchestrationKey:
      type: apiKey
      in: header
      name: X-Impilo-Learning-Orchestration-Key
      description: >
        Shared internal key for server-to-server orchestration jobs (Tshepo /
        Varapi schedulers, Moodle Web Service relays).

  schemas:
    # ── Generic response wrappers ──────────────────────────────────────────
    ApiEnvelope_Map:
      type: object
      properties:
        data:
          type: object
          additionalProperties: true
      required: [data]

    ApiEnvelope_ItemsList:
      type: object
      properties:
        data:
          type: object
          properties:
            items:
              type: array
              items:
                type: object
                additionalProperties: true
          required: [items]
      required: [data]

    ApiEnvelope_SearchPage:
      type: object
      properties:
        data:
          type: object
          properties:
            results:
              type: array
              items:
                type: object
                additionalProperties: true
            page: { type: integer }
            size: { type: integer }
            totalElements: { type: integer }
            totalPages: { type: integer }
          required: [results, page, size, totalElements, totalPages]
      required: [data]

    ApiEnvelope_Status:
      type: object
      properties:
        data:
          type: object
          properties:
            status: { type: string }
          required: [status]
      required: [data]

    Map_StringObject:
      type: object
      additionalProperties: true
      description: >
        Free-form JSON map returned by the integration and orchestration
        endpoints. The exact field set is implementation-defined and may
        evolve; consumers should treat it as a loosely-typed bag.

    Error:
      type: object
      properties:
        error: { type: string }

    # ── Request bodies ────────────────────────────────────────────────────
    ResourceOpenedRequest:
      type: object
      properties:
        resourceId: { type: string, format: uuid }
        workflowContext:
          type: object
          additionalProperties: true
      required: [resourceId]

    SubjectProfileUpsertRequest:
      type: object
      description: >
        `fundoUserRef` and `metadata` are both **patch-style**: presence of
        the key triggers an update (including to `null`); absence leaves the
        existing value unchanged.
      properties:
        subjectType: { type: string }
        subjectId: { type: string }
        fundoUserRef: { type: string, nullable: true }
        metadata:
          type: object
          additionalProperties: true
      required: [subjectType, subjectId]

    VarapiFundoCompletionPayload:
      type: object
      description: >
        Mirrors `zw.gov.mohcc.impilo.learning.api.dto.VarapiFundoCompletionPayload`.
      properties:
        tenantId: { type: string, format: uuid }
        providerPublicId: { type: string }
        councilId: { type: integer, format: int64, nullable: true }
        courseId: { type: string }
        courseName: { type: string, nullable: true }
        completedAt: { type: string, format: date-time }
        creditsSuggested: { type: integer, format: int32 }
        externalRef: { type: string }
        varapiFundoCandidateId: { type: integer, format: int64 }
      required: [tenantId, providerPublicId, courseId, completedAt, externalRef, varapiFundoCandidateId]

    AssignPathRequest:
      type: object
      properties:
        tenantId: { type: string, format: uuid }
        subjectType: { type: string }
        subjectId: { type: string }
        pathId: { type: string, format: uuid }
        assignedByActorId: { type: string, nullable: true }
        correlationId: { type: string, nullable: true }
        metadata:
          type: object
          additionalProperties: true
      required: [tenantId, subjectType, subjectId, pathId]

    RegisterPrerequisiteRequest:
      type: object
      description: >
        Exactly one of `resourceId` or `pathId` is meaningful at a time;
        both are technically optional in the current implementation, which
        accepts whichever is supplied.
      properties:
        tenantId: { type: string, format: uuid }
        subjectType: { type: string }
        subjectId: { type: string }
        workflowCode: { type: string, nullable: true }
        resourceId: { type: string, format: uuid, nullable: true }
        pathId: { type: string, format: uuid, nullable: true }
        actorId: { type: string, nullable: true }
        correlationId: { type: string, nullable: true }
        extra:
          type: object
          additionalProperties: true
      required: [tenantId, subjectType, subjectId]

    MoodleActivityCompletionRequest:
      type: object
      properties:
        courseId: { type: string }
        moodleUserId: { type: string }
        tenantId: { type: string, format: uuid, nullable: true }
        subjectType: { type: string, nullable: true }
        subjectId: { type: string, nullable: true }
        correlationId: { type: string, nullable: true }
      required: [courseId, moodleUserId]

    MoodleActivityCompletionResponse:
      type: object
      properties:
        tenantId: { type: string, format: uuid }
        moodle:
          type: object
          additionalProperties: true
          description: Raw Moodle Web Service response body
        sync:
          type: object
          additionalProperties: true
          description: Optional sync result emitted by the facade when tenant/subject identifiers are supplied

    # ─── Phase 6A authoring DTOs (native Fundo only — no Moodle) ───────────

    FundoCourseUpsert:
      type: object
      description: >
        Course create/update payload. On create, `code` and `title` are
        required. On update, every field is optional (partial patch);
        omitted fields are left unchanged.
      properties:
        code: { type: string, nullable: true, description: "Required on create" }
        title: { type: string, nullable: true, description: "Required on create" }
        description: { type: string, nullable: true }
        category: { type: string, nullable: true }
        level: { type: string, nullable: true }
        status: { type: string, nullable: true, description: "DRAFT | PUBLISHED | ARCHIVED" }
        language: { type: string, nullable: true }
        estimatedDurationMinutes: { type: integer, nullable: true }
        mandatory: { type: boolean, nullable: true }
        cpdEligible: { type: boolean, nullable: true }
        cpdPoints: { type: integer, nullable: true }

    FundoModuleUpsert:
      type: object
      properties:
        title: { type: string, nullable: true, description: "Required on create" }
        description: { type: string, nullable: true }
        sequence: { type: integer, nullable: true, description: "Auto-assigned when omitted" }
        status: { type: string, nullable: true }

    FundoLessonUpsert:
      type: object
      properties:
        title: { type: string, nullable: true, description: "Required on create" }
        contentType: { type: string, nullable: true, description: "Required on create. TEXT | VIDEO | DOCUMENT | LINK | INTERACTIVE | PRACTICAL_TASK" }
        contentBody: { type: string, nullable: true }
        contentRef: { type: string, nullable: true }
        contentFormat: { type: string, nullable: true, description: "PLAIN_TEXT | MARKDOWN | STRUCTURED_BLOCKS" }
        contentBlocksJson: { type: string, nullable: true, description: "Structured block content JSON for richer authoring." }
        estimatedDurationMinutes: { type: integer, nullable: true }
        sequence: { type: integer, nullable: true }
        required: { type: boolean, nullable: true }
        status: { type: string, nullable: true }

    FundoPathwayUpsert:
      type: object
      properties:
        code: { type: string, nullable: true, description: "Required on create" }
        title: { type: string, nullable: true, description: "Required on create" }
        description: { type: string, nullable: true }
        targetCadres: { type: string, nullable: true }
        targetRoles: { type: string, nullable: true }
        targetFacilityLevels: { type: string, nullable: true }
        status: { type: string, nullable: true }

    FundoPathwayItemUpsert:
      type: object
      required: [courseId]
      properties:
        courseId: { type: string, format: uuid }
        sequence: { type: integer, nullable: true, description: "Auto-assigned when omitted" }
        required: { type: boolean, nullable: true }
        prerequisiteCourseId: { type: string, format: uuid, nullable: true }

    FundoAssessmentUpsert:
      type: object
      properties:
        courseId: { type: string, format: uuid, nullable: true, description: "Required on create" }
        moduleId: { type: string, format: uuid, nullable: true }
        title: { type: string, nullable: true, description: "Required on create" }
        description: { type: string, nullable: true }
        assessmentType: { type: string, nullable: true, description: "Required on create. QUIZ | PRACTICAL_CHECKLIST | CASE_REVIEW" }
        passMark: { type: integer, nullable: true }
        maxAttempts: { type: integer, nullable: true }
        status: { type: string, nullable: true }

    FundoQuestionUpsert:
      type: object
      required: [questionType, prompt]
      properties:
        questionType: { type: string, description: "MULTIPLE_CHOICE | TRUE_FALSE | SHORT_ANSWER | MATCHING | CASE_PROMPT" }
        prompt: { type: string }
        optionsJson: { type: string, nullable: true }
        correctAnswerJson: { type: string, nullable: true }
        rubricJson: { type: string, nullable: true, description: "Rubric criteria for manual marking/moderation." }
        sequence: { type: integer, nullable: true, description: "Auto-assigned when omitted" }
        points: { type: integer, nullable: true, default: 1 }
