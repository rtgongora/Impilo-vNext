      responses:
        '200':
          description: Pathway updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelope_Map'
        '404':
          description: Pathway not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Pathway code already taken (`PATHWAY_CODE_TAKEN`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /internal/v1/learning/v11/pathways/{pathwayId}/items:
    post:
      tags:
        - FundoNativeLMS
      summary: Add an ordered course item to a pathway (Phase 6A)
      operationId: addFundoPathwayItem
      parameters:
        - name: pathwayId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FundoPathwayItemUpsert'
      responses:
        '200':
          description: Pathway item created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelope_Map'
        '404':
          description: Pathway or course not found in tenant
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Pathway item sequence already used (`PATHWAY_ITEM_SEQUENCE_TAKEN`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /internal/v1/learning/v11/enrolments:
    post:
      tags:
        - FundoNativeLMS
      summary: Create a native Fundo enrolment (idempotent)
      description: >
        Idempotent: a duplicate POST for an existing ENROLLED/IN_PROGRESS `(tenant, subject, course)` triple returns the
        existing enrolment with `idempotent: true`. Requires platform v1.1 headers including `Idempotency-Key`. Native
        runtime — no Moodle.
      operationId: createFundoEnrolment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - courseId
                - subjectType
                - subjectId
              properties:
                courseId:
                  type: string
                  format: uuid
                subjectType:
                  type: string
                  enum:
                    - PROVIDER
                    - STUDENT
                    - STAFF
                    - FACILITY_TEAM
