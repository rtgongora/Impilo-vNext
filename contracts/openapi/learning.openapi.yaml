                  type: string
                  format: uuid
                moduleId:
                  type: string
                  format: uuid
                  nullable: true
                lessonId:
                  type: string
                  format: uuid
                  nullable: true
                progressPercent:
                  type: integer
                  minimum: 0
                  maximum: 100
                score:
                  type: integer
                  nullable: true
