openapi: 3.0.3
info:
  title: "Reporting"
  description: |
    Phase F baseline contract for `reporting-service`. Extend with real paths and schemas as the HTTP surface is stabilised.
  version: 0.1.0
servers:
  - url: http://localhost:8176
    description: Local default (`default_http_port` in docs/registry/services-registry.yaml)

paths:
  /internal/v1/health:
    get:
      operationId: internalHealth
      summary: Internal health probe
      tags:
        - Health
      responses:
        '200':
          description: Service reachable
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /tenant-runs:
    get:
      operationId: reporting_get__tenant_runs
      tags:
        - Generated-From-Handler
      summary: Documented from reporting-service handler (complete-not-delete sync)
      responses:
        '200':
          description: Success
  /{key}/run:
    post:
      operationId: reporting_post__key_run
      tags:
        - Generated-From-Handler
      summary: Documented from reporting-service handler (complete-not-delete sync)
      responses:
        '200':
          description: Success
  /{key}/runs:
    get:
      operationId: reporting_get__key_runs
      tags:
        - Generated-From-Handler
      summary: Documented from reporting-service handler (complete-not-delete sync)
      responses:
        '200':
          description: Success
  /{key}/schedules:
    post:
      operationId: reporting_post__key_schedules
      tags:
        - Generated-From-Handler
      summary: Documented from reporting-service handler (complete-not-delete sync)
      responses:
        '200':
          description: Success

components:
  schemas: {}
