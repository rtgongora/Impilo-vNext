# =============================================================================
# BUTANO FHIR — Internal FHIR resource store API (OpenAPI 3.0)
#
# Ring 0 primitive for versioned FHIR JSON payloads per tenant.
# Includes ButanoFhirV11ProbeController (health + test-command only).
# =============================================================================
openapi: "3.0.3"

info:
  title: BUTANO FHIR — Internal FHIR resource API
  version: "1.0.0"
  description: |
    Internal FHIR resource persistence: list and fetch stored resources, and
    create or update by logical id. Payloads are FHIR JSON strings stored in
    the service database.

    v1.1 companion probe routes exercise RequestContext enforcement.
  contact:
    name: Impilo Platform Team
  license:
    name: Proprietary

servers:
  - url: http://localhost:8289
    description: Local development
  - url: https://{tenant}.impilo.health/api
    description: Production (per-tenant)
    variables:
      tenant:
        default: demo

security:
  - bearerAuth: []

tags:
  - name: Internal-Probe
    description: Tech-companion v1.1 header and echo proofs
  - name: FhirResources
    description: CRUD-style internal FHIR document storage

paths:
  /internal/v1/health:
    get:
      operationId: butanoFhirInternalHealth
      tags: [Internal-Probe]
      summary: v1.1 probe — returns trust context echo
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/PodId"
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "200":
          description: Service UP with context echo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProbeHealthBody"

  /internal/v1/test-command:
    post:
      operationId: butanoFhirInternalTestCommand
      tags: [Internal-Probe]
      summary: v1.1 probe — idempotency / echo
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/PodId"
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "201":
          description: Echo payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProbeCommandBody"

  /internal/v1/fhir/resources:
    get:
      operationId: butanoFhirListResources
      tags: [FhirResources]
      summary: List resources by tenant and FHIR resource type
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/PodId"
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/CorrelationId"
        - name: tenantId
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: resourceType
          in: query
          required: true
          schema:
            type: string
            example: Patient
      responses:
        "200":
          description: Stored resource rows
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FhirResourceEntity"
            application/fhir+json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FhirResourceEntity"
    post:
      operationId: butanoFhirCreateOrUpdateResource
      tags: [FhirResources]
      summary: Create or update a resource from logical id and payload
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/PodId"
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateFhirResourceRequest"
      responses:
        "201":
          description: Persisted resource
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FhirResourceEntity"
            application/fhir+json:
              schema:
                $ref: "#/components/schemas/FhirResourceEntity"

  /internal/v1/fhir/resources/{id}:
    get:
      operationId: butanoFhirGetResource
      tags: [FhirResources]
      summary: Get a stored resource by surrogate id
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/PodId"
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/CorrelationId"
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: tenantId
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Stored resource row
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FhirResourceEntity"
            application/fhir+json:
              schema:
                $ref: "#/components/schemas/FhirResourceEntity"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    TenantId:
      name: X-Tenant-ID
      in: header
      required: true
      schema:
        type: string
    PodId:
      name: X-Pod-ID
      in: header
      required: true
      schema:
        type: string
    RequestId:
      name: X-Request-ID
      in: header
      required: true
      schema:
        type: string
        format: uuid
    CorrelationId:
      name: X-Correlation-ID
      in: header
      required: true
      schema:
        type: string
        format: uuid

  responses:
    Unauthorized:
      description: Missing or invalid authentication

  schemas:
    ProbeHealthBody:
      type: object
      properties:
        service:
          type: string
          example: butano-fhir
        status:
          type: string
          example: UP
        tenant_id:
          type: string
        pod_id:
          type: string
        request_id:
          type: string
        correlation_id:
          type: string
      additionalProperties: true

    ProbeCommandBody:
      type: object
      properties:
        service:
          type: string
        action:
          type: string
        request_id:
          type: string
        correlation_id:
          type: string
        echo:
          type: object
          additionalProperties: true
      additionalProperties: true

    ProbeFederationBody:
      type: object
      properties:
        service:
          type: string
        action:
          type: string
        pod_id:
          type: string
        request_id:
          type: string
        correlation_id:
          type: string
      additionalProperties: true

    CreateFhirResourceRequest:
      type: object
      required: [tenantId, resourceType, resourceId, fhirVersion, payload, correlationId]
      properties:
        tenantId:
          type: string
          format: uuid
        resourceType:
          type: string
        resourceId:
          type: string
          description: FHIR logical id
        fhirVersion:
          type: string
          example: "4.0.1"
        payload:
          type: string
          description: FHIR resource JSON document
        correlationId:
          type: string

    FhirResourceEntity:
      type: object
      properties:
        id:
          type: integer
          format: int64
        tenantId:
          type: string
          format: uuid
        resourceType:
          type: string
        resourceId:
          type: string
        fhirVersion:
          type: string
        payload:
          type: string
          description: FHIR JSON document
        status:
          type: string
          example: ACTIVE
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
