# =============================================================================
# Data Governance — datasets, grants, policies (OpenAPI 3.0)
# Phase B baseline: `GovernanceController` dataset registration (expand to grants/rules/exports).
# =============================================================================
openapi: "3.0.3"

info:
  title: Data Governance Service API
  version: "1.0.0"
  description: |
    Dataset registration, access grants, policy publication, and governance
    decisions. Consumed by platform data plane services and BFF via
    `data-governance-base-url` where wired.
  contact:
    name: Impilo Platform Team
  license:
    name: Proprietary

servers:
  - url: http://localhost:8220
    description: Local development
  - url: https://{tenant}.impilo.health/api
    description: Production (per-tenant)
    variables:
      tenant:
        default: demo

security:
  - bearerAuth: []

tags:
  - name: Internal-Governance
    description: Datasets and policy

paths:
  /internal/v1/governance/datasets:
    post:
      operationId: dataGovernanceCreateDataset
      tags:
        - Internal-Governance
      summary: Register a governed dataset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '201':
          description: Dataset registered
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '400':
          description: Validation error
    get:
      operationId: datagovernance_get__internal_v1_governance_datasets
      tags:
        - Generated-From-Handler
      summary: Documented from data-governance-service handler (complete-not-delete sync)
      responses:
        '200':
          description: Success
  /external/v1/exports:
    post:
      operationId: datagovernance_post__external_v1_exports
      tags:
        - Generated-From-Handler
      summary: Documented from data-governance-service handler (complete-not-delete sync)
      responses:
        '200':
          description: Success
  /internal/v1/governance/grants:
    post:
      operationId: datagovernance_post__internal_v1_governance_grants
      tags:
        - Generated-From-Handler
      summary: Documented from data-governance-service handler (complete-not-delete sync)
      responses:
        '200':
          description: Success
  /internal/v1/governance/grants/revoke:
    post:
      operationId: datagovernance_post__internal_v1_governance_grants_revoke
      tags:
        - Generated-From-Handler
      summary: Documented from data-governance-service handler (complete-not-delete sync)
      responses:
        '200':
          description: Success
  /internal/v1/governance/policies:
    post:
      operationId: datagovernance_post__internal_v1_governance_policies
      tags:
        - Generated-From-Handler
      summary: Documented from data-governance-service handler (complete-not-delete sync)
      responses:
        '200':
          description: Success
  /internal/v1/governance/decide:
    post:
      operationId: datagovernance_post__internal_v1_governance_decide
      tags:
        - Generated-From-Handler
      summary: Documented from data-governance-service handler (complete-not-delete sync)
      responses:
        '200':
          description: Success
  /external/v1/governance/datasets:
    get:
      operationId: datagovernance_get__external_v1_governance_datasets
      tags:
        - Generated-From-Handler
      summary: Documented from data-governance-service handler (complete-not-delete sync)
      responses:
        '200':
          description: Success
  /internal/v1/governance/rules:
    post:
      operationId: datagovernance_post__internal_v1_governance_rules
      tags:
        - Generated-From-Handler
      summary: Documented from data-governance-service handler (complete-not-delete sync)
      responses:
        '200':
          description: Success
    get:
      operationId: datagovernance_get__internal_v1_governance_rules
      tags:
        - Generated-From-Handler
      summary: Documented from data-governance-service handler (complete-not-delete sync)
      responses:
        '200':
          description: Success
  /internal/v1/governance/rules/{ruleId}:
    get:
      operationId: datagovernance_get__internal_v1_governance_rules_ruleId_
      tags:
        - Generated-From-Handler
      summary: Documented from data-governance-service handler (complete-not-delete sync)
      responses:
        '200':
          description: Success
    delete:
      operationId: datagovernance_delete__internal_v1_governance_rules_ruleId_
