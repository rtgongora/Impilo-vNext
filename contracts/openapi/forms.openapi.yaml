# =============================================================================
# Forms — versioned form schema API (OpenAPI 3.0)
# Phase B baseline: `FormSchemaController` internal routes.
# =============================================================================
openapi: "3.0.3"

info:
  title: Forms Service API
  version: "1.0.0"
  description: |
    Versioned form definitions and validation (Health OS extension points). BFF
    uses `ExtensionServiceClient` (RestTemplate) against `forms-base-url`.
  contact:
    name: Impilo Platform Team
  license:
    name: Proprietary

servers:
  - url: http://localhost:8240
    description: Local development
  - url: https://{tenant}.impilo.health/api
    description: Production (per-tenant)
    variables:
      tenant:
        default: demo

security:
  - bearerAuth: []

tags:
  - name: Internal-Forms
    description: Schema lifecycle and validation

paths:
  /internal/v1/forms:
    get:
      operationId: formsListSchemas
      tags:
        - Internal-Forms
      summary: List form schemas for tenant
      responses:
        '200':
          description: Schema list
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  additionalProperties: true
    post:
      operationId: formsCreateSchema
      tags:
        - Internal-Forms
      summary: Create form schema
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /internal/v1/forms/{id}:
    get:
      operationId: formsGetSchema
      tags:
        - Internal-Forms
      summary: Get schema by id
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Schema
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '404':
          description: Not found
  /internal/v1/forms/{id}/versions:
    post:
      operationId: formsCreateVersion
      tags:
        - Internal-Forms
      summary: Create new published version draft
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '201':
          description: Version created
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /internal/v1/forms/{id}/publish:
    post:
      operationId: formsPublishSchema
      tags:
        - Internal-Forms
      summary: Publish schema
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Published schema
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /internal/v1/forms/{id}/validate:
    post:
      operationId: formsValidatePayload
      tags:
        - Internal-Forms
      summary: Validate payload against schema
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: Validation outcome
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /internal/v1/forms/{id}/retire:
    post:
      operationId: formsRetireSchema
      tags:
        - Internal-Forms
      summary: Retire schema
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Retired schema
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /:
    post:
      operationId: forms_post__
      tags:
        - Generated-From-Handler
      summary: Documented from forms-service handler (complete-not-delete sync)
      responses:
        '200':
          description: Success
    get:
      operationId: forms_get__
      tags:
        - Generated-From-Handler
      summary: Documented from forms-service handler (complete-not-delete sync)
      responses:
        '200':
          description: Success
  /{id}:
    get:
      operationId: forms_get__id_
      tags:
        - Generated-From-Handler
      summary: Documented from forms-service handler (complete-not-delete sync)
      responses:
        '200':
          description: Success
  /{id}/versions:
    post:
      operationId: forms_post__id_versions
      tags:
        - Generated-From-Handler
      summary: Documented from forms-service handler (complete-not-delete sync)
      responses:
        '200':
          description: Success
  /{id}/publish:
    post:
      operationId: forms_post__id_publish
      tags:
        - Generated-From-Handler
      summary: Documented from forms-service handler (complete-not-delete sync)
      responses:
        '200':
          description: Success
  /{id}/retire:
    post:
      operationId: forms_post__id_retire
      tags:
        - Generated-From-Handler
      summary: Documented from forms-service handler (complete-not-delete sync)
      responses:
        '200':
          description: Success
  /{id}/validate:
    post:
      operationId: forms_post__id_validate
      tags:
        - Generated-From-Handler
      summary: Documented from forms-service handler (complete-not-delete sync)
      responses:
        '200':
          description: Success

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
