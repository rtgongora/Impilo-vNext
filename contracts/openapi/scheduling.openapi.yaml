openapi: 3.0.3
info:
  title: Scheduling Service API
  version: 1.0.0
  description: Contract for scheduling slot discovery and reservation flows.
servers:
  - url: http://localhost:8128
paths:
  /v1/health:
    get:
      summary: Health probe
      responses:
        '200':
          description: Service is healthy
  /v1/slots:
    get:
      summary: List available slots
      parameters:
        - in: query
          name: facilityId
          schema:
            type: string
      responses:
        '200':
          description: Slots returned
  /v1/slots/reserve:
    post:
      summary: Reserve a slot
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Slot reserved
  /v1/slots/release:
    post:
      summary: Release a reservation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Reservation released
  /health:
    get:
      operationId: scheduling_get__health
      tags:
        - Generated-From-Handler
      summary: Documented from scheduling-service handler (complete-not-delete sync)
      responses:
        '200':
          description: Success
  /slots:
    get:
      operationId: scheduling_get__slots
      tags:
        - Generated-From-Handler
      summary: Documented from scheduling-service handler (complete-not-delete sync)
      responses:
        '200':
          description: Success
  /slots/reserve:
    post:
      operationId: scheduling_post__slots_reserve
      tags:
        - Generated-From-Handler
      summary: Documented from scheduling-service handler (complete-not-delete sync)
      responses:
        '200':
          description: Success
  /slots/release:
    post:
      operationId: scheduling_post__slots_release
      tags:
        - Generated-From-Handler
      summary: Documented from scheduling-service handler (complete-not-delete sync)
      responses:
        '200':
          description: Success
  /engine/capacity-rules:
    get:
      operationId: scheduling_get__engine_capacity_rules
      tags:
        - Generated-From-Handler
      summary: Documented from scheduling-service handler (complete-not-delete sync)
      responses:
        '200':
          description: Success

components:
  schemas: {}
