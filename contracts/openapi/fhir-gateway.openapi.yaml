# =============================================================================
# FHIR Gateway — route registry and forward (OpenAPI 3.0)
#
# Downstream FHIR traffic is primarily FHIR/HTTP; this document covers the
# **admin/internal** REST control plane. For FHIR resource APIs use the gateway's
# FHIR base URL and HAPI conventions, or document separately.
# =============================================================================
openapi: "3.0.3"

info:
  title: FHIR Gateway — internal control API
  version: "1.0.0"
  description: |
    Internal route listing, registration, and forward test. Lightweight probes
    for CI. Not a substitute for full FHIR CapabilityStatement on the gateway port.
  contact:
    name: Impilo Platform Team
  license:
    name: Proprietary

servers:
  - url: http://localhost:8091
    description: Local development
  - url: https://{tenant}.impilo.health/api
    description: Production (per-tenant)
    variables:
      tenant:
        default: demo

security:
  - bearerAuth: []

tags:
  - name: Internal-Probe
    description: Health and test hooks
  - name: Internal-Gateway
    description: Route registry and forward

paths:
  /internal/v1/health:
    get:
      operationId: fhirGatewayHealth
      tags: [Internal-Probe]
      summary: Liveness-style health
      responses:
        "200":
          description: UP
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true

  /internal/v1/test-command:
    post:
      operationId: fhirGatewayTestCommand
      tags: [Internal-Probe]
      summary: Echo test command
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "200":
          description: Echo
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true

  /internal/v1/gateway/routes:
    get:
      operationId: fhirGatewayListRoutes
      tags: [Internal-Gateway]
      summary: List FHIR route bindings
      parameters:
        - name: tenantId
          in: query
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Routes under `data`
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
    post:
      operationId: fhirGatewayCreateRoute
      tags: [Internal-Gateway]
      summary: Register route
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true

  /internal/v1/gateway/forward:
    post:
      operationId: fhirGatewayForward
      tags: [Internal-Gateway]
      summary: Forward FHIR request per route rules
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "200":
          description: Forward result envelope
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
