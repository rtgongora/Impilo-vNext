openapi: 3.0.3
info:
  title: "Organization Registry"
  description: |
    Contract for `organization-registry-service` — the organization / provider-organization
    registry: organizations and their representatives, organization affiliations, provider
    claim submission with the IATG adjudication/transition loop, facility-admin affiliation
    (internal), and the read-only WGV mirror + mirror inventory (internal).

    Handler routes are synced from the Spring controllers via
    `scripts/completeness/sync-handler-routes-to-contract.mjs` (complete-not-delete). Extend
    with request/response schemas as the HTTP surface is stabilised.
  version: 0.1.0
servers:
  - url: http://localhost:8153
    description: Local default (`default_http_port` in docs/registry/services-registry.yaml)

paths:
  /{affiliationId}:
    patch:
      operationId: organizationregistry_patch__affiliationId_
      tags:
        - Generated-From-Handler
      summary: Documented from organization-registry-service handler (complete-not-delete sync)
      responses:
        '200':
          description: Success
