openapi: 3.0.3
info:
  title: Impilo Booking & Appointment API
  version: 1.0.0
  description: |
    Sovereign booking transaction container and appointment scheduled-event API.
    Booking answers access/reservation/approval; Appointment answers when/where/with whom.
servers:
  - url: http://localhost:8265
paths:
  /v1/bookings:
    get:
      summary: List bookings (client, provider, or facility scoped via query)
      parameters:
        - $ref: '#/components/parameters/TenantIdHeader'
        - name: clientId
          in: query
          schema:
            type: string
        - name: facilityId
          in: query
          schema:
            type: string
        - name: providerId
          in: query
          schema:
            type: string
        - name: bookingStatus
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Booking list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelopeBookingList'
    post:
      summary: Create booking (client self-book or provider-on-behalf)
      parameters:
        - $ref: '#/components/parameters/TenantIdHeader'
        - $ref: '#/components/parameters/ActorIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBookingRequest'
      responses:
        '201':
          description: Booking created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelopeBooking'
  /v1/bookings/{bookingId}:
    get:
      summary: Get booking by ID
      parameters:
        - $ref: '#/components/parameters/TenantIdHeader'
        - $ref: '#/components/parameters/BookingIdPath'
      responses:
        '200':
          description: Booking detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelopeBooking'
    put:
      summary: Update booking (draft or pending fields)
      parameters:
        - $ref: '#/components/parameters/TenantIdHeader'
        - $ref: '#/components/parameters/BookingIdPath'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateBookingRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelopeBooking'
  /v1/bookings/{bookingId}/cancel:
    post:
      summary: Cancel booking
      parameters:
        - $ref: '#/components/parameters/TenantIdHeader'
        - $ref: '#/components/parameters/BookingIdPath'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
      responses:
        '200':
          description: Cancelled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelopeBooking'
  /v1/bookings/{bookingId}/triage:
    post:
      summary: Record triage outcome
      parameters:
        - $ref: '#/components/parameters/TenantIdHeader'
        - $ref: '#/components/parameters/BookingIdPath'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                triageStatus:
                  type: string
                notes:
                  type: string
      responses:
        '200':
          description: Triaged
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelopeBooking'
  /v1/bookings/{bookingId}/approve:
    post:
      summary: Approve booking (provider/facility/admin)
      parameters:
        - $ref: '#/components/parameters/TenantIdHeader'
        - $ref: '#/components/parameters/BookingIdPath'
      responses:
        '200':
          description: Approved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelopeBooking'
  /v1/bookings/{bookingId}/reject:
    post:
      summary: Reject booking
      parameters:
        - $ref: '#/components/parameters/TenantIdHeader'
        - $ref: '#/components/parameters/BookingIdPath'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
      responses:
        '200':
          description: Rejected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelopeBooking'
  /v1/bookings/{bookingId}/assign:
    post:
      summary: Assign provider or resource to booking
      parameters:
        - $ref: '#/components/parameters/TenantIdHeader'
        - $ref: '#/components/parameters/BookingIdPath'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                providerId:
                  type: string
                resourceId:
                  type: string
                  format: uuid
      responses:
        '200':
          description: Assigned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelopeBooking'
  /v1/bookings/{bookingId}/reserve:
    post:
      summary: Reserve TUSO resource slot for booking
      parameters:
        - $ref: '#/components/parameters/TenantIdHeader'
        - $ref: '#/components/parameters/BookingIdPath'
      responses:
        '200':
          description: Reserved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelopeBooking'
  /v1/bookings/{bookingId}/convert:
    post:
      summary: Convert approved booking to appointment
      parameters:
        - $ref: '#/components/parameters/TenantIdHeader'
        - $ref: '#/components/parameters/BookingIdPath'
      responses:
        '201':
          description: Appointment created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelopeAppointment'
  /v1/bookings/{bookingId}/mvumo/request:
    post:
      summary: Request Mvumo consent/agreement/authorisation for booking
      parameters:
        - $ref: '#/components/parameters/TenantIdHeader'
        - $ref: '#/components/parameters/BookingIdPath'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                mvumoType:
                  type: string
                  enum:
                    - CONSENT
                    - AGREEMENT
                    - AUTHORISATION
                    - ACKNOWLEDGEMENT
                consentType:
                  type: string
      responses:
        '200':
          description: Mvumo request created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelopeBooking'
  /v1/bookings/{bookingId}/mvumo/status:
    get:
      summary: Mvumo status for booking
      parameters:
        - $ref: '#/components/parameters/TenantIdHeader'
        - $ref: '#/components/parameters/BookingIdPath'
      responses:
        '200':
          description: Mvumo status aggregate
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelopeMap'
  /v1/bookings/availability:
    get:
      summary: Check availability for booking target
      parameters:
        - $ref: '#/components/parameters/TenantIdHeader'
        - name: targetType
          in: query
          required: true
          schema:
            type: string
        - name: targetRef
          in: query
          required: true
          schema:
            type: string
        - name: facilityId
          in: query
          schema:
            type: string
        - name: date
          in: query
          required: true
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Available slots
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelopeMap'
  /v1/appointments:
    get:
      summary: List appointments
      parameters:
        - $ref: '#/components/parameters/TenantIdHeader'
        - name: clientId
          in: query
          schema:
            type: string
        - name: facilityId
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Appointment list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelopeAppointmentList'
  /v1/appointments/{appointmentId}:
    get:
      summary: Get appointment
      parameters:
        - $ref: '#/components/parameters/TenantIdHeader'
        - $ref: '#/components/parameters/AppointmentIdPath'
      responses:
        '200':
          description: Appointment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelopeAppointment'
  /v1/appointments/{appointmentId}/check-in:
    post:
      summary: Check in appointment (bridges to PCT queue)
      parameters:
        - $ref: '#/components/parameters/TenantIdHeader'
        - $ref: '#/components/parameters/AppointmentIdPath'
      responses:
        '200':
          description: Checked in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelopeMap'
  /v1/appointments/{appointmentId}/complete:
    post:
      summary: Mark appointment completed
      parameters:
        - $ref: '#/components/parameters/TenantIdHeader'
        - $ref: '#/components/parameters/AppointmentIdPath'
      responses:
        '200':
          description: Completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelopeAppointment'
  /v1/appointments/{appointmentId}/no-show:
    post:
      summary: Mark appointment no-show
      parameters:
        - $ref: '#/components/parameters/TenantIdHeader'
        - $ref: '#/components/parameters/AppointmentIdPath'
      responses:
        '200':
          description: No-show recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelopeAppointment'
  /v1/appointments/{appointmentId}/reschedule:
    post:
      summary: Reschedule appointment (linked to original booking history)
      parameters:
        - $ref: '#/components/parameters/TenantIdHeader'
        - $ref: '#/components/parameters/AppointmentIdPath'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                startTime:
                  type: string
                  format: date-time
                endTime:
                  type: string
                  format: date-time
      responses:
        '200':
          description: Rescheduled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelopeAppointment'
  /v1/appointments/citizen/{cpid}:
    get:
      summary: List citizen appointments
      parameters:
        - $ref: '#/components/parameters/TenantIdHeader'
        - name: cpid
          in: path
          required: true
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Citizen appointments
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelopeAppointmentList'
  /:
    get:
      operationId: booking_get__
      tags:
        - Generated-From-Handler
      summary: Documented from booking-service handler (complete-not-delete sync)
      responses:
        '200':
          description: Success
    post:
      operationId: booking_post__
      tags:
        - Generated-From-Handler
      summary: Documented from booking-service handler (complete-not-delete sync)
      responses:
        '200':
          description: Success
  /{id}:
    get:
      operationId: booking_get__id_
      tags:
        - Generated-From-Handler
      summary: Documented from booking-service handler (complete-not-delete sync)
      responses:
        '200':
          description: Success
    patch:
      operationId: booking_patch__id_
      tags:
        - Generated-From-Handler
      summary: Documented from booking-service handler (complete-not-delete sync)
      responses:
        '200':
          description: Success
    put:
      operationId: booking_put__id_
      tags:
        - Generated-From-Handler
      summary: Documented from booking-service handler (complete-not-delete sync)
      responses:
        '200':
          description: Success
  /{id}/confirm:
    post:
      operationId: booking_post__id_confirm
      tags:
        - Generated-From-Handler
      summary: Documented from booking-service handler (complete-not-delete sync)
      responses:
        '200':
          description: Success
  /{id}/cancel:
    post:
      operationId: booking_post__id_cancel
      tags:
        - Generated-From-Handler
      summary: Documented from booking-service handler (complete-not-delete sync)
      responses:
        '200':
          description: Success
  /{id}/check-in:
    post:
      operationId: booking_post__id_check_in
      tags:
        - Generated-From-Handler
      summary: Documented from booking-service handler (complete-not-delete sync)
      responses:
        '200':
          description: Success
  /{id}/complete:
    post:
      operationId: booking_post__id_complete
      tags:
        - Generated-From-Handler
      summary: Documented from booking-service handler (complete-not-delete sync)
      responses:
        '200':
          description: Success
  /{id}/no-show:
    post:
      operationId: booking_post__id_no_show
      tags:
        - Generated-From-Handler
      summary: Documented from booking-service handler (complete-not-delete sync)
      responses:
        '200':
          description: Success
  /{id}/reschedule:
    post:
      operationId: booking_post__id_reschedule
      tags:
        - Generated-From-Handler
      summary: Documented from booking-service handler (complete-not-delete sync)
      responses:
        '200':
          description: Success
  /citizen/{cpid}:
    get:
      operationId: booking_get__citizen_cpid_
      tags:
        - Generated-From-Handler
      summary: Documented from booking-service handler (complete-not-delete sync)
      responses:
        '200':
          description: Success
    post:
      operationId: booking_post__citizen_cpid_
      tags:
        - Generated-From-Handler
      summary: Documented from booking-service handler (complete-not-delete sync)
      responses:
        '200':
          description: Success
  /{id}/triage:
    post:
      operationId: booking_post__id_triage
      tags:
        - Generated-From-Handler
      summary: Documented from booking-service handler (complete-not-delete sync)
      responses:
        '200':
          description: Success
  /{id}/approve:
    post:
      operationId: booking_post__id_approve
      tags:
        - Generated-From-Handler
      summary: Documented from booking-service handler (complete-not-delete sync)
      responses:
        '200':
          description: Success
  /{id}/reject:
    post:
      operationId: booking_post__id_reject
      tags:
        - Generated-From-Handler
      summary: Documented from booking-service handler (complete-not-delete sync)
      responses:
        '200':
          description: Success
  /{id}/assign:
    post:
      operationId: booking_post__id_assign
      tags:
        - Generated-From-Handler
      summary: Documented from booking-service handler (complete-not-delete sync)
      responses:
        '200':
          description: Success
  /{id}/redirect:
    post:
      operationId: booking_post__id_redirect
      tags:
        - Generated-From-Handler
      summary: Documented from booking-service handler (complete-not-delete sync)
      responses:
        '200':
          description: Success
  /{id}/reserve:
    post:
      operationId: booking_post__id_reserve
      tags:
        - Generated-From-Handler
      summary: Documented from booking-service handler (complete-not-delete sync)
      responses:
        '200':
          description: Success
  /{id}/convert-to-appointment:
    post:
      operationId: booking_post__id_convert_to_appointment
      tags:
        - Generated-From-Handler
      summary: Documented from booking-service handler (complete-not-delete sync)
      responses:
        '200':
          description: Success
  /{id}/convert:
    post:
      operationId: booking_post__id_convert
      tags:
        - Generated-From-Handler
      summary: Documented from booking-service handler (complete-not-delete sync)
      responses:
        '200':
          description: Success
  /{id}/mvumo/request:
    post:
      operationId: booking_post__id_mvumo_request
      tags:
        - Generated-From-Handler
      summary: Documented from booking-service handler (complete-not-delete sync)
      responses:
        '200':
          description: Success
  /{id}/mvumo/status:
    get:
      operationId: booking_get__id_mvumo_status
      tags:
        - Generated-From-Handler
      summary: Documented from booking-service handler (complete-not-delete sync)
      responses:
        '200':
          description: Success
  /availability:
    get:
      operationId: booking_get__availability
      tags:
        - Generated-From-Handler
      summary: Documented from booking-service handler (complete-not-delete sync)
      responses:
        '200':
          description: Success

components:
  parameters:
    TenantIdHeader:
      name: X-Tenant-ID
      in: header
      required: true
      schema: { type: string, format: uuid }
    ActorIdHeader:
      name: X-Actor-ID
      in: header
      required: true
      schema: { type: string }
    BookingIdPath:
      name: bookingId
      in: path
      required: true
      schema: { type: string, format: uuid }
    AppointmentIdPath:
      name: appointmentId
      in: path
      required: true
      schema: { type: string, format: uuid }
  schemas:
    CreateBookingRequest:
      type: object
      required: [bookingType, facilityId]
      properties:
        clientId: { type: string }
        bookingType: { type: string }
        serviceId: { type: string }
        serviceName: { type: string }
        facilityId: { type: string }
        providerId: { type: string, description: VARAPI providerPublicId }
        targetType: { type: string }
        targetRef: { type: string }
        preferredStartTime: { type: string, format: date-time }
        preferredEndTime: { type: string, format: date-time }
        preferredChannel: { type: string, enum: [PHYSICAL, VIRTUAL, HOME, COMMUNITY, HYBRID] }
        reasonForBooking: { type: string }
        clinicalPriority: { type: string }
    UpdateBookingRequest:
      type: object
      properties:
        preferredStartTime: { type: string, format: date-time }
        preferredEndTime: { type: string, format: date-time }
        reasonForBooking: { type: string }
        providerId: { type: string }
    BookingView:
      type: object
      properties:
        id: { type: string, format: uuid }
        bookingNumber: { type: string }
        clientId: { type: string }
        bookingType: { type: string }
        bookingStatus: { type: string }
        facilityId: { type: string }
        providerId: { type: string }
        consentStatus: { type: string }
        agreementStatus: { type: string }
        authorisationStatus: { type: string }
        paymentStatus: { type: string }
        approvalStatus: { type: string }
        linkedAppointmentId: { type: string, format: uuid }
    AppointmentView:
      type: object
      properties:
        id: { type: string, format: uuid }
        appointmentNumber: { type: string }
        bookingId: { type: string, format: uuid }
        clientId: { type: string }
        providerId: { type: string }
        facilityId: { type: string }
        appointmentType: { type: string }
        status: { type: string }
        startTime: { type: string, format: date-time }
        endTime: { type: string, format: date-time }
        channel: { type: string }
        encounterId: { type: string }
    ApiEnvelopeBooking:
      type: object
      properties:
        data: { $ref: '#/components/schemas/BookingView' }
    ApiEnvelopeBookingList:
      type: object
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/BookingView' }
    ApiEnvelopeAppointment:
      type: object
      properties:
        data: { $ref: '#/components/schemas/AppointmentView' }
    ApiEnvelopeAppointmentList:
      type: object
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/AppointmentView' }
    ApiEnvelopeMap:
      type: object
      properties:
        data: { type: object, additionalProperties: true }
