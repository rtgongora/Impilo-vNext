# =============================================================================
# OROS — Orders & Results Service API (OpenAPI 3.0)
# Manages clinical orders (lab, radiology, pharmacy), results recording,
# critical value flagging, and worklist management within Impilo.
# =============================================================================
openapi: "3.0.3"

info:
  title: OROS — Orders & Results Service
  version: "1.0.0"
  description: |
    OROS is the clinical order and result management service for Impilo.
    It handles the full lifecycle of clinical orders, result capture,
    critical value escalation, and department worklist management.

    **Consistency classes**
    * Class A — destructive/high-trust mutations (require PDP decision header)
    * Class B — creation / registration mutations
    * Class C — reads and snapshots
  contact:
    name: Impilo Platform Team
  license:
    name: Proprietary

servers:
  - url: http://localhost:8089
    description: Local development
  - url: https://{tenant}.impilo.health/api
    description: Production (per-tenant)
    variables:
      tenant:
        default: demo

security:
  - bearerAuth: []

tags:
  - name: Orders
    description: Clinical order lifecycle management
  - name: Results
    description: Clinical result recording and management
  - name: Worklist
    description: Department worklist management

# ============================================================================
# PATHS
# ============================================================================
paths:

  # ---- Orders --------------------------------------------------------------

  /v1/orders:
    post:
      operationId: placeOrder
      tags: [Orders]
      summary: Place a clinical order (Class B)
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/ActorId"
        - $ref: "#/components/parameters/ActorType"
        - $ref: "#/components/parameters/PurposeOfUse"
        - $ref: "#/components/parameters/DeviceFingerprint"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlaceOrderRequest"
      responses:
        "201":
          description: Order placed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseOrderResponse"
        "400":
          $ref: "#/components/responses/BadRequest"

  /v1/orders/{orderId}:
    get:
      operationId: getOrder
      tags: [Orders]
      summary: Get an order by ID (Class C)
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/ActorId"
        - $ref: "#/components/parameters/ActorType"
        - $ref: "#/components/parameters/PurposeOfUse"
        - $ref: "#/components/parameters/DeviceFingerprint"
        - $ref: "#/components/parameters/OrderId"
      responses:
        "200":
          description: Order detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseOrderResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/orders/patient/{cpid}:
    get:
      operationId: getPatientOrders
      tags: [Orders]
      summary: Get all orders for a patient (Class C)
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/ActorId"
        - $ref: "#/components/parameters/ActorType"
        - $ref: "#/components/parameters/PurposeOfUse"
        - $ref: "#/components/parameters/DeviceFingerprint"
        - $ref: "#/components/parameters/PatientCpid"
      responses:
        "200":
          description: Patient order list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseOrderList"

  /v1/orders/{orderId}/cancel:
    post:
      operationId: cancelOrder
      tags: [Orders]
      summary: Cancel an order (Class A)
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/ActorId"
        - $ref: "#/components/parameters/ActorType"
        - $ref: "#/components/parameters/PurposeOfUse"
        - $ref: "#/components/parameters/DeviceFingerprint"
        - $ref: "#/components/parameters/Decision"
        - $ref: "#/components/parameters/OrderId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CancelOrderRequest"
      responses:
        "200":
          description: Order cancelled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseOrderResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  # ---- Results -------------------------------------------------------------

  /v1/orders/{orderId}/results:
    post:
      operationId: recordResult
      tags: [Results]
      summary: Record a result for an order (Class B)
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/ActorId"
        - $ref: "#/components/parameters/ActorType"
        - $ref: "#/components/parameters/PurposeOfUse"
        - $ref: "#/components/parameters/DeviceFingerprint"
        - $ref: "#/components/parameters/OrderId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecordResultRequest"
      responses:
        "201":
          description: Result recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseResultResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
    get:
      operationId: getOrderResults
      tags: [Results]
      summary: Get results for an order (Class C)
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/ActorId"
        - $ref: "#/components/parameters/ActorType"
        - $ref: "#/components/parameters/PurposeOfUse"
        - $ref: "#/components/parameters/DeviceFingerprint"
        - $ref: "#/components/parameters/OrderId"
      responses:
        "200":
          description: Order results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseResultList"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/orders/{orderId}/results/{resultId}/mark-critical:
    post:
      operationId: markResultCritical
      tags: [Results]
      summary: Mark a result as critical value (Class A)
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/ActorId"
        - $ref: "#/components/parameters/ActorType"
        - $ref: "#/components/parameters/PurposeOfUse"
        - $ref: "#/components/parameters/DeviceFingerprint"
        - $ref: "#/components/parameters/Decision"
        - $ref: "#/components/parameters/OrderId"
        - name: resultId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Result marked as critical
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseResultResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  # ---- Worklist ------------------------------------------------------------

  /v1/worklists:
    get:
      operationId: listWorklist
      tags: [Worklist]
      summary: Get department worklist (Class C)
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/ActorId"
        - $ref: "#/components/parameters/ActorType"
        - $ref: "#/components/parameters/PurposeOfUse"
        - $ref: "#/components/parameters/DeviceFingerprint"
        - name: facilityId
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: workspaceId
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: type
          in: query
          required: false
          schema:
            type: string
        - name: status
          in: query
          required: false
          schema:
            type: string
        - name: priority
          in: query
          required: false
          schema:
            type: string
        - $ref: "#/components/parameters/PageNumber"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Worklist
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponsePagedWorklistItem"

  /v1/orders/{orderId}/accept:
    post:
      operationId: acceptOrder
      tags: [Worklist]
      summary: Accept an order in the worklist (Class B)
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/ActorId"
        - $ref: "#/components/parameters/ActorType"
        - $ref: "#/components/parameters/PurposeOfUse"
        - $ref: "#/components/parameters/DeviceFingerprint"
        - $ref: "#/components/parameters/OrderId"
      responses:
        "200":
          description: Order accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseOrderResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/orders/{orderId}/reject:
    post:
      operationId: rejectOrder
      tags: [Worklist]
      summary: Reject an order in the worklist (Class A)
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/ActorId"
        - $ref: "#/components/parameters/ActorType"
        - $ref: "#/components/parameters/PurposeOfUse"
        - $ref: "#/components/parameters/DeviceFingerprint"
        - $ref: "#/components/parameters/Decision"
        - $ref: "#/components/parameters/OrderId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RejectOrderRequest"
      responses:
        "200":
          description: Order rejected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseOrderResponse"
        "404":
          $ref: "#/components/responses/NotFound"

# ============================================================================
# COMPONENTS
# ============================================================================
components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Keycloak-issued access token (forwarded by Envoy)

  parameters:
    TenantId:
      name: X-Tenant-Id
      in: header
      required: true
      description: Tenant identifier — injected by Envoy after TSHEPO authorisation
      schema:
        type: string
    CorrelationId:
      name: X-Correlation-Id
      in: header
      required: true
      description: End-to-end correlation ID for distributed tracing
      schema:
        type: string
        format: uuid
    ActorId:
      name: X-Actor-Id
      in: header
      required: true
      description: Authenticated actor (user or service) identifier
      schema:
        type: string
    ActorType:
      name: X-Actor-Type
      in: header
      required: true
      description: Type of actor making the request
      schema:
        type: string
        enum: [CITIZEN, PROVIDER, ADMIN, SYSTEM, SERVICE]
    PurposeOfUse:
      name: X-Purpose-Of-Use
      in: header
      required: true
      description: Why this request is being made
      schema:
        type: string
    DeviceFingerprint:
      name: X-Device-Fingerprint
      in: header
      required: true
      description: Device identity hash
      schema:
        type: string
    FacilityId:
      name: X-Facility-Id
      in: header
      required: false
      description: Facility scope (contextual)
      schema:
        type: string
        format: uuid
    WorkspaceId:
      name: X-Workspace-Id
      in: header
      required: false
      description: Workspace scope (contextual)
      schema:
        type: string
        format: uuid
    ShiftId:
      name: X-Shift-Id
      in: header
      required: false
      description: Duty shift scope (contextual)
      schema:
        type: string
        format: uuid
    Decision:
      name: X-Decision
      in: header
      required: false
      description: PDP decision header — ALLOW, DENY, STEP_UP_REQUIRED (Class A endpoints require ALLOW)
      schema:
        type: string
        enum: [ALLOW, DENY, STEP_UP_REQUIRED]
    Obligations:
      name: X-Obligations
      in: header
      required: false
      description: JSON obligations blob from TSHEPO
      schema:
        type: string
    PageNumber:
      name: page
      in: query
      schema:
        type: integer
        default: 0
    PageSize:
      name: size
      in: query
      schema:
        type: integer
        default: 20
        maximum: 100
    OrderId:
      name: orderId
      in: path
      required: true
      description: Order identifier
      schema:
        type: integer
        format: int64
    PatientCpid:
      name: cpid
      in: path
      required: true
      description: Patient CPID (clinical patient identifier)
      schema:
        type: string

  responses:
    BadRequest:
      description: Validation error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: Duplicate resource
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Missing or invalid trust headers
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: PDP denied the request (X-Decision=DENY)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:

    # ---- Requests ----------------------------------------------------------

    PlaceOrderRequest:
      type: object
      required: [facilityId, patientCpid, orderType, priority, ziboOrderCode]
      properties:
        facilityId:
          type: string
          format: uuid
        patientCpid:
          type: string
        orderType:
          type: string
          enum: [LAB, RADIOLOGY, PHARMACY, PROCEDURE, REFERRAL]
        priority:
          type: string
          enum: [ROUTINE, URGENT, STAT]
        ziboOrderCode:
          type: string
        encounterRef:
          type: string
        clinicalNotes:
          type: string
        items:
          type: array
          items:
            $ref: "#/components/schemas/OrderItem"

    OrderItem:
      type: object
      required: [itemCode, description]
      properties:
        itemCode:
          type: string
        description:
          type: string
        quantity:
          type: integer
          default: 1
        instructions:
          type: string

    CancelOrderRequest:
      type: object
      required: [reason]
      properties:
        reason:
          type: string

    RecordResultRequest:
      type: object
      required: [kind, summary]
      properties:
        kind:
          type: string
          enum: [LAB, RADIOLOGY, PATHOLOGY, OTHER]
        summary:
          type: string
        ziboResultCodes:
          type: array
          items:
            type: string
        docIds:
          type: array
          items:
            type: string
        isCritical:
          type: boolean
          default: false

    RejectOrderRequest:
      type: object
      required: [reason]
      properties:
        reason:
          type: string

    # ---- Response wrappers -------------------------------------------------

    ApiResponseOrderResponse:
      type: object
      properties:
        success:
          type: boolean
        correlationId:
          type: string
          format: uuid
        data:
          $ref: "#/components/schemas/OrderResponse"

    ApiResponseOrderList:
      type: object
      properties:
        success:
          type: boolean
        correlationId:
          type: string
          format: uuid
        data:
          type: array
          items:
            $ref: "#/components/schemas/OrderResponse"

    ApiResponseResultResponse:
      type: object
      properties:
        success:
          type: boolean
        correlationId:
          type: string
          format: uuid
        data:
          $ref: "#/components/schemas/ResultResponse"

    ApiResponseResultList:
      type: object
      properties:
        success:
          type: boolean
        correlationId:
          type: string
          format: uuid
        data:
          type: array
          items:
            $ref: "#/components/schemas/ResultResponse"

    ApiResponsePagedWorklistItem:
      type: object
      properties:
        success:
          type: boolean
        correlationId:
          type: string
          format: uuid
        data:
          $ref: "#/components/schemas/PagedWorklistItem"

    # ---- Domain objects ----------------------------------------------------

    OrderResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        orderRef:
          type: string
        facilityId:
          type: string
          format: uuid
        patientCpid:
          type: string
        orderType:
          type: string
        priority:
          type: string
        ziboOrderCode:
          type: string
        encounterRef:
          type: string
        clinicalNotes:
          type: string
        status:
          type: string
          enum: [PENDING, ACCEPTED, IN_PROGRESS, COMPLETED, CANCELLED, REJECTED]
        items:
          type: array
          items:
            $ref: "#/components/schemas/OrderItem"
        placedBy:
          type: string
        placedAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time

    ResultResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        orderId:
          type: integer
          format: int64
        kind:
          type: string
        summary:
          type: string
        ziboResultCodes:
          type: array
          items:
            type: string
        docIds:
          type: array
          items:
            type: string
        isCritical:
          type: boolean
        recordedBy:
          type: string
        recordedAt:
          type: string
          format: date-time

    WorklistItem:
      type: object
      properties:
        orderId:
          type: integer
          format: int64
        orderRef:
          type: string
        patientCpid:
          type: string
        orderType:
          type: string
        priority:
          type: string
        status:
          type: string
        ziboOrderCode:
          type: string
        placedAt:
          type: string
          format: date-time

    PagedWorklistItem:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: "#/components/schemas/WorklistItem"
        page:
          type: integer
        size:
          type: integer
        totalElements:
          type: integer
          format: int64

    SnapshotResponse:
      type: object
      properties:
        as_of:
          type: string
          format: date-time
        cursor:
          type: integer
        limit:
          type: integer
        has_more:
          type: boolean
        total:
          type: integer
        items:
          type: array
          items:
            type: object
            additionalProperties: true

    GenericResponse:
      type: object
      properties:
        message:
          type: string
        referenceId:
          type: string

    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          default: false
        correlationId:
          type: string
          format: uuid
        errorCode:
          type: string
        message:
          type: string
        details:
          type: array
          items:
            type: string
