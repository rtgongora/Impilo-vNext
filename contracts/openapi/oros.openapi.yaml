# =============================================================================
# OROS -- Orders & Results Orchestration Service API (OpenAPI 3.0)
#
# Comprehensive order lifecycle management: order placement, worklist-driven
# processing, result reporting, acknowledgement, intelligent routing,
# reconciliation, catalog management, and capability configuration.
#
# All endpoints require a valid Bearer JWT and TSHEPO trust headers
# (X-Tenant-Id, X-Actor-Id, X-Correlation-Id, etc.) injected by
# Envoy ext_authz.
# =============================================================================
openapi: "3.0.3"

info:
  title: "OROS -- Orders & Results Orchestration Service API"
  version: "1.0.0"
  description: |
    OROS manages the complete order-to-result lifecycle for the Impilo platform:

    * **Orders** -- Place, track, cancel, and query clinical orders (lab, imaging, pharmacy, referral)
    * **Worklists** -- Department-scoped worklists for order acceptance and rejection
    * **Worksteps** -- Granular work-step tracking within an order lifecycle
    * **Results** -- Result posting, retrieval, and critical-result flagging
    * **Acknowledgement** -- Clinician acknowledgement of results with audit trail
    * **Routes** -- Intelligent order routing with retry capability
    * **Reconciliation** -- Matching unmatched results to orders with confidence scoring
    * **Catalog** -- Orderable-item catalog with import and lookup
    * **Internal** -- BUTANO writeback, PCT hooks, capability configuration

    All endpoints require TSHEPO trust headers injected by Envoy ext_authz.
  contact:
    name: Impilo Platform Team
  license:
    name: Proprietary

servers:
  - url: http://localhost:8089
    description: Local development
  - url: https://{tenant}.impilo.health/api
    description: Production (per-tenant)
    variables:
      tenant:
        default: demo

# ---------------------------------------------------------------------------
# Security
# ---------------------------------------------------------------------------
security:
  - bearerAuth: []

tags:
  - name: Order
    description: Clinical order placement, tracking, and lifecycle management
  - name: Worklist
    description: Department worklists for order triage and acceptance
  - name: Workstep
    description: Granular work-step tracking within an order
  - name: Result
    description: Result posting, retrieval, and critical-result flagging
  - name: Acknowledgement
    description: Clinician acknowledgement of results
  - name: Route
    description: Intelligent order routing and retry
  - name: Reconciliation
    description: Unmatched result-to-order reconciliation
  - name: Catalog
    description: Orderable-item catalog management
  - name: Internal
    description: Internal hooks for BUTANO writeback, PCT integration, and capabilities

# ===========================================================================
# Paths
# ===========================================================================
paths:
  /v1/orders:
    get:
      operationId: listOrders
      summary: List orders
      description: |
        Returns a paginated list of orders filtered by type, status, priority,
        department, or patient CPID. Results are sorted by placedAt descending.
      tags:
        - Order
      parameters:
        - $ref: '#/components/parameters/X-Tenant-Id'
        - $ref: '#/components/parameters/X-Correlation-Id'
        - $ref: '#/components/parameters/X-Actor-Id'
        - $ref: '#/components/parameters/X-Actor-Type'
        - $ref: '#/components/parameters/X-Purpose-Of-Use'
        - name: type
          in: query
          description: Filter by order type
          schema:
            $ref: '#/components/schemas/OrderType'
        - name: status
          in: query
          description: Filter by order status
          schema:
            $ref: '#/components/schemas/OrderStatus'
        - name: priority
          in: query
          description: Filter by priority
          schema:
            $ref: '#/components/schemas/OrderPriority'
        - name: departmentId
          in: query
          description: Filter by fulfilling department
          schema:
            type: string
            format: uuid
        - name: patientCpid
          in: query
          description: Filter by patient CPID
          schema:
            type: string
        - name: placerProviderId
          in: query
          description: Filter by placer provider ID
          schema:
            type: string
            format: uuid
        - name: q
          in: query
          description: Free-text search across order number, patient CPID, notes
          schema:
            type: string
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
      responses:
        '200':
          description: Paginated list of orders
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      operationId: placeOrder
      summary: Place a new order
      description: |
        Creates a new clinical order. The order is validated against the
        catalog, routed to the appropriate fulfillment department, and
        a worklist entry is created. Emits `oros.order.placed` via Kafka.
      tags:
        - Order
      parameters:
        - $ref: '#/components/parameters/X-Tenant-Id'
        - $ref: '#/components/parameters/X-Correlation-Id'
        - $ref: '#/components/parameters/X-Actor-Id'
        - $ref: '#/components/parameters/X-Actor-Type'
        - $ref: '#/components/parameters/X-Purpose-Of-Use'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlaceOrderRequest'
      responses:
        '201':
          description: Order placed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /v1/orders/{orderId}:
    get:
      operationId: getOrder
      summary: Get order by ID
      description: Returns full order details including items, routing info, and status history.
      tags:
        - Order
      parameters:
        - $ref: '#/components/parameters/X-Tenant-Id'
        - $ref: '#/components/parameters/X-Correlation-Id'
        - $ref: '#/components/parameters/X-Actor-Id'
        - $ref: '#/components/parameters/X-Actor-Type'
        - $ref: '#/components/parameters/X-Purpose-Of-Use'
        - $ref: '#/components/parameters/OrderIdPath'
      responses:
        '200':
          description: Order details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/orders/{orderId}/cancel:
    post:
      operationId: cancelOrder
      summary: Cancel an order
      description: |
        Cancels an order that has not yet been completed. Only orders in
        PLACED, ACCEPTED, or IN_PROGRESS status can be cancelled.
        Emits `oros.order.cancelled` via Kafka.
      tags:
        - Order
      parameters:
        - $ref: '#/components/parameters/X-Tenant-Id'
        - $ref: '#/components/parameters/X-Correlation-Id'
        - $ref: '#/components/parameters/X-Actor-Id'
        - $ref: '#/components/parameters/X-Actor-Type'
        - $ref: '#/components/parameters/X-Purpose-Of-Use'
        - $ref: '#/components/parameters/OrderIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelOrderRequest'
      responses:
        '200':
          description: Order cancelled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/orders/patient/{patientCpid}:
    get:
      operationId: getPatientOrders
      summary: Get orders for a patient
      description: |
        Returns all orders for a given patient CPID, optionally filtered
        by type and status. Results are sorted by placedAt descending.
      tags:
        - Order
      parameters:
        - $ref: '#/components/parameters/X-Tenant-Id'
        - $ref: '#/components/parameters/X-Correlation-Id'
        - $ref: '#/components/parameters/X-Actor-Id'
        - $ref: '#/components/parameters/X-Actor-Type'
        - $ref: '#/components/parameters/X-Purpose-Of-Use'
        - name: patientCpid
          in: path
          required: true
          description: Patient CPID
          schema:
            type: string
        - name: type
          in: query
          schema:
            $ref: '#/components/schemas/OrderType'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/OrderStatus'
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
      responses:
        '200':
          description: Patient orders
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/worklists:
    get:
      operationId: listWorklists
      summary: Get department worklists
      description: |
        Returns worklist entries for the specified department, filtered by
        order type, priority, and status. Used by lab techs, radiologists,
        and pharmacists to view pending work.
      tags:
        - Worklist
      parameters:
        - $ref: '#/components/parameters/X-Tenant-Id'
        - $ref: '#/components/parameters/X-Correlation-Id'
        - $ref: '#/components/parameters/X-Actor-Id'
        - $ref: '#/components/parameters/X-Actor-Type'
        - $ref: '#/components/parameters/X-Purpose-Of-Use'
        - name: departmentId
          in: query
          description: Department ID (required for scoped worklists)
          schema:
            type: string
            format: uuid
        - name: type
          in: query
          schema:
            $ref: '#/components/schemas/OrderType'
        - name: priority
          in: query
          schema:
            $ref: '#/components/schemas/OrderPriority'
        - name: status
          in: query
          description: Filter by worklist item status
          schema:
            type: string
            enum:
              - PENDING
              - ACCEPTED
              - IN_PROGRESS
              - COMPLETED
              - REJECTED
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
      responses:
        '200':
          description: Worklist entries
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorklistResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/worklists/{worklistItemId}/accept:
    post:
      operationId: acceptWorklistItem
      summary: Accept a worklist item
      description: |
        Marks a worklist item as accepted by the current actor. Transitions the
        associated order to ACCEPTED status. Emits `oros.worklist.accepted` via Kafka.
      tags:
        - Worklist
      parameters:
        - $ref: '#/components/parameters/X-Tenant-Id'
        - $ref: '#/components/parameters/X-Correlation-Id'
        - $ref: '#/components/parameters/X-Actor-Id'
        - $ref: '#/components/parameters/X-Actor-Type'
        - $ref: '#/components/parameters/X-Purpose-Of-Use'
        - name: worklistItemId
          in: path
          required: true
          description: Worklist item UUID
          schema:
            type: string
            format: uuid
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcceptWorklistRequest'
      responses:
        '200':
          description: Worklist item accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorklistItemResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/worklists/{worklistItemId}/reject:
    post:
      operationId: rejectWorklistItem
      summary: Reject a worklist item
      description: |
        Rejects a worklist item with a reason. The order may be re-routed
        or cancelled depending on configuration. Emits `oros.worklist.rejected`.
      tags:
        - Worklist
      parameters:
        - $ref: '#/components/parameters/X-Tenant-Id'
        - $ref: '#/components/parameters/X-Correlation-Id'
        - $ref: '#/components/parameters/X-Actor-Id'
        - $ref: '#/components/parameters/X-Actor-Type'
        - $ref: '#/components/parameters/X-Purpose-Of-Use'
        - name: worklistItemId
          in: path
          required: true
          description: Worklist item UUID
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RejectWorklistRequest'
      responses:
        '200':
          description: Worklist item rejected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorklistItemResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/worksteps:
    get:
      operationId: listWorksteps
      summary: List worksteps for an order
      description: |
        Returns the ordered list of worksteps for a given order. Worksteps
        represent granular processing steps (e.g., specimen collection,
        analysis, verification, reporting).
      tags:
        - Workstep
      parameters:
        - $ref: '#/components/parameters/X-Tenant-Id'
        - $ref: '#/components/parameters/X-Correlation-Id'
        - $ref: '#/components/parameters/X-Actor-Id'
        - $ref: '#/components/parameters/X-Actor-Type'
        - $ref: '#/components/parameters/X-Purpose-Of-Use'
        - name: orderId
          in: query
          required: true
          description: Order UUID to list worksteps for
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: List of worksteps
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkstepListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/worksteps/{workstepId}/start:
    post:
      operationId: startWorkstep
      summary: Start a workstep
      description: |
        Marks a workstep as started. The workstep must be in PENDING status
        and its predecessor (if any) must be completed.
        Emits `oros.workstep.started`.
      tags:
        - Workstep
      parameters:
        - $ref: '#/components/parameters/X-Tenant-Id'
        - $ref: '#/components/parameters/X-Correlation-Id'
        - $ref: '#/components/parameters/X-Actor-Id'
        - $ref: '#/components/parameters/X-Actor-Type'
        - $ref: '#/components/parameters/X-Purpose-Of-Use'
        - name: workstepId
          in: path
          required: true
          description: Workstep UUID
          schema:
            type: string
            format: uuid
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartWorkstepRequest'
      responses:
        '200':
          description: Workstep started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkstepResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/worksteps/{workstepId}/complete:
    post:
      operationId: completeWorkstep
      summary: Complete a workstep
      description: |
        Marks a workstep as completed. If this is the final workstep,
        the order transitions to COMPLETED. Emits `oros.workstep.completed`.
      tags:
        - Workstep
      parameters:
        - $ref: '#/components/parameters/X-Tenant-Id'
        - $ref: '#/components/parameters/X-Correlation-Id'
        - $ref: '#/components/parameters/X-Actor-Id'
        - $ref: '#/components/parameters/X-Actor-Type'
        - $ref: '#/components/parameters/X-Purpose-Of-Use'
        - name: workstepId
          in: path
          required: true
          description: Workstep UUID
          schema:
            type: string
            format: uuid
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompleteWorkstepRequest'
      responses:
        '200':
          description: Workstep completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkstepResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/orders/{orderId}/results:
    post:
      operationId: postResult
      summary: Post a result for an order
      description: |
        Posts a clinical result (lab values, imaging report, pharmacy dispense
        confirmation) against an order. Emits `oros.result.posted`. If the
        result is flagged as critical, emits `oros.result.critical` as well.
      tags:
        - Result
      parameters:
        - $ref: '#/components/parameters/X-Tenant-Id'
        - $ref: '#/components/parameters/X-Correlation-Id'
        - $ref: '#/components/parameters/X-Actor-Id'
        - $ref: '#/components/parameters/X-Actor-Type'
        - $ref: '#/components/parameters/X-Purpose-Of-Use'
        - $ref: '#/components/parameters/OrderIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostResultRequest'
      responses:
        '201':
          description: Result posted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
    get:
      operationId: getResults
      summary: Get results for an order
      description: Returns all results posted against a specific order.
      tags:
        - Result
      parameters:
        - $ref: '#/components/parameters/X-Tenant-Id'
        - $ref: '#/components/parameters/X-Correlation-Id'
        - $ref: '#/components/parameters/X-Actor-Id'
        - $ref: '#/components/parameters/X-Actor-Type'
        - $ref: '#/components/parameters/X-Purpose-Of-Use'
        - $ref: '#/components/parameters/OrderIdPath'
      responses:
        '200':
          description: Results for order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/orders/{orderId}/results/{resultId}/mark-critical:
    post:
      operationId: markResultCritical
      summary: Flag a result as critical
      description: |
        Marks an existing result as critical, triggering urgent notification
        workflows. Emits `oros.result.critical` via Kafka.
      tags:
        - Result
      parameters:
        - $ref: '#/components/parameters/X-Tenant-Id'
        - $ref: '#/components/parameters/X-Correlation-Id'
        - $ref: '#/components/parameters/X-Actor-Id'
        - $ref: '#/components/parameters/X-Actor-Type'
        - $ref: '#/components/parameters/X-Purpose-Of-Use'
        - $ref: '#/components/parameters/OrderIdPath'
        - name: resultId
          in: path
          required: true
          description: Result UUID
          schema:
            type: string
            format: uuid
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MarkCriticalRequest'
      responses:
        '200':
          description: Result marked as critical
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/orders/{orderId}/ack:
    post:
      operationId: acknowledgeResult
      summary: Acknowledge order results
      description: |
        Records clinician acknowledgement of order results. This is a
        medico-legal requirement for critical results. Emits `oros.ack.recorded`.
      tags:
        - Acknowledgement
      parameters:
        - $ref: '#/components/parameters/X-Tenant-Id'
        - $ref: '#/components/parameters/X-Correlation-Id'
        - $ref: '#/components/parameters/X-Actor-Id'
        - $ref: '#/components/parameters/X-Actor-Type'
        - $ref: '#/components/parameters/X-Purpose-Of-Use'
        - $ref: '#/components/parameters/OrderIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcknowledgeRequest'
      responses:
        '201':
          description: Acknowledgement recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AckResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    get:
      operationId: getAcknowledgements
      summary: Get acknowledgements for an order
      description: Returns all acknowledgement records for an order.
      tags:
        - Acknowledgement
      parameters:
        - $ref: '#/components/parameters/X-Tenant-Id'
        - $ref: '#/components/parameters/X-Correlation-Id'
        - $ref: '#/components/parameters/X-Actor-Id'
        - $ref: '#/components/parameters/X-Actor-Type'
        - $ref: '#/components/parameters/X-Purpose-Of-Use'
        - $ref: '#/components/parameters/OrderIdPath'
      responses:
        '200':
          description: Acknowledgements for order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AckListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/routes:
    get:
      operationId: listRoutes
      summary: List order routes
      description: |
        Returns routing records showing how orders were dispatched to
        fulfillment departments or external adapters. Includes route
        status, attempt count, and failure reasons.
      tags:
        - Route
      parameters:
        - $ref: '#/components/parameters/X-Tenant-Id'
        - $ref: '#/components/parameters/X-Correlation-Id'
        - $ref: '#/components/parameters/X-Actor-Id'
        - $ref: '#/components/parameters/X-Actor-Type'
        - $ref: '#/components/parameters/X-Purpose-Of-Use'
        - name: orderId
          in: query
          description: Filter by order UUID
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          description: Filter by route status
          schema:
            type: string
            enum:
              - PENDING
              - DISPATCHED
              - DELIVERED
              - FAILED
              - RETRYING
        - name: adapterType
          in: query
          description: Filter by adapter type
          schema:
            type: string
            enum:
              - INTERNAL
              - LIS
              - RIS
              - PHARMACY
              - EXTERNAL
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
      responses:
        '200':
          description: Routing records
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RouteListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/routes/{routeId}/retry:
    post:
      operationId: retryRoute
      summary: Retry a failed route
      description: |
        Retries delivery of a failed route. The route must be in FAILED status.
        Increments the attempt count and re-dispatches. Emits `oros.route.retried`.
      tags:
        - Route
      parameters:
        - $ref: '#/components/parameters/X-Tenant-Id'
        - $ref: '#/components/parameters/X-Correlation-Id'
        - $ref: '#/components/parameters/X-Actor-Id'
        - $ref: '#/components/parameters/X-Actor-Type'
        - $ref: '#/components/parameters/X-Purpose-Of-Use'
        - name: routeId
          in: path
          required: true
          description: Route UUID
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Route retried
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RouteResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/reconcile/pending:
    get:
      operationId: getPendingReconciliations
      summary: Get pending reconciliation items
      description: |
        Returns unmatched results or orders that require manual reconciliation.
        Each item includes a confidence score indicating the likelihood of a
        match with candidate orders.
      tags:
        - Reconciliation
      parameters:
        - $ref: '#/components/parameters/X-Tenant-Id'
        - $ref: '#/components/parameters/X-Correlation-Id'
        - $ref: '#/components/parameters/X-Actor-Id'
        - $ref: '#/components/parameters/X-Actor-Type'
        - $ref: '#/components/parameters/X-Purpose-Of-Use'
        - name: type
          in: query
          schema:
            $ref: '#/components/schemas/OrderType'
        - name: minConfidence
          in: query
          description: Minimum confidence score (0.0 to 1.0)
          schema:
            type: number
            format: double
            minimum: 0
            maximum: 1
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
      responses:
        '200':
          description: Pending reconciliation items
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReconcileListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/reconcile/{reconcileId}/match:
    post:
      operationId: matchReconciliation
      summary: Match an unmatched result to an order
      description: |
        Manually matches an unmatched result to a specific order. This
        links the result and updates the order status accordingly.
        Emits `oros.reconcile.matched`.
      tags:
        - Reconciliation
      parameters:
        - $ref: '#/components/parameters/X-Tenant-Id'
        - $ref: '#/components/parameters/X-Correlation-Id'
        - $ref: '#/components/parameters/X-Actor-Id'
        - $ref: '#/components/parameters/X-Actor-Type'
        - $ref: '#/components/parameters/X-Purpose-Of-Use'
        - name: reconcileId
          in: path
          required: true
          description: Reconciliation item UUID
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MatchReconcileRequest'
      responses:
        '200':
          description: Reconciliation matched
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReconcileItemResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/reconcile/{reconcileId}/resolve:
    post:
      operationId: resolveReconciliation
      summary: Resolve a reconciliation item without matching
      description: |
        Resolves an unmatched reconciliation item by marking it as
        manually resolved (e.g., duplicate, invalid, or orphaned result).
        Emits `oros.reconcile.resolved`.
      tags:
        - Reconciliation
      parameters:
        - $ref: '#/components/parameters/X-Tenant-Id'
        - $ref: '#/components/parameters/X-Correlation-Id'
        - $ref: '#/components/parameters/X-Actor-Id'
        - $ref: '#/components/parameters/X-Actor-Type'
        - $ref: '#/components/parameters/X-Purpose-Of-Use'
        - name: reconcileId
          in: path
          required: true
          description: Reconciliation item UUID
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResolveReconcileRequest'
      responses:
        '200':
          description: Reconciliation resolved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReconcileItemResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/catalog:
    get:
      operationId: listCatalogItems
      summary: List catalog items
      description: |
        Returns the orderable-item catalog filtered by type, department,
        or search query. Catalog items define what can be ordered at a
        given facility.
      tags:
        - Catalog
      parameters:
        - $ref: '#/components/parameters/X-Tenant-Id'
        - $ref: '#/components/parameters/X-Correlation-Id'
        - $ref: '#/components/parameters/X-Actor-Id'
        - $ref: '#/components/parameters/X-Actor-Type'
        - $ref: '#/components/parameters/X-Purpose-Of-Use'
        - name: type
          in: query
          description: Filter by order type
          schema:
            $ref: '#/components/schemas/OrderType'
        - name: departmentId
          in: query
          description: Filter by department
          schema:
            type: string
            format: uuid
        - name: active
          in: query
          description: Filter by active status
          schema:
            type: boolean
        - name: q
          in: query
          description: Free-text search across name, code, and description
          schema:
            type: string
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
      responses:
        '200':
          description: Catalog items
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/catalog/import:
    post:
      operationId: importCatalog
      summary: Import catalog items
      description: |
        Bulk imports orderable items into the catalog. Existing items with
        matching codes are updated; new items are created.
      tags:
        - Catalog
      parameters:
        - $ref: '#/components/parameters/X-Tenant-Id'
        - $ref: '#/components/parameters/X-Correlation-Id'
        - $ref: '#/components/parameters/X-Actor-Id'
        - $ref: '#/components/parameters/X-Actor-Type'
        - $ref: '#/components/parameters/X-Purpose-Of-Use'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CatalogImportRequest'
      responses:
        '200':
          description: Import result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogImportResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /v1/catalog/lookup:
    get:
      operationId: lookupCatalogItem
      summary: Lookup a catalog item by code
      description: |
        Resolves a specific catalog item by its code and optional system.
        Used during order placement to validate orderable items.
      tags:
        - Catalog
      parameters:
        - $ref: '#/components/parameters/X-Tenant-Id'
        - $ref: '#/components/parameters/X-Correlation-Id'
        - $ref: '#/components/parameters/X-Actor-Id'
        - $ref: '#/components/parameters/X-Actor-Type'
        - $ref: '#/components/parameters/X-Purpose-Of-Use'
        - name: code
          in: query
          required: true
          description: Catalog item code (e.g., LOINC, local code)
          schema:
            type: string
        - name: system
          in: query
          description: Code system URI (e.g., http://loinc.org)
          schema:
            type: string
      responses:
        '200':
          description: Catalog item found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogItemResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/internal/butano/writeback:
    post:
      operationId: butanoWriteback
      summary: Writeback results to BUTANO
      description: |
        Internal endpoint used by OROS to write order context to the
        Shared Health Record (BUTANO/HAPI FHIR) as a ServiceRequest
        reference payload. Uses CPID-only linkage (no direct PII fields).
        DiagnosticReport/Observation writeback remains a tracked follow-on
        integration item.
      tags:
        - Internal
      parameters:
        - $ref: '#/components/parameters/X-Tenant-Id'
        - $ref: '#/components/parameters/X-Correlation-Id'
        - $ref: '#/components/parameters/X-Actor-Id'
        - $ref: '#/components/parameters/X-Actor-Type'
        - $ref: '#/components/parameters/X-Purpose-Of-Use'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ButanoWritebackRequest'
      responses:
        '200':
          description: Writeback successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ButanoWritebackResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /v1/internal/pct/order-hook:
    post:
      operationId: pctOrderHook
      summary: PCT order lifecycle hook
      description: |
        Webhook called by PCT when a patient journey event requires order
        status updates (e.g., patient discharged, encounter closed).
      tags:
        - Internal
      parameters:
        - $ref: '#/components/parameters/X-Tenant-Id'
        - $ref: '#/components/parameters/X-Correlation-Id'
        - $ref: '#/components/parameters/X-Actor-Id'
        - $ref: '#/components/parameters/X-Actor-Type'
        - $ref: '#/components/parameters/X-Purpose-Of-Use'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PctOrderHookRequest'
      responses:
        '200':
          description: Hook processed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/internal/capabilities:
    get:
      operationId: listCapabilities
      summary: List facility capabilities
      description: |
        Returns the configured capabilities for a tenant/facility, including
        supported order types, adapter modes, and routing rules.
      tags:
        - Internal
      parameters:
        - $ref: '#/components/parameters/X-Tenant-Id'
        - $ref: '#/components/parameters/X-Correlation-Id'
        - $ref: '#/components/parameters/X-Actor-Id'
        - $ref: '#/components/parameters/X-Actor-Type'
        - $ref: '#/components/parameters/X-Purpose-Of-Use'
        - name: facilityId
          in: query
          description: Filter by facility ID
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Capability list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CapabilityListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    put:
      operationId: upsertCapability
      summary: Create or update a facility capability
      description: |
        Creates or updates the OROS capability configuration for a specific
        tenant/facility. Defines supported order types, adapter mode
        (INTERNAL, ADAPTER, HYBRID), and routing preferences.
      tags:
        - Internal
      parameters:
        - $ref: '#/components/parameters/X-Tenant-Id'
        - $ref: '#/components/parameters/X-Correlation-Id'
        - $ref: '#/components/parameters/X-Actor-Id'
        - $ref: '#/components/parameters/X-Actor-Type'
        - $ref: '#/components/parameters/X-Purpose-Of-Use'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpsertCapabilityRequest'
      responses:
        '200':
          description: Capability upserted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CapabilityResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
