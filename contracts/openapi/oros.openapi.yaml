        orderId:
          type: string
          format: uuid
        patientCpid:
          type: string
          description: Patient CPID (no PII allowed)
        encounterId:
          type: string
          format: uuid
        results:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/ButanoResultEntry'

    ButanoResultEntry:
      type: object
      required: [code, codeSystem, value]
      properties:
        code:
          type: string
        codeSystem:
          type: string
        displayName:
          type: string
        value:
          type: string
        unit:
          type: string
        interpretation:
          type: string
          enum: [NORMAL, ABNORMAL, CRITICAL_HIGH, CRITICAL_LOW, HIGH, LOW]
        referenceRange:
          type: string
        performedAt:
          type: string
          format: date-time
        performedBy:
          type: string

    ButanoWritebackResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            diagnosticReportId:
              type: string
              description: FHIR DiagnosticReport resource ID in BUTANO
            observationIds:
              type: array
              items:
                type: string
              description: FHIR Observation resource IDs created in BUTANO

    PctOrderHookRequest:
