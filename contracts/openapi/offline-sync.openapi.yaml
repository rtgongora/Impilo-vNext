# =============================================================================
# Offline Sync — Sync Pack & Conflict Queue API (OpenAPI 3.0)
#
# Phase B baseline: sync pack CRUD, replay, conflict listing/resolution, and
# v1.1 companion probe routes.
# =============================================================================
openapi: "3.0.3"

info:
  title: Offline Sync — Sync Pack & Conflict Queue API
  version: "1.0.0"
  description: |
    Offline Sync enables disconnected facility devices to upload sync packs for
    reconciliation with the central platform. Detected conflicts are queued for
    manual or automatic resolution.

    Trust headers are enforced by Envoy + TSHEPO; internal probes additionally
    require Health OS Manifest v1.2 mandatory headers (see `CompanionHeaders`).
  contact:
    name: Impilo Platform Team
  license:
    name: Proprietary

servers:
  - url: http://localhost:8095
    description: Local development
  - url: https://{tenant}.impilo.health/api
    description: Production (per-tenant)
    variables:
      tenant:
        default: demo

security:
  - bearerAuth: []

tags:
  - name: Internal-Probe
    description: Tech-companion v1.1 header and federation proofs
  - name: Sync-Pack
    description: Offline sync pack lifecycle — list, get, create, replay
  - name: Conflict-Queue
    description: Conflict detection and resolution

paths:
  # ---------------------------------------------------------------------------
  # v1.1 Probe endpoints
  # ---------------------------------------------------------------------------
  /internal/v1/health:
    get:
      operationId: offlineSyncInternalHealth
      tags: [Internal-Probe]
      summary: v1.1 probe — returns trust context echo
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/PodId"
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "200":
          description: Service UP with context echo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProbeHealthBody"

  /internal/v1/test-command:
    post:
      operationId: offlineSyncInternalTestCommand
      tags: [Internal-Probe]
      summary: v1.1 probe — idempotency / echo
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/PodId"
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "201":
          description: Echo payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProbeCommandBody"

  /internal/v1/test-federation:
    post:
      operationId: offlineSyncInternalTestFederation
      tags: [Internal-Probe]
      summary: v1.1 probe — national federation authority
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/PodId"
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "201":
          description: Federation proof accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProbeFederationBody"

  # ---------------------------------------------------------------------------
  # Sync Pack endpoints
  # ---------------------------------------------------------------------------
  /internal/v1/sync-packs:
    get:
      operationId: offlineSyncListSyncPacks
      tags: [Sync-Pack]
      summary: List all sync packs
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/PodId"
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "200":
          description: Array of sync pack objects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SyncPackResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

    post:
      operationId: offlineSyncCreateSyncPack
      tags: [Sync-Pack]
      summary: Upload a new sync pack from a disconnected device
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/PodId"
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSyncPackRequest"
      responses:
        "201":
          description: Sync pack created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncPackResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /internal/v1/sync-packs/{id}:
    get:
      operationId: offlineSyncGetSyncPack
      tags: [Sync-Pack]
      summary: Retrieve a single sync pack by ID
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/PodId"
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/CorrelationId"
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Sync pack detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncPackResponse"
        "404":
          description: Sync pack not found
        "401":
          $ref: "#/components/responses/Unauthorized"

  /internal/v1/sync-packs/{id}/replay:
    post:
      operationId: offlineSyncReplaySyncPack
      tags: [Sync-Pack]
      summary: Replay a previously failed or conflicted sync pack
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/PodId"
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/CorrelationId"
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Sync pack replayed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncPackResponse"
        "404":
          description: Sync pack not found
        "401":
          $ref: "#/components/responses/Unauthorized"

  # ---------------------------------------------------------------------------
  # Conflict Queue endpoints
  # ---------------------------------------------------------------------------
  /internal/v1/conflicts:
    get:
      operationId: offlineSyncListConflicts
      tags: [Conflict-Queue]
      summary: List unresolved conflicts
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/PodId"
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "200":
          description: Array of conflict queue entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ConflictQueueResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /internal/v1/conflicts/{id}/resolve:
    post:
      operationId: offlineSyncResolveConflict
      tags: [Conflict-Queue]
      summary: Resolve a conflict with a chosen strategy
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/PodId"
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/CorrelationId"
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResolveConflictRequest"
      responses:
        "200":
          description: Conflict resolved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConflictQueueResponse"
        "404":
          description: Conflict not found
        "401":
          $ref: "#/components/responses/Unauthorized"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    TenantId:
      name: X-Tenant-ID
      in: header
      required: true
      schema:
        type: string
    PodId:
      name: X-Pod-ID
      in: header
      required: true
      schema:
        type: string
    RequestId:
      name: X-Request-ID
      in: header
      required: true
      schema:
        type: string
        format: uuid
    CorrelationId:
      name: X-Correlation-ID
      in: header
      required: true
      schema:
        type: string
        format: uuid
    ActorId:
      name: X-Actor-ID
      in: header
      required: true
      schema:
        type: string
    ActorType:
      name: X-Actor-Type
      in: header
      required: true
      schema:
        type: string

  responses:
    Unauthorized:
      description: Missing or invalid authentication

  schemas:
    # --- Probe schemas ---
    ProbeHealthBody:
      type: object
      properties:
        service:
          type: string
          example: offline-sync
        status:
          type: string
          example: UP
        tenant_id:
          type: string
        pod_id:
          type: string
        request_id:
          type: string
        correlation_id:
          type: string
      additionalProperties: true

    ProbeCommandBody:
      type: object
      properties:
        service:
          type: string
        action:
          type: string
        request_id:
          type: string
        correlation_id:
          type: string
        echo:
          type: object
          additionalProperties: true
      additionalProperties: true

    ProbeFederationBody:
      type: object
      properties:
        service:
          type: string
        action:
          type: string
        pod_id:
          type: string
        request_id:
          type: string
        correlation_id:
          type: string
      additionalProperties: true

    # --- Sync Pack schemas ---
    CreateSyncPackRequest:
      type: object
      required: [tenantId, facilityId, deviceId]
      properties:
        tenantId:
          type: string
          format: uuid
          description: Tenant owning this sync pack
        facilityId:
          type: string
          format: uuid
          description: Facility from which the sync pack originates
        deviceId:
          type: string
          maxLength: 128
          description: Unique device identifier
        payload:
          type: string
          description: JSONB-encoded sync payload

    SyncPackResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        tenantId:
          type: string
          format: uuid
        facilityId:
          type: string
          format: uuid
        deviceId:
          type: string
        packVersion:
          type: integer
          format: int64
        status:
          type: string
          enum: [PENDING, SYNCING, SYNCED, CONFLICT, FAILED]
        payload:
          type: string
          description: JSONB-encoded sync payload
        createdAt:
          type: string
          format: date-time
        syncedAt:
          type: string
          format: date-time

    # --- Conflict Queue schemas ---
    ResolveConflictRequest:
      type: object
      required: [resolution]
      properties:
        resolution:
          type: string
          enum: [LOCAL_WINS, REMOTE_WINS, MANUAL_MERGE]
          description: Conflict resolution strategy
        mergedPayload:
          type: string
          description: Manually merged payload (required when resolution is MANUAL_MERGE)

    ConflictQueueResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        tenantId:
          type: string
          format: uuid
        syncPackId:
          type: integer
          format: int64
        conflictType:
          type: string
        localPayload:
          type: string
          description: JSONB local version of the conflicting record
        remotePayload:
          type: string
          description: JSONB remote version of the conflicting record
        resolution:
          type: string
          enum: [LOCAL_WINS, REMOTE_WINS, MANUAL_MERGE]
        resolvedAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
