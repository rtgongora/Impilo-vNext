# =============================================================================
# INPATIENT — Admissions, transfers & discharges (OpenAPI 3.0)
# =============================================================================
openapi: "3.0.3"

info:
  title: Inpatient Service API
  version: "1.1.0"
  description: |
    Inpatient care setting subordinate to PCT: admissions, ward/bed transfers,
    and discharges. Trust headers are enforced by Envoy + TSHEPO; internal probes
    require Health OS Manifest v1.1 mandatory headers.
  contact:
    name: Impilo Platform Team
  license:
    name: Proprietary

servers:
  - url: http://localhost:8121
    description: Local development
  - url: https://{tenant}.impilo.health/api/inpatient
    description: Production (per-tenant)
    variables:
      tenant:
        default: demo

security:
  - bearerAuth: []

tags:
  - name: Internal-Probe
    description: Tech-companion v1.1 header proofs
  - name: Admissions
    description: Inpatient admission lifecycle

paths:
  /internal/v1/health:
    get:
      operationId: inpatientInternalHealth
      tags: [Internal-Probe]
      summary: v1.1 probe — returns trust context echo
      security: []
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/PodId"
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "200":
          description: Service UP with context echo
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true

  /internal/v1/test-command:
    post:
      operationId: inpatientInternalTestCommand
      tags: [Internal-Probe]
      summary: v1.1 probe — idempotency / echo
      security: []
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/PodId"
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "201":
          description: Echo payload
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true

  /internal/v1/admissions:
    get:
      operationId: listAdmissions
      tags: [Admissions]
      summary: List admissions
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/PodId"
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/CorrelationId"
        - name: facilityId
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Admission list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Admission"
    post:
      operationId: createAdmission
      tags: [Admissions]
      summary: Create admission
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/PodId"
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAdmissionRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Admission"

  /internal/v1/admissions/{admissionRef}:
    get:
      operationId: getAdmission
      tags: [Admissions]
      summary: Get admission by reference
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/PodId"
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/CorrelationId"
        - name: admissionRef
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Admission
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Admission"

  /internal/v1/admissions/{admissionRef}/transfer:
    post:
      operationId: transferPatient
      tags: [Admissions]
      summary: Transfer patient to ward/bed
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/PodId"
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/CorrelationId"
        - name: admissionRef
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransferRequest"
      responses:
        "201":
          description: Transfer recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transfer"

  /internal/v1/admissions/{admissionRef}/discharge:
    post:
      operationId: dischargePatient
      tags: [Admissions]
      summary: Discharge patient
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/PodId"
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/CorrelationId"
        - name: admissionRef
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Discharged admission
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Admission"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    TenantId:
      name: X-Tenant-ID
      in: header
      required: true
      schema:
        type: string
    PodId:
      name: X-Pod-ID
      in: header
      required: true
      schema:
        type: string
    RequestId:
      name: X-Request-ID
      in: header
      required: true
      schema:
        type: string
        format: uuid
    CorrelationId:
      name: X-Correlation-ID
      in: header
      required: true
      schema:
        type: string
        format: uuid

  schemas:
    CreateAdmissionRequest:
      type: object
      required: [tenantId, encounterId, subjectCpid, facilityId]
      properties:
        tenantId:
          type: string
          format: uuid
        encounterId:
          type: string
          format: uuid
        subjectCpid:
          type: string
        facilityId:
          type: string
          format: uuid
        wardId:
          type: string
          format: uuid
        bedId:
          type: string
          format: uuid

    TransferRequest:
      type: object
      required: [toWardId]
      properties:
        toWardId:
          type: string
          format: uuid
        toBedId:
          type: string
          format: uuid

    Admission:
      type: object
      properties:
        id:
          type: integer
          format: int64
        tenantId:
          type: string
          format: uuid
        admissionRef:
          type: string
          format: uuid
        encounterId:
          type: string
          format: uuid
        subjectCpid:
          type: string
        facilityId:
          type: string
          format: uuid
        wardId:
          type: string
          format: uuid
        bedId:
          type: string
          format: uuid
        status:
          type: string
        admittedAt:
          type: string
          format: date-time
        dischargedAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time

    Transfer:
      type: object
      properties:
        id:
          type: integer
          format: int64
        tenantId:
          type: string
          format: uuid
        admissionRef:
          type: string
          format: uuid
        fromWardId:
          type: string
          format: uuid
        toWardId:
          type: string
          format: uuid
        toBedId:
          type: string
          format: uuid
        transferredAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
