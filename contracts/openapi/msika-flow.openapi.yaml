      operationId: acceptOrder
      summary: Accept a routed order (vendor/facility action)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/XTenantId'
        - $ref: '#/components/parameters/XActorId'
      responses:
        '200':
          description: Order accepted
          content:
