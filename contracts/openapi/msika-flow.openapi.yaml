          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse_PaymentIntentResponse'
  /v1/orders/{id}/route:
    post:
      tags:
        - Orders
      operationId: routeOrder
      summary: Route order to fulfillment target
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/XTenantId'
        - $ref: '#/components/parameters/XActorId'
      responses:
        '200':
          description: Order routed
          content:
