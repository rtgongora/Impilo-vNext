openapi: 3.0.3
info:
  title: MSIKA Flow — Health Marketplace Orchestration API
  description: |
    Transaction and orchestration layer for regulated health commerce and self-service.
    Handles patient self-service ordering, prescription fulfillment, service booking,
    vendor onboarding, fulfillment routing, payments/settlements/refunds via MUSHEX,
    and strict safety/regulatory enforcement via TSHEPO + MSIKA Core restrictions.
  version: 0.1.0
  contact:
    name: Impilo vNext Platform Team
    url: https://github.com/mohcc/impilo-vnext

servers:
  - url: http://localhost:10000
    description: Local Envoy gateway
  - url: http://localhost:8100
    description: Direct service (dev only)

security:
  - bearerAuth: []

tags:
  - name: Cart
    description: Cart validation against MSIKA Core catalog restrictions
  - name: Orders
    description: Marketplace order lifecycle management
  - name: Pickup
    description: Pickup token issuance, QR/OTP claim flow, slip PDF
  - name: Rx Fulfillment
    description: Prescription fulfillment with substitution management
  - name: Bookings
    description: Service booking orchestration
  - name: Vendors
    description: Vendor onboarding, document management, order fulfillment
  - name: Ops
    description: Operations console — reviews, stuck orders, audits
  - name: Refunds
    description: Full and partial refund flows

paths:
  /v1/cart/validate:
    post:
      tags:
        - Cart
      operationId: validateCart
      summary: Validate cart items against MSIKA Core catalog restrictions
      parameters:
        - $ref: '#/components/parameters/XTenantId'
        - $ref: '#/components/parameters/XCorrelationId'
        - $ref: '#/components/parameters/XActorId'
        - $ref: '#/components/parameters/XActorType'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ValidateCartRequest'
      responses:
        '200':
          description: Validation result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse_ValidationResult'
  /v1/orders:
    post:
      tags:
        - Orders
      operationId: createOrder
      summary: Create a new marketplace order
      parameters:
        - $ref: '#/components/parameters/XTenantId'
        - $ref: '#/components/parameters/XCorrelationId'
        - $ref: '#/components/parameters/XActorId'
        - $ref: '#/components/parameters/XActorType'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'
      responses:
        '201':
          description: Order created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse_OrderView'
  /v1/orders/{id}:
    get:
      tags:
        - Orders
      operationId: getOrder
      summary: Get order by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/XTenantId'
        - $ref: '#/components/parameters/XCorrelationId'
      responses:
        '200':
          description: Order details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse_OrderView'
  /v1/orders/{id}/cancel:
    post:
      tags:
        - Orders
      operationId: cancelOrder
      summary: Cancel an order
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/XTenantId'
        - $ref: '#/components/parameters/XActorId'
      responses:
        '200':
          description: Order cancelled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse_OrderView'
  /v1/orders/{id}/price:
    post:
      tags:
