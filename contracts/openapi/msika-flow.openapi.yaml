      operationId: priceOrder
      summary: Compute and snapshot pricing for an order
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/XTenantId'
        - $ref: '#/components/parameters/XActorId'
      responses:
        '200':
          description: Order priced
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse_OrderView'
  /v1/orders/{id}/pay:
    post:
      tags:
