components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    XTenantId:
      name: X-Tenant-Id
      in: header
      required: true
      schema:
        type: string
        format: uuid
    XCorrelationId:
      name: X-Correlation-Id
      in: header
      required: false
      schema:
        type: string
        format: uuid
    XActorId:
      name: X-Actor-Id
      in: header
      required: true
      schema:
        type: string
    XActorType:
      name: X-Actor-Type
      in: header
      required: false
      schema:
        type: string
        enum: [PATIENT, PROVIDER, VENDOR, OPS, SYSTEM]
    XDeviceFingerprint:
      name: X-Device-Fingerprint
      in: header
      required: false
      schema:
        type: string

  schemas:
    ValidateCartRequest:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            type: object
            properties:
              msikaCoreCode:
                type: string
              qty:
                type: integer
        channel:
          type: string

    CreateOrderRequest:
      type: object
      required: [orderType]
      properties:
        orderType:
          type: string
          enum: [OTC_PRODUCT_ORDER, RX_FULFILLMENT_ORDER, SERVICE_BOOKING_ORDER, BUNDLE_ORDER]
        patientCpid:
          type: string
        facilityId:
          type: string
          format: uuid
        vendorId:
          type: string
          format: uuid
        idempotencyKey:
          type: string
        lines:
          type: array
          items:
            $ref: '#/components/schemas/LineItemRequest'

    LineItemRequest:
      type: object
      required: [msikaCoreCode, qty]
      properties:
        msikaCoreCode:
          type: string
        kind:
          type: string
          enum: [PRODUCT, SERVICE]
        qty:
          type: integer
          minimum: 1
        unitPrice:
          type: number
        fulfillmentMode:
          type: string
          enum: [PHARMACY_PICKUP, HOME_DELIVERY, OUTREACH_DELIVERY, DIGITAL_FULFILLMENT, FACILITY_SERVICE]
        substitutionPolicy:
          type: string
        metadata:
          type: string

    ClaimPickupRequest:
      type: object
      required: [tokenOrOtp]
      properties:
        tokenOrOtp:
          type: string

    SubstitutionProposeRequest:
      type: object
      required: [lineId, substituteCode]
      properties:
        lineId:
          type: string
        substituteCode:
          type: string
        substitutePrice:
          type: number
        reason:
          type: string

    SubstitutionApproveRequest:
      type: object
      required: [lineId]
      properties:
        lineId:
          type: string

    BookingCreateRequest:
      type: object
      required: [facilityId]
      properties:
        patientCpid:
          type: string
        facilityId:
          type: string
          format: uuid
        serviceCode:
          type: string
        idempotencyKey:
          type: string

    VendorApplyRequest:
      type: object
      required: [name, type]
      properties:
        name:
          type: string
        type:
          type: string
          enum: [FACILITY, PHARMACY, SUPPLIER]
        coverage:
          type: string

    VendorDocUploadRequest:
      type: object
      required: [docType, landelaDocId]
      properties:
        docType:
          type: string
        landelaDocId:
          type: string

    RefundRequest:
      type: object
      required: [amount, reason]
      properties:
        amount:
          type: number
        reason:
          type: string

    ReviewActionRequest:
      type: object
      properties:
        notes:
          type: string

    OrderView:
      type: object
      properties:
        orderId:
          type: string
        tenantId:
          type: string
          format: uuid
        actorId:
          type: string
        actorType:
          type: string
        patientCpid:
          type: string
        orderType:
          type: string
        status:
          type: string
        facilityId:
          type: string
          format: uuid
        vendorId:
          type: string
          format: uuid
        amountTotal:
          type: number
        currency:
          type: string
        priceSnapshot:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        lines:
          type: array
          items:
            $ref: '#/components/schemas/OrderLineView'

    OrderLineView:
      type: object
      properties:
        lineId:
          type: string
        orderId:
          type: string
        msikaCoreCode:
          type: string
        kind:
          type: string
        qty:
          type: integer
        unitPrice:
          type: number
        lineTotal:
          type: number
        fulfillmentMode:
          type: string
        state:
          type: string
        metadata:
          type: string

    PickupIssueResponse:
      type: object
      properties:
        tokenId:
          type: string
        rawToken:
          type: string
        otp:
          type: string
        expiresAt:
          type: string
          format: date-time
        qrPayload:
          type: string

    PaymentIntentResponse:
      type: object
      properties:
        orderId:
          type: string
        mushexPaymentIntentId:
          type: string
        status:
          type: string

    ApiResponse_OrderView:
      type: object
      properties:
        success:
          type: boolean
        data:
          $ref: '#/components/schemas/OrderView'
        correlationId:
          type: string
        timestamp:
          type: string
          format: date-time

    ApiResponse_OrderLineView:
      type: object
      properties:
        success:
          type: boolean
        data:
          $ref: '#/components/schemas/OrderLineView'
        correlationId:
          type: string

    ApiResponse_ValidationResult:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
          properties:
            valid:
              type: boolean
            items:
              type: array
              items:
                type: object
                properties:
                  msikaCoreCode:
                    type: string
                  valid:
                    type: boolean
                  errors:
                    type: array
                    items:
                      type: string
        correlationId:
          type: string

    ApiResponse_PickupIssueResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          $ref: '#/components/schemas/PickupIssueResponse'
        correlationId:
          type: string

    ApiResponse_PaymentIntentResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          $ref: '#/components/schemas/PaymentIntentResponse'
        correlationId:
          type: string

    ApiResponse_ClaimResult:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
          properties:
            orderId:
              type: string
            tokenId:
              type: string
            claimedBy:
              type: string
        correlationId:
          type: string

    ApiResponse_Object:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
        correlationId:
          type: string
