# =============================================================================
# Search — unified search index API (OpenAPI 3.0)
# Phase B baseline: internal index and query routes (`SearchIndexController`).
# =============================================================================
openapi: "3.0.3"

info:
  title: Search Service API
  version: "1.0.0"
  description: |
    Internal search index (ingest, remove, query, list-by-type). Consumed by
    Experience BFF via `search-base-url` with companion `RequestContext` enforcement.
  contact:
    name: Impilo Platform Team
  license:
    name: Proprietary

servers:
  - url: http://localhost:8230
    description: Local development
  - url: https://{tenant}.impilo.health/api
    description: Production (per-tenant)
    variables:
      tenant:
        default: demo

security:
  - bearerAuth: []

tags:
  - name: Internal-Search
    description: Index and search operations

paths:
  /internal/v1/search/index:
    post:
      operationId: searchIndexEntity
      tags: [Internal-Search]
      summary: Index or update a document for an entity
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: IndexRequest — align with service DTO in a later revision
              additionalProperties: true
      responses:
        "201":
          description: Indexed
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true

  /internal/v1/search/index/{entityType}/{entityId}:
    delete:
      operationId: searchRemoveEntity
      tags: [Internal-Search]
      summary: Remove entity from index
      parameters:
        - name: entityType
          in: path
          required: true
          schema:
            type: string
        - name: entityId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Removed

  /internal/v1/search:
    get:
      operationId: searchQuery
      tags: [Internal-Search]
      summary: Full-text search
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
        - name: entityType
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            minimum: 1
            default: 20
      responses:
        "200":
          description: Search hits
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true

  /internal/v1/search/index/{entityType}:
    get:
      operationId: searchListByType
      tags: [Internal-Search]
      summary: List indexed documents by entity type
      parameters:
        - name: entityType
          in: path
          required: true
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            minimum: 1
            default: 20
      responses:
        "200":
          description: Paged results
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
