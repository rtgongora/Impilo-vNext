# =============================================================================
# INDAWO — Site Registry API (OpenAPI 3.0)
# Phase B baseline: site snapshots. (The orphaned /internal/v1/addresses route
# and ind_addresses table were retired under G4 — ndila-service is the geography SoR.)
# =============================================================================
openapi: "3.0.3"

info:
  title: INDAWO — Site Registry API
  version: "1.0.0"
  description: |
    INDAWO holds canonical site snapshot feeds for facility context and
    public-health surfaces. Internal routes are consumed via BFF or batch jobs.
    Geocoding and geography are owned by ndila-service (G4).
  contact:
    name: Impilo Platform Team
  license:
    name: Proprietary

servers:
  - url: http://localhost:8150
    description: Local development
  - url: https://{tenant}.impilo.health/api
    description: Production (per-tenant)
    variables:
      tenant:
        default: demo

security:
  - bearerAuth: []

tags:
  - name: Internal-Snapshot
    description: Site snapshot pagination for sync

paths:
  /internal/v1/snapshots/sites:
    get:
      operationId: indawoSnapshotSites
      tags:
        - Internal-Snapshot
      summary: Paginated site snapshot
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/PodId'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/CorrelationId'
        - name: cursor
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
        - name: as_of
          in: query
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: Site snapshot page
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /:
    get:
      operationId: indawo_get__
      tags:
        - Generated-From-Handler
      summary: Documented from indawo-service handler (complete-not-delete sync)
      responses:
        '200':
          description: Success
    post:
      operationId: indawo_post__
      tags:
        - Generated-From-Handler
      summary: Documented from indawo-service handler (complete-not-delete sync)
      responses:
        '200':
          description: Success
  /{id}:
    get:
      operationId: indawo_get__id_
      tags:
        - Generated-From-Handler
      summary: Documented from indawo-service handler (complete-not-delete sync)
      responses:
        '200':
          description: Success
  /internal/v1/sites/{site_id}:
