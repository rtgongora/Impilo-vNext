openapi: 3.0.3
info:
  title: "IoT Ingestion"
  description: |
    Phase F baseline contract for `iot-ingestion-service`. Extend with real paths and schemas as the HTTP surface is stabilised.
  version: 0.1.0
servers:
  - url: http://localhost:8330
    description: Local default (`default_http_port` in docs/registry/services-registry.yaml)

paths:
  /internal/v1/health:
    get:
      operationId: internalHealth
      summary: Internal health probe
      tags:
        - Health
      responses:
        '200':
          description: Service reachable
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /internal/v1/telemetry/ingest:
    post:
      operationId: iotingestion_post__internal_v1_telemetry_ingest
      tags:
        - Generated-From-Handler
      summary: Documented from iot-ingestion-service handler (complete-not-delete sync)
      responses:
        '200':
          description: Success
  /internal/v1/telemetry/ingest/batch:
    post:
      operationId: iotingestion_post__internal_v1_telemetry_ingest_batch
      tags:
        - Generated-From-Handler
      summary: Documented from iot-ingestion-service handler (complete-not-delete sync)
      responses:
        '200':
          description: Success
  /internal/v1/telemetry/readings:
    get:
      operationId: iotingestion_get__internal_v1_telemetry_readings
      tags:
        - Generated-From-Handler
      summary: Documented from iot-ingestion-service handler (complete-not-delete sync)
      responses:
        '200':
          description: Success

components:
  schemas: {}
