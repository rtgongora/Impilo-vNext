components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    TenantIdLower:
      name: x-tenant-id
      in: header
      required: false
      schema:
        type: string
        default: default
    ActorIdLower:
      name: x-actor-id
      in: header
      required: false
      schema:
        type: string
        default: anonymous
