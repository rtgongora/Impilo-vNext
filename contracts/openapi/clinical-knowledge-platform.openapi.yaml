# =============================================================================
# Clinical Knowledge Platform — rules, assistant, pathways (OpenAPI 3.0)
# Phase B baseline: internal clinical API consumed by Experience BFF.
# =============================================================================
openapi: "3.0.3"

info:
  title: Clinical Knowledge Platform API
  version: "1.0.0"
  description: |
    Clinical rules evaluation, assistant Q&A, pathway sessions, source ingestion,
    and audit traces. Internal-only; wire through BFF (`ClinicalKnowledgePlatformClient`).
  contact:
    name: Impilo Platform Team
  license:
    name: Proprietary

servers:
  - url: http://localhost:8270
    description: Local development
  - url: https://{tenant}.impilo.health/api
    description: Production (per-tenant)
    variables:
      tenant:
        default: demo

security:
  - bearerAuth: []

tags:
  - name: Internal-Clinical
    description: Assistant and trace surfaces

paths:
  /internal/v1/clinical/assistant/ask:
    post:
      operationId: ckpAssistantAsk
      tags:
        - Internal-Clinical
      summary: Clinical assistant question
      parameters:
        - $ref: '#/components/parameters/TenantIdLower'
        - $ref: '#/components/parameters/ActorIdLower'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                question:
                  type: string
                patient_context:
                  type: object
                  additionalProperties: true
                encounter_id:
                  type: string
                citizen_mode:
                  type: boolean
                role:
                  type: string
                  default: PROVIDER
      responses:
        '200':
          description: Assistant payload under `data`
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    additionalProperties: true
  /internal/v1/clinical/assistant/traces/{id}:
    get:
      operationId: ckpAssistantTrace
      tags:
        - Internal-Clinical
      summary: Fetch recommendation trace JSON
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Trace JSON under `data` or not-found envelope
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /assistant/ask:
    post:
      operationId: clinicalknowledgeplatform_post__assistant_ask
      tags:
        - Generated-From-Handler
      summary: Documented from clinical-knowledge-platform-service handler (complete-not-delete sync)
      responses:
        '200':
          description: Success
  /assistant/traces/{id}:
    get:
      operationId: clinicalknowledgeplatform_get__assistant_traces_id_
      tags:
        - Generated-From-Handler
      summary: Documented from clinical-knowledge-platform-service handler (complete-not-delete sync)
      responses:
        '200':
          description: Success
  /prescribing/evaluate:
    post:
      operationId: clinicalknowledgeplatform_post__prescribing_evaluate
      tags:
        - Generated-From-Handler
      summary: Documented from clinical-knowledge-platform-service handler (complete-not-delete sync)
      responses:
        '200':
          description: Success
  /rules/evaluate:
    post:
      operationId: clinicalknowledgeplatform_post__rules_evaluate
      tags:
        - Generated-From-Handler
      summary: Documented from clinical-knowledge-platform-service handler (complete-not-delete sync)
      responses:
        '200':
          description: Success
  /pathways:
    get:
      operationId: clinicalknowledgeplatform_get__pathways
      tags:
        - Generated-From-Handler
      summary: Documented from clinical-knowledge-platform-service handler (complete-not-delete sync)
      responses:
        '200':
          description: Success
  /pathways/{id}:
    get:
      operationId: clinicalknowledgeplatform_get__pathways_id_
      tags:
        - Generated-From-Handler
      summary: Documented from clinical-knowledge-platform-service handler (complete-not-delete sync)
      responses:
        '200':
          description: Success
  /pathways/sessions:
    post:
      operationId: clinicalknowledgeplatform_post__pathways_sessions
      tags:
        - Generated-From-Handler
      summary: Documented from clinical-knowledge-platform-service handler (complete-not-delete sync)
