          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Ops SLA metrics envelope
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /internal/v1/teleconsult/ops/specialty-workbench:
    get:
      operationId: bffTeleconsultSpecialtyWorkbench
      tags:
        - Teleconsult
      summary: Specialist backlog workbench rows
      parameters:
        - name: facility_id
          in: query
          required: false
          schema:
            type: string
        - name: specialty
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Specialty workbench row envelope
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /internal/v1/mobile/provider/telemedicine/sessions:
    get:
      operationId: bffProviderTelemedicineList
      tags:
        - Telemedicine
      summary: Provider telemedicine session worklist
      responses:
        '200':
          description: Session listing envelope
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
    post:
      operationId: bffMobileProviderTelemedicineSessionsCreate
      tags:
