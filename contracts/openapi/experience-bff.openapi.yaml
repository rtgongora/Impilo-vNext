      summary: Legacy mobile telemedicine session create route
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '201':
          description: Telemedicine session created envelope
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /internal/v1/mobile/provider/telemedicine/sessions/{id}/join:
