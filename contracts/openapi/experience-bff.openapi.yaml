              additionalProperties: true
      responses:
        '200':
          description: Decline response envelope
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /internal/v1/teleconsult/sessions/{id}/messages:
    get:
      operationId: bffTeleconsultMessagesList
      tags:
        - Teleconsult
      summary: List teleconsult async messages
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Message thread envelope
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
    post:
      operationId: bffTeleconsultMessagesSend
      tags:
        - Teleconsult
      summary: Send teleconsult async message
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '202':
          description: Message accepted
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /internal/v1/teleconsult/sessions/{id}/response:
    post:
      operationId: bffTeleconsultSubmitResponse
      tags:
        - Teleconsult
      summary: Submit specialist response for teleconsult
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: Response accepted
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /internal/v1/teleconsult/sessions/{id}/complete:
    post:
      operationId: bffTeleconsultComplete
      tags:
        - Teleconsult
      summary: Complete teleconsult workflow
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: Completion envelope
          content:
            application/json:
              schema:
