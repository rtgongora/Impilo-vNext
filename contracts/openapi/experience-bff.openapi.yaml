  /internal/v1/teleconsult/sessions/{id}/end:
    post:
      operationId: bffTeleconsultEndCompatibility
      tags:
        - Teleconsult
      summary: Compatibility alias for session completion (mobile end semantics)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: End/completion envelope
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /internal/v1/teleconsult/ops/sla:
    get:
      operationId: bffTeleconsultOpsSla
      tags:
