openapi: 3.0.3
info:
  title: "Experience BFF"
  description: |
    Phase F baseline contract for `experience-bff`. Extend with real paths and schemas as the HTTP surface is stabilised.
  version: 0.1.0
tags:
  - name: Health
  - name: Summary
  - name: Data-Public-Health
  - name: Data-Reporting
  - name: Data-AI
  - name: Data-Governance
  - name: Enterprise-Marketplace
  - name: Enterprise-Coverage
  - name: Enterprise-Mobile-Billing
  - name: ERP-GL
  - name: ERP-HR
  - name: ERP-Procurement
  - name: AssetRegistry
servers:
  - url: http://localhost:8160
    description: Local default (`default_http_port` in docs/registry/services-registry.yaml)

paths:
  /internal/v1/summary/patient/{patientId}:
    get:
      operationId: bffPatientSummaryAggregated
      tags: [Summary]
      summary: Chart patient summary — PCT longitudinal slice + Mvumo consent surface
      parameters:
        - name: patientId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: |
            `{ data: { cpid, conditions, medications, allergies, immunizations, recentEncounters, consentSummary } }`
            — `consentSummary` matches Mvumo deriver output (criticalFlags, refusals, etc.).
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true

  /internal/v1/health:
    get:
      operationId: internalHealth
      summary: Internal health probe
      tags: [Health]
      responses:
        '200':
          description: Service reachable
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true

  /internal/v1/erp/gl/accounts:
    get:
      operationId: bffErpGlAccounts
      tags: [ERP-GL]
      summary: Proxy — GL accounts
      responses:
        '200':
          description: JSON array from general-ledger-service
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  additionalProperties: true
        '502':
          description: `GL_UNAVAILABLE` typed fail-close response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
