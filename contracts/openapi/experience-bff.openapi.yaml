components:
  schemas:
    CoreTransactionListEnvelope:
      type: object
      properties:
        data:
          type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/CoreTransactionBffView'
            failureModes:
              type: array
              items:
                type: string
    CoreTransactionEnvelope:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/CoreTransactionBffView'
    CoreTransactionTimelineEnvelope:
      type: object
      properties:
        data:
          type: object
          properties:
            timeline:
              type: array
              items:
                $ref: '#/components/schemas/CoreTransactionTimelineEntry'
    CoreTransactionNextActionsEnvelope:
      type: object
      properties:
        data:
          type: object
          properties:
            nextActions:
              type: array
              items:
                $ref: '#/components/schemas/CoreTransactionNextAction'
    CoreTransactionJourneysEnvelope:
      type: object
      properties:
        data:
          type: object
          properties:
            journeys:
              type: object
              properties:
                person:
                  $ref: '#/components/schemas/CoreTransactionJourneyView'
                provider:
                  $ref: '#/components/schemas/CoreTransactionJourneyView'
                platform:
                  $ref: '#/components/schemas/CoreTransactionJourneyView'
    CoreTransactionNompiloEnvelope:
      type: object
      properties:
        data:
          type: object
          properties:
            nompilo:
              $ref: '#/components/schemas/NompiloCompanionContext'
    CoreTransactionActionAcceptedEnvelope:
      type: object
      properties:
        data:
          type: object
          properties:
            transactionId:
              type: string
            status:
              type: string
            message:
              type: string
            payload:
              type: object
              additionalProperties: true
    CoreTransaction:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
        currentState:
          type: string
        lifecycleStage:
          type: string
        offlineSyncStatus:
          type: string
        failureModes:
          type: array
          items:
            type: string
        blockerReasons:
          type: array
          items:
            type: string
    CoreTransactionBffView:
      type: object
      properties:
        transaction:
          $ref: '#/components/schemas/CoreTransaction'
        journeys:
          type: object
          properties:
            person:
              $ref: '#/components/schemas/CoreTransactionJourneyView'
            provider:
              $ref: '#/components/schemas/CoreTransactionJourneyView'
            platform:
              $ref: '#/components/schemas/CoreTransactionJourneyView'
        timeline:
          type: array
          items:
            $ref: '#/components/schemas/CoreTransactionTimelineEntry'
        nextActions:
          type: array
          items:
            $ref: '#/components/schemas/CoreTransactionNextAction'
        failureModes:
          type: array
          items:
            type: string
        blockerReasons:
          type: array
          items:
            type: string
        nompilo:
          $ref: '#/components/schemas/NompiloCompanionContext'
        nompiloCommand:
          $ref: '#/components/schemas/NompiloCommandContext'
    CoreTransactionJourneyView:
      type: object
      properties:
        journeyType:
          type: string
        currentStage:
          type: string
        blockers:
          type: array
          items:
            type: string
        blockerReasons:
          type: array
          items:
            type: string
        nextActions:
          type: array
          items:
            $ref: '#/components/schemas/CoreTransactionNextAction'
    NompiloCompanionContext:
      type: object
      properties:
        available:
          type: boolean
        mode:
          type: string
        confidence:
          type: string
        currentGuidance:
          type: array
          items:
            type: object
            additionalProperties: true
    NompiloCommandContext:
      type: object
      properties:
        enabled:
          type: boolean
        surfaces:
          type: array
