components:
  schemas:
    CoreTransactionListEnvelope:
      type: object
      properties:
        data:
          type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/CoreTransactionBffView'
            failureModes:
              type: array
              items:
                type: string
    CoreTransactionEnvelope:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/CoreTransactionBffView'
    CoreTransactionTimelineEnvelope:
      type: object
      properties:
        data:
          type: object
          properties:
            timeline:
              type: array
              items:
                $ref: '#/components/schemas/CoreTransactionTimelineEntry'
    CoreTransactionNextActionsEnvelope:
      type: object
      properties:
        data:
          type: object
          properties:
            nextActions:
              type: array
              items:
                $ref: '#/components/schemas/CoreTransactionNextAction'
    CoreTransactionJourneysEnvelope:
      type: object
      properties:
        data:
          type: object
          properties:
            journeys:
              type: object
              properties:
                person:
                  $ref: '#/components/schemas/CoreTransactionJourneyView'
                provider:
                  $ref: '#/components/schemas/CoreTransactionJourneyView'
                platform:
                  $ref: '#/components/schemas/CoreTransactionJourneyView'
    CoreTransactionNompiloEnvelope:
      type: object
      properties:
        data:
          type: object
          properties:
            nompilo:
              $ref: '#/components/schemas/NompiloCompanionContext'
    CoreTransactionActionAcceptedEnvelope:
      type: object
      properties:
        data:
          type: object
          properties:
            transactionId:
              type: string
            status:
              type: string
            message:
              type: string
            payload:
              type: object
              additionalProperties: true
    CoreTransaction:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
        currentState:
          type: string
        lifecycleStage:
          type: string
        offlineSyncStatus:
          type: string
        failureModes:
          type: array
          items:
            type: string
        blockerReasons:
          type: array
          items:
            type: string
    CoreTransactionBffView:
      type: object
      properties:
        transaction:
          $ref: '#/components/schemas/CoreTransaction'
        journeys:
          type: object
          properties:
            person:
              $ref: '#/components/schemas/CoreTransactionJourneyView'
            provider:
              $ref: '#/components/schemas/CoreTransactionJourneyView'
            platform:
              $ref: '#/components/schemas/CoreTransactionJourneyView'
        timeline:
          type: array
          items:
            $ref: '#/components/schemas/CoreTransactionTimelineEntry'
        nextActions:
          type: array
          items:
            $ref: '#/components/schemas/CoreTransactionNextAction'
        failureModes:
          type: array
          items:
            type: string
        blockerReasons:
          type: array
          items:
            type: string
        nompilo:
          $ref: '#/components/schemas/NompiloCompanionContext'
        nompiloCommand:
          $ref: '#/components/schemas/NompiloCommandContext'
    CoreTransactionJourneyView:
      type: object
      properties:
        journeyType:
          type: string
        currentStage:
          type: string
        blockers:
          type: array
          items:
            type: string
        blockerReasons:
          type: array
          items:
            type: string
        nextActions:
          type: array
          items:
            $ref: '#/components/schemas/CoreTransactionNextAction'
    NompiloCompanionContext:
      type: object
      properties:
        available:
          type: boolean
        mode:
          type: string
        confidence:
          type: string
        currentGuidance:
          type: array
          items:
            type: object
            additionalProperties: true
    NompiloCommandContext:
      type: object
      properties:
        enabled:
          type: boolean
        surfaces:
          type: array
          items:
            type: string
        availableSearchSources:
          type: array
          items:
            type: string
        suggestedCommands:
          type: array
          items:
            type: string
        recentCommands:
          type: array
          items:
            type: string
        voiceEnabled:
          type: boolean
        dictationEnabled:
          type: boolean
        toolPermissions:
          type: array
          items:
            type: object
            additionalProperties: true
        loginBriefing:
          type: object
          additionalProperties: true
        supportHandoff:
          type: object
          additionalProperties: true
        analyticsCapabilities:
          type: array
          items:
            type: string
        learningCapabilities:
          type: array
          items:
            type: string
    CoreTransactionTimelineEntry:
      type: object
      properties:
        at:
          type: string
        eventName:
          type: string
        stateBefore:
          type: string
        stateAfter:
          type: string
        actorId:
          type: string
    CoreTransactionNextAction:
      type: object
      properties:
        code:
          type: string
        label:
          type: string
    CommsErrorEnvelope:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
        meta:
          type: object
          properties:
            request_id:
              type: string
            correlation_id:
              type: string
    CommsHealthEnvelope:
      type: object
      properties:
        data:
          type: object
          properties:
            healthy:
              type: boolean
            checks:
              type: object
              additionalProperties:
                type: string
            checked_at:
              type: string
              format: date-time
        meta:
          type: object
          additionalProperties: true
    CommsDecisionEnvelope:
      type: object
      properties:
        data:
          type: object
          properties:
            decision:
              type: string
            reviewed_by:
              type: string
            reviewed_at:
              type: string
              format: date-time
            decision_reason:
              type: string
            result:
              type: object
              additionalProperties: true
        meta:
          type: object
          additionalProperties: true
    CommsDryRunEnvelope:
      type: object
      properties:
        data:
          type: object
          properties:
            campaign_id:
              type: integer
              format: int64
            template_id:
              type: string
            dry_run_ok:
              type: boolean
            issues:
              type: array
              items:
                type: string
            estimated_reachable_audience:
              type: integer
