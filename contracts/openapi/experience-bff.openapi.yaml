openapi: 3.0.3
info:
  title: "Experience BFF"
  description: |
    Phase F baseline contract for `experience-bff`. Extend with real paths and schemas as the HTTP surface is stabilised.
  version: 0.1.0
tags:
  - name: Health
  - name: Summary
  - name: Data-Public-Health
  - name: Data-Reporting
  - name: Data-AI
  - name: Data-Governance
  - name: Enterprise-Marketplace
  - name: Enterprise-Coverage
  - name: Enterprise-Mobile-Billing
  - name: ERP-GL
  - name: ERP-HR
  - name: ERP-Procurement
  - name: AssetRegistry
  - name: Teleconsult
  - name: Telemedicine
  - name: Learning
servers:
  - url: http://localhost:8160
    description: Local default (`default_http_port` in docs/registry/services-registry.yaml)

paths:
  /internal/v1/core-transactions:
    get:
      operationId: bffCoreTransactionsList
      tags: [Summary]
      summary: List composed core transaction views (internal canonical surface)
      parameters:
        - name: state
          in: query
          required: false
          schema: { type: string }
        - name: type
          in: query
          required: false
          schema: { type: string }
      responses:
        '200':
          description: Core transaction list envelope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoreTransactionListEnvelope'
    post:
      operationId: bffCoreTransactionsCreate
      tags: [Summary]
      summary: Start a new core transaction workflow
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '201':
          description: Core transaction created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoreTransactionEnvelope'

  /internal/v1/core-transactions/{transactionId}:
    get:
      operationId: bffCoreTransactionGet
      tags: [Summary]
      summary: Get composed core transaction view by ID
      parameters:
        - name: transactionId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Core transaction composed view
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoreTransactionEnvelope'
    post:
      operationId: bffCoreTransactionPostCompatibility
      tags: [Summary]
      summary: Compatibility post route (reserved)
      parameters:
        - name: transactionId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoreTransactionEnvelope'

  /internal/v1/core-transactions/{transactionId}/actions/{actionCode}:
    post:
      operationId: bffCoreTransactionAction
      tags: [Summary]
      summary: Apply action to core transaction
      parameters:
        - name: transactionId
          in: path
          required: true
          schema: { type: string }
        - name: actionCode
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '202':
          description: Action accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoreTransactionEnvelope'

  /internal/v1/core-transactions/{transactionId}/timeline:
    get:
      operationId: bffCoreTransactionTimeline
      tags: [Summary]
      summary: Get core transaction timeline
      parameters:
        - name: transactionId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Timeline entries
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoreTransactionTimelineEnvelope'

  /internal/v1/core-transactions/{transactionId}/next-actions:
    get:
      operationId: bffCoreTransactionNextActions
      tags: [Summary]
      summary: Get next allowed actions for transaction
      parameters:
        - name: transactionId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Next actions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoreTransactionNextActionsEnvelope'

  /internal/v1/core-transactions/{transactionId}/journeys:
    get:
      operationId: bffCoreTransactionJourneys
      tags: [Summary]
      summary: Get synchronized person/provider/platform journey views
      parameters:
        - name: transactionId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Journey view envelope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoreTransactionJourneysEnvelope'

  /internal/v1/core-transactions/{transactionId}/nompilo:
    get:
      operationId: bffCoreTransactionNompilo
      tags: [Summary]
      summary: Get Nompilo companion context for transaction
      parameters:
        - name: transactionId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Nompilo context envelope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoreTransactionNompiloEnvelope'

  /internal/v1/core-transactions/{transactionId}/feedback:
    post:
      operationId: bffCoreTransactionFeedback
      tags: [Summary]
      summary: Submit transaction journey feedback
      parameters:
        - name: transactionId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '202':
          description: Feedback accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoreTransactionActionAcceptedEnvelope'

  /internal/v1/core-transactions/{transactionId}/nompilo/handoff:
    post:
      operationId: bffCoreTransactionNompiloHandoff
      tags: [Summary]
      summary: Request Nompilo human handoff for transaction
      parameters:
        - name: transactionId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '202':
          description: Handoff accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoreTransactionActionAcceptedEnvelope'

  /internal/v1/core-transactions/{transactionId}/nompilo/command:
    post:
      operationId: bffCoreTransactionNompiloCommand
      tags: [Summary]
      summary: Execute governed Nompilo command for transaction context
      parameters:
        - name: transactionId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '202':
          description: Command accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoreTransactionActionAcceptedEnvelope'

  /internal/v1/summary/patient/{patientId}:
    get:
      operationId: bffPatientSummaryAggregated
      tags: [Summary]
      summary: Chart patient summary — PCT longitudinal slice + Mvumo consent surface
      parameters:
        - name: patientId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: |
            `{ data: { cpid, conditions, medications, allergies, immunizations, recentEncounters, consentSummary } }`
            — `consentSummary` matches Mvumo deriver output (criticalFlags, refusals, etc.).
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true

  /internal/v1/health:
    get:
      operationId: internalHealth
      summary: Internal health probe
      tags: [Health]
      responses:
        '200':
          description: Service reachable
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true

  /internal/v1/teleconsult/sessions:
