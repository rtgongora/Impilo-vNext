openapi: 3.0.3
info:
  title: Document Store Service API
  description: |
    Internal provider-neutral document storage backend.
    Binary storage is routed through a pluggable provider contract (current adapter: MinIO/S3).
    Used by experience-bff and landela-adapter-service for document object lifecycle operations.
  version: 0.1.0

servers:
  - url: http://localhost:8093
    description: Local development

security:
  - bearerAuth: []

paths:
  /v1/internal/objects:
    post:
      operationId: storeObject
      summary: Store a binary object (multipart upload)
      tags: [Object Storage]
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                originalFilename:
                  type: string
                mimeType:
                  type: string
                metadata:
                  type: string
                  description: JSON string
      responses:
        '201':
          description: Object stored

  /v1/internal/objects/{objectId}:
    get:
      operationId: getObjectMetadata
      summary: Get object metadata
      tags: [Object Storage]
      parameters:
        - name: objectId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Object metadata
    delete:
      operationId: deleteObject
      summary: Soft-delete an object
      tags: [Object Storage]
      parameters:
        - name: objectId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Object deleted

  /v1/internal/objects/{objectId}/signed-url:
    get:
      operationId: generateSignedUrl
      summary: Generate pre-signed download URL
      tags: [Object Storage]
      parameters:
        - name: objectId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Signed URL

  /v1/internal/objects/{objectId}/preview:
    get:
      operationId: generatePreviewUrl
      summary: Generate inline preview payload
      description: Returns a signed URL with MIME/disposition hints for inline-safe preview clients.
      tags: [Object Storage]
      parameters:
        - name: objectId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Preview payload

  /v1/internal/objects/{objectId}/ocr:
    post:
      operationId: requestOcrExtraction
      summary: Request OCR extraction
      description: Runs OCR using configured provider abstraction and returns latest OCR job payload.
      tags: [Object Storage]
      parameters:
        - name: objectId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '202':
          description: OCR job accepted/processed
    get:
      operationId: getLatestOcrExtraction
      summary: Get latest OCR extraction payload
      tags: [Object Storage]
      parameters:
        - name: objectId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OCR job payload

  /v1/internal/objects/{objectId}/signature:
    post:
      operationId: requestDocumentSignature
      summary: Request document signature
      description: Runs signature workflow using configured provider abstraction and returns latest signature job payload.
      tags: [Object Storage]
      parameters:
        - name: objectId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '202':
          description: Signature job accepted/processed
    get:
      operationId: getLatestDocumentSignature
      summary: Get latest signature job payload
      tags: [Object Storage]
      parameters:
        - name: objectId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Signature job payload

  /v1/internal/objects/signatures/{jobId}/verify:
    get:
      operationId: verifyDocumentSignature
      summary: Verify signature evidence for a job
      tags: [Object Storage]
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Signature verification payload

  /v1/internal/objects/{objectId}/download:
    get:
      operationId: downloadObject
      summary: Proxy download
      tags: [Object Storage]
      parameters:
        - name: objectId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Binary stream
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary

  /v1/internal/objects/by-hash/{sha256}:
    get:
      operationId: getObjectByHash
      summary: Find object by SHA-256 hash
      tags: [Object Storage]
      parameters:
        - name: sha256
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Object metadata
        '404':
          description: Object not found

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
