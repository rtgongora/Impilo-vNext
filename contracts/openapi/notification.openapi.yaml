# =============================================================================
# Notification — enqueue and template API (OpenAPI 3.0)
# Phase B baseline: core notify + list (`NotifyController`); extend for templates/worker.
# =============================================================================
openapi: "3.0.3"

info:
  title: Notification Service API
  version: "1.0.0"
  description: |
    Internal notification enqueue and history. Additional controllers live under
    `/internal/v1/templates`, `/internal/v1/delivery-receipts`, `/internal/v1/worker`.
  contact:
    name: Impilo Platform Team
  license:
    name: Proprietary

servers:
  - url: http://localhost:8200
    description: Local development
  - url: https://{tenant}.impilo.health/api
    description: Production (per-tenant)
    variables:
      tenant:
        default: demo

security:
  - bearerAuth: []

tags:
  - name: Internal-Notify
    description: Notification enqueue and listing

paths:
  /internal/v1/notify:
    post:
      operationId: notificationEnqueue
      tags: [Internal-Notify]
      summary: Enqueue a notification for delivery
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: NotifyRequest
              additionalProperties: true
      responses:
        "201":
          description: Accepted for delivery
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true

  /internal/v1/notifications:
    get:
      operationId: notificationList
      tags: [Internal-Notify]
      summary: Page notifications for tenant
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 0
        - name: size
          in: query
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Spring Data page of notifications
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
