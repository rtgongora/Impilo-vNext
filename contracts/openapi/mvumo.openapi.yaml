openapi: 3.0.3
info:
  title: MVUMO Trust Orchestration API
  version: 1.0.0
  description: Canonical internal MVUMO API for consent orchestration and remote consent sessions.
servers:
  - url: /internal/v1/mvumo
paths:
  /consent-requests:
    post:
      summary: Create a consent request (booking, telemedicine, referral, etc.)
      parameters:
        - $ref: '#/components/parameters/TenantIdHeader'
        - $ref: '#/components/parameters/CorrelationIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateConsentRequest'
      responses:
        '200':
          description: Consent request created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelopeConsentRequest'
        '400':
          $ref: '#/components/responses/BadRequest'
  /consent-requests/{id}:
    get:
      summary: Get consent request by ID
      parameters:
        - $ref: '#/components/parameters/TenantIdHeader'
        - $ref: '#/components/parameters/ConsentRequestIdPath'
      responses:
        '200':
          description: Consent request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelopeConsentRequest'
        '404':
          $ref: '#/components/responses/NotFound'
  /consent-requests/{id}/grant:
    post:
      summary: Grant consent (gates booking confirmation when required)
      parameters:
        - $ref: '#/components/parameters/TenantIdHeader'
        - $ref: '#/components/parameters/ActorIdHeader'
        - $ref: '#/components/parameters/CorrelationIdHeader'
        - $ref: '#/components/parameters/ConsentRequestIdPath'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Consent granted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelopeConsentRequest'
        '400':
          $ref: '#/components/responses/BadRequest'
  /consent-requests/{id}/refuse:
    post:
      summary: Refuse consent
      parameters:
        - $ref: '#/components/parameters/TenantIdHeader'
        - $ref: '#/components/parameters/ActorIdHeader'
        - $ref: '#/components/parameters/CorrelationIdHeader'
        - $ref: '#/components/parameters/ConsentRequestIdPath'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
      responses:
        '200':
          description: Consent refused
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelopeConsentRequest'
  /consent-requests/{id}/withdraw:
    post:
      summary: Withdraw previously granted consent
      parameters:
        - $ref: '#/components/parameters/TenantIdHeader'
        - $ref: '#/components/parameters/ActorIdHeader'
        - $ref: '#/components/parameters/CorrelationIdHeader'
        - $ref: '#/components/parameters/ConsentRequestIdPath'
      responses:
        '200':
          description: Consent withdrawn
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelopeConsentRequest'
  /evaluate:
    post:
      summary: Evaluate consent decision through TSHEPO consent
      parameters:
        - $ref: '#/components/parameters/TenantIdHeader'
        - $ref: '#/components/parameters/CorrelationIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConsentEvaluateRequest'
      responses:
        '200':
          description: Decision returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelopeDecision'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Denied'
        '503':
          $ref: '#/components/responses/DependencyUnavailable'
  /remote-sessions/{id}/verify:
    post:
      summary: Verify a remote consent session token
      parameters:
        - $ref: '#/components/parameters/TenantIdHeader'
        - $ref: '#/components/parameters/ActorIdHeader'
        - $ref: '#/components/parameters/PurposeHeader'
        - $ref: '#/components/parameters/CorrelationIdHeader'
        - $ref: '#/components/parameters/SessionIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - token
              properties:
                token:
                  type: string
      responses:
        '200':
          description: Session verified
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelopeMap'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Denied'
        '404':
          $ref: '#/components/responses/NotFound'
  /remote-sessions/{id}/grant:
    post:
      summary: Grant consent through a verified remote session
      parameters:
        - $ref: '#/components/parameters/TenantIdHeader'
        - $ref: '#/components/parameters/ActorIdHeader'
        - $ref: '#/components/parameters/PurposeHeader'
        - $ref: '#/components/parameters/CorrelationIdHeader'
        - $ref: '#/components/parameters/SessionIdPath'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Consent granted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelopeMap'
        '400':
          $ref: '#/components/responses/BadRequest'
        '503':
          $ref: '#/components/responses/DependencyUnavailable'
  /remote-sessions/{id}/refuse:
    post:
      summary: Refuse consent through a verified remote session
      parameters:
        - $ref: '#/components/parameters/TenantIdHeader'
        - $ref: '#/components/parameters/ActorIdHeader'
        - $ref: '#/components/parameters/PurposeHeader'
        - $ref: '#/components/parameters/CorrelationIdHeader'
        - $ref: '#/components/parameters/SessionIdPath'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Consent refused
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelopeMap'
        '400':
          $ref: '#/components/responses/BadRequest'
        '503':
          $ref: '#/components/responses/DependencyUnavailable'
  /remote-sessions/{id}/withdraw:
    post:
      summary: Withdraw consent through a verified remote session
      parameters:
        - $ref: '#/components/parameters/TenantIdHeader'
        - $ref: '#/components/parameters/ActorIdHeader'
        - $ref: '#/components/parameters/PurposeHeader'
        - $ref: '#/components/parameters/CorrelationIdHeader'
        - $ref: '#/components/parameters/SessionIdPath'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Consent withdrawn
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelopeMap'
        '400':
          $ref: '#/components/responses/BadRequest'
        '503':
          $ref: '#/components/responses/DependencyUnavailable'
  /templates:
    post:
      summary: Create a new consent template version
      parameters:
        - $ref: '#/components/parameters/TenantIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - templateKey
                - consentType
                - title
                - bodyMarkdown
              properties:
                templateKey:
                  type: string
                version:
                  type: integer
                  minimum: 1
                language:
                  type: string
                consentType:
                  type: string
                requiredAssurance:
                  type: string
                title:
                  type: string
                bodyMarkdown:
                  type: string
                allowedMethodsJson:
                  type: string
                ziboConceptCode:
                  type: string
                remoteAllowed:
                  type: boolean
                offlineAllowed:
                  type: boolean
      responses:
        '200':
          description: Template created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelopeMap'
        '400':
          $ref: '#/components/responses/BadRequest'
    get:
      operationId: mvumo_get__templates
      tags:
        - Generated-From-Handler
      summary: Documented from mvumo-service handler (complete-not-delete sync)
      responses:
        '200':
          description: Success
