components:
  parameters:
    TenantIdHeader:
      name: X-Tenant-Id
      in: header
      required: false
      schema:
        type: string
        format: uuid
    CorrelationIdHeader:
      name: X-Correlation-Id
      in: header
      required: true
      schema:
        type: string
        format: uuid
    ActorIdHeader:
      name: X-Actor-Id
      in: header
      required: true
      schema:
        type: string
    PurposeHeader:
      name: X-Purpose-Of-Use
      in: header
      required: true
      schema:
        type: string
    SessionIdPath:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ConsentRequestIdPath:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    BadRequest:
      description: Validation or trust-context error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiEnvelopeError'
    Denied:
      description: Policy or consent denied
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiEnvelopeError'
    DependencyUnavailable:
      description: Downstream trust dependency unavailable
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiEnvelopeError'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiEnvelopeError'
  schemas:
    ConsentEvaluateRequest:
      type: object
      required: [actorId, subjectRef]
      properties:
        tenantId:
          type: string
          format: uuid
        actorId:
          type: string
        subjectRef:
          type: string
        purpose:
          type: string
        scope:
          type: string
    DecisionResponse:
      type: object
      properties:
        decision: { type: string }
        reason: { type: string }
        code: { type: string }
        consentId: { type: string }
        correlationId: { type: string }
        timestamp: { type: string, format: date-time }
    ApiEnvelopeDecision:
      type: object
      properties:
        success: { type: boolean }
        data:
          $ref: '#/components/schemas/DecisionResponse'
        requestId: { type: string }
    ApiEnvelopeMap:
      type: object
      properties:
        success: { type: boolean }
        data:
          type: object
          additionalProperties: true
        requestId: { type: string }
    ApiEnvelopeError:
      type: object
      properties:
        success: { type: boolean, example: false }
        error:
          type: object
          properties:
            code: { type: string }
            message: { type: string }
        requestId: { type: string }
    CreateConsentRequest:
      type: object
      required: [subjectPatientRef, consentType]
      properties:
        subjectPatientRef: { type: string }
        consentType: { type: string, description: "CONSENT | AGREEMENT | AUTHORISATION | ACKNOWLEDGEMENT" }
        templateId: { type: string, format: uuid }
        workflowRef: { type: string, description: "e.g. booking:{uuid}" }
        encounterRef: { type: string }
        context: { type: object, additionalProperties: true }
    ConsentRequestView:
      type: object
      properties:
        id: { type: string, format: uuid }
        state: { type: string }
        subjectPatientRef: { type: string }
        consentType: { type: string }
        workflowRef: { type: string }
        tshepoConsentId: { type: string }
        refusedReason: { type: string }
        expiresAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
    ApiEnvelopeConsentRequest:
      type: object
      properties:
        success: { type: boolean }
        data:
          $ref: '#/components/schemas/ConsentRequestView'
        requestId: { type: string }
