      responses:
        '200':
          description: Success
    get:
      operationId: connectorfhiradapter_get__internal_v1_fhir_destinations
      tags:
        - Generated-From-Handler
      summary: Documented from connector-fhir-adapter handler (complete-not-delete sync)
      responses:
        '200':
          description: Success
  /internal/v1/fhir/audit:
