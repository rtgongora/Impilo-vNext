openapi: 3.0.3
info:
  title: "Connector FHIR"
  description: |
    Phase F baseline contract for `connector-fhir-adapter`. Extend with real paths and schemas as the HTTP surface is stabilised.
  version: 0.1.0
servers:
  - url: http://localhost:8151
    description: Local default (`default_http_port` in docs/registry/services-registry.yaml)

paths:
  /internal/v1/health:
    get:
      operationId: internalHealth
      summary: Internal health probe
      tags:
        - Health
      responses:
        '200':
          description: Service reachable
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /internal/v1/fhir/relay:
    post:
      operationId: connectorfhiradapter_post__internal_v1_fhir_relay
      tags:
        - Generated-From-Handler
      summary: Documented from connector-fhir-adapter handler (complete-not-delete sync)
      responses:
        '200':
          description: Success
  /internal/v1/fhir/destinations:
    post:
      operationId: connectorfhiradapter_post__internal_v1_fhir_destinations
      tags:
        - Generated-From-Handler
