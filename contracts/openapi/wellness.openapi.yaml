components:
  parameters:
    XTenantId:
      name: X-Tenant-ID
      in: header
      required: true
      schema:
        type: string
    PatientIdQuery:
      name: patientId
      in: query
      required: true
      schema:
        type: string
        description: CPID for the citizen in tenant scope.
  schemas:
    EnvelopeObject:
      type: object
      properties:
        data:
          type: object
          additionalProperties: true
    CitizenListEnvelope:
      type: object
      properties:
        data:
          type: array
          items:
            type: object
            additionalProperties: true
    IngestResultEnvelope:
      type: object
      properties:
        data:
          type: object
          properties:
            applied:
              type: integer
            skipped:
              type: integer
            errors:
              type: array
              items:
                type: object
                additionalProperties: true
    HealthConnectChangeSetRequest:
      type: object
      required: [patientId, dataOrigin]
      description: >
        Full field matrix matches `HealthConnectChangeSetRequest` in wellness-service; additional HC fields
        are accepted on records and mapped or stored per manifest.
      properties:
        patientId:
          type: string
        dataOrigin:
          $ref: '#/components/schemas/HcDataOrigin'
        grantedScopes:
          type: array
          items:
            type: string
          maxItems: 128
        records:
          type: array
          maxItems: 500
          items:
            $ref: '#/components/schemas/HcHealthRecord'
    HcDataOrigin:
      type: object
      required: [platform]
      properties:
        platform:
          type: string
          example: android_health_connect
        appPackage:
          type: string
        appVersion:
          type: string
    HcHealthRecord:
      type: object
      required: [id, type, startTime]
      description: >
        Per-record payload; see Java `HealthConnectChangeSetRequest.HealthRecord` for the complete property
        list (steps, sleepStages, samples, vitals, exercise, nutrition, etc.). Unknown JSON keys are ignored.
      properties:
        id:
          type: string
        type:
          type: string
        startTime:
          type: string
        endTime:
          type: string
        startZoneOffset:
          type: string
        endZoneOffset:
          type: string
        metadata:
          type: object
          additionalProperties: true
        sleepStages:
          type: array
          items:
            type: object
            additionalProperties: true
        samples:
          type: array
          items:
            type: object
            additionalProperties: true
      additionalProperties: true
    WellnessSourceCreateRequest:
      type: object
      required: [patientId, sourceType, sourceName]
      properties:
        patientId:
          type: string
        sourceType:
          type: string
          enum: [manual_entry, android_health_connect, apple_healthkit, wearable, iot_device, remote_monitoring_device, provider_entry, community_health_worker_entry, imported_file, external_api, unknown]
        sourceName:
          type: string
        sourceDeviceId:
          type: string
        sourceAppId:
          type: string
        sourcePriority:
          type: integer
        providerAccessAllowed:
          type: boolean
        clinicalWritebackAllowed:
          type: boolean
        consentStatus:
          type: string
          enum: [GRANTED, REVOKED, PENDING]
        sharingScope:
          type: string
          enum: [PERSONAL_ONLY, SHARED_WITH_PROVIDER, PROGRAMME]
        categoryPermissions:
          type: object
          additionalProperties:
            type: boolean
    WellnessSourcePermissionPatch:
      type: object
      properties:
        providerAccessAllowed:
          type: boolean
        clinicalWritebackAllowed:
          type: boolean
        consentStatus:
          type: string
          enum: [GRANTED, REVOKED, PENDING]
        sharingScope:
          type: string
          enum: [PERSONAL_ONLY, SHARED_WITH_PROVIDER, PROGRAMME]
        status:
          type: string
          enum: [CONNECTED, DISCONNECTED, BLOCKED]
        categoryPermissions:
          type: object
          additionalProperties:
            type: boolean
    ManualWellnessReadingRequest:
      type: object
      required: [patientId, category, value]
      properties:
        patientId:
          type: string
        category:
          type: string
          description: Vital or wellness category key (example HEART_RATE, SLEEP_SCORE, WATER_ML)
        value:
          type: number
        unit:
          type: string
        measuredAt:
          type: string
          format: date-time
        sourceType:
          type: string
          enum: [manual_entry, provider_entry, community_health_worker_entry]
        notes:
          type: string
    RemoteAlertCreateRequest:
      type: object
      required: [patientId, category]
      properties:
        patientId:
          type: string
        sourceId:
          type: string
          format: uuid
        category:
          type: string
        vitalType:
          type: string
        observedValue:
          type: number
        thresholdMin:
          type: number
        thresholdMax:
          type: number
        unit:
          type: string
        measuredAt:
          type: string
          format: date-time
        severity:
          type: string
          enum: [LOW, MEDIUM, HIGH, CRITICAL]
    RemoteAlertReviewRequest:
      type: object
      properties:
        status:
          type: string
          enum: [OPEN, ACKNOWLEDGED, RESOLVED, DISMISSED]
        escalationStatus:
          type: string
          enum: [PENDING_REVIEW, ESCALATED, FOLLOW_UP_SCHEDULED, CLOSED]
        reviewNotes:
          type: string
