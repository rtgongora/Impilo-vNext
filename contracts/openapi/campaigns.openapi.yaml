# =============================================================================
# Campaigns — outreach campaigns (OpenAPI 3.0)
# Phase B baseline: campaign CRUD entry points (BFF proxies via `PublicHealthController`).
# =============================================================================
openapi: "3.0.3"

info:
  title: Campaigns Service API
  version: "1.0.0"
  description: |
    Health programme campaigns, enrollment, and dispatch. Internal API uses
    TSHEPO `TrustContext` (`ApiResponse` envelopes).
  contact:
    name: Impilo Platform Team
  license:
    name: Proprietary

servers:
  - url: http://localhost:8190
    description: Local development
  - url: https://{tenant}.impilo.health/api
    description: Production (per-tenant)
    variables:
      tenant:
        default: demo

security:
  - bearerAuth: []

tags:
  - name: Internal-Campaigns
    description: Campaign lifecycle

paths:
  /internal/v1/campaigns:
    get:
      operationId: campaignsList
      tags:
        - Internal-Campaigns
      summary: List campaigns (paged)
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            minimum: 1
            default: 50
      responses:
        '200':
          description: Paged campaigns (`ApiResponse` of `PagedResponse`)
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
    post:
      operationId: campaignsCreate
      tags:
        - Internal-Campaigns
      summary: Create campaign
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /internal/v1/campaigns/{id}:
    get:
      operationId: campaignsGet
      tags:
        - Internal-Campaigns
      summary: Get campaign by id
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Campaign payload
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /internal/v1/campaigns/{id}/close:
    post:
      operationId: campaignsClose
      tags:
        - Internal-Campaigns
      summary: Close campaign
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Campaign closed
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /internal/v1/campaigns/{id}/enroll:
    post:
      operationId: campaignsEnroll
      tags:
        - Internal-Campaigns
      summary: Enroll participant in campaign
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: Enrollment response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /internal/v1/campaigns/{id}/dispatch:
    post:
      operationId: campaignsDispatch
      tags:
        - Internal-Campaigns
      summary: Dispatch campaign to target channels
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Dispatch accepted
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /:
    post:
      operationId: campaigns_post__
      tags:
        - Generated-From-Handler
      summary: Documented from campaigns-service handler (complete-not-delete sync)
      responses:
        '200':
          description: Success
    get:
      operationId: campaigns_get__
      tags:
        - Generated-From-Handler
      summary: Documented from campaigns-service handler (complete-not-delete sync)
      responses:
        '200':
          description: Success
  /{id}:
    get:
      operationId: campaigns_get__id_
      tags:
        - Generated-From-Handler
      summary: Documented from campaigns-service handler (complete-not-delete sync)
      responses:
        '200':
          description: Success
  /{id}/close:
    post:
      operationId: campaigns_post__id_close
      tags:
        - Generated-From-Handler
      summary: Documented from campaigns-service handler (complete-not-delete sync)
      responses:
        '200':
          description: Success
  /{id}/enroll:
    post:
      operationId: campaigns_post__id_enroll
      tags:
        - Generated-From-Handler
      summary: Documented from campaigns-service handler (complete-not-delete sync)
      responses:
        '200':
          description: Success
  /{id}/dispatch:
    post:
      operationId: campaigns_post__id_dispatch
      tags:
        - Generated-From-Handler
      summary: Documented from campaigns-service handler (complete-not-delete sync)
      responses:
        '200':
          description: Success

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
