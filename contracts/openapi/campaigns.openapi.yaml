# =============================================================================
# Campaigns — outreach campaigns (OpenAPI 3.0)
# Phase B baseline: campaign CRUD entry points (BFF proxies via `PublicHealthController`).
# =============================================================================
openapi: "3.0.3"

info:
  title: Campaigns Service API
  version: "1.0.0"
  description: |
    Health programme campaigns, enrollment, and dispatch. Internal API uses
    TSHEPO `TrustContext` (`ApiResponse` envelopes).
  contact:
    name: Impilo Platform Team
  license:
    name: Proprietary

servers:
  - url: http://localhost:8190
    description: Local development
  - url: https://{tenant}.impilo.health/api
    description: Production (per-tenant)
    variables:
      tenant:
        default: demo

security:
  - bearerAuth: []

tags:
  - name: Internal-Campaigns
    description: Campaign lifecycle

paths:
  /internal/v1/campaigns:
    get:
      operationId: campaignsList
      tags: [Internal-Campaigns]
      summary: List campaigns (paged)
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            minimum: 1
            default: 50
      responses:
        "200":
          description: Paged campaigns (`ApiResponse` of `PagedResponse`)
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
    post:
      operationId: campaignsCreate
      tags: [Internal-Campaigns]
      summary: Create campaign
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
