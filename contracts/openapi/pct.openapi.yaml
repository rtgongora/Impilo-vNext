      bearerFormat: JWT
      description: Keycloak-issued JWT -- also validated by Envoy ext_authz -> TSHEPO

  # -------------------------------------------------------------------------
  # Reusable Parameters (trust headers)
  # -------------------------------------------------------------------------
  parameters:
    X-Tenant-Id:
      name: X-Tenant-Id
      in: header
      required: true
      description: Tenant identifier injected by TSHEPO
      schema:
        type: string
        example: "moh-zw"
    X-Correlation-Id:
      name: X-Correlation-Id
      in: header
      required: true
      description: End-to-end correlation ID for distributed tracing
      schema:
        type: string
        format: uuid
    X-Actor-Id:
      name: X-Actor-Id
      in: header
      required: true
      description: Actor (user/service) identifier injected by TSHEPO
      schema:
        type: string
        example: "clinician-001"
    X-Actor-Type:
      name: X-Actor-Type
      in: header
      required: true
      description: Type of actor (CLINICIAN, NURSE, ADMIN, SYSTEM)
      schema:
        type: string
        enum: [CLINICIAN, NURSE, ADMIN, SYSTEM]
        example: "CLINICIAN"
    X-Purpose-Of-Use:
      name: X-Purpose-Of-Use
      in: header
      required: true
      description: Purpose of use for access control evaluation
      schema:
        type: string
        enum: [TREATMENT, OPERATIONS, EMERGENCY, RESEARCH, AUDIT]
        example: "TREATMENT"
    X-Facility-Id:
      name: X-Facility-Id
      in: header
      required: false
      description: Facility identifier from active work session
      schema:
        type: string
    X-Workspace-Id:
      name: X-Workspace-Id
      in: header
      required: false
      description: Workspace identifier from active work session
      schema:
        type: string
    X-Shift-Id:
      name: X-Shift-Id
      in: header
      required: false
      description: Active shift identifier
      schema:
        type: string
        format: uuid

  # -------------------------------------------------------------------------
  # Reusable Responses
  # -------------------------------------------------------------------------
  responses:
    Unauthorized:
      description: Missing or invalid bearer token / trust headers
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    BadRequest:
      description: Invalid request body or parameters
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  # -------------------------------------------------------------------------
  # Schemas
  # -------------------------------------------------------------------------
  schemas:
    # -- API Envelope Wrappers --
    ApiResponseWorkSession:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          $ref: '#/components/schemas/WorkSession'

    ApiResponseWorkContext:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          $ref: '#/components/schemas/WorkContext'

    ApiResponseJourney:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          $ref: '#/components/schemas/Journey'

    ApiResponseQueueItem:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          $ref: '#/components/schemas/QueueItem'

    ApiResponseQueueItemArray:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: array
          items:
            $ref: '#/components/schemas/QueueItem'

    ApiResponseQueueArray:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: array
          items:
            $ref: '#/components/schemas/Queue'

    ApiResponseEncounter:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          $ref: '#/components/schemas/Encounter'

    ApiResponseAdmission:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          $ref: '#/components/schemas/Admission'

    ApiResponseDischargeCase:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          $ref: '#/components/schemas/DischargeCase'

    ApiResponseDeathCase:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          $ref: '#/components/schemas/DeathCase'

    ApiResponseControlTowerData:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          $ref: '#/components/schemas/ControlTowerData'

    ApiResponseBottleneckArray:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: array
          items:
            $ref: '#/components/schemas/Bottleneck'

    ApiResponseQueueTelemetryArray:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: array
          items:
            $ref: '#/components/schemas/QueueTelemetry'

    ApiResponseTask:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          $ref: '#/components/schemas/Task'

    ApiResponseTaskArray:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: array
          items:
            $ref: '#/components/schemas/Task'

    ApiResponsePatientTimeline:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          $ref: '#/components/schemas/PatientTimeline'

    # -- Request Schemas --
    WorkStartRequest:
      type: object
      required: [facilityId, workspaceId, dutyMode]
      properties:
        facilityId:
          type: string
          description: Facility where the shift takes place
          example: "FAC-001"
        workspaceId:
          type: string
          description: Workspace within the facility
          example: "WS-OPD-01"
        dutyMode:
          type: string
          enum: [CLINICAL, ADMIN, VIRTUAL]
          description: Type of duty for this shift
          example: "CLINICAL"

    JourneyStartRequest:
      type: object
      required: [patientCpid, facilityId]
      properties:
        patientCpid:
          type: string
          description: Patient CPID from VITO
          example: "CPID-00000001"
        facilityId:
          type: string
          description: Facility where the journey starts
          example: "FAC-001"

    TriageRequest:
      type: object
      required: [acuity]
      properties:
        acuity:
          type: integer
          minimum: 1
          maximum: 5
          description: "Triage acuity: 1=Red/Immediate, 2=Orange/Urgent, 3=Yellow/Semi-urgent, 4=Green/Non-urgent, 5=Blue/Admin"
          example: 3
        vitals:
          $ref: '#/components/schemas/Vitals'
        notes:
          type: string
          description: Triage notes / chief complaint
          example: "Chest pain, onset 2 hours ago"

    Vitals:
      type: object
      properties:
        systolicBp:
          type: number
          description: Systolic blood pressure (mmHg)
          example: 120
        diastolicBp:
          type: number
          description: Diastolic blood pressure (mmHg)
          example: 80
        heartRate:
          type: number
          description: Heart rate (beats per minute)
          example: 72
        temperature:
          type: number
          description: Temperature (Celsius)
          example: 36.5
        respiratoryRate:
          type: number
          description: Respiratory rate (breaths per minute)
          example: 16
        oxygenSaturation:
          type: number
          description: Oxygen saturation (SpO2 %)
          example: 98

    RouteRequest:
      type: object
      required: [targetQueueId]
      properties:
        targetQueueId:
          type: string
          format: uuid
          description: Queue to route the patient to
        priority:
          type: string
          enum: [NORMAL, HIGH, URGENT]
          default: NORMAL
          description: Queue priority override

    EnqueueRequest:
      type: object
      required: [journeyId, patientCpid]
      properties:
        journeyId:
          type: string
          format: uuid
        patientCpid:
          type: string
        priority:
          type: string
          enum: [NORMAL, HIGH, URGENT]
          default: NORMAL

    QueueStatusUpdateRequest:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [WAITING, CALLED, IN_SERVICE, COMPLETED, NO_SHOW, TRANSFERRED, CANCELLED]
          description: New status for the queue item

    QueueTransferRequest:
      type: object
      required: [targetQueueId, reason]
      properties:
        targetQueueId:
          type: string
          format: uuid
          description: Queue to transfer the item to
        reason:
          type: string
          description: Reason for transfer
          example: "Patient needs specialist consultation"

    AdmitRequest:
      type: object
      required: [wardId, reason]
      properties:
        wardId:
          type: string
          description: Target ward for admission
          example: "WARD-MED-01"
        reason:
          type: string
          description: Reason for admission
          example: "Pneumonia requiring IV antibiotics"
        expectedLos:
          type: integer
          description: Expected length of stay in days
          example: 5

    BedAssignRequest:
      type: object
      required: [bedId]
      properties:
        bedId:
          type: string
          description: Bed identifier to assign
          example: "BED-MED-01-A3"

    AdmissionTransferRequest:
      type: object
      required: [targetWardId, reason]
      properties:
        targetWardId:
          type: string
          description: Target ward for transfer
          example: "WARD-ICU-01"
        targetBedId:
          type: string
          description: Specific bed in the target ward (optional)
        reason:
          type: string
          description: Reason for inter-ward transfer
          example: "Patient condition deteriorated, requires ICU care"

    DeathRecordRequest:
      type: object
      required: [dateOfDeath, causeOfDeath, placeOfDeath, certifiedById]
      properties:
        dateOfDeath:
          type: string
          format: date-time
          description: Date and time of death (ISO 8601)
          example: "2024-12-15T14:30:00Z"
        causeOfDeath:
          type: string
          description: Primary cause of death
          example: "Acute myocardial infarction"
        placeOfDeath:
          type: string
          description: Location of death within the facility
          example: "ICU Ward A, Bed 3"
        certifiedById:
          type: string
          description: ID of the certifying practitioner
          example: "PROV-DR-042"

    UbomiStatusUpdateRequest:
      type: object
      required: [ubomiStatus]
      properties:
        ubomiStatus:
          type: string
          enum: [PENDING, SUBMITTED, ACCEPTED, REJECTED]
          description: UBOMI civil registration status

    ClearBlockerRequest:
      type: object
      required: [blockerId]
      properties:
        blockerId:
          type: string
          format: uuid
          description: ID of the discharge blocker to clear

    TaskCreateRequest:
      type: object
      required: [workspaceId, title, priority]
      properties:
        journeyId:
          type: string
          format: uuid
          description: Associated journey (optional)
        workspaceId:
          type: string
          description: Workspace the task belongs to
        title:
          type: string
          description: Task title
          example: "Follow up on lab results"
        description:
          type: string
          description: Detailed task description
        priority:
          type: string
          enum: [LOW, NORMAL, HIGH, URGENT]
          example: "NORMAL"
        assigneeId:
          type: string
          description: Actor ID to assign the task to
        dueAt:
          type: string
          format: date-time
          description: Task due date

    StartEncounterRequest:
      type: object
      required: [encounterType]
      properties:
        encounterType:
          type: string
          description: Encounter type (CONSULTATION, TELEHEALTH, EMERGENCY, etc.)
        encounterContext:
          type: string
          enum: [outpatient, emergency, inpatient, community, virtual, procedure, procedure_room, operating_room]
        entryPoint:
          type: string
          enum: [scheduled_appointment, walk_in, emergency_arrival, referral, community_outreach, virtual_request, inpatient_admission, transfer]
        modality:
          type: string
          enum: [in_person, virtual, hybrid]
        virtualMode:
          type: string
          enum: [async, chat, audio, video, scheduled, board]
        careSetting:
          type: string
          enum: [facility, community, home, mobile_outreach, virtual]
        priority:
          type: string
          enum: [routine, urgent, emergency]
        triageCategory:
          type: string
          description: Optional triage category token (for example P1, RED, YELLOW)
        pathwayRef:
          type: string
          description: Optional care-pathway reference identifier
        protocolRef:
          type: string
          description: Optional care-protocol reference identifier

    UpdateEncounterPathwayProtocolRequest:
      type: object
      properties:
        pathwayRef:
          type: string
          description: Optional care-pathway reference identifier
        protocolRef:
          type: string
          description: Optional care-protocol reference identifier

    # -- Domain Schemas --
    WorkSession:
      type: object
      required: [shiftId, actorId, actorDisplayName, facilityId, facilityName, workspaceId, workspaceName, dutyMode, startedAt, status]
      properties:
        shiftId:
          type: string
          format: uuid
          example: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
        actorId:
          type: string
          example: "clinician-001"
        actorDisplayName:
          type: string
          example: "Dr. Sarah Moyo"
        facilityId:
          type: string
          example: "FAC-001"
        facilityName:
          type: string
          example: "Parirenyatwa Group of Hospitals"
        workspaceId:
          type: string
          example: "WS-OPD-01"
        workspaceName:
          type: string
          example: "OPD Room 1"
        dutyMode:
          type: string
          enum: [CLINICAL, ADMIN, VIRTUAL]
        startedAt:
          type: string
          format: date-time
        endedAt:
          type: string
          format: date-time
          nullable: true
        status:
          type: string
          enum: [ACTIVE, ENDED]

    WorkContext:
      type: object
      required: [facilityId, facilityName, workspaceId, workspaceName]
      properties:
        activeShift:
          $ref: '#/components/schemas/WorkSession'
        facilityId:
          type: string
        facilityName:
          type: string
        workspaceId:
          type: string
        workspaceName:
          type: string

    Journey:
      type: object
      required: [id, patientCpid, facilityId, state, startedAt]
      properties:
        id:
          type: string
          format: uuid
        patientCpid:
          type: string
          example: "CPID-00000001"
        facilityId:
          type: string
        state:
          type: string
          enum: [ARRIVED, TRIAGED, QUEUED, IN_SERVICE, ENCOUNTER_STARTED, ADMITTED, DISCHARGED, DEATH_RECORDED, COMPLETED, CANCELLED]
        acuity:
          type: integer
          minimum: 1
          maximum: 5
          nullable: true
        tokenNumber:
          type: string
          nullable: true
          example: "A042"
        currentQueueId:
          type: string
          format: uuid
          nullable: true
        currentQueueName:
          type: string
          nullable: true
        encounterId:
          type: string
          format: uuid
          nullable: true
        admissionId:
          type: string
          format: uuid
          nullable: true
        startedAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
          nullable: true
        triageNotes:
          type: string
          nullable: true

    Queue:
      type: object
      required: [id, name, facilityId, workspaceId, waitingCount, inServiceCount, averageWaitMinutes, active]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          example: "General OPD"
        facilityId:
          type: string
        workspaceId:
          type: string
        waitingCount:
          type: integer
          example: 12
        inServiceCount:
          type: integer
          example: 3
        averageWaitMinutes:
          type: integer
          example: 25
        active:
          type: boolean

    QueueItem:
      type: object
      required: [id, queueId, journeyId, patientCpid, tokenNumber, priority, status, enqueuedAt]
      properties:
        id:
          type: string
          format: uuid
        queueId:
          type: string
          format: uuid
        journeyId:
          type: string
          format: uuid
        patientCpid:
          type: string
        tokenNumber:
          type: string
          example: "A042"
        priority:
          type: string
          enum: [NORMAL, HIGH, URGENT]
        status:
          type: string
          enum: [WAITING, CALLED, IN_SERVICE, COMPLETED, NO_SHOW, TRANSFERRED, CANCELLED]
        acuity:
          type: integer
          minimum: 1
          maximum: 5
          nullable: true
        enqueuedAt:
          type: string
          format: date-time
        calledAt:
          type: string
          format: date-time
          nullable: true
        serviceStartedAt:
          type: string
          format: date-time
          nullable: true
        completedAt:
          type: string
          format: date-time
          nullable: true

    Encounter:
      type: object
      required: [id, journeyId, patientCpid, facilityId, practitionerId, type, status, startedAt]
      properties:
        id:
          type: string
          format: uuid
        journeyId:
          type: string
          format: uuid
        patientCpid:
          type: string
        facilityId:
          type: string
        practitionerId:
          type: string
        type:
          type: string
          example: "AMB"
        encounterContext:
          type: string
          enum: [outpatient, emergency, inpatient, community, virtual, procedure, procedure_room, operating_room]
        entryPoint:
          type: string
        modality:
          type: string
          enum: [in_person, virtual, hybrid]
        virtualMode:
          type: string
          nullable: true
        careSetting:
          type: string
        priority:
          type: string
        triageCategory:
          type: string
          nullable: true
        pathwayRef:
          type: string
          nullable: true
        protocolRef:
          type: string
          nullable: true
        status:
          type: string
          enum: [IN_PROGRESS, COMPLETED, CANCELLED]
        startedAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
          nullable: true
        notes:
          type: string
          nullable: true

    Admission:
      type: object
      required: [id, journeyId, patientCpid, facilityId, wardId, wardName, status, reason]
      properties:
        id:
          type: string
          format: uuid
        journeyId:
          type: string
          format: uuid
        patientCpid:
          type: string
        facilityId:
          type: string
        wardId:
          type: string
        wardName:
          type: string
          example: "Medical Ward A"
        bedId:
          type: string
          nullable: true
        bedLabel:
          type: string
          nullable: true
          example: "Bed A3"
        status:
          type: string
          enum: [PENDING_APPROVAL, APPROVED, ADMITTED, TRANSFERRED, DISCHARGED]
        reason:
          type: string
        admittedAt:
          type: string
          format: date-time
          nullable: true
        dischargedAt:
          type: string
          format: date-time
          nullable: true

    DischargeCase:
      type: object
      required: [id, journeyId, admissionId, patientCpid, status, blockers, startedAt]
      properties:
        id:
          type: string
          format: uuid
        journeyId:
          type: string
          format: uuid
        admissionId:
          type: string
          format: uuid
        patientCpid:
          type: string
        status:
          type: string
          enum: [IN_PROGRESS, BLOCKED, READY, COMPLETED]
        blockers:
          type: array
          items:
            $ref: '#/components/schemas/DischargeBlocker'
        startedAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
          nullable: true

    DischargeBlocker:
      type: object
      required: [id, type, description, resolved]
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          description: Blocker category
          example: "PENDING_LAB_RESULTS"
        description:
          type: string
          example: "Waiting for CBC results"
        resolved:
          type: boolean
        resolvedAt:
          type: string
          format: date-time
          nullable: true

    DeathCase:
      type: object
      required: [id, journeyId, patientCpid, dateOfDeath, causeOfDeath, placeOfDeath, certifiedById, ubomiStatus, status, recordedAt]
      properties:
        id:
          type: string
          format: uuid
        journeyId:
          type: string
          format: uuid
        patientCpid:
          type: string
        dateOfDeath:
          type: string
          format: date-time
        causeOfDeath:
          type: string
        placeOfDeath:
          type: string
        certifiedById:
          type: string
        ubomiStatus:
          type: string
          enum: [PENDING, SUBMITTED, ACCEPTED, REJECTED]
        status:
          type: string
          enum: [RECORDED, UBOMI_PENDING, COMPLETED]
        recordedAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
          nullable: true

    ControlTowerData:
      type: object
      required: [facilityId, facilityName, timestamp, queueStats, admissionSummary, journeysByState, activeJourneyCount, averageTotalWaitMinutes]
      properties:
        facilityId:
          type: string
        facilityName:
          type: string
        timestamp:
          type: string
          format: date-time
        queueStats:
          type: array
          items:
            $ref: '#/components/schemas/QueueStat'
        admissionSummary:
          $ref: '#/components/schemas/AdmissionSummary'
        journeysByState:
          type: object
          additionalProperties:
            type: integer
          example:
            ARRIVED: 5
            TRIAGED: 3
            QUEUED: 18
            IN_SERVICE: 7
            ADMITTED: 12
        activeJourneyCount:
          type: integer
          example: 45
        averageTotalWaitMinutes:
          type: integer
          example: 32

    QueueStat:
      type: object
      required: [queueId, queueName, workspaceId, workspaceName, waitingCount, inServiceCount, completedToday, averageWaitMinutes, longestWaitMinutes]
      properties:
        queueId:
          type: string
          format: uuid
        queueName:
          type: string
        workspaceId:
          type: string
        workspaceName:
          type: string
        waitingCount:
          type: integer
        inServiceCount:
          type: integer
        completedToday:
          type: integer
        averageWaitMinutes:
          type: integer
        longestWaitMinutes:
          type: integer

    AdmissionSummary:
      type: object
      required: [totalBeds, occupiedBeds, occupancyPercent, wardBreakdown]
      properties:
        totalBeds:
          type: integer
          example: 200
        occupiedBeds:
          type: integer
          example: 165
        occupancyPercent:
          type: number
          format: float
          example: 82.5
        wardBreakdown:
          type: array
          items:
            $ref: '#/components/schemas/WardOccupancy'

    WardOccupancy:
      type: object
      required: [wardId, wardName, totalBeds, occupiedBeds, occupancyPercent]
      properties:
        wardId:
          type: string
        wardName:
          type: string
          example: "Medical Ward A"
        totalBeds:
          type: integer
          example: 30
        occupiedBeds:
          type: integer
          example: 25
        occupancyPercent:
          type: number
          format: float
          example: 83.3

    Bottleneck:
      type: object
      required: [id, type, severity, description, detectedAt, resolved]
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          enum: [LONG_WAIT, QUEUE_OVERFLOW, DISCHARGE_BLOCKED, BED_SHORTAGE, STAFF_SHORTAGE]
        severity:
          type: string
          enum: [LOW, MEDIUM, HIGH, CRITICAL]
        description:
          type: string
          example: "General OPD queue has 25 patients waiting, average wait exceeds 60 minutes"
        affectedQueueId:
          type: string
          format: uuid
          nullable: true
        affectedWardId:
          type: string
          nullable: true
        detectedAt:
          type: string
          format: date-time
        resolved:
          type: boolean

    QueueTelemetry:
      type: object
      required: [queueId, queueName, timestamps, waitingCounts, avgWaitMinutes]
      properties:
        queueId:
          type: string
          format: uuid
        queueName:
          type: string
        timestamps:
          type: array
          items:
            type: string
            format: date-time
        waitingCounts:
          type: array
          items:
            type: integer
        avgWaitMinutes:
          type: array
          items:
            type: number

    Task:
      type: object
      required: [id, workspaceId, title, priority, status, createdById, createdAt]
      properties:
        id:
          type: string
          format: uuid
        journeyId:
          type: string
          format: uuid
          nullable: true
        workspaceId:
          type: string
        title:
          type: string
        description:
          type: string
          nullable: true
        priority:
          type: string
          enum: [LOW, NORMAL, HIGH, URGENT]
        status:
          type: string
          enum: [PENDING, IN_PROGRESS, COMPLETED, CANCELLED]
        assigneeId:
          type: string
          nullable: true
        assigneeName:
          type: string
          nullable: true
        createdById:
          type: string
        createdAt:
          type: string
          format: date-time
        dueAt:
          type: string
          format: date-time
          nullable: true
        completedAt:
          type: string
          format: date-time
          nullable: true

    PatientTimeline:
      type: object
      required: [cpid, entries, totalEntries]
      properties:
        cpid:
          type: string
        entries:
          type: array
          items:
            $ref: '#/components/schemas/PatientTimelineEntry'
        totalEntries:
          type: integer

    PatientTimelineEntry:
      type: object
      required: [id, journeyId, type, summary, timestamp, actorId, actorName]
      properties:
        id:
          type: string
          format: uuid
        journeyId:
          type: string
          format: uuid
        type:
          type: string
          description: Event type (ARRIVAL, TRIAGE, QUEUE, ENCOUNTER, ADMISSION, DISCHARGE, DEATH)
          example: "TRIAGE"
        summary:
          type: string
          example: "Triaged with acuity 3 (Yellow/Semi-urgent)"
        timestamp:
          type: string
          format: date-time
        actorId:
          type: string
        actorName:
          type: string

    TelehealthSessionCreateRequest:
      type: object
      required: [patientId]
      properties:
        patientId:
          type: string
          description: CPID/patient reference.
        providerId:
          type: string
          nullable: true
        facilityId:
          type: string
          nullable: true
        referralId:
          type: string
          format: uuid
          nullable: true
        encounterId:
          type: string
          nullable: true
        sessionType:
          type: string
          enum: [VIDEO, AUDIO, PHONE, ASYNC]
          default: VIDEO
        sessionProvider:
          type: string
          description: Provider-neutral session engine key.
          enum: [MANAGED_PRIMARY, ASYNC_NO_VIDEO, MANUAL_PHONE, EXTERNAL_MANAGED]
        scheduledAt:
          type: string
          format: date-time
          nullable: true
        notes:
          type: string
          nullable: true
      additionalProperties: false

    TelehealthSession:
      type: object
      properties:
        id:
          type: string
          format: uuid
        patientCpid:
          type: string
        providerId:
          type: string
          nullable: true
        facilityId:
          type: string
          nullable: true
        referralId:
          type: string
          format: uuid
          nullable: true
        encounterId:
          type: string
          nullable: true
        sessionType:
          type: string
        status:
          type: string
        roomUrl:
          type: string
          nullable: true
        channel:
          type: string
        sessionProvider:
          type: string
        token:
          type: string
          nullable: true
        scheduledAt:
          type: string
          format: date-time
          nullable: true
        startedAt:
          type: string
          format: date-time
          nullable: true
        endedAt:
          type: string
          format: date-time
          nullable: true
        durationSeconds:
          type: integer
          format: int64
          nullable: true
        notes:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    TelehealthSessionEnvelope:
      type: object
      additionalProperties: true
      properties:
        success:
          type: boolean
        correlationId:
          type: string
        data:
          $ref: '#/components/schemas/TelehealthSession'

    # -- Error --
    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          type: object
          properties:
            code:
              type: string
              example: "NOT_FOUND"
            message:
              type: string
              example: "Journey not found"
