# =============================================================================
# PCT -- Patient Care Tracker API (OpenAPI 3.0)
#
# Comprehensive patient journey management: work sessions, triage, queuing,
# encounters, admissions, discharge, death registration, and operational
# control tower analytics.
#
# All endpoints require a valid Bearer JWT and TSHEPO trust headers
# (X-Tenant-Id, X-Actor-Id, X-Correlation-Id, etc.) injected by
# Envoy ext_authz.
# =============================================================================
openapi: "3.0.3"

info:
  title: "PCT \u2014 Patient Care Tracker API"
  version: "1.0.0"
  description: |
    PCT manages the complete patient journey through a facility:

    * **Work Sessions** -- Clinician shift start/end and context tracking
    * **Journeys** -- Patient arrival, triage, routing, and lifecycle
    * **Queues** -- Queue management, call-next, and status tracking
    * **Encounters** -- Clinical encounter start/complete
    * **Admissions** -- Inpatient admission, bed assignment, transfer
    * **Discharge** -- Discharge workflow with blocker tracking
    * **Death** -- Death registration and UBOMI notification
    * **Control Tower** -- Real-time facility operations analytics
    * **Tasks** -- Task management across workspaces and journeys

    All endpoints require TSHEPO trust headers injected by Envoy ext_authz.
  contact:
    name: Impilo Platform Team
  license:
    name: Proprietary

servers:
  - url: http://localhost:8088
    description: Local development
  - url: https://{tenant}.impilo.health/api
    description: Production (per-tenant)
    variables:
      tenant:
        default: demo

# ---------------------------------------------------------------------------
# Security
# ---------------------------------------------------------------------------
security:
  - bearerAuth: []

tags:
  - name: Work
    description: Clinician work session management
  - name: Journey
    description: Patient journey lifecycle
  - name: Triage
    description: Patient triage assessment
  - name: Queue
    description: Queue management and call-next
  - name: QueueItem
    description: Individual queue item status management
  - name: Encounter
    description: Clinical encounter tracking
  - name: Admission
    description: Inpatient admission workflow
  - name: Discharge
    description: Discharge workflow and blocker management
  - name: Death
    description: Death registration and UBOMI integration
  - name: ControlTower
    description: Facility-level operational analytics
  - name: Task
    description: Task management
  - name: Patient
    description: Patient-centric views

# ===========================================================================
# Paths
# ===========================================================================
paths:
  # -------------------------------------------------------------------------
  # Work Sessions
  # -------------------------------------------------------------------------
  /v1/work/start:
    post:
      operationId: startShift
      summary: Start a clinician work shift
      description: |
        Creates a new active work session for the authenticated clinician
        at the specified facility and workspace.
      tags: [Work]
      parameters:
        - $ref: '#/components/parameters/X-Tenant-Id'
        - $ref: '#/components/parameters/X-Correlation-Id'
        - $ref: '#/components/parameters/X-Actor-Id'
        - $ref: '#/components/parameters/X-Actor-Type'
        - $ref: '#/components/parameters/X-Purpose-Of-Use'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkStartRequest'
      responses:
        '200':
          description: Shift started successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseWorkSession'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: Active shift already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/work/end:
    post:
      operationId: endShift
      summary: End the current work shift
      tags: [Work]
      parameters:
        - $ref: '#/components/parameters/X-Tenant-Id'
        - $ref: '#/components/parameters/X-Correlation-Id'
        - $ref: '#/components/parameters/X-Actor-Id'
        - $ref: '#/components/parameters/X-Actor-Type'
        - $ref: '#/components/parameters/X-Purpose-Of-Use'
        - $ref: '#/components/parameters/X-Shift-Id'
      responses:
        '200':
          description: Shift ended successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseWorkSession'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: No active shift found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/work/context:
    get:
      operationId: getWorkContext
      summary: Get current work context
      description: |
        Returns the current work context including active shift details,
        facility, and workspace information.
      tags: [Work]
      parameters:
        - $ref: '#/components/parameters/X-Tenant-Id'
        - $ref: '#/components/parameters/X-Correlation-Id'
        - $ref: '#/components/parameters/X-Actor-Id'
        - $ref: '#/components/parameters/X-Actor-Type'
        - $ref: '#/components/parameters/X-Purpose-Of-Use'
      responses:
        '200':
          description: Current work context
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseWorkContext'
        '401':
          $ref: '#/components/responses/Unauthorized'

  # -------------------------------------------------------------------------
  # Journeys
  # -------------------------------------------------------------------------
  /v1/journeys/start:
    post:
      operationId: startJourney
      summary: Start a new patient journey
      description: |
        Creates a new journey for a patient arriving at the facility.
        The journey tracks the patient through triage, queuing, encounters,
        admission, and discharge/death.
      tags: [Journey]
      parameters:
        - $ref: '#/components/parameters/X-Tenant-Id'
        - $ref: '#/components/parameters/X-Correlation-Id'
        - $ref: '#/components/parameters/X-Actor-Id'
        - $ref: '#/components/parameters/X-Actor-Type'
        - $ref: '#/components/parameters/X-Purpose-Of-Use'
        - $ref: '#/components/parameters/X-Facility-Id'
        - $ref: '#/components/parameters/X-Shift-Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JourneyStartRequest'
      responses:
        '201':
          description: Journey created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseJourney'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /v1/journeys/{id}:
    get:
      operationId: getJourney
      summary: Get journey by ID
      tags: [Journey]
      parameters:
        - name: id
          in: path
          required: true
          description: Journey ID
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/X-Tenant-Id'
        - $ref: '#/components/parameters/X-Correlation-Id'
        - $ref: '#/components/parameters/X-Actor-Id'
        - $ref: '#/components/parameters/X-Actor-Type'
        - $ref: '#/components/parameters/X-Purpose-Of-Use'
      responses:
        '200':
          description: Journey details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseJourney'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/journeys/{id}/triage:
    post:
      operationId: recordTriage
      summary: Record triage assessment for a journey
      description: |
        Records the triage assessment including acuity level, vitals,
        and notes. Transitions the journey to TRIAGED state.
      tags: [Triage]
      parameters:
        - name: id
          in: path
          required: true
          description: Journey ID
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/X-Tenant-Id'
        - $ref: '#/components/parameters/X-Correlation-Id'
        - $ref: '#/components/parameters/X-Actor-Id'
        - $ref: '#/components/parameters/X-Actor-Type'
        - $ref: '#/components/parameters/X-Purpose-Of-Use'
        - $ref: '#/components/parameters/X-Shift-Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TriageRequest'
      responses:
        '200':
          description: Triage recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseJourney'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/journeys/{id}/route:
    post:
      operationId: routePatient
      summary: Route a triaged patient to a service queue
      description: |
        Routes the patient to the specified queue. Assigns a token number
        and transitions the journey to QUEUED state.
      tags: [Journey]
      parameters:
        - name: id
          in: path
          required: true
          description: Journey ID
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/X-Tenant-Id'
        - $ref: '#/components/parameters/X-Correlation-Id'
        - $ref: '#/components/parameters/X-Actor-Id'
        - $ref: '#/components/parameters/X-Actor-Type'
        - $ref: '#/components/parameters/X-Purpose-Of-Use'
        - $ref: '#/components/parameters/X-Shift-Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RouteRequest'
      responses:
        '200':
          description: Patient routed to queue
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseQueueItem'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  # -------------------------------------------------------------------------
  # Queues
  # -------------------------------------------------------------------------
  /v1/queues:
    get:
      operationId: getQueues
      summary: List queues for a facility/workspace
      tags: [Queue]
      parameters:
        - name: facilityId
          in: query
          required: false
          schema:
            type: string
        - name: workspaceId
          in: query
          required: false
          schema:
            type: string
        - $ref: '#/components/parameters/X-Tenant-Id'
        - $ref: '#/components/parameters/X-Correlation-Id'
        - $ref: '#/components/parameters/X-Actor-Id'
        - $ref: '#/components/parameters/X-Actor-Type'
        - $ref: '#/components/parameters/X-Purpose-Of-Use'
      responses:
        '200':
          description: List of queues
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseQueueArray'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /v1/queues/{queueId}/enqueue:
    post:
      operationId: enqueuePatient
      summary: Manually enqueue a patient
      tags: [Queue]
      parameters:
        - name: queueId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/X-Tenant-Id'
        - $ref: '#/components/parameters/X-Correlation-Id'
        - $ref: '#/components/parameters/X-Actor-Id'
        - $ref: '#/components/parameters/X-Actor-Type'
        - $ref: '#/components/parameters/X-Purpose-Of-Use'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnqueueRequest'
      responses:
        '201':
          description: Patient enqueued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseQueueItem'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/queues/{queueId}/call-next:
    post:
      operationId: callNextPatient
      summary: Call the next patient in the queue
      description: |
        Dequeues the highest-priority waiting patient, marks them as CALLED,
        and returns the queue item with token number.
      tags: [Queue]
      parameters:
        - name: queueId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/X-Tenant-Id'
        - $ref: '#/components/parameters/X-Correlation-Id'
        - $ref: '#/components/parameters/X-Actor-Id'
        - $ref: '#/components/parameters/X-Actor-Type'
        - $ref: '#/components/parameters/X-Purpose-Of-Use'
        - $ref: '#/components/parameters/X-Shift-Id'
      responses:
        '200':
          description: Next patient called
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseQueueItem'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Queue empty or not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/queues/{queueId}/items:
    get:
      operationId: getQueueItems
      summary: List items in a queue
      tags: [Queue]
      parameters:
        - name: queueId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/X-Tenant-Id'
        - $ref: '#/components/parameters/X-Correlation-Id'
        - $ref: '#/components/parameters/X-Actor-Id'
        - $ref: '#/components/parameters/X-Actor-Type'
        - $ref: '#/components/parameters/X-Purpose-Of-Use'
      responses:
        '200':
          description: Queue items
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseQueueItemArray'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  # -------------------------------------------------------------------------
  # Queue Items
  # -------------------------------------------------------------------------
  /v1/queue-items/{itemId}/status:
    post:
      operationId: updateQueueItemStatus
      summary: Update status of a queue item
      description: |
        Transition a queue item to a new status (e.g., CALLED -> IN_SERVICE,
        IN_SERVICE -> COMPLETED, CALLED -> NO_SHOW).
      tags: [QueueItem]
      parameters:
        - name: itemId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/X-Tenant-Id'
        - $ref: '#/components/parameters/X-Correlation-Id'
        - $ref: '#/components/parameters/X-Actor-Id'
        - $ref: '#/components/parameters/X-Actor-Type'
        - $ref: '#/components/parameters/X-Purpose-Of-Use'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QueueStatusUpdateRequest'
      responses:
        '200':
          description: Status updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseQueueItem'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/queue-items/{itemId}/transfer:
    post:
      operationId: transferQueueItem
      summary: Transfer a queue item to another queue
      tags: [QueueItem]
      parameters:
        - name: itemId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/X-Tenant-Id'
        - $ref: '#/components/parameters/X-Correlation-Id'
        - $ref: '#/components/parameters/X-Actor-Id'
        - $ref: '#/components/parameters/X-Actor-Type'
        - $ref: '#/components/parameters/X-Purpose-Of-Use'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QueueTransferRequest'
      responses:
        '200':
          description: Item transferred
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseQueueItem'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  # -------------------------------------------------------------------------
  # Encounters
  # -------------------------------------------------------------------------
  /v1/journeys/{id}/encounter/start:
    post:
      operationId: startEncounter
      summary: Start a clinical encounter for a journey
      description: |
        Creates a new encounter associated with the journey. Transitions
        the journey to ENCOUNTER_STARTED state.
      tags: [Encounter]
      parameters:
        - name: id
          in: path
          required: true
          description: Journey ID
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/X-Tenant-Id'
        - $ref: '#/components/parameters/X-Correlation-Id'
        - $ref: '#/components/parameters/X-Actor-Id'
        - $ref: '#/components/parameters/X-Actor-Type'
        - $ref: '#/components/parameters/X-Purpose-Of-Use'
        - $ref: '#/components/parameters/X-Shift-Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartEncounterRequest'
      responses:
        '201':
          description: Encounter started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseEncounter'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Encounter already in progress
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/encounters/{id}/complete:
    post:
      operationId: completeEncounter
      summary: Complete a clinical encounter
      tags: [Encounter]
      parameters:
        - name: id
          in: path
          required: true
          description: Encounter ID
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/X-Tenant-Id'
        - $ref: '#/components/parameters/X-Correlation-Id'
        - $ref: '#/components/parameters/X-Actor-Id'
        - $ref: '#/components/parameters/X-Actor-Type'
        - $ref: '#/components/parameters/X-Purpose-Of-Use'
      responses:
        '200':
          description: Encounter completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseEncounter'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/encounters/{id}:
    get:
      operationId: getEncounter
      summary: Get encounter details
      tags: [Encounter]
      parameters:
        - name: id
          in: path
          required: true
          description: Encounter ID
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/X-Tenant-Id'
        - $ref: '#/components/parameters/X-Correlation-Id'
        - $ref: '#/components/parameters/X-Actor-Id'
        - $ref: '#/components/parameters/X-Actor-Type'
        - $ref: '#/components/parameters/X-Purpose-Of-Use'
      responses:
        '200':
          description: Encounter details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseEncounter'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/encounters/{id}/pathway-protocol:
    patch:
      operationId: updateEncounterPathwayProtocol
      summary: Update encounter pathway/protocol references
      description: |
        Updates linkage metadata for care pathway/protocol selection on an encounter.
        Pathway execution remains owned by guidance/rules/clinical-knowledge services.
      tags: [Encounter]
      parameters:
        - name: id
          in: path
          required: true
          description: Encounter ID
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/X-Tenant-Id'
        - $ref: '#/components/parameters/X-Correlation-Id'
        - $ref: '#/components/parameters/X-Actor-Id'
        - $ref: '#/components/parameters/X-Actor-Type'
        - $ref: '#/components/parameters/X-Purpose-Of-Use'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateEncounterPathwayProtocolRequest'
      responses:
        '200':
          description: Encounter pathway/protocol updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseEncounter'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/patient/{cpid}/timeline:
    get:
      operationId: getPatientTimeline
      summary: Get patient journey timeline
      description: |
        Returns a chronological timeline of all journey events for the patient.
      tags: [Patient]
      parameters:
        - name: cpid
          in: path
          required: true
          description: Client Pseudonymous ID (CPID)
          schema:
            type: string
            example: "CPID-00000001"
        - $ref: '#/components/parameters/X-Tenant-Id'
        - $ref: '#/components/parameters/X-Correlation-Id'
        - $ref: '#/components/parameters/X-Actor-Id'
        - $ref: '#/components/parameters/X-Actor-Type'
        - $ref: '#/components/parameters/X-Purpose-Of-Use'
      responses:
        '200':
          description: Patient timeline
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponsePatientTimeline'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  # -------------------------------------------------------------------------
  # Admissions
  # -------------------------------------------------------------------------
  /v1/journeys/{id}/admit:
    post:
      operationId: requestAdmission
      summary: Request inpatient admission
      description: |
        Initiates an admission request for a patient journey. Creates an
        admission record in PENDING_APPROVAL state.
      tags: [Admission]
      parameters:
        - name: id
          in: path
          required: true
          description: Journey ID
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/X-Tenant-Id'
        - $ref: '#/components/parameters/X-Correlation-Id'
        - $ref: '#/components/parameters/X-Actor-Id'
        - $ref: '#/components/parameters/X-Actor-Type'
        - $ref: '#/components/parameters/X-Purpose-Of-Use'
        - $ref: '#/components/parameters/X-Shift-Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdmitRequest'
      responses:
        '201':
          description: Admission requested
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseAdmission'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/admissions/{id}/approve:
    post:
      operationId: approveAdmission
      summary: Approve an admission request
      tags: [Admission]
      parameters:
        - name: id
          in: path
          required: true
          description: Admission ID
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/X-Tenant-Id'
        - $ref: '#/components/parameters/X-Correlation-Id'
        - $ref: '#/components/parameters/X-Actor-Id'
        - $ref: '#/components/parameters/X-Actor-Type'
        - $ref: '#/components/parameters/X-Purpose-Of-Use'
      responses:
        '200':
          description: Admission approved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseAdmission'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/admissions/{id}/admit:
    post:
      operationId: admitPatient
      summary: Formally admit the patient
      description: |
        Transitions the admission from APPROVED to ADMITTED. The journey
        state moves to ADMITTED.
      tags: [Admission]
      parameters:
        - name: id
          in: path
          required: true
          description: Admission ID
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/X-Tenant-Id'
        - $ref: '#/components/parameters/X-Correlation-Id'
        - $ref: '#/components/parameters/X-Actor-Id'
        - $ref: '#/components/parameters/X-Actor-Type'
        - $ref: '#/components/parameters/X-Purpose-Of-Use'
      responses:
        '200':
          description: Patient admitted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseAdmission'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/admissions/{id}/assign-bed:
    post:
      operationId: assignBed
