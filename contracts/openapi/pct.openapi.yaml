# =============================================================================
# PCT — Care Tracking Service API (OpenAPI 3.0)
# Manages patient journeys, clinical encounters, discharge workflows, and
# queue management for care delivery within Impilo.
# =============================================================================
openapi: "3.0.3"

info:
  title: PCT — Care Tracking Service
  version: "1.0.0"
  description: |
    PCT orchestrates the patient care journey from arrival through discharge.
    It manages journey lifecycle, clinical encounters, structured discharge
    workflows, and real-time queue management across facilities.

    **Consistency classes**
    * Class A — destructive/high-trust mutations (require PDP decision header)
    * Class B — creation / registration mutations
    * Class C — reads and snapshots
  contact:
    name: Impilo Platform Team
  license:
    name: Proprietary

servers:
  - url: http://localhost:8088
    description: Local development
  - url: https://{tenant}.impilo.health/api
    description: Production (per-tenant)
    variables:
      tenant:
        default: demo

security:
  - bearerAuth: []

tags:
  - name: Journeys
    description: Patient journey lifecycle management
  - name: Encounters
    description: Clinical encounter management
  - name: Discharge
    description: Discharge workflow management
  - name: Queues
    description: Clinical queue and worklist management

# ============================================================================
# PATHS
# ============================================================================
paths:

  # ---- Journeys ------------------------------------------------------------

  /v1/journeys/start:
    post:
      operationId: startJourney
      tags: [Journeys]
      summary: Start a new patient journey (Class B)
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/ActorId"
        - $ref: "#/components/parameters/ActorType"
        - $ref: "#/components/parameters/PurposeOfUse"
        - $ref: "#/components/parameters/DeviceFingerprint"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartJourneyRequest"
      responses:
        "201":
          description: Journey started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseJourneyResponse"
        "400":
          $ref: "#/components/responses/BadRequest"

  /v1/journeys/{id}/triage:
    post:
      operationId: triageJourney
      tags: [Journeys]
      summary: Record triage assessment for a journey (Class B)
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/ActorId"
        - $ref: "#/components/parameters/ActorType"
        - $ref: "#/components/parameters/PurposeOfUse"
        - $ref: "#/components/parameters/DeviceFingerprint"
        - $ref: "#/components/parameters/JourneyId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TriageRequest"
      responses:
        "200":
          description: Triage recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseJourneyResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/journeys/{id}/route:
    post:
      operationId: routeJourney
      tags: [Journeys]
      summary: Route a journey to a target queue (Class B)
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/ActorId"
        - $ref: "#/components/parameters/ActorType"
        - $ref: "#/components/parameters/PurposeOfUse"
        - $ref: "#/components/parameters/DeviceFingerprint"
        - $ref: "#/components/parameters/JourneyId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RouteJourneyRequest"
      responses:
        "200":
          description: Journey routed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseJourneyResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/journeys/{id}:
    get:
      operationId: getJourney
      tags: [Journeys]
      summary: Get a journey by ID (Class C)
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/ActorId"
        - $ref: "#/components/parameters/ActorType"
        - $ref: "#/components/parameters/PurposeOfUse"
        - $ref: "#/components/parameters/DeviceFingerprint"
        - $ref: "#/components/parameters/JourneyId"
      responses:
        "200":
          description: Journey detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseJourneyResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/journeys/patient/{cpid}:
    get:
      operationId: getPatientJourneys
      tags: [Journeys]
      summary: Get all journeys for a patient (Class C)
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/ActorId"
        - $ref: "#/components/parameters/ActorType"
        - $ref: "#/components/parameters/PurposeOfUse"
        - $ref: "#/components/parameters/DeviceFingerprint"
        - $ref: "#/components/parameters/PatientCpid"
        - $ref: "#/components/parameters/PageNumber"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Paged patient journey list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponsePagedJourneyResponse"

  # ---- Encounters ----------------------------------------------------------

  /v1/journeys/{id}/encounter/start:
    post:
      operationId: startEncounter
      tags: [Encounters]
      summary: Start a clinical encounter on a journey (Class A)
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/ActorId"
        - $ref: "#/components/parameters/ActorType"
        - $ref: "#/components/parameters/PurposeOfUse"
        - $ref: "#/components/parameters/DeviceFingerprint"
        - $ref: "#/components/parameters/Decision"
        - $ref: "#/components/parameters/JourneyId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartEncounterRequest"
      responses:
        "201":
          description: Encounter started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseEncounterResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/encounters/{id}/complete:
    post:
      operationId: completeEncounter
      tags: [Encounters]
      summary: Complete a clinical encounter (Class A)
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/ActorId"
        - $ref: "#/components/parameters/ActorType"
        - $ref: "#/components/parameters/PurposeOfUse"
        - $ref: "#/components/parameters/DeviceFingerprint"
        - $ref: "#/components/parameters/Decision"
        - $ref: "#/components/parameters/EncounterId"
      responses:
        "200":
          description: Encounter completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseEncounterResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/encounters/{id}:
    get:
      operationId: getEncounter
      tags: [Encounters]
      summary: Get an encounter by ID (Class C)
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/ActorId"
        - $ref: "#/components/parameters/ActorType"
        - $ref: "#/components/parameters/PurposeOfUse"
        - $ref: "#/components/parameters/DeviceFingerprint"
        - $ref: "#/components/parameters/EncounterId"
      responses:
        "200":
          description: Encounter detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseEncounterResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/patient/{cpid}/timeline:
    get:
      operationId: getPatientTimeline
      tags: [Encounters]
      summary: Get clinical timeline for a patient (Class C)
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/ActorId"
        - $ref: "#/components/parameters/ActorType"
        - $ref: "#/components/parameters/PurposeOfUse"
        - $ref: "#/components/parameters/DeviceFingerprint"
        - $ref: "#/components/parameters/PatientCpid"
      responses:
        "200":
          description: Patient clinical timeline
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponsePatientTimeline"

  # ---- Discharge -----------------------------------------------------------

  /v1/journeys/{id}/discharge/start:
    post:
      operationId: startDischarge
      tags: [Discharge]
      summary: Start the discharge process for a journey (Class A)
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/ActorId"
        - $ref: "#/components/parameters/ActorType"
        - $ref: "#/components/parameters/PurposeOfUse"
        - $ref: "#/components/parameters/DeviceFingerprint"
        - $ref: "#/components/parameters/Decision"
        - $ref: "#/components/parameters/JourneyId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartDischargeRequest"
      responses:
        "201":
          description: Discharge process started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseDischargeResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/discharge/{caseId}/status:
    get:
      operationId: getDischargeStatus
      tags: [Discharge]
      summary: Get discharge case status (Class C)
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/ActorId"
        - $ref: "#/components/parameters/ActorType"
        - $ref: "#/components/parameters/PurposeOfUse"
        - $ref: "#/components/parameters/DeviceFingerprint"
        - $ref: "#/components/parameters/DischargeCaseId"
      responses:
        "200":
          description: Discharge status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseDischargeResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/discharge/{caseId}/clear-blocker:
    post:
      operationId: clearDischargeBlocker
      tags: [Discharge]
      summary: Clear a discharge blocker (Class A)
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/ActorId"
        - $ref: "#/components/parameters/ActorType"
        - $ref: "#/components/parameters/PurposeOfUse"
        - $ref: "#/components/parameters/DeviceFingerprint"
        - $ref: "#/components/parameters/Decision"
        - $ref: "#/components/parameters/DischargeCaseId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClearBlockerRequest"
      responses:
        "200":
          description: Blocker cleared
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseDischargeResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/discharge/{caseId}/complete:
    post:
      operationId: completeDischarge
      tags: [Discharge]
      summary: Complete the discharge process (Class A)
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/ActorId"
        - $ref: "#/components/parameters/ActorType"
        - $ref: "#/components/parameters/PurposeOfUse"
        - $ref: "#/components/parameters/DeviceFingerprint"
        - $ref: "#/components/parameters/Decision"
        - $ref: "#/components/parameters/DischargeCaseId"
      responses:
        "200":
          description: Discharge completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseDischargeResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  # ---- Queues --------------------------------------------------------------

  /v1/queues:
    get:
      operationId: listQueues
      tags: [Queues]
      summary: List queues for a facility (Class C)
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/ActorId"
        - $ref: "#/components/parameters/ActorType"
        - $ref: "#/components/parameters/PurposeOfUse"
        - $ref: "#/components/parameters/DeviceFingerprint"
        - name: facilityId
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: workspaceId
          in: query
          required: false
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Queue list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseQueueList"

  /v1/queues/{queueId}/enqueue:
    post:
      operationId: enqueueJourney
      tags: [Queues]
      summary: Enqueue a journey into a queue (Class B)
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/ActorId"
        - $ref: "#/components/parameters/ActorType"
        - $ref: "#/components/parameters/PurposeOfUse"
        - $ref: "#/components/parameters/DeviceFingerprint"
        - $ref: "#/components/parameters/QueueId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnqueueRequest"
      responses:
        "201":
          description: Journey enqueued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseQueueItemResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/queues/{queueId}/call-next:
    post:
      operationId: callNextInQueue
      tags: [Queues]
      summary: Call the next patient in a queue (Class B)
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/ActorId"
        - $ref: "#/components/parameters/ActorType"
        - $ref: "#/components/parameters/PurposeOfUse"
        - $ref: "#/components/parameters/DeviceFingerprint"
        - $ref: "#/components/parameters/QueueId"
      responses:
        "200":
          description: Next queue item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseQueueItemResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/queues/{queueId}/items:
    get:
      operationId: listQueueItems
      tags: [Queues]
      summary: List items in a queue (Class C)
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/ActorId"
        - $ref: "#/components/parameters/ActorType"
        - $ref: "#/components/parameters/PurposeOfUse"
        - $ref: "#/components/parameters/DeviceFingerprint"
        - $ref: "#/components/parameters/QueueId"
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [WAITING, CALLED, IN_PROGRESS, COMPLETED, SKIPPED]
      responses:
        "200":
          description: Queue item list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseQueueItemList"
        "404":
          $ref: "#/components/responses/NotFound"

# ============================================================================
# COMPONENTS
# ============================================================================
components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Keycloak-issued access token (forwarded by Envoy)

  parameters:
    TenantId:
      name: X-Tenant-Id
      in: header
      required: true
      description: Tenant identifier — injected by Envoy after TSHEPO authorisation
      schema:
        type: string
    CorrelationId:
      name: X-Correlation-Id
      in: header
      required: true
      description: End-to-end correlation ID for distributed tracing
      schema:
        type: string
        format: uuid
    ActorId:
      name: X-Actor-Id
      in: header
      required: true
      description: Authenticated actor (user or service) identifier
      schema:
        type: string
    ActorType:
      name: X-Actor-Type
      in: header
      required: true
      description: Type of actor making the request
      schema:
        type: string
        enum: [CITIZEN, PROVIDER, ADMIN, SYSTEM, SERVICE]
    PurposeOfUse:
      name: X-Purpose-Of-Use
      in: header
      required: true
      description: Why this request is being made
      schema:
        type: string
    DeviceFingerprint:
      name: X-Device-Fingerprint
      in: header
      required: true
      description: Device identity hash
      schema:
        type: string
    FacilityId:
      name: X-Facility-Id
      in: header
      required: false
      description: Facility scope (contextual)
      schema:
        type: string
        format: uuid
    WorkspaceId:
      name: X-Workspace-Id
      in: header
      required: false
      description: Workspace scope (contextual)
      schema:
        type: string
        format: uuid
    ShiftId:
      name: X-Shift-Id
      in: header
      required: false
      description: Duty shift scope (contextual)
      schema:
        type: string
        format: uuid
    Decision:
      name: X-Decision
      in: header
      required: false
      description: PDP decision header — ALLOW, DENY, STEP_UP_REQUIRED (Class A endpoints require ALLOW)
      schema:
        type: string
        enum: [ALLOW, DENY, STEP_UP_REQUIRED]
    Obligations:
      name: X-Obligations
      in: header
      required: false
      description: JSON obligations blob from TSHEPO
      schema:
        type: string
    PageNumber:
      name: page
      in: query
      schema:
        type: integer
        default: 0
    PageSize:
      name: size
      in: query
      schema:
        type: integer
        default: 20
        maximum: 100
    JourneyId:
      name: id
      in: path
      required: true
      description: Journey identifier
      schema:
        type: integer
        format: int64
    EncounterId:
      name: id
      in: path
      required: true
      description: Encounter identifier
      schema:
        type: integer
        format: int64
    DischargeCaseId:
      name: caseId
      in: path
      required: true
      description: Discharge case identifier
      schema:
        type: integer
        format: int64
    QueueId:
      name: queueId
      in: path
      required: true
      description: Queue identifier
      schema:
        type: integer
        format: int64
    PatientCpid:
      name: cpid
      in: path
      required: true
      description: Patient CPID (clinical patient identifier)
      schema:
        type: string

  responses:
    BadRequest:
      description: Validation error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: Duplicate resource
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Missing or invalid trust headers
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: PDP denied the request (X-Decision=DENY)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:

    # ---- Requests ----------------------------------------------------------

    StartJourneyRequest:
      type: object
      required: [facilityId, patientCpid]
      properties:
        facilityId:
          type: string
          format: uuid
        patientCpid:
          type: string
        referralSource:
          type: string
        referralId:
          type: string

    TriageRequest:
      type: object
      required: [acuity]
      properties:
        acuity:
          type: string
          enum: [IMMEDIATE, URGENT, LESS_URGENT, NON_URGENT]
        vitals:
          type: object
          additionalProperties: true
        notes:
          type: string

    RouteJourneyRequest:
      type: object
      required: [targetQueueId]
      properties:
        targetQueueId:
          type: integer
          format: int64

    StartEncounterRequest:
      type: object
      required: [encounterType]
      properties:
        encounterType:
          type: string
          enum: [OUTPATIENT, INPATIENT, EMERGENCY, VIRTUAL]

    StartDischargeRequest:
      type: object
      required: [dischargeType]
      properties:
        dischargeType:
          type: string
          enum: [ROUTINE, AGAINST_ADVICE, TRANSFER, DEATH]

    ClearBlockerRequest:
      type: object
      required: [blockerName]
      properties:
        blockerName:
          type: string

    EnqueueRequest:
      type: object
      required: [journeyId]
      properties:
        journeyId:
          type: integer
          format: int64
        priority:
          type: integer
          default: 0

    # ---- Response wrappers -------------------------------------------------

    ApiResponseJourneyResponse:
      type: object
      properties:
        success:
          type: boolean
        correlationId:
          type: string
          format: uuid
        data:
          $ref: "#/components/schemas/JourneyResponse"

    ApiResponsePagedJourneyResponse:
      type: object
      properties:
        success:
          type: boolean
        correlationId:
          type: string
          format: uuid
        data:
          $ref: "#/components/schemas/PagedJourneyResponse"

    ApiResponseEncounterResponse:
      type: object
      properties:
        success:
          type: boolean
        correlationId:
          type: string
          format: uuid
        data:
          $ref: "#/components/schemas/EncounterResponse"

    ApiResponsePatientTimeline:
      type: object
      properties:
        success:
          type: boolean
        correlationId:
          type: string
          format: uuid
        data:
          $ref: "#/components/schemas/PatientTimeline"

    ApiResponseDischargeResponse:
      type: object
      properties:
        success:
          type: boolean
        correlationId:
          type: string
          format: uuid
        data:
          $ref: "#/components/schemas/DischargeResponse"

    ApiResponseQueueList:
      type: object
      properties:
        success:
          type: boolean
        correlationId:
          type: string
          format: uuid
        data:
          type: array
          items:
            $ref: "#/components/schemas/QueueResponse"

    ApiResponseQueueItemResponse:
      type: object
      properties:
        success:
          type: boolean
        correlationId:
          type: string
          format: uuid
        data:
          $ref: "#/components/schemas/QueueItemResponse"

    ApiResponseQueueItemList:
      type: object
      properties:
        success:
          type: boolean
        correlationId:
          type: string
          format: uuid
        data:
          type: array
          items:
            $ref: "#/components/schemas/QueueItemResponse"

    # ---- Domain objects ----------------------------------------------------

    JourneyResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        journeyRef:
          type: string
        facilityId:
          type: string
          format: uuid
        patientCpid:
          type: string
        status:
          type: string
          enum: [REGISTERED, TRIAGED, QUEUED, IN_ENCOUNTER, PENDING_DISCHARGE, DISCHARGED]
        acuity:
          type: string
        referralSource:
          type: string
        referralId:
          type: string
        startedAt:
          type: string
          format: date-time
        dischargedAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time

    PagedJourneyResponse:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: "#/components/schemas/JourneyResponse"
        page:
          type: integer
        size:
          type: integer
        totalElements:
          type: integer
          format: int64

    EncounterResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        encounterRef:
          type: string
        journeyId:
          type: integer
          format: int64
        encounterType:
          type: string
        status:
          type: string
          enum: [ACTIVE, COMPLETED, CANCELLED]
        providerId:
          type: string
        startedAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time

