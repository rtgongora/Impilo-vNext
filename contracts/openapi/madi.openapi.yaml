      summary: Record investigation notes
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/CaseId'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: Investigation updated
  /internal/v1/madi/haemovigilance/cases/{caseId}/close:
    post:
      operationId: madiCloseCase
      tags:
        - Haemovigilance
      summary: Close haemovigilance case
      parameters:
