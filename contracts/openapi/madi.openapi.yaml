components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    TenantId:
      name: X-Tenant-ID
      in: header
      required: true
      schema:
        type: string
        format: uuid
    PodId:
      name: X-Pod-ID
      in: header
      required: true
      schema:
        type: string
    RequestId:
      name: X-Request-ID
      in: header
      required: true
      schema:
        type: string
    CorrelationId:
      name: X-Correlation-ID
      in: header
      required: true
      schema:
        type: string
    FacilityId:
      name: X-Facility-ID
      in: header
      required: false
      schema:
        type: string
        format: uuid
    DonorId:
      name: donorId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    DriveId:
      name: driveId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    BatchId:
      name: batchId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    BloodBankId:
      name: bloodBankId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    OrderId:
      name: orderId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    EpisodeId:
      name: episodeId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CaseId:
      name: caseId
      in: path
      required: true
      schema:
        type: string
        format: uuid

  schemas:
    DonorRegisterRequest:
      type: object
      required: [person_cpid]
      properties:
        person_cpid:
          type: string
        blood_group:
          type: string
        rh_factor:
          type: string
        registered_by:
          type: string

    ScreeningRequest:
      type: object
      required: [result]
      properties:
        drive_id:
          type: string
          format: uuid
        donor_id:
          type: string
          format: uuid
        result:
          type: string
          enum: [ELIGIBLE, DEFERRED, PERMANENTLY_DEFERRED]
        notes:
          type: string
        screened_by:
          type: string

    CreateDriveRequest:
      type: object
      required: [title, drive_type, start_at, end_at]
      properties:
        title:
          type: string
        description:
          type: string
        drive_type:
          type: string
        location_ref:
          type: string
        ndila_site_ref:
          type: string
        start_at:
          type: string
          format: date-time
        end_at:
          type: string
          format: date-time
        capacity:
          type: integer
        created_by:
          type: string

    BloodOrderRequest:
      type: object
      required: [patient_cpid, blood_group, component_type]
      properties:
        oros_order_ref:
