# =============================================================================
# MADI — Blood Donation, Blood Bank & Transfusion (OpenAPI 3.0)
# =============================================================================
openapi: "3.0.3"

info:
  title: MADI Service API
  version: "1.2.0"
  description: |
    Blood donation orchestration, donor management, blood bank inventory,
    crossmatch, issue/dispatch, transfusion episodes, and haemovigilance.
    Trust headers are enforced by Envoy + TSHEPO.
  contact:
    name: Impilo Platform Team
  license:
    name: Proprietary

servers:
  - url: http://localhost:8300
    description: Local development
  - url: https://{tenant}.impilo.health/api/madi
    description: Production (per-tenant)
    variables:
      tenant:
        default: demo

security:
  - bearerAuth: []

tags:
  - name: Internal-Probe
    description: Tech-companion v1.1 header proofs
  - name: Dashboard
    description: Local, facility, drive, and central metrics
  - name: Donors
    description: Donor registry and self-service
  - name: Drives
    description: Donation drive lifecycle
  - name: Processing
    description: Blood unit processing and component preparation
  - name: BloodBanks
    description: Blood bank registry and stock movements
  - name: Orders
    description: Blood order, crossmatch, reserve, and issue
  - name: Transfusions
    description: Transfusion episode lifecycle
  - name: Haemovigilance
    description: Adverse reaction reporting and case management
  - name: CentralBank
    description: National blood bank oversight metrics

paths:
  /internal/v1/health:
    get:
      operationId: madiInternalHealth
      tags:
        - Internal-Probe
      summary: v1.1 probe — returns trust context echo
      security: []
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/PodId'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Service UP
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /internal/v1/test-command:
    post:
      operationId: madiInternalTestCommand
      tags:
        - Internal-Probe
      summary: v1.1 probe — idempotency / echo
      security: []
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/PodId'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '201':
          description: Echo payload
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /internal/v1/madi/dashboard:
    get:
      operationId: madiDashboard
      tags:
        - Dashboard
      summary: Dashboard metrics by scope
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - name: scope
          in: query
          schema:
            type: string
            enum:
              - local
              - facility
              - central
              - drive
            default: local
        - name: facility_id
          in: query
          schema:
            type: string
            format: uuid
        - name: drive_id
          in: query
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Dashboard metrics
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /internal/v1/madi/donors:
    post:
      operationId: madiRegisterDonor
      tags:
        - Donors
      summary: Register a blood donor profile
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/FacilityId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DonorRegisterRequest'
      responses:
        '201':
          description: Donor registered
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /internal/v1/madi/donors/by-person:
    get:
      operationId: madiDonorByPerson
      tags:
        - Donors
      summary: Lookup donor profile by person CPID
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - name: person_cpid
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Donor profile
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '404':
          description: Donor not found
  /internal/v1/madi/donors/{donorId}/screenings:
    post:
      operationId: madiScreenDonor
      tags:
        - Donors
      summary: Record donor eligibility screening
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/FacilityId'
        - $ref: '#/components/parameters/DonorId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScreeningRequest'
      responses:
        '201':
          description: Screening recorded
  /internal/v1/madi/donors/{donorId}/deferrals:
    post:
      operationId: madiDeferDonor
      tags:
        - Donors
      summary: Defer a donor
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/FacilityId'
        - $ref: '#/components/parameters/DonorId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '201':
          description: Deferral recorded
  /internal/v1/madi/donors/{donorId}/preferences:
    put:
      operationId: madiDonorPreferences
      tags:
        - Donors
      summary: Update donor communication preferences
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/FacilityId'
        - $ref: '#/components/parameters/DonorId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: Preferences updated
  /internal/v1/madi/donors/{donorId}/feedback:
    post:
      operationId: madiDonorFeedback
      tags:
        - Donors
      summary: Submit post-donation feedback
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/FacilityId'
        - $ref: '#/components/parameters/DonorId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '201':
          description: Feedback recorded
  /internal/v1/madi/donors/{donorId}/history:
    get:
      operationId: madiDonorHistory
      tags:
        - Donors
      summary: Donor donation history
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/DonorId'
      responses:
        '200':
          description: Donor history
  /internal/v1/madi/donors/{donorId}/next-eligibility:
    get:
      operationId: madiDonorNextEligibility
      tags:
        - Donors
      summary: Next donation eligibility window
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/DonorId'
      responses:
        '200':
          description: Eligibility summary
  /internal/v1/madi/donors/drives-near-me:
    get:
      operationId: madiDrivesNearMe
      tags:
        - Donors
      summary: Find donation drives near an Ndila site reference
      parameters:
        - name: ndila_site_ref
          in: query
          required: true
          schema:
            type: string
        - name: radius_km
          in: query
          schema:
            type: number
            default: 25
      responses:
        '200':
          description: Nearby drives
  /internal/v1/madi/drives:
    post:
      operationId: madiCreateDrive
      tags:
        - Drives
      summary: Create a donation drive
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/FacilityId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDriveRequest'
      responses:
        '201':
          description: Drive created
    get:
      operationId: madiListDrives
      tags:
        - Drives
      summary: List donation drives for tenant
      parameters:
        - $ref: '#/components/parameters/TenantId'
      responses:
        '200':
          description: Drive list
  /internal/v1/madi/drives/{driveId}/publish:
    post:
      operationId: madiPublishDrive
      tags:
        - Drives
      summary: Publish a donation drive
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/DriveId'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: Drive published
  /internal/v1/madi/drives/{driveId}/register:
    post:
      operationId: madiRegisterAtDrive
      tags:
        - Drives
      summary: Register donor attendance at a drive
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/FacilityId'
        - $ref: '#/components/parameters/DriveId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '201':
          description: Registration recorded
  /internal/v1/madi/drives/{driveId}/screen:
    post:
      operationId: madiScreenAtDrive
      tags:
        - Drives
      summary: Screen donor at drive
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/FacilityId'
        - $ref: '#/components/parameters/DriveId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScreeningRequest'
      responses:
        '200':
          description: Screening recorded
  /internal/v1/madi/drives/{driveId}/donations:
    post:
      operationId: madiRecordDonation
      tags:
