        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '201':
          description: Component prepared
  /internal/v1/madi/blood-banks:
    post:
      operationId: madiCreateBloodBank
      tags:
        - BloodBanks
      summary: Register a blood bank
      parameters:
        - $ref: '#/components/parameters/TenantId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '201':
          description: Blood bank registered
  /internal/v1/madi/blood-banks/{bloodBankId}/stock:
    get:
      operationId: madiBloodBankStock
      tags:
        - BloodBanks
      summary: Blood bank stock balances
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/BloodBankId'
      responses:
        '200':
          description: Stock balances
  /internal/v1/madi/blood-banks/{bloodBankId}/movements:
    post:
      operationId: madiBloodBankMovement
      tags:
        - BloodBanks
      summary: Record stock movement
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/FacilityId'
        - $ref: '#/components/parameters/BloodBankId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '201':
          description: Movement recorded
  /internal/v1/madi/blood-banks/{bloodBankId}/reconciliations:
    post:
      operationId: madiBloodBankReconciliation
      tags:
        - BloodBanks
      summary: Record stock reconciliation
