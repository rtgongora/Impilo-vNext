      parameters:
        - $ref: '#/components/parameters/TenantId'
      responses:
        '200':
          description: Redistribution list
    post:
      operationId: madiRequestEmergencyRedistribution
      tags:
        - CentralBank
      summary: Request emergency blood redistribution between facilities
      parameters:
        - $ref: '#/components/parameters/TenantId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - source_facility_id
                - target_facility_id
                - blood_group
                - component_type
                - units_requested
              properties:
                source_facility_id:
                  type: string
                  format: uuid
                target_facility_id:
                  type: string
                  format: uuid
                blood_group:
                  type: string
                component_type:
                  type: string
                units_requested:
                  type: integer
                  minimum: 1
                reason:
                  type: string
                requested_by:
                  type: string
                priority:
                  type: string
      responses:
        '201':
          description: Redistribution requested
