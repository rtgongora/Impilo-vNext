        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/FacilityId'
        - $ref: '#/components/parameters/BloodBankId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '201':
          description: Reconciliation recorded
  /internal/v1/madi/blood-banks/{bloodBankId}/wastage:
    post:
      operationId: madiBloodBankWastage
      tags:
        - BloodBanks
      summary: Record blood wastage
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/FacilityId'
        - $ref: '#/components/parameters/BloodBankId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '201':
          description: Wastage recorded
  /internal/v1/madi/blood-banks/{bloodBankId}/returns:
    post:
      operationId: madiBloodBankReturn
      tags:
        - BloodBanks
      summary: Record blood unit return
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/FacilityId'
        - $ref: '#/components/parameters/BloodBankId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '201':
          description: Return recorded
  /internal/v1/madi/orders:
