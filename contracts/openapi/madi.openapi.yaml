      operationId: madiCreateOrder
      tags:
        - Orders
      summary: Create blood order
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/FacilityId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BloodOrderRequest'
      responses:
        '201':
          description: Order created
    get:
      operationId: madiListOrders
      tags:
        - Orders
      summary: List blood orders for facility context
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/FacilityId'
        - name: status
          in: query
          schema:
            type: string
        - name: patient_cpid
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Order list
  /internal/v1/madi/orders/{orderId}/submit:
    post:
      operationId: madiSubmitOrder
      tags:
        - Orders
      summary: Submit blood order
      parameters:
        - $ref: '#/components/parameters/TenantId'
