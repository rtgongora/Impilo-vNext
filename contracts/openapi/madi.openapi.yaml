      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: Test results recorded
  /internal/v1/madi/processing/{batchId}/quarantine:
    post:
      operationId: madiQuarantineBatch
      tags:
        - Processing
      summary: Quarantine a processing batch
