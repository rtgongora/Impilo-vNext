        - $ref: '#/components/parameters/FacilityId'
        - $ref: '#/components/parameters/EpisodeId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '201':
          description: Observation recorded
  /internal/v1/madi/transfusions/{episodeId}/complete:
