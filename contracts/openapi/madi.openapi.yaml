      operationId: madiReportReaction
      tags:
        - Haemovigilance
      summary: Report adverse transfusion reaction
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/FacilityId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
