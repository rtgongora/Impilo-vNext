            schema:
              type: object
              additionalProperties: true
      responses:
        '201':
          description: Donation recorded
  /internal/v1/madi/drives/{driveId}/close:
    post:
      operationId: madiCloseDrive
      tags:
        - Drives
      summary: Close a donation drive
      parameters:
        - $ref: '#/components/parameters/TenantId'
