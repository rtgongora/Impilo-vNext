# =============================================================================
# Vashandi — Operational Workforce BFF (OpenAPI 3.0)
# =============================================================================
openapi: "3.0.3"

info:
  title: Vashandi Operational Workforce BFF
  version: "1.0.0"
  description: |
    OPA-prechecked operational workforce workflows exposed by experience-bff.
    Proxies to vashandi-workforce-service for profiles, assignments, rosters,
    shifts, attendance, leave, access risk, and analytics.
  contact:
    name: Impilo Platform Team
  license:
    name: Proprietary

servers:
  - url: /internal/v1/vashandi
    description: Experience BFF Vashandi surface

security:
  - bearerAuth: []

tags:
  - name: Precheck
    description: OPA-aligned policy precheck
  - name: WorkforceProfiles
    description: Workforce profile registry and reconciliation
  - name: Assignments
    description: Workforce assignment lifecycle
  - name: Rosters
    description: Roster planning and approval
  - name: Shifts
    description: Shift scheduling within rosters
  - name: Attendance
    description: Check-in, check-out and supervisor confirmation
  - name: LeaveAvailability
    description: Leave and availability records
  - name: AccessRisk
    description: Workforce access risk detection and remediation
  - name: Analytics
    description: Staffing, roster coverage, attendance and access risk analytics

paths:
  /precheck:
    post:
      operationId: vashandiPrecheck
      tags: [Precheck]
      summary: OPA-aligned policy precheck for a Vashandi action
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/ActorId'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/ProviderId'
        - $ref: '#/components/parameters/FacilityId'
        - $ref: '#/components/parameters/PurposeOfUse'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VashandiPrecheckRequest'
      responses:
        '200':
          description: Precheck completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VashandiActionResponse'
        '403':
          description: Policy denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VashandiActionResponse'
        '502':
          description: Upstream unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VashandiActionResponse'

  /workforce-profiles:
    get:
      operationId: vashandiListWorkforceProfiles
      tags: [WorkforceProfiles]
      summary: List workforce profiles in scope
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/ActorId'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/ProviderId'
        - $ref: '#/components/parameters/FacilityId'
        - $ref: '#/components/parameters/PurposeOfUse'
        - name: organisationId
          in: query
          schema:
            type: string
            format: uuid
        - name: facilityId
          in: query
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Workforce profiles returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VashandiActionResponse'

  /workforce-profiles/{id}:
    get:
      operationId: vashandiGetWorkforceProfile
      tags: [WorkforceProfiles]
      summary: Get a workforce profile by id
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/ActorId'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/CorrelationId'
