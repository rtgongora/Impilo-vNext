components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    TenantId:
      name: X-Tenant-ID
      in: header
      required: true
      schema:
        type: string
    ActorId:
      name: X-Actor-ID
      in: header
      required: true
      schema:
        type: string
    RequestId:
      name: X-Request-ID
      in: header
      required: true
      schema:
        type: string
    CorrelationId:
      name: X-Correlation-ID
      in: header
      required: true
      schema:
        type: string
    ProviderId:
      name: X-Provider-ID
      in: header
      required: false
      schema:
        type: string
    FacilityId:
      name: X-Facility-ID
      in: header
      required: false
      schema:
        type: string
    PurposeOfUse:
      name: X-Purpose-Of-Use
      in: header
      required: false
      schema:
        type: string

  schemas:
    VashandiPrecheckRequest:
      type: object
      properties:
        requestedAction:
          type: string
        sourcePage:
          type: string
        targetWorkforceProfileId:
          type: string
        targetAssignmentId:
          type: string
        targetFacilityId:
          type: string
        roleTemplate:
          type: string
        requestedScope:
          type: string
        context:
          type: object
          additionalProperties: true

    VashandiImportWorkforceRow:
      type: object
      properties:
        healthId:
          type: string
        providerWorkerId:
          type: string
        keycloakUserId:
          type: string
        organisationId:
          type: string
          format: uuid
        organisationType:
          type: string
        membershipType:
          type: string
        workerType:
          type: string
        profession:
          type: string
        cadre:
          type: string
        currentStatus:
          type: string
        assignmentType:
          type: string
        facilityId:
          type: string
          format: uuid
        departmentId:
          type: string
        roleTemplateId:
          type: string

    VashandiImportBridgeRequest:
      type: object
      required: [source, rows]
      properties:
        source:
          type: string
        rows:
          type: array
          items:
            $ref: '#/components/schemas/VashandiImportWorkforceRow'

    PolicyDecision:
      type: object
      properties:
        allowed:
          type: boolean
        policyPackage:
          type: string
        policyVersion:
          type: string
        decisionId:
          type: string
        warnings:
          type: array
          items:
            type: string
        approvalsRequired:
          type: array
          items:
            type: string

    VashandiActionResponse:
      type: object
      required: [success, status]
      properties:
        success:
          type: boolean
        status:
          type: string
          description: completed, denied, upstream_unavailable, degraded, etc.
        requestId:
          type: string
        correlationId:
          type: string
        integrationStatus:
          type: string
          enum: [LIVE, UPSTREAM_UNAVAILABLE, DEGRADED, DENIED, PENDING_BACKEND]
        integrationMessage:
          type: string
        auditStatus:
          type: string
        auditEventId:
          type: string
        auditCorrelationId:
          type: string
        policyDecision:
          $ref: '#/components/schemas/PolicyDecision'
        friendlyTitle:
          type: string
        friendlyMessage:
          type: string
        blockedReason:
          type: string
        data:
          type: object
          additionalProperties: true

    WorkforceProfile:
      type: object
      properties:
        id:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        healthId:
          type: string
        providerWorkerId:
          type: string
        keycloakUserId:
          type: string
        primaryOrganisationId:
          type: string
          format: uuid
        primaryEmployerOrganisationId:
          type: string
          format: uuid
        workerType:
          type: string
        profession:
          type: string
        cadre:
          type: string
        currentStatus:
          type: string
        accessRiskStatus:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    WorkforceMembership:
      type: object
      properties:
        id:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        workforceProfileId:
          type: string
          format: uuid
        organisationId:
          type: string
          format: uuid
        organisationType:
          type: string
        membershipType:
          type: string
        status:
          type: string
        effectiveDate:
          type: string
          format: date
        expiryDate:
          type: string
          format: date
        source:
          type: string

    WorkforceAssignment:
      type: object
      properties:
        id:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        workforceProfileId:
          type: string
          format: uuid
        assignmentType:
          type: string
        organisationId:
          type: string
          format: uuid
        facilityId:
          type: string
