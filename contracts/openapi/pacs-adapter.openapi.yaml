  /internal/v1/imaging-studies/ops/status:
    get:
      operationId: getPacsOpsStatus
      tags:
        - ImagingStudy
      summary: Active PACS backend connectivity and capabilities probe
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/PodId'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: PACS adapter to Orthanc connectivity status
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
              examples:
                embeddedOrthanc:
                  summary: Embedded mode with default Orthanc provider
                  value:
                    reachable: true
                    provider: ORTHANC
                    mode: EMBEDDED
                    baseUrl: http://orthanc:8042
                externalPacs:
                  summary: External PACS mode
                  value:
                    reachable: false
                    provider: EXTERNAL
                    mode: EXTERNAL
                    baseUrl: https://pacs.example.org
                    status: CONFIGURED_EXTERNAL_PROVIDER
                hybridPolicy:
                  summary: Hybrid mode policy surface (provider may vary by facility)
                  value:
                    reachable: true
                    provider: ORTHANC
                    mode: HYBRID
                    baseUrl: http://orthanc:8042
  /internal/v1/imaging-studies/ops/unmatched-studies:
    get:
      operationId: listPacsUnmatchedStudies
      tags:
        - ImagingStudy
      summary: List studies awaiting correlation to OROS order context
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/PodId'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Unmatched studies
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ImagingStudy'
  /internal/v1/imaging-studies/ops/failed-correlations:
    get:
      operationId: listPacsFailedCorrelations
      tags:
        - ImagingStudy
      summary: List studies currently in FAILED state
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/PodId'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Failed studies
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ImagingStudy'
  /internal/v1/imaging-studies/ops/failed-writebacks:
    get:
      operationId: listPacsFailedWritebacks
      tags:
        - ImagingStudy
      summary: List outbox publication failures for imaging events
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/PodId'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Failed writeback / outbox rows
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  additionalProperties: true
  /internal/v1/imaging-studies/ops/failed-writebacks/{outboxId}/retry:
    post:
      operationId: retryPacsFailedWriteback
      tags:
        - ImagingStudy
      summary: Request immediate retry of a failed writeback row (idempotent)
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/PodId'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/CorrelationId'
        - name: outboxId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Retry status
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /internal/v1/imaging-studies/ops/failed-writebacks/retry-all:
    post:
      operationId: retryAllPacsFailedWritebacks
      tags:
        - ImagingStudy
      summary: Requeue and retry all currently failed writeback rows
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/PodId'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Batch retry summary
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
