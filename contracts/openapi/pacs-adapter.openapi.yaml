  /internal/v1/imaging-studies/{id}/viewer-sessions:
    post:
      operationId: launchImagingViewerSession
      tags:
        - ImagingStudy
      summary: Persist viewer launch context and emit imaging.viewer.launched event
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/PodId'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/CorrelationId'
