# =============================================================================
# PACS Adapter Service — Imaging metadata, Orthanc gateway, OROS correlation
# =============================================================================
openapi: "3.0.3"

info:
  title: PACS Adapter — Imaging Execution & Orthanc Gateway API
  version: "1.1.0"
  description: |
    PACS Adapter ingests imaging study metadata, correlates studies with OROS orders,
    forwards to Orthanc, and publishes Kafka events (`pacs.imaging_study` / legacy `pacs.study.available`, `pacs.study.correlated`).

    Trust headers are enforced by Envoy + TSHEPO; internal probes require Health OS Manifest v1.1 headers.
  contact:
    name: Impilo Platform Team
  license:
    name: Proprietary

servers:
  - url: http://localhost:8113
    description: Local development
  - url: https://{tenant}.impilo.health/api
    description: Production (per-tenant)
    variables:
      tenant:
        default: demo

security:
  - bearerAuth: []

tags:
  - name: Internal-Probe
    description: Tech-companion v1.1 header enforcement proofs
  - name: ImagingStudy
    description: Imaging study registration, correlation, and Orthanc forwarding

paths:
  /internal/v1/health:
    get:
      operationId: pacsInternalHealth
      tags:
        - Internal-Probe
      summary: v1.1 probe — returns trust context echo
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/PodId'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Service UP with context echo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProbeHealthBody'
  /internal/v1/test-command:
    post:
      operationId: pacsInternalTestCommand
      tags:
        - Internal-Probe
      summary: v1.1 probe — idempotency / echo
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/PodId'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '201':
          description: Echo payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProbeCommandBody'
  /internal/v1/imaging-studies:
    get:
      operationId: listImagingStudies
      tags:
        - ImagingStudy
      summary: List imaging studies
      parameters:
        - name: patientCpid
          in: query
          required: false
          schema:
            type: string
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/PodId'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Studies
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ImagingStudy'
    post:
      operationId: registerImagingStudy
      tags:
        - ImagingStudy
      summary: Register a new imaging study (emits pacs.imaging_study / legacy pacs.study.available via outbox)
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/PodId'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateImagingStudyRequest'
      responses:
        '201':
          description: Study created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImagingStudy'
  /internal/v1/imaging-studies/search:
    post:
      operationId: searchImagingStudies
      tags:
        - ImagingStudy
      summary: Search imaging studies by patient/study/order metadata filters
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/PodId'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImagingSearchRequest'
      responses:
        '200':
          description: Filtered studies
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ImagingStudy'
  /internal/v1/imaging-studies/{id}:
    get:
      operationId: getImagingStudy
      tags:
        - ImagingStudy
      summary: Get imaging study by id
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/PodId'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/CorrelationId'
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Study
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImagingStudy'
  /internal/v1/imaging-studies/{id}/forward:
    post:
      operationId: forwardImagingStudy
      tags:
        - ImagingStudy
      summary: Forward study to Orthanc
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/PodId'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/CorrelationId'
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForwardStudyRequest'
      responses:
        '200':
          description: Study after forward
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImagingStudy'
  /internal/v1/imaging-studies/{id}/correlate:
    patch:
      operationId: correlateImagingStudy
      tags:
        - ImagingStudy
      summary: Correlate study with OROS order (outbox emits correlated + study.available)
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/PodId'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/CorrelationId'
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CorrelateStudyRequest'
      responses:
        '200':
          description: Updated study
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImagingStudy'
  /internal/v1/imaging-studies/{id}/series:
    get:
      operationId: listImagingSeries
      tags:
        - ImagingStudy
      summary: List DICOM series metadata for a study
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/PodId'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/CorrelationId'
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Study series rows
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  additionalProperties: true
  /internal/v1/imaging-studies/{studyId}/series/{seriesId}/instances:
    get:
      operationId: listImagingInstances
      tags:
        - ImagingStudy
      summary: List DICOM instance metadata for a series
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/PodId'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/CorrelationId'
        - name: studyId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: seriesId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Series instances
          content:
            application/json:
              schema:
                type: array
                items:
