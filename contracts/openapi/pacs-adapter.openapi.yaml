# =============================================================================
# PACS Adapter Service — Imaging metadata, Orthanc gateway, OROS correlation
# =============================================================================
openapi: "3.0.3"

info:
  title: PACS Adapter — Imaging Execution & Orthanc Gateway API
  version: "1.1.0"
  description: |
    PACS Adapter ingests imaging study metadata, correlates studies with OROS orders,
    forwards to Orthanc, and publishes Kafka events (`pacs.imaging_study` / legacy `pacs.study.available`, `pacs.study.correlated`).

    Trust headers are enforced by Envoy + TSHEPO; internal probes require Health OS Manifest v1.1 headers.
  contact:
    name: Impilo Platform Team
  license:
    name: Proprietary

servers:
  - url: http://localhost:8113
    description: Local development
  - url: https://{tenant}.impilo.health/api
    description: Production (per-tenant)
    variables:
      tenant:
        default: demo

security:
  - bearerAuth: []

tags:
  - name: Internal-Probe
    description: Tech-companion v1.1 header enforcement proofs
  - name: ImagingStudy
    description: Imaging study registration, correlation, and Orthanc forwarding

paths:
  /internal/v1/health:
    get:
      operationId: pacsInternalHealth
      tags: [Internal-Probe]
      summary: v1.1 probe — returns trust context echo
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/PodId"
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "200":
          description: Service UP with context echo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProbeHealthBody"

  /internal/v1/test-command:
    post:
      operationId: pacsInternalTestCommand
      tags: [Internal-Probe]
      summary: v1.1 probe — idempotency / echo
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/PodId"
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "201":
          description: Echo payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProbeCommandBody"

  /internal/v1/imaging-studies:
    get:
      operationId: listImagingStudies
      tags: [ImagingStudy]
      summary: List imaging studies
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/PodId"
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "200":
          description: Studies
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ImagingStudy"
    post:
      operationId: registerImagingStudy
      tags: [ImagingStudy]
      summary: Register a new imaging study (emits pacs.imaging_study / legacy pacs.study.available via outbox)
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/PodId"
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateImagingStudyRequest"
      responses:
        "201":
          description: Study created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImagingStudy"

  /internal/v1/imaging-studies/{id}:
    get:
      operationId: getImagingStudy
      tags: [ImagingStudy]
      summary: Get imaging study by id
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/PodId"
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/CorrelationId"
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Study
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImagingStudy"

  /internal/v1/imaging-studies/{id}/forward:
    post:
      operationId: forwardImagingStudy
      tags: [ImagingStudy]
      summary: Forward study to Orthanc
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/PodId"
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/CorrelationId"
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForwardStudyRequest"
      responses:
        "200":
          description: Study after forward
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImagingStudy"

  /internal/v1/imaging-studies/{id}/correlate:
    patch:
      operationId: correlateImagingStudy
      tags: [ImagingStudy]
      summary: Correlate study with OROS order (outbox emits correlated + study.available)
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/PodId"
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/CorrelationId"
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CorrelateStudyRequest"
      responses:
        "200":
          description: Updated study
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImagingStudy"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    TenantId:
      name: X-Tenant-ID
      in: header
      required: true
      schema:
        type: string
    PodId:
      name: X-Pod-ID
      in: header
      required: true
      schema:
        type: string
    RequestId:
      name: X-Request-ID
      in: header
      required: true
      schema:
        type: string
        format: uuid
    CorrelationId:
      name: X-Correlation-ID
      in: header
      required: true
      schema:
        type: string
        format: uuid

  schemas:
    ProbeHealthBody:
      type: object
      properties:
        service:
          type: string
          example: pacs-adapter
        status:
          type: string
          example: UP
        tenant_id:
          type: string
        pod_id:
          type: string
        request_id:
          type: string
        correlation_id:
          type: string
      additionalProperties: true

    ProbeCommandBody:
      type: object
      properties:
        service:
          type: string
          example: pacs-adapter
        action:
          type: string
        request_id:
          type: string
        correlation_id:
          type: string
        echo:
          type: object
          additionalProperties: true
      additionalProperties: true

    CreateImagingStudyRequest:
      type: object
      required: [tenantId, patientCpid, studyUid, modality, studyDate]
      properties:
        tenantId:
          type: string
          format: uuid
        patientCpid:
          type: string
        studyUid:
          type: string
        modality:
          type: string
        description:
          type: string
        studyDate:
          type: string
          format: date-time
        metadata:
          type: string
        orosOrderId:
          type: string
        accessionNumber:
          type: string

    ForwardStudyRequest:
      type: object
      required: [orthancUrl]
      properties:
        orthancUrl:
          type: string
        priority:
          type: string

    CorrelateStudyRequest:
      type: object
      required: [orosOrderId]
      properties:
        orosOrderId:
          type: string

    ImagingStudy:
      type: object
      properties:
        id:
          type: integer
          format: int64
        tenantId:
          type: string
          format: uuid
        patientCpid:
          type: string
        studyUid:
          type: string
        modality:
          type: string
        description:
          type: string
        studyDate:
          type: string
          format: date-time
        status:
          type: string
        orthancId:
          type: string
        orosOrderId:
          type: string
        accessionNumber:
          type: string
        metadata:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      additionalProperties: false
