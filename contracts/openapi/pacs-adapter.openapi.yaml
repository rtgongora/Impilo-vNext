                  additionalProperties: true
  /internal/v1/imaging-studies/{id}/sync-hierarchy:
    post:
      operationId: syncImagingHierarchy
      tags:
        - ImagingStudy
      summary: Pull Orthanc hierarchy metadata into PACS adapter tables
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/PodId'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/CorrelationId'
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Updated study
          content:
