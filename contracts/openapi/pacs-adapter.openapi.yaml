          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '201':
          description: Viewer session created
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /internal/v1/imaging-studies/{id}/viewer-launch-context:
    get:
      operationId: getImagingViewerLaunchContext
      tags:
