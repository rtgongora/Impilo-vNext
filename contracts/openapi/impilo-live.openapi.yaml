components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    TenantId:
      name: X-Tenant-ID
      in: header
      required: true
      schema:
        type: string
        format: uuid
  schemas:
    LiveEvent:
      type: object
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        mode:
          type: string
          enum: [CLINICAL_SESSION, PROFESSIONAL_MEETING, WEBINAR_CPD, PUBLIC_BROADCAST, HYBRID_EVENT, EMERGENCY_BRIEFING]
        owningService:
          type: string
        owningEntityId:
          type: string
        eventType:
          type: string
        contextType:
          type: string
        status:
          type: string
        startTime:
          type: string
          format: date-time
        cpdEnabled:
          type: boolean
