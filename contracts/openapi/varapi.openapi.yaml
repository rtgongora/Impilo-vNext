components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    TenantId:
      name: X-Tenant-ID
      in: header
      required: true
      schema:
        type: string
    PodId:
      name: X-Pod-ID
      in: header
      required: true
      schema:
        type: string
    RequestId:
      name: X-Request-ID
      in: header
      required: true
      schema:
        type: string
        format: uuid
    CorrelationId:
      name: X-Correlation-ID
      in: header
      required: true
      schema:
        type: string
        format: uuid
    ActorId:
      name: X-Actor-ID
      in: header
      required: true
      schema:
        type: string
    ActorType:
      name: X-Actor-Type
      in: header
      required: true
      schema:
        type: string
    ProviderPublicId:
      name: providerPublicId
      in: path
      required: true
      schema:
        type: string
      description: Provider ULID (public identifier)

  responses:
    Unauthorized:
      description: Missing or invalid authentication

  schemas:
    ApiResponse:
      type: object
      description: Standard API response wrapper (see shared-kernel ApiResponse)
      properties:
        data:
          type: object
          additionalProperties: true
        meta:
          type: object
          properties:
            correlation_id:
              type: string
            request_id:
              type: string
      additionalProperties: true

    CreateProviderRequest:
      type: object
      required: [givenName, familyName, profession]
      properties:
        impiloHealthId:
          type: string
          format: uuid
          description: >
            Canonical Impilo / Health person identity. Required for production registry flows
            when Varapi `identity.require-impilo-health-id-on-provider-create` is true.
        givenName:
          type: string
        familyName:
          type: string
        profession:
          type: string
        cadre:
          type: string
        dateOfBirth:
          type: string
          format: date
        sex:
          type: string
          enum: [MALE, FEMALE, OTHER]
        councilCode:
          type: string
        registrationNumber:
          type: string

    UpdateProviderRequest:
      type: object
      properties:
        givenName:
          type: string
        familyName:
          type: string
        profession:
          type: string
        cadre:
          type: string
        contacts:
          type: array
          items:
            type: object
            properties:
              contactType:
                type: string
              value:
                type: string

    ProbeHealthBody:
      type: object
      properties:
        service:
          type: string
          example: varapi
        status:
          type: string
          example: UP
        tenant_id:
          type: string
        pod_id:
          type: string
        request_id:
          type: string
        correlation_id:
          type: string
      additionalProperties: true

    ProbeCommandBody:
      type: object
      properties:
        service:
          type: string
        action:
          type: string
        request_id:
          type: string
        correlation_id:
          type: string
        echo:
          type: object
          additionalProperties: true
      additionalProperties: true

    ProbeFederationBody:
      type: object
      properties:
        service:
          type: string
        action:
          type: string
        pod_id:
          type: string
        request_id:
          type: string
        correlation_id:
          type: string
      additionalProperties: true
