          additionalProperties: true

    CreateCpdCycleRequest:
      type: object
      required: [cycleName, startDate, endDate, requiredPoints]
      properties:
        councilId:
          type: integer
          format: int64
        cycleName:
          type: string
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        requiredPoints:
          type: integer

    RecordCpdEventRequest:
      type: object
