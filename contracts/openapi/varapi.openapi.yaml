        title:
          type: string
        description:
          type: string
        pointsAwarded:
          type: integer
        eventDate:
          type: string
          format: date
        externalRef:
          type: string

    EligibilityCheckRequest:
      type: object
      properties:
        providerPublicId:
          type: string
        facilityId:
          type: string
          format: uuid
        workspaceId:
          type: string
          format: uuid
        privilegeType:
          type: string

    ReconciliationDecisionRequest:
      type: object
      required: [action]
      properties:
        action:
          type: string
          enum: [MERGE, OVERRIDE, SKIP]
        notes:
          type: string

    # ---- Response wrappers -------------------------------------------------

    ApiResponseProviderResponse:
      type: object
      properties:
        success:
          type: boolean
        correlationId:
          type: string
          format: uuid
        data:
          $ref: "#/components/schemas/ProviderResponse"

    ApiResponsePagedProviderSummary:
