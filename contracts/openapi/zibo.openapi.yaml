components:
  # -------------------------------------------------------------------------
  # Security Schemes
  # -------------------------------------------------------------------------
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  # -------------------------------------------------------------------------
  # Parameters
  # -------------------------------------------------------------------------
  parameters:
    X-Tenant-Id:
      name: X-Tenant-Id
      in: header
      required: true
      description: Tenant identifier (injected by Envoy ext_authz)
      schema:
        type: string

    X-Correlation-Id:
      name: X-Correlation-Id
      in: header
      required: true
      description: Request correlation ID for distributed tracing
      schema:
        type: string
        format: uuid

    X-Actor-Id:
      name: X-Actor-Id
      in: header
      required: true
      description: Authenticated actor identifier
      schema:
        type: string

    X-Actor-Type:
      name: X-Actor-Type
      in: header
      description: Actor type (CLINICIAN, ADMIN, SYSTEM, etc.)
      schema:
        type: string
        enum: [CLINICIAN, ADMIN, SYSTEM, SERVICE, PATIENT]

    X-Purpose-Of-Use:
      name: X-Purpose-Of-Use
      in: header
      description: Purpose of use for the request
      schema:
        type: string
        enum: [TREATMENT, ADMIN, PAYMENT, RESEARCH, PUBLIC_HEALTH, OPERATIONS]

    ArtifactIdPath:
      name: artifactId
      in: path
      required: true
      description: Artifact UUID
      schema:
        type: string
        format: uuid

    PackIdPath:
      name: packId
      in: path
      required: true
      description: Pack UUID
      schema:
        type: string
        format: uuid

    PageParam:
      name: page
      in: query
      description: Page number (0-based)
      schema:
        type: integer
        default: 0
        minimum: 0

    SizeParam:
      name: size
      in: query
      description: Page size
      schema:
        type: integer
        default: 20
        minimum: 1
        maximum: 100

  # -------------------------------------------------------------------------
  # Responses
  # -------------------------------------------------------------------------
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    Unauthorized:
      description: Missing or invalid authentication
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    Forbidden:
      description: Insufficient permissions
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    Conflict:
      description: State conflict (e.g., trying to publish an already active artifact)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  # -------------------------------------------------------------------------
  # Schemas
  # -------------------------------------------------------------------------
  schemas:
    # -- Enums --
    FhirType:
      type: string
      enum:
        - CodeSystem
        - ValueSet
        - ConceptMap
        - NamingSystem
        - StructureDefinition
        - SearchParameter
        - OperationDefinition
        - CapabilityStatement
        - ImplementationGuide
        - Questionnaire

    ArtifactStatus:
      type: string
      enum: [DRAFT, ACTIVE, DEPRECATED, RETIRED]

    PackStatus:
      type: string
      enum: [DRAFT, ACTIVE, DEPRECATED, RETIRED]

    SourceFormat:
      type: string
      enum: [FHIR_JSON, FHIR_XML, CSV, CUSTOM]

    ValidationSeverity:
      type: string
      enum: [ERROR, WARNING, INFO]

    PolicyMode:
      type: string
      enum: [ENFORCE, WARN, AUDIT]

    ScopeType:
      type: string
      enum: [FACILITY, WORKSPACE, SERVICE, TENANT]

    MapEquivalence:
      type: string
      enum: [equivalent, wider, narrower, inexact, unmatched, disjoint]

    ValidationJobStatus:
      type: string
      enum: [PENDING, RUNNING, COMPLETED, FAILED]

    # -- API Envelope --
    ApiResponse:
      type: object
      required: [success, timestamp]
      properties:
        success:
          type: boolean
        timestamp:
          type: string
          format: date-time
        correlationId:
          type: string
          format: uuid
        error:
          $ref: '#/components/schemas/ApiError'

    ApiError:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: array
          items:
            type: string

    SuccessResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - type: object
          properties:
            data:
              type: object
              nullable: true

    ErrorResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - type: object
          properties:
            success:
              type: boolean
              example: false

    # -- Artifact --
    Artifact:
      type: object
      required:
        - id
        - tenantId
        - fhirType
        - canonicalUrl
        - name
        - title
        - version
        - status
        - sourceFormat
        - contentHash
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        tenantId:
          type: string
        fhirType:
          $ref: '#/components/schemas/FhirType'
        canonicalUrl:
          type: string
          format: uri
        name:
          type: string
          description: Machine-readable name
        title:
          type: string
          description: Human-readable title
        version:
          type: string
          description: Semantic version
        status:
          $ref: '#/components/schemas/ArtifactStatus'
        publisher:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        conceptCount:
          type: integer
          nullable: true
          description: Number of concepts (for CodeSystem/ValueSet)
        sourceFormat:
          $ref: '#/components/schemas/SourceFormat'
        contentHash:
          type: string
          description: SHA-256 hash of content for deduplication
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        publishedAt:
          type: string
          format: date-time
          nullable: true
        deprecatedAt:
          type: string
          format: date-time
          nullable: true

    ArtifactCreateRequest:
      type: object
      required: [fhirType, canonicalUrl, name, title, version, content, sourceFormat]
      properties:
        fhirType:
          $ref: '#/components/schemas/FhirType'
        canonicalUrl:
          type: string
          format: uri
        name:
          type: string
          minLength: 1
          maxLength: 255
        title:
          type: string
          minLength: 1
          maxLength: 500
        version:
          type: string
          minLength: 1
          maxLength: 50
        publisher:
          type: string
          maxLength: 255
        description:
          type: string
          maxLength: 2000
        content:
          type: string
          description: Resource content (FHIR JSON, XML, or CSV)
        sourceFormat:
          $ref: '#/components/schemas/SourceFormat'

    ArtifactUpdateRequest:
      type: object
      properties:
        title:
          type: string
          maxLength: 500
        description:
          type: string
          maxLength: 2000
        publisher:
          type: string
          maxLength: 255
        content:
          type: string
          description: Updated resource content

    ArtifactVersion:
      type: object
      required: [version, status, createdAt]
      properties:
        version:
          type: string
        status:
          $ref: '#/components/schemas/ArtifactStatus'
        publishedAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time

    ArtifactResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/Artifact'

    ArtifactListResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/Artifact'

    ArtifactVersionListResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/ArtifactVersion'

    # -- Pack --
    Pack:
      type: object
      required:
        - id
        - tenantId
        - name
        - version
        - status
        - artifactCount
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        tenantId:
          type: string
        name:
          type: string
        version:
          type: string
        description:
          type: string
          nullable: true
        status:
          $ref: '#/components/schemas/PackStatus'
        artifactCount:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        publishedAt:
          type: string
          format: date-time
          nullable: true

    PackCreateRequest:
      type: object
      required: [name, version]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        version:
          type: string
          minLength: 1
          maxLength: 50
        description:
          type: string
          maxLength: 2000

    PackArtifact:
      type: object
      required: [artifactId, canonicalUrl, fhirType, name, version, status]
      properties:
        artifactId:
          type: string
          format: uuid
        canonicalUrl:
          type: string
          format: uri
        fhirType:
          $ref: '#/components/schemas/FhirType'
        name:
          type: string
        version:
          type: string
        status:
          $ref: '#/components/schemas/ArtifactStatus'

    PackResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/Pack'

    PackListResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/Pack'

    PackArtifactListResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/PackArtifact'

    # -- Validation --
    ValidateCodingRequest:
      type: object
      required: [system, code]
      properties:
        system:
          type: string
          format: uri
          description: Code system URL
        code:
          type: string
          description: Code value
        display:
          type: string
          description: Expected display text (optional verification)
        valueSetUrl:
          type: string
          format: uri
          description: ValueSet to validate membership against

    ValidateCodingResult:
      type: object
      required: [valid, severity, message, system, code]
      properties:
        valid:
          type: boolean
        severity:
          $ref: '#/components/schemas/ValidationSeverity'
        message:
          type: string
        system:
          type: string
        code:
          type: string
        display:
          type: string
          nullable: true
        valueSetUrl:
          type: string
          nullable: true

    ValidateCodingResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/ValidateCodingResult'

    ValidateResourceRequest:
      type: object
      required: [resourceType, resource]
      properties:
        resourceType:
          type: string
          description: FHIR resource type name
        resource:
          type: string
          description: JSON-serialized FHIR resource
        profileUrl:
          type: string
          format: uri
          description: StructureDefinition URL to validate against

    ValidationIssue:
      type: object
      required: [severity, code, diagnostics]
      properties:
        severity:
          $ref: '#/components/schemas/ValidationSeverity'
        code:
          type: string
          description: Issue type code
        diagnostics:
          type: string
          description: Human-readable diagnostic message
        location:
          type: string
          nullable: true
          description: FHIRPath expression to the issue location

    ValidateResourceResult:
      type: object
      required: [valid, issueCount, issues]
      properties:
        valid:
          type: boolean
        issueCount:
          type: integer
        issues:
          type: array
          items:
            $ref: '#/components/schemas/ValidationIssue'

    ValidateResourceResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/ValidateResourceResult'

    ValidationJobSubmitRequest:
      type: object
      required: [resources]
      properties:
        resources:
          type: array
          items:
            type: string
          description: JSON-serialized FHIR resources to validate
          minItems: 1
          maxItems: 1000
        profileUrl:
          type: string
          format: uri
          description: StructureDefinition URL to validate against

    ValidationJob:
      type: object
      required:
        - id
        - tenantId
        - status
        - totalResources
        - processedResources
        - errorCount
        - warningCount
        - submittedAt
      properties:
        id:
          type: string
          format: uuid
        tenantId:
          type: string
        status:
          $ref: '#/components/schemas/ValidationJobStatus'
        totalResources:
          type: integer
        processedResources:
          type: integer
        errorCount:
          type: integer
        warningCount:
          type: integer
        submittedAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
          nullable: true

    ValidationJobResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/ValidationJob'

    # -- Mapping --
    MapRequest:
      type: object
      required: [sourceSystem, sourceCode]
      properties:
        sourceSystem:
          type: string
          format: uri
          description: Source terminology system URL
        sourceCode:
          type: string
          description: Source code to translate
        targetSystem:
          type: string
          format: uri
          description: Optional target system to restrict results

    MapResult:
      type: object
      required:
        - sourceSystem
        - sourceCode
        - targetSystem
        - targetCode
        - equivalence
        - conceptMapUrl
        - conceptMapVersion
      properties:
        sourceSystem:
          type: string
        sourceCode:
          type: string
        sourceDisplay:
          type: string
          nullable: true
        targetSystem:
          type: string
        targetCode:
          type: string
        targetDisplay:
          type: string
          nullable: true
        equivalence:
          $ref: '#/components/schemas/MapEquivalence'
        conceptMapUrl:
          type: string
          format: uri
        conceptMapVersion:
          type: string

    MapSource:
      type: object
      required: [system, display, conceptMapCount]
      properties:
        system:
          type: string
          format: uri
        display:
          type: string
        conceptMapCount:
          type: integer

    MapResultListResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/MapResult'

    MapSourceListResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/MapSource'

    # -- Assignment --
    Assignment:
      type: object
      required:
        - id
        - tenantId
        - packId
        - packName
        - scope
        - scopeType
        - policyMode
        - active
        - assignedAt
        - assignedBy
      properties:
        id:
          type: string
          format: uuid
        tenantId:
          type: string
        packId:
          type: string
          format: uuid
        packName:
          type: string
        scope:
          type: string
          description: Scope identifier (facility ID, workspace ID, service name, or tenant ID)
        scopeType:
          $ref: '#/components/schemas/ScopeType'
        policyMode:
          $ref: '#/components/schemas/PolicyMode'
        active:
          type: boolean
        assignedAt:
          type: string
          format: date-time
        assignedBy:
          type: string
          description: Actor who created the assignment

    AssignRequest:
      type: object
      required: [packId, scope, scopeType, policyMode]
      properties:
        packId:
          type: string
          format: uuid
        scope:
          type: string
          minLength: 1
          maxLength: 255
        scopeType:
          $ref: '#/components/schemas/ScopeType'
        policyMode:
          $ref: '#/components/schemas/PolicyMode'

    AssignmentResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/Assignment'

    AssignmentListResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/Assignment'

    # -- Import --
    ImportResult:
      type: object
      required: [imported, skipped, errors]
      properties:
        imported:
          type: integer
          description: Number of successfully imported artifacts
        skipped:
          type: integer
          description: Number of skipped entries (e.g., duplicates)
        errors:
          type: array
          items:
            type: string
          description: Error messages for failed entries

    ImportResultResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/ImportResult'

    CsvImportRequest:
      type: object
      required: [fhirType, csvContent, canonicalUrl, name, version]
      properties:
        fhirType:
          $ref: '#/components/schemas/FhirType'
        csvContent:
          type: string
          description: Raw CSV content
        canonicalUrl:
          type: string
          format: uri
        name:
          type: string
          minLength: 1
          maxLength: 255
        version:
          type: string
          minLength: 1
          maxLength: 50

    # -- Governance --
    ValidationLog:
      type: object
      required:
        - id
        - tenantId
        - timestamp
        - sourceService
        - resourceType
        - severity
        - code
        - diagnostics
      properties:
        id:
          type: string
          format: uuid
        tenantId:
          type: string
        timestamp:
          type: string
          format: date-time
        sourceService:
          type: string
          description: Service that triggered the validation
        resourceType:
          type: string
          description: FHIR resource type being validated
        severity:
          $ref: '#/components/schemas/ValidationSeverity'
        code:
          type: string
          description: Validation issue code
        diagnostics:
          type: string
          description: Human-readable diagnostic message
        system:
          type: string
          nullable: true
          description: Terminology system URL (if coding-related)
        valueCode:
          type: string
          nullable: true
          description: Code value (if coding-related)

    TopFailure:
      type: object
      required: [system, code, count, lastSeen, severity]
      properties:
        system:
          type: string
        code:
          type: string
        display:
          type: string
          nullable: true
        count:
          type: integer
          description: Total occurrence count
        lastSeen:
          type: string
          format: date-time
        severity:
          $ref: '#/components/schemas/ValidationSeverity'

    ServiceErrorCount:
      type: object
      required: [service, errorCount, warningCount]
      properties:
        service:
          type: string
        errorCount:
          type: integer
        warningCount:
          type: integer

    GovernanceStats:
      type: object
      required:
        - totalValidations
        - errorCount
        - warningCount
        - infoCount
        - errorRate
        - topOffendingServices
        - periodStart
        - periodEnd
      properties:
        totalValidations:
          type: integer
        errorCount:
          type: integer
        warningCount:
          type: integer
        infoCount:
          type: integer
        errorRate:
          type: number
          format: double
          description: Error rate as a decimal (0.0 to 1.0)
        topOffendingServices:
          type: array
          items:
            $ref: '#/components/schemas/ServiceErrorCount'
        periodStart:
          type: string
          format: date-time
        periodEnd:
          type: string
          format: date-time

    ValidationLogListResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/ValidationLog'

    TopFailureListResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/TopFailure'

    GovernanceStatsResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/GovernanceStats'
