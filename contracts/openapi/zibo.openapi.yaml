# =============================================================================
# ZIBO -- Terminology, Definitions & Classification API (OpenAPI 3.0)
#
# Comprehensive terminology governance: artifact management, pack distribution,
# code mapping, validation, assignment policies, and governance analytics.
#
# All endpoints require a valid Bearer JWT and TSHEPO trust headers
# (X-Tenant-Id, X-Actor-Id, X-Correlation-Id, etc.) injected by
# Envoy ext_authz.
# =============================================================================
openapi: "3.0.3"

info:
  title: "ZIBO -- Terminology, Definitions & Classification API"
  version: "1.0.0"
  description: |
    ZIBO manages the complete terminology lifecycle for the Impilo platform:

    * **Artifacts** -- FHIR terminology resource CRUD, versioning, and lifecycle
    * **Packs** -- Grouping artifacts into distributable terminology packs
    * **Validation** -- Coding validation, resource validation, and batch jobs
    * **Mapping** -- Code translation across terminology systems via ConceptMaps
    * **Assignments** -- Pack-to-scope binding with policy enforcement modes
    * **Import/Export** -- FHIR Bundle and CSV import, pack export
    * **Governance** -- Validation logs, top failures, and compliance stats

    All endpoints require TSHEPO trust headers injected by Envoy ext_authz.
  contact:
    name: Impilo Platform Team
  license:
    name: Proprietary

servers:
  - url: http://localhost:8085
    description: Local development
  - url: https://{tenant}.impilo.health/api
    description: Production (per-tenant)
    variables:
      tenant:
        default: demo

# ---------------------------------------------------------------------------
# Security
# ---------------------------------------------------------------------------
security:
  - bearerAuth: []

tags:
  - name: Artifact
    description: Terminology artifact lifecycle management
  - name: Pack
    description: Terminology pack creation and distribution
  - name: Validate
    description: Coding and resource validation
  - name: Map
    description: Code translation and mapping
  - name: Assignment
    description: Pack-to-scope assignment and policy enforcement
  - name: Import
    description: Bulk import of terminology resources
  - name: Export
    description: Export packs and artifacts as FHIR Bundles
  - name: Governance
    description: Validation logs, failure analytics, and compliance stats

# ===========================================================================
# Paths
# ===========================================================================
paths:
  /v1/artifacts:
    get:
      operationId: listArtifacts
      summary: List terminology artifacts
      description: |
        Returns a paginated list of terminology artifacts filtered by type,
        status, or search query. Results are sorted by updatedAt descending.
      tags:
        - Artifact
      parameters:
        - $ref: '#/components/parameters/X-Tenant-Id'
        - $ref: '#/components/parameters/X-Correlation-Id'
        - $ref: '#/components/parameters/X-Actor-Id'
        - $ref: '#/components/parameters/X-Actor-Type'
        - $ref: '#/components/parameters/X-Purpose-Of-Use'
        - name: fhirType
          in: query
          schema:
            $ref: '#/components/schemas/FhirType'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/ArtifactStatus'
        - name: q
          in: query
          description: Free-text search across name, title, and canonicalUrl
          schema:
            type: string
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
      responses:
        '200':
          description: List of artifacts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArtifactListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      operationId: createArtifact
      summary: Create a new terminology artifact
      description: |
        Creates a new artifact in DRAFT status. The content field should contain
        the FHIR resource JSON, XML, or CSV data depending on sourceFormat.
      tags:
        - Artifact
      parameters:
        - $ref: '#/components/parameters/X-Tenant-Id'
        - $ref: '#/components/parameters/X-Correlation-Id'
        - $ref: '#/components/parameters/X-Actor-Id'
        - $ref: '#/components/parameters/X-Actor-Type'
        - $ref: '#/components/parameters/X-Purpose-Of-Use'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ArtifactCreateRequest'
      responses:
        '201':
          description: Artifact created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArtifactResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/artifacts/{artifactId}:
    get:
      operationId: getArtifact
      summary: Get artifact by ID
      tags:
        - Artifact
      parameters:
        - $ref: '#/components/parameters/X-Tenant-Id'
        - $ref: '#/components/parameters/X-Correlation-Id'
        - $ref: '#/components/parameters/ArtifactIdPath'
      responses:
        '200':
          description: Artifact detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArtifactResponse'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      operationId: updateArtifact
      summary: Update artifact metadata or content
      description: |
        Updates a DRAFT artifact. Only title, description, publisher, and
        content fields can be modified. Published artifacts cannot be updated.
      tags:
        - Artifact
      parameters:
        - $ref: '#/components/parameters/X-Tenant-Id'
        - $ref: '#/components/parameters/X-Correlation-Id'
        - $ref: '#/components/parameters/X-Actor-Id'
        - $ref: '#/components/parameters/ArtifactIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ArtifactUpdateRequest'
      responses:
        '200':
          description: Artifact updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArtifactResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      operationId: deleteArtifact
      summary: Delete a DRAFT artifact
      description: Only DRAFT artifacts can be deleted. Published artifacts must be retired.
      tags:
        - Artifact
      parameters:
        - $ref: '#/components/parameters/X-Tenant-Id'
        - $ref: '#/components/parameters/X-Correlation-Id'
        - $ref: '#/components/parameters/X-Actor-Id'
        - $ref: '#/components/parameters/ArtifactIdPath'
      responses:
        '200':
          description: Artifact deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/artifacts/{artifactId}/publish:
    post:
      operationId: publishArtifact
      summary: Publish a DRAFT artifact
      description: Transitions artifact from DRAFT to ACTIVE status.
      tags:
        - Artifact
      parameters:
        - $ref: '#/components/parameters/X-Tenant-Id'
        - $ref: '#/components/parameters/X-Correlation-Id'
        - $ref: '#/components/parameters/X-Actor-Id'
        - $ref: '#/components/parameters/ArtifactIdPath'
      responses:
        '200':
          description: Artifact published
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArtifactResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/artifacts/{artifactId}/deprecate:
    post:
      operationId: deprecateArtifact
      summary: Deprecate an ACTIVE artifact
      description: |
        Marks an ACTIVE artifact as DEPRECATED. Deprecated artifacts are still
        usable but should be replaced by newer versions.
      tags:
        - Artifact
      parameters:
        - $ref: '#/components/parameters/X-Tenant-Id'
        - $ref: '#/components/parameters/X-Correlation-Id'
        - $ref: '#/components/parameters/X-Actor-Id'
        - $ref: '#/components/parameters/ArtifactIdPath'
      responses:
        '200':
          description: Artifact deprecated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArtifactResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/artifacts/{artifactId}/retire:
    post:
      operationId: retireArtifact
      summary: Retire an artifact
      description: |
        Permanently retires an ACTIVE or DEPRECATED artifact. Retired artifacts
        cannot be used for validation or mapping.
      tags:
        - Artifact
      parameters:
        - $ref: '#/components/parameters/X-Tenant-Id'
        - $ref: '#/components/parameters/X-Correlation-Id'
        - $ref: '#/components/parameters/X-Actor-Id'
        - $ref: '#/components/parameters/ArtifactIdPath'
      responses:
        '200':
          description: Artifact retired
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArtifactResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/artifacts/{artifactId}/versions:
    get:
      operationId: getArtifactVersions
      summary: List all versions of an artifact
      description: Returns version history for the artifact identified by canonicalUrl.
      tags:
        - Artifact
      parameters:
        - $ref: '#/components/parameters/X-Tenant-Id'
        - $ref: '#/components/parameters/X-Correlation-Id'
        - $ref: '#/components/parameters/ArtifactIdPath'
      responses:
        '200':
          description: Artifact version list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArtifactVersionListResponse'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/artifacts/resolve:
    get:
      operationId: resolveArtifact
      summary: Resolve artifact by canonical URL
      description: |
        Resolves an artifact by its canonical URL and optional version.
        If no version is specified, the latest ACTIVE version is returned.
      tags:
        - Artifact
      parameters:
        - $ref: '#/components/parameters/X-Tenant-Id'
        - $ref: '#/components/parameters/X-Correlation-Id'
        - name: url
          in: query
          required: true
          description: Canonical URL of the artifact
          schema:
            type: string
            format: uri
        - name: version
          in: query
          description: Specific version to resolve
          schema:
            type: string
      responses:
        '200':
          description: Resolved artifact
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArtifactResponse'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/packs:
    get:
      operationId: listPacks
      summary: List terminology packs
      tags:
        - Pack
      parameters:
        - $ref: '#/components/parameters/X-Tenant-Id'
        - $ref: '#/components/parameters/X-Correlation-Id'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/PackStatus'
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
      responses:
        '200':
          description: List of packs
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PackListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      operationId: createPack
      summary: Create a new terminology pack
      tags:
        - Pack
      parameters:
        - $ref: '#/components/parameters/X-Tenant-Id'
        - $ref: '#/components/parameters/X-Correlation-Id'
        - $ref: '#/components/parameters/X-Actor-Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PackCreateRequest'
      responses:
        '201':
          description: Pack created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PackResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/packs/{packId}:
    get:
      operationId: getPack
      summary: Get pack by ID
      tags:
        - Pack
      parameters:
        - $ref: '#/components/parameters/X-Tenant-Id'
        - $ref: '#/components/parameters/X-Correlation-Id'
        - $ref: '#/components/parameters/PackIdPath'
      responses:
        '200':
          description: Pack detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PackResponse'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/packs/{packId}/artifacts:
    get:
      operationId: getPackArtifacts
      summary: List artifacts in a pack
      tags:
        - Pack
      parameters:
        - $ref: '#/components/parameters/X-Tenant-Id'
        - $ref: '#/components/parameters/X-Correlation-Id'
        - $ref: '#/components/parameters/PackIdPath'
      responses:
        '200':
          description: Artifacts in pack
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PackArtifactListResponse'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      operationId: addArtifactToPack
      summary: Add an artifact to a pack
      description: Adds an existing artifact to a DRAFT pack.
      tags:
        - Pack
      parameters:
        - $ref: '#/components/parameters/X-Tenant-Id'
        - $ref: '#/components/parameters/X-Correlation-Id'
        - $ref: '#/components/parameters/X-Actor-Id'
        - $ref: '#/components/parameters/PackIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - artifactId
              properties:
                artifactId:
                  type: string
                  format: uuid
      responses:
        '200':
          description: Artifact added
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PackResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/packs/{packId}/artifacts/{artifactId}:
    delete:
      operationId: removeArtifactFromPack
      summary: Remove an artifact from a pack
      description: Removes an artifact from a DRAFT pack.
      tags:
        - Pack
      parameters:
        - $ref: '#/components/parameters/X-Tenant-Id'
        - $ref: '#/components/parameters/X-Correlation-Id'
        - $ref: '#/components/parameters/X-Actor-Id'
        - $ref: '#/components/parameters/PackIdPath'
        - $ref: '#/components/parameters/ArtifactIdPath'
      responses:
        '200':
          description: Artifact removed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PackResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/packs/{packId}/publish:
    post:
      operationId: publishPack
      summary: Publish a DRAFT pack
      description: |
        Transitions pack from DRAFT to ACTIVE. All contained artifacts must
        be in ACTIVE status for the pack to be published.
      tags:
        - Pack
      parameters:
        - $ref: '#/components/parameters/X-Tenant-Id'
        - $ref: '#/components/parameters/X-Correlation-Id'
        - $ref: '#/components/parameters/X-Actor-Id'
        - $ref: '#/components/parameters/PackIdPath'
      responses:
        '200':
          description: Pack published
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PackResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/packs/{packId}/deprecate:
    post:
      operationId: deprecatePack
      summary: Deprecate an ACTIVE pack
      tags:
        - Pack
      parameters:
        - $ref: '#/components/parameters/X-Tenant-Id'
        - $ref: '#/components/parameters/X-Correlation-Id'
        - $ref: '#/components/parameters/X-Actor-Id'
        - $ref: '#/components/parameters/PackIdPath'
      responses:
        '200':
          description: Pack deprecated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PackResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/validate/coding:
    post:
      operationId: validateCoding
      summary: Validate a single coding
      description: |
        Validates that a code exists in the specified code system and
        optionally belongs to a value set.
      tags:
        - Validate
      parameters:
        - $ref: '#/components/parameters/X-Tenant-Id'
        - $ref: '#/components/parameters/X-Correlation-Id'
        - $ref: '#/components/parameters/X-Actor-Id'
        - $ref: '#/components/parameters/X-Actor-Type'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ValidateCodingRequest'
      responses:
        '200':
          description: Validation result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidateCodingResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
  /v1/validate/resource:
    post:
      operationId: validateResource
      summary: Validate a FHIR resource
      description: |
        Validates a FHIR resource against its base definition and optionally
        a specified profile. Returns structured validation issues.
      tags:
        - Validate
      parameters:
        - $ref: '#/components/parameters/X-Tenant-Id'
        - $ref: '#/components/parameters/X-Correlation-Id'
        - $ref: '#/components/parameters/X-Actor-Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ValidateResourceRequest'
      responses:
        '200':
          description: Validation result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidateResourceResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
  /v1/validate/job:
    post:
      operationId: submitValidationJob
      summary: Submit a batch validation job
      description: |
        Submits a batch of FHIR resources for asynchronous validation.
        Returns a job ID that can be polled for progress and results.
      tags:
        - Validate
      parameters:
        - $ref: '#/components/parameters/X-Tenant-Id'
        - $ref: '#/components/parameters/X-Correlation-Id'
        - $ref: '#/components/parameters/X-Actor-Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ValidationJobSubmitRequest'
      responses:
        '202':
          description: Job accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationJobResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
  /v1/validate/job/{jobId}:
    get:
      operationId: getValidationJob
      summary: Get validation job status and results
      tags:
        - Validate
      parameters:
        - $ref: '#/components/parameters/X-Tenant-Id'
        - $ref: '#/components/parameters/X-Correlation-Id'
        - name: jobId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Job status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationJobResponse'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/map:
    post:
      operationId: mapCode
      summary: Map a code to target system(s)
      description: |
        Translates a source code to one or more target codes using available
        ConceptMap artifacts. Returns all matching mappings with equivalence.
      tags:
        - Map
      parameters:
        - $ref: '#/components/parameters/X-Tenant-Id'
        - $ref: '#/components/parameters/X-Correlation-Id'
        - $ref: '#/components/parameters/X-Actor-Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MapRequest'
      responses:
        '200':
          description: Mapping results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MapResultListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
  /v1/map/sources:
    get:
      operationId: getMapSources
      summary: List available mapping source systems
      description: |
        Returns a list of source terminology systems that have ConceptMap
        artifacts available for mapping.
      tags:
        - Map
      parameters:
        - $ref: '#/components/parameters/X-Tenant-Id'
        - $ref: '#/components/parameters/X-Correlation-Id'
        - name: sourceSystem
          in: query
          description: Filter by source system URL
          schema:
            type: string
      responses:
        '200':
          description: Available mapping sources
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MapSourceListResponse'
  /v1/map/rebuild:
    post:
      operationId: rebuildMapIndex
      summary: Rebuild the mapping index
      description: |
        Triggers a full rebuild of the in-memory mapping index from all
        ACTIVE ConceptMap artifacts. Use after bulk imports.
      tags:
        - Map
      parameters:
        - $ref: '#/components/parameters/X-Tenant-Id'
        - $ref: '#/components/parameters/X-Correlation-Id'
        - $ref: '#/components/parameters/X-Actor-Id'
      responses:
        '200':
          description: Rebuild initiated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/assignments:
    get:
      operationId: listAssignments
      summary: List pack assignments
      tags:
        - Assignment
      parameters:
        - $ref: '#/components/parameters/X-Tenant-Id'
        - $ref: '#/components/parameters/X-Correlation-Id'
        - name: scope
          in: query
          description: Filter by scope identifier
          schema:
            type: string
        - name: scopeType
          in: query
          schema:
            $ref: '#/components/schemas/ScopeType'
        - name: active
          in: query
          description: Filter by active status
          schema:
            type: boolean
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
      responses:
        '200':
          description: List of assignments
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssignmentListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      operationId: assignPack
      summary: Assign a pack to a scope
      description: |
        Creates a new assignment binding a terminology pack to a scope
        (facility, workspace, service, or tenant) with a policy enforcement mode.
      tags:
        - Assignment
      parameters:
        - $ref: '#/components/parameters/X-Tenant-Id'
        - $ref: '#/components/parameters/X-Correlation-Id'
        - $ref: '#/components/parameters/X-Actor-Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignRequest'
      responses:
        '201':
          description: Assignment created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssignmentResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/assignments/{assignmentId}:
    delete:
      operationId: unassignPack
      summary: Remove a pack assignment
      tags:
        - Assignment
      parameters:
        - $ref: '#/components/parameters/X-Tenant-Id'
        - $ref: '#/components/parameters/X-Correlation-Id'
        - $ref: '#/components/parameters/X-Actor-Id'
        - name: assignmentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Assignment removed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/import/fhir-bundle:
    post:
      operationId: importFhirBundle
      summary: Import artifacts from a FHIR Bundle
      description: |
        Imports terminology resources (CodeSystem, ValueSet, ConceptMap, etc.)
        from a FHIR Bundle. Each resource in the bundle is created as a new
        artifact in DRAFT status.
      tags:
        - Import
      parameters:
        - $ref: '#/components/parameters/X-Tenant-Id'
        - $ref: '#/components/parameters/X-Correlation-Id'
        - $ref: '#/components/parameters/X-Actor-Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: FHIR Bundle resource (resourceType = Bundle)
      responses:
        '200':
          description: Import result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportResultResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
  /v1/import/csv:
    post:
      operationId: importCsv
      summary: Import a terminology artifact from CSV
      description: |
        Creates a single artifact from CSV data. The CSV must follow the
        expected column format for the specified FHIR type.
      tags:
        - Import
      parameters:
        - $ref: '#/components/parameters/X-Tenant-Id'
        - $ref: '#/components/parameters/X-Correlation-Id'
        - $ref: '#/components/parameters/X-Actor-Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CsvImportRequest'
      responses:
        '200':
          description: Import result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportResultResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
  /v1/export/packs/{packId}/bundle:
    get:
      operationId: exportPackBundle
      summary: Export a pack as a FHIR Bundle
      description: |
        Exports all artifacts in a pack as a FHIR Bundle (type = collection).
        Only ACTIVE packs can be exported.
      tags:
        - Export
      parameters:
        - $ref: '#/components/parameters/X-Tenant-Id'
        - $ref: '#/components/parameters/X-Correlation-Id'
        - $ref: '#/components/parameters/PackIdPath'
      responses:
        '200':
          description: FHIR Bundle
          content:
            application/json:
              schema:
                type: object
                description: FHIR Bundle resource
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/export/artifacts/{artifactId}:
    get:
      operationId: exportArtifact
      summary: Export a single artifact as FHIR resource
      tags:
        - Export
      parameters:
        - $ref: '#/components/parameters/X-Tenant-Id'
        - $ref: '#/components/parameters/X-Correlation-Id'
        - $ref: '#/components/parameters/ArtifactIdPath'
      responses:
        '200':
          description: FHIR resource
          content:
            application/json:
              schema:
                type: object
                description: FHIR terminology resource
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/governance/validation-logs:
    get:
      operationId: getValidationLogs
      summary: List validation log entries
      description: |
        Returns validation events recorded by the governance engine. Filter by
        severity, source service, or resource type.
      tags:
        - Governance
      parameters:
        - $ref: '#/components/parameters/X-Tenant-Id'
        - $ref: '#/components/parameters/X-Correlation-Id'
        - name: severity
          in: query
          schema:
            $ref: '#/components/schemas/ValidationSeverity'
        - name: sourceService
          in: query
          description: Filter by originating service name
          schema:
            type: string
        - name: resourceType
          in: query
          description: Filter by FHIR resource type
          schema:
            type: string
        - name: from
          in: query
          description: Start of time range (ISO 8601)
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          description: End of time range (ISO 8601)
          schema:
            type: string
            format: date-time
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
      responses:
        '200':
          description: Validation log entries
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationLogListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/governance/top-failures:
    get:
      operationId: getTopFailures
      summary: Get top terminology validation failures
      description: |
        Returns the most frequent validation failures aggregated by
        system + code. Useful for identifying systemic terminology gaps.
      tags:
        - Governance
      parameters:
        - $ref: '#/components/parameters/X-Tenant-Id'
        - $ref: '#/components/parameters/X-Correlation-Id'
        - name: limit
          in: query
          description: Max number of failures to return (default 20)
          schema:
            type: integer
            default: 20
        - name: from
          in: query
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: Top failures
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TopFailureListResponse'
  /v1/governance/stats:
    get:
      operationId: getGovernanceStats
      summary: Get governance statistics
      description: |
        Returns aggregate validation statistics including total validations,
        error rates, and per-service breakdowns for the specified time period.
      tags:
        - Governance
      parameters:
        - $ref: '#/components/parameters/X-Tenant-Id'
        - $ref: '#/components/parameters/X-Correlation-Id'
        - name: from
          in: query
          description: Start of reporting period (ISO 8601)
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          description: End of reporting period (ISO 8601)
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: Governance statistics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GovernanceStatsResponse'
