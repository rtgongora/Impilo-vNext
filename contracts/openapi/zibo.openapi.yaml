# =============================================================================
# ZIBO — Terminology Service API (OpenAPI 3.0)
# Manages FHIR-aligned code systems, value sets, concept maps, and provides
# real-time and async validation for clinical coding within Impilo.
# =============================================================================
openapi: "3.0.3"

info:
  title: ZIBO — Terminology Service
  version: "1.0.0"
  description: |
    ZIBO is the FHIR-aligned terminology service for Impilo. It manages code
    systems, value sets, and concept maps, and provides synchronous and
    asynchronous validation of clinical codes and resources.

    **Consistency classes**
    * Class A — destructive/high-trust mutations (require PDP decision header)
    * Class B — creation / registration mutations
    * Class C — reads and snapshots
  contact:
    name: Impilo Platform Team
  license:
    name: Proprietary

servers:
  - url: http://localhost:8085
    description: Local development
  - url: https://{tenant}.impilo.health/api
    description: Production (per-tenant)
    variables:
      tenant:
        default: demo

security:
  - bearerAuth: []

tags:
  - name: CodeSystems
    description: FHIR code system management
  - name: ValueSets
    description: FHIR value set management
  - name: ConceptMaps
    description: FHIR concept map management
  - name: Validation
    description: Clinical code and resource validation

# ============================================================================
# PATHS
# ============================================================================
paths:

  # ---- Code Systems --------------------------------------------------------

  /internal/v1/code-systems:
    post:
      operationId: createCodeSystem
      tags: [CodeSystems]
      summary: Create a code system (Class B)
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/ActorId"
        - $ref: "#/components/parameters/ActorType"
        - $ref: "#/components/parameters/PurposeOfUse"
        - $ref: "#/components/parameters/DeviceFingerprint"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCodeSystemRequest"
      responses:
        "201":
          description: Code system created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseCodeSystemResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"

  /internal/v1/code-systems/{id}/validate:
    get:
      operationId: validateCode
      tags: [CodeSystems]
      summary: Validate a code against a code system (Class C)
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/ActorId"
        - $ref: "#/components/parameters/ActorType"
        - $ref: "#/components/parameters/PurposeOfUse"
        - $ref: "#/components/parameters/DeviceFingerprint"
        - $ref: "#/components/parameters/CodeSystemId"
        - name: code
          in: query
          required: true
          schema:
            type: string
        - name: display
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Validation result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseCodeValidationResult"
        "404":
          $ref: "#/components/responses/NotFound"

  /internal/v1/code-systems/snapshot:
    get:
      operationId: codeSystemSnapshot
      tags: [CodeSystems]
      summary: Cursor-paginated code system snapshot (Class C)
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/CorrelationId"
        - name: cursor
          in: query
          schema:
            type: integer
            default: 0
        - name: limit
          in: query
          schema:
            type: integer
            default: 100
            maximum: 500
      responses:
        "200":
          description: Code system snapshot page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SnapshotResponse"

  # ---- Value Sets ----------------------------------------------------------

  /internal/v1/value-sets:
    post:
      operationId: createValueSet
      tags: [ValueSets]
      summary: Create a value set (Class B)
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/ActorId"
        - $ref: "#/components/parameters/ActorType"
        - $ref: "#/components/parameters/PurposeOfUse"
        - $ref: "#/components/parameters/DeviceFingerprint"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateValueSetRequest"
      responses:
        "201":
          description: Value set created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseValueSetResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"

  /internal/v1/value-sets/snapshot:
    get:
      operationId: valueSetSnapshot
      tags: [ValueSets]
      summary: Cursor-paginated value set snapshot (Class C)
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/CorrelationId"
        - name: cursor
          in: query
          schema:
            type: integer
            default: 0
        - name: limit
          in: query
          schema:
            type: integer
            default: 100
            maximum: 500
      responses:
        "200":
          description: Value set snapshot page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SnapshotResponse"

  # ---- Concept Maps --------------------------------------------------------

  /internal/v1/concept-maps:
    post:
      operationId: createConceptMap
      tags: [ConceptMaps]
      summary: Create a concept map (Class B)
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/ActorId"
        - $ref: "#/components/parameters/ActorType"
        - $ref: "#/components/parameters/PurposeOfUse"
        - $ref: "#/components/parameters/DeviceFingerprint"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateConceptMapRequest"
      responses:
        "201":
          description: Concept map created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseConceptMapResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"

  /internal/v1/concept-maps/{id}:
    get:
      operationId: getConceptMap
      tags: [ConceptMaps]
      summary: Get a concept map by ID (Class C)
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/ActorId"
        - $ref: "#/components/parameters/ActorType"
        - $ref: "#/components/parameters/PurposeOfUse"
        - $ref: "#/components/parameters/DeviceFingerprint"
        - $ref: "#/components/parameters/ConceptMapId"
      responses:
        "200":
          description: Concept map detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseConceptMapResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  /internal/v1/concept-maps/snapshot:
    get:
      operationId: conceptMapSnapshot
      tags: [ConceptMaps]
      summary: Cursor-paginated concept map snapshot (Class C)
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/CorrelationId"
        - name: cursor
          in: query
          schema:
            type: integer
            default: 0
        - name: limit
          in: query
          schema:
            type: integer
            default: 100
            maximum: 500
      responses:
        "200":
          description: Concept map snapshot page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SnapshotResponse"

  # ---- Validation ----------------------------------------------------------

  /v1/validate/coding:
    post:
      operationId: validateCoding
      tags: [Validation]
      summary: Validate a coding (system + code + display) (Class C)
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/ActorId"
        - $ref: "#/components/parameters/ActorType"
        - $ref: "#/components/parameters/PurposeOfUse"
        - $ref: "#/components/parameters/DeviceFingerprint"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ValidateCodingRequest"
      responses:
        "200":
          description: Coding validation result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseValidationResult"

  /v1/validate/resource:
    post:
      operationId: validateResource
      tags: [Validation]
      summary: Validate a FHIR resource JSON (Class C)
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/ActorId"
        - $ref: "#/components/parameters/ActorType"
        - $ref: "#/components/parameters/PurposeOfUse"
        - $ref: "#/components/parameters/DeviceFingerprint"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ValidateResourceRequest"
      responses:
        "200":
          description: Resource validation result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseValidationResult"

  /v1/validate/job:
    post:
      operationId: submitValidationJob
      tags: [Validation]
      summary: Submit an async validation job (Class C)
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/ActorId"
        - $ref: "#/components/parameters/ActorType"
        - $ref: "#/components/parameters/PurposeOfUse"
        - $ref: "#/components/parameters/DeviceFingerprint"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ValidationJobRequest"
      responses:
        "202":
          description: Validation job accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseValidationJob"

  /v1/validate/job/{jobId}:
    get:
      operationId: getValidationJobResult
      tags: [Validation]
      summary: Get async validation job result (Class C)
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/ActorId"
        - $ref: "#/components/parameters/ActorType"
        - $ref: "#/components/parameters/PurposeOfUse"
        - $ref: "#/components/parameters/DeviceFingerprint"
        - name: jobId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Validation job result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseValidationJob"
        "404":
          $ref: "#/components/responses/NotFound"

# ============================================================================
# COMPONENTS
# ============================================================================
components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Keycloak-issued access token (forwarded by Envoy)

  parameters:
    TenantId:
      name: X-Tenant-Id
      in: header
      required: true
      description: Tenant identifier — injected by Envoy after TSHEPO authorisation
      schema:
        type: string
    CorrelationId:
      name: X-Correlation-Id
      in: header
      required: true
      description: End-to-end correlation ID for distributed tracing
      schema:
        type: string
        format: uuid
    ActorId:
      name: X-Actor-Id
      in: header
      required: true
      description: Authenticated actor (user or service) identifier
      schema:
        type: string
    ActorType:
      name: X-Actor-Type
      in: header
      required: true
      description: Type of actor making the request
      schema:
        type: string
        enum: [CITIZEN, PROVIDER, ADMIN, SYSTEM, SERVICE]
    PurposeOfUse:
      name: X-Purpose-Of-Use
      in: header
      required: true
      description: Why this request is being made
      schema:
        type: string
    DeviceFingerprint:
      name: X-Device-Fingerprint
      in: header
      required: true
      description: Device identity hash
      schema:
        type: string
    FacilityId:
      name: X-Facility-Id
      in: header
      required: false
      description: Facility scope (contextual)
      schema:
        type: string
        format: uuid
    WorkspaceId:
      name: X-Workspace-Id
      in: header
      required: false
      description: Workspace scope (contextual)
      schema:
        type: string
        format: uuid
    ShiftId:
      name: X-Shift-Id
      in: header
      required: false
      description: Duty shift scope (contextual)
      schema:
        type: string
        format: uuid
    Decision:
      name: X-Decision
      in: header
      required: false
      description: PDP decision header — ALLOW, DENY, STEP_UP_REQUIRED (Class A endpoints require ALLOW)
      schema:
        type: string
        enum: [ALLOW, DENY, STEP_UP_REQUIRED]
    Obligations:
      name: X-Obligations
      in: header
      required: false
      description: JSON obligations blob from TSHEPO
      schema:
        type: string
    PageNumber:
      name: page
      in: query
      schema:
        type: integer
        default: 0
    PageSize:
      name: size
      in: query
      schema:
        type: integer
        default: 20
        maximum: 100
    CodeSystemId:
      name: id
      in: path
      required: true
      description: Code system identifier
      schema:
        type: integer
        format: int64
    ConceptMapId:
      name: id
      in: path
      required: true
      description: Concept map identifier
      schema:
        type: integer
        format: int64

  responses:
    BadRequest:
      description: Validation error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: Duplicate resource
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Missing or invalid trust headers
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: PDP denied the request (X-Decision=DENY)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:

    # ---- Requests ----------------------------------------------------------

    CreateCodeSystemRequest:
      type: object
      required: [canonicalUrl, version, name, title, contentJson]
      properties:
        canonicalUrl:
          type: string
        version:
          type: string
        name:
          type: string
        title:
          type: string
        description:
          type: string
        contentJson:
          type: string
        publisher:
          type: string

    CreateValueSetRequest:
      type: object
      required: [canonicalUrl, version, name, title]
      properties:
        canonicalUrl:
          type: string
        version:
          type: string
        name:
          type: string
        title:
          type: string
        description:
          type: string
        contentJson:
          type: string
        publisher:
          type: string

    CreateConceptMapRequest:
      type: object
      required: [canonicalUrl, version, name, title, sourceUri, targetUri]
      properties:
        canonicalUrl:
          type: string
        version:
          type: string
        name:
          type: string
        title:
          type: string
        description:
          type: string
        sourceUri:
          type: string
        targetUri:
          type: string
        contentJson:
          type: string
        publisher:
          type: string

    ValidateCodingRequest:
      type: object
      required: [system, code]
      properties:
        system:
          type: string
        code:
          type: string
        display:
          type: string
        mode:
          type: string
          enum: [STRICT, LENIENT]
        facilityId:
          type: string
          format: uuid

    ValidateResourceRequest:
      type: object
      required: [resourceJson]
      properties:
        resourceJson:
          type: string
        mode:
          type: string
          enum: [STRICT, LENIENT]
        facilityId:
          type: string
          format: uuid

    ValidationJobRequest:
      type: object
      required: [resourceJson]
      properties:
        resourceJson:
          type: string
        mode:
          type: string
          enum: [STRICT, LENIENT]
        facilityId:
          type: string
          format: uuid
        callbackUrl:
          type: string

    # ---- Response wrappers -------------------------------------------------

    ApiResponseCodeSystemResponse:
      type: object
      properties:
        success:
          type: boolean
        correlationId:
          type: string
          format: uuid
        data:
          $ref: "#/components/schemas/CodeSystemResponse"

    ApiResponseValueSetResponse:
      type: object
      properties:
        success:
          type: boolean
        correlationId:
          type: string
          format: uuid
        data:
          $ref: "#/components/schemas/ValueSetResponse"

    ApiResponseConceptMapResponse:
      type: object
      properties:
        success:
          type: boolean
        correlationId:
          type: string
          format: uuid
        data:
          $ref: "#/components/schemas/ConceptMapResponse"

    ApiResponseCodeValidationResult:
      type: object
      properties:
        success:
          type: boolean
        correlationId:
          type: string
          format: uuid
        data:
          $ref: "#/components/schemas/CodeValidationResult"

    ApiResponseValidationResult:
      type: object
      properties:
        success:
          type: boolean
        correlationId:
          type: string
          format: uuid
        data:
          $ref: "#/components/schemas/ValidationResult"

    ApiResponseValidationJob:
      type: object
      properties:
        success:
          type: boolean
        correlationId:
          type: string
          format: uuid
        data:
          $ref: "#/components/schemas/ValidationJob"

    # ---- Domain objects ----------------------------------------------------

    CodeSystemResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        canonicalUrl:
          type: string
        version:
          type: string
        name:
          type: string
        title:
          type: string
        description:
          type: string
        publisher:
          type: string
        status:
          type: string
          enum: [ACTIVE, RETIRED, DRAFT]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ValueSetResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        canonicalUrl:
          type: string
        version:
          type: string
        name:
          type: string
        title:
          type: string
        description:
          type: string
        publisher:
          type: string
        status:
          type: string
          enum: [ACTIVE, RETIRED, DRAFT]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ConceptMapResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        canonicalUrl:
          type: string
        version:
          type: string
        name:
          type: string
        title:
          type: string
        description:
          type: string
        sourceUri:
          type: string
        targetUri:
          type: string
        publisher:
          type: string
        status:
          type: string
          enum: [ACTIVE, RETIRED, DRAFT]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CodeValidationResult:
      type: object
      properties:
        valid:
          type: boolean
        code:
          type: string
        display:
          type: string
        system:
          type: string
        message:
          type: string

    ValidationResult:
      type: object
      properties:
        valid:
          type: boolean
        issues:
          type: array
          items:
            $ref: "#/components/schemas/ValidationIssue"
        checkedAt:
          type: string
          format: date-time

    ValidationIssue:
      type: object
      properties:
        severity:
          type: string
          enum: [ERROR, WARNING, INFORMATION]
        code:
          type: string
        location:
          type: string
        message:
          type: string

    ValidationJob:
      type: object
      properties:
        jobId:
          type: string
          format: uuid
        status:
          type: string
          enum: [PENDING, RUNNING, COMPLETED, FAILED]
        submittedAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
        result:
          $ref: "#/components/schemas/ValidationResult"

    SnapshotResponse:
      type: object
      properties:
        as_of:
          type: string
          format: date-time
        cursor:
          type: integer
        limit:
          type: integer
        has_more:
          type: boolean
        total:
          type: integer
        items:
          type: array
          items:
            type: object
            additionalProperties: true

    SnapshotEmitResponse:
      type: object
      properties:
        jobId:
          type: string
          format: uuid
        status:
          type: string
        triggeredAt:
          type: string
          format: date-time

    GenericResponse:
      type: object
      properties:
        message:
          type: string
        referenceId:
          type: string

    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          default: false
        correlationId:
          type: string
          format: uuid
        errorCode:
          type: string
        message:
          type: string
        details:
          type: array
          items:
            type: string
