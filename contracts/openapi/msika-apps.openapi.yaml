openapi: 3.0.3
info:
  title: Msika Apps — Capability Marketplace API
  version: 0.1.0
  description: |
    The Capability Marketplace ("Msika Apps") is the governed catalogue for
    apps, plugins, extensions, connectors, adapters, workflow packs, content
    packs, AI skills, and device integrations within the Impilo vNext Health OS.

    Distinct from `msika-service` (product/service registry) and
    `msika-flow-service` (commerce orchestration). See doctrine
    `docs/doctrine/HEALTH_OS_EXTENSIBILITY_DOCTRINE.md` §7.
  contact:
    name: Impilo Platform Team
    email: platform@impilo.gov.zw

servers:
  - url: http://localhost:8181
    description: Local dev (msika-apps-service)
  - url: https://api.impilo.gov.zw/msika-apps
    description: Production gateway

tags:
  - name: Marketplace Items
  - name: Publishers
  - name: Activation Requests
  - name: Installations
  - name: Marketplace Audit

paths:
  /internal/v1/marketplace/apps:
    get:
      tags:
        - Marketplace Items
      summary: List marketplace items
      parameters:
        - in: query
          name: type
          schema:
            $ref: '#/components/schemas/CapabilityType'
        - in: query
          name: category
          schema:
            type: string
        - in: query
          name: visibility
          schema:
            $ref: '#/components/schemas/MarketplaceVisibility'
        - in: query
          name: search
          schema:
            type: string
        - in: query
          name: facilityId
          schema:
            type: string
        - in: query
          name: rolesAvailable
          schema:
            type: array
            items:
              type: string
          style: form
          explode: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MarketplaceItem'
  /internal/v1/marketplace/apps/{itemId}:
    get:
      tags:
        - Marketplace Items
      summary: Get marketplace item detail
      parameters:
        - in: path
          name: itemId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarketplaceItem'
        '404':
          description: Not found
  /internal/v1/marketplace/publishers:
    get:
      tags:
        - Publishers
      summary: List publishers
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Publisher'
  /internal/v1/marketplace/activation-requests:
    get:
      tags:
        - Activation Requests
      summary: List activation requests
      parameters:
        - in: query
          name: status
          schema:
            type: string
        - in: query
          name: itemId
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ActivationRequest'
    post:
      tags:
        - Activation Requests
      summary: Create an activation request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActivationRequestCreate'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivationRequest'
  /internal/v1/marketplace/activation-requests/{requestId}/approve:
    post:
      tags:
        - Activation Requests
      summary: Approve an activation request (creates an installation)
      parameters:
        - in: path
          name: requestId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApprovalDecision'
      responses:
        '200':
          description: Approved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Installation'
  /internal/v1/marketplace/activation-requests/{requestId}/reject:
    post:
      tags:
        - Activation Requests
      summary: Reject an activation request
      parameters:
        - in: path
          name: requestId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RejectionDecision'
      responses:
        '200':
          description: Rejected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivationRequest'
  /internal/v1/marketplace/installations:
    get:
      tags:
        - Installations
      summary: List installations
      parameters:
        - in: query
          name: tenantId
          schema:
            type: string
        - in: query
          name: facilityId
          schema:
            type: string
        - in: query
          name: itemId
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Installation'
  /internal/v1/marketplace/installations/{installationId}:
    get:
      tags:
        - Installations
      summary: Get installation detail
      parameters:
        - in: path
          name: installationId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Installation'
  /internal/v1/marketplace/installations/{installationId}/configure:
    post:
      tags:
        - Installations
      summary: Update installation configuration
      parameters:
        - in: path
          name: installationId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                configuration:
                  type: object
                  additionalProperties: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Installation'
  /internal/v1/marketplace/installations/{installationId}/suspend:
    post:
      tags:
        - Installations
      summary: Suspend an installation
      parameters:
        - in: path
          name: installationId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - reason
              properties:
                reason:
                  type: string
      responses:
        '200':
          description: Suspended
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Installation'
  /internal/v1/marketplace/installations/{installationId}/reinstate:
    post:
      tags:
        - Installations
      summary: Reinstate a suspended installation
      parameters:
        - in: path
          name: installationId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Reinstated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Installation'
  /internal/v1/marketplace/audit-events:
    get:
      tags:
        - Marketplace Audit
      summary: List marketplace audit events
      parameters:
        - in: query
          name: itemId
          schema:
            type: string
        - in: query
          name: installationId
          schema:
            type: string
        - in: query
          name: limit
          schema:
            type: integer
            default: 50
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MarketplaceAuditEvent'
  /:
    get:
      operationId: msikaapps_get__
      tags:
        - Generated-From-Handler
      summary: Documented from msika-apps-service handler (complete-not-delete sync)
      responses:
        '200':
          description: Success
    post:
      operationId: msikaapps_post__
      tags:
        - Generated-From-Handler
      summary: Documented from msika-apps-service handler (complete-not-delete sync)
      responses:
        '200':
          description: Success
  /{id}:
    get:
      operationId: msikaapps_get__id_
      tags:
        - Generated-From-Handler
      summary: Documented from msika-apps-service handler (complete-not-delete sync)
      responses:
        '200':
          description: Success
  /{id}/decision:
    post:
      operationId: msikaapps_post__id_decision
      tags:
        - Generated-From-Handler
      summary: Documented from msika-apps-service handler (complete-not-delete sync)
      responses:
        '200':
          description: Success
  /{id}/configure:
    post:
      operationId: msikaapps_post__id_configure
      tags:
        - Generated-From-Handler
      summary: Documented from msika-apps-service handler (complete-not-delete sync)
      responses:
        '200':
          description: Success
  /{id}/activate:
    post:
      operationId: msikaapps_post__id_activate
      tags:
        - Generated-From-Handler
      summary: Documented from msika-apps-service handler (complete-not-delete sync)
      responses:
        '200':
          description: Success
  /{id}/suspend:
    post:
      operationId: msikaapps_post__id_suspend
      tags:
        - Generated-From-Handler
      summary: Documented from msika-apps-service handler (complete-not-delete sync)
      responses:
        '200':
          description: Success
  /{id}/reinstate:
    post:
      operationId: msikaapps_post__id_reinstate
      tags:
        - Generated-From-Handler
      summary: Documented from msika-apps-service handler (complete-not-delete sync)
      responses:
        '200':
          description: Success
  /installations/{installationId}:
    get:
      operationId: msikaapps_get__installations_installationId_
      tags:
        - Generated-From-Handler
      summary: Documented from msika-apps-service handler (complete-not-delete sync)
      responses:
        '200':
          description: Success
  /installations/{installationId}/configure:
    post:
      operationId: msikaapps_post__installations_installationId_configure
      tags:
        - Generated-From-Handler
      summary: Documented from msika-apps-service handler (complete-not-delete sync)
      responses:
        '200':
          description: Success
  /installations/{installationId}/suspend:
    post:
      operationId: msikaapps_post__installations_installationId_suspend
      tags:
        - Generated-From-Handler
      summary: Documented from msika-apps-service handler (complete-not-delete sync)
      responses:
        '200':
          description: Success
  /installations/{installationId}/reinstate:
    post:
      operationId: msikaapps_post__installations_installationId_reinstate
      tags:
        - Generated-From-Handler
      summary: Documented from msika-apps-service handler (complete-not-delete sync)
      responses:
        '200':
          description: Success
  /{itemId}:
    get:
      operationId: msikaapps_get__itemId_
      tags:
        - Generated-From-Handler
      summary: Documented from msika-apps-service handler (complete-not-delete sync)
