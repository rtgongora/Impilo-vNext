openapi: 3.0.3
info:
  title: Card Print Agent API
  description: |
    Job-based printing for provider/client smart cards, share slips, and emergency capsule PDFs.
  version: 0.1.0

servers:
  - url: http://localhost:8291
    description: Local development

security:
  - bearerAuth: []

paths:
  /v1/internal/print-jobs:
    post:
      operationId: createPrintJob
      summary: Create a print job
      tags: [Print Jobs]
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePrintJobRequest'
      responses:
        '201':
          description: Print job created
    get:
      operationId: searchPrintJobs
      summary: Search print jobs
      tags: [Print Jobs]
      parameters:
        - name: status
          in: query
          schema:
            type: string
        - name: subjectType
          in: query
          schema:
            type: string
        - name: subjectId
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Print job results

  /v1/internal/print-jobs/{jobId}:
    get:
      operationId: getPrintJob
      summary: Get print job details
      tags: [Print Jobs]
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Print job details

  /v1/internal/print-jobs/{jobId}/status:
    post:
      operationId: updateJobStatus
      summary: Update print job status
      tags: [Print Jobs]
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateJobStatusRequest'
      responses:
        '200':
          description: Status updated

  /v1/internal/print-jobs/{jobId}/cancel:
    post:
      operationId: cancelPrintJob
      summary: Cancel a print job
      tags: [Print Jobs]
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Print job cancelled

  /v1/internal/print-jobs/{jobId}/pdf:
    get:
      operationId: downloadRenderedPdf
      summary: Download rendered PDF
      tags: [Print Jobs]
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Rendered PDF binary
          content:
            application/pdf:
              schema:
                type: string
                format: binary

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    CreatePrintJobRequest:
      type: object
      required: [jobType, subjectType, subjectId, templateName, payload]
      properties:
        jobType:
          type: string
          enum: [PROVIDER_CARD, CLIENT_CARD, FACILITY_BADGE, SHARE_SLIP, EMERGENCY_CAPSULE]
        subjectType:
          type: string
        subjectId:
          type: string
        subjectName:
          type: string
        templateName:
          type: string
        payload:
          type: object
        priority:
          type: integer
          default: 5

    PrintJobResponse:
      type: object
      properties:
        jobId:
          type: string
          format: uuid
        jobType:
          type: string
        subjectType:
          type: string
        subjectId:
          type: string
        subjectName:
          type: string
        status:
          type: string
          enum: [QUEUED, RENDERING, RENDERED, PRINTING, PRINTED, COLLECTED, FAILED, CANCELLED]
        templateName:
          type: string
        renderedPdfDocumentId:
          type: string
          format: uuid
        priority:
          type: integer
        requestedBy:
          type: string
        printedAt:
          type: string
          format: date-time
        collectedAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time

    UpdateJobStatusRequest:
      type: object
      required: [status]
      properties:
        status:
          type: string
        failureReason:
          type: string
        collectedBy:
          type: string
