# =============================================================================
# Rules — governed rule registry & evaluation API (OpenAPI 3.0)
# Phase B baseline: `RuleController` internal routes.
# =============================================================================
openapi: "3.0.3"

info:
  title: Rules Service API
  version: "1.0.0"
  description: |
    Business rule definitions, versioning, activation, and evaluation. BFF uses
    `ExtensionServiceClient` against `rules-base-url`. Federation-gated writes
    require national pod context where enforced in code.
  contact:
    name: Impilo Platform Team
  license:
    name: Proprietary

servers:
  - url: http://localhost:8241
    description: Local development
  - url: https://{tenant}.impilo.health/api
    description: Production (per-tenant)
    variables:
      tenant:
        default: demo

security:
  - bearerAuth: []

tags:
  - name: Internal-Rules
    description: Rule CRUD, versions, activation, evaluate

paths:
  /internal/v1/rules:
    get:
      operationId: rulesList
      tags:
        - Internal-Rules
      summary: List rules for tenant
      responses:
        '200':
          description: Rule list
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  additionalProperties: true
    post:
      operationId: rulesCreate
      tags:
        - Internal-Rules
      summary: Create rule
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /internal/v1/rules/{key}/versions:
    post:
      operationId: rulesCreateVersion
      tags:
        - Internal-Rules
      summary: Create new version for rule key
      parameters:
        - name: key
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '201':
          description: Version created
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /internal/v1/rules/{key}/activate:
    post:
      operationId: rulesActivate
      tags:
        - Internal-Rules
      summary: Activate a specific version
      parameters:
        - name: key
          in: path
          required: true
          schema:
            type: string
        - name: version
          in: query
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Activated
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /internal/v1/rules/{key}/deactivate:
    post:
      operationId: rulesDeactivate
      tags:
        - Internal-Rules
      summary: Deactivate rule key
      parameters:
        - name: key
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Deactivated rule
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /internal/v1/rules/{key}/evaluate:
    post:
      operationId: rulesEvaluate
      tags:
        - Internal-Rules
      summary: Evaluate rule against payload
      parameters:
        - name: key
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: Evaluation result
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /{key}/versions:
    post:
      operationId: rules_post__key_versions
      tags:
        - Generated-From-Handler
      summary: Documented from rules-service handler (complete-not-delete sync)
      responses:
        '200':
          description: Success
  /{key}/activate:
    post:
      operationId: rules_post__key_activate
      tags:
        - Generated-From-Handler
      summary: Documented from rules-service handler (complete-not-delete sync)
      responses:
        '200':
          description: Success
  /{key}/deactivate:
    post:
      operationId: rules_post__key_deactivate
      tags:
        - Generated-From-Handler
      summary: Documented from rules-service handler (complete-not-delete sync)
      responses:
        '200':
          description: Success
  /{key}/evaluate:
    post:
      operationId: rules_post__key_evaluate
      tags:
        - Generated-From-Handler
      summary: Documented from rules-service handler (complete-not-delete sync)
      responses:
        '200':
          description: Success

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
