openapi: 3.0.3
info:
  title: "Data Pipeline"
  description: |
    Phase F baseline contract for `data-pipeline-service`. Extend with real paths and schemas as the HTTP surface is stabilised.
  version: 0.1.0
servers:
  - url: http://localhost:8215
    description: Local default (`default_http_port` in docs/registry/services-registry.yaml)

paths:
  /internal/v1/health:
    get:
      operationId: internalHealth
      summary: Internal health probe
      tags:
        - Health
      responses:
        '200':
          description: Service reachable
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /ingest:
    post:
      operationId: datapipeline_post__ingest
      tags:
        - Generated-From-Handler
      summary: Documented from data-pipeline-service handler (complete-not-delete sync)
      responses:
        '200':
          description: Success
  /sources:
    post:
      operationId: datapipeline_post__sources
      tags:
        - Generated-From-Handler
      summary: Documented from data-pipeline-service handler (complete-not-delete sync)
      responses:
        '200':
          description: Success
    get:
      operationId: datapipeline_get__sources
      tags:
        - Generated-From-Handler
      summary: Documented from data-pipeline-service handler (complete-not-delete sync)
      responses:
        '200':
          description: Success
  /watermarks:
    get:
      operationId: datapipeline_get__watermarks
      tags:
        - Generated-From-Handler
      summary: Documented from data-pipeline-service handler (complete-not-delete sync)
      responses:
        '200':
          description: Success

components:
  schemas: {}
