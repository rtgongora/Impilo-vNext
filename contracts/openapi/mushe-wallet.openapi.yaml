          description: Success

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    TenantId:
      name: X-Tenant-ID
      in: header
      required: true
      schema:
        type: string
    PodId:
      name: X-Pod-ID
      in: header
      required: true
      schema:
        type: string
    RequestId:
      name: X-Request-ID
      in: header
      required: true
      schema:
        type: string
        format: uuid
    CorrelationId:
      name: X-Correlation-ID
      in: header
      required: true
      schema:
        type: string
        format: uuid

  schemas:
    ApiResponse:
      type: object
      properties:
        data:
          type: object
          additionalProperties: true
        meta:
          type: object
          properties:
            correlation_id:
              type: string
            request_id:
              type: string

    ProbeHealthBody:
      type: object
      properties:
        service:
          type: string
          example: mushe-wallet
        status:
          type: string
          example: UP
      additionalProperties: true

    CreateWalletRequest:
      type: object
      required: [ownerType, ownerRef]
      properties:
        ownerType:
          type: string
          enum: [INDIVIDUAL, MERCHANT, INSTITUTIONAL]
        ownerRef:
          type: string
          description: CPID for individuals, Provider Number for merchants
        displayName:
          type: string
        currency:
          type: string
          default: ZWL

    CreditWalletRequest:
      type: object
      required: [amount, txnType]
      properties:
        amount:
          type: number
        txnType:
          type: string
        channel:
          type: string
          enum: [APP, USSD, CARD, POS, BANK_TRANSFER, MOBILE_MONEY, CASH_DEPOSIT]
        reference:
          type: string
        description:
          type: string

    DebitWalletRequest:
      type: object
      required: [amount, txnType]
      properties:
        amount:
          type: number
        txnType:
          type: string
        channel:
          type: string
        reference:
          type: string
        description:
          type: string

    TransferRequest:
      type: object
      required: [fromWalletId, toWalletId, amount]
      properties:
        fromWalletId:
          type: string
          format: uuid
        toWalletId:
          type: string
          format: uuid
        amount:
          type: number
        reference:
          type: string
        description:
          type: string
        channel:
          type: string

    RegisterMerchantRequest:
      type: object
      required: [providerNumber, merchantName]
      properties:
        providerNumber:
          type: string
          description: Provider Number becomes the Merchant ID
        facilityId:
          type: string
          format: uuid
        merchantName:
          type: string
        merchantType:
          type: string
          enum: [HEALTH_PROVIDER, PHARMACY, LAB, IMAGING]
        settlementAccount:
          type: string
        settlementBank:
          type: string

    PayMerchantRequest:
      type: object
      required: [fromWalletId, merchantProviderNumber, amount]
      properties:
        fromWalletId:
          type: string
          format: uuid
        merchantProviderNumber:
          type: string
        amount:
          type: number
        reference:
          type: string
        channel:
          type: string

    PlaceHoldRequest:
      type: object
      required: [walletId, amount]
      properties:
        walletId:
          type: string
          format: uuid
        amount:
          type: number
        reason:
          type: string
        reference:
          type: string
        expiresAt:
          type: string
          format: date-time

    AddFundingSourceRequest:
      type: object
      required: [sourceType, provider]
      properties:
        sourceType:
          type: string
          enum: [BANK_ACCOUNT, MOBILE_MONEY, REMITTANCE]
        provider:
          type: string
          description: "EcoCash, InnBucks, OneMoney, CBZ, Stanbic, etc."
        accountRef:
          type: string
        accountName:
          type: string

    DepositRequest:
      type: object
      required: [sourceId, amount]
      properties:
        sourceId:
          type: string
          format: uuid
        amount:
          type: number
        reference:
          type: string

    CashDepositRequest:
      type: object
      required: [cashierId, facilityId, amount]
      properties:
        cashierId:
          type: string
        facilityId:
          type: string
          format: uuid
        amount:
          type: number
        reference:
          type: string
