openapi: 3.0.3
info:
  title: Credential Verification Service API
  description: |
    Issues digitally signed certificates/licenses with QR codes.
    Provides public verification endpoints.
  version: 0.1.0

servers:
  - url: http://localhost:8094
    description: Local development

security:
  - bearerAuth: []

paths:
  /v1/internal/credentials:
    post:
      operationId: issueCredential
      summary: Issue a signed credential
      tags:
        - Credentials
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IssueCredentialRequest'
      responses:
        '201':
          description: Credential issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseCredentialResponse'
    get:
      operationId: searchCredentials
      summary: Search credentials
      tags:
        - Credentials
      parameters:
        - name: subjectType
          in: query
          schema:
            type: string
        - name: subjectId
          in: query
          schema:
            type: string
        - name: credentialType
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Search results
  /v1/internal/credentials/{credentialId}:
    get:
      operationId: getCredential
      summary: Get credential details
      tags:
        - Credentials
      parameters:
        - name: credentialId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Credential details
  /v1/internal/credentials/{credentialId}/revoke:
    post:
      operationId: revokeCredential
      summary: Revoke a credential
      tags:
        - Credentials
      parameters:
        - name: credentialId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
      responses:
        '200':
          description: Credential revoked
  /v1/internal/credentials/{credentialId}/pdf:
    get:
      operationId: getCredentialPdf
      summary: Generate and download certificate PDF
      tags:
        - Credentials
      parameters:
        - name: credentialId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: PDF binary
          content:
            application/pdf:
              schema:
                type: string
                format: binary
  /v1/public/verify/{token}:
    get:
      operationId: verifyCredential
      summary: Public credential verification (rate-limited)
      tags:
        - Public Verification
      security: []
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Verification result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerificationResult'
        '429':
          description: Rate limit exceeded
  /:
    post:
      operationId: credentialverification_post__
      tags:
        - Generated-From-Handler
      summary: Documented from credential-verification-service handler (complete-not-delete sync)
      responses:
        '200':
          description: Success
    get:
      operationId: credentialverification_get__
      tags:
        - Generated-From-Handler
      summary: Documented from credential-verification-service handler (complete-not-delete sync)
      responses:
        '200':
          description: Success
  /{credentialId}:
    get:
      operationId: credentialverification_get__credentialId_
      tags:
        - Generated-From-Handler
      summary: Documented from credential-verification-service handler (complete-not-delete sync)
      responses:
        '200':
          description: Success
  /{credentialId}/revoke:
    post:
      operationId: credentialverification_post__credentialId_revoke
      tags:
        - Generated-From-Handler
      summary: Documented from credential-verification-service handler (complete-not-delete sync)
      responses:
        '200':
          description: Success
  /{credentialId}/supersede:
    post:
      operationId: credentialverification_post__credentialId_supersede
      tags:
        - Generated-From-Handler
      summary: Documented from credential-verification-service handler (complete-not-delete sync)
      responses:
        '200':
          description: Success
  /{credentialId}/pdf:
    get:
      operationId: credentialverification_get__credentialId_pdf
      tags:
        - Generated-From-Handler
      summary: Documented from credential-verification-service handler (complete-not-delete sync)
      responses:
        '200':
          description: Success
  /{facilityId}/credential-active:
    get:
      operationId: credentialverification_get__facilityId_credential_active
      tags:
        - Generated-From-Handler
      summary: Documented from credential-verification-service handler (complete-not-delete sync)
      responses:
        '200':
          description: Success
  /v1/credentials/verify:
    post:
      operationId: credentialverification_post__v1_credentials_verify
      tags:
        - Generated-From-Handler
      summary: Documented from credential-verification-service handler (complete-not-delete sync)
      responses:
        '200':
          description: Success
  /{token}:
    get:
      operationId: credentialverification_get__token_
      tags:
        - Generated-From-Handler
      summary: Documented from credential-verification-service handler (complete-not-delete sync)
      responses:
        '200':
          description: Success
  /health:
    get:
      operationId: credentialverification_get__health
      tags:
        - Generated-From-Handler
      summary: Documented from credential-verification-service handler (complete-not-delete sync)
      responses:
        '200':
          description: Success
  /test-command:
    post:
      operationId: credentialverification_post__test_command
      tags:
        - Generated-From-Handler
      summary: Documented from credential-verification-service handler (complete-not-delete sync)
      responses:
        '200':
          description: Success

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    IssueCredentialRequest:
      type: object
      required: [subjectType, subjectId, subjectName, credentialType, title, issuedBy, validFrom]
      properties:
        subjectType:
          type: string
          enum: [PROVIDER, CLIENT, FACILITY]
        subjectId:
          type: string
        subjectName:
          type: string
        credentialType:
          type: string
          enum: [LICENSE, CERTIFICATE, REGISTRATION, BADGE]
        title:
          type: string
        issuedBy:
          type: string
        validFrom:
          type: string
          format: date
        validTo:
          type: string
          format: date
        metadata:
          type: object

    CredentialResponse:
      type: object
      properties:
        credentialId:
          type: string
          format: uuid
        subjectType:
          type: string
        subjectId:
          type: string
        subjectName:
          type: string
        credentialType:
          type: string
        title:
          type: string
        issuedBy:
          type: string
        issuedAt:
          type: string
          format: date-time
        validFrom:
          type: string
          format: date
        validTo:
          type: string
          format: date
        status:
          type: string
        verificationUrl:
          type: string
        pdfDocumentId:
          type: string
          format: uuid
        metadata:
          type: object

    VerificationResult:
      type: object
      properties:
        status:
          type: string
          enum: [VALID, EXPIRED, REVOKED, NOT_FOUND]
        credentialType:
          type: string
        subjectName:
          type: string
        title:
          type: string
        issuedBy:
          type: string
        validFrom:
          type: string
          format: date
        validTo:
          type: string
          format: date
        verifiedAt:
          type: string
          format: date-time

    ApiResponseCredentialResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          $ref: '#/components/schemas/CredentialResponse'
        correlationId:
          type: string
        timestamp:
          type: string
          format: date-time
