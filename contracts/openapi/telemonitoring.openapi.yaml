openapi: 3.0.3
info:
  title: Impilo Telemonitoring Service API
  version: 1.0.0
  description: |
    Contract for monitoring programmes, patient monitoring plans, device
    assignments, readings, and alert-episode escalation. Device connectivity
    remains owned by iot-ingestion-service and clinical task execution remains
    owned by pct-service.
servers:
  - url: http://localhost:8394
    description: Local service
security:
  - bearerAuth: []
tags:
  - name: Generated-From-Handler
    description: Operations synchronized from Spring MVC handlers.
