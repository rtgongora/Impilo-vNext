# =============================================================================
# Product Registry — National product / SKU register (OpenAPI 3.0)
# Phase B baseline: internal CRUD, search, snapshot, v1.1 probes.
# =============================================================================
openapi: "3.0.3"

info:
  title: Product Registry Service API
  version: "1.0.0"
  description: |
    Internal product master used by costing, pharmacy, and supply workflows.
  contact:
    name: Impilo Platform Team
  license:
    name: Proprietary

servers:
  - url: http://localhost:8097
    description: Local development
  - url: https://{tenant}.impilo.health/api
    description: Production (per-tenant)
    variables:
      tenant:
        default: demo

security:
  - bearerAuth: []

tags:
  - name: Internal-Probe
    description: Companion v1.1 proofs
  - name: Internal-Product
    description: Product CRUD and search

paths:
  /internal/v1/health:
    get:
      operationId: productRegistryInternalHealth
      tags: [Internal-Probe]
      summary: v1.1 health probe
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/PodId"
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "200":
          description: UP
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true

  /internal/v1/test-command:
    post:
      operationId: productRegistryInternalTestCommand
      tags: [Internal-Probe]
      summary: v1.1 echo probe
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/PodId"
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "201":
          description: Echo
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true

  /internal/v1/products:
    get:
      operationId: productRegistryListProducts
      tags: [Internal-Product]
      summary: List products
      responses:
        "200":
          description: Product list
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  additionalProperties: true
    post:
      operationId: productRegistryCreateProduct
      tags: [Internal-Product]
      summary: Create product
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true

  /internal/v1/products/{id}:
    get:
      operationId: productRegistryGetProduct
      tags: [Internal-Product]
      summary: Get product by id
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Product
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true

  /internal/v1/products/search:
    get:
      operationId: productRegistrySearchProducts
      tags: [Internal-Product]
      summary: Search products
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Matches
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  additionalProperties: true

  /internal/v1/products/snapshot:
    get:
      operationId: productRegistrySnapshotActive
      tags: [Internal-Product]
      summary: All active products for bootstrap
      responses:
        "200":
          description: Active products
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  additionalProperties: true

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    TenantId:
      name: X-Tenant-ID
      in: header
      required: true
      schema:
        type: string
    PodId:
      name: X-Pod-ID
      in: header
      required: true
      schema:
        type: string
    RequestId:
      name: X-Request-ID
      in: header
      required: true
      schema:
        type: string
        format: uuid
    CorrelationId:
      name: X-Correlation-ID
      in: header
      required: true
      schema:
        type: string
        format: uuid
