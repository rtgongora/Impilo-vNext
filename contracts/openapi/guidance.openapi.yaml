# =============================================================================
# Guidance — Experience guidance & education API (OpenAPI 3.0)
# Phase B baseline: internal routes consumed by Experience BFF.
# =============================================================================
openapi: "3.0.3"

info:
  title: Guidance Service API
  version: "1.0.0"
  description: |
    Health OS §13 guidance: ask, reminders, and education articles. BFF-only
    internal surface (`GuidanceServiceClient`).
  contact:
    name: Impilo Platform Team
  license:
    name: Proprietary

servers:
  - url: http://localhost:8260
    description: Local development
  - url: https://{tenant}.impilo.health/api
    description: Production (per-tenant)
    variables:
      tenant:
        default: demo

security:
  - bearerAuth: []

tags:
  - name: Internal-Guidance
    description: Ask, reminders, education

paths:
  /internal/v1/guidance/ask:
    post:
      operationId: guidanceAsk
      tags: [Internal-Guidance]
      summary: Ask a guidance question
      parameters:
        - $ref: "#/components/parameters/TenantIdLower"
        - $ref: "#/components/parameters/ActorIdLower"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                question:
                  type: string
                personalized:
                  type: boolean
      responses:
        "200":
          description: Wrapped guidance payload (`data`)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    additionalProperties: true

  /internal/v1/guidance/reminders:
    get:
      operationId: guidanceListReminders
      tags: [Internal-Guidance]
      summary: List reminders for actor
      parameters:
        - $ref: "#/components/parameters/TenantIdLower"
        - $ref: "#/components/parameters/ActorIdLower"
      responses:
        "200":
          description: Reminder list under `data`
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true

  /internal/v1/guidance/education:
    get:
      operationId: guidanceEducationArticles
      tags: [Internal-Guidance]
      summary: Paged education articles
      parameters:
        - $ref: "#/components/parameters/TenantIdLower"
        - name: domain
          in: query
          schema:
            type: string
            default: all
        - name: page
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            minimum: 1
            default: 20
      responses:
        "200":
          description: Article page under `data`
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    TenantIdLower:
      name: x-tenant-id
      in: header
      required: true
      description: Service reads lowercase header (HTTP names are case-insensitive)
      schema:
        type: string
    ActorIdLower:
      name: x-actor-id
      in: header
      required: true
      schema:
        type: string
