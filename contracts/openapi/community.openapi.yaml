# =============================================================================
# Community Service — Community health, CHW assignments, outreach (OpenAPI 3.0)
#
# PCT-aligned care setting for field-based encounters. Local default port 8122.
# =============================================================================
openapi: "3.0.3"

info:
  title: Community Service API
  version: "1.0.0"
  description: |
    Community health workflows — community health units, CHW assignments,
    and outreach visits. Internal APIs are intended for the Experience BFF
    and platform automation. Companion v1.1 headers apply to authenticated routes.
  contact:
    name: Impilo Platform Team
  license:
    name: Proprietary

servers:
  - url: http://localhost:8122
    description: Local development

security:
  - bearerAuth: []

tags:
  - name: Internal-Probe
    description: Health and test-command probes
  - name: Community-Units
    description: Community health units
  - name: Community-Visits
    description: Outreach and home visits
  - name: Community-Assignments
    description: CHW and worker assignments

paths:
  /internal/v1/health:
    get:
      operationId: communityInternalHealth
      tags: [Internal-Probe]
      summary: Service health (optionally echoes v1.1 context when headers present)
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProbeHealthBody"

  /internal/v1/test-command:
    post:
      operationId: communityInternalTestCommand
      tags: [Internal-Probe]
      summary: Idempotency / companion probe
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "201":
          description: Accepted echo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProbeCommandBody"

  /internal/v1/community/units:
    get:
      operationId: communityListUnits
      tags: [Community-Units]
      summary: List community units
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/PodId"
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/CorrelationId"
        - name: tenantId
          in: query
          required: false
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Units
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CommunityUnit"
    post:
      operationId: communityCreateUnit
      tags: [Community-Units]
      summary: Create a community unit
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/PodId"
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCommunityUnitRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommunityUnit"

  /internal/v1/community/units/{id}:
    get:
      operationId: communityGetUnit
      tags: [Community-Units]
      summary: Get unit by public unit UUID
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/PodId"
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/CorrelationId"
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Unit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommunityUnit"

  /internal/v1/community/visits:
    get:
      operationId: communityListVisits
      tags: [Community-Visits]
      summary: List outreach visits
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/PodId"
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/CorrelationId"
        - name: tenantId
          in: query
          schema:
            type: string
            format: uuid
        - name: unitId
          in: query
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Visits
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OutreachVisit"
    post:
      operationId: communityCreateVisit
      tags: [Community-Visits]
      summary: Schedule an outreach visit
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/PodId"
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOutreachVisitRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OutreachVisit"

  /internal/v1/community/visits/{id}/start:
    put:
      operationId: communityStartVisit
      tags: [Community-Visits]
      summary: Mark visit started (writes outbox event)
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/PodId"
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/CorrelationId"
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Updated visit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OutreachVisit"

  /internal/v1/community/visits/{id}/complete:
    put:
      operationId: communityCompleteVisit
      tags: [Community-Visits]
      summary: Mark visit completed (writes outbox event)
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/PodId"
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/CorrelationId"
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompleteVisitRequest"
      responses:
        "200":
          description: Updated visit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OutreachVisit"

  /internal/v1/community/assignments:
    get:
      operationId: communityListAssignments
      tags: [Community-Assignments]
      summary: List CHW assignments
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/PodId"
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/CorrelationId"
        - name: tenantId
          in: query
          schema:
            type: string
            format: uuid
        - name: unitId
          in: query
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Assignments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ChwAssignment"
    post:
      operationId: communityCreateAssignment
      tags: [Community-Assignments]
      summary: Assign a CHW to a unit
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/PodId"
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateChwAssignmentRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChwAssignment"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    TenantId:
      name: X-Tenant-ID
      in: header
      required: true
      schema:
        type: string
    PodId:
      name: X-Pod-ID
      in: header
      required: true
      schema:
        type: string
    RequestId:
      name: X-Request-ID
      in: header
      required: true
      schema:
        type: string
        format: uuid
    CorrelationId:
      name: X-Correlation-ID
      in: header
      required: true
      schema:
        type: string
        format: uuid

  schemas:
    ProbeHealthBody:
      type: object
      properties:
        service:
          type: string
        status:
          type: string
        tenant_id:
          type: string
        pod_id:
          type: string
        request_id:
          type: string
        correlation_id:
          type: string
      additionalProperties: true

    ProbeCommandBody:
      type: object
      properties:
        service:
          type: string
        action:
          type: string
        request_id:
          type: string
        correlation_id:
          type: string
        echo:
          type: object
          additionalProperties: true
      additionalProperties: true

    CreateCommunityUnitRequest:
      type: object
      required: [tenantId, name, unitType]
      properties:
        tenantId:
          type: string
          format: uuid
        name:
          type: string
        unitType:
          type: string
        facilityId:
          type: string
          format: uuid
        province:
          type: string
        district:
          type: string
        ward:
          type: string
        catchmentPopulation:
          type: integer

    CommunityUnit:
      type: object
      properties:
        id:
          type: integer
          format: int64
        unitId:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        name:
          type: string
        unitType:
          type: string
        facilityId:
          type: string
          format: uuid
        province:
          type: string
        district:
          type: string
        ward:
          type: string
        catchmentPopulation:
          type: integer
        status:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateOutreachVisitRequest:
      type: object
      required: [tenantId, unitId, patientCpid, providerId, visitType]
      properties:
        tenantId:
          type: string
          format: uuid
        unitId:
          type: string
          format: uuid
        patientCpid:
          type: string
        providerId:
          type: string
        journeyId:
          type: string
          format: uuid
        encounterId:
          type: string
          format: uuid
        visitType:
          type: string
        locationLat:
          type: number
        locationLon:
          type: number
        scheduledAt:
          type: string
          format: date-time

    OutreachVisit:
      type: object
      properties:
        id:
          type: integer
          format: int64
        visitId:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        unitId:
          type: string
          format: uuid
        patientCpid:
          type: string
        providerId:
          type: string
        journeyId:
          type: string
          format: uuid
        encounterId:
          type: string
          format: uuid
        visitType:
          type: string
        locationLat:
          type: number
        locationLon:
          type: number
        status:
          type: string
        scheduledAt:
          type: string
          format: date-time
        startedAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
        notes:
          type: string
        createdAt:
          type: string
          format: date-time

    CompleteVisitRequest:
      type: object
      properties:
        notes:
          type: string

    CreateChwAssignmentRequest:
      type: object
      required: [tenantId, unitId, providerId]
      properties:
        tenantId:
          type: string
          format: uuid
        unitId:
          type: string
          format: uuid
        providerId:
          type: string
        role:
          type: string

    ChwAssignment:
      type: object
      properties:
        id:
          type: integer
          format: int64
        assignmentId:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        unitId:
          type: string
          format: uuid
        providerId:
          type: string
        role:
          type: string
        status:
          type: string
        assignedAt:
          type: string
          format: date-time
