openapi: 3.0.3
info:
  title: "Observability"
  description: |
    Phase F baseline contract for `observability-service`. Extend with real paths and schemas as the HTTP surface is stabilised.
  version: 0.1.0
servers:
  - url: http://localhost:8211
    description: Local default (`default_http_port` in docs/registry/services-registry.yaml)

paths:
  /internal/v1/health:
    get:
      operationId: internalHealth
      summary: Internal health probe
      tags:
        - Health
      responses:
        '200':
          description: Service reachable
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /:
    post:
      operationId: observability_post__
      tags:
        - Generated-From-Handler
      summary: Documented from observability-service handler (complete-not-delete sync)
      responses:
        '200':
          description: Success
    get:
      operationId: observability_get__
      tags:
        - Generated-From-Handler
      summary: Documented from observability-service handler (complete-not-delete sync)
      responses:
        '200':
          description: Success
  /health/summary:
    get:
      operationId: observability_get__health_summary
      tags:
        - Generated-From-Handler
      summary: Documented from observability-service handler (complete-not-delete sync)
      responses:
        '200':
          description: Success
  /metrics/lag:
    get:
      operationId: observability_get__metrics_lag
      tags:
        - Generated-From-Handler
      summary: Documented from observability-service handler (complete-not-delete sync)
      responses:
        '200':
          description: Success
  /heartbeat:
    post:
      operationId: observability_post__heartbeat
      tags:
        - Generated-From-Handler
      summary: Documented from observability-service handler (complete-not-delete sync)
      responses:
        '200':
