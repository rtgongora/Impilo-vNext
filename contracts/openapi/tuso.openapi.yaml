components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    TenantId:
      name: X-Tenant-ID
      in: header
      required: true
      schema:
        type: string
    PodId:
      name: X-Pod-ID
      in: header
      required: true
      schema:
        type: string
    RequestId:
      name: X-Request-ID
      in: header
      required: true
      schema:
        type: string
        format: uuid
    CorrelationId:
      name: X-Correlation-ID
      in: header
      required: true
      schema:
        type: string
        format: uuid
    ActorId:
      name: X-Actor-ID
      in: header
      required: true
      schema:
        type: string
    ActorType:
      name: X-Actor-Type
      in: header
      required: true
      schema:
        type: string
    FacilityId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
      description: Facility database ID

  responses:
    Unauthorized:
      description: Missing or invalid authentication

  schemas:
    ApiResponse:
      type: object
      description: Standard API response wrapper
      properties:
        data:
          type: object
          additionalProperties: true
        meta:
          type: object
          properties:
            correlation_id:
              type: string
            request_id:
              type: string
      additionalProperties: true

    CreateFacilityRequest:
      type: object
      required: [facilityCode, name, type]
      properties:
        facilityCode:
          type: string
          description: National facility code (unique)
        name:
          type: string
        type:
          type: string
        level:
          type: string
          enum: [TERTIARY, SECONDARY, PRIMARY, CLINIC]
        ownership:
          type: string
          enum: [PUBLIC, PRIVATE, NGO, FAITH_BASED]
        province:
          type: string
        district:
          type: string
        latitude:
          type: number
        longitude:
          type: number

    UpdateFacilityRequest:
      type: object
      properties:
        name:
          type: string
        type:
          type: string
        level:
          type: string
        ownership:
          type: string
        province:
          type: string
        district:
          type: string

    ProbeHealthBody:
      type: object
      properties:
        service:
          type: string
          example: tuso
        status:
          type: string
        tenant_id:
          type: string
        pod_id:
          type: string
        request_id:
          type: string
        correlation_id:
          type: string
      additionalProperties: true

    ProbeCommandBody:
      type: object
      additionalProperties: true

    ProbeFederationBody:
      type: object
      additionalProperties: true
