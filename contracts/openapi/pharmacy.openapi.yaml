# =============================================================================
# Pharmacy — Dispensing Service API (OpenAPI 3.0)
# Manages medication dispense orders, returns, wastage, reversals,
# pickup workflows, and pharmacy worklists within Impilo.
# =============================================================================
openapi: "3.0.3"

info:
  title: Pharmacy — Dispensing Service
  version: "1.0.0"
  description: |
    The Pharmacy Dispensing Service manages the complete medication dispensing
    lifecycle including order acceptance, picking, partial dispensing, returns,
    wastage recording, reversal, and patient pickup coordination.

    **Consistency classes**
    * Class A — destructive/high-trust mutations (require PDP decision header)
    * Class B — creation / registration mutations
    * Class C — reads and snapshots
  contact:
    name: Impilo Platform Team
  license:
    name: Proprietary

servers:
  - url: http://localhost:8096
    description: Local development
  - url: https://{tenant}.impilo.health/api
    description: Production (per-tenant)
    variables:
      tenant:
        default: demo

security:
  - bearerAuth: []

tags:
  - name: Dispense
    description: Dispense order lifecycle management
  - name: Returns
    description: Return, wastage, and reversal management
  - name: Pickup
    description: Patient pickup coordination
  - name: Worklist
    description: Pharmacy worklist management

# ============================================================================
# PATHS
# ============================================================================
paths:

  # ---- Dispense ------------------------------------------------------------

  /v1/dispense-orders/{id}:
    get:
      operationId: getDispenseOrder
      tags: [Dispense]
      summary: Get a dispense order by ID (Class C)
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/ActorId"
        - $ref: "#/components/parameters/ActorType"
        - $ref: "#/components/parameters/PurposeOfUse"
        - $ref: "#/components/parameters/DeviceFingerprint"
        - $ref: "#/components/parameters/DispenseOrderId"
      responses:
        "200":
          description: Dispense order detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseDispenseOrderResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/dispense-orders/patient/{cpid}:
    get:
      operationId: getPatientDispenseOrders
      tags: [Dispense]
      summary: Get all dispense orders for a patient (Class C)
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/ActorId"
        - $ref: "#/components/parameters/ActorType"
        - $ref: "#/components/parameters/PurposeOfUse"
        - $ref: "#/components/parameters/DeviceFingerprint"
        - $ref: "#/components/parameters/PatientCpid"
      responses:
        "200":
          description: Patient dispense order list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseDispenseOrderList"

  /v1/dispense-orders/{id}/accept:
    post:
      operationId: acceptDispenseOrder
      tags: [Dispense]
      summary: Accept a dispense order for processing (Class B)
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/ActorId"
        - $ref: "#/components/parameters/ActorType"
        - $ref: "#/components/parameters/PurposeOfUse"
        - $ref: "#/components/parameters/DeviceFingerprint"
        - $ref: "#/components/parameters/DispenseOrderId"
      responses:
        "200":
          description: Order accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseDispenseOrderResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/dispense-orders/{id}/pick:
    post:
      operationId: pickDispenseOrder
      tags: [Dispense]
      summary: Pick items for a dispense order (Class B)
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/ActorId"
        - $ref: "#/components/parameters/ActorType"
        - $ref: "#/components/parameters/PurposeOfUse"
        - $ref: "#/components/parameters/DeviceFingerprint"
        - $ref: "#/components/parameters/DispenseOrderId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PickDispenseRequest"
      responses:
        "200":
          description: Items picked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseDispenseOrderResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/dispense-orders/{id}/partial:
    post:
      operationId: partialDispense
      tags: [Dispense]
      summary: Record a partial dispense (Class B)
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/ActorId"
        - $ref: "#/components/parameters/ActorType"
        - $ref: "#/components/parameters/PurposeOfUse"
        - $ref: "#/components/parameters/DeviceFingerprint"
        - $ref: "#/components/parameters/DispenseOrderId"
      responses:
        "200":
          description: Partial dispense recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseDispenseOrderResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/dispense-orders/{id}/complete:
    post:
      operationId: completeDispenseOrder
      tags: [Dispense]
      summary: Complete a dispense order (Class A)
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/ActorId"
        - $ref: "#/components/parameters/ActorType"
        - $ref: "#/components/parameters/PurposeOfUse"
        - $ref: "#/components/parameters/DeviceFingerprint"
        - $ref: "#/components/parameters/Decision"
        - $ref: "#/components/parameters/DispenseOrderId"
      responses:
        "200":
          description: Dispense order completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseDispenseOrderResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/dispense-orders/{id}/backorder:
    post:
      operationId: backorderDispenseOrder
      tags: [Dispense]
      summary: Mark items as backordered (Class B)
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/ActorId"
        - $ref: "#/components/parameters/ActorType"
        - $ref: "#/components/parameters/PurposeOfUse"
        - $ref: "#/components/parameters/DeviceFingerprint"
        - $ref: "#/components/parameters/DispenseOrderId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BackorderRequest"
      responses:
        "200":
          description: Order marked as backordered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseDispenseOrderResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  # ---- Returns -------------------------------------------------------------

  /v1/dispense-orders/{id}/return:
    post:
      operationId: returnDispensedItems
      tags: [Returns]
      summary: Record a medication return (Class A)
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/ActorId"
        - $ref: "#/components/parameters/ActorType"
        - $ref: "#/components/parameters/PurposeOfUse"
        - $ref: "#/components/parameters/DeviceFingerprint"
        - $ref: "#/components/parameters/Decision"
        - $ref: "#/components/parameters/DispenseOrderId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReturnItemsRequest"
      responses:
        "200":
          description: Return recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseDispenseOrderResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/dispense-orders/{id}/wastage:
    post:
      operationId: recordWastage
      tags: [Returns]
      summary: Record medication wastage (Class A)
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/ActorId"
        - $ref: "#/components/parameters/ActorType"
        - $ref: "#/components/parameters/PurposeOfUse"
        - $ref: "#/components/parameters/DeviceFingerprint"
        - $ref: "#/components/parameters/Decision"
        - $ref: "#/components/parameters/DispenseOrderId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WastageRequest"
      responses:
        "200":
          description: Wastage recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseDispenseOrderResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/dispense-orders/{id}/reversal:
    post:
      operationId: reverseDispenseOrder
      tags: [Returns]
      summary: Reverse a dispense order (Class A)
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/ActorId"
        - $ref: "#/components/parameters/ActorType"
        - $ref: "#/components/parameters/PurposeOfUse"
        - $ref: "#/components/parameters/DeviceFingerprint"
        - $ref: "#/components/parameters/Decision"
        - $ref: "#/components/parameters/DispenseOrderId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReversalRequest"
      responses:
        "200":
          description: Order reversed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseDispenseOrderResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  # ---- Pickup --------------------------------------------------------------

  /v1/dispense-orders/{id}/pickup/create:
    post:
      operationId: createPickup
      tags: [Pickup]
      summary: Create a pickup record for a dispense order (Class B)
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/ActorId"
        - $ref: "#/components/parameters/ActorType"
        - $ref: "#/components/parameters/PurposeOfUse"
        - $ref: "#/components/parameters/DeviceFingerprint"
        - $ref: "#/components/parameters/DispenseOrderId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePickupRequest"
      responses:
        "201":
          description: Pickup created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponsePickupResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/pickup/claim:
    post:
      operationId: claimPickup
      tags: [Pickup]
      summary: Claim a pickup using a token (Class B)
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/ActorId"
        - $ref: "#/components/parameters/ActorType"
        - $ref: "#/components/parameters/PurposeOfUse"
        - $ref: "#/components/parameters/DeviceFingerprint"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClaimPickupRequest"
      responses:
        "200":
          description: Pickup claimed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponsePickupResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  # ---- Worklist ------------------------------------------------------------

  /v1/worklists:
    get:
      operationId: listPharmacyWorklist
      tags: [Worklist]
      summary: Get pharmacy worklist (Class C)
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/ActorId"
        - $ref: "#/components/parameters/ActorType"
        - $ref: "#/components/parameters/PurposeOfUse"
        - $ref: "#/components/parameters/DeviceFingerprint"
        - name: facilityId
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: workspaceId
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: storeId
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          required: false
          schema:
            type: string
        - name: priority
          in: query
          required: false
          schema:
            type: string
        - $ref: "#/components/parameters/PageNumber"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Pharmacy worklist
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponsePagedPharmacyWorklistItem"

# ============================================================================
# COMPONENTS
# ============================================================================
components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Keycloak-issued access token (forwarded by Envoy)

  parameters:
    TenantId:
      name: X-Tenant-Id
      in: header
      required: true
      description: Tenant identifier — injected by Envoy after TSHEPO authorisation
      schema:
        type: string
    CorrelationId:
      name: X-Correlation-Id
      in: header
      required: true
      description: End-to-end correlation ID for distributed tracing
      schema:
        type: string
        format: uuid
    ActorId:
      name: X-Actor-Id
      in: header
      required: true
      description: Authenticated actor (user or service) identifier
      schema:
        type: string
    ActorType:
      name: X-Actor-Type
      in: header
      required: true
      description: Type of actor making the request
      schema:
        type: string
        enum: [CITIZEN, PROVIDER, ADMIN, SYSTEM, SERVICE]
    PurposeOfUse:
      name: X-Purpose-Of-Use
      in: header
      required: true
      description: Why this request is being made
      schema:
        type: string
    DeviceFingerprint:
      name: X-Device-Fingerprint
      in: header
      required: true
      description: Device identity hash
      schema:
        type: string
    FacilityId:
      name: X-Facility-Id
      in: header
      required: false
      description: Facility scope (contextual)
      schema:
        type: string
        format: uuid
    WorkspaceId:
      name: X-Workspace-Id
      in: header
      required: false
      description: Workspace scope (contextual)
      schema:
        type: string
        format: uuid
    ShiftId:
      name: X-Shift-Id
      in: header
      required: false
      description: Duty shift scope (contextual)
      schema:
        type: string
        format: uuid
    Decision:
      name: X-Decision
      in: header
      required: false
      description: PDP decision header — ALLOW, DENY, STEP_UP_REQUIRED (Class A endpoints require ALLOW)
      schema:
        type: string
        enum: [ALLOW, DENY, STEP_UP_REQUIRED]
    Obligations:
      name: X-Obligations
      in: header
      required: false
      description: JSON obligations blob from TSHEPO
      schema:
        type: string
    PageNumber:
      name: page
      in: query
      schema:
        type: integer
        default: 0
    PageSize:
      name: size
      in: query
      schema:
        type: integer
        default: 20
        maximum: 100
    DispenseOrderId:
      name: id
      in: path
      required: true
      description: Dispense order identifier
      schema:
        type: integer
        format: int64
    PatientCpid:
      name: cpid
      in: path
      required: true
      description: Patient CPID (clinical patient identifier)
      schema:
        type: string

  responses:
    BadRequest:
      description: Validation error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: Duplicate resource
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Missing or invalid trust headers
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: PDP denied the request (X-Decision=DENY)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:

    # ---- Requests ----------------------------------------------------------

    PickDispenseRequest:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/DispenseLineItem"

    BackorderRequest:
      type: object
      required: [notes]
      properties:
        notes:
          type: string

    ReturnItemsRequest:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/DispenseLineItem"

    WastageRequest:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/DispenseLineItem"

    ReversalRequest:
      type: object
      required: [reason]
      properties:
        reason:
          type: string

    CreatePickupRequest:
      type: object
      required: [method]
      properties:
        method:
          type: string
          enum: [SELF_COLLECT, DELEGATE, COURIER]
        delegatedTo:
          type: string

    ClaimPickupRequest:
      type: object
      required: [token, deviceFingerprint]
      properties:
        token:
          type: string
        deviceFingerprint:
          type: string

    DispenseLineItem:
      type: object
      required: [productCode, quantity]
      properties:
        productCode:
          type: string
        batchNumber:
          type: string
        quantity:
          type: number
          format: double
        unit:
          type: string

    # ---- Response wrappers -------------------------------------------------

    ApiResponseDispenseOrderResponse:
      type: object
      properties:
        success:
          type: boolean
        correlationId:
          type: string
          format: uuid
        data:
          $ref: "#/components/schemas/DispenseOrderResponse"

    ApiResponseDispenseOrderList:
      type: object
      properties:
        success:
          type: boolean
        correlationId:
          type: string
          format: uuid
        data:
          type: array
          items:
            $ref: "#/components/schemas/DispenseOrderResponse"

    ApiResponsePickupResponse:
      type: object
      properties:
        success:
          type: boolean
        correlationId:
          type: string
          format: uuid
        data:
          $ref: "#/components/schemas/PickupResponse"

    ApiResponsePagedPharmacyWorklistItem:
      type: object
      properties:
        success:
          type: boolean
        correlationId:
          type: string
          format: uuid
        data:
          $ref: "#/components/schemas/PagedPharmacyWorklistItem"

    # ---- Domain objects ----------------------------------------------------

    DispenseOrderResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        dispenseRef:
          type: string
        patientCpid:
          type: string
        facilityId:
          type: string
          format: uuid
        storeId:
          type: string
          format: uuid
        status:
          type: string
          enum: [PENDING, ACCEPTED, PICKING, PARTIALLY_DISPENSED, COMPLETED, BACKORDERED, RETURNED, REVERSED]
        priority:
          type: string
          enum: [ROUTINE, URGENT, STAT]
        items:
          type: array
          items:
            $ref: "#/components/schemas/DispenseLineItem"
        notes:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    PickupResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        dispenseOrderId:
          type: integer
          format: int64
        method:
          type: string
        delegatedTo:
          type: string
        token:
          type: string
        status:
          type: string
          enum: [PENDING, CLAIMED, EXPIRED]
        createdAt:
          type: string
          format: date-time
        claimedAt:
          type: string
          format: date-time

    PharmacyWorklistItem:
      type: object
      properties:
        dispenseOrderId:
          type: integer
          format: int64
        dispenseRef:
          type: string
        patientCpid:
          type: string
        priority:
          type: string
        status:
          type: string
        storeId:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time

    PagedPharmacyWorklistItem:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: "#/components/schemas/PharmacyWorklistItem"
        page:
          type: integer
        size:
          type: integer
        totalElements:
          type: integer
          format: int64

    SnapshotResponse:
      type: object
      properties:
        as_of:
          type: string
          format: date-time
        cursor:
          type: integer
        limit:
          type: integer
        has_more:
          type: boolean
        total:
          type: integer
        items:
          type: array
          items:
            type: object
            additionalProperties: true

    GenericResponse:
      type: object
      properties:
        message:
          type: string
        referenceId:
          type: string

    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          default: false
        correlationId:
          type: string
          format: uuid
        errorCode:
          type: string
        message:
          type: string
        details:
          type: array
          items:
            type: string
