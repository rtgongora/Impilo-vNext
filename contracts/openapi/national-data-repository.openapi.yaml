openapi: 3.0.3
info:
  title: "National Data Repository"
  description: |
    Phase F baseline contract for `national-data-repository-service`. Extend with real paths and schemas as the HTTP surface is stabilised.
  version: 0.1.0
servers:
  - url: http://localhost:8152
    description: Local default (`default_http_port` in docs/registry/services-registry.yaml)

paths:
  /internal/v1/health:
    get:
      operationId: internalHealth
      summary: Internal health probe
      tags:
        - Health
      responses:
        '200':
          description: Service reachable
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /internal/v1/datasets:
    get:
      operationId: ndrDatasetsList
      tags:
        - NDR-National
      summary: List dataset definitions and versions
      responses:
        '200':
          description: Dataset listing
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
    post:
      operationId: ndrDatasetCreate
      tags:
        - NDR-National
      summary: Register dataset definition
      responses:
        '201':
          description: Dataset created
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /internal/v1/datasets/{key}/versions:
    post:
      operationId: ndrDatasetVersionCreate
      tags:
        - NDR-National
      summary: Create dataset version
      parameters:
        - name: key
          in: path
          required: true
          schema:
            type: string
      responses:
        '201':
          description: Dataset version created
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /internal/v1/query:
    post:
      operationId: ndrDatasetQuery
      tags:
        - NDR-National
      summary: Deprecated runtime query endpoint (ownership moved to ndr-service)
      responses:
        '409':
          description: Runtime owner conflict; use ndr-service query endpoints
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /:
    post:
      operationId: nationaldatarepository_post__
      tags:
        - Generated-From-Handler
      summary: Documented from national-data-repository-service handler (complete-not-delete sync)
      responses:
        '200':
          description: Success
    get:
      operationId: nationaldatarepository_get__
      tags:
        - Generated-From-Handler
      summary: Documented from national-data-repository-service handler (complete-not-delete sync)
      responses:
        '200':
          description: Success
  /{key}/versions:
    post:
      operationId: nationaldatarepository_post__key_versions
      tags:
        - Generated-From-Handler
      summary: Documented from national-data-repository-service handler (complete-not-delete sync)
      responses:
        '200':
          description: Success

components:
  schemas: {}
