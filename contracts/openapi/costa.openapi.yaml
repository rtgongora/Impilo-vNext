# =============================================================================
# COSTA — Costing Engine Service API (OpenAPI 3.0)
# =============================================================================
openapi: "3.0.3"

info:
  title: "COSTA — Costing Engine Service API"
  version: "1.0.0"
  description: |
    COSTA manages the complete costing, billing, and payment lifecycle for the
    Impilo platform:

    * **Estimates** — Pre-encounter cost estimation with party splitting
    * **Bills** — Full lifecycle: draft → accumulate → approve → finalize
    * **Tariffs** — National tariff schedule management and CSV import
    * **Rulesets** — JSON-based charging rules with versioned publishing
    * **Audit** — Complete bill audit trail with all linked entities

    Five cost methods: Micro-costing, ABC, Tariff, Standard (with variance), Stock Average.
    Exemption engine splits across patient, insurer, subsidy, and write-off parties.

    All endpoints require TSHEPO trust headers injected by Envoy ext_authz.
  contact:
    name: Impilo Platform Team
  license:
    name: Proprietary

servers:
  - url: http://localhost:8101
    description: Local development (direct)
  - url: http://localhost:10000
    description: Local development (via Envoy gateway)
  - url: https://{tenant}.impilo.health/api
    description: Production (per-tenant)
    variables:
      tenant:
        default: demo

security:
  - bearerAuth: []

tags:
  - name: Estimate
    description: Pre-encounter cost estimation
  - name: Bill
    description: Bill lifecycle management (draft, approve, finalize, pay, refund)
  - name: Tariff
    description: National tariff schedule management
  - name: Ruleset
    description: Charging ruleset configuration and publishing
  - name: Audit
    description: Bill audit trail and compliance

paths:
  /costa/v1/estimate:
    post:
      operationId: createEstimate
      tags: [Estimate]
      summary: Create a cost estimate
      description: |
        Computes a pre-encounter cost estimate for one or more line items.
        Applies cost engines, charging rules, and exemption/insurance splitting.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EstimateRequest"
      responses:
        "200":
          description: Estimate computed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse_EstimateResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /costa/v1/bills/draft:
    post:
      operationId: createBillDraft
      tags: [Bill]
      summary: Create a new bill draft
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BillDraftRequest"
      responses:
        "201":
          description: Draft bill created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse_BillHeader"
        "400":
          $ref: "#/components/responses/BadRequest"

  /costa/v1/bills/{id}:
    get:
      operationId: getBill
      tags: [Bill]
      summary: Get bill with lines and parties
      parameters:
        - $ref: "#/components/parameters/BillId"
      responses:
        "200":
          description: Bill detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse_BillDetail"
        "404":
          $ref: "#/components/responses/NotFound"

  /costa/v1/bills/{id}/lines:
    post:
      operationId: postBillLine
      tags: [Bill]
      summary: Post a charge line to a bill
      parameters:
        - $ref: "#/components/parameters/BillId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PostLineRequest"
      responses:
        "201":
          description: Line posted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse_BillLine"

  /costa/v1/bills/{id}/recompute:
    post:
      operationId: recomputeBill
      tags: [Bill]
      summary: Recompute bill totals from current lines
      parameters:
        - $ref: "#/components/parameters/BillId"
      responses:
        "200":
          description: Bill recomputed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse_BillHeader"

  /costa/v1/bills/{id}/submit-approval:
    post:
      operationId: submitBillApproval
      tags: [Bill]
      summary: Submit bill for approval
      parameters:
        - $ref: "#/components/parameters/BillId"
      responses:
        "200":
          description: Bill submitted for approval
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse_BillHeader"

  /costa/v1/bills/{id}/approve:
    post:
      operationId: approveBill
      tags: [Bill]
      summary: Approve a bill
      parameters:
        - $ref: "#/components/parameters/BillId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApprovalRequest"
      responses:
        "200":
          description: Bill approved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse_BillHeader"

  /costa/v1/bills/{id}/finalize:
    post:
      operationId: finalizeBill
      tags: [Bill]
      summary: Finalize a bill (lock from further edits)
      parameters:
        - $ref: "#/components/parameters/BillId"
      responses:
        "200":
          description: Bill finalized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse_BillHeader"

  /costa/v1/bills/{id}/issue-invoice:
    post:
      operationId: issueInvoice
      tags: [Bill]
      summary: Issue an invoice for the finalized bill
      parameters:
        - $ref: "#/components/parameters/BillId"
      responses:
        "201":
          description: Invoice issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse_Invoice"

  /costa/v1/bills/{id}/create-payment-intent:
    post:
      operationId: createPaymentIntent
      tags: [Bill]
      summary: Create a payment intent (MUSHEX integration)
      parameters:
        - $ref: "#/components/parameters/BillId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaymentIntentRequest"
      responses:
        "201":
          description: Payment intent created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse_Payment"

  /costa/v1/bills/{id}/refund:
    post:
      operationId: refundBill
      tags: [Bill]
      summary: Create a refund against a bill
      parameters:
        - $ref: "#/components/parameters/BillId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefundRequest"
      responses:
        "201":
          description: Refund created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse_Refund"

  /costa/v1/tariffs:
    get:
      operationId: listTariffs
      tags: [Tariff]
      summary: List tariffs for the current tenant
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            default: 50
      responses:
        "200":
          description: Paginated tariff list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse_PagedTariff"

  /costa/v1/tariffs/import:
    post:
      operationId: importTariffCsv
      tags: [Tariff]
      summary: Import tariffs from a CSV file
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "200":
          description: Tariffs imported
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse_TariffList"

  /costa/v1/rulesets:
    get:
      operationId: listRulesets
      tags: [Ruleset]
      summary: List charging rulesets for the current tenant
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            default: 50
      responses:
        "200":
          description: Paginated ruleset list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse_PagedRuleset"

  /costa/v1/rulesets/{id}/publish:
    post:
      operationId: publishRuleset
      tags: [Ruleset]
      summary: Publish a charging ruleset (archives previous version)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Ruleset published
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse_Ruleset"

  /costa/v1/audit/bill/{id}:
    get:
      operationId: auditBill
      tags: [Audit]
      summary: Get complete bill audit trail
      description: |
        Returns the full audit trail for a bill including all lines, parties,
        approvals, payments, refunds, claims, and invoice.
      parameters:
        - $ref: "#/components/parameters/BillId"
      responses:
        "200":
          description: Complete audit trail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse_AuditTrail"
        "404":
          $ref: "#/components/responses/NotFound"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    BillId:
      name: id
      in: path
      required: true
      description: ULID bill identifier
      schema:
        type: string
        pattern: "^[0-9A-HJKMNP-TV-Z]{26}$"

  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    Unauthorized:
      description: Missing or invalid authentication
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"

  schemas:
    ApiError:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
            status:
              type: integer

    EstimateRequest:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/EstimateLineInput"
        exemptionCategory:
          type: string
          enum: [CHILD, ELDERLY, MATERNITY, CHRONIC, DISABLED, VETERAN, HEALTHCARE_WORKER, INDIGENT, EMERGENCY, GOVERNMENT, OTHER]
        insurancePlanId:
          type: integer
          format: int64
        context:
          type: object
          additionalProperties: true

    EstimateLineInput:
      type: object
      required: [msikaCode, kind, qty]
      properties:
        msikaCode:
          type: string
        description:
          type: string
        kind:
          type: string
          enum: [SERVICE, PRODUCT, FEE, BEDDAY, PROCEDURE, THEATRE, IMPLANT, NURSING, OVERHEAD, TRANSPORT, PER_DIEM, COLD_CHAIN, DELIVERY, BUNDLE]
        qty:
          type: number
        costMethod:
          type: string
          enum: [MICRO, ABC, TARIFF, STANDARD, STOCK_AVERAGE]
        extras:
          type: object
          additionalProperties: true

    BillDraftRequest:
      type: object
      properties:
        encounterId:
          type: string
        msikaOrderId:
          type: string
        billType:
          type: string
          enum: [ENCOUNTER, INPATIENT, OUTREACH, MSIKA_ORDER, INSURANCE_CLAIM]

    PostLineRequest:
      type: object
      required: [msikaCode, kind, qty]
      properties:
        msikaCode:
          type: string
        description:
          type: string
        kind:
          type: string
          enum: [SERVICE, PRODUCT, FEE, BEDDAY, PROCEDURE, THEATRE, IMPLANT, NURSING, OVERHEAD, TRANSPORT, PER_DIEM, COLD_CHAIN, DELIVERY, BUNDLE]
        qty:
          type: number
        costMethod:
          type: string
          enum: [MICRO, ABC, TARIFF, STANDARD, STOCK_AVERAGE]
        sourceEvent:
          type: string
        sourceRef:
          type: string
        context:
          type: object
          additionalProperties: true

    ApprovalRequest:
      type: object
      properties:
        note:
          type: string

    PaymentIntentRequest:
      type: object
      required: [paymentType, amount]
      properties:
        paymentType:
          type: string
          enum: [CASH, MOBILE_MONEY, CARD, BANK_TRANSFER, INSURANCE_CLAIM, VOUCHER]
        amount:
          type: number

    RefundRequest:
      type: object
      required: [amount, reason, reasonCode, refundType]
      properties:
        amount:
          type: number
        reason:
          type: string
        reasonCode:
          type: string
        refundType:
          type: string

    BillHeader:
      type: object
      properties:
        id:
          type: string
        tenantId:
          type: string
          format: uuid
        facilityId:
          type: string
          format: uuid
        encounterId:
          type: string
        status:
          type: string
          enum: [DRAFT, ACCUMULATING, PENDING_APPROVAL, APPROVED, FINALIZED, INVOICED, PAID, PARTIALLY_PAID, REFUNDED, VOIDED]
        billType:
          type: string
        currency:
          type: string
        totalCharge:
          type: number
        totalDiscount:
          type: number
        totalNet:
          type: number

    BillLine:
      type: object
      properties:
        id:
          type: integer
          format: int64
        billId:
          type: string
        msikaCode:
          type: string
        description:
          type: string
        kind:
          type: string
        qty:
          type: number
        unitCost:
          type: number
        chargeAmount:
          type: number
        netAmount:
          type: number
        voided:
          type: boolean

    Invoice:
      type: object
      properties:
        id:
          type: integer
          format: int64
        billId:
          type: string
        invoiceNumber:
          type: string
        totalDue:
          type: number
        currency:
          type: string

    Payment:
      type: object
      properties:
        id:
          type: integer
          format: int64
        billId:
          type: string
        paymentType:
          type: string
        amount:
          type: number
        status:
          type: string

    Refund:
      type: object
      properties:
        id:
          type: integer
          format: int64
        billId:
          type: string
        amount:
          type: number
        reason:
          type: string
        status:
          type: string

    Tariff:
      type: object
      properties:
        id:
          type: integer
          format: int64
        tenantId:
          type: string
          format: uuid
        tariffCode:
          type: string
        msikaCode:
          type: string
        description:
          type: string
        price:
          type: number
        currency:
          type: string
        facilityCategory:
          type: string
        patientCategory:
          type: string
        effectiveFrom:
          type: string
          format: date
        effectiveTo:
          type: string
          format: date

    Ruleset:
      type: object
      properties:
        id:
          type: integer
          format: int64
        tenantId:
          type: string
          format: uuid
        name:
          type: string
        version:
          type: integer
        status:
          type: string
          enum: [DRAFT, PUBLISHED, ARCHIVED]
        rules:
          type: string
          description: JSON array of rule definitions
        effectiveFrom:
          type: string
          format: date

    # -- Wrapped response types --
    ApiResponse_EstimateResult:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
          description: Estimate result with lines, totals, and party split
        correlationId:
          type: string

    ApiResponse_BillHeader:
      type: object
      properties:
        success:
          type: boolean
        data:
          $ref: "#/components/schemas/BillHeader"
        correlationId:
          type: string

    ApiResponse_BillDetail:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
          properties:
            bill:
              $ref: "#/components/schemas/BillHeader"
            lines:
              type: array
              items:
                $ref: "#/components/schemas/BillLine"
            parties:
              type: array
              items:
                type: object
        correlationId:
          type: string

    ApiResponse_BillLine:
      type: object
      properties:
        success:
          type: boolean
        data:
          $ref: "#/components/schemas/BillLine"
        correlationId:
          type: string

    ApiResponse_Invoice:
      type: object
      properties:
        success:
          type: boolean
        data:
          $ref: "#/components/schemas/Invoice"
        correlationId:
          type: string

    ApiResponse_Payment:
      type: object
      properties:
        success:
          type: boolean
        data:
          $ref: "#/components/schemas/Payment"
        correlationId:
          type: string

    ApiResponse_Refund:
      type: object
      properties:
        success:
          type: boolean
        data:
          $ref: "#/components/schemas/Refund"
        correlationId:
          type: string

    ApiResponse_PagedTariff:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/Tariff"
            page:
              type: integer
            size:
              type: integer
            totalElements:
              type: integer
            totalPages:
              type: integer
            hasNext:
              type: boolean
        correlationId:
          type: string

    ApiResponse_TariffList:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: array
          items:
            $ref: "#/components/schemas/Tariff"
        correlationId:
          type: string

    ApiResponse_PagedRuleset:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/Ruleset"
            page:
              type: integer
            size:
              type: integer
            totalElements:
              type: integer
            totalPages:
              type: integer
            hasNext:
              type: boolean
        correlationId:
          type: string

    ApiResponse_Ruleset:
      type: object
      properties:
        success:
          type: boolean
        data:
          $ref: "#/components/schemas/Ruleset"
        correlationId:
          type: string

    ApiResponse_AuditTrail:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
          properties:
            bill:
              $ref: "#/components/schemas/BillHeader"
            lines:
              type: array
              items:
                $ref: "#/components/schemas/BillLine"
            lines_count:
              type: integer
            voided_lines:
              type: integer
            parties:
              type: array
              items:
                type: object
            approvals:
              type: array
              items:
                type: object
            payments:
              type: array
              items:
                $ref: "#/components/schemas/Payment"
            refunds:
              type: array
              items:
                $ref: "#/components/schemas/Refund"
            claims:
              type: array
              items:
                type: object
            invoice:
              $ref: "#/components/schemas/Invoice"
        correlationId:
          type: string
