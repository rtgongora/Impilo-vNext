# =============================================================================
# COSTA — Costing Engine & Claims API (OpenAPI 3.0)
#
# COSTA (costing-engine-service) provides encounter billing, tariffs, estimates,
# claim packs, payments, refunds, and v1.1 companion probes for the Health OS.
# =============================================================================
openapi: "3.0.3"

info:
  title: COSTA — Costing Engine & Claims API
  version: "1.1.0"
  description: |
    COSTA is Impilo's costing engine: bill lifecycle, tariffs, charging rulesets,
    estimates, claim packs, invoices, payments, refunds, and audit views.

    Trust headers are enforced by Envoy + TSHEPO; internal probes require
    Health OS Manifest v1.2 mandatory headers (see `CompanionHeaders`).
  contact:
    name: Impilo Platform Team
  license:
    name: Proprietary

servers:
  - url: http://localhost:8101
    description: Local development
  - url: https://{tenant}.impilo.health/costa
    description: Production (per-tenant)
    variables:
      tenant:
        default: demo

security:
  - bearerAuth: []

tags:
  - name: Internal-Probe
    description: Tech-companion v1.1 header and idempotency proofs
  - name: Bills
    description: Bill draft, lines, approval, invoice, and payment operations
  - name: Claims
    description: Insurance claim packs derived from finalized bills
  - name: Payments
    description: Cross-bill payment listing
  - name: Estimates
    description: Encounter cost estimates
  - name: Tariffs
    description: Tariff catalog and CSV import
  - name: Rulesets
    description: Charging ruleset publication
  - name: Audit
    description: Bill-level audit trail aggregation

paths:

  /internal/v1/health:
    get:
      operationId: costaInternalHealth
      tags: [Internal-Probe]
      summary: v1.1 probe — returns trust context echo
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/PodId"
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "200":
          description: Service UP with context echo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProbeHealthBody"

  /internal/v1/test-command:
    post:
      operationId: costaInternalTestCommand
      tags: [Internal-Probe]
      summary: v1.1 probe — idempotency / echo
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/PodId"
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "201":
          description: Echo payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProbeCommandBody"

  /costa/v1/bills:
    get:
      operationId: costaListBills
      tags: [Bills]
      summary: List bills (paged)
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/PodId"
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/CorrelationId"
        - name: page
          in: query
          schema: { type: integer, default: 0 }
        - name: size
          in: query
          schema: { type: integer, default: 50 }
        - name: status
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Paged bill headers
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponsePagedBillHeader"

  /costa/v1/bills/draft:
    post:
      operationId: costaCreateBillDraft
      tags: [Bills]
      summary: Create a draft bill
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/PodId"
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BillDraftRequest"
      responses:
        "201":
          description: Draft created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseBillHeader"

  /costa/v1/bills/{id}:
    get:
      operationId: costaGetBill
      tags: [Bills]
      summary: Get bill with lines and parties
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/PodId"
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/CorrelationId"
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Bill aggregate
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseBillAggregate"

  /costa/v1/bills/{id}/lines:
    post:
      operationId: costaPostBillLine
      tags: [Bills]
      summary: Post a bill line
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/PodId"
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/CorrelationId"
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PostLineRequest"
      responses:
        "200":
          description: No line created (noop)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseBillLineNullable"
        "201":
          description: Line created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseBillLine"

  /costa/v1/bills/{id}/recompute:
    post:
      operationId: costaRecomputeBill
      tags: [Bills]
      summary: Recompute bill totals
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/PodId"
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/CorrelationId"
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Updated bill header
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseBillHeader"

  /costa/v1/bills/{id}/submit-approval:
    post:
      operationId: costaSubmitBillApproval
      tags: [Bills]
      summary: Submit bill for approval
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/PodId"
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/CorrelationId"
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Bill header
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseBillHeader"

  /costa/v1/bills/{id}/approve:
    post:
      operationId: costaApproveBill
      tags: [Bills]
      summary: Approve bill
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/PodId"
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/CorrelationId"
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApprovalRequest"
      responses:
        "200":
          description: Bill header
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseBillHeader"

  /costa/v1/bills/{id}/finalize:
    post:
      operationId: costaFinalizeBill
      tags: [Bills]
      summary: Finalize bill
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/PodId"
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/CorrelationId"
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Bill header
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseBillHeader"

  /costa/v1/bills/{id}/issue-invoice:
    post:
      operationId: costaIssueInvoice
      tags: [Bills]
      summary: Issue invoice for bill
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/PodId"
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/CorrelationId"
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "201":
          description: Invoice created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseInvoice"

  /costa/v1/bills/{id}/create-payment-intent:
    post:
      operationId: costaCreatePaymentIntent
      tags: [Bills]
      summary: Create payment intent for bill
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/PodId"
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/CorrelationId"
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaymentIntentRequest"
      responses:
        "201":
          description: Payment intent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponsePayment"

  /costa/v1/bills/{id}/refunds:
    get:
      operationId: costaListBillRefunds
      tags: [Bills]
      summary: List refunds for bill
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/PodId"
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/CorrelationId"
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Refunds
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseRefundList"

  /costa/v1/bills/{id}/refund:
    post:
      operationId: costaCreateRefund
      tags: [Bills]
      summary: Create refund for bill
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/PodId"
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/CorrelationId"
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefundRequest"
      responses:
        "201":
          description: Refund created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseRefund"

  /costa/v1/bills/{id}/payments:
    get:
      operationId: costaListBillPayments
      tags: [Bills]
      summary: List payments for bill
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/PodId"
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/CorrelationId"
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Payments
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponsePaymentList"

  /costa/v1/bills/{id}/payments/{paymentId}/cancel:
    post:
      operationId: costaCancelPayment
      tags: [Bills]
      summary: Cancel a payment on a bill
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/PodId"
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/CorrelationId"
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: paymentId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: Payment updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponsePayment"

  /costa/v1/claims:
    get:
      operationId: costaListClaims
      tags: [Claims]
      summary: List claim packs
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/PodId"
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/CorrelationId"
        - name: page
          in: query
          schema: { type: integer, default: 0 }
        - name: size
          in: query
          schema: { type: integer, default: 50 }
      responses:
        "200":
          description: Paged claims
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponsePagedClaimPack"

  /costa/v1/claims/{id}:
    get:
      operationId: costaGetClaim
      tags: [Claims]
      summary: Get claim pack by id
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/PodId"
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/CorrelationId"
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: Claim pack
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseClaimPack"

  /costa/v1/payments:
    get:
      operationId: costaListPayments
      tags: [Payments]
      summary: List payments across bills
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/PodId"
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/CorrelationId"
        - name: page
          in: query
          schema: { type: integer, default: 0 }
        - name: size
          in: query
          schema: { type: integer, default: 50 }
      responses:
        "200":
          description: Paged payments
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponsePagedPayment"

  /costa/v1/estimate:
    post:
      operationId: costaCreateEstimate
      tags: [Estimates]
      summary: Run costing estimate
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/PodId"
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EstimateRequest"
      responses:
        "200":
          description: Estimate result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseEstimateResult"

  /costa/v1/tariffs:
    get:
      operationId: costaListTariffs
      tags: [Tariffs]
      summary: List tariffs
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/PodId"
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/CorrelationId"
        - name: page
          in: query
          schema: { type: integer, default: 0 }
        - name: size
          in: query
          schema: { type: integer, default: 50 }
      responses:
        "200":
          description: Paged tariffs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponsePagedTariff"

  /costa/v1/tariffs/import:
    post:
      operationId: costaImportTariffsCsv
      tags: [Tariffs]
      summary: Import tariffs from CSV
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/PodId"
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "200":
          description: Imported tariffs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseTariffList"
        "400":
          description: Import failed

  /costa/v1/rulesets:
    get:
      operationId: costaListRulesets
      tags: [Rulesets]
      summary: List charging rulesets
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/PodId"
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/CorrelationId"
        - name: page
          in: query
          schema: { type: integer, default: 0 }
        - name: size
          in: query
          schema: { type: integer, default: 50 }
      responses:
        "200":
          description: Paged rulesets
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponsePagedRuleset"

  /costa/v1/rulesets/{id}/publish:
    post:
      operationId: costaPublishRuleset
      tags: [Rulesets]
      summary: Publish a ruleset
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/PodId"
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/CorrelationId"
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: Published ruleset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseRuleset"

  /costa/v1/audit/bill/{id}:
    get:
      operationId: costaAuditBill
      tags: [Audit]
      summary: Aggregate audit view for a bill
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/PodId"
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/CorrelationId"
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Audit bundle
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseBillAudit"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    TenantId:
      name: X-Tenant-ID
      in: header
      required: true
      schema:
        type: string
        format: uuid
    PodId:
      name: X-Pod-ID
      in: header
      required: true
      schema:
        type: string
    RequestId:
      name: X-Request-ID
      in: header
      required: true
      schema:
        type: string
        format: uuid
    CorrelationId:
      name: X-Correlation-ID
      in: header
      required: true
      schema:
        type: string
        format: uuid

  schemas:
    ProbeHealthBody:
      type: object
      properties:
        service:
          type: string
          example: costa
        status:
          type: string
          example: UP
        tenant_id:
          type: string
        pod_id:
          type: string
        request_id:
          type: string
        correlation_id:
          type: string
      additionalProperties: true

    ProbeCommandBody:
      type: object
      properties:
        service:
          type: string
        action:
          type: string
        request_id:
          type: string
        correlation_id:
          type: string
        echo:
          type: object
          additionalProperties: true
      additionalProperties: true

    ApiResponseEnvelope:
      type: object
      description: Standard ApiResponse wrapper (data + meta.correlation_id)
      properties:
        data:
          description: Response payload
        meta:
          type: object
          properties:
            correlation_id:
              type: string
      additionalProperties: true

    BillDraftRequest:
      type: object
      properties:
        encounterId: { type: string }
        msikaOrderId: { type: string }
        billType:
          type: string
          description: BillType enum name (e.g. ENCOUNTER)

    PostLineRequest:
      type: object
      properties:
        msikaCode: { type: string }
        description: { type: string }
        kind: { type: string }
        qty: { type: number }
        costMethod: { type: string }
        sourceEvent: { type: string }
        sourceRef: { type: string }
        context:
          type: object
          additionalProperties: true

    ApprovalRequest:
      type: object
      properties:
        note: { type: string }

    PaymentIntentRequest:
      type: object
      required: [paymentType, amount]
      properties:
        paymentType: { type: string }
        amount: { type: number }

    RefundRequest:
      type: object
      required: [amount]
      properties:
        amount: { type: number }
        reason: { type: string }
        reasonCode: { type: string }
        refundType: { type: string }

    EstimateRequest:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            type: object
            required: [msikaCode, kind, qty]
            properties:
              msikaCode: { type: string }
              description: { type: string }
              kind: { type: string }
              qty: { type: number }
              costMethod: { type: string }
              extras:
                type: object
                additionalProperties: true
        exemptionCategory: { type: string }
        insurancePlanId: { type: integer, format: int64 }
        context:
          type: object
          additionalProperties: true

    ApiResponsePagedBillHeader:
      allOf:
        - $ref: "#/components/schemas/ApiResponseEnvelope"
    ApiResponseBillHeader:
      allOf:
        - $ref: "#/components/schemas/ApiResponseEnvelope"
    ApiResponseBillAggregate:
      allOf:
        - $ref: "#/components/schemas/ApiResponseEnvelope"
    ApiResponseBillLine:
      allOf:
        - $ref: "#/components/schemas/ApiResponseEnvelope"
    ApiResponseBillLineNullable:
      allOf:
        - $ref: "#/components/schemas/ApiResponseEnvelope"
    ApiResponseInvoice:
      allOf:
        - $ref: "#/components/schemas/ApiResponseEnvelope"
    ApiResponsePayment:
      allOf:
        - $ref: "#/components/schemas/ApiResponseEnvelope"
    ApiResponsePaymentList:
      allOf:
        - $ref: "#/components/schemas/ApiResponseEnvelope"
    ApiResponseRefund:
      allOf:
        - $ref: "#/components/schemas/ApiResponseEnvelope"
    ApiResponseRefundList:
      allOf:
        - $ref: "#/components/schemas/ApiResponseEnvelope"
    ApiResponsePagedClaimPack:
      allOf:
        - $ref: "#/components/schemas/ApiResponseEnvelope"
    ApiResponseClaimPack:
      allOf:
        - $ref: "#/components/schemas/ApiResponseEnvelope"
    ApiResponsePagedPayment:
      allOf:
        - $ref: "#/components/schemas/ApiResponseEnvelope"
    ApiResponseEstimateResult:
      allOf:
        - $ref: "#/components/schemas/ApiResponseEnvelope"
    ApiResponsePagedTariff:
      allOf:
        - $ref: "#/components/schemas/ApiResponseEnvelope"
    ApiResponseTariffList:
      allOf:
        - $ref: "#/components/schemas/ApiResponseEnvelope"
    ApiResponsePagedRuleset:
      allOf:
        - $ref: "#/components/schemas/ApiResponseEnvelope"
    ApiResponseRuleset:
      allOf:
        - $ref: "#/components/schemas/ApiResponseEnvelope"
    ApiResponseBillAudit:
      allOf:
        - $ref: "#/components/schemas/ApiResponseEnvelope"
