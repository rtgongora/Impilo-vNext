# =============================================================================
# COSTA — Costing & Billing Service API (OpenAPI 3.0)
# Manages bill drafting, line item costing, approval workflows, invoice
# issuance, payment intents, refunds, estimates, tariff imports, and
# billing rulesets within Impilo.
# =============================================================================
openapi: "3.0.3"

info:
  title: COSTA — Costing & Billing Service
  version: "1.0.0"
  description: |
    COSTA is the financial billing engine for Impilo. It manages the complete
    bill lifecycle from draft creation through line costing, approval, invoice
    issuance, payment collection, and refunds. It also provides cost estimation,
    tariff management, and billing ruleset administration.

    **Consistency classes**
    * Class A — destructive/high-trust mutations (require PDP decision header)
    * Class B — creation / registration mutations
    * Class C — reads and snapshots
  contact:
    name: Impilo Platform Team
  license:
    name: Proprietary

servers:
  - url: http://localhost:8101
    description: Local development
  - url: https://{tenant}.impilo.health/api
    description: Production (per-tenant)
    variables:
      tenant:
        default: demo

security:
  - bearerAuth: []

tags:
  - name: Bills
    description: Bill lifecycle management
  - name: Estimates
    description: Cost estimation
  - name: Tariffs
    description: Tariff management and import
  - name: Rulesets
    description: Billing ruleset management

# ============================================================================
# PATHS
# ============================================================================
paths:

  # ---- Bills ---------------------------------------------------------------

  /costa/v1/bills/draft:
    post:
      operationId: draftBill
      tags: [Bills]
      summary: Create a draft bill (Class B)
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/ActorId"
        - $ref: "#/components/parameters/ActorType"
        - $ref: "#/components/parameters/PurposeOfUse"
        - $ref: "#/components/parameters/DeviceFingerprint"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DraftBillRequest"
      responses:
        "201":
          description: Draft bill created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseBillResponse"
        "400":
          $ref: "#/components/responses/BadRequest"

  /costa/v1/bills/{id}:
    get:
      operationId: getBill
      tags: [Bills]
      summary: Get bill with lines and parties (Class C)
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/ActorId"
        - $ref: "#/components/parameters/ActorType"
        - $ref: "#/components/parameters/PurposeOfUse"
        - $ref: "#/components/parameters/DeviceFingerprint"
        - $ref: "#/components/parameters/BillId"
      responses:
        "200":
          description: Bill detail with lines and parties
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseBillResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  /costa/v1/bills/{id}/lines:
    post:
      operationId: addBillLine
      tags: [Bills]
      summary: Add a line item to a bill (Class B)
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/ActorId"
        - $ref: "#/components/parameters/ActorType"
        - $ref: "#/components/parameters/PurposeOfUse"
        - $ref: "#/components/parameters/DeviceFingerprint"
        - $ref: "#/components/parameters/BillId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddBillLineRequest"
      responses:
        "201":
          description: Bill line added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseBillResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /costa/v1/bills/{id}/recompute:
    post:
      operationId: recomputeBill
      tags: [Bills]
      summary: Recompute bill totals (Class B)
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/ActorId"
        - $ref: "#/components/parameters/ActorType"
        - $ref: "#/components/parameters/PurposeOfUse"
        - $ref: "#/components/parameters/DeviceFingerprint"
        - $ref: "#/components/parameters/BillId"
      responses:
        "200":
          description: Bill recomputed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseBillResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  /costa/v1/bills/{id}/submit-approval:
    post:
      operationId: submitBillForApproval
      tags: [Bills]
      summary: Submit bill for approval (Class B)
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/ActorId"
        - $ref: "#/components/parameters/ActorType"
        - $ref: "#/components/parameters/PurposeOfUse"
        - $ref: "#/components/parameters/DeviceFingerprint"
        - $ref: "#/components/parameters/BillId"
      responses:
        "200":
          description: Bill submitted for approval
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseBillResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  /costa/v1/bills/{id}/approve:
    post:
      operationId: approveBill
      tags: [Bills]
      summary: Approve a bill (Class A)
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/ActorId"
        - $ref: "#/components/parameters/ActorType"
        - $ref: "#/components/parameters/PurposeOfUse"
        - $ref: "#/components/parameters/DeviceFingerprint"
        - $ref: "#/components/parameters/Decision"
        - $ref: "#/components/parameters/BillId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApproveBillRequest"
      responses:
        "200":
          description: Bill approved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseBillResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  /costa/v1/bills/{id}/finalize:
    post:
      operationId: finalizeBill
      tags: [Bills]
      summary: Finalize a bill (Class A)
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/ActorId"
        - $ref: "#/components/parameters/ActorType"
        - $ref: "#/components/parameters/PurposeOfUse"
        - $ref: "#/components/parameters/DeviceFingerprint"
        - $ref: "#/components/parameters/Decision"
        - $ref: "#/components/parameters/BillId"
      responses:
        "200":
          description: Bill finalized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseBillResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  /costa/v1/bills/{id}/issue-invoice:
    post:
      operationId: issueInvoice
      tags: [Bills]
      summary: Issue an invoice for a bill (Class A)
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/ActorId"
        - $ref: "#/components/parameters/ActorType"
        - $ref: "#/components/parameters/PurposeOfUse"
        - $ref: "#/components/parameters/DeviceFingerprint"
        - $ref: "#/components/parameters/Decision"
        - $ref: "#/components/parameters/BillId"
      responses:
        "200":
          description: Invoice issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseBillResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  /costa/v1/bills/{id}/create-payment-intent:
    post:
      operationId: createPaymentIntent
      tags: [Bills]
      summary: Create a payment intent for a bill (Class A)
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/ActorId"
        - $ref: "#/components/parameters/ActorType"
        - $ref: "#/components/parameters/PurposeOfUse"
        - $ref: "#/components/parameters/DeviceFingerprint"
        - $ref: "#/components/parameters/Decision"
        - $ref: "#/components/parameters/BillId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePaymentIntentRequest"
      responses:
        "201":
          description: Payment intent created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponsePaymentIntentResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  /costa/v1/bills/{id}/refund:
    post:
      operationId: refundBill
      tags: [Bills]
      summary: Issue a refund on a bill (Class A)
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/ActorId"
        - $ref: "#/components/parameters/ActorType"
        - $ref: "#/components/parameters/PurposeOfUse"
        - $ref: "#/components/parameters/DeviceFingerprint"
        - $ref: "#/components/parameters/Decision"
        - $ref: "#/components/parameters/BillId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefundRequest"
      responses:
        "200":
          description: Refund processed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseBillResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  # ---- Estimates -----------------------------------------------------------

  /costa/v1/estimate:
    post:
      operationId: estimateCost
      tags: [Estimates]
      summary: Estimate cost for a set of items (Class C)
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/ActorId"
        - $ref: "#/components/parameters/ActorType"
        - $ref: "#/components/parameters/PurposeOfUse"
        - $ref: "#/components/parameters/DeviceFingerprint"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CostEstimateRequest"
      responses:
        "200":
          description: Cost estimate
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseCostEstimate"

  # ---- Tariffs -------------------------------------------------------------

  /costa/v1/tariffs:
    get:
      operationId: listCostaTariffs
      tags: [Tariffs]
      summary: List tariffs (paged) (Class C)
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/ActorId"
        - $ref: "#/components/parameters/ActorType"
        - $ref: "#/components/parameters/PurposeOfUse"
        - $ref: "#/components/parameters/DeviceFingerprint"
        - $ref: "#/components/parameters/PageNumber"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Paged tariff list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponsePagedCostaTariff"

  /costa/v1/tariffs/import:
    post:
      operationId: importTariffs
      tags: [Tariffs]
      summary: Import tariffs from a file (Class A)
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/ActorId"
        - $ref: "#/components/parameters/ActorType"
        - $ref: "#/components/parameters/PurposeOfUse"
        - $ref: "#/components/parameters/DeviceFingerprint"
        - $ref: "#/components/parameters/Decision"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "202":
          description: Tariff import accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseGeneric"

  # ---- Rulesets ------------------------------------------------------------

  /costa/v1/rulesets:
    get:
      operationId: listRulesets
      tags: [Rulesets]
      summary: List billing rulesets (paged) (Class C)
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/ActorId"
        - $ref: "#/components/parameters/ActorType"
        - $ref: "#/components/parameters/PurposeOfUse"
        - $ref: "#/components/parameters/DeviceFingerprint"
        - $ref: "#/components/parameters/PageNumber"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Paged ruleset list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponsePagedRuleset"

  /costa/v1/rulesets/{id}/publish:
    post:
      operationId: publishRuleset
      tags: [Rulesets]
      summary: Publish a billing ruleset (Class A)
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/ActorId"
        - $ref: "#/components/parameters/ActorType"
        - $ref: "#/components/parameters/PurposeOfUse"
        - $ref: "#/components/parameters/DeviceFingerprint"
        - $ref: "#/components/parameters/Decision"
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Ruleset published
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseRuleset"
        "404":
          $ref: "#/components/responses/NotFound"

# ============================================================================
# COMPONENTS
# ============================================================================
components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Keycloak-issued access token (forwarded by Envoy)

  parameters:
    TenantId:
      name: X-Tenant-Id
      in: header
      required: true
      description: Tenant identifier — injected by Envoy after TSHEPO authorisation
      schema:
        type: string
    CorrelationId:
      name: X-Correlation-Id
      in: header
      required: true
      description: End-to-end correlation ID for distributed tracing
      schema:
        type: string
        format: uuid
    ActorId:
      name: X-Actor-Id
      in: header
      required: true
      description: Authenticated actor (user or service) identifier
      schema:
        type: string
    ActorType:
      name: X-Actor-Type
      in: header
      required: true
      description: Type of actor making the request
      schema:
        type: string
        enum: [CITIZEN, PROVIDER, ADMIN, SYSTEM, SERVICE]
    PurposeOfUse:
      name: X-Purpose-Of-Use
      in: header
      required: true
      description: Why this request is being made
      schema:
        type: string
    DeviceFingerprint:
      name: X-Device-Fingerprint
      in: header
      required: true
      description: Device identity hash
      schema:
        type: string
    FacilityId:
      name: X-Facility-Id
      in: header
      required: false
      description: Facility scope (contextual)
      schema:
        type: string
        format: uuid
    WorkspaceId:
      name: X-Workspace-Id
      in: header
      required: false
      description: Workspace scope (contextual)
      schema:
        type: string
        format: uuid
    ShiftId:
      name: X-Shift-Id
      in: header
      required: false
      description: Duty shift scope (contextual)
      schema:
        type: string
        format: uuid
    Decision:
      name: X-Decision
      in: header
      required: false
      description: PDP decision header — ALLOW, DENY, STEP_UP_REQUIRED (Class A endpoints require ALLOW)
      schema:
        type: string
        enum: [ALLOW, DENY, STEP_UP_REQUIRED]
    Obligations:
      name: X-Obligations
      in: header
      required: false
      description: JSON obligations blob from TSHEPO
      schema:
        type: string
    PageNumber:
      name: page
      in: query
      schema:
        type: integer
        default: 0
    PageSize:
      name: size
      in: query
      schema:
        type: integer
        default: 20
        maximum: 100
    BillId:
      name: id
      in: path
      required: true
      description: Bill identifier
      schema:
        type: integer
        format: int64

  responses:
    BadRequest:
      description: Validation error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: Duplicate resource
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Missing or invalid trust headers
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: PDP denied the request (X-Decision=DENY)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:

    # ---- Requests ----------------------------------------------------------

    DraftBillRequest:
      type: object
      required: [encounterId, billType]
      properties:
        encounterId:
          type: integer
          format: int64
        msikaOrderId:
          type: string
          format: uuid
        billType:
          type: string
          enum: [OUTPATIENT, INPATIENT, EMERGENCY, PHARMACY, LAB, RADIOLOGY]

    AddBillLineRequest:
      type: object
      required: [msikaCode, description, kind, qty, costMethod]
      properties:
        msikaCode:
          type: string
        description:
          type: string
        kind:
          type: string
          enum: [SERVICE, PRODUCT, PROCEDURE, CONSULTATION, FEE]
        qty:
          type: number
          format: double
        costMethod:
          type: string
          enum: [TARIFF, COST_PLUS, FIXED, ZERO_RATED]
        sourceEvent:
          type: string
        sourceRef:
          type: string
        context:
          type: object
          additionalProperties: true

    ApproveBillRequest:
      type: object
      properties:
        note:
          type: string

    CreatePaymentIntentRequest:
      type: object
      required: [paymentType, amount]
      properties:
        paymentType:
          type: string
          enum: [CASH, CARD, MOBILE_MONEY, INSURANCE, VOUCHER]
        amount:
          type: number
          format: double

    RefundRequest:
      type: object
      required: [amount, reason, reasonCode, refundType]
      properties:
        amount:
          type: number
          format: double
        reason:
          type: string
        reasonCode:
          type: string
        refundType:
          type: string
          enum: [FULL, PARTIAL, CREDIT_NOTE]

    CostEstimateRequest:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/EstimateItem"
        exemptionCategory:
          type: string
        insurancePlanId:
          type: string
          format: uuid
        context:
          type: object
          additionalProperties: true

    EstimateItem:
      type: object
      required: [msikaCode, qty]
      properties:
        msikaCode:
          type: string
        qty:
          type: number
          format: double

    # ---- Response wrappers -------------------------------------------------

    ApiResponseBillResponse:
      type: object
      properties:
        success:
          type: boolean
        correlationId:
          type: string
          format: uuid
        data:
          $ref: "#/components/schemas/BillResponse"

    ApiResponsePaymentIntentResponse:
      type: object
      properties:
        success:
          type: boolean
        correlationId:
          type: string
          format: uuid
        data:
          $ref: "#/components/schemas/PaymentIntentResponse"

    ApiResponseCostEstimate:
      type: object
      properties:
        success:
          type: boolean
        correlationId:
          type: string
          format: uuid
        data:
          $ref: "#/components/schemas/CostEstimate"

    ApiResponsePagedCostaTariff:
      type: object
      properties:
        success:
          type: boolean
        correlationId:
          type: string
          format: uuid
        data:
          $ref: "#/components/schemas/PagedCostaTariff"

    ApiResponseGeneric:
      type: object
      properties:
        success:
          type: boolean
        correlationId:
          type: string
          format: uuid
        data:
          $ref: "#/components/schemas/GenericResponse"

    ApiResponsePagedRuleset:
      type: object
      properties:
        success:
          type: boolean
        correlationId:
          type: string
          format: uuid
        data:
          $ref: "#/components/schemas/PagedRuleset"

    ApiResponseRuleset:
      type: object
      properties:
        success:
          type: boolean
        correlationId:
          type: string
          format: uuid
        data:
          $ref: "#/components/schemas/Ruleset"

    # ---- Domain objects ----------------------------------------------------

    BillResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        billRef:
          type: string
        encounterId:
          type: integer
          format: int64
        msikaOrderId:
          type: string
          format: uuid
        billType:
          type: string
        status:
          type: string
          enum: [DRAFT, PENDING_APPROVAL, APPROVED, FINALIZED, INVOICED, PAID, PARTIALLY_PAID, REFUNDED, CANCELLED]
        grossAmount:
          type: number
          format: double
        discountAmount:
          type: number
          format: double
        netAmount:
          type: number
          format: double
        currency:
          type: string
        lines:
          type: array
          items:
            $ref: "#/components/schemas/BillLine"
        parties:
          type: array
          items:
            $ref: "#/components/schemas/BillParty"
        approvedBy:
          type: string
        approvalNote:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    BillLine:
      type: object
      properties:
        id:
          type: integer
          format: int64
        msikaCode:
          type: string
        description:
          type: string
        kind:
          type: string
        qty:
          type: number
          format: double
        unitPrice:
          type: number
          format: double
        lineTotal:
          type: number
          format: double
        costMethod:
          type: string
        sourceEvent:
          type: string
        sourceRef:
          type: string

    BillParty:
      type: object
      properties:
        partyType:
          type: string
          enum: [PATIENT, INSURER, EMPLOYER, GUARANTOR]
        partyId:
          type: string
        shareAmount:
          type: number
          format: double
        sharePercent:
          type: number
          format: double

    PaymentIntentResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        billId:
          type: integer
          format: int64
        paymentType:
          type: string
        amount:
          type: number
          format: double
        currency:
          type: string
        status:
          type: string
          enum: [PENDING, PROCESSING, SUCCEEDED, FAILED, CANCELLED]
        gatewayRef:
          type: string
        createdAt:
          type: string
          format: date-time

    CostEstimate:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/EstimatedItem"
        grossTotal:
          type: number
          format: double
        discountTotal:
          type: number
          format: double
        netTotal:
          type: number
          format: double
        currency:
          type: string
        exemptionApplied:
          type: boolean
        estimatedAt:
          type: string
          format: date-time

    EstimatedItem:
      type: object
      properties:
        msikaCode:
          type: string
        description:
          type: string
        qty:
          type: number
          format: double
        unitPrice:
          type: number
          format: double
        lineTotal:
          type: number
          format: double

    CostaTariff:
      type: object
      properties:
        id:
          type: integer
          format: int64
        msikaCode:
          type: string
        description:
          type: string
        unitPrice:
          type: number
          format: double
        currency:
          type: string
        effectiveFrom:
          type: string
          format: date
