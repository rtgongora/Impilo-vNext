components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    TenantId:
      name: X-Tenant-ID
      in: header
      required: true
      schema:
        type: string
        format: uuid
    PodId:
      name: X-Pod-ID
      in: header
      required: true
      schema:
        type: string
    RequestId:
      name: X-Request-ID
      in: header
      required: true
      schema:
        type: string
        format: uuid
    CorrelationId:
      name: X-Correlation-ID
      in: header
      required: true
      schema:
        type: string
        format: uuid

  schemas:
    ProbeHealthBody:
      type: object
      properties:
        service:
          type: string
          example: costa
        status:
          type: string
          example: UP
        tenant_id:
          type: string
        pod_id:
          type: string
        request_id:
          type: string
        correlation_id:
          type: string
      additionalProperties: true

    ProbeCommandBody:
      type: object
      properties:
        service:
          type: string
        action:
          type: string
        request_id:
          type: string
        correlation_id:
          type: string
        echo:
          type: object
          additionalProperties: true
      additionalProperties: true

    ApiResponseEnvelope:
      type: object
      description: Standard ApiResponse wrapper (data + meta.correlation_id)
      properties:
        data:
          description: Response payload
        meta:
          type: object
          properties:
            correlation_id:
              type: string
      additionalProperties: true

    BillDraftRequest:
      type: object
      properties:
        encounterId: { type: string }
        msikaOrderId: { type: string }
        billType:
          type: string
          description: BillType enum name (e.g. ENCOUNTER)

    PostLineRequest:
      type: object
      properties:
        msikaCode: { type: string }
        description: { type: string }
        kind: { type: string }
        qty: { type: number }
        costMethod: { type: string }
        sourceEvent: { type: string }
        sourceRef: { type: string }
        context:
          type: object
          additionalProperties: true

    ApprovalRequest:
      type: object
      properties:
        note: { type: string }

    PaymentIntentRequest:
      type: object
      required: [paymentType, amount]
      properties:
        paymentType: { type: string }
        amount: { type: number }

    RefundRequest:
      type: object
      required: [amount]
      properties:
        amount: { type: number }
        reason: { type: string }
        reasonCode: { type: string }
        refundType: { type: string }

    EstimateRequest:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            type: object
            required: [msikaCode, kind, qty]
            properties:
              msikaCode: { type: string }
              description: { type: string }
              kind: { type: string }
              qty: { type: number }
              costMethod: { type: string }
              extras:
                type: object
                additionalProperties: true
        exemptionCategory: { type: string }
        insurancePlanId: { type: integer, format: int64 }
        context:
          type: object
          additionalProperties: true

    ApiResponsePagedBillHeader:
      allOf:
        - $ref: "#/components/schemas/ApiResponseEnvelope"
    ApiResponseBillHeader:
      allOf:
        - $ref: "#/components/schemas/ApiResponseEnvelope"
    ApiResponseBillAggregate:
      allOf:
        - $ref: "#/components/schemas/ApiResponseEnvelope"
    ApiResponseBillLine:
      allOf:
        - $ref: "#/components/schemas/ApiResponseEnvelope"
    ApiResponseBillLineNullable:
      allOf:
        - $ref: "#/components/schemas/ApiResponseEnvelope"
    ApiResponseInvoice:
      allOf:
        - $ref: "#/components/schemas/ApiResponseEnvelope"
    ApiResponsePayment:
      allOf:
        - $ref: "#/components/schemas/ApiResponseEnvelope"
    ApiResponsePaymentList:
      allOf:
        - $ref: "#/components/schemas/ApiResponseEnvelope"
    ApiResponseRefund:
      allOf:
        - $ref: "#/components/schemas/ApiResponseEnvelope"
    ApiResponseRefundList:
      allOf:
        - $ref: "#/components/schemas/ApiResponseEnvelope"
    ApiResponsePagedClaimPack:
      allOf:
        - $ref: "#/components/schemas/ApiResponseEnvelope"
    ApiResponseClaimPack:
      allOf:
        - $ref: "#/components/schemas/ApiResponseEnvelope"
    ApiResponsePagedPayment:
      allOf:
        - $ref: "#/components/schemas/ApiResponseEnvelope"
    ApiResponseEstimateResult:
      allOf:
        - $ref: "#/components/schemas/ApiResponseEnvelope"
    ApiResponsePagedTariff:
      allOf:
        - $ref: "#/components/schemas/ApiResponseEnvelope"
    ApiResponseTariffList:
      allOf:
        - $ref: "#/components/schemas/ApiResponseEnvelope"
    ApiResponsePagedRuleset:
      allOf:
        - $ref: "#/components/schemas/ApiResponseEnvelope"
    ApiResponseRuleset:
      allOf:
        - $ref: "#/components/schemas/ApiResponseEnvelope"
    ApiResponseBillAudit:
      allOf:
        - $ref: "#/components/schemas/ApiResponseEnvelope"
