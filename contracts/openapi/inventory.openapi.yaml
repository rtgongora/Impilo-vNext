openapi: 3.0.3
info:
  title: Inventory & Supply Chain Service API
  description: |
    Inventory and supply chain management service for the Impilo vNext platform.
    Manages stock items, on-hand positions (FEFO), ledger movements (receipt,
    issue, transfer, adjust, wastage, return), stock counts with approval workflow,
    requisitions, shift handover, and reconciliation against external eLMIS systems.

    All requests must include trust headers (X-Tenant-Id, X-Actor-Id, X-Correlation-Id,
    X-Facility-Id, etc.) which are validated by Envoy ext_authz -> TSHEPO before
    reaching this service.
  version: 1.0.0
  contact:
    name: Impilo Platform Team
  license:
    name: Proprietary

servers:
  - url: http://localhost:8098
    description: Local development
  - url: http://localhost:10000
    description: Envoy gateway (local)

security:
  - bearerAuth: []

tags:
  - name: Items
    description: Item master management and barcode lookup
  - name: Stock On-Hand
    description: Current stock positions, near-expiry, and stockout risk
  - name: Ledger
    description: Stock movement ledger (receipt, issue, transfer, adjust, wastage, return)
  - name: FEFO
    description: First-Expiry-First-Out batch suggestions
  - name: Stock Counts
    description: Physical stock count sessions with approval workflow
  - name: Requisitions
    description: Requisition lifecycle (create, submit, approve, reject, fulfill)
  - name: Handover
    description: Shift handover with dual-signature verification
  - name: Reconciliation
    description: Stock reconciliation against external eLMIS systems
  - name: Internal
    description: Internal integration endpoints (capability refresh, consumption feeds, stores/bins)

paths:
  /v1/items:
    post:
      operationId: createItem
      summary: Create an inventory item
      description: |
        Registers a new item in the inventory master. Each item has a unique
        item code within a tenant. Publishes inventory.item.created event.
      tags:
        - Items
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateItemRequest'
      responses:
        '201':
          description: Item created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Item'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/items/import:
    post:
      operationId: importItems
      summary: Bulk import inventory items
      description: |
        Imports multiple items in a single operation. Items that already exist
        (by itemCode within the tenant) are updated; new items are created.
        Returns a summary of imported, updated, skipped, and errored rows.
      tags:
        - Items
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ItemImportRequest'
      responses:
        '200':
          description: Import completed
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/ImportResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/items/lookup-by-barcode:
    get:
      operationId: lookupItemByBarcode
      summary: Look up item by barcode
      description: |
        Decodes a GS1/GTIN/EAN barcode and returns matching item details
        including batch number and expiry date extracted from the barcode.
        Used during receipt, count, and issue workflows.
      tags:
        - Items
      parameters:
        - name: code
          in: query
          required: true
          schema:
            type: string
          description: Barcode string (GS1, GTIN-14, GTIN-13, EAN, etc.)
      responses:
        '200':
          description: Barcode decoded
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/BarcodeResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Barcode not recognized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
  /v1/items/{itemCode}:
    get:
      operationId: getItem
      summary: Get item by code
      description: Returns the full item master record for the given item code.
      tags:
        - Items
      parameters:
        - name: itemCode
          in: path
          required: true
          schema:
            type: string
          description: Unique item code
      responses:
        '200':
          description: Item found
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Item'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/onhand:
    get:
      operationId: getOnHand
      summary: Get stock on-hand positions
      description: |
        Returns paginated stock-on-hand positions for the given facility/store.
        Each row represents a unique (itemCode, batchNumber, storeId, binId)
        combination. Supports filtering by item code, category, store, and bin.
      tags:
        - Stock On-Hand
      parameters:
        - $ref: '#/components/parameters/FacilityIdQuery'
        - name: storeId
          in: query
          schema:
            type: string
            format: uuid
          description: Filter by store
        - name: itemCode
          in: query
          schema:
            type: string
          description: Filter by item code
        - name: category
          in: query
          schema:
            type: string
          description: Filter by item category
        - name: belowReorder
          in: query
          schema:
            type: boolean
          description: Only return items below reorder point
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
      responses:
        '200':
          description: On-hand positions
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/PagedOnHand'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/onhand/near-expiry:
    get:
      operationId: getNearExpiry
      summary: Get near-expiry stock
      description: |
        Returns items expiring within the configurable threshold (default 90 days).
        Sorted by expiry date ascending (soonest first). Used for FEFO compliance
        monitoring and wastage prevention.
      tags:
        - Stock On-Hand
      parameters:
        - $ref: '#/components/parameters/FacilityIdQuery'
        - name: storeId
          in: query
          schema:
            type: string
            format: uuid
        - name: daysThreshold
          in: query
          schema:
            type: integer
            minimum: 1
            default: 90
          description: Number of days until expiry to consider near-expiry
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
      responses:
        '200':
          description: Near-expiry items
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/PagedOnHand'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/onhand/stockouts:
    get:
      operationId: getStockouts
      summary: Get stockout risk items
      description: |
        Returns items that are either stocked out (qty=0) or at risk of
        stockout based on average daily consumption and days-of-stock remaining.
        Sorted by days-of-stock ascending (most urgent first).
      tags:
        - Stock On-Hand
      parameters:
        - $ref: '#/components/parameters/FacilityIdQuery'
        - name: storeId
          in: query
          schema:
            type: string
            format: uuid
        - name: daysOfStockThreshold
          in: query
          schema:
            type: integer
            minimum: 0
            default: 14
          description: Items with fewer days of stock than this are included
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
      responses:
        '200':
          description: Stockout risk items
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/PagedStockoutRisk'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/ledger/receipt:
    post:
      operationId: postReceipt
      summary: Record stock receipt
      description: |
        Records receipt of goods into inventory. Increases on-hand quantity.
        Validates batch number and expiry. Publishes inventory.ledger.receipt event.
      tags:
        - Ledger
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReceiptRequest'
      responses:
        '201':
          description: Receipt recorded
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/LedgerEvent'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/ledger/issue:
    post:
      operationId: postIssue
      summary: Record stock issue
      description: |
        Records issue of goods from inventory. Decreases on-hand quantity.
        Validates sufficient stock available. Publishes inventory.ledger.issue event.
      tags:
        - Ledger
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IssueRequest'
      responses:
        '201':
          description: Issue recorded
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/LedgerEvent'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/ledger/transfer:
    post:
      operationId: postTransfer
      summary: Record inter-store transfer
      description: |
        Records a transfer of goods between stores or facilities. Decreases
        on-hand at source and increases at destination. Publishes
        inventory.ledger.transfer event.
      tags:
        - Ledger
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransferRequest'
      responses:
        '201':
          description: Transfer recorded
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/LedgerEvent'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/ledger/adjust:
    post:
      operationId: postAdjust
      summary: Record stock adjustment
      description: |
        Records an inventory adjustment (positive or negative). Used for
        corrections, count reconciliation, and opening balances. Requires
        a reason. Publishes inventory.ledger.adjustment event.
      tags:
        - Ledger
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdjustRequest'
      responses:
        '201':
          description: Adjustment recorded
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/LedgerEvent'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/ledger/wastage:
    post:
      operationId: postWastage
      summary: Record stock wastage
      description: |
        Records wastage/disposal of expired, damaged, or contaminated stock.
        Decreases on-hand. Requires disposal method and optional witness for
        controlled items. Publishes inventory.ledger.wastage event.
      tags:
        - Ledger
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WastageRequest'
      responses:
        '201':
          description: Wastage recorded
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/LedgerEvent'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/ledger/return:
    post:
      operationId: postReturn
      summary: Record stock return
      description: |
        Records return of goods to supplier or return to stock from department.
        Increases on-hand if returned to stock; records supplier return for
        audit. Publishes inventory.ledger.return event.
      tags:
        - Ledger
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReturnRequest'
      responses:
        '201':
          description: Return recorded
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/LedgerEvent'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/ledger:
    get:
      operationId: queryLedger
      summary: Query ledger events
      description: |
        Returns paginated ledger events filtered by item, store, movement type,
        and date range. Events are sorted by timestamp descending (newest first).
      tags:
        - Ledger
      parameters:
        - $ref: '#/components/parameters/FacilityIdQuery'
        - name: storeId
          in: query
          schema:
            type: string
            format: uuid
        - name: itemCode
          in: query
          schema:
            type: string
        - name: movementType
          in: query
          schema:
            $ref: '#/components/schemas/MovementType'
        - name: from
          in: query
          schema:
            type: string
            format: date-time
          description: Start of date range (inclusive)
        - name: to
          in: query
          schema:
            type: string
            format: date-time
          description: End of date range (inclusive)
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
      responses:
        '200':
          description: Ledger events
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/PagedLedgerEvent'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/fefo/suggest:
    post:
      operationId: suggestFefo
      summary: Get FEFO batch suggestions
      description: |
        Returns the optimal batch(es) to pick for a given item and quantity
        using First-Expiry-First-Out logic. Each suggestion includes batch
        number, expiry date, available quantity, and bin location.
      tags:
        - FEFO
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FefoSuggestRequest'
      responses:
        '200':
          description: FEFO suggestions
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/FefoSuggestion'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/counts:
    post:
      operationId: createCount
      summary: Create a stock count session
      description: |
        Creates a new stock count session for a store. The session is initialized
        with expected lines based on current on-hand positions. Status is DRAFT.
        Publishes inventory.count.created event.
      tags:
        - Stock Counts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCountRequest'
      responses:
        '201':
          description: Count session created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/StockCount'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/counts/{id}:
    get:
      operationId: getCount
      summary: Get stock count session
      description: Returns the full stock count session including all count lines with variances.
      tags:
        - Stock Counts
      parameters:
        - $ref: '#/components/parameters/CountIdPath'
      responses:
        '200':
          description: Stock count detail
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/StockCount'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/counts/{id}/start:
    post:
      operationId: startCount
      summary: Start a stock count session
      description: |
        Transitions the session from DRAFT to IN_PROGRESS. Snapshots current
        system-on-hand quantities as the expected values. Publishes
        inventory.count.started event.
      tags:
        - Stock Counts
      parameters:
        - $ref: '#/components/parameters/CountIdPath'
      responses:
        '200':
          description: Count started
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/StockCount'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/counts/{id}/lines/{lineId}:
    post:
      operationId: recordCountLine
      summary: Record a count line entry
      description: |
        Records the physical count for a specific line item. Includes the
        counted quantity and optional barcode scan. Calculates variance
        against expected quantity.
      tags:
        - Stock Counts
      parameters:
        - $ref: '#/components/parameters/CountIdPath'
        - name: lineId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Count line ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecordCountLineRequest'
      responses:
        '200':
          description: Count line recorded
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/CountLine'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/counts/{id}/submit:
    post:
      operationId: submitCount
      summary: Submit stock count for approval
      description: |
        Transitions the session from IN_PROGRESS to SUBMITTED. All lines must
        have a counted value. Publishes inventory.count.submitted event.
      tags:
        - Stock Counts
      parameters:
        - $ref: '#/components/parameters/CountIdPath'
      responses:
        '200':
          description: Count submitted
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/StockCount'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/counts/{id}/approve:
    post:
      operationId: approveCount
      summary: Approve stock count
      description: |
        Approves the stock count, auto-generating ledger adjustments for each
        variance. Transitions to APPROVED. Publishes inventory.count.approved
        event.
      tags:
        - Stock Counts
      parameters:
        - $ref: '#/components/parameters/CountIdPath'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApproveCountRequest'
      responses:
        '200':
          description: Count approved
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/StockCount'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/counts/{id}/reject:
    post:
      operationId: rejectCount
      summary: Reject stock count
      description: |
        Rejects the stock count, requiring a re-count. Transitions to REJECTED.
        Publishes inventory.count.rejected event.
      tags:
        - Stock Counts
      parameters:
        - $ref: '#/components/parameters/CountIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RejectCountRequest'
      responses:
        '200':
          description: Count rejected
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/StockCount'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/requisitions:
    post:
      operationId: createRequisition
      summary: Create a requisition
      description: |
        Creates a new requisition in DRAFT status. Requisitions request stock
        from a supplying facility or store. Includes line items with requested
        quantities. Publishes inventory.requisition.created event.
      tags:
        - Requisitions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRequisitionRequest'
      responses:
        '201':
          description: Requisition created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Requisition'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/requisitions/{id}/submit:
    post:
      operationId: submitRequisition
      summary: Submit requisition for approval
      description: |
        Transitions the requisition from DRAFT to SUBMITTED. Publishes
        inventory.requisition.submitted event.
      tags:
        - Requisitions
      parameters:
        - $ref: '#/components/parameters/RequisitionIdPath'
      responses:
        '200':
          description: Requisition submitted
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Requisition'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/requisitions/{id}/approve:
    post:
      operationId: approveRequisition
      summary: Approve a requisition
      description: |
        Approves the requisition with optional quantity adjustments per line.
        Transitions to APPROVED. Publishes inventory.requisition.approved event.
      tags:
        - Requisitions
      parameters:
        - $ref: '#/components/parameters/RequisitionIdPath'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApproveRequisitionRequest'
      responses:
        '200':
          description: Requisition approved
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Requisition'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/requisitions/{id}/reject:
    post:
      operationId: rejectRequisition
      summary: Reject a requisition
      description: |
        Rejects the requisition with a reason. Transitions to REJECTED.
        Publishes inventory.requisition.rejected event.
      tags:
        - Requisitions
      parameters:
        - $ref: '#/components/parameters/RequisitionIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RejectRequisitionRequest'
      responses:
        '200':
          description: Requisition rejected
          content:
            application/json:
              schema:
                allOf:
