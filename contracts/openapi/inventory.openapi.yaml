components:
  # ── Security ─────────────────────────────────────────────────────────────
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Keycloak-issued JWT token

  # ── Parameters ─────────────────────────────────────────────────────────────
  parameters:
    FacilityIdQuery:
      name: facilityId
      in: query
      schema:
        type: string
        format: uuid
      description: Facility ID to filter by

    CountIdPath:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Stock count session ID

    RequisitionIdPath:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Requisition ID

    HandoverIdPath:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Handover ID

    PageParam:
      name: page
      in: query
      schema:
        type: integer
        minimum: 0
        default: 0
      description: Zero-based page number

    SizeParam:
      name: size
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
      description: Page size

  # ── Responses ──────────────────────────────────────────────────────────────
  responses:
    BadRequest:
      description: Invalid request parameters or body
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiResponse"

    Unauthorized:
      description: Missing or invalid authentication token
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiResponse"

    Forbidden:
      description: Insufficient permissions for this operation
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiResponse"

    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiResponse"

    Conflict:
      description: State conflict (e.g., invalid status transition)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiResponse"

  # ── Schemas ────────────────────────────────────────────────────────────────
  schemas:
    # -- Enumerations --
    MovementType:
      type: string
      enum:
        - RECEIPT
        - ISSUE
        - TRANSFER
        - ADJUSTMENT
        - WASTAGE
        - RETURN
        - CONSUMPTION
      description: Type of stock movement recorded in the ledger

    ItemCategory:
      type: string
      enum:
        - PHARMACEUTICAL
        - MEDICAL_SUPPLY
        - LAB_REAGENT
        - EQUIPMENT
        - CLINICAL_SUPPLY
        - GENERAL
      description: Category classification for inventory items

    CountStatus:
      type: string
      enum:
        - DRAFT
        - IN_PROGRESS
        - SUBMITTED
        - APPROVED
        - REJECTED
      description: Stock count session lifecycle states

    RequisitionStatus:
      type: string
      enum:
        - DRAFT
        - SUBMITTED
        - APPROVED
        - REJECTED
        - FULFILLED
        - PARTIALLY_FULFILLED
        - CANCELLED
      description: Requisition lifecycle states

    HandoverStatus:
      type: string
      enum:
        - PENDING_OUTGOING_SIGN
        - PENDING_INCOMING_SIGN
        - COMPLETED
        - CANCELLED
      description: Shift handover lifecycle states

    ReconcileStatus:
      type: string
      enum:
        - PENDING
        - RESOLVED
        - EXPIRED
      description: Reconciliation entry status

    AdjustmentAction:
      type: string
      enum:
        - ACCEPT_INTERNAL
        - ACCEPT_EXTERNAL
        - MANUAL_ADJUST
      description: Reconciliation resolution action

    DisposalMethod:
      type: string
      enum:
        - INCINERATION
        - CHEMICAL
        - RETURN_TO_SUPPLIER
        - OTHER
      description: Wastage disposal method

    StoreType:
      type: string
      enum:
        - MAIN_WAREHOUSE
        - PHARMACY_STORE
        - WARD_CUPBOARD
        - COLD_CHAIN
        - QUARANTINE
        - LAB_STORE
      description: Type of inventory store

    # -- Item --
    Item:
      type: object
      required:
        - id
        - tenantId
        - itemCode
        - name
        - category
        - unitOfMeasure
        - active
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        itemCode:
          type: string
          description: Unique item code within tenant
        name:
          type: string
          description: Item display name
        description:
          type: string
          nullable: true
        category:
          $ref: "#/components/schemas/ItemCategory"
        unitOfMeasure:
          type: string
          description: Unit (e.g., "TAB", "VIAL", "BOX", "ML", "PAIR")
        barcode:
          type: string
          nullable: true
          description: Primary barcode (GTIN)
        manufacturer:
          type: string
          nullable: true
        reorderPoint:
          type: integer
          nullable: true
          description: Quantity at which reorder alert triggers
        reorderQuantity:
          type: integer
          nullable: true
          description: Default quantity for reorder requisitions
        maxStockLevel:
          type: integer
          nullable: true
          description: Maximum stock level for the item
        coldChainRequired:
          type: boolean
          default: false
        controlledSubstance:
          type: boolean
          default: false
        active:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateItemRequest:
      type: object
      required:
        - itemCode
        - name
        - category
        - unitOfMeasure
      properties:
        itemCode:
          type: string
          minLength: 1
        name:
          type: string
          minLength: 1
        description:
          type: string
        category:
          $ref: "#/components/schemas/ItemCategory"
        unitOfMeasure:
          type: string
          minLength: 1
        barcode:
          type: string
        manufacturer:
          type: string
        reorderPoint:
          type: integer
          minimum: 0
        reorderQuantity:
          type: integer
          minimum: 1
        maxStockLevel:
          type: integer
          minimum: 1
        coldChainRequired:
          type: boolean
        controlledSubstance:
          type: boolean

    ItemImportRequest:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/CreateItemRequest"

    ImportResult:
      type: object
      required:
        - imported
        - updated
        - skipped
        - errors
      properties:
        imported:
          type: integer
        updated:
          type: integer
        skipped:
          type: integer
        errors:
          type: array
          items:
            type: string

    BarcodeResult:
      type: object
      required:
        - itemCode
        - itemName
      properties:
        itemCode:
          type: string
        itemName:
          type: string
        category:
          $ref: "#/components/schemas/ItemCategory"
        unitOfMeasure:
          type: string
        batchNumber:
          type: string
          nullable: true
        expiryDate:
          type: string
          format: date
          nullable: true
        manufacturer:
          type: string
          nullable: true
        gtin:
          type: string
          nullable: true

    # -- On-Hand --
    OnHandPosition:
      type: object
      required:
        - id
        - tenantId
        - facilityId
        - storeId
        - itemCode
        - itemName
        - batchNumber
        - expiryDate
        - quantityOnHand
        - quantityReserved
        - quantityAvailable
      properties:
        id:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        facilityId:
          type: string
          format: uuid
        storeId:
          type: string
          format: uuid
        storeName:
          type: string
          nullable: true
        binId:
          type: string
          format: uuid
          nullable: true
        binCode:
          type: string
          nullable: true
        itemCode:
          type: string
        itemName:
          type: string
        category:
          $ref: "#/components/schemas/ItemCategory"
        unitOfMeasure:
          type: string
          nullable: true
        batchNumber:
          type: string
        expiryDate:
          type: string
          format: date
        quantityOnHand:
          type: integer
          description: Total physical quantity
        quantityReserved:
          type: integer
          description: Quantity reserved for pending issues
        quantityAvailable:
          type: integer
          description: quantityOnHand - quantityReserved
        reorderPoint:
          type: integer
          nullable: true
        belowReorder:
          type: boolean
          description: Whether quantity is below reorder point
        updatedAt:
          type: string
          format: date-time

    StockoutRisk:
      type: object
      required:
        - itemCode
        - itemName
        - totalOnHand
        - avgDailyConsumption
        - daysOfStock
        - facilityId
        - storeId
      properties:
        itemCode:
          type: string
        itemName:
          type: string
        category:
          $ref: "#/components/schemas/ItemCategory"
        totalOnHand:
          type: integer
        avgDailyConsumption:
          type: number
          format: double
        daysOfStock:
          type: number
          format: double
          description: Estimated days until stockout
        reorderPoint:
          type: integer
          nullable: true
        facilityId:
          type: string
          format: uuid
        storeId:
          type: string
          format: uuid
        storeName:
          type: string
          nullable: true
        isStockedOut:
          type: boolean

    # -- Ledger --
    LedgerEvent:
      type: object
      required:
        - id
        - tenantId
        - facilityId
        - storeId
        - itemCode
        - itemName
        - movementType
        - quantity
        - balanceAfter
        - timestamp
        - actorId
      properties:
        id:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        facilityId:
          type: string
          format: uuid
        storeId:
          type: string
          format: uuid
        storeName:
          type: string
          nullable: true
        binId:
          type: string
          format: uuid
          nullable: true
        itemCode:
          type: string
        itemName:
          type: string
        batchNumber:
          type: string
          nullable: true
        expiryDate:
          type: string
          format: date
          nullable: true
        movementType:
          $ref: "#/components/schemas/MovementType"
        quantity:
          type: integer
          description: Signed quantity (+receipt/-issue)
        balanceAfter:
          type: integer
          description: On-hand balance after this movement
        reason:
          type: string
          nullable: true
        referenceType:
          type: string
          nullable: true
          description: Reference context (REQUISITION, DISPENSE, COUNT, TRANSFER, etc.)
        referenceId:
          type: string
          format: uuid
          nullable: true
          description: ID of the source document
        sourceStoreId:
          type: string
          format: uuid
          nullable: true
          description: Source store (for transfers)
        destinationStoreId:
          type: string
          format: uuid
          nullable: true
          description: Destination store (for transfers)
        disposalMethod:
          $ref: "#/components/schemas/DisposalMethod"
        witnessId:
          type: string
          format: uuid
          nullable: true
        actorId:
          type: string
          format: uuid
        timestamp:
          type: string
          format: date-time
        notes:
          type: string
          nullable: true

    ReceiptRequest:
      type: object
      required:
        - storeId
        - itemCode
        - batchNumber
        - expiryDate
        - quantity
      properties:
        storeId:
          type: string
          format: uuid
        binId:
          type: string
          format: uuid
        itemCode:
          type: string
        batchNumber:
          type: string
        expiryDate:
          type: string
          format: date
        quantity:
          type: integer
          minimum: 1
        supplierName:
          type: string
        deliveryNote:
          type: string
        notes:
          type: string

    IssueRequest:
      type: object
      required:
        - storeId
        - itemCode
        - batchNumber
        - quantity
      properties:
        storeId:
          type: string
          format: uuid
        binId:
          type: string
          format: uuid
        itemCode:
          type: string
        batchNumber:
          type: string
        quantity:
          type: integer
          minimum: 1
        issuedTo:
          type: string
          description: Department or person issued to
        reason:
          type: string
        notes:
          type: string

    TransferRequest:
      type: object
      required:
        - sourceStoreId
        - destinationStoreId
        - itemCode
        - batchNumber
        - quantity
      properties:
        sourceStoreId:
          type: string
          format: uuid
        sourceBinId:
          type: string
          format: uuid
        destinationStoreId:
          type: string
          format: uuid
        destinationBinId:
          type: string
          format: uuid
        itemCode:
          type: string
        batchNumber:
          type: string
        expiryDate:
          type: string
          format: date
        quantity:
          type: integer
          minimum: 1
        reason:
          type: string
        notes:
          type: string

    AdjustRequest:
      type: object
      required:
        - storeId
        - itemCode
        - batchNumber
        - quantity
        - reason
      properties:
        storeId:
          type: string
          format: uuid
        binId:
          type: string
          format: uuid
        itemCode:
          type: string
        batchNumber:
          type: string
        expiryDate:
          type: string
          format: date
        quantity:
          type: integer
          description: Signed quantity (+positive or -negative adjustment)
        reason:
          type: string
          minLength: 1
        referenceType:
          type: string
          description: Source of adjustment (COUNT, RECONCILE, MANUAL)
        referenceId:
          type: string
          format: uuid
        notes:
          type: string

    WastageRequest:
      type: object
      required:
        - storeId
        - itemCode
        - batchNumber
        - quantity
        - reason
        - disposalMethod
      properties:
        storeId:
          type: string
          format: uuid
        binId:
          type: string
          format: uuid
        itemCode:
          type: string
        batchNumber:
          type: string
        quantity:
          type: integer
          minimum: 1
        reason:
          type: string
          minLength: 1
        disposalMethod:
          $ref: "#/components/schemas/DisposalMethod"
        witnessId:
          type: string
          format: uuid
          description: Required for controlled substances
        notes:
          type: string

    ReturnRequest:
      type: object
      required:
        - storeId
        - itemCode
        - batchNumber
        - quantity
        - reason
        - returnType
      properties:
        storeId:
          type: string
          format: uuid
        binId:
          type: string
          format: uuid
        itemCode:
          type: string
        batchNumber:
          type: string
        expiryDate:
          type: string
          format: date
        quantity:
          type: integer
          minimum: 1
        reason:
          type: string
          minLength: 1
        returnType:
          type: string
          enum:
            - RETURN_TO_STOCK
            - RETURN_TO_SUPPLIER
          description: Whether items go back on shelf or back to supplier
        condition:
          type: string
          enum:
            - INTACT
            - DAMAGED
            - EXPIRED
        notes:
          type: string

    # -- FEFO --
    FefoSuggestRequest:
      type: object
      required:
        - storeId
        - itemCode
        - quantityNeeded
      properties:
        storeId:
          type: string
          format: uuid
        itemCode:
          type: string
        quantityNeeded:
          type: integer
          minimum: 1

    FefoSuggestion:
      type: object
      required:
        - batchNumber
        - expiryDate
        - quantityAvailable
        - suggestedPickQty
      properties:
        batchNumber:
          type: string
        expiryDate:
          type: string
          format: date
        quantityAvailable:
          type: integer
        suggestedPickQty:
          type: integer
          description: Quantity to pick from this batch
        binId:
          type: string
          format: uuid
          nullable: true
        binCode:
          type: string
          nullable: true
          description: Bin location label

    # -- Stock Count --
    StockCount:
      type: object
      required:
        - id
        - tenantId
        - facilityId
        - storeId
        - status
        - lines
        - createdBy
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        facilityId:
          type: string
          format: uuid
        storeId:
          type: string
          format: uuid
        storeName:
          type: string
          nullable: true
        status:
          $ref: "#/components/schemas/CountStatus"
        countType:
          type: string
          enum:
            - FULL
            - CYCLE
            - SPOT
          description: Type of count (full physical, cycle, or spot check)
        lines:
          type: array
          items:
            $ref: "#/components/schemas/CountLine"
        totalLines:
          type: integer
        countedLines:
          type: integer
        totalVariance:
          type: integer
          description: Sum of absolute variances
        createdBy:
          type: string
          format: uuid
        approvedBy:
          type: string
          format: uuid
          nullable: true
        rejectedBy:
          type: string
          format: uuid
          nullable: true
        rejectionReason:
          type: string
          nullable: true
        notes:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        startedAt:
          type: string
          format: date-time
          nullable: true
        submittedAt:
          type: string
          format: date-time
          nullable: true
        completedAt:
          type: string
          format: date-time
          nullable: true
        updatedAt:
          type: string
          format: date-time

    CountLine:
      type: object
      required:
        - id
        - countId
        - itemCode
        - itemName
        - batchNumber
        - expectedQty
      properties:
        id:
          type: string
          format: uuid
        countId:
          type: string
          format: uuid
        itemCode:
          type: string
        itemName:
          type: string
        batchNumber:
          type: string
        expiryDate:
          type: string
          format: date
          nullable: true
        binCode:
          type: string
          nullable: true
        expectedQty:
          type: integer
          description: System on-hand at time of count start
        countedQty:
          type: integer
          nullable: true
          description: Physical count entered by operator
        variance:
          type: integer
          nullable: true
          description: countedQty - expectedQty
        barcodeScan:
          type: string
          nullable: true
          description: Barcode scan during count
        notes:
          type: string
          nullable: true
        countedAt:
          type: string
          format: date-time
          nullable: true
        countedBy:
          type: string
          format: uuid
          nullable: true

    CreateCountRequest:
      type: object
      required:
        - storeId
        - countType
      properties:
        storeId:
          type: string
          format: uuid
        countType:
          type: string
          enum:
            - FULL
            - CYCLE
            - SPOT
        itemCodes:
          type: array
          items:
            type: string
          description: Item codes for CYCLE or SPOT count (optional; FULL counts all items)
        notes:
          type: string

    RecordCountLineRequest:
      type: object
      required:
        - countedQty
      properties:
        countedQty:
          type: integer
          minimum: 0
        barcodeScan:
          type: string
        notes:
          type: string

    ApproveCountRequest:
      type: object
      properties:
        notes:
          type: string

    RejectCountRequest:
      type: object
      required:
        - reason
      properties:
        reason:
          type: string
          minLength: 1

    # -- Requisition --
    Requisition:
      type: object
      required:
        - id
        - tenantId
        - requisitionNumber
        - requestingFacilityId
        - supplyingFacilityId
        - status
        - lines
        - createdBy
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        requisitionNumber:
          type: string
          description: Human-readable requisition number
        requestingFacilityId:
          type: string
          format: uuid
        requestingFacilityName:
          type: string
          nullable: true
        requestingStoreId:
          type: string
          format: uuid
          nullable: true
        supplyingFacilityId:
          type: string
          format: uuid
        supplyingFacilityName:
          type: string
          nullable: true
        supplyingStoreId:
          type: string
          format: uuid
          nullable: true
        status:
          $ref: "#/components/schemas/RequisitionStatus"
        priority:
          type: string
          enum:
            - ROUTINE
            - URGENT
            - EMERGENCY
          default: ROUTINE
        lines:
          type: array
          items:
            $ref: "#/components/schemas/RequisitionLine"
        createdBy:
          type: string
          format: uuid
        approvedBy:
          type: string
          format: uuid
          nullable: true
        rejectedBy:
          type: string
          format: uuid
          nullable: true
        rejectionReason:
          type: string
          nullable: true
        notes:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        submittedAt:
          type: string
          format: date-time
          nullable: true
        approvedAt:
          type: string
          format: date-time
          nullable: true
        fulfilledAt:
          type: string
          format: date-time
          nullable: true
        updatedAt:
          type: string
          format: date-time

    RequisitionLine:
      type: object
      required:
        - id
        - itemCode
        - itemName
        - quantityRequested
      properties:
        id:
          type: string
          format: uuid
        itemCode:
          type: string
        itemName:
          type: string
        unitOfMeasure:
          type: string
          nullable: true
        quantityRequested:
          type: integer
          minimum: 1
        quantityApproved:
          type: integer
          nullable: true
        quantityFulfilled:
          type: integer
          nullable: true
        batchNumber:
          type: string
          nullable: true
          description: Batch assigned during fulfillment
        expiryDate:
          type: string
          format: date
          nullable: true
          description: Expiry of fulfilled batch
        notes:
          type: string
          nullable: true

    CreateRequisitionRequest:
      type: object
      required:
        - requestingFacilityId
        - supplyingFacilityId
        - lines
      properties:
        requestingFacilityId:
          type: string
          format: uuid
        requestingStoreId:
          type: string
          format: uuid
        supplyingFacilityId:
          type: string
          format: uuid
        supplyingStoreId:
          type: string
          format: uuid
        priority:
          type: string
          enum:
            - ROUTINE
            - URGENT
            - EMERGENCY
        lines:
          type: array
          minItems: 1
          items:
            type: object
            required:
              - itemCode
              - itemName
              - quantityRequested
            properties:
              itemCode:
                type: string
              itemName:
                type: string
              quantityRequested:
                type: integer
                minimum: 1
              notes:
                type: string
        notes:
          type: string

    ApproveRequisitionRequest:
      type: object
      properties:
        lineAdjustments:
          type: array
          items:
            type: object
            required:
              - lineId
              - quantityApproved
            properties:
              lineId:
                type: string
                format: uuid
              quantityApproved:
                type: integer
                minimum: 0
        notes:
          type: string

    RejectRequisitionRequest:
      type: object
      required:
        - reason
      properties:
        reason:
          type: string
          minLength: 1

    FulfillRequisitionRequest:
      type: object
      required:
        - lines
      properties:
        lines:
          type: array
          minItems: 1
          items:
            type: object
            required:
              - lineId
              - quantityFulfilled
              - batchNumber
              - expiryDate
            properties:
              lineId:
                type: string
                format: uuid
              quantityFulfilled:
                type: integer
                minimum: 0
              batchNumber:
                type: string
              expiryDate:
                type: string
                format: date
        notes:
          type: string

    # -- Handover --
    Handover:
      type: object
      required:
        - id
        - tenantId
        - facilityId
        - storeId
        - status
        - outgoingActorId
        - incomingActorId
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        facilityId:
          type: string
          format: uuid
        storeId:
          type: string
          format: uuid
        storeName:
          type: string
          nullable: true
        status:
          $ref: "#/components/schemas/HandoverStatus"
        outgoingActorId:
          type: string
          format: uuid
        outgoingActorName:
          type: string
          nullable: true
        incomingActorId:
          type: string
          format: uuid
        incomingActorName:
          type: string
          nullable: true
        snapshotItemCount:
          type: integer
          nullable: true
          description: Number of stock positions at handover time
        outgoingNotes:
          type: string
          nullable: true
        incomingNotes:
          type: string
          nullable: true
        outgoingSignedAt:
          type: string
          format: date-time
          nullable: true
        incomingSignedAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
          nullable: true

    StartHandoverRequest:
      type: object
      required:
        - storeId
        - outgoingActorId
        - incomingActorId
      properties:
        storeId:
          type: string
          format: uuid
        outgoingActorId:
          type: string
          format: uuid
        incomingActorId:
          type: string
          format: uuid
        notes:
          type: string

    SignHandoverRequest:
      type: object
      properties:
        notes:
          type: string

    # -- Reconciliation --
    ReconcileItem:
      type: object
      required:
        - id
        - tenantId
        - facilityId
        - storeId
        - itemCode
        - itemName
        - internalQuantity
        - externalQuantity
        - variance
        - confidenceScore
        - status
        - source
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        facilityId:
          type: string
          format: uuid
        storeId:
          type: string
          format: uuid
        itemCode:
          type: string
        itemName:
          type: string
        batchNumber:
          type: string
          nullable: true
        internalQuantity:
          type: integer
          description: Quantity according to internal inventory
        externalQuantity:
          type: integer
          description: Quantity according to external eLMIS
        variance:
          type: integer
          description: internalQuantity - externalQuantity
        confidenceScore:
          type: number
          format: double
          minimum: 0
          maximum: 1
          description: Match confidence (0.0 to 1.0)
        status:
          $ref: "#/components/schemas/ReconcileStatus"
        source:
          type: string
          description: Source system (e.g., "ELMIS", "DHIS2")
        resolvedBy:
          type: string
          format: uuid
          nullable: true
        resolvedAt:
          type: string
          format: date-time
          nullable: true
        resolutionAction:
          $ref: "#/components/schemas/AdjustmentAction"
        resolutionNotes:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time

    ResolveReconcileRequest:
      type: object
      required:
        - action
        - notes
      properties:
        action:
          $ref: "#/components/schemas/AdjustmentAction"
        adjustedQuantity:
          type: integer
          minimum: 0
          description: Required when action is MANUAL_ADJUST
        notes:
          type: string
          minLength: 1

    # -- Consumption --
    ConsumptionRequest:
      type: object
      required:
        - facilityId
        - storeId
        - items
      properties:
        facilityId:
          type: string
          format: uuid
        storeId:
          type: string
          format: uuid
        referenceType:
          type: string
          description: Context (DISPENSE, LAB_ANALYSIS, CLINICAL_ENCOUNTER)
        referenceId:
          type: string
          format: uuid
        items:
          type: array
          minItems: 1
          items:
            type: object
            required:
              - itemCode
              - batchNumber
              - quantity
            properties:
              itemCode:
                type: string
              batchNumber:
                type: string
              quantity:
                type: integer
                minimum: 1

    # -- Store / Bin --
    Store:
      type: object
      required:
        - id
        - tenantId
        - facilityId
        - code
        - name
        - storeType
        - active
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        facilityId:
          type: string
          format: uuid
        code:
          type: string
        name:
          type: string
        storeType:
          $ref: "#/components/schemas/StoreType"
        active:
          type: boolean
        createdAt:
          type: string
          format: date-time

    CreateStoreRequest:
      type: object
      required:
        - facilityId
        - code
        - name
        - storeType
      properties:
        facilityId:
          type: string
          format: uuid
        code:
          type: string
          minLength: 1
        name:
          type: string
          minLength: 1
        storeType:
          $ref: "#/components/schemas/StoreType"

    Bin:
      type: object
      required:
        - id
        - storeId
        - code
        - name
        - active
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        storeId:
          type: string
          format: uuid
        code:
          type: string
        name:
          type: string
        description:
          type: string
          nullable: true
        coldChain:
          type: boolean
          default: false
        active:
          type: boolean
        createdAt:
          type: string
          format: date-time

    CreateBinRequest:
      type: object
      required:
        - code
        - name
      properties:
        code:
          type: string
          minLength: 1
        name:
          type: string
          minLength: 1
        description:
          type: string
        coldChain:
          type: boolean

    # -- Paged Responses --
    PagedOnHand:
      type: object
      required:
        - content
        - page
        - size
        - totalElements
        - totalPages
      properties:
        content:
          type: array
          items:
            $ref: "#/components/schemas/OnHandPosition"
        page:
          type: integer
        size:
          type: integer
        totalElements:
          type: integer
        totalPages:
          type: integer

    PagedStockoutRisk:
      type: object
      required:
        - content
        - page
        - size
        - totalElements
        - totalPages
      properties:
        content:
          type: array
          items:
            $ref: "#/components/schemas/StockoutRisk"
        page:
          type: integer
        size:
          type: integer
        totalElements:
          type: integer
        totalPages:
          type: integer

    PagedLedgerEvent:
      type: object
      required:
        - content
        - page
        - size
        - totalElements
        - totalPages
      properties:
        content:
          type: array
          items:
            $ref: "#/components/schemas/LedgerEvent"
        page:
          type: integer
        size:
          type: integer
        totalElements:
          type: integer
        totalPages:
          type: integer

    PagedReconcileItem:
      type: object
      required:
        - content
        - page
        - size
        - totalElements
        - totalPages
      properties:
        content:
          type: array
          items:
            $ref: "#/components/schemas/ReconcileItem"
        page:
          type: integer
        size:
          type: integer
        totalElements:
          type: integer
        totalPages:
          type: integer

    PagedHandover:
      type: object
      required:
        - content
        - page
        - size
        - totalElements
        - totalPages
      properties:
        content:
          type: array
          items:
            $ref: "#/components/schemas/Handover"
        page:
          type: integer
        size:
          type: integer
        totalElements:
          type: integer
        totalPages:
          type: integer

    # -- API Envelope --
    ApiResponse:
      type: object
      required:
        - success
      properties:
        success:
          type: boolean
          description: Whether the request was successful
        data:
          description: Response payload (type varies by endpoint)
        error:
          type: object
          nullable: true
          properties:
            code:
              type: string
              description: Machine-readable error code
            message:
              type: string
              description: Human-readable error message
            details:
              type: object
              description: Additional error context
        meta:
          type: object
          nullable: true
          properties:
            correlationId:
              type: string
              format: uuid
            timestamp:
              type: string
              format: date-time
