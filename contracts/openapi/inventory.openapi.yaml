  /v1/internal/stores:
    post:
      operationId: createStore
      summary: Create an inventory store
      description: |
        Creates a new inventory store (warehouse, pharmacy storeroom, ward
        cupboard) within a facility. Stores are the physical locations
        where stock is held.
      tags:
        - Internal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateStoreRequest'
      responses:
        '201':
          description: Store created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Store'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/internal/stores/{storeId}/bins:
    post:
      operationId: createBin
      summary: Create a storage bin within a store
      description: |
        Creates a new bin (shelf, rack, cold-chain unit, etc.) within a
        store. Bins are used for fine-grained location tracking within a store.
      tags:
        - Internal
      parameters:
        - name: storeId
          in: path
          required: true
          schema:
