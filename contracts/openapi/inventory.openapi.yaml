      summary: Resolve a reconciliation entry
      description: |
        Resolves a stock variance by accepting internal count, accepting
        external count, or specifying a manual adjustment. Records resolution
        notes for audit. Publishes inventory.reconcile.resolved event.
      tags:
        - Reconciliation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
