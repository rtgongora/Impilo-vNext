  /v1/internal/consumption/clinical:
    post:
      operationId: recordClinicalConsumption
      summary: Record clinical consumption
      description: |
        Internal endpoint for clinical supply consumption (e.g., wound
        dressings, gloves, syringes) used during patient encounters.
      tags:
        - Internal
      requestBody:
        required: true
        content:
