  /v1/reconcile/pending:
    get:
      operationId: getReconcilePending
      summary: Get pending reconciliation items
      description: |
        Returns paginated list of stock variances between internal inventory
        and external eLMIS data. Items are ordered by variance magnitude
        descending. Includes confidence scores for auto-match suggestions.
      tags:
        - Reconciliation
      parameters:
        - $ref: '#/components/parameters/FacilityIdQuery'
