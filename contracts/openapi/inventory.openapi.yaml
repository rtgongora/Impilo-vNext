  /v1/handover/start:
    post:
      operationId: startHandover
      summary: Start a shift handover
      description: |
        Initiates a shift handover between outgoing and incoming operators.
        Snapshots current stock positions. Status is PENDING_OUTGOING_SIGN.
        Publishes inventory.handover.started event.
      tags:
        - Handover
      requestBody:
        required: true
        content:
          application/json:
            schema:
