    post:
      operationId: refreshCapability
      summary: Refresh eLMIS capability configuration
      description: |
        Forces a reload of the eLMIS adapter mode and capability configuration
        for the given facility. Called by ops when adapter config changes.
      tags:
        - Internal
      requestBody:
