        '409':
          $ref: '#/components/responses/Conflict'
  /v1/requisitions/{id}/fulfill:
    post:
      operationId: fulfillRequisition
      summary: Fulfill a requisition
      description: |
        Records fulfillment of an approved requisition. Specifies actual
        quantities shipped per line, batch numbers, and expiry dates.
        Transitions to FULFILLED. Publishes inventory.requisition.fulfilled event.
      tags:
        - Requisitions
      parameters:
        - $ref: '#/components/parameters/RequisitionIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FulfillRequisitionRequest'
