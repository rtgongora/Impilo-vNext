  /v1/internal/consumption/lab:
    post:
      operationId: recordLabConsumption
      summary: Record lab consumption
      description: |
        Internal endpoint called by OROS lab adapter when lab reagents/supplies
        are consumed during analysis. Decreases on-hand for consumed items.
      tags:
        - Internal
      requestBody:
        required: true
        content:
