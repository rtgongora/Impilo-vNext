  description: Contract for governance structures, assignments, and onboarding workflows.
servers:
  - url: http://localhost:8165
paths:
  /v1/internal/governance/organisations:
    get:
      summary: List organisations
      responses:
        '200':
          description: Organisations returned
    post:
      summary: Create organisation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '201':
          description: Organisation created
  /v1/internal/governance/assignments/search:
