# =============================================================================
# MUSHEX — Finance & Claims Service API (OpenAPI 3.0)
# Manages insurance claims, ledger entries, payments, settlements, and
# fraud flags for healthcare financial operations within Impilo.
# =============================================================================
openapi: "3.0.3"

info:
  title: MUSHEX — Finance & Claims Service
  version: "1.0.0"
  description: |
    MUSHEX handles all financial operations within Impilo including insurance
    claim submission, adjudication, payment processing, settlement runs,
    and fraud detection.

    **Consistency classes**
    * Class A — destructive/high-trust mutations (require PDP decision header)
    * Class B — creation / registration mutations
    * Class C — reads and snapshots
  contact:
    name: Impilo Platform Team
  license:
    name: Proprietary

servers:
  - url: http://localhost:8087
    description: Local development
  - url: https://{tenant}.impilo.health/api
    description: Production (per-tenant)
    variables:
      tenant:
        default: demo

security:
  - bearerAuth: []

tags:
  - name: Claims
    description: Insurance claim lifecycle management
  - name: Ledger
    description: Financial ledger entries
  - name: Payments
    description: Internal payment processing
  - name: Settlements
    description: Insurer settlement runs and payouts
  - name: Fraud
    description: Fraud detection and flag management

# ============================================================================
# PATHS
# ============================================================================
paths:

  # ---- Claims --------------------------------------------------------------

  /mushex/v1/claims:
    post:
      operationId: createClaim
      tags: [Claims]
      summary: Create an insurance claim (Class B)
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/ActorId"
        - $ref: "#/components/parameters/ActorType"
        - $ref: "#/components/parameters/PurposeOfUse"
        - $ref: "#/components/parameters/DeviceFingerprint"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateClaimRequest"
      responses:
        "201":
          description: Claim created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseClaimResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"

  /mushex/v1/claims/{id}:
    get:
      operationId: getClaim
      tags: [Claims]
      summary: Get a claim with events and attachments (Class C)
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/ActorId"
        - $ref: "#/components/parameters/ActorType"
        - $ref: "#/components/parameters/PurposeOfUse"
        - $ref: "#/components/parameters/DeviceFingerprint"
        - $ref: "#/components/parameters/ClaimId"
      responses:
        "200":
          description: Claim detail with events and attachments
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseClaimResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  /mushex/v1/claims/{id}/submit:
    post:
      operationId: submitClaim
      tags: [Claims]
      summary: Submit a claim to insurer (Class B)
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/ActorId"
        - $ref: "#/components/parameters/ActorType"
        - $ref: "#/components/parameters/PurposeOfUse"
        - $ref: "#/components/parameters/DeviceFingerprint"
        - $ref: "#/components/parameters/ClaimId"
      responses:
        "200":
          description: Claim submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseClaimResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  /mushex/v1/claims/{id}/adjudication:
    post:
      operationId: adjudicateClaim
      tags: [Claims]
      summary: Record claim adjudication decision (Class A)
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/ActorId"
        - $ref: "#/components/parameters/ActorType"
        - $ref: "#/components/parameters/PurposeOfUse"
        - $ref: "#/components/parameters/DeviceFingerprint"
        - $ref: "#/components/parameters/Decision"
        - $ref: "#/components/parameters/ClaimId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClaimAdjudicationRequest"
      responses:
        "200":
          description: Claim adjudicated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseClaimResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  /mushex/v1/claims/{id}/dispute:
    post:
      operationId: disputeClaim
      tags: [Claims]
      summary: Raise a dispute on a claim (Class A)
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/ActorId"
        - $ref: "#/components/parameters/ActorType"
        - $ref: "#/components/parameters/PurposeOfUse"
        - $ref: "#/components/parameters/DeviceFingerprint"
        - $ref: "#/components/parameters/Decision"
        - $ref: "#/components/parameters/ClaimId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClaimDisputeRequest"
      responses:
        "200":
          description: Claim dispute recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseClaimResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  /mushex/v1/claims/{id}/attachments:
    post:
      operationId: addClaimAttachment
      tags: [Claims]
      summary: Add a document attachment to a claim (Class B)
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/ActorId"
        - $ref: "#/components/parameters/ActorType"
        - $ref: "#/components/parameters/PurposeOfUse"
        - $ref: "#/components/parameters/DeviceFingerprint"
        - $ref: "#/components/parameters/ClaimId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClaimAttachmentRequest"
      responses:
        "201":
          description: Attachment added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseClaimResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  # ---- Ledger --------------------------------------------------------------

  /mushex/v1/ledger/entries:
    get:
      operationId: listLedgerEntries
      tags: [Ledger]
      summary: List ledger entries (paged) (Class C)
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/ActorId"
        - $ref: "#/components/parameters/ActorType"
        - $ref: "#/components/parameters/PurposeOfUse"
        - $ref: "#/components/parameters/DeviceFingerprint"
        - $ref: "#/components/parameters/PageNumber"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Paged ledger entries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponsePagedLedgerEntry"

  # ---- Payments ------------------------------------------------------------

  /internal/v1/payments:
    post:
      operationId: createPayment
      tags: [Payments]
      summary: Process an internal payment (Class A)
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/ActorId"
        - $ref: "#/components/parameters/ActorType"
        - $ref: "#/components/parameters/PurposeOfUse"
        - $ref: "#/components/parameters/DeviceFingerprint"
        - $ref: "#/components/parameters/Decision"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePaymentRequest"
      responses:
        "201":
          description: Payment processed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponsePaymentResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"

  # ---- Settlements ---------------------------------------------------------

  /mushex/v1/settlements/run:
    post:
      operationId: runSettlement
      tags: [Settlements]
      summary: Execute a settlement run for a period (Class A)
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/ActorId"
        - $ref: "#/components/parameters/ActorType"
        - $ref: "#/components/parameters/PurposeOfUse"
        - $ref: "#/components/parameters/DeviceFingerprint"
        - $ref: "#/components/parameters/Decision"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SettlementRunRequest"
      responses:
        "202":
          description: Settlement run initiated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseSettlementResponse"

  /mushex/v1/settlements/{id}:
    get:
      operationId: getSettlement
      tags: [Settlements]
      summary: Get settlement by ID (Class C)
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/ActorId"
        - $ref: "#/components/parameters/ActorType"
        - $ref: "#/components/parameters/PurposeOfUse"
        - $ref: "#/components/parameters/DeviceFingerprint"
        - $ref: "#/components/parameters/SettlementId"
      responses:
        "200":
          description: Settlement detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseSettlementResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  /mushex/v1/settlements/{id}/release-payouts:
    post:
      operationId: releaseSettlementPayouts
      tags: [Settlements]
      summary: Release payouts for a settlement (Class A)
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/ActorId"
        - $ref: "#/components/parameters/ActorType"
        - $ref: "#/components/parameters/PurposeOfUse"
        - $ref: "#/components/parameters/DeviceFingerprint"
        - $ref: "#/components/parameters/Decision"
        - $ref: "#/components/parameters/SettlementId"
      responses:
        "200":
          description: Payouts released
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseSettlementResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  # ---- Fraud ---------------------------------------------------------------

  /mushex/v1/fraud/flags:
    get:
      operationId: listFraudFlags
      tags: [Fraud]
      summary: List fraud flags (paged) (Class C)
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/ActorId"
        - $ref: "#/components/parameters/ActorType"
        - $ref: "#/components/parameters/PurposeOfUse"
        - $ref: "#/components/parameters/DeviceFingerprint"
        - $ref: "#/components/parameters/PageNumber"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Paged fraud flags
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponsePagedFraudFlag"

# ============================================================================
# COMPONENTS
# ============================================================================
components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Keycloak-issued access token (forwarded by Envoy)

  parameters:
    TenantId:
      name: X-Tenant-Id
      in: header
      required: true
      description: Tenant identifier — injected by Envoy after TSHEPO authorisation
      schema:
        type: string
    CorrelationId:
      name: X-Correlation-Id
      in: header
      required: true
      description: End-to-end correlation ID for distributed tracing
      schema:
        type: string
        format: uuid
    ActorId:
      name: X-Actor-Id
      in: header
      required: true
      description: Authenticated actor (user or service) identifier
      schema:
        type: string
    ActorType:
      name: X-Actor-Type
      in: header
      required: true
      description: Type of actor making the request
      schema:
        type: string
        enum: [CITIZEN, PROVIDER, ADMIN, SYSTEM, SERVICE]
    PurposeOfUse:
      name: X-Purpose-Of-Use
      in: header
      required: true
      description: Why this request is being made
      schema:
        type: string
    DeviceFingerprint:
      name: X-Device-Fingerprint
      in: header
      required: true
      description: Device identity hash
      schema:
        type: string
    FacilityId:
      name: X-Facility-Id
      in: header
      required: false
      description: Facility scope (contextual)
      schema:
        type: string
        format: uuid
    WorkspaceId:
      name: X-Workspace-Id
      in: header
      required: false
      description: Workspace scope (contextual)
      schema:
        type: string
        format: uuid
    ShiftId:
      name: X-Shift-Id
      in: header
      required: false
      description: Duty shift scope (contextual)
      schema:
        type: string
        format: uuid
    Decision:
      name: X-Decision
      in: header
      required: false
      description: PDP decision header — ALLOW, DENY, STEP_UP_REQUIRED (Class A endpoints require ALLOW)
      schema:
        type: string
        enum: [ALLOW, DENY, STEP_UP_REQUIRED]
    Obligations:
      name: X-Obligations
      in: header
      required: false
      description: JSON obligations blob from TSHEPO
      schema:
        type: string
    PageNumber:
      name: page
      in: query
      schema:
        type: integer
        default: 0
    PageSize:
      name: size
      in: query
      schema:
        type: integer
        default: 20
        maximum: 100
    ClaimId:
      name: id
      in: path
      required: true
      description: Claim identifier
      schema:
        type: integer
        format: int64
    SettlementId:
      name: id
      in: path
      required: true
      description: Settlement identifier
      schema:
        type: integer
        format: int64

  responses:
    BadRequest:
      description: Validation error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: Duplicate resource
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Missing or invalid trust headers
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: PDP denied the request (X-Decision=DENY)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:

    # ---- Requests ----------------------------------------------------------

    CreateClaimRequest:
      type: object
      required: [billId, insurerId, facilityId]
      properties:
        billId:
          type: integer
          format: int64
        insurerId:
          type: string
          format: uuid
        facilityId:
          type: string
          format: uuid
        totals:
          $ref: "#/components/schemas/ClaimTotals"

    ClaimTotals:
      type: object
      properties:
        grossAmount:
          type: number
          format: double
        patientResidual:
          type: number
          format: double
        insurerPayable:
          type: number
          format: double
        currency:
          type: string

    ClaimAdjudicationRequest:
      type: object
      required: [decision]
      properties:
        decision:
          type: string
          enum: [APPROVED, PARTIALLY_APPROVED, DENIED]
        patientResidual:
          type: number
          format: double
        insurerPayable:
          type: number
          format: double
        notes:
          type: string

    ClaimDisputeRequest:
      type: object
      required: [reason]
      properties:
        reason:
          type: string

    ClaimAttachmentRequest:
      type: object
      required: [landelaDocId, docType]
      properties:
        landelaDocId:
          type: string
        docType:
          type: string

    CreatePaymentRequest:
      type: object
      required: [sourceType, sourceId, amount, currency, facilityId, idempotencyKey]
      properties:
        sourceType:
          type: string
          enum: [BILL, CLAIM, SETTLEMENT]
        sourceId:
          type: integer
          format: int64
        amount:
          type: number
          format: double
        currency:
          type: string
        facilityId:
          type: string
          format: uuid
        idempotencyKey:
          type: string
        metadata:
          type: object
          additionalProperties: true

    SettlementRunRequest:
      type: object
      required: [periodStart, periodEnd]
      properties:
        periodStart:
          type: string
          format: date
        periodEnd:
          type: string
          format: date

    # ---- Response wrappers -------------------------------------------------

    ApiResponseClaimResponse:
      type: object
      properties:
        success:
          type: boolean
        correlationId:
          type: string
          format: uuid
        data:
          $ref: "#/components/schemas/ClaimResponse"

    ApiResponsePagedLedgerEntry:
      type: object
      properties:
        success:
          type: boolean
        correlationId:
          type: string
          format: uuid
        data:
          $ref: "#/components/schemas/PagedLedgerEntry"

    ApiResponsePaymentResponse:
      type: object
      properties:
        success:
          type: boolean
        correlationId:
          type: string
          format: uuid
        data:
          $ref: "#/components/schemas/PaymentResponse"

    ApiResponseSettlementResponse:
      type: object
      properties:
        success:
          type: boolean
        correlationId:
          type: string
          format: uuid
        data:
          $ref: "#/components/schemas/SettlementResponse"

    ApiResponsePagedFraudFlag:
      type: object
      properties:
        success:
          type: boolean
        correlationId:
          type: string
          format: uuid
        data:
          $ref: "#/components/schemas/PagedFraudFlag"

    # ---- Domain objects ----------------------------------------------------

    ClaimResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        claimRef:
          type: string
        billId:
          type: integer
          format: int64
        insurerId:
          type: string
          format: uuid
        facilityId:
          type: string
          format: uuid
        status:
          type: string
          enum: [DRAFT, SUBMITTED, IN_REVIEW, APPROVED, PARTIALLY_APPROVED, DENIED, DISPUTED, SETTLED]
        totals:
          $ref: "#/components/schemas/ClaimTotals"
        events:
          type: array
          items:
            $ref: "#/components/schemas/ClaimEvent"
        attachments:
          type: array
          items:
            $ref: "#/components/schemas/ClaimAttachment"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ClaimEvent:
      type: object
      properties:
        id:
          type: integer
          format: int64
        eventType:
          type: string
        actorId:
          type: string
        notes:
          type: string
        occurredAt:
          type: string
          format: date-time

    ClaimAttachment:
      type: object
      properties:
        id:
          type: integer
          format: int64
        landelaDocId:
          type: string
        docType:
          type: string
        addedAt:
          type: string
          format: date-time

    LedgerEntry:
      type: object
      properties:
        id:
          type: integer
          format: int64
        entryType:
          type: string
        sourceType:
          type: string
        sourceId:
          type: integer
          format: int64
        amount:
          type: number
          format: double
        currency:
          type: string
        facilityId:
          type: string
          format: uuid
        description:
          type: string
        postedAt:
          type: string
          format: date-time

    PagedLedgerEntry:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: "#/components/schemas/LedgerEntry"
        page:
          type: integer
        size:
          type: integer
        totalElements:
          type: integer
          format: int64

    PaymentResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        paymentRef:
          type: string
        sourceType:
          type: string
        sourceId:
          type: integer
          format: int64
        amount:
          type: number
          format: double
        currency:
          type: string
        facilityId:
          type: string
          format: uuid
        status:
          type: string
          enum: [PENDING, PROCESSING, COMPLETED, FAILED, REVERSED]
        idempotencyKey:
          type: string
        processedAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time

    SettlementResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        settlementRef:
          type: string
        periodStart:
          type: string
          format: date
        periodEnd:
          type: string
          format: date
        status:
          type: string
          enum: [RUNNING, COMPLETED, PAYOUTS_RELEASED, FAILED]
        totalClaims:
          type: integer
        totalAmount:
          type: number
          format: double
        currency:
          type: string
        completedAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time

    FraudFlag:
      type: object
      properties:
        id:
          type: integer
          format: int64
        flagType:
          type: string
        sourceType:
          type: string
        sourceId:
          type: integer
          format: int64
        severity:
          type: string
          enum: [LOW, MEDIUM, HIGH, CRITICAL]
        description:
          type: string
        status:
          type: string
          enum: [OPEN, UNDER_REVIEW, CLEARED, CONFIRMED]
        detectedAt:
          type: string
          format: date-time

    PagedFraudFlag:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: "#/components/schemas/FraudFlag"
        page:
          type: integer
        size:
          type: integer
        totalElements:
          type: integer
          format: int64

    SnapshotResponse:
      type: object
      properties:
        as_of:
          type: string
          format: date-time
        cursor:
          type: integer
        limit:
          type: integer
        has_more:
          type: boolean
        total:
          type: integer
        items:
          type: array
          items:
            type: object
            additionalProperties: true

    GenericResponse:
      type: object
      properties:
        message:
          type: string
        referenceId:
          type: string

    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          default: false
        correlationId:
          type: string
          format: uuid
        errorCode:
          type: string
        message:
          type: string
        details:
          type: array
          items:
            type: string
