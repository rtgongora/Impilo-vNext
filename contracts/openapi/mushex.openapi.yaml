openapi: 3.0.3
info:
  title: MUSHEX — Health Payments, Remittances & Claims Switching API
  description: >
    National payment intent engine, remittance/split payments, claims switching,
    double-entry-lite ledger, settlement batches, fraud/waste/abuse detection,
    and provider-neutral payment rail adapters for the Impilo health platform.
  version: 0.1.0
  contact:
    name: MoHCC Digital Health Division

servers:
  - url: http://localhost:10000
    description: Local Envoy gateway
  - url: http://localhost:8102
    description: Direct service access

paths:
  /mushex/v1/payment-intents:
    get:
      tags:
        - Payments
      summary: List payment intents by source (Phase 5 follow-on)
      operationId: listPaymentIntentsBySource
      parameters:
        - name: source_type
          in: query
          required: true
          schema:
            type: string
        - name: source_id
          in: query
          required: false
          schema:
            type: string
        - name: source_ids
          in: query
          required: false
          schema:
            type: array
            items:
              type: string
          style: form
          explode: true
      responses:
        '200':
          description: Intents returned (possibly empty).
        '400':
          description: '`VALIDATION_ERROR` — missing or invalid source filters.'
    post:
      tags:
        - Payments
      summary: Create a payment intent
      operationId: createPaymentIntent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateIntentRequest'
      responses:
        '201':
          description: Intent created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse_PaymentIntent'
  /mushex/v1/payment-intents/{id}:
    get:
      tags:
        - Payments
      summary: Get payment intent by ID
      operationId: getPaymentIntent
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Intent found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse_PaymentIntent'
  /mushex/v1/payment-intents/{id}/cancel:
    post:
      tags:
        - Payments
      summary: Cancel a payment intent
      operationId: cancelPaymentIntent
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Intent cancelled
  /mushex/v1/payment-intents/{id}/attempts:
    get:
      tags:
        - Payments
      summary: List payment attempts persisted against an intent (Phase 3 follow-on)
      description: >
        Chronological (ascending by `requestedAt`) read endpoint. Returns the empty list if the intent exists but has no
        attempts; returns `404 INTENT_NOT_FOUND` if the intent does not exist.
      operationId: listPaymentAttempts
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Attempts returned (possibly empty).
        '404':
          description: '`INTENT_NOT_FOUND` — no intent for the given id.'
    post:
      tags:
        - Payments
      summary: Initiate a payment attempt against an existing intent (Phase 3 — attempt-time rail enforcement)
      description: >
        Creates a payment attempt for the named intent and applies the rail-enforcement contract documented in
        `docs/design/phase-3-attempt-time-rail-enforcement-implementation.md`. The effective rail is read from the
        intent's persisted `metadata.rail_selection.effective_rail`. A three-leg safety gate
        (`mushex.adapters.<rail>.{enabled,credentials-configured}` *and* `PaymentRailAdapter.liveCapable()`) prevents
        real-money adapters from being called unless an operator has explicitly opted in *and* a real provider client is
        wired in. Blocked attempts are still persisted with `enforcement_metadata.safety_gate` set to either
        `BLOCKED_PRE_LIVE` (config flags off) or `BLOCKED_NOT_LIVE_CAPABLE` (adapter is a stub).
      operationId: initiatePaymentAttempt
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: X-Idempotency-Key
          in: header
          required: false
          description: >-
            Optional caller-supplied idempotency key. Body field `idempotencyKey` (when non-blank) takes precedence over
            this header.
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAttemptRequest'
      responses:
        '201':
          description: Attempt created (or replayed when idempotent).
        '404':
          description: '`INTENT_NOT_FOUND` — no intent for the given id.'
        '422':
          description: '`INTENT_NOT_PAYABLE` or `RAIL_ADAPTER_UNAVAILABLE_AT_ATTEMPT`.'
  /mushex/v1/payment-intents/{id}/attempts/reselect:
    post:
      tags:
        - Payments
      summary: Re-run rail selection for an existing intent (Phase 3 follow-on)
      description: >
        Re-runs `RailSelectionPolicy` against the persisted intent and writes the new decision to
        `metadata.rail_selection`. The previous decision is preserved on `metadata.rail_selection.history[]` (an array
        of snapshots). No adapter is called and no money moves. Emits an `ATTEMPT_RESELECTED` outbox event on
        `mushex.payment.attempt.reselected`.
      operationId: reselectRail
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReselectRequest'
      responses:
        '200':
          description: Intent updated with new rail-selection decision; previous decision preserved on history[].
        '404':
          description: '`INTENT_NOT_FOUND` — no intent for the given id.'
  /mushex/v1/payment-intents/{id}/issue-remittance-slip:
