components:
  schemas:
    CreateAttemptRequest:
      type: object
      description: |
        Phase 3 attempt-creation request. All fields are optional. When `idempotencyKey`
        is supplied the attempt is idempotent against `(intentId, idempotencyKey)`;
        replays return the existing attempt without re-invoking the rail adapter.
        See `docs/design/phase-3-attempt-time-rail-enforcement-implementation.md`.
      properties:
        idempotencyKey:
          type: string
          description: |
            Optional. Caller-supplied idempotency key for the attempt. Takes precedence
            over the `X-Idempotency-Key` header when both are present and non-blank.
          maxLength: 120
        reason:
          type: string
          description: |
            Optional human-readable reason for the attempt — informational only; not
            persisted as a column (logged with the attempt).
    ReselectRequest:
      type: object
      description: |
        Phase 3 follow-on reselect request. All fields are optional. The operator-supplied
        `reason` is recorded under `metadata.rail_selection.reason_detail` and emitted on
        the `ATTEMPT_RESELECTED` outbox event payload.
      properties:
        reason:
          type: string
          description: Why the operator is reselecting (e.g. "provider-outage").
    CreateIntentRequest:
      type: object
      required: [sourceType, sourceId, amount, idempotencyKey]
      properties:
        sourceType:
          type: string
          enum: [COSTA_BILL, MSIKA_ORDER, ADHOC]
        sourceId:
          type: string
        amount:
          type: number
          format: decimal
          minimum: 0.01
        currency:
          type: string
          default: USD
        facilityId:
          type: string
          format: uuid
        idempotencyKey:
          type: string
        metadata:
          type: string
        # ----- G-4 rail-selection (additive, optional). See docs/design/g4-rail-selection-policy.md -----
        preferredRailAdapter:
          type: string
          description: |
            Optional. Caller's preferred payment rail. Must match a registered AdapterType
            (MOBILE_MONEY, BANK_TRANSFER, CARD_GATEWAY, SANDBOX). When omitted, MusheX uses
            its configured default rail.
          enum: [MOBILE_MONEY, BANK_TRANSFER, CARD_GATEWAY, SANDBOX]
        allowFallback:
          type: boolean
          description: |
            Optional. When the preferredRailAdapter is unavailable, allow MusheX to fall
            back to the SANDBOX rail (when permitted by deployment config). Defaults to true
            on the server side when omitted.
        directGatewayAllowed:
          type: boolean
          description: |
            Optional. Request that MusheX route directly to an external gateway adapter
            (Mode A per the dual-mode doctrine), rather than the default orchestration/SANDBOX
            path. Deployment configuration may override this to false in production.
            Defaults to false on the server side when omitted.

    RailSelection:
      type: object
      description: |
        Server-recorded outcome of the G-4 rail-selection policy. Surfaced on each
        payment-intent's metadata under the reserved `rail_selection` key, and as
        `effectiveRail` / `preferredRail` / `railSelectionReason` fields on the
        `INTENT_CREATED` outbox event. See docs/design/g4-rail-selection-policy.md.
      properties:
        effective_rail:
          type: string
          enum: [MOBILE_MONEY, BANK_TRANSFER, CARD_GATEWAY, SANDBOX]
        preferred_rail:
          type: string
          enum: [MOBILE_MONEY, BANK_TRANSFER, CARD_GATEWAY, SANDBOX]
          nullable: true
        fallback_applied:
          type: boolean
        direct_gateway_requested:
          type: boolean
        reason:
          type: string
          enum:
            - EXPLICIT_PREFERRED
            - DEFAULT_NO_PREFERENCE
            - DIRECT_GATEWAY_REQUESTED
            - PREFERRED_UNAVAILABLE_FALLBACK
            - SAFETY_SWITCH_FORCED_SANDBOX
        reason_detail:
          type: string
        selected_at:
          type: string
          format: date-time
        selection_version:
          type: string

    RefundRequest:
      type: object
      required: [amount]
      properties:
        amount:
          type: number
          format: decimal
          minimum: 0.01
        reason:
          type: string

    RemittanceClaimRequest:
      type: object
      required: [token, otp]
      properties:
        token:
          type: string
        otp:
          type: string

    ClaimCreateRequest:
      type: object
      required: [billId, insurerId]
      properties:
        billId:
          type: string
        insurerId:
          type: string
        facilityId:
          type: string
          format: uuid
        totals:
          type: string
        patientCpid:
          type: string
        planCode:
          type: string
        serviceCode:
          type: string
        preauthRequired:
          type: boolean

    ClaimAckRequest:
      type: object
      required: [externalRef]
      properties:
        externalRef:
          type: string

    ClaimAdjudicationRequest:
      type: object
      required: [patientResidual, insurerPayable]
      properties:
        decision:
          type: string
        patientResidual:
          type: number
          format: decimal
        insurerPayable:
          type: number
          format: decimal

    ClaimDisputeRequest:
      type: object
      required: [reason]
      properties:
        reason:
          type: string

    SettlementRunRequest:
      type: object
      required: [periodStart, periodEnd]
      properties:
        periodStart:
          type: string
          format: date
        periodEnd:
          type: string
          format: date

    ReconImportLine:
      type: object
      properties:
        statementRef:
          type: string
        statementDate:
          type: string
          format: date
        amount:
          type: number
          format: decimal
        currency:
          type: string
        counterparty:
          type: string

    ReconMatchRequest:
      type: object
      required: [intentId]
      properties:
        intentId:
          type: string

    PaymentIntentType:
      type: string
      description: >
        Optional classifier on payment intents. Set via metadata keys intent_type or payment_intent_type
        when creating intents (COSTA handoffs may populate these).
      enum:
        - PRE_SERVICE_PAYMENT
        - DEPOSIT
        - AUTHORISATION_HOLD
        - POINT_OF_CARE_PAYMENT
        - FINAL_PAYMENT
        - PARTIAL_PAYMENT
        - CO_PAYMENT
        - CLAIM_SUBMISSION
        - WALLET_DEBIT
        - REMITTANCE
        - REFUND
        - REVERSAL
        - DEFERRED_PAYMENT_PROMISE

    PaymentIntent:
      type: object
      properties:
        intentId:
          type: string
        tenantId:
          type: string
          format: uuid
        sourceType:
          type: string
        sourceId:
          type: string
        currency:
          type: string
        amountTotal:
          type: number
        amountPaid:
          type: number
        status:
          type: string
          description: >
            Canonical lifecycle state (IntentStatus). Extended business labels (awaiting_payment, covered,
            deferred, reversed, expired, etc.) may additionally be mirrored in metadata.lifecycle_label until
            the state machine is expanded.
        intentType:
          $ref: '#/components/schemas/PaymentIntentType'
        createdAt:
          type: string
          format: date-time

    ApiResponse_PaymentIntent:
      type: object
      properties:
        success:
          type: boolean
        data:
          $ref: '#/components/schemas/PaymentIntent'
        correlationId:
          type: string
        timestamp:
          type: string
          format: date-time

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    trustHeaders:
      type: apiKey
      in: header
      name: X-Tenant-Id

security:
  - bearerAuth: []
    trustHeaders: []

tags:
  - name: Payments
    description: Payment intent lifecycle
  - name: Remittance
    description: Delegated payment slips
  - name: Refunds
    description: Refund processing
  - name: Receipts
    description: Payment receipts
  - name: Adapters
    description: Payment rail adapter webhooks
  - name: Claims
    description: Insurance claims switching
  - name: Settlements
    description: Provider settlement and payouts
  - name: Reconciliation
    description: Bank statement reconciliation
  - name: Operations
    description: Ops review queue
  - name: Fraud
    description: Fraud/waste/abuse detection
  - name: Ledger
    description: Double-entry-lite ledger
