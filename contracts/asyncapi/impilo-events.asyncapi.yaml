asyncapi: 2.6.0
info:
  title: Impilo Event Bus Contracts
  version: 1.1.0
  description: Canonical event contracts for the Impilo vNext event-driven architecture.

servers:
  production:
    url: kafka.impilo.prod:9092
    protocol: kafka
    description: Production Kafka cluster

