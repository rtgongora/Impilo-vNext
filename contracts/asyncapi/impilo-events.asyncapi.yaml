components:
  messages:
    EventEnvelope:
      name: EventEnvelope
      title: Event Envelope
      summary: Canonical wrapper for all domain events.
      contentType: application/json
      payload:
        $ref: '#/components/schemas/EventEnvelope'

  schemas:
    EventEnvelope:
      type: object
      required:
        - eventId
        - eventType
        - schemaVersion
        - correlationId
        - causationId
        - idempotencyKey
        - producer
        - tenantId
        - podId
        - occurredAt
        - emittedAt
        - subjectType
        - subjectId
        - payload
      properties:
        eventId:
          type: string
          description: Unique event identifier (UUID/ULID)
          format: uuid
        eventType:
          type: string
          description: Dot-notation event type (e.g. impilo.vito.patient.created.v1)
        schemaVersion:
          type: integer
          minimum: 1
          description: Version of the payload schema
        correlationId:
          type: string
          description: End-to-end correlation identifier
        causationId:
          type: string
          description: Identifier of the event that caused this event
        idempotencyKey:
          type: string
          description: Client-supplied idempotency key
        producer:
          type: string
          description: Name of the producing service
        tenantId:
          type: string
          description: Tenant scope
        podId:
          type: string
          description: Originating pod/facility identifier
        occurredAt:
          type: string
          format: date-time
          description: When the domain event actually happened
        emittedAt:
          type: string
          format: date-time
          description: When the envelope was created
        subjectType:
          type: string
          description: Type of the subject (e.g. Patient, Order)
        subjectId:
          type: string
          description: Identifier of the subject
        payload:
          type: object
          description: The event payload (domain-specific)
          oneOf:
            - $ref: '#/components/schemas/DeltaPayload'
            - type: object
        meta:
          type: object
          description: Optional metadata

    DeltaPayload:
      type: object
      required:
        - op
        - changedFields
      properties:
        op:
          type: string
          enum: [CREATE, UPDATE, DELETE, MERGE, REVOKE]
          description: The operation type
        before:
          type: object
          nullable: true
          description: State before the change
        after:
          type: object
          nullable: true
          description: State after the change
        changedFields:
          type: array
          items:
            type: string
          description: List of field paths that changed
