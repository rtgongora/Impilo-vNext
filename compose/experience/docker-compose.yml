##
## Impilo vNext — Experience Platform Dev Runtime
##
## Self-contained local slice that mirrors repo-root infra (see ../../docker-compose.yml):
##   Postgres (this file uses 5433 so it can run beside root postgres:5432),
##   Redis :6379, Kafka :9092, simba-service (Simba wellness), inpatient-service, experience-bff, one-ui-shell.
##
## Do not run root compose redis+kafka on the same host ports at the same time.
##
## Java images expect pre-built JARs: run tools/dev/up.ps1 / up.sh, or Maven from services/.
##

services:
  # ── Redis 7 (same role as root docker-compose redis) ─────────────
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ── Kafka 3.7 KRaft (advertised as kafka:9092 for in-network clients) ─
  kafka:
    image: apache/kafka:3.7.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      CLUSTER_ID: "impilo-experience-compose-01"
    ports:
      - "9092:9092"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server 127.0.0.1:9092 || exit 1",
        ]
      interval: 15s
      timeout: 30s
      retries: 15
      start_period: 120s

  # ── PostgreSQL ───────────────────────────────────────────────────
  experience-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: experience_bff
      POSTGRES_USER: impilo
      POSTGRES_PASSWORD: impilo
    ports:
      - "5433:5432"
    volumes:
      - experience-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U impilo -d experience_bff"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── Simba — wellness product runtime (goals, diet, clubs, Health Connect, citizen My Life) ─
  simba-service:
    build:
      context: ../../services/simba-service
      dockerfile: Dockerfile
    environment:
      DB_HOST: experience-db
      DB_PORT: 5432
      DB_NAME: impilo_simba
      POSTGRES_USER: impilo
      POSTGRES_PASSWORD: impilo
      SERVER_PORT: "8125"
      SPRING_AUTOCONFIGURE_EXCLUDE: org.springframework.boot.autoconfigure.security.oauth2.resource.servlet.OAuth2ResourceServerAutoConfiguration
      SIMBA_SECURITY_OAUTH2_ENABLED: "false"
      SIMBA_OUTBOX_PUBLISHER_ENABLED: "false"
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    ports:
      - "8125:8125"
    depends_on:
      sovereign-db-init:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8125/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 90s

  # ── Sovereign DB bootstrap (idempotent CREATE DATABASE) ──────────
  sovereign-db-init:
    image: postgres:16-alpine
    environment:
      PGPASSWORD: impilo
    depends_on:
      experience-db:
        condition: service_healthy
    entrypoint: ["sh", "-c"]
    command:
      - |
        until psql -h experience-db -U impilo -d postgres -c '\q' 2>/dev/null; do sleep 1; done
        for db in inpatient pct impilo_integration_hub impilo_learning impilo_coverage impilo_simba impilo_pacs impilo_abis; do
          psql -h experience-db -U impilo -d postgres -tc "SELECT 1 FROM pg_database WHERE datname = '$$db'" | grep -q 1 \
            || psql -h experience-db -U impilo -d postgres -c "CREATE DATABASE \"$$db\" OWNER impilo;"
        done
    restart: "no"

  # ── Patient Care Tracker (queue / journey) ───────────────────────
  pct-service:
    build:
      context: ../../services/pct-service
      dockerfile: Dockerfile
    environment:
      POSTGRES_HOST: experience-db
      POSTGRES_PORT: 5432
      POSTGRES_USER: impilo
      POSTGRES_PASSWORD: impilo
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      KAFKA_BOOTSTRAP: kafka:9092
      SPRING_AUTOCONFIGURE_EXCLUDE: org.springframework.boot.autoconfigure.security.oauth2.resource.servlet.OAuth2ResourceServerAutoConfiguration
      IMPILO_SECURITY_OAUTH2_ENABLED: "false"
      PCT_TELEMED_EXTERNAL_ENABLED: "true"
      PCT_TELEMED_EXTERNAL_BASE_URL: http://rtc-gateway:8196
    ports:
      - "8088:8088"
    depends_on:
      sovereign-db-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      rtc-gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8088/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 90s

  # ── LiveKit (dev telemedicine RTC) ───────────────────────────────
  livekit:
    image: livekit/livekit-server:latest
    command: ["--dev", "--bind", "0.0.0.0"]
    ports:
      - "7880:7880"
      - "7881:7881"
      - "7882:7882/udp"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7880 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  # ── RTC gateway (port 8196 — avoids mvumo default 8195 collision) ─
  rtc-gateway:
    build:
      context: ../../services/rtc-gateway-service
      dockerfile: Dockerfile
    environment:
      SERVER_PORT: "8196"
      SPRING_AUTOCONFIGURE_EXCLUDE: org.springframework.boot.autoconfigure.security.oauth2.resource.servlet.OAuth2ResourceServerAutoConfiguration
      RTC_PROVIDER: LIVEKIT
      RTC_FAIL_CLOSED: "false"
      RTC_DEV_MODE_ENABLED: "true"
      LIVEKIT_ENABLED: "true"
      LIVEKIT_URL: http://livekit:7880
      LIVEKIT_CLIENT_URL: ws://localhost:7880
      LIVEKIT_API_KEY: devkey
      LIVEKIT_API_SECRET: secret
    ports:
      - "8196:8196"
    depends_on:
      livekit:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8196/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  # ── Orthanc (DICOM server for imaging viewer) ────────────────────
  orthanc:
    image: orthancteam/orthanc:24.8.1
    ports:
      - "8042:8042"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8042/system > /dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  # ── Biometric matching engine (core infra; SourceAFIS fingerprint real, ONNX face/iris) ──
  matcher-engine:
    build:
      context: ../../services/matcher-engine
      dockerfile: Dockerfile
    environment:
      MATCHER_FP_THRESHOLD: "40"
      # Face extraction model path — external artifact (not committed), fetched by
      # scripts/dev/vendor-biometric-deps.sh. Empty → face extraction fails closed
      # (OnnxFaceEmbedder). Fingerprint (SourceAFIS) + iris (Gabor) are real without it.
      MATCHER_FACE_MODEL_PATH: ""
    ports:
      - "9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9200/actuator/health > /dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  # ── ABIS (biometric template SoR + adjudication platform) ────────
  # Governance adapter over matcher-engine; holds encrypted templates, runs enrol-time
  # dedup (1:N), and owns the adjudication/duplicate-investigation queue. Never merges
  # automatically (dual-control). Real matching delegated to matcher-engine.
  abis-service:
    build:
      context: ../../services/abis-service
      dockerfile: Dockerfile
    environment:
      SERVER_PORT: "8186"
      POSTGRES_HOST: experience-db
      POSTGRES_PORT: 5432
      POSTGRES_USER: impilo
      POSTGRES_PASSWORD: impilo
      SPRING_DATASOURCE_URL: jdbc:postgresql://experience-db:5432/impilo_abis
      SPRING_AUTOCONFIGURE_EXCLUDE: org.springframework.boot.autoconfigure.security.oauth2.resource.servlet.OAuth2ResourceServerAutoConfiguration
      IMPILO_SECURITY_OAUTH2_ENABLED: "false"
      ABIS_MATCHER_ENABLED: "true"
      MATCHER_ENGINE_URL: http://matcher-engine:9200
      ABIS_DEDUP_ENABLED: "true"
      ABIS_DEDUP_THRESHOLD: "0.85"
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    ports:
      - "8186:8186"
    depends_on:
      sovereign-db-init:
        condition: service_completed_successfully
      matcher-engine:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8186/actuator/health > /dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 90s

  # ── PACS adapter (governed imaging metadata) ─────────────────────
  pacs-adapter-service:
    build:
      context: ../../services/pacs-adapter-service
      dockerfile: Dockerfile
    environment:
      SERVER_PORT: "8113"
      POSTGRES_HOST: experience-db
      POSTGRES_PORT: 5432
      POSTGRES_USER: impilo
      POSTGRES_PASSWORD: impilo
      SPRING_DATASOURCE_URL: jdbc:postgresql://experience-db:5432/impilo_pacs
      SPRING_AUTOCONFIGURE_EXCLUDE: org.springframework.boot.autoconfigure.security.oauth2.resource.servlet.OAuth2ResourceServerAutoConfiguration
      ORTHANC_BASE_URL: http://orthanc:8042
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    ports:
      - "8113:8113"
    depends_on:
      sovereign-db-init:
        condition: service_completed_successfully
      orthanc:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8113/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 90s

  # ── Integration hub (routes, dispatch, dead letters) ─────────────
  integration-hub:
    build:
      context: ../../services/integration-hub
      dockerfile: Dockerfile
    environment:
      POSTGRES_HOST: experience-db
      POSTGRES_PORT: 5432
      POSTGRES_USER: impilo
      POSTGRES_PASSWORD: impilo
      SERVER_PORT: "8110"
      SPRING_AUTOCONFIGURE_EXCLUDE: org.springframework.boot.autoconfigure.security.oauth2.resource.servlet.OAuth2ResourceServerAutoConfiguration
      IMPILO_SECURITY_OAUTH2_ENABLED: "false"
    ports:
      - "8110:8110"
    depends_on:
      sovereign-db-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8110/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 90s

  # ── Inpatient DB bootstrap (legacy alias — use sovereign-db-init) ─
  inpatient-db-init:
    image: postgres:16-alpine
    profiles: ["legacy-db-init"]
    environment:
      PGPASSWORD: impilo
    depends_on:
      experience-db:
        condition: service_healthy
    entrypoint: ["sh", "-c"]
    command:
      - |
        until psql -h experience-db -U impilo -d postgres -c '\q' 2>/dev/null; do sleep 1; done
        psql -h experience-db -U impilo -d postgres -tc "SELECT 1 FROM pg_database WHERE datname = 'inpatient'" | grep -q 1 \
          || psql -h experience-db -U impilo -d postgres -c "CREATE DATABASE inpatient OWNER impilo;"
    restart: "no"

  # ── Inpatient domain (admissions, transfers, discharges) ─────────
  inpatient-service:
    build:
      context: ../../services/inpatient-service
      dockerfile: Dockerfile
    environment:
      POSTGRES_HOST: experience-db
      POSTGRES_PORT: 5432
      POSTGRES_USER: impilo
      POSTGRES_PASSWORD: impilo
      SERVER_PORT: "8121"
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SPRING_AUTOCONFIGURE_EXCLUDE: org.springframework.boot.autoconfigure.security.oauth2.resource.servlet.OAuth2ResourceServerAutoConfiguration
      INPATIENT_SECURITY_OAUTH2_ENABLED: "false"
    ports:
      - "8121:8121"
    depends_on:
      sovereign-db-init:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8121/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  # ── Coverage (enterprise finance sovereign) ──────────────────────
  coverage-service:
    build:
      context: ../../services/coverage-service
      dockerfile: Dockerfile
    environment:
      SERVER_PORT: "8140"
      SPRING_DATASOURCE_URL: jdbc:postgresql://experience-db:5432/impilo_coverage
      SPRING_DATASOURCE_USERNAME: impilo
      SPRING_DATASOURCE_PASSWORD: impilo
      COVERAGE_SECURITY_OAUTH2_ENABLED: "false"
      COVERAGE_OUTBOX_PUBLISHER_ENABLED: "false"
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    ports:
      - "8140:8140"
    depends_on:
      sovereign-db-init:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8140/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 90s

  # ── Impilo Fundo (native learning-service) ───────────────────────
  learning-service:
    build:
      context: ../../services/learning-service
      dockerfile: Dockerfile
    environment:
      SERVER_PORT: "8235"
      SPRING_DATASOURCE_URL: jdbc:postgresql://experience-db:5432/impilo_learning
      SPRING_DATASOURCE_USERNAME: impilo
      SPRING_DATASOURCE_PASSWORD: impilo
      LEARNING_SECURITY_OAUTH2_ENABLED: "false"
      LEARNING_OUTBOX_PUBLISHER_ENABLED: "false"
      FUNDO_PUBLIC_BASE_URL: http://localhost:3000/learning
    ports:
      - "8235:8235"
    depends_on:
      sovereign-db-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8235/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 90s

  # ── Experience BFF ───────────────────────────────────────────────
  # Build context must be the module directory: Dockerfile copies target/experience-bff-*.jar
  # (run tools/dev/up.ps1 or: cd services && mvn … package — see compose/experience/README.md)
  experience-bff:
    build:
      context: ../../services/experience-bff
      dockerfile: Dockerfile
    environment:
      DB_HOST: experience-db
      DB_PORT: 5432
      DB_NAME: experience_bff
      DB_USER: impilo
      DB_PASSWORD: impilo
      SPRING_PROFILES_ACTIVE: default
      SPRING_AUTOCONFIGURE_EXCLUDE: org.springframework.boot.autoconfigure.security.oauth2.resource.servlet.OAuth2ResourceServerAutoConfiguration
      # Sovereign service URLs (in-compose where available; host ports for optional services)
      PCT_BASE_URL: http://pct-service:8088
      INTEGRATION_HUB_BASE_URL: http://integration-hub:8110
      OROS_BASE_URL: http://host.docker.internal:8089
      PHARMACY_BASE_URL: http://host.docker.internal:8096
      VITO_BASE_URL: http://host.docker.internal:8082
      TUSO_BASE_URL: http://host.docker.internal:8084
      VARAPI_BASE_URL: http://host.docker.internal:8083
      DOCUMENT_STORE_BASE_URL: http://host.docker.internal:8093
      COSTA_BASE_URL: http://host.docker.internal:8101
      MUSHEX_BASE_URL: http://host.docker.internal:8102
      DISPATCH_BASE_URL: http://host.docker.internal:8320
      NDILA_BASE_URL: http://host.docker.internal:8155
      NHUME_BASE_URL: http://host.docker.internal:8210
      COVERAGE_BASE_URL: http://coverage-service:8140
      SURVEILLANCE_BASE_URL: http://host.docker.internal:8180
      CAMPAIGNS_BASE_URL: http://host.docker.internal:8190
      INDAWO_BASE_URL: http://host.docker.internal:8150
      ORTHANC_BASE_URL: http://orthanc:8042
      ORTHANC_DICOMWEB_URL: http://orthanc:8042/dicom-web
      PACS_BASE_URL: http://pacs-adapter-service:8113
      RTC_GATEWAY_BASE_URL: http://rtc-gateway:8196
      FHIR_BASE_URL: http://host.docker.internal:8090/fhir
      SIMBA_BASE_URL: http://simba-service:8125
      INPATIENT_BASE_URL: http://inpatient-service:8121
      LEARNING_SERVICE_BASE_URL: http://learning-service:8235
      # Dev compose: no Keycloak JWT — required when OAuth2 RS autoconfig is excluded.
      IMPILO_SECURITY_ALLOW_ANONYMOUS: "true"
      # Same defaults as local application.yml, but pointed at compose service names.
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: "6379"
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    ports:
      - "8160:8160"
    depends_on:
      experience-db:
        condition: service_healthy
      simba-service:
        condition: service_healthy
      inpatient-service:
        condition: service_healthy
      pct-service:
        condition: service_healthy
      integration-hub:
        condition: service_healthy
      learning-service:
        condition: service_healthy
      coverage-service:
        condition: service_healthy
      pacs-adapter-service:
        condition: service_healthy
      orthanc:
        condition: service_healthy
      rtc-gateway:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8160/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ── One UI Shell (unified Experience surface, port 3000) ─────────
  one-ui-shell:
    build:
      context: ../..
      dockerfile: ui/one-ui-shell/Dockerfile
    environment:
      NEXT_PUBLIC_BFF_URL: http://localhost:8160
      NEXT_PUBLIC_API_GATEWAY_URL: http://localhost:10000
    ports:
      - "3000:3000"
    depends_on:
      experience-bff:
        condition: service_healthy

volumes:
  experience-db-data:
