  nhume-service:
    build:
      context: ../../services/nhume-service
      dockerfile: Dockerfile
    environment:
      POSTGRES_HOST: experience-db
      POSTGRES_PORT: 5432
      POSTGRES_USER: impilo
      POSTGRES_PASSWORD: impilo
      SERVER_PORT: "8210"
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      NHUME_NDILA_BASE_URL: http://ndila-service:8155
      NHUME_COMMS_HUB_ENABLED: "false"
      NHUME_TRUST_ENFORCE: "false"
      NHUME_SEED_DEMO_DATA: "true"
      SPRING_JPA_HIBERNATE_DDL_AUTO: none
    ports:
      - "8210:8210"
    depends_on:
      sovereign-rx-db-init:
        condition: service_completed_successfully
      ndila-service:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8210/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 120s

  experience-bff:
    environment:
      PHARMACY_BASE_URL: http://pharmacy-service:8096
      MUSHEX_BASE_URL: http://mushex-service:8102
      DISPATCH_BASE_URL: http://dispatch-service:8320
      COSTA_BASE_URL: http://costing-engine-service:8101
      SURVEILLANCE_BASE_URL: http://surveillance-service:8180
      NDILA_BASE_URL: http://ndila-service:8155
      NHUME_BASE_URL: http://nhume-service:8210
    depends_on:
      pharmacy-service:
        condition: service_healthy
      mushex-service:
        condition: service_healthy
      dispatch-service:
        condition: service_healthy
      costing-engine-service:
        condition: service_healthy
      surveillance-service:
        condition: service_healthy
      ndila-service:
        condition: service_healthy
      nhume-service:
        condition: service_healthy
