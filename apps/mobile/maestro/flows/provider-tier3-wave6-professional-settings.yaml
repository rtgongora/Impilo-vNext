appId: zw.gov.impilo.provider
---
- launchApp

- extendedWaitUntil:
    id: "provider-tabs"
    timeout: 120000

- assertVisible:
    id: "provider-tabs"

- tapOn: "Tools"
- assertVisible:
    text: "Clinical Tools"

- tapOn:
    id: "tools-tab-prof_settings"
- assertVisible:
    id: "professional-settings-hub-screen"

- assertVisible:
    id: "professional-settings-hub-section-settings"
