# Citizen login — drives the REAL Keycloak PKCE flow end-to-end.
#
# Credentials are parameterized, never hardcoded. Export before running
# (Maestro auto-injects shell env vars prefixed with MAESTRO_):
#   MAESTRO_CITIZEN_USERNAME  — seeded citizen username (preview realm seeds
#                               `citizen.moyo`; see realm-impilo-preview.json)
#   MAESTRO_CITIZEN_PASSWORD  — that user's password (from the realm seed /
#                               operator secret store — never committed)
#
# The Keycloak form renders in a browser Custom Tab; selectors target the
# default Keycloak login theme (realm sets no custom loginTheme):
# "Username or email" (loginWithEmailAllowed=true), "Password", "Sign In".
#
# Preconditions: preview stack reachable from the device (API base and
# Keycloak per the eas.json preview profile / app.config.ts preview extra),
# realm client impilo-mobile-citizen present.
appId: zw.gov.impilo.citizen
tags:
  - auth
---
# Fresh state so a cached session never masks a broken login path.
- launchApp:
    clearState: true

# App boot → unauthenticated login screen
- extendedWaitUntil:
    id: "login-screen"
    timeout: 120000

- tapOn:
    id: "login-button"

# Keycloak hosted login page (browser Custom Tab)
- extendedWaitUntil:
    text: "Username or email"
    timeout: 60000
- tapOn: "Username or email"
- inputText: ${MAESTRO_CITIZEN_USERNAME}
- tapOn: "Password"
- inputText: ${MAESTRO_CITIZEN_PASSWORD}
- hideKeyboard
- tapOn: "Sign In"

# Back in the app: code→token exchange, then profile bootstrap, then tabs.
- extendedWaitUntil:
    id: "citizen-tabs"
    timeout: 180000
- assertVisible:
    id: "home-screen"
