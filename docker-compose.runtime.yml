# =============================================================================
# Impilo vNext — Runtime Phase (Wave 18)
# =============================================================================
#
# Runs all infrastructure + backend services + experience UI + edge enforcement.
# Requires: JARs built via docker-compose.build.yml (or local Maven build).
#
# Usage:
#   docker compose -f docker-compose.runtime.yml up -d
#   (or: ./scripts/dev-runtime.sh up)
#
# Env file: copy .env.example to .env and adjust as needed.
# =============================================================================

services:
  # ===========================================================================
  # INFRASTRUCTURE
  # ===========================================================================

  # ── PostgreSQL 16 ──────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-impilo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./scripts/seed/01-init-databases.sql:/docker-entrypoint-initdb.d/01-init-databases.sql
      - ./scripts/seed/02-seed-tuso.sql:/docker-entrypoint-initdb.d/02-seed-tuso.sql
      - ./scripts/seed/03-seed-vito.sql:/docker-entrypoint-initdb.d/03-seed-vito.sql
      - ./scripts/seed/04-seed-varapi.sql:/docker-entrypoint-initdb.d/04-seed-varapi.sql
      - ./scripts/seed/05-seed-tshepo.sql:/docker-entrypoint-initdb.d/05-seed-tshepo.sql
      - ./scripts/seed/06-seed-zibo.sql:/docker-entrypoint-initdb.d/06-seed-zibo.sql
      - ./scripts/seed/07-seed-pct.sql:/docker-entrypoint-initdb.d/07-seed-pct.sql
      - ./scripts/seed/08-seed-oros.sql:/docker-entrypoint-initdb.d/08-seed-oros.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-impilo}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ── Redis 7 ────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ── Apache Kafka 3.7 (KRaft — no ZooKeeper) ───────────────────────
  kafka:
    image: apache/kafka:3.7.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      CLUSTER_ID: "impilo-local-dev-cluster-01"
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 20s
      retries: 12
      start_period: 90s

  # ── Keycloak 25.x ─────────────────────────────────────────────────
  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    command: start-dev --import-realm --health-enabled=true
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: ${POSTGRES_USER:-impilo}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      KC_HEALTH_ENABLED: "true"
    volumes:
      - ./tools/auth/impilo-realm.json:/opt/keycloak/data/import/impilo-realm.json:ro
    ports:
      - "8480:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/9000 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '\"status\":\"UP\"\\|200' <&3"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 60s

  # ── MinIO (S3-compatible) ──────────────────────────────────────────
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  # ── HAPI FHIR R4 (BUTANO — Shared Health Record) ──────────────────
  hapi-fhir:
    image: hapiproject/hapi:v7.4.0
    environment:
      JAVA_TOOL_OPTIONS: -Xms256m -Xmx768m -XX:+UseG1GC
      spring.datasource.url: jdbc:postgresql://postgres:5432/butano
      spring.datasource.username: ${POSTGRES_USER:-impilo}
      spring.datasource.password: ${POSTGRES_PASSWORD:-changeme}
      spring.datasource.driverClassName: org.postgresql.Driver
      spring.jpa.properties.hibernate.dialect: org.hibernate.dialect.PostgreSQLDialect
      hapi.fhir.fhir_version: R4
    mem_limit: 1280m
    ports:
      - "18090:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      disable: true

  # ===========================================================================
  # EDGE — Envoy + OPA
  # ===========================================================================

  # ── OPA (Open Policy Agent) ────────────────────────────────────────
  opa:
    image: openpolicyagent/opa:0.68.0-debug
    command:
      - "run"
      - "--server"
      - "--addr=0.0.0.0:8181"
      - "--set=decision_logs.console=true"
      - "/policies"
    volumes:
      - ./tools/ops/gateway/opa:/policies:ro
    ports:
      - "8181:8181"
    healthcheck:
      test: ["CMD", "/opa", "eval", "true"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ── Envoy Gateway ─────────────────────────────────────────────────
  envoy:
    image: envoyproxy/envoy:v1.31-latest
    volumes:
      - ./infra/envoy/envoy-runtime.yaml:/etc/envoy/envoy.yaml:ro
    ports:
      - "10000:10000"
      - "9901:9901"
    depends_on:
      opa:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/9901 && echo -e 'GET /ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q 'LIVE' <&3"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ===========================================================================
  # BACKEND SERVICES — Core Registry Spine
  # ===========================================================================

  # ── TSHEPO — Trust & Governance (port 8081) ────────────────────────
  tshepo:
    build:
      context: ./services/tshepo-service
      dockerfile: Dockerfile
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-impilo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-impilo}
      SPRING_PROFILES_ACTIVE: default
      SERVER_PORT: 8081
      # Disable OAuth2 resource server for dev (no realm configured yet)
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: ""
      SPRING_AUTOCONFIGURE_EXCLUDE: org.springframework.boot.autoconfigure.security.oauth2.resource.servlet.OAuth2ResourceServerAutoConfiguration
    mem_limit: 768m
    ports:
      - "18081:8081"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 45s

  # ── VITO — Client Registry (port 8082) ─────────────────────────────
  vito:
    build:
      context: ./services/vito-service
      dockerfile: Dockerfile
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-impilo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-impilo}
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: ""
      SPRING_AUTOCONFIGURE_EXCLUDE: org.springframework.boot.autoconfigure.security.oauth2.resource.servlet.OAuth2ResourceServerAutoConfiguration
      VITO_HMAC_PEPPER: impilo-dev-hmac-pepper-changeme-in-prod
    mem_limit: 768m
    ports:
      - "8082:8082"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8082/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 45s

  # ── VARAPI — Provider Registry (port 8083) ─────────────────────────
  varapi:
    build:
      context: ./services/varapi-service
      dockerfile: Dockerfile
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-impilo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-impilo}
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: ""
      SPRING_AUTOCONFIGURE_EXCLUDE: org.springframework.boot.autoconfigure.security.oauth2.resource.servlet.OAuth2ResourceServerAutoConfiguration
    mem_limit: 768m
    ports:
      - "8083:8083"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8083/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 45s

  # ── TUSO — Facility Registry (port 8084) ───────────────────────────
  tuso:
    build:
      context: ./services/tuso-service
      dockerfile: Dockerfile
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-impilo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KEYCLOAK_URL: http://keycloak:8080
