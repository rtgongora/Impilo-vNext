      timeout: 5s
      retries: 15
      start_period: 45s

  # ── OROS — Orders & Results (port 8089) ────────────────────────────
  oros:
    build:
      context: ./services/oros-service
      dockerfile: Dockerfile
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-impilo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
