    mem_limit: 768m
    ports:
      - "18089:8089"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8089/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 45s

  # ── Guidance Service — Conversational & Knowledge (port 8260) ────────
  guidance:
    build:
      context: ./services/guidance-service
      dockerfile: Dockerfile
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: guidance
      DB_USER: ${POSTGRES_USER:-impilo}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SEARCH_SERVICE_URL: http://search:8230
    mem_limit: 768m
    ports:
      - "8260:8260"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8260/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  # ── Clinical Knowledge Platform — EDLIZ-aligned (port 8270) ──────────
  clinical-knowledge-platform:
    build:
      context: ./services/clinical-knowledge-platform-service
      dockerfile: Dockerfile
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: clinical_knowledge
      DB_USER: ${POSTGRES_USER:-impilo}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      # PDF ingestion defaults (image copies PDF under /app/edliz — see service Dockerfile)
      CLINICAL_INGESTION_WORKING_DIR: /app
      EDLIZ_REFERENCE_PDF_PATH: edliz/EDLIZ-2025-final-for-circulation.pdf
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      CLINICAL_KAFKA_RELAY_ENABLED: "true"
    mem_limit: 768m
    ports:
      - "8270:8270"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8270/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 40s

  # ===========================================================================
  # EXPERIENCE LAYER
  # ===========================================================================

  # ── Experience BFF (port 8160) ─────────────────────────────────────
  experience-bff:
    build:
      context: ./services/experience-bff
      dockerfile: Dockerfile
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: experience_bff
      DB_USER: ${POSTGRES_USER:-impilo}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SPRING_PROFILES_ACTIVE: default
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-impilo}
      # ── Backend service URLs ──────────────────────────────────────
      PCT_BASE_URL: http://pct:8088
      OROS_BASE_URL: http://oros:8089
      VITO_BASE_URL: http://vito:8082
      TUSO_BASE_URL: http://tuso:8084
      VARAPI_BASE_URL: http://varapi:8083
      BUTANO_BASE_URL: http://hapi-fhir:8090
      FHIR_BASE_URL: http://hapi-fhir:8090/fhir
      PHARMACY_BASE_URL: http://pharmacy:8096
      MSIKA_BASE_URL: http://msika:8086
      MSIKA_FLOW_BASE_URL: http://msika-flow:8100
      MUSHEX_BASE_URL: http://mushex:8102
      COSTA_BASE_URL: http://costa:8101
      COVERAGE_BASE_URL: http://coverage:8140
      INDAWO_BASE_URL: http://indawo:8150
      SURVEILLANCE_BASE_URL: http://surveillance:8180
      CAMPAIGNS_BASE_URL: http://campaigns:8190
      NOTIFICATION_BASE_URL: http://notification:8200
      DATA_GOVERNANCE_BASE_URL: http://data-governance:8220
      DOCUMENT_STORE_BASE_URL: http://document-store:8093
      LANDELA_BASE_URL: http://landela:8092
      ORTHANC_BASE_URL: http://orthanc:8042
      ORTHANC_DICOMWEB_URL: http://orthanc:8042/dicom-web
      GUIDANCE_BASE_URL: http://guidance:8260
      CLINICAL_KNOWLEDGE_PLATFORM_BASE_URL: http://clinical-knowledge-platform:8270
    mem_limit: 768m
    ports:
      - "8160:8160"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      clinical-knowledge-platform:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8160/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  # ── One UI Shell — unified user-facing Experience (port 3000) ───────
  one-ui-shell:
    build:
      context: ./ui
      dockerfile: one-ui-shell/Dockerfile
      args:
        NEXT_PUBLIC_BFF_URL: http://localhost:8160
        NEXT_PUBLIC_API_GATEWAY_URL: http://localhost:10000
    environment:
      NEXT_PUBLIC_BFF_URL: http://localhost:8160
      NEXT_PUBLIC_API_GATEWAY_URL: http://localhost:10000
      HOSTNAME: "0.0.0.0"
    ports:
      - "3000:3000"
    depends_on:
      experience-bff:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  pg_data:
  minio_data:
