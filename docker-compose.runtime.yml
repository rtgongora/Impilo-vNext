  # ── Experience BFF (port 8160) ─────────────────────────────────────
  experience-bff:
    build:
      context: .
      dockerfile: services/experience-bff/Dockerfile
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: experience_bff
      DB_USER: ${POSTGRES_USER:-impilo}
