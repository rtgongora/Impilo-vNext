replicaCount: 1

image:
  repository: ghcr.io/mohcc/impilo/vito-web
  tag: "latest"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 3003

env:
  VITO_API_URL: "http://vito:8082"

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 250m
    memory: 256Mi

livenessProbe:
  httpGet:
    path: /
    port: 3003
  initialDelaySeconds: 15
  periodSeconds: 10

readinessProbe:
  httpGet:
    path: /
    port: 3003
  initialDelaySeconds: 10
  periodSeconds: 5
