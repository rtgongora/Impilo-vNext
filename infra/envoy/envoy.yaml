# =============================================================================
# Impilo vNext — Envoy Gateway Configuration (Local Development)
# Production: use Helm-templated version in infra/k8s
#
# TSHEPO decomposition: 6 sub-services behind Envoy.
# ext_authz calls tshepo-authz-service (gRPC primary, HTTP fallback).
# =============================================================================

admin:
  address:
    socket_address:
      address: 0.0.0.0
      port_value: 9901

static_resources:
  listeners:
    - name: public_listener
      address:
        socket_address:
          address: 0.0.0.0
          port_value: 10000
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: ingress_http
                codec_type: AUTO
                route_config:
                  name: local_route
                  virtual_hosts:
                    - name: impilo_services
                      domains: ["*"]
                      routes:
                        # ── TSHEPO Authz (ext_authz + break-glass + step-up + policies + devices) ──
                        - match: { prefix: "/api/v1/authorize" }
                          route: { cluster: tshepo_authz_service }
                        - match: { prefix: "/api/v1/step-up" }
                          route: { cluster: tshepo_authz_service }
                        - match: { prefix: "/api/v1/break-glass" }
                          route: { cluster: tshepo_authz_service }
                        - match: { prefix: "/api/v1/policies" }
                          route: { cluster: tshepo_authz_service }
                        - match: { prefix: "/api/v1/devices" }
                          route: { cluster: tshepo_authz_service }

                        # ── TSHEPO Identity (resolution, CPID, tokens, MOSIP) ──
                        - match: { prefix: "/api/v1/identity" }
                          route: { cluster: tshepo_identity_service }

                        # ── TSHEPO Consent (FHIR Consent CRUD + evaluation + share-links) ──
                        - match: { prefix: "/api/v1/consent" }
                          route: { cluster: tshepo_consent_service }

                        # ── TSHEPO Audit (events, access-history, export, chain verify) ──
                        - match: { prefix: "/api/v1/audit" }
                          route: { cluster: tshepo_audit_service }

                        # ── TSHEPO Keys (JWKS, key management, signing, certificates) ──
                        - match: { prefix: "/api/v1/keys" }
                          route: { cluster: tshepo_keys_service }
                        - match: { prefix: "/api/v1/sign" }
                          route: { cluster: tshepo_keys_service }
                        - match: { prefix: "/api/v1/certificates" }
                          route: { cluster: tshepo_keys_service }

                        # ── TSHEPO Offline (capability tokens, packs, reconciliation) ──
                        - match: { prefix: "/api/v1/offline" }
                          route: { cluster: tshepo_offline_service }

                        # ── VITO — Client Registry ──
                        - match: { prefix: "/api/v1/clients" }
                          route: { cluster: vito_service }
                        - match: { prefix: "/api/v1/recovery" }
                          route: { cluster: vito_service }

                        # ── VARAPI — Provider Registry ──
                        - match: { prefix: "/api/v1/providers" }
                          route: { cluster: varapi_service }

                        # ── TUSO — Facility Registry ──
                        - match: { prefix: "/api/v1/facilities" }
                          route: { cluster: tuso_service }
                        - match: { prefix: "/api/v1/workspaces" }
                          route: { cluster: tuso_service }
                        - match: { prefix: "/api/v1/resources" }
                          route: { cluster: tuso_service }
                        - match: { prefix: "/api/v1/bookings" }
                          route: { cluster: tuso_service }
                        - match: { prefix: "/api/v1/telemetry" }
                          route: { cluster: tuso_service }
                        - match: { prefix: "/api/v1/control-tower" }
                          route: { cluster: tuso_service }

                        # ── ZIBO — Terminology ──
                        - match: { prefix: "/api/v1/terminology" }
                          route: { cluster: zibo_service }

                        # ── PCT — Patient Care Tracker ──
                        - match: { prefix: "/api/v1/encounters" }
                          route: { cluster: pct_service }
                        - match: { prefix: "/api/v1/queues" }
                          route: { cluster: pct_service }

                        # ── OROS — Orders & Results ──
                        - match: { prefix: "/api/v1/orders" }
                          route: { cluster: oros_service }
                        - match: { prefix: "/api/v1/worklists" }
                          route: { cluster: oros_service }
                        - match: { prefix: "/api/v1/results" }
                          route: { cluster: oros_service }

                http_filters:
                  # ---------------------------------------------------------------
                  # External authorization via TSHEPO Authz Service
                  # gRPC preferred (faster, typed); HTTP fallback available.
                  # Envoy calls tshepo-authz-service on EVERY request.
                  # ---------------------------------------------------------------
                  - name: envoy.filters.http.ext_authz
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthz
                      transport_api_version: V3
                      grpc_service:
                        envoy_grpc:
                          cluster_name: tshepo_authz_grpc
                        timeout: 0.5s
                      # Fallback: HTTP service if gRPC is unavailable
                      # http_service:
                      #   server_uri:
                      #     uri: http://host.docker.internal:8081
                      #     cluster: tshepo_authz_service
                      #     timeout: 0.5s
                      #   path_prefix: "/v1/authorize"
                      #   authorization_request:
                      #     allowed_headers:
                      #       patterns:
                      #         - exact: "authorization"
                      #         - exact: "x-tenant-id"
                      #         - exact: "x-actor-id"
                      #         - exact: "x-actor-type"
                      #         - exact: "x-purpose-of-use"
                      #         - exact: "x-device-fingerprint"
                      #         - exact: "x-correlation-id"
                      #         - exact: "x-facility-id"
                      #         - exact: "x-workspace-id"
                      #         - exact: "x-shift-id"
                      #   authorization_response:
                      #     allowed_upstream_headers:
                      #       patterns:
                      #         - exact: "x-obligations"
                      #         - exact: "x-decision"
                      #         - exact: "x-max-scope"
                      #         - exact: "x-mask-fields"
                      #         - exact: "x-logging-level"
                      failure_mode_allow: false
                      with_request_body:
                        max_request_bytes: 8192
                        allow_partial_message: true
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

  clusters:
    # ── TSHEPO Authz (HTTP — for routes) ──
    - name: tshepo_authz_service
      type: STRICT_DNS
      load_assignment:
        cluster_name: tshepo_authz_service
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: host.docker.internal, port_value: 8081 }

    # ── TSHEPO Authz (gRPC — for ext_authz) ──
    - name: tshepo_authz_grpc
      type: STRICT_DNS
      typed_extension_protocol_options:
        envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
          "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
          explicit_http_config:
            http2_protocol_options: {}
      load_assignment:
        cluster_name: tshepo_authz_grpc
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: host.docker.internal, port_value: 9090 }

    # ── TSHEPO Identity ──
    - name: tshepo_identity_service
      type: STRICT_DNS
      load_assignment:
        cluster_name: tshepo_identity_service
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: host.docker.internal, port_value: 8181 }

    # ── TSHEPO Consent ──
    - name: tshepo_consent_service
      type: STRICT_DNS
      load_assignment:
        cluster_name: tshepo_consent_service
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: host.docker.internal, port_value: 8182 }

    # ── TSHEPO Audit ──
    - name: tshepo_audit_service
      type: STRICT_DNS
      load_assignment:
        cluster_name: tshepo_audit_service
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: host.docker.internal, port_value: 8183 }

    # ── TSHEPO Keys ──
    - name: tshepo_keys_service
      type: STRICT_DNS
      load_assignment:
        cluster_name: tshepo_keys_service
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: host.docker.internal, port_value: 8184 }

    # ── TSHEPO Offline ──
    - name: tshepo_offline_service
      type: STRICT_DNS
      load_assignment:
        cluster_name: tshepo_offline_service
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: host.docker.internal, port_value: 8185 }

    # ── Legacy TSHEPO (kept for backwards compat during migration) ──
    - name: tshepo_service
      type: STRICT_DNS
      load_assignment:
        cluster_name: tshepo_service
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: host.docker.internal, port_value: 8081 }

    # ── VITO — Client Registry ──
    - name: vito_service
      type: STRICT_DNS
      load_assignment:
        cluster_name: vito_service
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: host.docker.internal, port_value: 8082 }

    # ── VARAPI — Provider Registry ──
    - name: varapi_service
      type: STRICT_DNS
      load_assignment:
        cluster_name: varapi_service
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: host.docker.internal, port_value: 8083 }

    # ── TUSO — Facility Registry ──
    - name: tuso_service
      type: STRICT_DNS
      load_assignment:
        cluster_name: tuso_service
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: host.docker.internal, port_value: 8084 }

    # ── ZIBO — Terminology ──
    - name: zibo_service
      type: STRICT_DNS
      load_assignment:
        cluster_name: zibo_service
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: host.docker.internal, port_value: 8085 }

    # ── PCT — Patient Care Tracker ──
    - name: pct_service
      type: STRICT_DNS
      load_assignment:
        cluster_name: pct_service
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: host.docker.internal, port_value: 8088 }

    # ── OROS — Orders & Results ──
    - name: oros_service
      type: STRICT_DNS
      load_assignment:
        cluster_name: oros_service
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: host.docker.internal, port_value: 8089 }
