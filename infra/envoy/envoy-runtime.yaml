# =============================================================================
# Impilo vNext — Envoy Gateway Configuration (Docker Compose Runtime)
# =============================================================================
#
# Adapted from infra/envoy/envoy.yaml for Docker Compose networking.
# Services are addressed by their compose service names instead of
# host.docker.internal.
#
# OPA sidecar runs at opa:8181 and enforces v1.1 headers + idempotency.
# =============================================================================

admin:
  address:
    socket_address:
      address: 0.0.0.0
      port_value: 9901

static_resources:
  listeners:
    - name: public_listener
      address:
        socket_address:
          address: 0.0.0.0
          port_value: 10000
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: ingress_http
                codec_type: AUTO
                route_config:
                  name: local_route
                  virtual_hosts:
                    - name: impilo_services
                      domains: ["*"]
                      routes:
                        # ── TSHEPO Trust routes ──
                        # Routes proven served by tshepo-authz-service controllers
                        # (AuthorizeController, StepUpController, BreakGlassController,
                        # PolicyController, DeviceController) are pointed at the LIVE
                        # default-DENY / fail-closed authz engine so local-compose matches
                        # prod. The legacy default-ALLOW `tshepo-service` monolith is
                        # DEPRECATED-RETIRED and no longer on any live path here.
                        - match: { prefix: "/api/v1/authorize" }
                          route: { cluster: tshepo_authz_service, prefix_rewrite: "/v1/authorize" }
                        - match: { prefix: "/api/v1/step-up" }
                          route: { cluster: tshepo_authz_service, prefix_rewrite: "/v1/step-up" }
                        - match: { prefix: "/api/v1/break-glass" }
                          route: { cluster: tshepo_authz_service, prefix_rewrite: "/v1/break-glass" }
                        - match: { prefix: "/api/v1/policies" }
                          route: { cluster: tshepo_authz_service, prefix_rewrite: "/v1/policies" }
                        - match: { prefix: "/api/v1/devices" }
                          route: { cluster: tshepo_authz_service, prefix_rewrite: "/v1/devices" }
                        # ── Non-PDP families → canonical split-out services (W2-RED-FOLLOWUP) ──
                        # Each prefix below is re-pointed to the split-out tshepo service PROVEN
                        # (by @RequestMapping controller) to own that path. These are now wired
                        # into docker-compose.runtime.yml (:8181-:8185). This retires the legacy
                        # monolith from all these families — the legacy `tshepo` container is now
                        # kept ONLY for the residual `/external/v1/` (no split-out owner; see below).
                        - match: { prefix: "/api/v1/identity" }
                          route: { cluster: tshepo_identity_service, prefix_rewrite: "/v1/identity" }
                        - match: { prefix: "/api/v1/consent" }
                          route: { cluster: tshepo_consent_service, prefix_rewrite: "/v1/consent" }
                        - match: { prefix: "/api/v1/audit" }
                          route: { cluster: tshepo_audit_service, prefix_rewrite: "/v1/audit" }
                        - match: { prefix: "/api/v1/keys" }
                          route: { cluster: tshepo_keys_service, prefix_rewrite: "/v1/keys" }
                        - match: { prefix: "/api/v1/sign" }
                          route: { cluster: tshepo_keys_service, prefix_rewrite: "/v1/sign" }
                        - match: { prefix: "/api/v1/certificates" }
                          route: { cluster: tshepo_keys_service, prefix_rewrite: "/v1/certificates" }
                        - match: { prefix: "/api/v1/offline" }
                          route: { cluster: tshepo_offline_service, prefix_rewrite: "/v1/offline" }

                        # ── VITO — Client Registry ──
                        - match: { prefix: "/api/v1/clients/snapshot" }
                          route: { cluster: vito_service, prefix_rewrite: "/internal/v1/snapshots/clients" }
                        - match: { prefix: "/api/v1/clients" }
                          route: { cluster: vito_service, prefix_rewrite: "/v1/clients" }
                        - match: { prefix: "/api/v1/recovery" }
                          route: { cluster: vito_service, prefix_rewrite: "/v1/recovery" }

                        # ── VARAPI — Provider Registry ──
                        - match: { prefix: "/api/v1/providers/snapshot" }
                          route: { cluster: varapi_service, prefix_rewrite: "/internal/v1/snapshots/providers" }
                        - match: { prefix: "/api/v1/providers" }
                          route: { cluster: varapi_service, prefix_rewrite: "/v1/internal/providers" }

                        # ── TUSO — Facility Registry ──
                        - match: { prefix: "/api/v1/facilities/snapshot" }
                          route: { cluster: tuso_service, prefix_rewrite: "/internal/v1/snapshots/facilities" }
                        - match: { prefix: "/api/v1/facilities" }
                          route: { cluster: tuso_service, prefix_rewrite: "/v1/internal/facilities" }
                        - match: { prefix: "/api/v1/workspaces" }
                          route: { cluster: tuso_service, prefix_rewrite: "/v1/internal/workspaces" }
                        - match: { prefix: "/api/v1/resources" }
                          route: { cluster: tuso_service, prefix_rewrite: "/v1/internal/resources" }
                        - match: { prefix: "/api/v1/bookings" }
                          route: { cluster: tuso_service }
                        - match: { prefix: "/api/v1/telemetry" }
                          route: { cluster: tuso_service }

                        # ── ZIBO — Terminology ──
                        - match: { prefix: "/v1/artifacts" }
                          route: { cluster: zibo_service }
                        - match: { prefix: "/v1/packs" }
                          route: { cluster: zibo_service }

                        # ── PCT — Patient Care Tracker ──
                        - match: { prefix: "/api/v1/work" }
                          route: { cluster: pct_service, prefix_rewrite: "/v1/work" }
                        - match: { prefix: "/api/v1/encounters" }
                          route: { cluster: pct_service, prefix_rewrite: "/v1/encounters" }
                        - match: { prefix: "/api/v1/queues" }
                          route: { cluster: pct_service, prefix_rewrite: "/v1/queues" }

                        # ── OROS — Orders & Results ──
                        - match: { prefix: "/v1/orders" }
                          route: { cluster: oros_service }

                        # ── Governed PUBLIC gateway lane → Experience BFF ──
                        # Anonymous (R0) lane per docs/architecture/gateway-public-lane-security-adr.md:
                        # the BFF's permitAll list is the gate; ext_authz is disabled ONLY here, and
                        # externally supplied trust headers are stripped so an anonymous caller can
                        # never smuggle trust context. Must stay identical to infra/envoy/envoy.yaml
                        # (ENVOY-GATE: both files change together).
                        - match: { prefix: "/internal/v1/public/" }
                          route: { cluster: experience_bff }
                          request_headers_to_remove:
                            - "x-actor-id"
                            - "x-actor-type"
                            - "x-assurance-level"
                            - "x-purpose-of-use"
                            - "x-subject-id"
                            - "x-ial"
                            - "x-aal"
                            - "x-record-link-confidence"
                            - "x-session-assurance"
                            - "x-escalation-grant-id"
                            - "x-visibility-tier"
                            - "x-pii-access"
                            - "x-clinical-access"
                            - "x-obligations"
                          typed_per_filter_config:
                            envoy.filters.http.ext_authz:
                              "@type": type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthzPerRoute
                              disabled: true

                        # ── v1.1 internal paths → Experience BFF ──
                        - match: { prefix: "/internal/v1/" }
                          route: { cluster: experience_bff }
                        # RESIDUAL: /external/v1/ has NO single split-out owner — it is served
                        # across data-governance/channels/indawo/asset-registry/data-warehouse at
                        # distinct sub-paths, none of them a tshepo split-out. Re-pointing to any
                        # one of them would 404; it is left on the legacy `tshepo` cluster (the sole
                        # reason that container is still retained). W2-RED-FOLLOWUP: honest partial.
                        - match: { prefix: "/external/v1/" }
                          route: { cluster: tshepo_service }

                        # ── Pharmacy ──
                        - match: { prefix: "/api/v1/pharmacy" }
                          route: { cluster: pharmacy_service }
                        - match: { prefix: "/api/v1/prescriptions" }
                          route: { cluster: pharmacy_service }

                        # ── Mushex (Finance/Payments) ──
                        - match: { prefix: "/api/v1/payments" }
                          route: { cluster: mushex_service }
                        - match: { prefix: "/api/v1/refunds" }
                          route: { cluster: mushex_service }

                        # ── Costing Engine (COSTA) ──
                        - match: { prefix: "/api/v1/bills" }
                          route: { cluster: costa_service }
                        - match: { prefix: "/api/v1/tariffs" }
                          route: { cluster: costa_service }

                        # ── Ubomi (Inpatient/Beds) ──
                        - match: { prefix: "/api/v1/wards" }
                          route: { cluster: ubomi_service }
                        - match: { prefix: "/api/v1/beds" }
                          route: { cluster: ubomi_service }
                        - match: { prefix: "/api/v1/admissions" }
                          route: { cluster: ubomi_service }

                        # ── Experience BFF ──
                        - match: { prefix: "/bff/" }
                          route: { cluster: experience_bff, prefix_rewrite: "/" }
                        # (duplicate removed — /internal/v1/ above covers this)

                        # ── Health check passthrough (authz engine) ──
                        - match: { prefix: "/actuator/health" }
                          route: { cluster: tshepo_authz_service }

                http_filters:
                  # TSHEPO ext_authz — injects visibility headers (x-visibility-tier,
                  # x-pii-access, x-clinical-access, x-obligations, …) into every
                  # forwarded request so BFF VisibilityProfileController can read them.
                  - name: envoy.filters.http.ext_authz
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthz
                      transport_api_version: V3
                      grpc_service:
                        envoy_grpc:
                          cluster_name: tshepo_authz_grpc
                        timeout: 0.5s
                      failure_mode_allow: false
                      with_request_body:
                        max_request_bytes: 8192
                        allow_partial_message: true
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

  clusters:
    # ── OPA Sidecar ──
    - name: opa_sidecar
      type: STRICT_DNS
      connect_timeout: 0.5s
      load_assignment:
        cluster_name: opa_sidecar
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: opa, port_value: 8181 }

    # ── TSHEPO Authz (gRPC — for ext_authz) ──
    - name: tshepo_authz_grpc
      type: STRICT_DNS
      typed_extension_protocol_options:
        envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
          "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
          explicit_http_config:
            http2_protocol_options: {}
      load_assignment:
        cluster_name: tshepo_authz_grpc
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: tshepo-authz, port_value: 9090 }

    # ── TSHEPO Authz (HTTP/1.1 — for re-pointed REST trust routes) ──
    # LIVE default-DENY / fail-closed engine. Serves /v1/authorize, /v1/step-up,
    # /v1/break-glass, /v1/policies, /v1/devices and /actuator/health.
    - name: tshepo_authz_service
      type: STRICT_DNS
      load_assignment:
        cluster_name: tshepo_authz_service
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: tshepo-authz, port_value: 8081 }

    # ── TSHEPO (legacy monolith — DEPRECATED-RETIRED) ──
    # Backed by the `tshepo` compose container, RETAINED (W2-RED-FOLLOWUP) SOLELY
    # as the target for the residual `/external/v1/` family, which has no single
    # split-out owner. All 7 other non-PDP families (identity/consent/audit/keys/
    # sign/certificates/offline) now target their split-out clusters below, and the
    # PDP families target tshepo_authz_service. Remove this cluster + container once
    # `/external/v1/` gains a proven owner.
    - name: tshepo_service
      type: STRICT_DNS
      load_assignment:
        cluster_name: tshepo_service
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: tshepo, port_value: 8081 }

    # ── TSHEPO split-out services (W2-RED-FOLLOWUP) ──
    # Canonical non-PDP owners, wired into docker-compose.runtime.yml. Each serves
    # the /v1/* path proven by its controllers (see route table above).
    - name: tshepo_identity_service
      type: STRICT_DNS
      load_assignment:
        cluster_name: tshepo_identity_service
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: tshepo-identity, port_value: 8181 }

    - name: tshepo_consent_service
      type: STRICT_DNS
      load_assignment:
        cluster_name: tshepo_consent_service
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: tshepo-consent, port_value: 8182 }

    - name: tshepo_audit_service
      type: STRICT_DNS
      load_assignment:
        cluster_name: tshepo_audit_service
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: tshepo-audit, port_value: 8183 }

    - name: tshepo_keys_service
      type: STRICT_DNS
      load_assignment:
        cluster_name: tshepo_keys_service
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: tshepo-keys, port_value: 8184 }

    - name: tshepo_offline_service
      type: STRICT_DNS
      load_assignment:
        cluster_name: tshepo_offline_service
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: tshepo-offline, port_value: 8185 }

    # ── VITO ──
    - name: vito_service
      type: STRICT_DNS
      load_assignment:
        cluster_name: vito_service
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: vito, port_value: 8082 }

    # ── VARAPI ──
    - name: varapi_service
      type: STRICT_DNS
      load_assignment:
        cluster_name: varapi_service
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: varapi, port_value: 8083 }

    # ── TUSO ──
    - name: tuso_service
      type: STRICT_DNS
      load_assignment:
        cluster_name: tuso_service
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: tuso, port_value: 8084 }

    # ── ZIBO ──
    - name: zibo_service
      type: STRICT_DNS
      load_assignment:
        cluster_name: zibo_service
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: zibo, port_value: 8085 }

    # ── PCT ──
    - name: pct_service
      type: STRICT_DNS
      load_assignment:
        cluster_name: pct_service
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: pct, port_value: 8088 }

    # ── OROS ──
    - name: oros_service
      type: STRICT_DNS
      load_assignment:
        cluster_name: oros_service
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: oros, port_value: 8089 }

    # ── Pharmacy ──
    - name: pharmacy_service
      type: STRICT_DNS
      load_assignment:
        cluster_name: pharmacy_service
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: pharmacy, port_value: 8097 }

    # ── Mushex (Finance/Payments) ──
    - name: mushex_service
      type: STRICT_DNS
      load_assignment:
        cluster_name: mushex_service
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: mushex, port_value: 8102 }

    # ── COSTA (Costing Engine) ──
    - name: costa_service
      type: STRICT_DNS
      load_assignment:
        cluster_name: costa_service
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: costing-engine, port_value: 8101 }

    # ── Ubomi (Inpatient) ──
    - name: ubomi_service
      type: STRICT_DNS
      load_assignment:
        cluster_name: ubomi_service
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: ubomi, port_value: 8087 }

    # ── Experience BFF ──
    - name: experience_bff
      type: STRICT_DNS
      load_assignment:
        cluster_name: experience_bff
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: experience-bff, port_value: 8160 }
