# Recovery-code step. Keycloak asks for a SPECIFIC numbered code, not any code — someone
# holding a printed list will otherwise type the first one and be told it is wrong.
impiloRecoveryTitle=Use a recovery code
impiloRecoveryHint=Enter recovery code number {0} from the list you saved. Each code works once.
# Keycloak surfaces a generic invalid_user_credentials for BOTH a wrong password AND a flow
# that dead-ended — and the second case is common here: impilo-aal2-methods is REQUIRED with
# three ALTERNATIVEs, Keycloak skips any whose authenticator the user has not configured, so
# a staff member who has never enrolled a second factor fails work sign-in with a PERFECTLY
# CORRECT password. The stock wording asserts the password was wrong, which is then untrue,
# and sends people to reset a credential that never failed.
#
# This wording asserts NOTHING about which case occurred. It cannot: checking enrolment state
# from an unauthenticated form would be a user-enumeration oracle — anyone could discover
# which accounts exist and how they are secured. So it names the possibility and gives the
# next step, without confirming either.
invalidUserMessage=We could not complete sign-in. Check your details — and if they are correct, you may not have set up an authenticator app yet. Work sign-in requires one: sign in under Personal & Family first to set it up, then come back.
