global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    platform: impilo-vnext
    environment: local

rule_files:
  - "rules/*.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

scrape_configs:

  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  # ─── Infrastructure ───────────────────────────────────────────────────────────

  - job_name: impilo-infrastructure
    metrics_path: /metrics
    static_configs:
      - targets:
          - keycloak:8080
          - hapi-fhir:8080
          - vault:8200
        labels:
          plane: infrastructure

  - job_name: impilo-envoy
    metrics_path: /stats/prometheus
    static_configs:
      - targets:
          - envoy:9901
        labels:
          plane: gateway

  - job_name: impilo-kafka
    static_configs:
      - targets:
          - kafka:9308
        labels:
          plane: infrastructure

  - job_name: impilo-postgres
    static_configs:
      - targets:
          - postgres-exporter:9187
        labels:
          plane: infrastructure

  - job_name: impilo-redis
    static_configs:
      - targets:
          - redis-exporter:9121
        labels:
          plane: infrastructure

  # ─── Trust & Governance Plane ─────────────────────────────────────────────────

  - job_name: tshepo-authz
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['tshepo-authz-service:8081']
        labels:
          plane: trust-governance
          service: tshepo-authz

  - job_name: tshepo-identity
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['tshepo-identity-service:8181']
        labels:
          plane: trust-governance
          service: tshepo-identity

  - job_name: tshepo-consent
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['tshepo-consent-service:8182']
        labels:
          plane: trust-governance
          service: tshepo-consent

  - job_name: tshepo-audit
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['tshepo-audit-service:8183']
        labels:
          plane: trust-governance
          service: tshepo-audit

  - job_name: tshepo-keys
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['tshepo-keys-service:8184']
        labels:
          plane: trust-governance
          service: tshepo-keys

  - job_name: tshepo-offline
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['tshepo-offline-service:8185']
        labels:
          plane: trust-governance
          service: tshepo-offline

  # ─── Registry Spine Plane ─────────────────────────────────────────────────────

  - job_name: vito
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['vito-service:8082']
        labels:
          plane: registry-spine
          service: vito

  - job_name: varapi
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['varapi-service:8083']
        labels:
          plane: registry-spine
          service: varapi

  - job_name: tuso
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['tuso-service:8084']
        labels:
          plane: registry-spine
          service: tuso

  - job_name: zibo
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['zibo-service:8085']
