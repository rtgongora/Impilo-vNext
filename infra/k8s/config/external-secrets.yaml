---
# Database credentials (sealed — values are placeholders, encrypt with kubeseal)
apiVersion: v1
kind: Secret
metadata:
  name: postgresql-credentials
  namespace: impilo-data
  labels:
    part-of: impilo-vnext
type: Opaque
stringData:
  POSTGRES_USER: "impilo"
  POSTGRES_PASSWORD: "CHANGE_ME_USE_SEALED_SECRETS"
  POSTGRES_SUPERUSER_PASSWORD: "CHANGE_ME_USE_SEALED_SECRETS"
---
# Redis credentials
apiVersion: v1
kind: Secret
metadata:
  name: redis-credentials
  namespace: impilo-data
  labels:
    part-of: impilo-vnext
type: Opaque
stringData:
  REDIS_PASSWORD: "CHANGE_ME_USE_SEALED_SECRETS"
---
# Keycloak admin credentials
apiVersion: v1
kind: Secret
metadata:
  name: keycloak-credentials
  namespace: impilo-trust
  labels:
    part-of: impilo-vnext
type: Opaque
stringData:
  KEYCLOAK_ADMIN: "admin"
  KEYCLOAK_ADMIN_PASSWORD: "CHANGE_ME_USE_SEALED_SECRETS"
  KC_DB_PASSWORD: "CHANGE_ME_USE_SEALED_SECRETS"
---
# MinIO credentials
apiVersion: v1
kind: Secret
metadata:
  name: minio-credentials
  namespace: impilo-data
  labels:
    part-of: impilo-vnext
type: Opaque
stringData:
  MINIO_ROOT_USER: "impilo"
  MINIO_ROOT_PASSWORD: "CHANGE_ME_USE_SEALED_SECRETS"
---
# GHCR image pull secret (GitHub Container Registry)
apiVersion: v1
kind: Secret
metadata:
  name: ghcr-pull-secret
  namespace: impilo-ops
  labels:
    part-of: impilo-vnext
type: kubernetes.io/dockerconfigjson
stringData:
  .dockerconfigjson: '{"auths":{"ghcr.io":{"auth":"CHANGE_ME_BASE64_ENCODED"}}}'
