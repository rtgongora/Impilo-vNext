---
# PostgreSQL persistent volume claim
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgresql-data
  namespace: impilo-data
  labels:
    app: postgresql
    part-of: impilo-vnext
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: managed-premium
  resources:
    requests:
      storage: 100Gi
