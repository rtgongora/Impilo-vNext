apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: experience-plane-policy
  namespace: impilo-ui
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          name: impilo-gateway
    - podSelector: {}
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          name: impilo-gateway
    - namespaceSelector:
        matchLabels:
          name: impilo-infra
    - podSelector: {}
