apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: trust-plane-policy
  namespace: impilo-trust
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          name: impilo-gateway
    - namespaceSelector:
        matchLabels:
          part-of: impilo-vnext
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          name: impilo-infra
    - podSelector: {}
    - namespaceSelector:
        matchLabels:
          plane: trust-governance
