---
# Main Ingress — routes all traffic through Envoy gateway
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: impilo-main-ingress
  namespace: impilo-ops
  labels:
    part-of: impilo-vnext
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "120"
    nginx.ingress.kubernetes.io/rate-limit: "100"
    nginx.ingress.kubernetes.io/rate-limit-window: "1m"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - impilo.gov.zw
        - api.impilo.gov.zw
        - auth.impilo.gov.zw
      secretName: impilo-tls
  rules:
    # API traffic → Envoy gateway
    - host: api.impilo.gov.zw
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: envoy-gateway
                port:
                  number: 10000
    # Web UI traffic → One UI Shell (unified Experience)
    - host: impilo.gov.zw
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: one-ui-shell
                port:
                  number: 3000
    # Auth traffic → Keycloak
    - host: auth.impilo.gov.zw
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: keycloak
                port:
                  number: 8080
---
# Certificate issuer for Let's Encrypt
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: devops@mohcc.gov.zw
    privateKeySecretRef:
      name: letsencrypt-prod-key
    solvers:
      - http01:
          ingress:
            class: nginx
