# =============================================================================
# Impilo vNext — Build Phase (Wave 18)
# =============================================================================
#
# Builds all backend service JARs via Maven and the Experience UI via npm.
# Uses host-mounted caches for Maven and npm to support offline/air-gapped builds.
#
# Usage:
#   docker compose -f docker-compose.build.yml up --build
#   (or: ./scripts/dev-runtime.sh build)
#
# Pre-warm caches on a connected machine:
#   cd services && mvn dependency:go-offline -Dmaven.repo.local=../vendor/m2/repository
#   cd ui/experience && npm install --legacy-peer-deps --cache ../vendor/node-cache
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # Maven Builder — builds ALL backend services in one pass
  # ---------------------------------------------------------------------------
  maven-builder:
    # Debian/glibc: grpc protoc plugins are glibc-linked and fail on Alpine (musl).
    image: eclipse-temurin:21-jdk-jammy
    working_dir: /build/services
    # Use bash -lc as a single argv block (not entrypoint bash -c + cmd), so
    # `docker compose run maven-builder ...` is not broken by double-wrapping.
    entrypoint: []
    command:
      - /bin/bash
      - -lc
      - |
        set -eo pipefail
        echo "=== Installing Maven ==="
        apt-get update -qq
        rm -rf /var/lib/apt/lists/*
        DEBIAN_FRONTEND=noninteractive apt-get install -y -qq maven bash findutils >/dev/null
        rm -rf /var/lib/apt/lists/*
        echo "=== Building all services (skip tests for build phase) ==="
        # -T 1: avoid parallel protobuf/grpc codegen races on shared trees.
        # tshepo-contracts/target uses a named volume (see volumes) so protoc
        # plugin binaries keep +x on Docker Desktop for Windows (bind mounts strip it).
        mvn -B clean package -DskipTests \
          -Dmaven.repo.local=/root/.m2/repository \
          -T 1 \
          --fail-at-end
        echo "=== Maven build complete ==="
        # Copy all built JARs to output directory for easy access
        mkdir -p /build/output
        find /build/services -path "*/target/*.jar" -not -name "*-sources.jar" -not -name "*-javadoc.jar" -not -name "original-*" | while read -r jar; do
          svc_dir=$$(echo "$$jar" | sed 's|/build/services/||' | cut -d/ -f1)
          mkdir -p "/build/output/$$svc_dir"
          cp "$$jar" "/build/output/$$svc_dir/"
          echo "  -> $$svc_dir/$$(basename "$$jar")"
        done
        echo "=== JAR output complete ==="
    volumes:
      # Source code (read-only mount, except target dirs need write)
      - .:/build:rw
      # Maven local repository cache
      - ./vendor/m2/repository:/root/.m2/repository:rw
      # Protobuf/grpc plugins must be executable; Windows→Linux bind mounts drop +x
      # Persist the protobuf tool build output that fails on Windows bind mounts
      - tshepo-contracts-target:/build/libs/tshepo-contracts/target
    environment:
      MAVEN_OPTS: "-Xmx2g -XX:+UseZGC"

  # ---------------------------------------------------------------------------
  # UI Builder — builds the unified One UI Shell (merged Experience surface)
  # ---------------------------------------------------------------------------
  ui-builder:
    image: node:20-alpine
    working_dir: /build/ui/one-ui-shell
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        echo "=== Installing npm dependencies ==="
        npm install --legacy-peer-deps --cache /root/.npm
        echo "=== Building One UI Shell ==="
        npm run build
        echo "=== UI build complete ==="
    volumes:
      - ./ui/one-ui-shell:/build/ui/one-ui-shell:rw
      - ./ui/shared-ui:/build/ui/shared-ui:rw
      - ./contracts:/build/contracts:ro
      # npm cache
      - ./vendor/node-cache:/root/.npm:rw
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"

volumes:
  tshepo-contracts-target:
