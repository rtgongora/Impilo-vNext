# =============================================================================
# Impilo vNext — Layer 8: Observability (Optional)
# =============================================================================
# Prometheus, Grafana, OpenTelemetry Collector, Jaeger
#
# Included in: integration, pilot profiles
# =============================================================================

services:

  prometheus:
    image: prom/prometheus:v2.51.2
    container_name: impilo-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ../../tools/ops/observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=7d"
      - "--web.enable-lifecycle"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9090/-/healthy || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - impilo

  grafana:
    image: grafana/grafana:10.4.2
    container_name: impilo-grafana
    restart: unless-stopped
    ports:
      - "3100:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ../../tools/ops/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../../tools/ops/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      prometheus:
        condition: service_healthy
    networks:
      - impilo

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.98.0
    container_name: impilo-otel-collector
    restart: unless-stopped
    ports:
      - "4317:4317"
      - "4318:4318"
      - "8889:8889"
      - "13133:13133"
    volumes:
      - ../../tools/ops/observability/otel/otel-collector-config.yaml:/etc/otelcol/config.yaml:ro
    command: ["--config", "/etc/otelcol/config.yaml"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:13133/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - impilo

  jaeger:
    image: jaegertracing/all-in-one:1.56
    container_name: impilo-jaeger
    restart: unless-stopped
    ports:
      - "16686:16686"
      - "14250:14250"
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:14269/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - impilo

volumes:
  prometheus-data:

networks:
  impilo:
    external: true
    name: impilo-network
