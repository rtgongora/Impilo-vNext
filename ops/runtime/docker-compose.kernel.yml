# =============================================================================
# Impilo vNext — Layer 3+4: Kernel (Ring 0: Trust + Ring 1: Core Registries)
# =============================================================================
# Ring 0: TSHEPO (trust & governance)
# Ring 1: VITO, VARAPI, TUSO, ZIBO (core registries)
#
# Depends on: infra (postgres, redis, kafka), shared (keycloak)
# =============================================================================

x-service-defaults: &service-defaults
  restart: unless-stopped
  networks:
    - impilo

x-java-env: &java-env
  POSTGRES_HOST: postgres
  POSTGRES_PORT: 5432
  POSTGRES_USER: ${POSTGRES_USER:-impilo}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
  REDIS_HOST: redis
  REDIS_PORT: 6379
  KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  KEYCLOAK_URL: http://keycloak:8080
  KEYCLOAK_REALM: ${KEYCLOAK_REALM:-impilo}
  SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: "${SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI:-}"
  SPRING_AUTOCONFIGURE_EXCLUDE: "${SPRING_AUTOCONFIGURE_EXCLUDE:-org.springframework.boot.autoconfigure.security.oauth2.resource.servlet.OAuth2ResourceServerAutoConfiguration}"

x-java-depends: &java-depends
  postgres:
    condition: service_healthy
  redis:
    condition: service_healthy
  kafka:
    condition: service_healthy

x-java-healthcheck: &java-healthcheck
  interval: 10s
  timeout: 5s
  retries: 15
  start_period: 45s

services:

  # ===========================================================================
  # Ring 0 — Trust & Governance
  # ===========================================================================

  tshepo:
    <<: *service-defaults
    build:
      context: ../../services/tshepo-service
      dockerfile: Dockerfile
    container_name: impilo-tshepo
    environment:
      <<: *java-env
      SPRING_PROFILES_ACTIVE: default
    ports:
      - "8081:8081"
    depends_on:
      <<: *java-depends
    healthcheck:
      <<: *java-healthcheck
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/actuator/health || exit 1"]

  # ===========================================================================
  # Ring 1 — Core Registries
  # ===========================================================================

  vito:
    <<: *service-defaults
    build:
      context: ../../services/vito-service
      dockerfile: Dockerfile
    container_name: impilo-vito
    environment:
      <<: *java-env
    ports:
      - "8082:8082"
    depends_on:
      <<: *java-depends
    healthcheck:
      <<: *java-healthcheck
      test: ["CMD-SHELL", "wget -qO- http://localhost:8082/actuator/health || exit 1"]

  varapi:
    <<: *service-defaults
    build:
      context: ../../services/varapi-service
      dockerfile: Dockerfile
    container_name: impilo-varapi
    environment:
      <<: *java-env
    ports:
      - "8083:8083"
    depends_on:
      <<: *java-depends
    healthcheck:
      <<: *java-healthcheck
      test: ["CMD-SHELL", "wget -qO- http://localhost:8083/actuator/health || exit 1"]

  tuso:
    <<: *service-defaults
    build:
      context: ../../services/tuso-service
      dockerfile: Dockerfile
    container_name: impilo-tuso
    environment:
      <<: *java-env
    ports:
      - "8084:8084"
    depends_on:
      <<: *java-depends
    healthcheck:
      <<: *java-healthcheck
      test: ["CMD-SHELL", "wget -qO- http://localhost:8084/actuator/health || exit 1"]

  zibo:
    <<: *service-defaults
    build:
      context: ../../services/zibo-service
      dockerfile: Dockerfile
    container_name: impilo-zibo
    environment:
      <<: *java-env
    ports:
      - "8085:8085"
    depends_on:
      <<: *java-depends
    healthcheck:
      <<: *java-healthcheck
      test: ["CMD-SHELL", "wget -qO- http://localhost:8085/actuator/health || exit 1"]

networks:
  impilo:
    external: true
    name: impilo-network
