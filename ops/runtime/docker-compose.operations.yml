# =============================================================================
# Impilo vNext — Layer 5+6: Clinical Services + Operations
# =============================================================================
# Ring 2: PCT, OROS, Ubomi, Pharmacy, Inventory, Msika, Mushex, etc.
# Operations: Integration Hub, Notifications, Jobs, Reporting, etc.
#
# Depends on: infra, shared, kernel
# =============================================================================

x-service-defaults: &service-defaults
  restart: unless-stopped
  networks:
    - impilo

x-java-env: &java-env
  POSTGRES_HOST: postgres
  POSTGRES_PORT: 5432
  POSTGRES_USER: ${POSTGRES_USER:-impilo}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
  REDIS_HOST: redis
  REDIS_PORT: 6379
  KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  KEYCLOAK_URL: http://keycloak:8080
  KEYCLOAK_REALM: ${KEYCLOAK_REALM:-impilo}
  SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: "${SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI:-}"
  SPRING_AUTOCONFIGURE_EXCLUDE: "${SPRING_AUTOCONFIGURE_EXCLUDE:-org.springframework.boot.autoconfigure.security.oauth2.resource.servlet.OAuth2ResourceServerAutoConfiguration}"

x-java-depends: &java-depends
  postgres:
    condition: service_healthy
  redis:
    condition: service_healthy
  kafka:
    condition: service_healthy

x-java-healthcheck: &java-healthcheck
  interval: 10s
  timeout: 5s
  retries: 15
  start_period: 45s

services:

  # ===========================================================================
  # Ring 2 — Clinical Core
  # ===========================================================================

  pct:
    <<: *service-defaults
    build:
      context: ../../services/pct-service
      dockerfile: Dockerfile
    container_name: impilo-pct
    environment:
      <<: *java-env
      PCT_TELEMED_EXTERNAL_ENABLED: ${PCT_TELEMED_EXTERNAL_ENABLED:-true}
      PCT_TELEMED_EXTERNAL_BASE_URL: ${PCT_TELEMED_EXTERNAL_BASE_URL:-http://rtc-gateway:8195}
      PCT_TELEMED_EXTERNAL_SESSION_PATH: ${PCT_TELEMED_EXTERNAL_SESSION_PATH:-/internal/v1/rtc/sessions}
      PCT_TELEMED_EXTERNAL_API_KEY: ${PCT_TELEMED_EXTERNAL_API_KEY:-}
      PCT_TELEMED_FALLBACK_TO_MANAGED_PRIMARY: ${PCT_TELEMED_FALLBACK_TO_MANAGED_PRIMARY:-false}
      PCT_TELEMED_REQUIRE_CONSENT_REFERENCE_FOR_MEDIA: ${PCT_TELEMED_REQUIRE_CONSENT_REFERENCE_FOR_MEDIA:-true}
      PCT_TELEMED_ALLOW_EMERGENCY_WITHOUT_CONSENT: ${PCT_TELEMED_ALLOW_EMERGENCY_WITHOUT_CONSENT:-true}
    ports:
      - "8088:8088"
    depends_on:
      <<: *java-depends
      rtc-gateway:
        condition: service_healthy
    healthcheck:
      <<: *java-healthcheck
      test: ["CMD-SHELL", "wget -qO- http://localhost:8088/actuator/health || exit 1"]

  livekit:
    <<: *service-defaults
    image: livekit/livekit-server:latest
    container_name: impilo-livekit
    command: ["--dev", "--bind", "0.0.0.0"]
    ports:
      - "7880:7880"
      - "7881:7881"
      - "7882:7882/udp"
    healthcheck:
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
      test: ["CMD-SHELL", "wget -qO- http://localhost:7880 || exit 1"]

  rtc-gateway:
    <<: *service-defaults
    build:
      context: ../../services/rtc-gateway-service
      dockerfile: Dockerfile
    container_name: impilo-rtc-gateway
    environment:
      <<: *java-env
      RTC_PROVIDER: LIVEKIT
      RTC_FAIL_CLOSED: ${RTC_FAIL_CLOSED:-true}
      RTC_DEV_MODE_ENABLED: ${RTC_DEV_MODE_ENABLED:-false}
      RTC_TOKEN_TTL_SECONDS: ${RTC_TOKEN_TTL_SECONDS:-3600}
      RTC_RECORDING_ENABLED: ${RTC_RECORDING_ENABLED:-false}
      RTC_EGRESS_ENABLED: ${RTC_EGRESS_ENABLED:-false}
      RTC_REQUIRE_CONSENT_REFERENCE_FOR_MEDIA: ${RTC_REQUIRE_CONSENT_REFERENCE_FOR_MEDIA:-true}
      RTC_ALLOW_EMERGENCY_WITHOUT_CONSENT: ${RTC_ALLOW_EMERGENCY_WITHOUT_CONSENT:-true}
      LIVEKIT_ENABLED: ${LIVEKIT_ENABLED:-true}
      LIVEKIT_URL: ${LIVEKIT_URL:-http://livekit:7880}
      LIVEKIT_CLIENT_URL: ${LIVEKIT_CLIENT_URL:-ws://localhost:7880}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-devkey}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-secret}
    ports:
      - "8195:8195"
    depends_on:
      livekit:
        condition: service_healthy
    healthcheck:
      <<: *java-healthcheck
      test: ["CMD-SHELL", "wget -qO- http://localhost:8195/actuator/health || exit 1"]

  oros:
    <<: *service-defaults
    build:
      context: ../../services/oros-service
      dockerfile: Dockerfile
    container_name: impilo-oros
    environment:
      <<: *java-env
    ports:
      - "8089:8089"
    depends_on:
      <<: *java-depends
    healthcheck:
      <<: *java-healthcheck
      test: ["CMD-SHELL", "wget -qO- http://localhost:8089/actuator/health || exit 1"]

  ubomi:
    <<: *service-defaults
    build:
      context: ../../services/ubomi-service
      dockerfile: Dockerfile
    container_name: impilo-ubomi
    environment:
      <<: *java-env
    ports:
      - "8087:8087"
    depends_on:
      <<: *java-depends
    healthcheck:
      <<: *java-healthcheck
      test: ["CMD-SHELL", "wget -qO- http://localhost:8087/actuator/health || exit 1"]

  pharmacy:
    <<: *service-defaults
    build:
      context: ../../services/pharmacy-service
      dockerfile: Dockerfile
    container_name: impilo-pharmacy
    environment:
      <<: *java-env
    ports:
      - "8096:8096"
    depends_on:
      <<: *java-depends
    healthcheck:
      <<: *java-healthcheck
      test: ["CMD-SHELL", "wget -qO- http://localhost:8096/actuator/health || exit 1"]

  inventory:
    <<: *service-defaults
    build:
      context: ../../services/inventory-service
      dockerfile: Dockerfile
    container_name: impilo-inventory
    environment:
      <<: *java-env
    ports:
      - "8098:8098"
    depends_on:
      <<: *java-depends
    healthcheck:
      <<: *java-healthcheck
      test: ["CMD-SHELL", "wget -qO- http://localhost:8098/actuator/health || exit 1"]

  msika:
    <<: *service-defaults
    build:
      context: ../../services/msika-service
      dockerfile: Dockerfile
    container_name: impilo-msika
    environment:
      <<: *java-env
    ports:
      - "8086:8086"
    depends_on:
      <<: *java-depends
    healthcheck:
      <<: *java-healthcheck
      test: ["CMD-SHELL", "wget -qO- http://localhost:8086/actuator/health || exit 1"]

  msika-flow:
    <<: *service-defaults
    build:
      context: ../../services/msika-flow-service
      dockerfile: Dockerfile
    container_name: impilo-msika-flow
    environment:
      <<: *java-env
    ports:
      - "8100:8100"
    depends_on:
      <<: *java-depends
    healthcheck:
      <<: *java-healthcheck
      test: ["CMD-SHELL", "wget -qO- http://localhost:8100/actuator/health || exit 1"]

  mushex:
    <<: *service-defaults
    build:
      context: ../../services/mushex-service
      dockerfile: Dockerfile
    container_name: impilo-mushex
    environment:
      <<: *java-env
      SERVER_PORT: 8102
    ports:
      - "8102:8102"
    depends_on:
      <<: *java-depends
    healthcheck:
      <<: *java-healthcheck
      test: ["CMD-SHELL", "wget -qO- http://localhost:8102/actuator/health || exit 1"]

  costing-engine:
    <<: *service-defaults
    build:
      context: ../../services/costing-engine-service
      dockerfile: Dockerfile
    container_name: impilo-costing-engine
    environment:
      <<: *java-env
    ports:
      - "8101:8101"
    depends_on:
      <<: *java-depends
    healthcheck:
      <<: *java-healthcheck
      test: ["CMD-SHELL", "wget -qO- http://localhost:8101/actuator/health || exit 1"]

  document-service:
    <<: *service-defaults
    build:
      context: ../../services/document-service
      dockerfile: Dockerfile
    container_name: impilo-document-service
    environment:
      <<: *java-env
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
    ports:
      - "8093:8093"
    depends_on:
      <<: *java-depends
    healthcheck:
      <<: *java-healthcheck
      test: ["CMD-SHELL", "wget -qO- http://localhost:8093/actuator/health || exit 1"]

  landela-adapter:
    <<: *service-defaults
    build:
      context: ../../services/landela-adapter-service
      dockerfile: Dockerfile
    container_name: impilo-landela-adapter
    environment:
      <<: *java-env
    ports:
      - "8092:8092"
    depends_on:
      <<: *java-depends
    healthcheck:
      <<: *java-healthcheck
      test: ["CMD-SHELL", "wget -qO- http://localhost:8092/actuator/health || exit 1"]

  credential-verification:
    <<: *service-defaults
    build:
      context: ../../services/credential-verification-service
      dockerfile: Dockerfile
    container_name: impilo-credential-verification
    environment:
      <<: *java-env
    ports:
      - "8094:8094"
    depends_on:
      <<: *java-depends
    healthcheck:
      <<: *java-healthcheck
      test: ["CMD-SHELL", "wget -qO- http://localhost:8094/actuator/health || exit 1"]

  share-slip:
    <<: *service-defaults
    build:
      context: ../../services/share-slip-service
      dockerfile: Dockerfile
    container_name: impilo-share-slip
    environment:
      <<: *java-env
      SERVER_PORT: 8104
    ports:
      - "8104:8104"
    depends_on:
      <<: *java-depends
    healthcheck:
      <<: *java-healthcheck
      test: ["CMD-SHELL", "wget -qO- http://localhost:8104/actuator/health || exit 1"]

  reporting:
    <<: *service-defaults
    build:
      context: ../../services/reporting-service
      dockerfile: Dockerfile
    container_name: impilo-reporting
    environment:
      <<: *java-env
      SERVER_PORT: 8176
    ports:
      - "8176:8176"
    depends_on:
      <<: *java-depends
    healthcheck:
      <<: *java-healthcheck
      test: ["CMD-SHELL", "wget -qO- http://localhost:8176/actuator/health || exit 1"]

  # ===========================================================================
  # Operations Layer
  # ===========================================================================

  learning-service:
    <<: *service-defaults
    build:
      context: ../../services/learning-service
      dockerfile: Dockerfile
    container_name: impilo-learning-service
    environment:
      <<: *java-env
      SERVER_PORT: 8235
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/impilo_learning
      FUNDO_PUBLIC_BASE_URL: ${FUNDO_PUBLIC_BASE_URL:-https://fundo.impilo.local}
      FUNDO_WANTSURL_LOGIN_ENABLED: ${FUNDO_WANTSURL_LOGIN_ENABLED:-false}
      VARAPI_TO_LEARNING_INTERNAL_KEY: ${VARAPI_TO_LEARNING_INTERNAL_KEY:-}
      LEARNING_ORCHESTRATION_INTERNAL_KEY: ${LEARNING_ORCHESTRATION_INTERNAL_KEY:-}
      MOODLE_WS_TOKEN: ${MOODLE_WS_TOKEN:-}
      MOODLE_WS_ENDPOINT_URL: ${MOODLE_WS_ENDPOINT_URL:-}
      LEARNING_SECURITY_OAUTH2_ENABLED: "false"
      # Phase 3B — compose/dev Kafka noise reduction.
      # Helm production default remains "true" (see helm/learning/values.yaml),
      # but in local Compose the scheduled outbox publisher is intentionally
      # disabled by default so a developer running `docker compose up
      # learning-service` (or any partial profile that omits Kafka) does not
      # see repeated ERROR-level Kafka publisher logs every 500ms. Set this
      # to "true" with `KAFKA_BOOTSTRAP_SERVERS` reachable to exercise the
      # outbox → Kafka path end-to-end in dev.
      LEARNING_OUTBOX_PUBLISHER_ENABLED: ${LEARNING_OUTBOX_PUBLISHER_ENABLED:-false}
    ports:
      - "8235:8235"
    depends_on:
      <<: *java-depends
    healthcheck:
      <<: *java-healthcheck
      test: ["CMD-SHELL", "wget -qO- http://localhost:8235/actuator/health || exit 1"]

  experience-bff:
    <<: *service-defaults
    build:
      context: ../../services/experience-bff
      dockerfile: Dockerfile
    container_name: impilo-experience-bff
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: experience_bff
      DB_USER: ${POSTGRES_USER:-impilo}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      SPRING_PROFILES_ACTIVE: default
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-impilo}
      KEYCLOAK_TOKEN_SCOPE: ${KEYCLOAK_TOKEN_SCOPE:-openid profile email}
      # Sovereign service URLs (compose networking)
      PCT_BASE_URL: http://pct:8088
      # Aggregated patient summary (PCT + Mvumo consent) — run mvumo on host or add service to this compose
      MVUMO_BASE_URL: ${MVUMO_BASE_URL:-http://host.docker.internal:8195}
      OROS_BASE_URL: http://oros:8089
      PHARMACY_BASE_URL: http://pharmacy:8096
      VITO_BASE_URL: http://vito:8082
      TUSO_BASE_URL: http://tuso:8084
      VARAPI_BASE_URL: http://varapi:8083
      LEARNING_SERVICE_BASE_URL: http://learning-service:8235
      DOCUMENT_STORE_BASE_URL: http://document-service:8093
      COSTA_BASE_URL: http://costing-engine:8101
      COVERAGE_BASE_URL: ${COVERAGE_BASE_URL:-http://localhost:8140}
      SURVEILLANCE_BASE_URL: ${SURVEILLANCE_BASE_URL:-http://localhost:8180}
      CAMPAIGNS_BASE_URL: ${CAMPAIGNS_BASE_URL:-http://localhost:8190}
      INDAWO_BASE_URL: ${INDAWO_BASE_URL:-http://localhost:8150}
      ORTHANC_BASE_URL: http://orthanc:8042
      ORTHANC_DICOMWEB_URL: http://orthanc:8042/dicom-web
      FHIR_BASE_URL: http://hapi-fhir:8080/fhir
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      IMPILO_TELEMEDICINE_REQUIRE_TSHEPO_AUTHORIZE: ${IMPILO_TELEMEDICINE_REQUIRE_TSHEPO_AUTHORIZE:-true}
      IMPILO_TELEMEDICINE_TSHEPO_PDP_FALLBACK_ALLOW: ${IMPILO_TELEMEDICINE_TSHEPO_PDP_FALLBACK_ALLOW:-false}
      IMPILO_TELEMEDICINE_AUDIT_INGEST_ENABLED: ${IMPILO_TELEMEDICINE_AUDIT_INGEST_ENABLED:-true}
      IMPILO_TELEMEDICINE_REQUIRE_MEDIA_CONSENT_REFERENCE: ${IMPILO_TELEMEDICINE_REQUIRE_MEDIA_CONSENT_REFERENCE:-true}
      IMPILO_TELEMEDICINE_ALLOW_EMERGENCY_WITHOUT_CONSENT: ${IMPILO_TELEMEDICINE_ALLOW_EMERGENCY_WITHOUT_CONSENT:-true}
      IMPILO_TELEMEDICINE_ALLOWED_PURPOSE_OF_USE: ${IMPILO_TELEMEDICINE_ALLOWED_PURPOSE_OF_USE:-TREATMENT,EMERGENCY,PAYMENT,OPERATIONS,PUBLIC_HEALTH}
    ports:
      - "8160:8160"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      <<: *java-healthcheck
      test: ["CMD-SHELL", "wget -qO- http://localhost:8160/actuator/health || exit 1"]
      start_period: 30s

networks:
  impilo:
    external: true
    name: impilo-network
