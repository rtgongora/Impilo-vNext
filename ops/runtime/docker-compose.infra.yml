# =============================================================================
# Impilo vNext — Layer 0: Infrastructure
# =============================================================================
# PostgreSQL 16, Redis 7, Kafka 3.7 (KRaft), MinIO
#
# Usage: docker compose -f ops/runtime/docker-compose.infra.yml up -d
# =============================================================================

services:

  postgres:
    image: postgres:16-alpine
    container_name: impilo-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-impilo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ../../scripts/seed/init-databases.sql:/docker-entrypoint-initdb.d/01-init-databases.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-impilo}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - impilo

  # One-shot (restart: "no"): creates any missing DBs on existing volumes when new services are added.
  postgres-db-ensure:
    image: postgres:16-alpine
    container_name: impilo-postgres-db-ensure
    restart: "no"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-impilo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      PGHOST: postgres
    volumes:
      - ../../scripts/seed/ensure-databases.sh:/ensure-databases.sh:ro
    entrypoint: ["/bin/sh", "/ensure-databases.sh"]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - impilo

  redis:
    image: redis:7-alpine
    container_name: impilo-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - impilo

  kafka:
    image: apache/kafka:3.7.1
    container_name: impilo-kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      CLUSTER_ID: "impilo-local-dev-cluster-01"
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - impilo

  minio:
    image: minio/minio:latest
    container_name: impilo-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - impilo

volumes:
  pg_data:
  minio_data:

networks:
  impilo:
    name: impilo-network
    driver: bridge
