# =============================================================================
# Impilo vNext — Canonical Platform Runtime Manifest
# =============================================================================
#
# This is the single source of truth for all runnable platform components.
# Every service, infrastructure dependency, edge component, and UI app
# is declared here with its startup layer, dependencies, healthcheck,
# and bootstrap requirements.
#
# Layers (startup order):
#   0 — infra      : Databases, caches, message brokers, object storage
#   1 — shared      : Identity provider, FHIR server, PACS, schema registry
#   2 — edge        : API gateway (Envoy), policy engine (OPA)
#   3 — ring0       : Trust & governance core (TSHEPO decomposition)
#   4 — ring1       : Core registries (VITO, VARAPI, TUSO, ZIBO)
#   5 — ring2       : Clinical, pharmacy, supply chain, finance
#   6 — operations  : Integration hub, workflow, notifications, jobs
#   7 — apps        : BFF, UIs, consoles, portals
#   8 — observability: Prometheus, Grafana, OTel, Jaeger (optional layer)
#
# Shutdown order is reverse of startup order (layer 8 → 0).
#
# Profiles:
#   dev-lite    : infra + shared + edge + ring0 + ring1 + 1 UI
#   dev-full    : all layers 0–7
#   integration : all layers 0–7 + observability
#   pilot       : all layers 0–8 (production-like)
# =============================================================================

version: "1.0"
generated: "2026-03-16"

