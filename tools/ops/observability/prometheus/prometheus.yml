  - job_name: ubomi
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['ubomi:8087']
        labels:
          plane: clinical
          service: ubomi

  - job_name: msika
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['msika:8086']
        labels:
          plane: supply
          service: msika

  # ── OTel Collector self-metrics ──
  - job_name: otel-collector
    static_configs:
      - targets: ['otel-collector:8889']
        labels:
          service: otel-collector
