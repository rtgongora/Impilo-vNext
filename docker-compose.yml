version: "3.9"

# =============================================================================
# Impilo vNext — Local Development Infrastructure
# Usage: docker compose up -d
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # PostgreSQL 16 — one instance, per-service databases created via init script
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: impilo
      POSTGRES_PASSWORD: changeme
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./scripts/seed/init-databases.sql:/docker-entrypoint-initdb.d/01-init-databases.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U impilo"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ---------------------------------------------------------------------------
  # Redis 7
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ---------------------------------------------------------------------------
  # Apache Kafka 3.7 (KRaft mode — no ZooKeeper)
  # ---------------------------------------------------------------------------
  kafka:
    image: apache/kafka:3.7.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      CLUSTER_ID: "impilo-local-dev-cluster-01"
    ports:
      - "9092:9092"

  # ---------------------------------------------------------------------------
  # MinIO (S3-compatible object storage)
  # ---------------------------------------------------------------------------
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  # ---------------------------------------------------------------------------
  # Keycloak 25.x (Identity Provider)
  # ---------------------------------------------------------------------------
  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: impilo
      KC_DB_PASSWORD: changeme
    ports:
      - "8080:8080"
    volumes:
      - ./scripts/seed/impilo-realm.json:/opt/keycloak/data/import/impilo-realm.json
    depends_on:
      postgres:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # HAPI FHIR R4 (BUTANO — Shared Health Record)
  # ---------------------------------------------------------------------------
  hapi-fhir:
    image: hapiproject/hapi:v7.4.0
    environment:
      spring.datasource.url: jdbc:postgresql://postgres:5432/butano
      spring.datasource.username: impilo
      spring.datasource.password: changeme
      spring.datasource.driverClassName: org.postgresql.Driver
      spring.jpa.properties.hibernate.dialect: org.hibernate.dialect.PostgreSQLDialect
      hapi.fhir.fhir_version: R4
    ports:
      - "8090:8080"
    depends_on:
      postgres:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # Orthanc (PACS / DICOM server)
  # ---------------------------------------------------------------------------
  orthanc:
    image: orthancteam/orthanc:24.8.1
    ports:
      - "8042:8042"
      - "4242:4242"
    volumes:
      - orthanc_data:/var/lib/orthanc/db

  # ---------------------------------------------------------------------------
  # HashiCorp Vault (Secret Management)
  # ---------------------------------------------------------------------------
  vault:
    image: hashicorp/vault:1.17
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: "impilo-dev-root"
      VAULT_ADDR: "http://0.0.0.0:8200"
    ports:
      - "8200:8200"
    cap_add:
      - IPC_LOCK

  # ---------------------------------------------------------------------------
  # Apicurio Schema Registry (Event Schemas)
  # ---------------------------------------------------------------------------
  apicurio:
    image: apicurio/apicurio-registry-mem:2.6.2.Final
    ports:
      - "8093:8081"

  # ---------------------------------------------------------------------------
  # Prometheus (Metrics Collection)
  # ---------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.53.0
    volumes:
      - ./infra/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"

  # ---------------------------------------------------------------------------
  # Grafana (Dashboards)
  # ---------------------------------------------------------------------------
  grafana:
    image: grafana/grafana:11.1.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    ports:
      - "3100:3000"

  # ---------------------------------------------------------------------------
  # Domain Services
  # ---------------------------------------------------------------------------
  tuso:
    build:
      context: ./services/tuso-service
    ports:
      - "8084:8084"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/tuso
      SPRING_DATASOURCE_USERNAME: impilo
      SPRING_DATASOURCE_PASSWORD: changeme
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8084/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10

  zibo:
    build:
      context: ./services/zibo-service
    ports:
      - "8085:8085"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/zibo
      SPRING_DATASOURCE_USERNAME: impilo
      SPRING_DATASOURCE_PASSWORD: changeme
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8085/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ---------------------------------------------------------------------------
  # Seed Data One-Shot Service
  # ---------------------------------------------------------------------------
  seed-data:
    image: postgres:16-alpine
    environment:
      PGPASSWORD: changeme
    volumes:
      - ./scripts/seed:/scripts/seed
    depends_on:
      postgres:
        condition: service_healthy
      tuso:
        condition: service_healthy
      zibo:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        apk add --no-cache jq
        echo "Waiting for PostgreSQL..."
        until pg_isready -h postgres -U impilo; do
          sleep 1
        done
        echo "PostgreSQL is ready. Running TUSO seed script..."
        psql -h postgres -U impilo -d tuso -f /scripts/seed/tuso_seed.sql
        echo "Preparing ZIBO compact seed data..."
        jq -c . /scripts/seed/zibo_seed.json > /scripts/seed/zibo_seed.compact.json
        echo "Running ZIBO seed script..."
        psql -h postgres -U impilo -d zibo -f /scripts/seed/zibo_seed.sql
        rm /scripts/seed/zibo_seed.compact.json
        echo "Seed data loaded."

volumes:
  pg_data:
  minio_data:
  orthanc_data:
