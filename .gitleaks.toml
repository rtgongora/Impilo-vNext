# gitleaks config for Impilo — high-entropy / known-pattern secret detection.
# The low-entropy preview *-change-me-* placeholders are handled by
# scripts/guard/check-committed-secrets.sh (baseline guard); here we allowlist
# them so gitleaks focuses on REAL secrets (keys, tokens, strong randoms) that
# must never be committed. See docs/security/secrets-management-migration-plan.md.
title = "Impilo gitleaks"

[extend]
useDefault = true

[allowlist]
description = "Vendored/build dirs, examples, and the catalogued preview placeholders"
paths = [
  '''(^|/)node_modules/''',
  '''(^|/)(target|dist|build)/''',
  '''(^|/)reports/''',
  '''\.example($|\.)''',
  '''example\.env$''',
  '''scripts/guard/committed-secrets-baseline\.txt$''',
]
regexes = [
  '''[Cc]hange[_-]?[Mm]e''',
  '''CHANGE_ME''',
]
