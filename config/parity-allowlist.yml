    issue: mobile-butano-partial

  - path: ui/one-ui-shell/src/app/welcome/page.tsx
    capability: Public L0 intent landing (welcome)
    reason: >-
      False positive on the placeholder-copy regex. The page renders an honest
      per-pillar access badge whose not-yet-available state reads "Coming soon"
      (truthful UI state, not placeholder debt), and a doctrine comment lists the
      same three pillar states. No mock data, no BFF calls, no personal/health
      data — same static public-orientation class as the product-truth surface
      allowlist entry for /welcome. Not part of this session's participation gaps.
    review_date: 2026-08-01
    owner: experience-shell
    class: honest_false_positive
    remediation: Retire this entry if the pillar badge copy stops using "Coming soon".
    issue: parity-welcome-coming-soon

  - path: ui/one-ui-shell/src/app/about/page.tsx
    capability: Public programme information
    reason: >-
      Static public information surface. It deliberately renders governed
      Ministry and platform-orientation copy through the shared PublicShell and
      has no transactional API or personal-data dependency.
    review_date: 2026-10-01
    owner: experience-shell
    class: static_public_information
    remediation: Remove this entry if /about gains live operational content.
    issue: parity-public-about-static

  - path: ui/one-ui-shell/src/app/contact/page.tsx
    capability: Public contact and support orientation
    reason: >-
      Static official contact information plus links into the live feedback,
      participation and service-status lanes. The page itself performs no
      transaction and therefore does not require a page-local API hook.
    review_date: 2026-10-01
    owner: experience-shell
    class: static_public_information
    remediation: Remove this entry if /contact gains a page-local transaction.
    issue: parity-public-contact-static

  - path: ui/one-ui-shell/src/app/clinical/emergency/analytics/page.tsx
    capability: Emergency analytics (WHO DSEC indicators)
    reason: >-
      A named-absence page, and it has no API hook on purpose. No emergency
      indicator is computed anywhere: EMS.DSEC.MINIMUM_DATASET is recorded
      DEFERRED to W17 in the emergency standards register, and reporting-service
      has its own database with no view of the pct schema, so no definition
      naming pct_* could execute even if one were seeded. The page therefore
      lists the ten measures a district officer would expect and states what
      blocks each, and renders no figures at all — a zero on an emergency
      dashboard is read as "no deaths", not as "no pipeline". Wiring it to a
      hook that returns nothing would be the stub this guard exists to catch.
    review_date: 2026-09-01
    owner: clinical-emergency
    class: intentionally_deferred
    remediation: >-
      W17 lands the rpt_emergency_episode_metric projection and the indicator
      definitions; replace the list with the real measures and delete this entry.
    issue: parity-emergency-analytics-w17

