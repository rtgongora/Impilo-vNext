syntax = "proto3";

package envoy.service.auth.v3;

option java_multiple_files = true;
option java_package = "io.envoyproxy.envoy.service.auth.v3";

import "google/protobuf/timestamp.proto";

// An attribute context for the authorization check.
message AttributeContext {
  // The source of a network activity (the client).
  Peer source = 1;
  // The destination of a network activity (the server).
  Peer destination = 2;
  // Represents a network request.
  Request request = 4;
  // Context extensions (arbitrary metadata passed by Envoy config).
  map<string, string> context_extensions = 10;

  message Peer {
    string address = 1;
    uint32 port = 2;
    map<string, string> labels = 6;
    string principal = 7;
    string certificate = 8;
  }

  message Request {
    google.protobuf.Timestamp time = 1;
    HttpRequest http = 2;

    message HttpRequest {
      string id = 1;
      string method = 2;
      map<string, string> headers = 3;
      string path = 4;
      string host = 5;
      string scheme = 6;
      string query = 7;
      string fragment = 8;
      uint64 size = 9;
      string protocol = 10;
      string body = 11;
      map<string, string> raw_body = 12;
    }
  }
}
