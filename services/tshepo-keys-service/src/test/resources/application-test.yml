# Auto-generated H2 test profile so the golden-contract @SpringBootTest boots offline.
spring:
  kafka:
    bootstrap-servers: localhost:9092
    listener:
      auto-startup: false
  datasource:
    url: "jdbc:h2:mem:tshepo_keys_service;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;INIT=CREATE SCHEMA IF NOT EXISTS tshepo_keys\\;SET SCHEMA tshepo_keys"
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ""

tshepo:
  keys:
    # Strong test-only KEK — ConfigKekProvider rejects blanks and known placeholders.
    kek: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"

impilo:
  security:
    disable-oauth-for-tests: true
