server:
  port: 0

spring:
  application:
    name: offline-sync-service-test
  datasource:
    # Two things INIT has to fix before this datasource can hold anything at all:
    #   1. the `offline_sync` schema the entities declare (@Table(schema="offline_sync"));
    #   2. a JSONB domain — the entities carry columnDefinition="jsonb", which H2 does not know.
    # Without (2) every `create table` failed with `Unknown data type: "JSONB"` as a Hibernate
    # *WARNING*, so the context started green against a completely empty database. No test in
    # this module touched persistence, so nothing ever reported it.
    url: "jdbc:h2:mem:offlinesynctest;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;INIT=CREATE SCHEMA IF NOT EXISTS offline_sync\\;CREATE DOMAIN IF NOT EXISTS JSONB AS VARCHAR"
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      group-id: offline-sync-service-test
      auto-offset-reset: earliest
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration
impilo:
  security:
    disable-oauth-for-tests: true
