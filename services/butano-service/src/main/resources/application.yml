server:
  port: 8090
  servlet:
    context-path: /

spring:
  main:
    allow-circular-references: true
  application:
    name: butano-service

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/butano
    username: ${POSTGRES_USER:impilo}
    password: ${POSTGRES_PASSWORD:changeme}
    hikari:
      maximum-pool-size: 30
      minimum-idle: 5
      connection-timeout: 20000

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true
        search:
          enabled: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    out-of-order: true
    # BUTANO is the shared health record. Its data must never be deleted on any redeploy or
    # boot, so `clean` is disabled explicitly rather than left to the framework default —
    # relying on a default for the one database that holds the national clinical record is
    # not a safety position. There is no supported path that empties this schema; a genuine
    # restore goes through scripts/dr/restore-db.sh from a backup, never through a clean.
    clean-disabled: true

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    consumer:
      group-id: butano-shr
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      enable-auto-commit: false
      properties:
        isolation.level: read_committed
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER:http://localhost:8080/realms/impilo}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

# ═══════════════════════════════════════════════════════════
# HAPI FHIR Server configuration
# ═══════════════════════════════════════════════════════════
hapi:
  fhir:
    fhir-version: R4
    server-address: ${BUTANO_SERVER_ADDRESS:http://localhost:8090/fhir}
    default-page-size: 20
    max-page-size: 200
    allow-multiple-delete: false
    allow-cascading-deletes: false
    allow-contains-searches: true
    allow-external-references: false
    expunge-enabled: false
    enforce-referential-integrity-on-write: true
    enforce-referential-integrity-on-delete: false

# ═══════════════════════════════════════════════════════════
# BUTANO custom configuration
# ═══════════════════════════════════════════════════════════
butano:
  tenant:
    enforce: true
    tag-system: "https://impilo.gov.zw/tenant"
  pii:
    enforce: true
  terminology:
    validation-enabled: ${ZIBO_VALIDATION_ENABLED:false}
    zibo-base-url: ${ZIBO_BASE_URL:http://localhost:8085}
    mode: ${ZIBO_MODE:LENIENT}
  reconciliation:
    batch-size: 100
    provisional-tag-system: "https://impilo.gov.zw/provisional"
    provisional-tag-code: "provisional"
  provenance:
    tag-system: "https://impilo.gov.zw/provenance"
  outbox:
    poll-interval-ms: 2000
