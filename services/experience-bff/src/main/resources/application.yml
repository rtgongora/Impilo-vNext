    credential-base-url: ${CREDENTIAL_BASE_URL:http://localhost:8094}
    fhir-base-url: ${FHIR_BASE_URL:http://localhost:8090/fhir}
    fhir-gateway-base-url: ${FHIR_GATEWAY_BASE_URL:http://localhost:8091}
    search-base-url: ${SEARCH_BASE_URL:http://localhost:8230}
    learning:
      base-url: ${LEARNING_SERVICE_BASE_URL:http://localhost:8235}
    forms-base-url: ${FORMS_BASE_URL:http://localhost:8240}
    rules-base-url: ${RULES_BASE_URL:http://localhost:8241}
    workflow-base-url: ${WORKFLOW_BASE_URL:http://localhost:8250}
    # Health OS §13: Conversational & Guidance
    guidance-base-url: ${GUIDANCE_BASE_URL:http://localhost:8260}
    integration-hub-base-url: ${INTEGRATION_HUB_BASE_URL:http://localhost:8110}
    # Health OS §6: Privacy by Architecture — Data Access Governance
    dags-base-url: ${DAGS_BASE_URL:http://localhost:8170}
    # Health OS §7: Trust Layer (TSHEPO cluster)
    tshepo-authz-base-url: ${TSHEPO_AUTHZ_BASE_URL:http://localhost:8081}
    tshepo-consent-base-url: ${TSHEPO_CONSENT_BASE_URL:http://localhost:8182}
    mvumo-base-url: ${MVUMO_BASE_URL:http://localhost:8195}
    tshepo-audit-base-url: ${TSHEPO_AUDIT_BASE_URL:http://localhost:8183}

    # Health Intelligence Plane — AI Model Registry
    ai-model-registry-base-url: ${AI_MODEL_REGISTRY_BASE_URL:http://localhost:8280}
    llm-orchestration-base-url: ${LLM_ORCHESTRATION_BASE_URL:http://localhost:8265}
    # ERP Plane — general ledger, HR/payroll, procurement
    general-ledger-base-url: ${GENERAL_LEDGER_BASE_URL:http://localhost:8281}
    hr-payroll-base-url: ${HR_PAYROLL_BASE_URL:http://localhost:8282}
    procurement-base-url: ${PROCUREMENT_BASE_URL:http://localhost:8283}
    scheduling-service-base-url: ${SCHEDULING_SERVICE_BASE_URL:http://localhost:8128}
    booking-base-url: ${BOOKING_BASE_URL:http://localhost:8265}

  clinical-platform:
    base-url: ${CLINICAL_KNOWLEDGE_PLATFORM_BASE_URL:http://localhost:8270}

resilience4j:
  circuitbreaker:
    configs:
      default:
        failure-rate-threshold: 50
        slow-call-rate-threshold: 80
        slow-call-duration-threshold: 3s
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 5
        sliding-window-type: COUNT_BASED
        sliding-window-size: 20
        minimum-number-of-calls: 10
      critical:
        failure-rate-threshold: 30
        wait-duration-in-open-state: 15s
        sliding-window-size: 10
    instances:
      pct-service:
        base-config: critical
      oros-service:
        base-config: critical
      vito-service:
        base-config: critical
      pharmacy-service:
        base-config: default
      tuso-service:
        base-config: default
      butano-service:
        base-config: default
      mushex-service:
        base-config: default
      coverage-service:
        base-config: default
      mushe-wallet-service:
        base-config: default
  bulkhead:
    configs:
      default:
        max-concurrent-calls: 100
        max-wait-duration: 500ms
      critical:
        max-concurrent-calls: 200
        max-wait-duration: 1s
    instances:
      pct-service:
        base-config: critical
      vito-service:
        base-config: critical
      oros-service:
        base-config: critical
  retry:
    configs:
      default:
        max-attempts: 2
        wait-duration: 500ms
        retry-exceptions:
          - java.io.IOException
          - org.springframework.web.client.ResourceAccessException
        ignore-exceptions:
          - org.springframework.web.client.HttpClientErrorException

logging:
  level:
    zw.gov.mohcc.impilo: INFO
    org.springframework.web: INFO
    io.github.resilience4j: INFO
