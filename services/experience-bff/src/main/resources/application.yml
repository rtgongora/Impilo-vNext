server:
  port: 8160

spring:
  application:
    name: experience-bff
  threads:
    virtual:
      enabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000
      lettuce:
        pool:
          max-active: 50
          max-idle: 20
          min-idle: 5
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: experience-bff
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${KEYCLOAK_URL:http://localhost:8080}/realms/${KEYCLOAK_REALM:impilo}/protocol/openid-connect/certs
          issuer-uri: ${KEYCLOAK_URL:http://localhost:8080}/realms/${KEYCLOAK_REALM:impilo}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized

impilo:
  registry-intake:
    redis-ttl-days: ${REGISTRY_INTAKE_REDIS_TTL_DAYS:30}
    events-topic: ${REGISTRY_INTAKE_EVENTS_TOPIC:impilo.registry.intake}
    tshepo-pdp-enabled: ${REGISTRY_INTAKE_TSHEPO_PDP_ENABLED:false}
    tshepo-pdp-fallback-allow: ${REGISTRY_INTAKE_TSHEPO_PDP_FALLBACK_ALLOW:false}
  intelligence:
    events-topic: ${IMPILO_INTELLIGENCE_EVENTS_TOPIC:impilo.intelligence.events}
    require-tshepo-authorize: ${IMPILO_INTELLIGENCE_REQUIRE_TSHEPO:false}
    tshepo-pdp-fallback-allow: ${IMPILO_INTELLIGENCE_TSHEPO_FALLBACK_ALLOW:false}
  imaging:
    require-tshepo-authorize: ${IMPILO_IMAGING_REQUIRE_TSHEPO:false}
    tshepo-pdp-fallback-allow: ${IMPILO_IMAGING_TSHEPO_FALLBACK_ALLOW:false}
    audit-ingest-enabled: ${IMPILO_IMAGING_AUDIT_INGEST_ENABLED:true}
  finance:
    require-tshepo-authorize: ${IMPILO_FINANCE_REQUIRE_TSHEPO:false}
    tshepo-pdp-fallback-allow: ${IMPILO_FINANCE_TSHEPO_FALLBACK_ALLOW:false}
  shell-workspace:
    require-tshepo-authorize: ${IMPILO_SHELL_WORKSPACE_REQUIRE_TSHEPO:false}
    tshepo-pdp-fallback-allow: ${IMPILO_SHELL_WORKSPACE_TSHEPO_FALLBACK_ALLOW:false}
    redis-ttl-days: ${IMPILO_SHELL_WORKSPACE_REDIS_TTL_DAYS:120}
  security:
    allow-anonymous: false
  auth:
    fallback-enabled: ${AUTH_FALLBACK_ENABLED:false}
  scheduling:
    # Merge scheduling-service slot grid with Tuso bookings for /appointments/availability
    use-remote-slots: ${SCHEDULING_USE_REMOTE_SLOTS:true}
  wallet:
    # MusheX gateway-neutrality doctrine, "Wallet local-fallback principle" (audit gap G-5).
    # false (default, production-safe) — when the upstream Mushe Wallet service is unavailable,
    # return 503 WALLET_UPSTREAM_UNAVAILABLE rather than synthesising wallet balances/transactions.
    # true (dev/test only) — fall back to the in-memory wallet shape and log a WARN
    # "WALLET FALLBACK ACTIVATED" line for every activation so the event is auditable.
    allow-local-fallback: ${IMPILO_WALLET_ALLOW_LOCAL_FALLBACK:false}
  bff:
    citizen-longtail:
      # stub = deterministic BFF behaviour; live = VITO patient-share + credential public verify
      mode: ${IMPILO_BFF_CITIZEN_LONGTAIL_MODE:stub}
      # When live: stub_fallback recovers to legacy BFF stubs on downstream errors; propagate returns HTTP 502
      failure-policy: ${IMPILO_BFF_CITIZEN_LONGTAIL_FAILURE_POLICY:stub_fallback}
    provider-hubs:
      # stub = BFF holds hard-coded sections; live = fetch sections from one-ui-shell gateway.
      mode: ${IMPILO_BFF_PROVIDER_HUBS_MODE:stub}
      failure-policy: ${IMPILO_BFF_PROVIDER_HUBS_FAILURE_POLICY:stub_fallback}
      one-ui-shell-base-url: ${ONE_UI_SHELL_BASE_URL:http://localhost:3000}
    facilities:
      # live = TUSO then seed fallback; stub = seed only (CI / Maestro without TUSO)
      mode: ${IMPILO_BFF_FACILITIES_MODE:live}
  services:
    pct-base-url: ${PCT_BASE_URL:http://localhost:8088}
    oros-base-url: ${OROS_BASE_URL:http://localhost:8089}
    pharmacy-base-url: ${PHARMACY_BASE_URL:http://localhost:8096}
    butano-base-url: ${BUTANO_BASE_URL:http://localhost:8090}
    msika-base-url: ${MSIKA_BASE_URL:http://localhost:8086}
    msika-flow-base-url: ${MSIKA_FLOW_BASE_URL:http://localhost:8100}
    mushex-base-url: ${MUSHEX_BASE_URL:http://localhost:8102}
    dispatch-base-url: ${DISPATCH_BASE_URL:http://localhost:8320}
    ndila-base-url: ${NDILA_BASE_URL:http://localhost:8155}
    nhume-base-url: ${NHUME_BASE_URL:${NHUME_SERVICE_BASE_URL:http://localhost:8210}}
    madi-base-url: ${MADI_BASE_URL:${MADI_SERVICE_BASE_URL:http://localhost:8300}}
    vito-base-url: ${VITO_BASE_URL:http://localhost:8082}
    tuso-base-url: ${TUSO_BASE_URL:http://localhost:8084}
    varapi-base-url: ${VARAPI_BASE_URL:http://localhost:8083}
    document-store-base-url: ${DOCUMENT_STORE_BASE_URL:http://localhost:8093}
    costa-base-url: ${COSTA_BASE_URL:http://localhost:8101}
    coverage-base-url: ${COVERAGE_BASE_URL:http://localhost:8140}
    surveillance-base-url: ${SURVEILLANCE_BASE_URL:http://localhost:8180}
    campaigns-base-url: ${CAMPAIGNS_BASE_URL:http://localhost:8190}
    # Public Health & Data Plane — national repository, pipelines, warehouse, ingestion, reporting
    ndr-national-base-url: ${NDR_NATIONAL_BASE_URL:http://localhost:8152}
    ndr-query-base-url: ${NDR_QUERY_BASE_URL:http://localhost:8232}
    data-pipeline-base-url: ${DATA_PIPELINE_BASE_URL:http://localhost:8215}
    reporting-base-url: ${REPORTING_BASE_URL:http://localhost:8176}
    data-warehouse-base-url: ${DATA_WAREHOUSE_BASE_URL:http://localhost:8233}
    data-ingestion-base-url: ${DATA_INGESTION_BASE_URL:http://localhost:8210}
    indawo-base-url: ${INDAWO_BASE_URL:http://localhost:8150}
    tshepo-identity-base-url: ${TSHEPO_IDENTITY_BASE_URL:http://localhost:8181}
    tshepo-keys-base-url: ${TSHEPO_KEYS_BASE_URL:http://localhost:8184}
    tshepo-offline-base-url: ${TSHEPO_OFFLINE_BASE_URL:http://localhost:8185}
    zibo-base-url: ${ZIBO_BASE_URL:http://localhost:8085}
    ubomi-base-url: ${UBOMI_BASE_URL:http://localhost:8087}
    inpatient-base-url: ${INPATIENT_BASE_URL:http://localhost:8121}
    pacs-base-url: ${PACS_BASE_URL:http://localhost:8113}
    community-base-url: ${COMMUNITY_BASE_URL:http://localhost:8122}
