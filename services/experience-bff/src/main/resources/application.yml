server:
  port: 8160

spring:
  application:
    name: experience-bff
  threads:
    virtual:
      enabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000
      lettuce:
        pool:
          max-active: 50
          max-idle: 20
          min-idle: 5
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: experience-bff
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${KEYCLOAK_URL:http://localhost:8080}/realms/${KEYCLOAK_REALM:impilo}/protocol/openid-connect/certs
          issuer-uri: ${KEYCLOAK_URL:http://localhost:8080}/realms/${KEYCLOAK_REALM:impilo}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized

impilo:
  # Server-authoritative tenant (TenantContextFilter). OFF | SHADOW | ENFORCE.
  # SHADOW = resolve + audit divergence, forward the caller's header unchanged. It stays SHADOW
  # until the divergence rate is measured AND a real tenant claim exists: without the claim,
  # ENFORCE asserts "authenticated => the platform's tenant", which removes the caller's ability
  # to choose but is NOT per-tenant isolation. Flipping it is a PO decision, not a config tidy-up.
  tenancy:
    mode: ${IMPILO_TENANCY_MODE:SHADOW}
    claim: ${IMPILO_TENANCY_CLAIM:tenant_id}
    authenticated-default: ${IMPILO_TENANCY_AUTHENTICATED_DEFAULT:00000000-0000-4000-8000-000000000001}
  features:
    # EC-number employment matching (WS-D). Downstream workforce-governance
    # /internal/v1/workforce-governance/employment/match is live, so this lane is on.
    ec-matching: ${IMPILO_FEATURE_EC_MATCHING:true}
  bootstrap:
    enabled: ${IMPILO_BOOTSTRAP_ENABLED:true}
    token-hash: ${IMPILO_BOOTSTRAP_TOKEN_HASH:}
    token-expires-at: ${IMPILO_BOOTSTRAP_TOKEN_EXPIRES_AT:}
    allowed-methods: ${IMPILO_BOOTSTRAP_ALLOWED_METHODS:one_time_token,signed_authorisation}
    require-mfa: ${IMPILO_BOOTSTRAP_REQUIRE_MFA:true}
    environment: ${IMPILO_BOOTSTRAP_ENVIRONMENT:development}
    bootstrap-role-ttl-hours: 24
  governance:
    invitation-expiry-hours: ${IMPILO_GOVERNANCE_INVITATION_EXPIRY_HOURS:168}
  registry-intake:
    redis-ttl-days: ${REGISTRY_INTAKE_REDIS_TTL_DAYS:30}
    events-topic: ${REGISTRY_INTAKE_EVENTS_TOPIC:impilo.registry.intake}
    tshepo-pdp-enabled: ${REGISTRY_INTAKE_TSHEPO_PDP_ENABLED:false}
    tshepo-pdp-fallback-allow: ${REGISTRY_INTAKE_TSHEPO_PDP_FALLBACK_ALLOW:false}
  intelligence:
    events-topic: ${IMPILO_INTELLIGENCE_EVENTS_TOPIC:impilo.intelligence.events}
    require-tshepo-authorize: ${IMPILO_INTELLIGENCE_REQUIRE_TSHEPO:false}
    tshepo-pdp-fallback-allow: ${IMPILO_INTELLIGENCE_TSHEPO_FALLBACK_ALLOW:false}
  imaging:
    require-tshepo-authorize: ${IMPILO_IMAGING_REQUIRE_TSHEPO:false}
    tshepo-pdp-fallback-allow: ${IMPILO_IMAGING_TSHEPO_FALLBACK_ALLOW:false}
    audit-ingest-enabled: ${IMPILO_IMAGING_AUDIT_INGEST_ENABLED:true}
  finance:
    require-tshepo-authorize: ${IMPILO_FINANCE_REQUIRE_TSHEPO:false}
    tshepo-pdp-fallback-allow: ${IMPILO_FINANCE_TSHEPO_FALLBACK_ALLOW:false}
  shell-workspace:
    require-tshepo-authorize: ${IMPILO_SHELL_WORKSPACE_REQUIRE_TSHEPO:false}
    tshepo-pdp-fallback-allow: ${IMPILO_SHELL_WORKSPACE_TSHEPO_FALLBACK_ALLOW:false}
    redis-ttl-days: ${IMPILO_SHELL_WORKSPACE_REDIS_TTL_DAYS:120}
  security:
    allow-anonymous: false
  auth:
    fallback-enabled: ${AUTH_FALLBACK_ENABLED:false}
    # Service workload credential (preview==prod auth wave, stage 2 slice 1): the BFF's own
    # client_credentials token, attached to downstream calls that carry no inbound user token.
    # Secret intentionally defaults to empty — absent secret degrades to "no token" with a
    # SERVICE_TOKEN_MINT_FAILED WARN, it never breaks preview.
    service-token:
      enabled: ${IMPILO_S2S_SERVICE_TOKEN_ENABLED:true}
      token-uri: ${IMPILO_S2S_SERVICE_TOKEN_URI:${KEYCLOAK_URL:http://localhost:8080}/realms/${KEYCLOAK_REALM:impilo}/protocol/openid-connect/token}
      client-id: ${KEYCLOAK_BACKEND_CLIENT_ID:impilo-backend}
      client-secret: ${KEYCLOAK_BACKEND_SECRET:}
      scope: ${IMPILO_S2S_SERVICE_TOKEN_SCOPE:}
  scheduling:
    display-timezone: ${IMPILO_SCHEDULING_DISPLAY_TIMEZONE:Africa/Harare}
    reminders:
      enabled: true
      cron: "0 15 * * * *"
    outbox-comms:
      enabled: true
      poll-interval-ms: 30000
    # Merge scheduling-service slot grid with Tuso bookings for /appointments/availability
    use-remote-slots: ${SCHEDULING_USE_REMOTE_SLOTS:true}
  bff:
    citizen-longtail:
      # stub = deterministic BFF behaviour; live = VITO patient-share + credential public verify
      mode: ${IMPILO_BFF_CITIZEN_LONGTAIL_MODE:stub}
      # When live: stub_fallback recovers to legacy BFF stubs on downstream errors; propagate returns HTTP 502
      failure-policy: ${IMPILO_BFF_CITIZEN_LONGTAIL_FAILURE_POLICY:stub_fallback}
    provider-hubs:
      # stub = BFF holds hard-coded sections; live = fetch sections from one-ui-shell gateway.
      mode: ${IMPILO_BFF_PROVIDER_HUBS_MODE:stub}
      failure-policy: ${IMPILO_BFF_PROVIDER_HUBS_FAILURE_POLICY:stub_fallback}
      one-ui-shell-base-url: ${ONE_UI_SHELL_BASE_URL:http://localhost:3000}
    facilities:
      # live = TUSO then seed fallback; stub = seed only (CI / Maestro without TUSO)
      mode: ${IMPILO_BFF_FACILITIES_MODE:live}
  services:
    abis-base-url: ${ABIS_BASE_URL:http://localhost:8186}
    pct-base-url: ${PCT_BASE_URL:http://localhost:8088}
    oros-base-url: ${OROS_BASE_URL:http://localhost:8089}
