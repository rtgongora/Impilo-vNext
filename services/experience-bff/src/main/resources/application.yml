    landela-base-url: ${LANDELA_BASE_URL:http://localhost:8092}
    notification-base-url: ${NOTIFICATION_BASE_URL:http://localhost:8200}
    fhir-base-url: ${FHIR_BASE_URL:http://localhost:8090/fhir}
    fhir-gateway-base-url: ${FHIR_GATEWAY_BASE_URL:http://localhost:8091}
