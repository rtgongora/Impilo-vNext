server:
  port: 8160

spring:
  application:
    name: experience-bff
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:experience_bff}
    username: ${DB_USER:impilo}
    password: ${DB_PASSWORD:impilo}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: experience-bff
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${KEYCLOAK_URL:http://localhost:8080}/realms/${KEYCLOAK_REALM:impilo}/protocol/openid-connect/certs
          issuer-uri: ${KEYCLOAK_URL:http://localhost:8080}/realms/${KEYCLOAK_REALM:impilo}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized

impilo:
  security:
    allow-anonymous: false
  auth:
    fallback-enabled: ${AUTH_FALLBACK_ENABLED:false}
  services:
    pct-base-url: ${PCT_BASE_URL:http://localhost:8088}
    oros-base-url: ${OROS_BASE_URL:http://localhost:8089}
    pharmacy-base-url: ${PHARMACY_BASE_URL:http://localhost:8096}
    butano-base-url: ${BUTANO_BASE_URL:http://localhost:8090}
    msika-base-url: ${MSIKA_BASE_URL:http://localhost:8086}
    msika-flow-base-url: ${MSIKA_FLOW_BASE_URL:http://localhost:8100}
    mushex-base-url: ${MUSHEX_BASE_URL:http://localhost:8102}
    vito-base-url: ${VITO_BASE_URL:http://localhost:8082}
    tuso-base-url: ${TUSO_BASE_URL:http://localhost:8084}
    varapi-base-url: ${VARAPI_BASE_URL:http://localhost:8083}
    document-store-base-url: ${DOCUMENT_STORE_BASE_URL:http://localhost:8093}
    costa-base-url: ${COSTA_BASE_URL:http://localhost:8101}
    coverage-base-url: ${COVERAGE_BASE_URL:http://localhost:8140}
    surveillance-base-url: ${SURVEILLANCE_BASE_URL:http://localhost:8180}
    campaigns-base-url: ${CAMPAIGNS_BASE_URL:http://localhost:8190}
    indawo-base-url: ${INDAWO_BASE_URL:http://localhost:8150}
    fhir-base-url: ${FHIR_BASE_URL:http://localhost:8090/fhir}
    orthanc-base-url: ${ORTHANC_BASE_URL:http://localhost:8042}
    orthanc-dicomweb-url: ${ORTHANC_DICOMWEB_URL:http://localhost:8042/dicom-web}
