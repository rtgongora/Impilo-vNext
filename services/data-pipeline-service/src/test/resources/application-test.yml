server:
  port: 0

spring:
  application:
    name: data-pipeline-service-test
  datasource:
    url: jdbc:h2:mem:pipeline_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false
  kafka:
    bootstrap-servers: localhost:9092
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8080/realms/impilo

# Disable Keycloak JWT validation in tests
impilo:
  companion:
    enabled: true

pipeline:
  outbox:
    poll-interval-ms: 60000
