server:
  port: ${SERVER_PORT:8126}

wallet:
  card:
    # Master secret for at-rest encryption of card health data. The per-record AES key is
    # derived as HMAC-SHA256(this, encryption_key_ref) — so it is NOT recoverable from the
    # stored key reference alone. MUST be provided (>= 32 chars) per environment; the service
    # fails closed (refuses to start) on a blank/weak key.
    # Bound to WALLET_CARD_ENCRYPTION_MASTER_KEY (not …_KEY): Spring relaxed binding
    # already mapped the Helm env of that name onto this property, which is why preview
    # started despite the earlier misnamed ${WALLET_CARD_ENCRYPTION_KEY:} reference.
    encryption-master-key: ${WALLET_CARD_ENCRYPTION_MASTER_KEY:}

spring:
  application:
    name: mushe-wallet-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:mushe_wallet}
    username: ${DB_USER:impilo}
    password: ${DB_PASSWORD:impilo}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: mushe
  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: mushe
    baseline-on-migrate: true
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${KEYCLOAK_URL:http://localhost:8080}/realms/${KEYCLOAK_REALM:impilo}/protocol/openid-connect/certs
          issuer-uri: ${KEYCLOAK_URL:http://localhost:8080}/realms/${KEYCLOAK_REALM:impilo}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      retries: 3
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
    consumer:
      group-id: mushe-wallet-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      enable-auto-commit: false
      properties:
        isolation.level: read_committed

impilo:
  services:
    tshepo-keys-base-url: ${TSHEPO_KEYS_BASE_URL:http://localhost:8184}
    butano-base-url: ${BUTANO_BASE_URL:http://localhost:8090}
    mushex-base-url: ${MUSHEX_BASE_URL:http://localhost:8102}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    zw.gov.mohcc.impilo: INFO
