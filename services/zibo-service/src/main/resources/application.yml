server:
  port: 8085
  servlet:
    context-path: /

spring:
  application:
    name: zibo-service
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/zibo
    username: ${POSTGRES_USER:impilo}
    password: ${POSTGRES_PASSWORD:changeme}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    # Dollar-quoted JSON bodies (e.g. $cs${ ... }) put a '$' adjacent to '{',
    # which Flyway's placeholder engine reads as '${' → "No value provided for
    # placeholder". No zibo migration uses real Flyway placeholders, so disable.
    placeholder-replacement: false
    # This service's migration numbers are leased in per-lane bands (see
    # docs/registry/iatg-*-leases.md), so a lane routinely merges a migration
    # numerically BELOW one another lane has already applied. Flyway's default
    # refuses exactly those, and silently: the service boots green with the table
    # missing. Live-proven on pct 2026-07-26 — V106 was in the jar, the service was
    # healthy, zero errors, and six tables had never been created.
    #
    # What this does NOT license: a migration in one band may never DEPEND ON an
    # object owned by a higher band. Out-of-order only relaxes ordering on a database
    # where the higher number has ALREADY applied; a fresh database still applies
    # strictly ascending, so a cross-band dependency boots fine here and fails on
    # every new environment. Lease law forbids it for that reason.
    out-of-order: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      group-id: zibo-service
      auto-offset-reset: earliest
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER:http://localhost:8080/realms/impilo}

# --- Actuator & Metrics ---
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: zibo-service

# --- OpenAPI / Swagger ---
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

# --- ZIBO-specific ---
zibo:
  outbox:
    poll-interval-ms: 2000
  cache:
    ttl-minutes: 60
  validation:
    default-mode: LENIENT
