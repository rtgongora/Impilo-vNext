server:
  port: 8085
  servlet:
    context-path: /

spring:
  application:
    name: zibo-service
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/zibo
    username: ${POSTGRES_USER:impilo}
    password: ${POSTGRES_PASSWORD:changeme}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      group-id: zibo-service
      auto-offset-reset: earliest
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER:http://localhost:8080/realms/impilo}

# --- Actuator & Metrics ---
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: zibo-service

# --- OpenAPI / Swagger ---
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

# --- ZIBO-specific ---
zibo:
  outbox:
    poll-interval-ms: 2000
  cache:
    ttl-minutes: 60
  validation:
    default-mode: LENIENT
  # Healthcare Coding Standards — Adopted international terminology systems
  # See: docs/doctrine/healthcare-coding-standards.md
  # These canonical URIs are used by the ValidationEngine for code system lookup.
  adopted-systems:
    # Primary international standards
    - uri: "http://id.who.int/icd/release/11"
      name: "ICD-11"
      domain: "Diagnoses, mortality, morbidity"
    - uri: "http://hl7.org/fhir/sid/icd-10"
      name: "ICD-10"
      domain: "Legacy diagnosis coding (transitional)"
    - uri: "http://snomed.info/sct"
      name: "SNOMED CT"
      domain: "Clinical findings, procedures, body structures, substances"
    - uri: "http://loinc.org"
      name: "LOINC"
      domain: "Laboratory tests, observations, vital signs, document sections"
    - uri: "http://www.whocc.no/atc"
      name: "ATC"
      domain: "Medication classification"
    - uri: "http://dicom.nema.org/resources/ontology/DCM"
      name: "DICOM"
      domain: "Medical imaging metadata, modality codes"
    # Supplementary standards
    - uri: "http://unitsofmeasure.org"
      name: "UCUM"
      domain: "Units of measure"
    - uri: "http://hl7.org/fhir/sid/cvx"
      name: "CVX"
      domain: "Vaccine codes"
    - uri: "http://www.ama-assn.org/go/cpt"
      name: "CPT"
      domain: "Procedure coding for claims"
    - uri: "http://www.nlm.nih.gov/research/umls/rxnorm"
      name: "RxNorm"
      domain: "Drug terminology cross-mapping"
    # HL7 vocabulary
    - uri: "http://terminology.hl7.org/CodeSystem/v3-ActCode"
      name: "HL7 ActCode"
      domain: "Encounter type classification"
    - uri: "http://terminology.hl7.org/CodeSystem/v3-RouteOfAdministration"
      name: "HL7 Route of Administration"
      domain: "Medication routes"
    - uri: "http://terminology.hl7.org/CodeSystem/observation-category"
      name: "HL7 Observation Category"
      domain: "Observation category classification"
