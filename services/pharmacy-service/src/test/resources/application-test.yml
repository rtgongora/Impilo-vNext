server:
  port: 0

spring:
  application:
    name: pharmacy-service-test
  datasource:
    url: jdbc:h2:mem:pharmacytest;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false
  data:
    redis:
      host: localhost
      port: 6379
  kafka:
    listener:
      auto-startup: false
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      group-id: pharmacy-service-test
      auto-offset-reset: earliest
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8080/realms/impilo
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.security.oauth2.resource.servlet.OAuth2ResourceServerAutoConfiguration

pharmacy:
  hmac:
    pepper: test-pharmacy-hmac-pepper-not-for-production
  outbox:
    poll-interval-ms: 60000
  pickup:
    otp-length: 6
    expiry-minutes: 1440
  substitution:
    require-step-up: false
  stock:
    fefo-enabled: true
  elmis:
    mode: INTERNAL
impilo:
  security:
    disable-oauth-for-tests: true
