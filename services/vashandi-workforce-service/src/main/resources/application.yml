server:
  port: ${SERVER_PORT:8167}

spring:
  application:
    name: vashandi-workforce-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:impilo_vashandi}
    username: ${POSTGRES_USER:impilo}
    password: ${POSTGRES_PASSWORD:changeme}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: vashandi
  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: vashandi
    baseline-on-migrate: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:${KAFKA_BOOTSTRAP:localhost:9092}}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
    consumer:
      group-id: vashandi-workforce-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${KEYCLOAK_URL:http://localhost:8080}/realms/${KEYCLOAK_REALM:impilo}/protocol/openid-connect/certs
          issuer-uri: ${KEYCLOAK_ISSUER:${KEYCLOAK_URL:http://localhost:8080}/realms/${KEYCLOAK_REALM:impilo}}

vashandi:
  security:
  outbox:
    poll-interval-ms: 2000
  v11:
    emit-mode: ${VASHANDI_EMIT_MODE:DUAL}

impilo:
  companion:
    enabled: true
  vashandi:
    kafka-events-enabled: ${VASHANDI_KAFKA_EVENTS_ENABLED:false}
    integration:
      varapi-base-url: ${VARAPI_BASE_URL:http://localhost:8083}
      workforce-governance-base-url: ${WORKFORCE_GOVERNANCE_BASE_URL:http://localhost:8165}
      tuso-base-url: ${TUSO_BASE_URL:http://localhost:8084}
      fundo-base-url: ${FUNDO_BASE_URL:http://localhost:8235}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
