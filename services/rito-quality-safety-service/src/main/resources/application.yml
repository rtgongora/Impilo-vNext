server:
  port: ${SERVER_PORT:8391}
  servlet:
    context-path: /

spring:
  application:
    name: rito-quality-safety-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:rito}
    username: ${POSTGRES_USER:impilo}
    password: ${POSTGRES_PASSWORD:changeme}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: rito
  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: rito
    baseline-on-migrate: true
    # This service's migration numbers are leased in per-lane bands (see
    # docs/registry/iatg-*-leases.md), so a lane routinely merges a migration
    # numerically BELOW one another lane has already applied. Flyway's default
    # refuses exactly those, and silently: the service boots green with the table
    # missing. Live-proven on pct 2026-07-26 — V106 was in the jar, the service was
    # healthy, zero errors, and six tables had never been created.
    #
    # What this does NOT license: a migration in one band may never DEPEND ON an
    # object owned by a higher band. Out-of-order only relaxes ordering on a database
    # where the higher number has ALREADY applied; a fresh database still applies
    # strictly ascending, so a cross-band dependency boots fine here and fails on
    # every new environment. Lease law forbids it for that reason.
    out-of-order: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:${KAFKA_BOOTSTRAP:localhost:9092}}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      retries: 3
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
    consumer:
      group-id: rito-quality-safety-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${KEYCLOAK_URL:http://localhost:8080}/realms/${KEYCLOAK_REALM:impilo}/protocol/openid-connect/certs
          issuer-uri: ${KEYCLOAK_ISSUER:${KEYCLOAK_URL:http://localhost:8080}/realms/${KEYCLOAK_REALM:impilo}}

rito:
  security:
  outbox:
    poll-interval-ms: 2000
  emit-mode: ${RITO_EMIT_MODE:DUAL}
  # RW4: how often the reputation aggregator recomputes provider summaries from
  # PUBLISHED ratings. Derived read-model — safe to recompute frequently.
  reputation:
    recompute-interval-ms: ${RITO_REPUTATION_RECOMPUTE_INTERVAL_MS:60000}
  # Signal-ingestion topics consumed from sibling systems-of-record. Rito treats these as
  # read-only quality/safety signals — it never owns the source record (see SoR boundary doc).
  signals:
    topics:
      pct: ${RITO_SIGNAL_TOPIC_PCT:impilo.pct.encounter.flagged}
      # Verified-interaction intake (RW2): completed encounters gate verified ratings.
      # Legacy topic is always emitted; repoint to clinical.pct.encounter.completed once
      # PCT canonical dual-emit is enabled platform-wide.
      pct-encounter-completed: ${RITO_SIGNAL_TOPIC_PCT_ENCOUNTER_COMPLETED:pct.encounter.completed}
      tuso: ${RITO_SIGNAL_TOPIC_TUSO:impilo.tuso.inspection.finding.created}
      indawo: ${RITO_SIGNAL_TOPIC_INDAWO:impilo.indawo.inspection.finding.created}
      madi: ${RITO_SIGNAL_TOPIC_MADI:impilo.madi.haemovigilance.case.opened}
      patient-safety: ${RITO_SIGNAL_TOPIC_PV:impilo.patientsafety.case.opened}
      support: ${RITO_SIGNAL_TOPIC_SUPPORT:impilo.support.ticket.escalated}
      fundo: ${RITO_SIGNAL_TOPIC_FUNDO:impilo.learning.assignment.completed}
      inpatient: ${RITO_SIGNAL_TOPIC_INPATIENT:inpatient.safety}
      pct-death: ${RITO_SIGNAL_TOPIC_PCT_DEATH:pct.events}
  integration:
    notification:
      base-url: ${NOTIFICATION_BASE_URL:http://localhost:8200}
    fundo:
      base-url: ${FUNDO_BASE_URL:http://localhost:8159}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    tags:
      application: rito-quality-safety-service

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
