server:
  port: 8083

spring:
  application:
    name: varapi-service

  datasource:
    url: jdbc:postgresql://localhost:5432/varapi
    username: postgres
    password: postgres
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        default_schema: varapi
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false

  flyway:
    enabled: true
    schemas: varapi
    default-schema: varapi
    locations: classpath:db/migration

  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

  data:
    redis:
      host: localhost
      port: 6379

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8080/realms/impilo

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when-authorized

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

# VARAPI-specific configuration
varapi:
  registry-mode: STANDALONE  # STANDALONE or EXTERNAL
  argon2:
    memory-cost-kb: 19456
    iterations: 2
    parallelism: 1
  hmac:
    pepper: ${VARAPI_HMAC_PEPPER:dev-pepper-change-in-production}
  zibo:
    base-url: http://localhost:8085
    validation-mode: LENIENT  # STRICT or LENIENT
    enabled: false
  tuso:
    base-url: http://localhost:8084
  document:
    storage-type: MINIO
    minio-endpoint: http://localhost:9000
    minio-bucket: varapi-documents
    minio-access-key: ${MINIO_ACCESS_KEY:minioadmin}
    minio-secret-key: ${MINIO_SECRET_KEY:minioadmin}
  token:
    prefix: "VA-"
    digit-count: 10
  outbox:
    poll-interval-ms: 1000
    kafka-topic-prefix: varapi
