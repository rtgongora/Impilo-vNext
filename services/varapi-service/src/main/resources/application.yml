server:
  port: 8083

spring:
  application:
    name: varapi-service

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/varapi
    username: ${POSTGRES_USER:impilo}
    password: ${POSTGRES_PASSWORD:changeme}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        default_schema: varapi
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false

  flyway:
    enabled: true
    schemas: varapi
    default-schema: varapi
    locations: classpath:db/migration

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ${VARAPI_KAFKA_GROUP_ID:varapi-service}
      auto-offset-reset: latest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8080/realms/impilo

impilo:
  ops:
    enabled: true
    outbox-table: varapi.event_outbox
  security:
    disable-oauth-for-tests: ${IMPILO_SECURITY_DISABLE_OAUTH_FOR_TESTS:false}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: when-authorized

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

# VARAPI-specific configuration
varapi:
  registry-mode: STANDALONE  # STANDALONE or EXTERNAL
  identity:
    require-impilo-health-id-on-provider-create: ${VARAPI_REQUIRE_IMPILO_HEALTH_ID_ON_CREATE:true}
    require-impilo-health-id-for-facility-affiliation: ${VARAPI_REQUIRE_IMPILO_HEALTH_ID_FOR_AFFILIATION:true}
  argon2:
    memory-cost-kb: 19456
    iterations: 2
    parallelism: 1
  hmac:
    pepper: ${VARAPI_HMAC_PEPPER:dev-pepper-change-in-production}
  zibo:
    base-url: http://localhost:8085
    validation-mode: LENIENT  # STRICT or LENIENT
    enabled: false
  tuso:
    base-url: http://localhost:8084
  document:
    storage-type: MINIO
    minio-endpoint: http://localhost:9000
    minio-bucket: varapi-documents
    minio-access-key: ${MINIO_ACCESS_KEY:minioadmin}
    minio-secret-key: ${MINIO_SECRET_KEY:minioadmin}
  token:
    prefix: "VA-"
    digit-count: 10
  outbox:
    poll-interval-ms: 1000
    kafka-topic-prefix: varapi
  governance:
    enabled: false
    base-url: http://localhost:8165
  biometric:
    policy-enabled: ${VARAPI_BIOMETRIC_POLICY_ENABLED:true}
    tshepo-policy-base-url: ${TSHEPO_AUTHZ_BASE_URL:http://localhost:8081}
    # AES-256-GCM key seed for provider biometric templates at rest (PII Enforcement Wave 0.1).
    # Production must supply this via tshepo-keys custody; blank falls back to a loud dev key.
    template-key-seed: ${VARAPI_BIOMETRIC_TEMPLATE_KEY_SEED:}
  mushex:
    enabled: ${VARAPI_MUSHEX_ENABLED:false}
    base-url: ${VARAPI_MUSHEX_BASE_URL:http://localhost:8102}
  # Rito Experience & Reputation (RW6): read-only provider experience summary composed
  # onto the public provider profile. Off by default; enable once Rito reputation is live.
  rito:
    enabled: ${VARAPI_RITO_ENABLED:false}
    base-url: ${VARAPI_RITO_BASE_URL:http://localhost:8391}
  fundo:
    webhook-enabled: ${VARAPI_FUNDO_WEBHOOK_ENABLED:true}
    webhook-shared-secret: ${FUNDO_WEBHOOK_SECRET:CHANGE_ME}
    auto-accept-cpd-from-fundo: ${VARAPI_FUNDO_AUTO_ACCEPT_CPD:false}
  learning-platform-sync:
    base-url: ${VARAPI_LEARNING_PLATFORM_BASE_URL:}
    internal-api-key: ${VARAPI_TO_LEARNING_INTERNAL_KEY:}
  council-regulatory:
    policy-enabled: ${VARAPI_COUNCIL_REGULATORY_POLICY_ENABLED:false}
    policy-deny-when-unreachable: ${VARAPI_COUNCIL_REGULATORY_POLICY_DENY_WHEN_UNREACHABLE:true}
    mushex-payment-status-kafka-enabled: ${VARAPI_MUSHEX_PAYMENT_STATUS_KAFKA_ENABLED:false}
    tshepo-policy-base-url: ${TSHEPO_AUTHZ_BASE_URL:http://localhost:8081}
    # Channel A live council/HPA verification adapter seam. OFF by default: Wave 1 ingests
    # council data only via manual bulk upload. When true the HttpCouncilRegistryAdapter bean
    # is created; a live call still only happens for a council with an enabled registration row.
    live-adapter-enabled: ${VARAPI_COUNCIL_REGULATORY_LIVE_ADAPTER_ENABLED:false}
