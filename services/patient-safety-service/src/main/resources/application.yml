server:
  port: ${SERVER_PORT:8202}

spring:
  application:
    name: patient-safety-service
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      retries: 3
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
    consumer:
      group-id: patient-safety-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      enable-auto-commit: false
      properties:
        isolation.level: read_committed
    listener:
      ack-mode: manual
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/impilo_patientsafety
    username: ${POSTGRES_USER:impilo}
    password: ${POSTGRES_PASSWORD:impilo}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${KEYCLOAK_URL:http://localhost:8080}/realms/${KEYCLOAK_REALM:impilo}/protocol/openid-connect/certs
          issuer-uri: ${KEYCLOAK_URL:http://localhost:8080}/realms/${KEYCLOAK_REALM:impilo}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    tags:
      application: patient-safety-service

impilo:
  companion:
    enabled: true

patientsafety:
  outbox:
    poll-interval-ms: ${PATIENT_SAFETY_OUTBOX_POLL_INTERVAL_MS:2000}
    publisher:
      enabled: ${PATIENT_SAFETY_OUTBOX_PUBLISHER_ENABLED:true}
  v11:
    emit-mode: ${PATIENT_SAFETY_EMIT_MODE:}
  # Reference-only external pharmacovigilance link-outs (WHO-UMC VigiMobile / VigiFlow eForms and
  # the MCAZ WhatsApp PV channel). These are EXTERNAL destinations Impilo links the reporter to;
  # Impilo does NOT receive those submissions back unless a callback adapter is configured.
  vigimobile:
    adr-url: ${VIGIMOBILE_ADR_URL:https://primaryreporting.who-umc.org/Reporting/Reporter?OrganizationID=ZW}
    aefi-url: ${VIGIMOBILE_AEFI_URL:https://primaryreporting.who-umc.org/Reporting/Reporter?OrganizationID=ZW&form=AEFI}
    mcaz-whatsapp-number: ${MCAZ_WHATSAPP_NUMBER:+263 719 757 425}
    mcaz-portal-url: ${MCAZ_PORTAL_URL:https://www.mcaz.co.zw/index.php/pharmacovigilance}
