server.port=0
spring.datasource.url=jdbc:h2:mem:scheduling_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;INIT=CREATE SCHEMA IF NOT EXISTS scheduling
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.default_schema=scheduling
spring.flyway.enabled=false
impilo.security.disable-oauth-for-tests=true
scheduling.outbox.poll-interval-ms=60000
