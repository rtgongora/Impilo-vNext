spring.application.name=scheduling-service
server.port=${SERVER_PORT:8128}

spring.datasource.url=${SCHEDULING_DB_URL:jdbc:postgresql://localhost:5432/impilo_scheduling}
spring.datasource.username=${SCHEDULING_DB_USER:impilo}
spring.datasource.password=${SCHEDULING_DB_PASSWORD:impilo}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_schema=scheduling

spring.flyway.enabled=true
spring.flyway.schemas=scheduling
spring.flyway.default-schema=scheduling
# This service's migration numbers are leased in per-lane bands (see
# docs/registry/iatg-*-leases.md), so a lane routinely merges a migration
# numerically BELOW one another lane has already applied. Flyway's default
# refuses exactly those, and silently: the service boots green with the table
# missing. Live-proven on pct 2026-07-26 — V106 was in the jar, the service was
# healthy, zero errors, and six tables had never been created.
#
# What this does NOT license: a migration in one band may never DEPEND ON an
# object owned by a higher band. Out-of-order only relaxes ordering on a database
# where the higher number has ALREADY applied; a fresh database still applies
# strictly ascending, so a cross-band dependency boots fine here and fails on
# every new environment. Lease law forbids it for that reason.
spring.flyway.out-of-order=true

impilo.security.disable-oauth-for-tests=false

scheduling.outbox.poll-interval-ms=${SCHEDULING_OUTBOX_POLL_MS:2000}

# Kafka — consume referral.surgical.accepted (the single funnel trigger)
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:${KAFKA_BOOTSTRAP:localhost:9092}}
spring.kafka.consumer.group-id=scheduling-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

# Downstream integration base URLs (orchestration-by-reference)
scheduling.integration.booking-base-url=${BOOKING_BASE_URL:http://localhost:8265}
scheduling.integration.tuso-base-url=${TUSO_BASE_URL:http://localhost:8084}
scheduling.integration.vashandi-base-url=${VASHANDI_BASE_URL:http://localhost:8167}

management.endpoints.web.exposure.include=health,info
