server:
  port: ${SERVER_PORT:8210}

spring:
  application:
    name: nhume-service
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/impilo_nhume
    username: ${POSTGRES_USER:impilo}
    password: ${POSTGRES_PASSWORD:impilo}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  # OF-B19 — nhume's first Kafka consumer (cold-chain telemetry). Preview/prod
  # deployments must inject KAFKA_BOOTSTRAP_SERVERS; where no broker exists the
  # listener can be held down with NHUME_COLDCHAIN_TELEMETRY_ENABLED=false.
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:${KAFKA_BOOTSTRAP:localhost:9092}}
    consumer:
      group-id: nhume-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

nhume:
  # Drop-off / pickup write-backs to the services that own the cargo truth
  # (OROS/MADI/PCT defaults live on HttpNhumeWriteBackGateway @Value bindings).
  writeback:
    # Msika Flow (marketplace orchestration) dispatch-status write-back.
    msika-flow-base-url: ${NHUME_WRITEBACK_MSIKA_FLOW_BASE_URL:http://msika-flow-service:8100}
  coldchain:
    # OF-B19 — cold-chain telemetry listener (telemetry.iot.device.reading).
    # false = listener stays down (e.g. broker-less local runs).
    telemetry-enabled: ${NHUME_COLDCHAIN_TELEMETRY_ENABLED:true}

impilo:
  companion:
    enabled: true
  nhume:
    # Ndila (maps & geospatial intelligence) integration.
    ndila:
      base-url: ${NHUME_NDILA_BASE_URL:}
      provider: ${NHUME_NDILA_PROVIDER:simulation}     # simulation | mapbox | google | osm | azure
      api-key: ${NHUME_NDILA_API_KEY:}
    # Comms Hub (omnichannel notifications) integration.
    comms-hub:
      base-url: ${NHUME_COMMS_HUB_BASE_URL:}
      enabled: ${NHUME_COMMS_HUB_ENABLED:true}
    # Trust Layer (TSHEPO) policy decision point.
    trust:
      pdp-url: ${NHUME_TSHEPO_PDP_URL:}
      enforce: ${NHUME_TRUST_ENFORCE:true}
    # Autonomous delivery providers (drone / UAV / AGV / robot / smart locker).
    autonomous:
      simulation-enabled: ${NHUME_AUTONOMOUS_SIM:true}

    # Webhook signature secret for partner couriers.
    webhooks:
      # Injected from Secret impilo-app-secrets (NHUME_WEBHOOK_SECRET) in preview/prod;
      # empty default is fail-closed (no committed secret). Per-provider webhook
      # secrets (DB) take precedence over this shared fallback.
      shared-secret: ${NHUME_WEBHOOK_SECRET:}
    # Location retention window (days) for privacy-safe trimming.
    location-retention-days: ${NHUME_LOCATION_RETENTION_DAYS:30}
    # Seed demo / test data on startup.
    seed-demo-data: ${NHUME_SEED_DEMO_DATA:true}
