server:
  port: ${SERVER_PORT:8210}

spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          # PUBLIC issuer -- it is what the token's iss claim carries. The deployed estate also
          # supplies JWK_SET_URI (internal route) so no OIDC discovery is attempted against an
          # address this VM cannot reach.
          issuer-uri: ${KEYCLOAK_ISSUER:http://localhost:8080/realms/impilo}
  application:
    name: nhume-service
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/impilo_nhume
    username: ${POSTGRES_USER:impilo}
    password: ${POSTGRES_PASSWORD:impilo}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    # This service's migration numbers are leased in per-lane bands (see
    # docs/registry/iatg-*-leases.md), so a lane routinely merges a migration
    # numerically BELOW one another lane has already applied. Flyway's default
    # refuses exactly those, and silently: the service boots green with the table
    # missing. Live-proven on pct 2026-07-26 — V106 was in the jar, the service was
    # healthy, zero errors, and six tables had never been created.
    #
    # What this does NOT license: a migration in one band may never DEPEND ON an
    # object owned by a higher band. Out-of-order only relaxes ordering on a database
    # where the higher number has ALREADY applied; a fresh database still applies
    # strictly ascending, so a cross-band dependency boots fine here and fails on
    # every new environment. Lease law forbids it for that reason.
    out-of-order: true
  # OF-B19 — nhume's first Kafka consumer (cold-chain telemetry). Preview/prod
  # deployments must inject KAFKA_BOOTSTRAP_SERVERS; where no broker exists the
  # listener can be held down with NHUME_COLDCHAIN_TELEMETRY_ENABLED=false.
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:${KAFKA_BOOTSTRAP:localhost:9092}}
    consumer:
      group-id: nhume-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

nhume:
  # Drop-off / pickup write-backs to the services that own the cargo truth
  # (OROS/MADI/PCT defaults live on HttpNhumeWriteBackGateway @Value bindings).
  writeback:
    # Msika Flow (marketplace orchestration) dispatch-status write-back.
    msika-flow-base-url: ${NHUME_WRITEBACK_MSIKA_FLOW_BASE_URL:http://msika-flow-service:8100}
  coldchain:
    # OF-B19 — cold-chain telemetry listener (telemetry.iot.device.reading).
    # false = listener stays down (e.g. broker-less local runs).
    telemetry-enabled: ${NHUME_COLDCHAIN_TELEMETRY_ENABLED:true}

impilo:
  # Nhume's OWN workload credential for service-to-service write-backs.
  #
  # The write-back gateway previously sent whatever bearer happened to be on the inbound
  # sign-off request, and nothing at all on a scheduled retry — there is no request context
  # to borrow a token from. Trust headers are context, not authentication: with no token the
  # callee has nothing to verify, which is why msika-flow's callbacks had to be permitAll to
  # work at all.
  #
  # Off until this workload is given a dedicated Keycloak client: with client-id unset no
  # token is minted and no Authorization header is sent, so the callee decides. Deliberately
  # per-workload — a shared client would leave every callee unable to tell one caller from
  # another, which is the defect this replaces rather than repeats.
  s2s:
    token:
      enabled: ${IMPILO_S2S_TOKEN_ENABLED:false}
      token-uri: ${IMPILO_S2S_TOKEN_URI:${KEYCLOAK_URL:http://localhost:8080}/realms/${KEYCLOAK_REALM:impilo}/protocol/openid-connect/token}
      client-id: ${IMPILO_S2S_CLIENT_ID:}
      client-secret: ${IMPILO_S2S_CLIENT_SECRET:}
      scope: ${IMPILO_S2S_TOKEN_SCOPE:}
  companion:
    enabled: true
  nhume:
    # Ndila (maps & geospatial intelligence) integration.
    ndila:
      base-url: ${NHUME_NDILA_BASE_URL:}
      provider: ${NHUME_NDILA_PROVIDER:simulation}     # simulation | mapbox | google | osm | azure
      api-key: ${NHUME_NDILA_API_KEY:}
    # Comms Hub (omnichannel notifications) integration.
    comms-hub:
      base-url: ${NHUME_COMMS_HUB_BASE_URL:}
      enabled: ${NHUME_COMMS_HUB_ENABLED:true}
    # Trust Layer (TSHEPO) policy decision point.
    trust:
      pdp-url: ${NHUME_TSHEPO_PDP_URL:}
      enforce: ${NHUME_TRUST_ENFORCE:true}
    # Autonomous delivery providers (drone / UAV / AGV / robot / smart locker).
    autonomous:
      simulation-enabled: ${NHUME_AUTONOMOUS_SIM:true}

    # Webhook signature secret for partner couriers.
    webhooks:
      # Injected from Secret impilo-app-secrets (NHUME_WEBHOOK_SECRET) in preview/prod;
      # empty default is fail-closed (no committed secret). Per-provider webhook
      # secrets (DB) take precedence over this shared fallback.
      shared-secret: ${NHUME_WEBHOOK_SECRET:}
    # Location retention window (days) for privacy-safe trimming.
    location-retention-days: ${NHUME_LOCATION_RETENTION_DAYS:30}
    # Seed demo / test data on startup.
    seed-demo-data: ${NHUME_SEED_DEMO_DATA:true}
