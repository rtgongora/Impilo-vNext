server:
  port: ${SERVER_PORT:8340}

spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          # PUBLIC issuer -- it is what the token's iss claim carries. The deployed estate
          # additionally supplies JWK_SET_URI (internal route) so no OIDC discovery is
          # attempted against an address this VM cannot reach.
          issuer-uri: ${KEYCLOAK_ISSUER:http://localhost:8080/realms/impilo}
  application:
    name: support-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:impilo_support}
    username: ${DB_USER:impilo}
    password: ${DB_PASS:impilo}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

impilo:
  companion:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  metrics:
    tags:
      application: support-service
