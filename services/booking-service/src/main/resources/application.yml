server:
  port: 8265
  servlet:
    context-path: /

spring:
  application:
    name: booking-service
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/booking
    username: ${POSTGRES_USER:impilo}
    password: ${POSTGRES_PASSWORD:changeme}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: booking
  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: booking
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_URL:http://localhost:8080}/realms/${KEYCLOAK_REALM:impilo}

booking:
  integrations:
    varapi-base-url: ${VARAPI_BASE_URL:http://localhost:8083}
    tuso-base-url: ${TUSO_BASE_URL:http://localhost:8084}
    mvumo-base-url: ${MVUMO_BASE_URL:http://localhost:8195}
    pct-base-url: ${PCT_BASE_URL:http://localhost:8088}
    costa-base-url: ${COSTA_BASE_URL:http://localhost:8101}
    mushex-base-url: ${MUSHEX_BASE_URL:http://localhost:8102}
    coverage-base-url: ${COVERAGE_BASE_URL:http://localhost:8140}
    oros-base-url: ${OROS_BASE_URL:http://localhost:8089}
    nhume-base-url: ${NHUME_BASE_URL:http://localhost:8210}
    learning-base-url: ${LEARNING_SERVICE_BASE_URL:http://localhost:8235}
    community-base-url: ${COMMUNITY_BASE_URL:http://localhost:8122}
  outbox:
    poll-interval-ms: 2000

impilo:
  security:
    disable-oauth-for-tests: ${IMPILO_DISABLE_OAUTH_FOR_TESTS:false}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    tags:
      application: booking-service
