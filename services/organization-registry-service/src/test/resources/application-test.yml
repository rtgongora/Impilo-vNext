spring:
  kafka:
    listener:
      auto-startup: false
  datasource:
    url: jdbc:h2:mem:org_registry_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;INIT=CREATE SCHEMA IF NOT EXISTS org_registry\;SET SCHEMA org_registry
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        default_schema: org_registry
  flyway:
    enabled: false

impilo:
  security:
    disable-oauth-for-tests: true
  orgregistry:
    kafka-events-enabled: false
