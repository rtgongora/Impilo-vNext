server:
  port: ${SERVER_PORT:8153}

spring:
  application:
    name: organization-registry-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:impilo_org_registry}
    username: ${POSTGRES_USER:impilo}
    password: ${POSTGRES_PASSWORD:changeme}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: org_registry
  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: org_registry
    baseline-on-migrate: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:${KAFKA_BOOTSTRAP:localhost:9092}}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
    consumer:
      group-id: organization-registry-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${KEYCLOAK_URL:http://localhost:8080}/realms/${KEYCLOAK_REALM:impilo}/protocol/openid-connect/certs
          issuer-uri: ${KEYCLOAK_ISSUER:${KEYCLOAK_URL:http://localhost:8080}/realms/${KEYCLOAK_REALM:impilo}}

impilo:
  companion:
    enabled: true
  orgregistry:
    kafka-events-enabled: ${ORG_REGISTRY_KAFKA_EVENTS_ENABLED:false}
    outbox:
      poll-interval-ms: 2000
    outbox-topic: impilo.org-registry.events
    # START ARC — Channel-C claim ↔ IATG adjudication (workflow-service).
    # External coupling is opt-in: default false leaves escalation honest
    # (claim UNDER_REVIEW, no workflow instance) in envs without workflow-service.
    adjudication:
      enabled: ${ORG_REGISTRY_ADJUDICATION_ENABLED:false}
      workflow-base-url: ${WORKFLOW_SERVICE_URL:http://localhost:8250}
      pod-id: ${POD_ID:national}
      # facility-claim-adjudication (workflow-service V003 seed explicitly scopes
      # org-registry Channel-C claims to this definition).
      definition-id: ${ORG_REGISTRY_ADJUDICATION_DEFINITION_ID:ad1d0000-0000-4000-8000-000000000003}

# DECISION-FEEDBACK ARC — topic carrying workforce-governance decision events
# (impilo.governance.adjudication.decision.recorded). Consumer is gated by
# impilo.orgregistry.kafka-events-enabled=true.
impilo.governance:
  outbox-topic: ${GOVERNANCE_OUTBOX_TOPIC:impilo.governance.events}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
