replicaCount: 1

image:
  repository: impilo/costing-engine-service
  tag: latest
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8101

env:
  SPRING_DATASOURCE_URL: jdbc:postgresql://postgresql:5432/costing
  SPRING_DATASOURCE_USERNAME: impilo
  SPRING_DATASOURCE_PASSWORD: impilo
  SPRING_DATA_REDIS_HOST: redis
  SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: http://keycloak:8080/realms/impilo
  COSTA_OUTBOX_POLL_INTERVAL_MS: "500"
  COSTA_OUTBOX_BATCH_SIZE: "50"
  COSTA_DEFAULT_CURRENCY: USD

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: "1"
    memory: 1Gi

livenessProbe:
  httpGet:
    path: /actuator/health/liveness
    port: 8101
  initialDelaySeconds: 45

readinessProbe:
  httpGet:
    path: /actuator/health/readiness
    port: 8101
  initialDelaySeconds: 20
