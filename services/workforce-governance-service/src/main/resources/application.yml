server:
  port: ${SERVER_PORT:8165}

spring:
  application:
    name: workforce-governance-service
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/impilo_workforce_governance
    username: ${POSTGRES_USER:impilo}
    password: ${POSTGRES_PASSWORD:impilo}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
  security:
    oauth2:
      resourceserver:
        jwt:
          # Keycloak advertises the PUBLIC issuer even on the internal URL, so a token's `iss` is
          # the public one and validating against the in-cluster address rejects every token.
          # The JWK set must still be fetched internally: this host cannot reach its own public
          # address (hairpin NAT), so discovery against the public issuer would hang.
          issuer-uri: ${KEYCLOAK_ISSUER_URI:${KEYCLOAK_URL:http://localhost:8080}/realms/${KEYCLOAK_REALM:impilo}}
          jwk-set-uri: ${KEYCLOAK_URL:http://localhost:8080}/realms/${KEYCLOAK_REALM:impilo}/protocol/openid-connect/certs

impilo:
  companion:
    enabled: true
  security:
    disable-oauth-for-tests: ${IMPILO_SECURITY_DISABLE_OAUTH_FOR_TESTS:false}
  governance:
    kafka-events-enabled: ${GOVERNANCE_KAFKA_EVENTS_ENABLED:false}
    outbox-topic: ${GOVERNANCE_OUTBOX_TOPIC:impilo.governance.events}
    outbox-publish-interval-ms: ${GOVERNANCE_OUTBOX_PUBLISH_INTERVAL_MS:2000}
  # One-way organisation mirror producer (wgv_organisation -> organization-registry).
  # Default OFF: enabling is an explicit ops decision (org-registry cutover phase 1).
  org-mirror:
    enabled: ${ORG_MIRROR_ENABLED:false}
    # Phase-2a dormant read-preference. WGV (default) = strict no-op vs today.
    # ORG_REGISTRY is a phase-2c step; do not flip until the mirror is soak-verified
    # complete and the dual-key columns are backfilled.
    read-preference: ${ORG_MIRROR_READ_PREFERENCE:WGV}
    base-url: ${ORG_MIRROR_BASE_URL:http://localhost:8153}
    mirror-path: ${ORG_MIRROR_PATH:/v1/internal/org-registry/mirror/wgv}
    inventory-path: ${ORG_MIRROR_INVENTORY_PATH:/internal/v1/org-registry/mirror/wgv/inventory}
    connect-timeout-ms: ${ORG_MIRROR_CONNECT_TIMEOUT_MS:2000}
    read-timeout-ms: ${ORG_MIRROR_READ_TIMEOUT_MS:3000}
    backfill-page-size: ${ORG_MIRROR_BACKFILL_PAGE_SIZE:200}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  metrics:
    tags:
      application: workforce-governance-service
