server:
  port: 0

spring:
  task:
    scheduling:
      enabled: false
  datasource:
    url: jdbc:h2:mem:dags_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;INIT=CREATE SCHEMA IF NOT EXISTS dags
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false
  kafka:
    bootstrap-servers: localhost:9092

impilo:
  security:
    disable-oauth-for-tests: true
  companion:
    enabled: true

dags:
  outbox:
    poll-interval-ms: 60000
