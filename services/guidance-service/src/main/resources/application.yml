server:
  port: 8260

spring:
  application:
    name: guidance-service
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${KEYCLOAK_URL:http://localhost:8080}/realms/${KEYCLOAK_REALM:impilo}/protocol/openid-connect/certs
          issuer-uri: ${KEYCLOAK_ISSUER:${KEYCLOAK_URL:http://localhost:8080}/realms/${KEYCLOAK_REALM:impilo}}
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:guidance}
    username: ${DB_USER:impilo}
    password: ${DB_PASSWORD:impilo}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        default_schema: guidance
  flyway:
    enabled: true
    create-schemas: true
    schemas: guidance
    default-schema: guidance
    locations: classpath:db/migration
    baseline-on-migrate: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:${KAFKA_BOOTSTRAP:localhost:9092}}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      retries: 3
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
    consumer:
      group-id: guidance-service
      auto-offset-reset: earliest

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    tags:
      application: guidance-service

guidance:
  security:
    oauth2-enabled: true
  outbox:
    poll-interval-ms: 2000
  v11:
    emit-mode: ${GUIDANCE_EMIT_MODE:DUAL}

impilo:
  guidance:
    # Knowledge source configuration
    search-service-url: ${SEARCH_SERVICE_URL:http://localhost:8230}
    # LLM/AI configuration (placeholder for future integration)
    ai-provider: ${AI_PROVIDER:local}
    ai-model: ${AI_MODEL:none}
    # Consent enforcement
    require-consent-for-personalization: true

logging:
  level:
    zw.gov.mohcc.impilo: INFO
