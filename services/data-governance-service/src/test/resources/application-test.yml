spring:
  datasource:
    url: jdbc:h2:mem:data_governance_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false

impilo:
  security:
    disable-oauth-for-tests: true
    # The baseline bucket is 100 tokens, in-memory, keyed by actor — and every MockMvc request in a
    # test context presents the same actor. This module makes well over 100 requests per context, so
    # the filter throttles the suite and the 429 surfaces as a bogus status assertion in whichever
    # test happens to run after the hundredth request. Widened for tests only; the filter still runs.
    rate-limit:
      max-tokens: 1000000
  companion:
    enabled: true
  # Test-only de-identification secrets (production custody = tshepo-keys)
  deid:
    secrets:
      test-secret-a: unit-test-dataset-secret-a
      test-secret-b: unit-test-dataset-secret-b
