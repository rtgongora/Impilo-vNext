spring:
  datasource:
    url: jdbc:h2:mem:data_governance_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false

impilo:
  security:
    disable-oauth-for-tests: true
  companion:
    enabled: true
  # Test-only de-identification secrets (production custody = tshepo-keys)
  deid:
    secrets:
      test-secret-a: unit-test-dataset-secret-a
      test-secret-b: unit-test-dataset-secret-b
