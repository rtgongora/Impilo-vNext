server:
  port: 0

spring:
  application:
    name: pacs-adapter-service-test
  datasource:
    url: jdbc:h2:mem:pacstest;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;INIT=CREATE SCHEMA IF NOT EXISTS PACS
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      group-id: pacs-adapter-service-test
      auto-offset-reset: earliest
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration

# Narrow actuator + disable springdoc in tests so only one RequestMappingHandlerMapping is registered
# (GoldenContractSuite autowires RequestMappingHandlerMapping without a qualifier).
management:
  endpoints:
    web:
      exposure:
        include: health
      # Do not register actuator mappings on the main DispatcherServlet (avoids a second
      # RequestMappingHandlerMapping bean that breaks GoldenContractSuite autowiring).
      add-mappings: false

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
impilo:
  security:
    disable-oauth-for-tests: true
