server:
  port: ${SERVER_PORT:8109}
  servlet:
    context-path: /

spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          # PUBLIC issuer -- it is what the token's iss claim carries. The deployed estate
          # additionally supplies JWK_SET_URI (internal route) so no OIDC discovery is
          # attempted against an address this VM cannot reach.
          issuer-uri: ${KEYCLOAK_ISSUER:http://localhost:8080/realms/impilo}
  application:
    name: jobs-service
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/jobs
    username: ${POSTGRES_USER:impilo}
    password: ${POSTGRES_PASSWORD:changeme}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: jobs
  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: jobs
    baseline-on-migrate: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      group-id: jobs-service
      auto-offset-reset: earliest

# --- Actuator & Metrics ---
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: jobs-service

# --- OpenAPI / Swagger ---
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
