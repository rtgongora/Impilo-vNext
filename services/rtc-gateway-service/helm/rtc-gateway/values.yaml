replicaCount: 1

image:
  repository: ghcr.io/mohcc/impilo/rtc-gateway
  tag: "latest"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8195

containerPort: 8195

env:
  SERVER_PORT: "8195"
  RTC_PROVIDER: LIVEKIT
  RTC_FAIL_CLOSED: "true"
  RTC_DEV_MODE_ENABLED: "false"
  RTC_TOKEN_TTL_SECONDS: "3600"
  RTC_RECORDING_ENABLED: "false"
  RTC_EGRESS_ENABLED: "false"
  RTC_REQUIRE_CONSENT_REFERENCE_FOR_MEDIA: "true"
  RTC_ALLOW_EMERGENCY_WITHOUT_CONSENT: "true"
  LIVEKIT_ENABLED: "true"
  LIVEKIT_URL: http://livekit:7880
  LIVEKIT_CLIENT_URL: wss://livekit.example.gov.zw
  LIVEKIT_API_KEY: ""
  LIVEKIT_API_SECRET: ""

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

livenessProbe:
  httpGet:
    path: /actuator/health/liveness
    port: 8195
  initialDelaySeconds: 20
  periodSeconds: 10
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /actuator/health/readiness
    port: 8195
  initialDelaySeconds: 10
  periodSeconds: 5
  failureThreshold: 3

ingress:
  enabled: false

autoscaling:
  enabled: false
