spring:
  kafka:
    bootstrap-servers: localhost:9092
  datasource:
    url: jdbc:h2:mem:asset_registry_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false

impilo:
  companion:
    enabled: true
  security:
    disable-oauth-for-tests: true
    oauth2-enabled: false

asset-registry:
  supply:
    kafka-listeners-enabled: false
