spring:
  datasource:
    url: jdbc:h2:mem:ai_registry_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;INIT=CREATE SCHEMA IF NOT EXISTS ai_registry
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        default_schema: ai_registry
  flyway:
    enabled: false
  kafka:
    listener:
      auto-startup: false

air:
  security:
    allow-insecure-permit-all: true

impilo:
  security:
    disable-oauth-for-tests: true
  companion:
    enabled: true
