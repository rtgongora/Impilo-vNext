server:
  port: 8093
  servlet:
    context-path: /

spring:
  application:
    name: document-service
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/document_service
    username: ${POSTGRES_USER:impilo}
    password: ${POSTGRES_PASSWORD:changeme}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: document_store
  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: document_store
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${KEYCLOAK_URL:http://localhost:8080}/realms/${KEYCLOAK_REALM:impilo}/protocol/openid-connect/certs
          issuer-uri: ${KEYCLOAK_URL:http://localhost:8080}/realms/${KEYCLOAK_REALM:impilo}
  servlet:
    multipart:
      max-file-size: ${DOCUMENT_STORE_MAX_FILE_SIZE:50MB}
      max-request-size: ${DOCUMENT_STORE_MAX_REQUEST_SIZE:55MB}

# ---- Document Store configuration ----

document-store:
  v11:
    emit-mode: ${DOCUMENT_STORE_EMIT_MODE:DUAL}
  minio:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    bucket: ${MINIO_BUCKET:impilo-documents}
    access-key: ${MINIO_ACCESS_KEY:minioadmin}
    secret-key: ${MINIO_SECRET_KEY:minioadmin}
  signed-url:
    ttl-seconds: ${SIGNED_URL_TTL:300}
  scan:
    enabled: ${SCAN_ENABLED:false}
    scanner-type: ${SCAN_TYPE:NOOP}
  max-file-size-mb: ${MAX_FILE_SIZE_MB:50}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    tags:
      application: document-service
