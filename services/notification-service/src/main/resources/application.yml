server:
  port: ${SERVER_PORT:8200}

spring:
  application:
    name: notification-service
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/impilo_notification
    username: ${POSTGRES_USER:impilo}
    password: ${POSTGRES_PASSWORD:impilo}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${KEYCLOAK_URL:http://localhost:8080}/realms/${KEYCLOAK_REALM:impilo}/protocol/openid-connect/certs
          issuer-uri: ${KEYCLOAK_URL:http://localhost:8080}/realms/${KEYCLOAK_REALM:impilo}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: when-authorized

impilo:
  companion:
    enabled: true
  mvumo:
    base-url: ${MVUMO_BASE_URL:http://localhost:8195}
    enabled: true
  kafka:
    mvumo:
      enabled: ${KAFKA_MVUMO_CONSUMER_ENABLED:false}
      topic: ${KAFKA_MVUMO_TOPIC:platform.mvumo.events}
      group-id: ${KAFKA_MVUMO_GROUP:notification-service-mvumo}
    oros:
      enabled: ${KAFKA_OROS_CONSUMER_ENABLED:false}
      critical-topic: ${KAFKA_OROS_CRITICAL_TOPIC:oros.result.critical}
      group-id: ${KAFKA_OROS_GROUP:notification-service-oros}
  ops:
    enabled: true
    outbox-table: ns_event_outbox

notification:
  worker:
    scheduler-enabled: ${NOTIFICATION_WORKER_SCHEDULER_ENABLED:true}
    poll-interval-ms: ${NOTIFICATION_WORKER_POLL_INTERVAL_MS:10000}
    batch-limit: ${NOTIFICATION_WORKER_BATCH_LIMIT:25}
  # ── SMS delivery provider selection (env-selected) ─────────────────────────
  # log (default): SmsStubProvider — messages are NOT delivered, only logged
  #                loudly (safe for compose/local dev; OTPs land in the log).
  # http:          HttpSmsProvider — POSTs {to, from, message} JSON to a real
  #                SMS gateway (Africa's Talking / Twilio-style HTTP APIs) with
  #                Bearer token auth. A non-2xx gateway response throws
  #                NotificationDeliveryException → notification FAILED (loud),
  #                so fail-closed callers such as tshepo-authz step-up and the
  #                BFF contact-verification flow never see a silent OTP drop.
  #
  # The gateway settings are read by HttpSmsProvider via relaxed binding and are
  # deliberately NOT given yml values: with provider=http and no gateway URL the
  # bean fails at startup (unresolvable notification.sms.gateway.url) instead of
  # half-configuring delivery.
  #
  # Production example (environment):
  #   NOTIFICATION_SMS_PROVIDER=http
  #   NOTIFICATION_SMS_GATEWAY_URL=https://sms-gateway.example.zw/v1/messages
  #   NOTIFICATION_SMS_GATEWAY_API_KEY=<token>          # optional, Bearer auth
  #   NOTIFICATION_SMS_GATEWAY_SENDER_ID=IMPILO         # optional, default IMPILO
  sms:
    provider: ${NOTIFICATION_SMS_PROVIDER:log}
