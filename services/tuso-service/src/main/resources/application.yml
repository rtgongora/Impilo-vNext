server:
  port: 8084
  servlet:
    context-path: /

spring:
  application:
    name: tuso-service
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/tuso
    username: ${POSTGRES_USER:impilo}
    password: ${POSTGRES_PASSWORD:changeme}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      # Put the tuso schema on the connection search_path so native queries can
      # resolve pg_trgm functions (similarity(), % operator). The extension is
      # created in the tuso schema (Flyway schemas=tuso), and Hibernate
      # default_schema only qualifies entity SQL — it does NOT set search_path, so
      # unqualified similarity() in FacilityMatchService fails without this.
      connection-init-sql: SET search_path TO tuso, public
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: tuso
  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: tuso
    # This service's migration numbers are leased in per-lane bands (see
    # docs/registry/iatg-*-leases.md), so a lane routinely merges a migration
    # numerically BELOW one another lane has already applied. Flyway's default
    # refuses exactly those, and silently: the service boots green with the table
    # missing. Live-proven on pct 2026-07-26 — V106 was in the jar, the service was
    # healthy, zero errors, and six tables had never been created.
    #
    # What this does NOT license: a migration in one band may never DEPEND ON an
    # object owned by a higher band. Out-of-order only relaxes ordering on a database
    # where the higher number has ALREADY applied; a fresh database still applies
    # strictly ascending, so a cross-band dependency boots fine here and fails on
    # every new environment. Lease law forbids it for that reason.
    out-of-order: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      retries: 3
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_URL:http://localhost:8080}/realms/${KEYCLOAK_REALM:impilo}

# ── TUSO-specific configuration ───────────────────────────────────────
tuso:
  # GOFR dual-mode: STANDALONE (internal register) or GOFR (sync with GOFR)
  registry-mode: ${TUSO_REGISTRY_MODE:STANDALONE}
  gofr:
    base-url: ${GOFR_BASE_URL:http://localhost:3000}
    sync-cron: "0 */6 * * * *"
    enabled: ${GOFR_ENABLED:false}

  # ZIBO terminology validation
  zibo:
    base-url: ${ZIBO_BASE_URL:http://localhost:8085}
    validation-mode: ${TUSO_ZIBO_MODE:LENIENT}
    enabled: ${ZIBO_ENABLED:false}

  # VARAPI integration (provider eligibility)
  varapi:
    base-url: ${VARAPI_BASE_URL:http://localhost:8083}
  # Rito Experience & Reputation (RW8): read-only facility experience summary composed
  # onto the public facility profile. Off by default; enable once Rito reputation is live.
  rito:
    enabled: ${TUSO_RITO_ENABLED:false}
    base-url: ${TUSO_RITO_BASE_URL:http://localhost:8391}

  # MusheX payment intents for HPA registration fees (SI 78 of 2017).
  mushex:
    enabled: ${TUSO_MUSHEX_ENABLED:true}
    base-url: ${MUSHEX_URL:http://localhost:8102}
    # Rig/preview only — never true in production.
    sandbox-simulation: ${TUSO_MUSHEX_SANDBOX_SIMULATION:false}

  # Alert thresholds
  alerts:
    queue-wait-threshold-minutes: 60
    task-stagnation-threshold-minutes: 120
    low-bed-occupancy-pct: 20
    high-bed-occupancy-pct: 90

  # Config cache
  config-cache-ttl-seconds: 300

  # Outbox
  outbox:
    poll-interval-ms: 1000
    kafka-topic-prefix: tuso

impilo:
  booking:
    base-url: ${BOOKING_BASE_URL:http://localhost:8265}
    forward-enabled: ${BOOKING_FORWARD_ENABLED:false}
  ops:
    enabled: true
    outbox-table: tuso.event_outbox

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    tags:
      application: tuso-service
  health:
    redis:
      enabled: true
    db:
      enabled: true
