server:
  port: 8084
  servlet:
    context-path: /

spring:
  application:
    name: tuso-service
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/tuso
    username: ${POSTGRES_USER:impilo}
    password: ${POSTGRES_PASSWORD:changeme}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: tuso
  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: tuso
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      retries: 3
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_URL:http://localhost:8080}/realms/${KEYCLOAK_REALM:impilo}

# ── TUSO-specific configuration ───────────────────────────────────────
tuso:
  # GOFR dual-mode: STANDALONE (internal register) or GOFR (sync with GOFR)
  registry-mode: ${TUSO_REGISTRY_MODE:STANDALONE}
  gofr:
    base-url: ${GOFR_BASE_URL:http://localhost:3000}
    sync-cron: "0 */6 * * * *"
    enabled: ${GOFR_ENABLED:false}

  # ZIBO terminology validation
  zibo:
    base-url: ${ZIBO_BASE_URL:http://localhost:8085}
    validation-mode: ${TUSO_ZIBO_MODE:LENIENT}
    enabled: ${ZIBO_ENABLED:false}

  # VARAPI integration (provider eligibility)
  varapi:
    base-url: ${VARAPI_BASE_URL:http://localhost:8083}

  # Alert thresholds
  alerts:
    queue-wait-threshold-minutes: 60
    task-stagnation-threshold-minutes: 120
    low-bed-occupancy-pct: 20
    high-bed-occupancy-pct: 90

  # Config cache
  config-cache-ttl-seconds: 300

  # Outbox
  outbox:
    poll-interval-ms: 1000
    kafka-topic-prefix: tuso

impilo:
  booking:
    base-url: ${BOOKING_BASE_URL:http://localhost:8265}
    forward-enabled: ${BOOKING_FORWARD_ENABLED:false}
  ops:
    enabled: true
    outbox-table: tuso.event_outbox

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    tags:
      application: tuso-service
  health:
    redis:
      enabled: true
    db:
      enabled: true
