# ============================================================================
# VITO — Test profile (H2 in PostgreSQL-compat mode, fully offline)
# ============================================================================
# Flyway is DISABLED because VITO migrations use PostgreSQL-specific syntax
# (BIGSERIAL, TIMESTAMPTZ, JSONB, gen_random_uuid(), partial indexes, CREATE
# SCHEMA IF NOT EXISTS) that H2 cannot parse even in MODE=PostgreSQL.
# Hibernate ddl-auto: create-drop builds the schema from JPA entity metadata.
# ============================================================================

spring:
  datasource:
    url: jdbc:h2:mem:vito_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1;INIT=CREATE SCHEMA IF NOT EXISTS VITO\;SET SCHEMA VITO
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false
  sql:
    init:
      mode: always
      data-locations: classpath:testdata/seed.sql
  kafka:
    bootstrap-servers: localhost:9092
    listener:
      auto-startup: false
  data:
    redis:
      host: localhost
      port: 6379
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8080/realms/impilo
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration

vito:
  argon2:
    memory-cost-kb: 65536
    iterations: 3
    parallelism: 4
  hmac:
    pepper: test-pepper-not-for-production-padded-to-32b
  did:
    method: impilo
  card:
    expiry-years: 5
  matching:
    threshold-auto-link: 0.95
    threshold-manual-review: 0.70
  registry-mode: STANDALONE
  opencr:
    base-url: http://localhost:3000/fhir
  v11:
    emit-mode: DUAL
impilo:
  security:
    disable-oauth-for-tests: true
