server:
  port: 8082
  servlet:
    context-path: /

spring:
  application:
    name: vito-service
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/vito
    username: ${POSTGRES_USER:impilo}
    password: ${POSTGRES_PASSWORD:changeme}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: vito
  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: vito
    validate-on-migrate: false
    # This service's migration numbers are leased in per-lane bands (see
    # docs/registry/iatg-*-leases.md), so a lane routinely merges a migration
    # numerically BELOW one another lane has already applied. Flyway's default
    # refuses exactly those, and silently: the service boots green with the table
    # missing. Live-proven on pct 2026-07-26 — V106 was in the jar, the service was
    # healthy, zero errors, and six tables had never been created.
    #
    # What this does NOT license: a migration in one band may never DEPEND ON an
    # object owned by a higher band. Out-of-order only relaxes ordering on a database
    # where the higher number has ALREADY applied; a fresh database still applies
    # strictly ascending, so a cross-band dependency boots fine here and fails on
    # every new environment. Lease law forbids it for that reason.
    out-of-order: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      # Values are pre-serialized JSON strings (envelope/outbox payloads) — a
      # JsonSerializer would double-encode them into quoted string literals.
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI:${KEYCLOAK_URL:http://localhost:8080}/realms/${KEYCLOAK_REALM:impilo}}

# ---- VITO-specific configuration ----

vito:
  identity:
    # Impilo ID at-rest encryption key (Identity Contract §6). Production MUST
    # supply a >=32-char secret via tshepo-keys custody; unset falls back to a
    # dev key with a loud warning so the preview estate boots.
    impilo-id-encryption-key: ${VITO_IMPILO_ID_ENCRYPTION_KEY:}
  qr:
    # QR signing key seed (Identity Contract §10 / C3). Deterministic Ed25519 key
    # so signatures survive restarts and verify cross-instance. Production MUST
    # supply a >=32-char secret via tshepo-keys custody.
    signing-key-seed: ${VITO_QR_SIGNING_KEY_SEED:}
  # Argon2id parameters (Architect directive: m=64MB, t=3, p=4)
  argon2:
    memory-cost-kb: 65536     # 64 MiB
    iterations: 3
    parallelism: 4

  # HMAC pepper — must be supplied via K8s Secret or Vault
  hmac:
    pepper: ${VITO_HMAC_PEPPER:changeme-not-for-production}

  # DID method for sovereign identity
  did:
    method: impilo

  # Card lifecycle
  card:
    expiry-years: 5

  # Matching engine
  matching:
    threshold-auto-link: 0.95
    threshold-manual-review: 0.70

  # Biometric governance (Tshepo policy + auditable events)
  biometric:
    policy-enabled: ${VITO_BIOMETRIC_POLICY_ENABLED:true}
    tshepo-policy-base-url: ${TSHEPO_AUTHZ_BASE_URL:http://localhost:8081}
    # When > 0, verify() requires probeContext.livenessScore() >= this value (vendor pipeline should populate).
    liveness-min-score: ${VITO_BIOMETRIC_LIVENESS_MIN_SCORE:0}

  pickup:
    # When true, redeem requires Tshepo CLIENT/DELEGATED_PICKUP/FACILITY/VERIFY rule (actor + assurance aware).
    biometric-policy-on-redeem: ${VITO_PICKUP_BIOMETRIC_POLICY_ON_REDEEM:false}

  # Patient-mediated external provider collaboration (Tshepo policy + Varapi provisional profile)
  patient-share:
    policy-enabled: ${VITO_PATIENT_SHARE_POLICY_ENABLED:true}
    tshepo-policy-base-url: ${TSHEPO_AUTHZ_BASE_URL:http://localhost:8081}
    varapi-base-url: ${VARAPI_BASE_URL:http://localhost:8083}
    pct-base-url: ${PCT_BASE_URL:http://localhost:8088}
    pct-bearer-token: ${VITO_TO_PCT_BEARER_TOKEN:}
    step-up-test-code: ${VITO_PATIENT_SHARE_STEP_UP_CODE:000000}

  # Mode: OPENCR or STANDALONE
  registry-mode: ${VITO_REGISTRY_MODE:STANDALONE}

  # OpenCR integration (Mode A)
  opencr:
    base-url: ${OPENCR_BASE_URL:http://localhost:3000/fhir}

  # v1.1 runtime enforcement
  # Emit mode precedence: EMIT_MODE system property > EMIT_MODE env var > vito.v11.emit-mode > DUAL
  v11:
    # DualEmitPolicy: LEGACY_ONLY | V1_1_ONLY | DUAL
    emit-mode: ${VITO_EMIT_MODE:DUAL}
  outbox:

impilo:
  ops:
    enabled: true
    outbox-table: vito.event_outbox
  security:
    disable-oauth-for-tests: ${IMPILO_SECURITY_DISABLE_OAUTH_FOR_TESTS:false}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    tags:
      application: vito-service
