server:
  port: 8081
  servlet:
    context-path: /

spring:
  application:
    name: tshepo-authz-service
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/tshepo_authz
    username: ${POSTGRES_USER:impilo}
    password: ${POSTGRES_PASSWORD:changeme}
    hikari:
      maximum-pool-size: 30
      minimum-idle: 10
      connection-timeout: 3000
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: tshepo_authz
  flyway:
    enabled: true
    schemas: tshepo_authz
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2000ms
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3
      enable-idempotence: true
      properties:
        max.in.flight.requests.per.connection: 1
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:}

# ── gRPC server ────────────────────────────────────────────────────────────
grpc:
  server:
    port: 9090
    enable-keep-alive: true
    keep-alive-time: 30s
    keep-alive-timeout: 10s
    max-inbound-message-size: 4MB

# ── TSHEPO Authz configuration ────────────────────────────────────────────
tshepo:
  authz:
    # Rate limiting
    rate-limit:
      max-requests-per-minute: 600
      burst-size: 50
    # Step-up authentication
    step-up-window-seconds: 300
    step-up-methods:
      - MFA
      - BIOMETRIC
      - SUPERVISOR_APPROVAL
    # Break-glass
    break-glass-ttl-minutes: 60
    break-glass-review-sla-hours: 24
    # Risk score thresholds
    risk-thresholds:
      step-up-trigger: 61
      deny-threshold: 81
      new-device-score: 50
      unknown-device-score: 70
      blocked-device-score: 100
    # Consent service
    consent-service-url: ${TSHEPO_CONSENT_URL:http://localhost:8182}
    consent-evaluate-path: /v1/consent/evaluate
    # Identity service
    identity-service-url: ${TSHEPO_IDENTITY_URL:http://localhost:8181}
    # Audit service
    audit-service-url: ${TSHEPO_AUDIT_URL:http://localhost:8183}
    audit-kafka-topic: tshepo.audit.events
    # Keys service
    keys-service-url: ${TSHEPO_KEYS_URL:http://localhost:8184}
    # eSignet OIDC (optional, for citizen auth)
    esignet:
      enabled: ${ESIGNET_ENABLED:false}
      issuer-uri: ""
      introspection-uri: ${ESIGNET_INTROSPECTION_URI:http://localhost:8088/oauth/introspect}
      client-id: ${ESIGNET_CLIENT_ID:impilo}
      client-secret: ${ESIGNET_CLIENT_SECRET:changeme}
    # Redis cache TTLs
    cache:
      policy-rules-ttl-seconds: 300
      device-profile-ttl-seconds: 600
      session-ttl-seconds: 1800
    # Policy version (increment on every policy set change)
    policy-version: ${POLICY_VERSION:1.0}

# ── Actuator ───────────────────────────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  metrics:
    tags:
      application: tshepo-authz-service
  health:
    redis:
      enabled: true
    db:
      enabled: true
