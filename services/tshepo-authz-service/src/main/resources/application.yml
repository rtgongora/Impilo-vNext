server:
  port: 8081
  servlet:
    context-path: /

spring:
  application:
    name: tshepo-authz-service
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/tshepo_authz
    username: ${POSTGRES_USER:impilo}
    password: ${POSTGRES_PASSWORD:changeme}
    hikari:
      maximum-pool-size: 30
      minimum-idle: 10
      connection-timeout: 3000
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: tshepo_authz
  flyway:
    enabled: true
    schemas: tshepo_authz
    locations: classpath:db/migration
    # This service's migration numbers are leased in per-lane bands (see
    # docs/registry/iatg-*-leases.md), so a lane routinely merges a migration
    # numerically BELOW one another lane has already applied. Flyway's default
    # refuses exactly those, and silently: the service boots green with the table
    # missing. Live-proven on pct 2026-07-26 — V106 was in the jar, the service was
    # healthy, zero errors, and six tables had never been created.
    #
    # What this does NOT license: a migration in one band may never DEPEND ON an
    # object owned by a higher band. Out-of-order only relaxes ordering on a database
    # where the higher number has ALREADY applied; a fresh database still applies
    # strictly ascending, so a cross-band dependency boots fine here and fails on
    # every new environment. Lease law forbids it for that reason.
    out-of-order: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2000ms
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3
    consumer:
      group-id: tshepo-authz
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      enable-auto-commit: false
      properties:
        isolation.level: read_committed
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_URL:http://localhost:8080}/realms/${KEYCLOAK_REALM:impilo}

# ── gRPC server ────────────────────────────────────────────────────────────
grpc:
  server:
    port: 9090
    enable-keep-alive: true
    keep-alive-time: 30s
    keep-alive-timeout: 10s
    max-inbound-message-size: 4MB

# ── TSHEPO Authz configuration ────────────────────────────────────────────
tshepo:
  authz:
    legacy-policy:
      base-url: ${TSHEPO_LEGACY_SERVICE_URL:http://localhost:8079}
    # Rate limiting
    rate-limit:
      max-requests-per-minute: 600
      burst-size: 50
    # Step-up authentication
    step-up-window-seconds: 300
    step-up-methods:
      - MFA
      - BIOMETRIC
      - SUPERVISOR_APPROVAL
    # Break-glass
    break-glass-ttl-minutes: 60
    break-glass-review-sla-hours: 24
    visibility-escalation-grant-ttl-hours: 4
    visibility-escalation-approver-roles:
      - SYSTEM_ADMIN
      - DEVELOPER
      - REGULATORY_REVIEWER
    # Risk score thresholds
    risk-thresholds:
      step-up-trigger: 61
      deny-threshold: 81
      new-device-score: 50
      unknown-device-score: 70
      blocked-device-score: 100
    # Consent service
    consent-service-url: ${TSHEPO_CONSENT_URL:http://localhost:8182}
    consent-evaluate-path: /v1/consent/evaluate
    # Identity service
    identity-service-url: ${TSHEPO_IDENTITY_URL:http://localhost:8181}
    # WORK_CONTEXT duty-token binding: OFF | SHADOW | ENFORCE (default SHADOW — observe-only)
    work-context-mode: ${TSHEPO_WORK_CONTEXT_MODE:SHADOW}
    work-context-introspect-path: /v1/identity/tokens/introspect
    # Signed decision envelope (D2). Off until Flip 4 of the D7 cutover; see
    # docs/runbooks/work-context-d7-cutover.md. Env so it can be flipped without a helm upgrade
    # while the repin hold stands.
    decision-envelope-enabled: ${TSHEPO_DECISION_ENVELOPE_ENABLED:false}
    decision-envelope-ttl-seconds: ${TSHEPO_DECISION_ENVELOPE_TTL_SECONDS:120}
    # Audit service
    audit-service-url: ${TSHEPO_AUDIT_URL:http://localhost:8183}
    audit-kafka-topic: tshepo.audit.events
    # Keys service
    keys-service-url: ${TSHEPO_KEYS_URL:http://localhost:8184}
    # eSignet OIDC (optional, for citizen auth)
    esignet:
      enabled: ${ESIGNET_ENABLED:false}
      issuer-uri: ${ESIGNET_ISSUER_URI:http://localhost:8088}
      introspection-uri: ${ESIGNET_INTROSPECTION_URI:http://localhost:8088/oauth/introspect}
      client-id: ${ESIGNET_CLIENT_ID:impilo}
      client-secret: ${ESIGNET_CLIENT_SECRET:changeme}
    # Redis cache TTLs
    cache:
      policy-rules-ttl-seconds: 300
      device-profile-ttl-seconds: 600
      session-ttl-seconds: 1800

# ── Actuator ───────────────────────────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  metrics:
    tags:
      application: tshepo-authz-service
  health:
    redis:
      enabled: true
    db:
      enabled: true
