server:
  port: 8092
  servlet:
    context-path: /

spring:
  application:
    name: landela-adapter-service
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/landela_adapter
    username: ${POSTGRES_USER:impilo}
    password: ${POSTGRES_PASSWORD:changeme}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: landela_adapter
  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: landela_adapter
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_URL:http://localhost:8080}/realms/${KEYCLOAK_REALM:impilo}
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 60MB

# ---- Landela Adapter configuration ----

landela:
  mode: ${LANDELA_MODE:INTERNAL}

  landela:
    base-url: ${LANDELA_BASE_URL:}
    api-key: ${LANDELA_API_KEY:}
    timeout: ${LANDELA_TIMEOUT:30000}

  internal:
    minio-endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    minio-bucket: ${MINIO_BUCKET:impilo-documents}
    minio-access-key: ${MINIO_ACCESS_KEY:minioadmin}
    minio-secret-key: ${MINIO_SECRET_KEY:minioadmin}

  signed-url:
    ttl-seconds: ${SIGNED_URL_TTL:300}

  kafka:
    topic-prefix: ${LANDELA_KAFKA_TOPIC_PREFIX:docs}

  outbox:
    poll-interval-ms: ${LANDELA_OUTBOX_POLL_MS:1000}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  metrics:
    tags:
      application: landela-adapter-service
