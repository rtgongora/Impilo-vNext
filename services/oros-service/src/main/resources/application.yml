server:
  port: 8089
  servlet:
    context-path: /

spring:
  application:
    name: oros-service
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/oros
    username: ${POSTGRES_USER:impilo}
    password: ${POSTGRES_PASSWORD:changeme}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: false
    # This service's migration numbers are leased in per-lane bands (see
    # docs/registry/iatg-*-leases.md), so a lane routinely merges a migration
    # numerically BELOW one another lane has already applied. Flyway's default
    # refuses exactly those, and silently: the service boots green with the table
    # missing. Live-proven on pct 2026-07-26 — V106 was in the jar, the service was
    # healthy, zero errors, and six tables had never been created.
    #
    # What this does NOT license: a migration in one band may never DEPEND ON an
    # object owned by a higher band. Out-of-order only relaxes ordering on a database
    # where the higher number has ALREADY applied; a fresh database still applies
    # strictly ascending, so a cross-band dependency boots fine here and fails on
    # every new environment. Lease law forbids it for that reason.
    out-of-order: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      group-id: oros-service
      auto-offset-reset: earliest
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER:http://localhost:8080/realms/impilo}

# --- Actuator & Metrics ---
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: oros-service

# --- OpenAPI / Swagger ---
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

# --- OROS-specific ---
oros:
  outbox:
    poll-interval-ms: 2000
    dual-emit-canonical-enabled: ${OROS_OUTBOX_DUAL_EMIT_CANONICAL_ENABLED:false}
    dual-emit-core-transaction-enabled: ${OROS_OUTBOX_DUAL_EMIT_CORE_TRANSACTION_ENABLED:true}
    core-transaction-topic: ${OROS_OUTBOX_CORE_TRANSACTION_TOPIC:core.transaction.events}
    canonical-topics:
      result-available: ${OROS_OUTBOX_CANONICAL_TOPIC_RESULT_AVAILABLE:clinical.oros.result.available}
  sla:
    default-tat-minutes: 120
  escalation:
    ack-timeout-minutes: 30
  routing:
    default-mode: INTERNAL
  integration:
    # External interoperability adapters — honest configured/not-configured at /admin/integrations.
    butano:
      base-url: ${OROS_BUTANO_BASE_URL:http://localhost:8090}
    varapi:
      base-url: ${OROS_VARAPI_BASE_URL:http://localhost:8083}
    tuso:
      base-url: ${OROS_TUSO_BASE_URL:http://localhost:8084}
    share-slip:
      base-url: ${OROS_SHARE_SLIP_BASE_URL:http://localhost:8104}
    fhir:
      imagingstudy-outbound:
        enabled: ${OROS_FHIR_IMAGINGSTUDY_OUTBOUND_ENABLED:false}
      servicerequest-inbound:
        enabled: ${OROS_FHIR_SERVICEREQUEST_INBOUND_ENABLED:false}
    hl7:
      orm-inbound:
        enabled: ${OROS_HL7_ORM_INBOUND_ENABLED:false}
        port: ${OROS_HL7_ORM_INBOUND_PORT:2575}
        tenant-id: ${OROS_HL7_ORM_INBOUND_TENANT_ID:}
        facility-id: ${OROS_HL7_ORM_INBOUND_FACILITY_ID:}
      oru-outbound:
        enabled: ${OROS_HL7_ORU_OUTBOUND_ENABLED:false}
        host: ${OROS_HL7_ORU_OUTBOUND_HOST:localhost}
        port: ${OROS_HL7_ORU_OUTBOUND_PORT:2576}
    dicom:
      mwl:
        # OFF (NOT_LIVE) | REST (DICOMweb/UPS-RS to dcm4chee-arc or Orthanc) | DIMSE (UPS N-CREATE)
        mode: ${OROS_DICOM_MWL_MODE:OFF}
        scheduled-station-aet: ${OROS_DICOM_MWL_STATION_AET:IMPILO}
        rest:
          base-url: ${OROS_DICOM_MWL_REST_BASE_URL:http://localhost:8088}
          path: ${OROS_DICOM_MWL_REST_PATH:/dcm4chee-arc/aets/DCM4CHEE/rs/mwlitems}
        dimse:
          calling-aet: ${OROS_DICOM_MWL_CALLING_AET:IMPILO_OROS}
          called-aet: ${OROS_DICOM_MWL_CALLED_AET:DCM4CHEE}
          host: ${OROS_DICOM_MWL_DIMSE_HOST:localhost}
          port: ${OROS_DICOM_MWL_DIMSE_PORT:11112}
