spring:
  kafka:
    listener:
      auto-startup: false
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.oauth2.resource.servlet.OAuth2ResourceServerAutoConfiguration
  datasource:
    url: jdbc:h2:mem:coverage_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false

# Strong test-only material — EligibilityTokenService refuses to start without it.
ruvimbo:
  token:
    secret: coverage-test-ruvimbo-token-secret-32b!!

impilo:
  security:
    disable-oauth-for-tests: true
  companion:
    enabled: true
