spring:
  datasource:
    url: jdbc:h2:mem:khuluma_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false

impilo:
  security:
    disable-oauth-for-tests: true
  companion:
    enabled: true
  khuluma:
    # Best-effort downstream; tests assert lifecycle works even when media is unreachable.
    rtc-gateway-base-url: http://localhost:8195
    # No Redis in tests — the realtime gateway delivers locally (single instance), which is
    # exactly what the SSE/WS round-trip tests exercise.
    realtime:
      redis-enabled: false
