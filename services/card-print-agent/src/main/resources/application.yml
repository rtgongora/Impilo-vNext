server:
  port: ${SERVER_PORT:8291}
  servlet:
    context-path: /

spring:
  application:
    name: card-print-agent
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/card_print
    username: ${POSTGRES_USER:impilo}
    password: ${POSTGRES_PASSWORD:changeme}
    hikari:
      maximum-pool-size: 15
      minimum-idle: 3
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: card_print
  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: card_print
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: card-print-agent
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_URL:http://localhost:8080}/realms/${KEYCLOAK_REALM:impilo}

# ---- Card Print Agent specific configuration ----

card-print:
  templates:
    provider-card: "classpath:templates/provider-card.json"
    client-card: "classpath:templates/client-card.json"
    share-slip: "classpath:templates/share-slip.json"
    emergency-capsule: "classpath:templates/emergency-capsule.json"
  spooler:
    type: FILE  # FILE | NETWORK
    outputDir: /tmp/card-print-output
  landela:
    baseUrl: ${LANDELA_ADAPTER_URL:http://localhost:8092}
  vito:
    base-url: ${VITO_SERVICE_URL:http://localhost:8082}
    actor-id: card-print-agent
  qr:
    hmac-secret: ${CARD_PRINT_QR_HMAC_SECRET:changeme-not-for-production}
  processor:
    poll-interval-ms: 5000
    batch-size: 10
  outbox:
    poll-interval-ms: 3000
    batch-size: 50

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  metrics:
    tags:
      application: card-print-agent
