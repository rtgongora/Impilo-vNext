# Auto-generated H2 test profile so the golden-contract @SpringBootTest boots
# offline (main profile uses PostgreSQL + Flyway with PG-specific migrations).
spring:
  kafka:
    bootstrap-servers: localhost:9092
    listener:
      auto-startup: false
  datasource:
    url: "jdbc:h2:mem:card_print_agent;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;INIT=CREATE SCHEMA IF NOT EXISTS card_print\\;SET SCHEMA card_print"
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ""

impilo:
  security:
    disable-oauth-for-tests: true
