replicaCount: 1

image:
  repository: ghcr.io/mohcc/impilo/card-print-agent
  tag: "latest"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8091

env:
  SERVER_PORT: "8091"
  SPRING_KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
  SPRING_KAFKA_CONSUMER_GROUP_ID: "card-print-agent"
  POSTGRES_HOST: "postgresql"
  POSTGRES_PORT: "5432"
  POSTGRES_USER: "impilo"
  POSTGRES_PASSWORD: "changeme"
  KEYCLOAK_URL: "http://keycloak:8080"
  KEYCLOAK_REALM: "impilo"
  LANDELA_ADAPTER_URL: "http://landela-adapter-service:8092"
  # CARD_PRINT_QR_SIGNING_KEY_SEED is deliberately absent: it is required key material and
  # must arrive from the impilo-app-secrets Secret, never from a values file in git.

volumes:
  - name: print-output
    emptyDir: {}

volumeMounts:
  - name: print-output
    mountPath: /tmp/card-print-output

resources:
  requests:
    cpu: 100m
    memory: 384Mi
  limits:
    cpu: 500m
    memory: 768Mi

livenessProbe:
  httpGet:
    path: /actuator/health
    port: 8091
  initialDelaySeconds: 30
  periodSeconds: 10

readinessProbe:
  httpGet:
    path: /actuator/health
    port: 8091
  initialDelaySeconds: 15
  periodSeconds: 5
