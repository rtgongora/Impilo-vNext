spring:
  datasource:
    url: jdbc:h2:mem:offline_edge_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate.dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false

impilo:
  companion:
    enabled: true
  offline:
    entitlement-ttl-hours: 24
    hmac-secret: test-secret-key-for-testing-only
