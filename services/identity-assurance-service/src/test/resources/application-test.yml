server:
  port: 0

spring:
  datasource:
    url: jdbc:h2:mem:ia_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false
  kafka:
    bootstrap-servers: localhost:9092

impilo:
  security:
    disable-oauth-for-tests: true
  companion:
    enabled: true

ia:
  outbox:
    poll-interval-ms: 60000
