server:
  port: ${SERVER_PORT:8130}

spring:
  application:
    name: channels-service
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/impilo_channels
    username: ${POSTGRES_USER:impilo}
    password: ${POSTGRES_PASSWORD:impilo}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${KEYCLOAK_URL:http://localhost:8080}/realms/${KEYCLOAK_REALM:impilo}/protocol/openid-connect/certs
          issuer-uri: ${KEYCLOAK_URL:http://localhost:8080}/realms/${KEYCLOAK_REALM:impilo}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      retries: 3
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized

impilo:
  companion:
    enabled: true
  services:
    mushe-wallet-base-url: ${MUSHE_WALLET_BASE_URL:http://localhost:8126}
  channels:
    external-notify:
      # Honest seam: when no external gateway is wired, notify-only sends are QUEUED (recorded as
      # an outbox event) rather than DISPATCHED. Content is always the fixed, clinical-content-free
      # template below.
      enabled: ${EXTERNAL_NOTIFY_ENABLED:false}
      template: ${EXTERNAL_NOTIFY_TEMPLATE:You have a secure health notification. Please log in to Impilo to view it.}
