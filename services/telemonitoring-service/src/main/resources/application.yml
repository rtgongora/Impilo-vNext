server:
  port: ${SERVER_PORT:8394}
  servlet:
    context-path: /

spring:
  application:
    name: telemonitoring-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:telemonitoring}
    username: ${POSTGRES_USER:impilo}
    password: ${POSTGRES_PASSWORD:changeme}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: telemonitoring
  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: telemonitoring
    baseline-on-migrate: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:${KAFKA_BOOTSTRAP:localhost:9092}}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      retries: 3
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
    consumer:
      group-id: telemonitoring-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${KEYCLOAK_URL:http://localhost:8080}/realms/${KEYCLOAK_REALM:impilo}/protocol/openid-connect/certs
          issuer-uri: ${KEYCLOAK_ISSUER:${KEYCLOAK_URL:http://localhost:8080}/realms/${KEYCLOAK_REALM:impilo}}

telemonitoring:
  outbox:
    poll-interval-ms: 2000
  emit-mode: ${TELEMONITORING_EMIT_MODE:DUAL}
  enrolment:
    # OD-16 interim discriminator: OROS OrderType=OTHER orders whose ziboOrderCode
    # (or any items[].code) starts with this prefix are MONITORING enrolments.
    # The programme code is the remainder after the prefix, e.g.
    # TM-MON-HYPERTENSION -> programme HYPERTENSION.
    order-code-prefix: ${TELEMONITORING_ENROLMENT_ORDER_CODE_PREFIX:TM-MON}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    tags:
      application: telemonitoring-service

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
