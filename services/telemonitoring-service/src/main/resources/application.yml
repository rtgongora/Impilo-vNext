server:
  port: ${SERVER_PORT:8394}
  servlet:
    context-path: /

spring:
  application:
    name: telemonitoring-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:telemonitoring}
    username: ${POSTGRES_USER:impilo}
    password: ${POSTGRES_PASSWORD:changeme}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: telemonitoring
  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: telemonitoring
    baseline-on-migrate: true
    # This service's migration numbers are leased in per-lane bands (see
    # docs/registry/iatg-*-leases.md), so a lane routinely merges a migration
    # numerically BELOW one another lane has already applied. Flyway's default
    # refuses exactly those, and silently: the service boots green with the table
    # missing. Live-proven on pct 2026-07-26 — V106 was in the jar, the service was
    # healthy, zero errors, and six tables had never been created.
    #
    # What this does NOT license: a migration in one band may never DEPEND ON an
    # object owned by a higher band. Out-of-order only relaxes ordering on a database
    # where the higher number has ALREADY applied; a fresh database still applies
    # strictly ascending, so a cross-band dependency boots fine here and fails on
    # every new environment. Lease law forbids it for that reason.
    out-of-order: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:${KAFKA_BOOTSTRAP:localhost:9092}}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      retries: 3
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
    consumer:
      group-id: telemonitoring-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${KEYCLOAK_URL:http://localhost:8080}/realms/${KEYCLOAK_REALM:impilo}/protocol/openid-connect/certs
          issuer-uri: ${KEYCLOAK_ISSUER:${KEYCLOAK_URL:http://localhost:8080}/realms/${KEYCLOAK_REALM:impilo}}

telemonitoring:
  outbox:
    poll-interval-ms: 2000
  emit-mode: ${TELEMONITORING_EMIT_MODE:DUAL}
  # PCT generic task lane (POST /v1/tasks) — CHW/care-team tasks on plan activation (OF-B21).
  # Best-effort push; the durable seam is telemonitoring.plan.task_requested.v1.
  pct:
    base-url: ${PCT_SERVICE_URL:http://pct-service:8088}
    timeout-ms: 4000
  # Review-cadence sweep (OF-B21): emits telemonitoring.plan.review_due.v1 when
  # now > last_review + cadence. Default every 5 minutes.
  review-sweep:
    interval-ms: ${TELEMONITORING_REVIEW_SWEEP_INTERVAL_MS:300000}
  # Rung-11+ Daidzai EMS seam (OF-B26, §14.7): POST /internal/v1/daidzai/incidents.
  # Best-effort push; the durable seam is telemonitoring.alert.escalated.v1.
  daidzai:
    base-url: ${DAIDZAI_SERVICE_URL:http://daidzai-service:8392}
    timeout-ms: 4000
  # OF-B26 sweeps: device-offline heartbeat (trigger 8, journey #65) every 15 min;
  # overdue-acknowledgement escalation (§14.6 escalation-on-silence) every minute.
  alert:
    offline-sweep-interval-ms: ${TELEMONITORING_ALERT_OFFLINE_SWEEP_INTERVAL_MS:900000}
    overdue-sweep-interval-ms: ${TELEMONITORING_ALERT_OVERDUE_SWEEP_INTERVAL_MS:60000}
  enrolment:
    # OD-16 interim discriminator: OROS OrderType=OTHER orders whose ziboOrderCode
    # (or any items[].code) starts with this prefix are MONITORING enrolments.
    # The programme code is the remainder after the prefix, e.g.
    # TM-MON-HYPERTENSION -> programme HYPERTENSION.
    order-code-prefix: ${TELEMONITORING_ENROLMENT_ORDER_CODE_PREFIX:TM-MON}
  integration:
    # Single designated SHR writer seam (OF-B25, §14.5 step 14):
    # telemonitoring -> fhir-gateway POST /internal/v1/gateway/forward -> BUTANO.
    fhir-gateway-url: ${FHIR_GATEWAY_URL:http://fhir-gateway-service:8091}
  shr:
    # Bounded write-retry ledger (honesty law): after this many failed forward
    # attempts a reading parks EXHAUSTED — visible, never silently absorbed.
    max-write-attempts: ${TELEMONITORING_SHR_MAX_WRITE_ATTEMPTS:5}
    retry-sweep-interval-ms: ${TELEMONITORING_SHR_RETRY_SWEEP_INTERVAL_MS:60000}
    # Optional metric_code -> "system|code|display" overrides for the Observation
    # coding map (MetricCodeRegistry); unknown metrics fall back to the honest
    # local code system rather than a guessed LOINC code.
    metric-codes: {}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    tags:
      application: telemonitoring-service

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
