server:
  port: ${SERVER_PORT:8330}

spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:}
  application:
    name: iot-ingestion-service

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:impilo_iot_ingestion}
    username: ${DB_USER:impilo}
    password: ${DB_PASS:impilo}

  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate.dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

impilo:
  companion:
    enabled: true
  telemetry:
    kafka:
      enabled: ${TELEMETRY_KAFKA_ENABLED:false}
      topic: ${TELEMETRY_KAFKA_TOPIC:impilo.iot.telemetry.device.raw}
      group-id: ${TELEMETRY_KAFKA_GROUP:iot-ingestion-telemetry-cg}
