replicaCount: 1

image:
  repository: ghcr.io/mohcc/impilo/pct
  tag: "latest"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8088

containerPort: 8088

env:
  # -- PostgreSQL --
  SPRING_DATASOURCE_URL: jdbc:postgresql://postgresql:5432/pct
  SPRING_DATASOURCE_USERNAME: impilo
  SPRING_DATASOURCE_PASSWORD: impilo
  SPRING_JPA_HIBERNATE_DDL_AUTO: validate
  SPRING_FLYWAY_ENABLED: "true"

  # -- Kafka --
  SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  SPRING_KAFKA_CONSUMER_GROUP_ID: pct-service

  # -- Redis --
  SPRING_DATA_REDIS_HOST: redis
  SPRING_DATA_REDIS_PORT: "6379"

  # -- Keycloak --
  SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: http://keycloak:8080/realms/impilo
  SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://keycloak:8080/realms/impilo/protocol/openid-connect/certs

  # -- Service config --
  SERVER_PORT: "8088"
  PCT_TELEMED_EXTERNAL_ENABLED: "true"
  PCT_TELEMED_EXTERNAL_BASE_URL: http://rtc-gateway:8195
  PCT_TELEMED_EXTERNAL_SESSION_PATH: /internal/v1/rtc/sessions
  PCT_TELEMED_FALLBACK_TO_MANAGED_PRIMARY: "false"
  PCT_TELEMED_REQUIRE_CONSENT_REFERENCE_FOR_MEDIA: "true"
  PCT_TELEMED_ALLOW_EMERGENCY_WITHOUT_CONSENT: "true"

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: 1000m
    memory: 1Gi

livenessProbe:
  httpGet:
    path: /actuator/health/liveness
    port: 8088
  initialDelaySeconds: 30
  periodSeconds: 10
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /actuator/health/readiness
    port: 8088
  initialDelaySeconds: 20
  periodSeconds: 5
  failureThreshold: 3

ingress:
  enabled: false

autoscaling:
  enabled: false
