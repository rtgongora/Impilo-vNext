server:
  port: 8088
  servlet:
    context-path: /

spring:
  application:
    name: pct-service
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/pct
    username: ${POSTGRES_USER:impilo}
    password: ${POSTGRES_PASSWORD:changeme}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: pct
  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: pct
    default-schema: pct
    create-schemas: true
    baseline-on-migrate: true
    validate-on-migrate: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      group-id: pct-service
      auto-offset-reset: earliest
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER:http://localhost:8080/realms/impilo}

# --- Actuator & Metrics ---
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: pct-service

# --- OpenAPI / Swagger ---
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

# --- PCT-specific ---
pct:
  outbox:
    poll-interval-ms: 2000
    dual-emit-canonical-enabled: ${PCT_OUTBOX_DUAL_EMIT_CANONICAL_ENABLED:false}
    dual-emit-core-transaction-enabled: ${PCT_OUTBOX_DUAL_EMIT_CORE_TRANSACTION_ENABLED:true}
    core-transaction-topic: ${PCT_OUTBOX_CORE_TRANSACTION_TOPIC:core.transaction.events}
    canonical-topics:
      journey-completed: ${PCT_OUTBOX_CANONICAL_TOPIC_JOURNEY_COMPLETED:clinical.pct.journey.completed}
      encounter-completed: ${PCT_OUTBOX_CANONICAL_TOPIC_ENCOUNTER_COMPLETED:clinical.pct.encounter.completed}
      death-recorded: ${PCT_OUTBOX_CANONICAL_TOPIC_DEATH_RECORDED:clinical.pct.death.recorded}
  queue:
    default-sla-minutes: 30
  discharge:
    require-payment-clearance: true
  telemedicine:
    provider:
      external:
        enabled: ${PCT_TELEMED_EXTERNAL_ENABLED:false}
        base-url: ${PCT_TELEMED_EXTERNAL_BASE_URL:}
        session-path: ${PCT_TELEMED_EXTERNAL_SESSION_PATH:/v1/sessions}
        api-key: ${PCT_TELEMED_EXTERNAL_API_KEY:}
      fallback:
        allow-managed-primary-fallback: ${PCT_TELEMED_FALLBACK_TO_MANAGED_PRIMARY:false}
      governance:
        require-consent-reference-for-media: ${PCT_TELEMED_REQUIRE_CONSENT_REFERENCE_FOR_MEDIA:true}
        allow-emergency-without-consent: ${PCT_TELEMED_ALLOW_EMERGENCY_WITHOUT_CONSENT:true}
