server:
  port: 8088
  servlet:
    context-path: /

spring:
  application:
    name: pct-service
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/pct
    username: ${POSTGRES_USER:impilo}
    password: ${POSTGRES_PASSWORD:changeme}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: pct
  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: pct
    default-schema: pct
    create-schemas: true
    baseline-on-migrate: true
    validate-on-migrate: false
    # pct-service is written by six programmes at once, and each holds a reserved *band* of
    # migration numbers (RMNP V058-V069 AND V430-V459, Emergency V070-V099 + V200s, Adult Medicine
    # V100-V129, Surgery V300-V329, Paediatrics V400-V429 — the lease files are authoritative and
    # this list is a summary, see docs/registry/iatg-*-leases.md). Bands mean
    # a lane routinely adds a migration numerically BELOW one another lane has already applied.
    #
    # Flyway's default refuses those as out of order. With validate-on-migrate off it does not
    # even complain — it just never runs them. Proven on the preview estate 2026-07-26:
    # V106__structured_history was present in the jar, the service booted green with zero errors,
    # and pct_structured_history was never created. Green service, merged code, missing table.
    #
    # The band convention cannot work without this. Turning it off again silently un-ships every
    # migration whose number is below the current maximum.
    #
    # What this does NOT license: a migration in one band may never depend on a migration in
    # another. Lease law forbids it (it is why Adult Medicine's V101 deliberately carries no
    # foreign key to emergency_episode), and the reason is that out-of-order only relaxes ordering
    # on a database where the higher number has *already* applied. A fresh database still applies
    # strictly ascending, so a cross-band dependency boots fine on the estate and fails on every
    # new environment — the worst possible place to find it.
    out-of-order: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      group-id: pct-service
      auto-offset-reset: earliest
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER:http://localhost:8080/realms/impilo}

# --- Actuator & Metrics ---
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: pct-service

# --- OpenAPI / Swagger ---
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

# --- PCT-specific ---
pct:
  outbox:
    poll-interval-ms: 2000
    dual-emit-canonical-enabled: ${PCT_OUTBOX_DUAL_EMIT_CANONICAL_ENABLED:false}
    dual-emit-core-transaction-enabled: ${PCT_OUTBOX_DUAL_EMIT_CORE_TRANSACTION_ENABLED:true}
    core-transaction-topic: ${PCT_OUTBOX_CORE_TRANSACTION_TOPIC:core.transaction.events}
    canonical-topics:
      journey-completed: ${PCT_OUTBOX_CANONICAL_TOPIC_JOURNEY_COMPLETED:clinical.pct.journey.completed}
      encounter-completed: ${PCT_OUTBOX_CANONICAL_TOPIC_ENCOUNTER_COMPLETED:clinical.pct.encounter.completed}
      death-recorded: ${PCT_OUTBOX_CANONICAL_TOPIC_DEATH_RECORDED:clinical.pct.death.recorded}
  queue:
    default-sla-minutes: 30
  discharge:
    require-payment-clearance: true
  telemedicine:
    provider:
      # Set to RTC_GATEWAY to run consults on self-hosted LiveKit via rtc-gateway (same media path as Khuluma).
      default-provider-type: ${PCT_TELEMED_DEFAULT_PROVIDER:MANAGED_PRIMARY}
      rtc-gateway:
        base-url: ${RTC_GATEWAY_BASE_URL:http://localhost:8195}
      external:
        enabled: ${PCT_TELEMED_EXTERNAL_ENABLED:false}
        base-url: ${PCT_TELEMED_EXTERNAL_BASE_URL:}
        session-path: ${PCT_TELEMED_EXTERNAL_SESSION_PATH:/v1/sessions}
        api-key: ${PCT_TELEMED_EXTERNAL_API_KEY:}
      fallback:
        allow-managed-primary-fallback: ${PCT_TELEMED_FALLBACK_TO_MANAGED_PRIMARY:false}
      governance:
        require-consent-reference-for-media: ${PCT_TELEMED_REQUIRE_CONSENT_REFERENCE_FOR_MEDIA:true}
        allow-emergency-without-consent: ${PCT_TELEMED_ALLOW_EMERGENCY_WITHOUT_CONSENT:true}
  integration:
    live:
      enabled: ${PCT_LIVE_INTEGRATION_ENABLED:true}
      base-url: ${PCT_LIVE_BASE_URL:http://localhost:8380}
  emergency:
    # W19 — episode invalidation hints over realtime-gateway (off by default)
    realtime-enabled: ${PCT_EMERGENCY_REALTIME_ENABLED:false}
    realtime-topic: ${PCT_EMERGENCY_REALTIME_TOPIC:pct:emergency:realtime}
    realtime-redis-enabled: ${PCT_EMERGENCY_REALTIME_REDIS_ENABLED:true}
  confidentiality:
    # W14-D preview flip (PO 2026-07-31): stamp SPECIALLY_PROTECTED when policy decides protection.
    # V438 backfills existing category-stamped rows. Set false to revert to shadow category-only.
    stamp-class: ${PCT_CONFIDENTIALITY_STAMP_CLASS:true}
