server:
  port: 0

spring:
  datasource:
    url: "jdbc:h2:mem:fhir_gw_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;INIT=CREATE SCHEMA IF NOT EXISTS fhir_gateway\\;SET SCHEMA fhir_gateway\\;CREATE TABLE IF NOT EXISTS fhir_gateway.idempotency_keys (tenant_id VARCHAR(255) NOT NULL,pod_id VARCHAR(255) NOT NULL,idempotency_key VARCHAR(255) NOT NULL,request_hash VARCHAR(512) NOT NULL,response_status INT NOT NULL,response_body CLOB NOT NULL,created_at TIMESTAMP NOT NULL DEFAULT CURRENT_TIMESTAMP,expires_at TIMESTAMP NULL,PRIMARY KEY(tenant_id,pod_id,idempotency_key))"
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false
  kafka:
    bootstrap-servers: localhost:9092
    listener:
      auto-startup: false

impilo:
  security:
    disable-oauth-for-tests: true
  companion:
    enabled: true

fhir-gateway:
  outbox:
    poll-interval-ms: 60000
