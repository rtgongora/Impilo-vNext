server:
  port: 0

spring:
  datasource:
    url: jdbc:h2:mem:fhir_gw_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;INIT=CREATE SCHEMA IF NOT EXISTS fhir_gateway\;SET SCHEMA fhir_gateway
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false
  kafka:
    bootstrap-servers: localhost:9092
    listener:
      auto-startup: false

impilo:
  security:
    disable-oauth-for-tests: true
  companion:
    enabled: true

fhir-gateway:
  outbox:
    poll-interval-ms: 60000
