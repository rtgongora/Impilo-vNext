server:
  port: ${SERVER_PORT:8091}
  servlet:
    context-path: /

spring:
  application:
    name: fhir-gateway
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/fhir_gateway
    username: ${POSTGRES_USER:impilo}
    password: ${POSTGRES_PASSWORD:changeme}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: fhir_gateway
  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: fhir_gateway
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${KEYCLOAK_URL:http://localhost:8080}/realms/${KEYCLOAK_REALM:impilo}/protocol/openid-connect/certs
          issuer-uri: ${KEYCLOAK_URL:http://localhost:8080}/realms/${KEYCLOAK_REALM:impilo}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      # Values would be pre-serialized JSON strings (outbox house style) — a
      # JsonSerializer double-encodes. No producer exists in this service today;
      # StringSerializer keeps a future KafkaTemplate<String,String> from silently
      # double-encoding (the 064b83204 failure class).
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      group-id: fhir-gateway
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      enable-auto-commit: false
      properties:
        isolation.level: read_committed
    listener:
      ack-mode: record

fhir-gateway:
  outbox:
    poll-interval-ms: 2000
  consent:
    base-url: ${CONSENT_SERVICE_BASE_URL:http://localhost:8182}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  metrics:
    tags:
      application: fhir-gateway
