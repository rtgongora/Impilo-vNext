server:
  port: ${SERVER_PORT:8091}
  servlet:
    context-path: /

spring:
  application:
    name: fhir-gateway
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/fhir_gateway
    username: ${POSTGRES_USER:impilo}
    password: ${POSTGRES_PASSWORD:changeme}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: fhir_gateway
  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: fhir_gateway
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${KEYCLOAK_URL:http://localhost:8080}/realms/${KEYCLOAK_REALM:impilo}/protocol/openid-connect/certs
          issuer-uri: ${KEYCLOAK_URL:http://localhost:8080}/realms/${KEYCLOAK_REALM:impilo}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      # Values would be pre-serialized JSON strings (outbox house style) — a
      # JsonSerializer double-encodes. No producer exists in this service today;
      # StringSerializer keeps a future KafkaTemplate<String,String> from silently
      # double-encoding (the 064b83204 failure class).
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      group-id: fhir-gateway
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      enable-auto-commit: false
      properties:
        isolation.level: read_committed
    listener:
      ack-mode: record

# Rate-limit headroom for a machine-to-machine fan-in point.
#
# shared-core's RateLimitFilter defaults to 100 tokens refilling at 2/s, keyed by x-actor-id. Those
# are sensible for a user-facing API and wrong for this one: every governed FHIR write in the estate
# funnels through /internal/v1/gateway/forward, and a single lab result writes ONE OBSERVATION PER
# ANALYTE -- a full blood count is 20+ forwards in a burst, before any retry sweep. At 2/s sustained,
# oros alone would be throttled by its own normal output.
#
# The 429 is also invisible where it matters: it is returned to the CALLER of /forward, so
# FhirForwarder never sees it and the caller reports UNREACHABLE. A throttle would look like an
# outage. P5 routes four more services through here, so this is raised before they arrive rather
# than after the first burst.
#
# Still per-actor, so a misbehaving service is bounded to its own bucket.
impilo:
  security:
    rate-limit:
      max-tokens: 2000
      refill-per-second: 100

fhir-gateway:
  outbox:
    poll-interval-ms: 2000
  consent:
    base-url: ${CONSENT_SERVICE_BASE_URL:http://localhost:8182}
  # Environment-wide default FHIR base for resources with no explicit fhir_route row
  # (http://butano-service:8090/fhir — the SHR). Empty preserves strict NO_ROUTE behaviour;
  # per-tenant route rows always override. Lets governed FHIR writes work with one config value
  # instead of a route row per (tenant × resource type).
  #
  # fhir_route is empty in every environment measured, so in practice this value is not a
  # fallback — it is THE delivery target for every forward the gateway serves. Point it only at
  # a governed store: the consent PEP above runs in this service, and whatever it decides is
  # then handed, unaltered, to whatever this names.
  default-target-base: ${FHIR_GATEWAY_DEFAULT_TARGET_BASE:}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  metrics:
    tags:
      application: fhir-gateway
