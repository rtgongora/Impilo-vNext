spring:
  datasource:
    url: jdbc:h2:mem:msika_flow_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false
  kafka:
    bootstrap-servers: localhost:9092
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8080/realms/impilo

msika-flow:
  outbox:
    poll-interval-ms: 100
  integration:
    msika-core-url: http://localhost:18086
    mushex-url: http://localhost:18087
    tuso-url: http://localhost:18084
    varapi-url: http://localhost:18083
    oros-url: http://localhost:18089
    inventory-url: http://localhost:18098
    vashandi-url: http://localhost:18167
  marketplace:
    sweep-interval-ms: 3600000
impilo:
  security:
    disable-oauth-for-tests: true
