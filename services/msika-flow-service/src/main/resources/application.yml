server:
  port: ${SERVER_PORT:8100}
  servlet:
    context-path: /

spring:
  application:
    name: msika-flow-service
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/msika_flow
    username: ${POSTGRES_USER:impilo}
    password: ${POSTGRES_PASSWORD:changeme}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      group-id: msika-flow-service
      auto-offset-reset: earliest
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER:http://localhost:8080/realms/impilo}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: msika-flow-service

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

msika-flow:
  outbox:
    poll-interval-ms: 2000
    dual-emit-core-transaction-enabled: ${MSIKA_FLOW_OUTBOX_DUAL_EMIT_CORE_TRANSACTION_ENABLED:true}
    core-transaction-topic: ${MSIKA_FLOW_OUTBOX_CORE_TRANSACTION_TOPIC:core.transaction.events}
  pickup:
    otp-length: 6
    expiry-hours: 48
    max-claim-attempts-per-hour: 5
  biometric-policy:
    enabled: ${MSIKA_FLOW_BIOMETRIC_POLICY_ENABLED:false}
    tshepo-base-url: ${TSHEPO_AUTHZ_BASE_URL:http://localhost:8081}
  routing:
    default-mode: INTERNAL
  pricing:
    platform-fee-rate: "0.015"
    platform-fee-cap: "50.00"
  payments:
    # Rig/preview escape hatch for MusheX's provider-credential gate; MUST stay false in production.
    simulation-metadata: ${MSIKA_FLOW_PAYMENTS_SIMULATION_METADATA:false}
  fulfillment:
    # Nhume is dispatch SoR for delivery-mode orders; disabling (or a failed call) falls
    # back to the manual out-for-delivery / mark-delivered recovery endpoints.
    nhume-enabled: ${MSIKA_FLOW_NHUME_ENABLED:true}
  integration:
    msika-core-url: ${MSIKA_CORE_URL:http://localhost:8086}
    msika-base-url: ${MSIKA_BASE_URL:http://msika-service:8086}
    mushex-url: ${MUSHEX_URL:http://localhost:8102}
    tuso-url: ${TUSO_URL:http://localhost:8084}
    varapi-url: ${VARAPI_URL:http://localhost:8083}
    nhume-url: ${NHUME_URL:http://nhume-service:8210}
    share-slip-url: ${SHARE_SLIP_URL:http://localhost:8104}
    oros-url: ${OROS_URL:http://oros-service:8089}
    inventory-url: ${INVENTORY_URL:http://inventory-service:8098}
    vashandi-url: ${VASHANDI_URL:http://vashandi-workforce-service:8167}
  marketplace:
    # OF-B4/OF-B6 RFO windows and TTLs (§9.3/§9.4 timers)
    offer-window-minutes: ${MSIKA_FLOW_MARKETPLACE_OFFER_WINDOW_MINUTES:120}
    selection-window-minutes: ${MSIKA_FLOW_MARKETPLACE_SELECTION_WINDOW_MINUTES:120}
    default-offer-ttl-minutes: ${MSIKA_FLOW_MARKETPLACE_DEFAULT_OFFER_TTL_MINUTES:60}
    default-fulfillment-window-hours: ${MSIKA_FLOW_MARKETPLACE_DEFAULT_FULFILLMENT_WINDOW_HOURS:24}
    # OF-B1 version-pin verification against OROS at request creation (fail-closed)
    verify-order-version: ${MSIKA_FLOW_MARKETPLACE_VERIFY_ORDER_VERSION:true}
    sweep-interval-ms: ${MSIKA_FLOW_MARKETPLACE_SWEEP_INTERVAL_MS:60000}
  analytics:
    # OF-B29 Wave OF-D — anomaly + fairness sweep thresholds (§13.3/§13.7/§21).
    # Deterministic rule + threshold monitors; findings dedup so re-runs are safe.
    sweep-interval-ms: ${MSIKA_FLOW_ANALYTICS_SWEEP_INTERVAL_MS:300000}
    claim-ttl-hours: ${MSIKA_FLOW_ANALYTICS_CLAIM_TTL_HOURS:72}
    stall-window-hours: ${MSIKA_FLOW_ANALYTICS_STALL_WINDOW_HOURS:48}
    repeat-win-threshold: ${MSIKA_FLOW_ANALYTICS_REPEAT_WIN_THRESHOLD:3}
    repeat-window-hours: ${MSIKA_FLOW_ANALYTICS_REPEAT_WINDOW_HOURS:24}
    reservation-grace-minutes: ${MSIKA_FLOW_ANALYTICS_RESERVATION_GRACE_MINUTES:60}
    concentration-window-hours: ${MSIKA_FLOW_ANALYTICS_CONCENTRATION_WINDOW_HOURS:168}
    concentration-threshold: ${MSIKA_FLOW_ANALYTICS_CONCENTRATION_THRESHOLD:0.50}
    concentration-min-volume: ${MSIKA_FLOW_ANALYTICS_CONCENTRATION_MIN_VOLUME:10}
    ranking-audit-lookback-hours: ${MSIKA_FLOW_ANALYTICS_RANKING_AUDIT_LOOKBACK_HOURS:72}
    no-offer-rate-threshold: ${MSIKA_FLOW_ANALYTICS_NO_OFFER_RATE_THRESHOLD:0.50}
    no-offer-min-requests: ${MSIKA_FLOW_ANALYTICS_NO_OFFER_MIN_REQUESTS:5}
    no-offer-window-hours: ${MSIKA_FLOW_ANALYTICS_NO_OFFER_WINDOW_HOURS:168}
