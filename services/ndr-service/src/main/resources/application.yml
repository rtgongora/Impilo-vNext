server:
  port: ${SERVER_PORT:8232}

spring:
  application:
    name: ndr-service
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/impilo_ndr
    username: ${POSTGRES_USER:impilo}
    password: ${POSTGRES_PASSWORD:impilo}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${KEYCLOAK_URL:http://localhost:8080}/realms/${KEYCLOAK_REALM:impilo}/protocol/openid-connect/certs
          issuer-uri: ${KEYCLOAK_URL:http://localhost:8080}/realms/${KEYCLOAK_REALM:impilo}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    tags:
      application: ndr-service

ndr:
  governance:
    base-url: ${NDR_GOVERNANCE_BASE_URL:http://localhost:8220}
  # De-identification engine (data-governance-service) that powers the released zone.
  deid:
    base-url: ${NDR_DEID_BASE_URL:http://localhost:8220}
  # Released-zone build. The scheduler is opt-in and OFF by default so tests / preview
  # never auto-run a de-identification build; trigger builds via
  # POST /internal/v1/ndr/release/{datasetRef} instead.
  release:
    scheduler:
      enabled: ${NDR_RELEASE_SCHEDULER_ENABLED:false}
      cron: ${NDR_RELEASE_SCHEDULER_CRON:0 0 3 * * *}
      tenant-id: ${NDR_RELEASE_SCHEDULER_TENANT_ID:}
      datasets: ${NDR_RELEASE_SCHEDULER_DATASETS:}

impilo:
  companion:
    enabled: true
