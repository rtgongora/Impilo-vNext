server:
  port: ${SERVER_PORT:8210}

spring:
  application:
    name: data-ingestion-service
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/impilo_data_ingestion
    username: ${POSTGRES_USER:impilo}
    password: ${POSTGRES_PASSWORD:impilo}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${KEYCLOAK_URL:http://localhost:8080}/realms/${KEYCLOAK_REALM:impilo}/protocol/openid-connect/certs
          issuer-uri: ${KEYCLOAK_URL:http://localhost:8080}/realms/${KEYCLOAK_REALM:impilo}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    tags:
      application: data-ingestion-service

ingestion:
  kafka:
    topic-pattern: ${INGESTION_TOPIC_PATTERN:impilo\..*}
    group-id: ${INGESTION_GROUP_ID:data-ingestion-service}
    max-poll-records: ${INGESTION_MAX_POLL_RECORDS:100}

impilo:
  companion:
    enabled: true
