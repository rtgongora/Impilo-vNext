server:
  port: ${SERVER_PORT:8210}

spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:}
  application:
    name: data-ingestion-service
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/impilo_data_ingestion
    username: ${POSTGRES_USER:impilo}
    password: ${POSTGRES_PASSWORD:impilo}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

ingestion:
  kafka:
    topic-pattern: ${INGESTION_TOPIC_PATTERN:impilo\..*}
    group-id: ${INGESTION_GROUP_ID:data-ingestion-service}
    max-poll-records: ${INGESTION_MAX_POLL_RECORDS:100}

impilo:
  companion:
    enabled: true
