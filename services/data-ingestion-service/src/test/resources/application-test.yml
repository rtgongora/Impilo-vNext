spring:
  datasource:
    url: jdbc:h2:mem:data_ingestion_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false
  kafka:
    listener:
      auto-startup: false

impilo:
  companion:
    enabled: true
  security:
    # MockMvc tests do not send JWTs; keep TrustContextFilter + companion filters, skip OAuth2 RS.
    disable-oauth-for-tests: true
