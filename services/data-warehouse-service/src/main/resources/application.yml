server:
  port: ${SERVER_PORT:8233}

spring:
  application:
    name: data-warehouse-service
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/impilo_data_warehouse
    username: ${POSTGRES_USER:impilo}
    password: ${POSTGRES_PASSWORD:impilo}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${KEYCLOAK_URL:http://localhost:8080}/realms/${KEYCLOAK_REALM:impilo}/protocol/openid-connect/certs
          issuer-uri: ${KEYCLOAK_URL:http://localhost:8080}/realms/${KEYCLOAK_REALM:impilo}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    tags:
      application: data-warehouse-service

impilo:
  companion:
    enabled: true

warehouse:
  materializer:
    cron: "${MATERIALIZER_CRON:0 */5 * * * *}"
    batch-size: ${MATERIALIZER_BATCH_SIZE:500}
  bronze:
    datasource-url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/impilo_data_ingestion
