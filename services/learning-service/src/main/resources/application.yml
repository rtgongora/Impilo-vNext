server:
  port: ${SERVER_PORT:8235}

spring:
  application:
    name: learning-service
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${KEYCLOAK_URL:http://localhost:8080}/realms/${KEYCLOAK_REALM:impilo}/protocol/openid-connect/certs
          issuer-uri: ${KEYCLOAK_ISSUER:${KEYCLOAK_URL:http://localhost:8080}/realms/${KEYCLOAK_REALM:impilo}}
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/impilo_learning
    username: ${POSTGRES_USER:impilo}
    password: ${POSTGRES_PASSWORD:impilo}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    tags:
      application: learning-service

learning:
  security:
    oauth2-enabled: ${LEARNING_SECURITY_OAUTH2_ENABLED:true}
  fundo:
    public-base-url: ${FUNDO_PUBLIC_BASE_URL:https://fundo.impilo.local}
    wantsurl-login-enabled: ${FUNDO_WANTSURL_LOGIN_ENABLED:false}
    login-path: ${FUNDO_LOGIN_PATH:/login/index.php}
    launch-mode: ${FUNDO_LAUNCH_MODE:DIRECT}
    launch-url-template: ${FUNDO_LAUNCH_URL_TEMPLATE:}
  moodle:
    ws-token: ${MOODLE_WS_TOKEN:}
    ws-endpoint-url: ${MOODLE_WS_ENDPOINT_URL:}
  integration:
    varapi-internal-key: ${VARAPI_TO_LEARNING_INTERNAL_KEY:}
    orchestration-internal-key: ${LEARNING_ORCHESTRATION_INTERNAL_KEY:}
    live:
      enabled: ${LEARNING_LIVE_INTEGRATION_ENABLED:true}
      base-url: ${LEARNING_LIVE_BASE_URL:http://localhost:8380}
  outbox:
    publisher:
      # Phase 2: transactional outbox → Kafka publisher (mirrors pct-service).
      # Default true to match platform pattern; override to false in dev/integration where Kafka is unavailable.
      enabled: ${LEARNING_OUTBOX_PUBLISHER_ENABLED:true}
      poll-interval-ms: ${LEARNING_OUTBOX_POLL_INTERVAL_MS:500}
      batch-size: ${LEARNING_OUTBOX_BATCH_SIZE:100}
    topics:
      default: ${LEARNING_OUTBOX_DEFAULT_TOPIC:platform.learning.events}
  events:
    legacy-emission-enabled: ${LEARNING_EVENTS_LEGACY_EMISSION_ENABLED:true}
  lifecycle:
    certificate:
      # Scheduled renewal/refresher/expiry sweep. Default true; disable where the
      # outbox/scheduler is unwanted (e.g. read-only replicas).
      enabled: ${LEARNING_CERT_LIFECYCLE_ENABLED:true}
      refresher-lead-days: ${LEARNING_CERT_REFRESHER_LEAD_DAYS:30}
      initial-delay-ms: ${LEARNING_CERT_LIFECYCLE_INITIAL_DELAY_MS:60000}
      poll-interval-ms: ${LEARNING_CERT_LIFECYCLE_POLL_INTERVAL_MS:3600000}
  notifications:
    # Honest provider-agnostic Fundo notification adapter. The default STUB provider
    # records delivery intent WITHOUT contacting any channel (status RECORDED, never
    # SENT). Set provider=NOTIFICATION_SERVICE + notification-base-url to deliver via
    # the platform comms hub (notification-service POST /internal/v1/notify).
    dispatch:
      enabled: ${LEARNING_NOTIFICATION_DISPATCH_ENABLED:true}
      provider: ${LEARNING_NOTIFICATION_PROVIDER:STUB}
      notification-base-url: ${LEARNING_NOTIFICATION_BASE_URL:}
      initial-delay-ms: ${LEARNING_NOTIFICATION_DISPATCH_INITIAL_DELAY_MS:90000}
      poll-interval-ms: ${LEARNING_NOTIFICATION_DISPATCH_POLL_MS:300000}
      batch-size: ${LEARNING_NOTIFICATION_DISPATCH_BATCH:100}

impilo:
  companion:
    enabled: true
  ops:
    enabled: true
    outbox-table: lrn_event_outbox
