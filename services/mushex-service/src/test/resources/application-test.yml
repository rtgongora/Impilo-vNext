impilo:
  security:
    disable-oauth-for-tests: true
  services:
    credential-payee-verification-enabled: false

spring:
  datasource:
    url: jdbc:h2:mem:mushex_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false
  kafka:
    bootstrap-servers: localhost:9092
    listener:
      ack-mode: manual
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8080/realms/impilo
  data:
    redis:
      host: localhost
      port: 6379

mushex:
  outbox:
    poll-interval-ms: 60000
  currency: USD
  hmac-pepper: test-pepper
  remittance:
    otp-length: 6
    expiry-minutes: 60
    max-claims-per-token: 1
    rate-limit-per-minute: 100
