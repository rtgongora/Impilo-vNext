server:
  port: ${SERVER_PORT:8102}

spring:
  application:
    name: mushex-service

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/mushex_db
    username: ${POSTGRES_USER:impilo}
    password: ${POSTGRES_PASSWORD:changeme}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      retries: 3
    consumer:
      group-id: mushex-service
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest
      enable-auto-commit: false
    listener:
      ack-mode: manual

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${KEYCLOAK_URL:http://localhost:8080}/realms/${KEYCLOAK_REALM:impilo}/protocol/openid-connect/certs
          issuer-uri: ${KEYCLOAK_URL:http://localhost:8080}/realms/${KEYCLOAK_REALM:impilo}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  metrics:
    tags:
      application: mushex-service

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

impilo:
  services:
    coverage-base-url: ${COVERAGE_BASE_URL:http://localhost:8140}
    credential-base-url: ${CREDENTIAL_BASE_URL:http://localhost:8094}
    credential-verification-base-url: ${CREDENTIAL_VERIFICATION_BASE_URL:http://localhost:8094}
    credential-verification-enabled: ${CREDENTIAL_VERIFICATION_ENABLED:true}
    credential-payee-verification-enabled: ${CREDENTIAL_PAYEE_VERIFICATION_ENABLED:true}
    mushe-wallet-base-url: ${MUSHE_WALLET_BASE_URL:http://localhost:8126}

mushex:
  outbox:
    poll-interval-ms: 2000
    batch-size: 100
  currency: USD
  hmac-pepper: ${MUSHEX_HMAC_PEPPER:mushex-dev-pepper-change-in-prod}
  remittance:
    otp-length: 6
    expiry-minutes: 60
    max-claims-per-token: 1
    rate-limit-per-minute: 5
  step-up:
    payout-release: true
    destination-change: true
    large-refund-threshold: 1000.00
    claim-override: true
    settlement-release: true
    cross-facility-dashboard: true
  adapters:
    sandbox:
      enabled: true
      simulate-delay-ms: 500
      bypass-credential-check-for-simulation: true
      apply-simulation-outcome-on-create: true
