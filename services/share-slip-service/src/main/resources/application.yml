server:
  port: ${SERVER_PORT:8104}
  servlet:
    context-path: /

spring:
  application:
    name: share-slip-service
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/share_slip
    username: ${POSTGRES_USER:impilo}
    password: ${POSTGRES_PASSWORD:changeme}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: share_slip
  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: share_slip
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_URL:http://localhost:8080}/realms/${KEYCLOAK_REALM:impilo}

# ---- Share Slip configuration ----

share-slip:
  otp:
    length: 6
    expiry-minutes: 15
    max-attempts: 3
  link:
    default-expiry-hours: 24
    max-expiry-hours: 168   # 7 days
  hmac:
    pepper: ${SHARE_SLIP_HMAC_PEPPER:changeme-not-for-production}
  landela:
    base-url: ${LANDELA_BASE_URL:http://localhost:8092}
  outbox:
    poll-interval-ms: 2000

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  metrics:
    tags:
      application: share-slip-service
