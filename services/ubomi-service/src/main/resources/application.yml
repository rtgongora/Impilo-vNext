server:
  port: 8087
  servlet:
    context-path: /

spring:
  application:
    name: ubomi-service
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/ubomi
    username: ${POSTGRES_USER:impilo}
    password: ${POSTGRES_PASSWORD:changeme}
    hikari:
      maximum-pool-size: 15
      minimum-idle: 5
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      # Values would be pre-serialized JSON strings (outbox house style) — a
      # JsonSerializer double-encodes. No producer exists in this service today;
      # StringSerializer keeps a future KafkaTemplate<String,String> from silently
      # double-encoding (the 064b83204 failure class).
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_URL:http://localhost:8080}/realms/${KEYCLOAK_REALM:impilo}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  metrics:
    tags:
      application: ubomi-service

# ---- UBOMI outbox publisher (W1a) ----
ubomi:
  outbox:
    poll-interval-ms: 2000
  # ---- Registrar-General / CRVS outbound adapter (X2, W1b/W1c) ----
  # Flag-gated OFF by default everywhere. With enabled=false ubomi gains NO RG
  # HTTP client bean. Enabling requires the non-code prerequisites in
  # docs/design/rg-crvs-outbound-adapter.md (data-sharing authority, RG API
  # spec, sandbox + mTLS material, field-mapping sign-off, go-live approval).
  rg:
    enabled: false
    base-url: ""
    allowed-hosts: []
    mtls:
      key-ref: ""
      truststore-ref: ""
    connect-timeout-ms: 2000
    read-timeout-ms: 5000
    pending-ttl-hours: 72
    reconcile-interval-ms: 60000
