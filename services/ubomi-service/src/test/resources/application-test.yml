# Auto-generated H2 test profile so the golden-contract @SpringBootTest boots
# offline (main profile uses PostgreSQL + Flyway with PG-specific migrations).
spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration
  datasource:
    url: "jdbc:h2:mem:ubomi_service;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;INIT=CREATE SCHEMA IF NOT EXISTS ubomi\\;SET SCHEMA ubomi"
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ""

impilo:
  security:
    disable-oauth-for-tests: true
