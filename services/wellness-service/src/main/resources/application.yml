server:
  port: ${SERVER_PORT:8161}

# Default: same DB as experience-bff (shared Flyway tables). Profile `wellness-own-db` uses a separate database
# (see application-wellness-own-db.yml and docs/runbooks/port-allocation.md).
spring:
  application:
    name: wellness-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:experience_bff}
    username: ${DB_USER:impilo}
    password: ${DB_PASSWORD:impilo}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    table: flyway_schema_history_wellness
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${KEYCLOAK_URL:http://localhost:8080}/realms/${KEYCLOAK_REALM:impilo}/protocol/openid-connect/certs
          issuer-uri: ${KEYCLOAK_URL:http://localhost:8080}/realms/${KEYCLOAK_REALM:impilo}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

impilo:
  security:
    allow-anonymous: ${WELLNESS_ALLOW_ANONYMOUS:false}

logging:
  level:
    zw.gov.mohcc.impilo: INFO
