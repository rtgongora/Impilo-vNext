server:
  port: ${SERVER_PORT:8392}
  servlet:
    context-path: /

spring:
  application:
    name: daidzai-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:daidzai}
    username: ${POSTGRES_USER:impilo}
    password: ${POSTGRES_PASSWORD:changeme}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: daidzai
  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: daidzai
    baseline-on-migrate: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:${KAFKA_BOOTSTRAP:localhost:9092}}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      retries: 3
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
    consumer:
      group-id: daidzai-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${KEYCLOAK_URL:http://localhost:8080}/realms/${KEYCLOAK_REALM:impilo}/protocol/openid-connect/certs
          issuer-uri: ${KEYCLOAK_ISSUER:${KEYCLOAK_URL:http://localhost:8080}/realms/${KEYCLOAK_REALM:impilo}}

daidzai:
  outbox:
    poll-interval-ms: 2000
  emit-mode: ${DAIDZAI_EMIT_MODE:DUAL}
  # Owner-routed seams (request/link only — Daidzai never owns these records).
  integration:
    nhume:
      base-url: ${NHUME_BASE_URL:http://localhost:8210}      # dispatch execution
    ndila:
      base-url: ${NDILA_BASE_URL:http://localhost:8155}      # maps/routing/nearest-service
    pct:
      base-url: ${PCT_BASE_URL:http://localhost:8088}        # emergency clinical encounter/handoff
    tuso:
      base-url: ${TUSO_BASE_URL:http://localhost:8084}       # facility readiness
    khuluma:
      base-url: ${KHULUMA_BASE_URL:http://localhost:8390}    # comms delivery
    rito:
      base-url: ${RITO_BASE_URL:http://localhost:8391}       # after-action review
    notification:
      base-url: ${NOTIFICATION_BASE_URL:http://localhost:8200}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    tags:
      application: daidzai-service

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
