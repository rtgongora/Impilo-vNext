server:
  port: ${SERVER_PORT:8079}
  servlet:
    context-path: /

spring:
  application:
    name: tshepo-service
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/tshepo
    username: ${POSTGRES_USER:impilo}
    password: ${POSTGRES_PASSWORD:changeme}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
  datasource-tuso:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/tuso
    username: ${POSTGRES_USER:impilo}
    password: ${POSTGRES_PASSWORD:changeme}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      pool-name: tuso-hikari
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      # Values are pre-serialized JSON strings (envelope/outbox payloads) — a
      # JsonSerializer would double-encode them into quoted string literals.
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_URL:http://localhost:8080}/realms/${KEYCLOAK_REALM:impilo}

# --- TSHEPO-specific ---
tshepo:
  learning:
    base-url: ${TSHEPO_LEARNING_SERVICE_BASE_URL:}
    relay-api-key: ${TSHEPO_LEARNING_RELAY_API_KEY:}
    platform-orchestration-key: ${LEARNING_ORCHESTRATION_INTERNAL_KEY:}
  council-regulatory:
    deny-by-default: ${TSHEPO_COUNCIL_REGULATORY_DENY_BY_DEFAULT:true}
  pepper: ${TSHEPO_PEPPER:changeme-generate-a-real-pepper}
  rate-limit:
    max-requests-per-minute: 120
    step-up-window-seconds: 300
  audit:
    kafka-topic: platform.audit.events

impilo:
  ops:
    enabled: true
    outbox-table: tshepo.event_outbox
  services:
    tuso:
      base-url: ${TUSO_SERVICE_URL:http://localhost:8084}
    governance:
      base-url: ${WORKFORCE_GOVERNANCE_SERVICE_URL:}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    tags:
      application: tshepo-service
