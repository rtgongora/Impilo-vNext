# TSHEPO — Test profile (H2 in PostgreSQL-compat mode, fully offline).
# Flyway is disabled (PostgreSQL-specific migrations); Hibernate ddl-auto
# builds the schema from entity metadata. Both datasources (tshepo + tuso
# read-side) point at in-memory H2.
spring:
  datasource:
    url: "jdbc:h2:mem:tshepo_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;INIT=CREATE SCHEMA IF NOT EXISTS tshepo\\;CREATE SCHEMA IF NOT EXISTS tuso\\;RUNSCRIPT FROM 'classpath:testdata/seed.sql'"
    username: sa
    password:
    driver-class-name: org.h2.Driver
  datasource-tuso:
    url: "jdbc:h2:mem:tshepo_tuso_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;INIT=CREATE SCHEMA IF NOT EXISTS tuso"
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ""
  kafka:
    listener:
      auto-startup: false
  data:
    redis:
      host: localhost
      port: 6379

impilo:
  security:
    disable-oauth-for-tests: true
