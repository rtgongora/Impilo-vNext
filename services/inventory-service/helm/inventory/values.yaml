replicaCount: 1

image:
  repository: ghcr.io/mohcc/impilo/inventory-service
  tag: "latest"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8098

containerPort: 8098

env:
  # -- PostgreSQL --
  SPRING_DATASOURCE_URL: jdbc:postgresql://postgresql:5432/inventory
  SPRING_DATASOURCE_USERNAME: impilo
  SPRING_DATASOURCE_PASSWORD: impilo
  SPRING_JPA_HIBERNATE_DDL_AUTO: validate
  SPRING_FLYWAY_ENABLED: "true"

  # -- Kafka --
  SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  SPRING_KAFKA_CONSUMER_GROUP_ID: inventory-service

  # -- Redis --
  SPRING_DATA_REDIS_HOST: redis
  SPRING_DATA_REDIS_PORT: "6379"

  # -- Keycloak --
  SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: http://keycloak:8080/realms/impilo
  SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://keycloak:8080/realms/impilo/protocol/openid-connect/certs

  # -- Service config --
  SERVER_PORT: "8098"

  # -- Inventory capability --
  INVENTORY_CAPABILITY_DEFAULT_MODE: INTERNAL
  INVENTORY_FEFO_ENABLED: "true"

  # -- Integration endpoints --
  INVENTORY_INTEGRATION_PHARMACY_BASE_URL: http://pharmacy-service:8096
  INVENTORY_INTEGRATION_OROS_BASE_URL: http://oros-service:8089
  INVENTORY_INTEGRATION_ZIBO_BASE_URL: http://zibo-service:8085
  INVENTORY_INTEGRATION_ELMIS_ADAPTER_BASE_URL: http://inventory-elmis-adapter:8099

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: 1000m
    memory: 1Gi

livenessProbe:
  httpGet:
    path: /actuator/health/liveness
    port: 8098
  initialDelaySeconds: 30
  periodSeconds: 10
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /actuator/health/readiness
    port: 8098
  initialDelaySeconds: 20
  periodSeconds: 5
  failureThreshold: 3

ingress:
  enabled: false

autoscaling:
  enabled: false
