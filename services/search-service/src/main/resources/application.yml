server:
  port: ${SERVER_PORT:8230}

spring:
  application:
    name: search-service
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${KEYCLOAK_URL:http://localhost:8080}/realms/${KEYCLOAK_REALM:impilo}/protocol/openid-connect/certs
          issuer-uri: ${KEYCLOAK_ISSUER:${KEYCLOAK_URL:http://localhost:8080}/realms/${KEYCLOAK_REALM:impilo}}
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/impilo_search
    username: ${POSTGRES_USER:impilo}
    password: ${POSTGRES_PASSWORD:impilo}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    tags:
      application: search-service

search:
  security:
    oauth2-enabled: true

impilo:
  companion:
    enabled: true
  ops:
    enabled: true
    outbox-table: ss_event_outbox
  search:
    embeddings:
      # off | hash (local deterministic) | http (OpenAI-compatible /v1/embeddings)
      provider: off
      hash-dimension: 128
      max-input-chars: 8192
      http:
        base-url: ${IMPILO_SEARCH_EMBEDDINGS_BASE_URL:}
        api-key: ${IMPILO_SEARCH_EMBEDDINGS_API_KEY:}
        path: /v1/embeddings
        model: text-embedding-3-small
    ranking:
      hybrid-cosine-weight: 0.55
    pgvector:
      # Corpus-wide ANN recall on PostgreSQL (requires Flyway V003 + CREATE EXTENSION vector).
      enabled: false
      dimensions: 1536
      ann-candidate-limit: 500
      merge-lexical-candidates: true
      merge-lexical-cap: 80
