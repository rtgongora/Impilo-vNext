server:
  port: 0

spring:
  datasource:
    url: jdbc:h2:mem:search_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false

impilo:
  security:
    disable-oauth-for-tests: true
  companion:
    enabled: true
  search:
    embeddings:
      provider: hash
      hash-dimension: 128

search:
  security:
