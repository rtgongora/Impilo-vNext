server:
  port: ${SERVER_PORT:8300}
  servlet:
    context-path: /

spring:
  application:
    name: madi-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:madi}
    username: ${POSTGRES_USER:impilo}
    password: ${POSTGRES_PASSWORD:changeme}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: madi
  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: madi
    baseline-on-migrate: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:${KAFKA_BOOTSTRAP:localhost:9092}}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      retries: 3
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
    consumer:
      group-id: madi-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${KEYCLOAK_URL:http://localhost:8080}/realms/${KEYCLOAK_REALM:impilo}/protocol/openid-connect/certs
          issuer-uri: ${KEYCLOAK_ISSUER:${KEYCLOAK_URL:http://localhost:8080}/realms/${KEYCLOAK_REALM:impilo}}

madi:
  security:
    oauth2-enabled: true
  outbox:
    poll-interval-ms: 2000
  v11:
    emit-mode: ${MADI_EMIT_MODE:DUAL}
  integration:
    oros:
      base-url: ${OROS_BASE_URL:http://localhost:8089}
    inventory:
      base-url: ${INVENTORY_BASE_URL:http://localhost:8108}
    nhume:
      base-url: ${NHUME_BASE_URL:http://localhost:8210}
    surveillance:
      base-url: ${SURVEILLANCE_BASE_URL:http://localhost:8180}
    butano:
      base-url: ${BUTANO_BASE_URL:http://localhost:8090}
    ndila:
      base-url: ${NDILA_BASE_URL:http://localhost:8150}
    iot:
      base-url: ${IOT_BASE_URL:http://localhost:8211}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    tags:
      application: madi-service

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
