server:
  port: ${SERVER_PORT:8270}

spring:
  application:
    name: clinical-knowledge-platform-service
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${KEYCLOAK_URL:http://localhost:8080}/realms/${KEYCLOAK_REALM:impilo}/protocol/openid-connect/certs
          issuer-uri: ${KEYCLOAK_URL:http://localhost:8080}/realms/${KEYCLOAK_REALM:impilo}
  autoconfigure:
    exclude:
      # Manual Kafka producer when impilo.clinical.kafka.relay-enabled=true (see ClinicalKafkaConfig).
      - org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:127.0.0.1:9092}
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:clinical_knowledge}
    username: ${DB_USER:impilo}
    password: ${DB_PASSWORD:impilo}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        default_schema: clinical
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    create-schemas: true
    schemas: clinical
    default-schema: clinical
    locations: classpath:db/migration
    baseline-on-migrate: true
    # This service's migration numbers are leased in per-lane bands (see
    # docs/registry/iatg-*-leases.md), so a lane routinely merges a migration
    # numerically BELOW one another lane has already applied. Flyway's default
    # refuses exactly those, and silently: the service boots green with the table
    # missing. Live-proven on pct 2026-07-26 — V106 was in the jar, the service was
    # healthy, zero errors, and six tables had never been created.
    #
    # What this does NOT license: a migration in one band may never DEPEND ON an
    # object owned by a higher band. Out-of-order only relaxes ordering on a database
    # where the higher number has ALREADY applied; a fresh database still applies
    # strictly ascending, so a cross-band dependency boots fine here and fails on
    # every new environment. Lease law forbids it for that reason.
    out-of-order: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true

impilo:
  clinical:
    kafka:
      # Set true in environments with Kafka; outbox rows still accumulate when false.
      relay-enabled: ${CLINICAL_KAFKA_RELAY_ENABLED:false}
      relay-poll-ms: ${CLINICAL_KAFKA_RELAY_POLL_MS:2000}
    steward:
      broad-spectrum-days-threshold: ${STEWARDSHIP_BROAD_SPECTRUM_DAYS:3}
    # Grounded LLM clinical reasoning (via governed llm-orchestration-service). Default-on but
    # fail-closed: degrades to the deterministic grounded path whenever no real model answers.
    llm:
      enabled: ${CLINICAL_LLM_ENABLED:true}
      base-url: ${LLM_ORCHESTRATION_BASE_URL:http://localhost:8265}
      preferred-provider: ${CLINICAL_LLM_PROVIDER:anthropic}
      max-output-tokens: ${CLINICAL_LLM_MAX_TOKENS:1200}
      min-grounding-ratio: ${CLINICAL_LLM_MIN_GROUNDING:0.5}
      connect-timeout-ms: ${CLINICAL_LLM_CONNECT_TIMEOUT_MS:3000}
      read-timeout-ms: ${CLINICAL_LLM_READ_TIMEOUT_MS:12000}
    # Retrieval mode for grounding evidence: like | semantic | hybrid.
    # Default 'like' because semantic/hybrid require EDLIZ sections to be indexed into search-service
    # (with an embeddings provider) first. The semantic retriever fail-closes to lexical, so flipping
    # to 'hybrid' is safe at any time but only adds value once that back-fill has run.
    retrieval:
      mode: ${CLINICAL_RETRIEVAL_MODE:like}
    search:
      base-url: ${SEARCH_SERVICE_BASE_URL:http://localhost:8230}
    edliz:
      # Repo-relative path to national reference PDF (same bundle as docs/reference/edliz-2025/)
      reference-pdf-path: ${EDLIZ_REFERENCE_PDF_PATH:docs/reference/edliz-2025/EDLIZ-2025-final-for-circulation.pdf}
      reference-sha256: ${EDLIZ_REFERENCE_SHA256:9b9b52e22f7d6aaa2e0dbcdbf40f92c90d592eeaa2cd5f83ddafc33703b24581}
    ingestion:
      # Resolve relative PDF paths against this directory (default: JVM working directory, e.g. repo root in dev)
      working-directory: ${CLINICAL_INGESTION_WORKING_DIR:}
      # Split long pages into multiple sections (characters per chunk)
      max-chunk-chars: ${CLINICAL_INGEST_MAX_CHUNK_CHARS:12000}
      chunk-overlap-chars: ${CLINICAL_INGEST_CHUNK_OVERLAP:400}
    disclaimer: >-
      EDLIZ-guided support assists licensed decision-making; it does not replace
      clinical judgment, bedside assessment, or local protocol where stricter.

logging:
  level:
    zw.gov.mohcc.impilo.clinical: INFO
