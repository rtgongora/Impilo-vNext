server:
  port: ${SERVER_PORT:8399}

spring:
  application:
    name: referral-service
  datasource:
    url: ${REFERRAL_DB_URL:jdbc:postgresql://localhost:5432/impilo_referral}
    username: ${REFERRAL_DB_USER:impilo}
    password: ${REFERRAL_DB_PASSWORD:impilo}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        default_schema: referral
  flyway:
    enabled: true
    schemas: referral
    default-schema: referral
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:${KAFKA_BOOTSTRAP:localhost:9092}}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all

referral:
  security:
  outbox:
    poll-interval-ms: ${REFERRAL_OUTBOX_POLL_MS:2000}

impilo:
  security:
    disable-oauth-for-tests: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
