server:
  port: ${SERVER_PORT:8160}

spring:
  application:
    name: reporting-service
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/reporting
    username: ${POSTGRES_USER:impilo}
    password: ${POSTGRES_PASSWORD:impilo}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ""

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

impilo:
  companion:
    enabled: true

reporting:
  outbox:
    poll-interval-ms: 2000
