server:
  port: ${SERVER_PORT:8121}
  servlet:
    context-path: /

spring:
  application:
    name: inpatient-service
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/inpatient
    username: ${POSTGRES_USER:impilo}
    password: ${POSTGRES_PASSWORD:changeme}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: inpatient
  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: inpatient
    baseline-on-migrate: true
    # This service's migration numbers are leased in per-lane bands (see
    # docs/registry/iatg-*-leases.md), so a lane routinely merges a migration
    # numerically BELOW one another lane has already applied. Flyway's default
    # refuses exactly those, and silently: the service boots green with the table
    # missing. Live-proven on pct 2026-07-26 — V106 was in the jar, the service was
    # healthy, zero errors, and six tables had never been created.
    #
    # What this does NOT license: a migration in one band may never DEPEND ON an
    # object owned by a higher band. Out-of-order only relaxes ordering on a database
    # where the higher number has ALREADY applied; a fresh database still applies
    # strictly ascending, so a cross-band dependency boots fine here and fails on
    # every new environment. Lease law forbids it for that reason.
    out-of-order: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:${KAFKA_BOOTSTRAP:localhost:9092}}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      retries: 3
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
    consumer:
      group-id: inpatient-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${KEYCLOAK_URL:http://localhost:8080}/realms/${KEYCLOAK_REALM:impilo}/protocol/openid-connect/certs
          issuer-uri: ${KEYCLOAK_URL:http://localhost:8080}/realms/${KEYCLOAK_REALM:impilo}

inpatient:
  security:
  outbox:
    poll-interval-ms: 2000
  v11:
    emit-mode: ${INPATIENT_EMIT_MODE:DUAL}
  integration:
    inventory:
      base-url: ${INVENTORY_BASE_URL:http://localhost:8098}
      enabled: ${INPATIENT_INVENTORY_CONSUMPTION_ENABLED:true}
    oros:
      base-url: ${OROS_BASE_URL:http://localhost:8089}
    # Wave 3 commodities peer: TUSO instrument-set registry + CSSD lifecycle (SoR).
    tuso:
      base-url: ${TUSO_BASE_URL:http://localhost:8084}
    # Wave 1 clinical-safety peers (orchestration-by-reference; peers stay source-of-truth)
    madi:
      base-url: ${MADI_BASE_URL:http://localhost:8300}
    nhume:
      base-url: ${NHUME_BASE_URL:http://localhost:8210}
    rito:
      base-url: ${RITO_BASE_URL:http://localhost:8391}
    # Wave 4 peers — death/teleconsult (PCT), discharge follow-up booking, trainee CPD (learning/Fundo)
    pct:
      base-url: ${PCT_BASE_URL:http://localhost:8088}
    booking:
      base-url: ${BOOKING_BASE_URL:http://localhost:8265}
    learning:
      base-url: ${LEARNING_BASE_URL:http://localhost:8235}
      internal-key: ${VARAPI_TO_LEARNING_INTERNAL_KEY:}
  theatre:
    reconciler:
      # TheatreProjectionReconciler poll cadence (ms). Disabled under the "test" profile.
      enabled: ${INPATIENT_THEATRE_RECONCILER_ENABLED:true}
  ews:
    # NEWS2 aggregate at/above which a deterioration escalation is raised
    escalation-threshold: ${INPATIENT_EWS_ESCALATION_THRESHOLD:5}
    # minutes within which a clinician must respond to a raised escalation before it is overdue (Rito)
    response-due-minutes: ${INPATIENT_EWS_RESPONSE_DUE_MINUTES:15}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    tags:
      application: inpatient-service

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
