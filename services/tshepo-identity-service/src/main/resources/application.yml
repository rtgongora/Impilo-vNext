server:
  port: 8181
  servlet:
    context-path: /

spring:
  application:
    name: tshepo-identity-service
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/tshepo_identity
    username: ${POSTGRES_USER:impilo}
    password: ${POSTGRES_PASSWORD:changeme}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: tshepo_identity
  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: tshepo_identity
    default-schema: tshepo_identity
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      # Values are pre-serialized JSON strings (envelope/outbox payloads) — a
      # JsonSerializer would double-encode them into quoted string literals.
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      # Subject translation relay (impilo.vito.* -> impilo.identity.subject)
      group-id: tshepo-identity-subject-relay
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_URL:http://localhost:8080}/realms/${KEYCLOAK_REALM:impilo}

# --- TSHEPO Identity-specific ---
tshepo:
  identity:
    # Default scoped-token TTL in seconds
    token-ttl-seconds: 300
    # AES-256-GCM key for MOSIP link_ref encryption (Base64-encoded, 32 bytes)
    mosip-kek: ${TSHEPO_MOSIP_KEK:aW1waWxvLXRzaGVwby1tb3NpcC1rZWstZGV2LTMyYnk=}
    # URL of the keys-service for Ed25519 signing
    keys-service-url: ${TSHEPO_KEYS_SERVICE_URL:http://localhost:8184}
    # URL of VITO service for Impilo ID → Health ID resolution
    vito-service-url: ${VITO_SERVICE_URL:http://localhost:8082}
  outbox:
    poll-interval-ms: 1000
    kafka-topic: platform.identity.events

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  metrics:
    tags:
      application: tshepo-identity-service
