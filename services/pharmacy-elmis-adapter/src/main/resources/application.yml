server:
  port: 8099
  servlet:
    context-path: /

spring:
  application:
    name: pharmacy-elmis-adapter
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/pharmacy_elmis
    username: ${POSTGRES_USER:impilo}
    password: ${POSTGRES_PASSWORD:changeme}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: pharmacy_elmis
  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: pharmacy_elmis
    baseline-on-migrate: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      group-id: pharmacy-elmis-adapter
      auto-offset-reset: earliest
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ""

# --- Actuator & Metrics ---
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: pharmacy-elmis-adapter

# --- OpenAPI / Swagger ---
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

# --- eLMIS Adapter-specific ---
elmis:
  connector:
    mode: REST
    external-url: ${ELMIS_URL:http://localhost:9080/api}
    timeout-seconds: 30
    retry-max-attempts: 3
    retry-backoff-ms: 1000
  mapping:
    facility-code-system: urn:zw:mohcc:facility
    drug-code-system: urn:zw:mohcc:drug
  kafka:
    stock-receipt-topic: pharmacy.stock.receipt
    stock-reconcile-topic: pharmacy.reconcile.result
    order-forward-topic: elmis.order.forwarded
