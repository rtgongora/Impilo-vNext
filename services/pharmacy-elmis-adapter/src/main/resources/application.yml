server:
  port: 8097
  servlet:
    context-path: /

spring:
  application:
    name: pharmacy-elmis-adapter
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      group-id: pharmacy-elmis-adapter
      auto-offset-reset: earliest
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER:http://localhost:8080/realms/impilo}

# --- Actuator & Metrics ---
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: pharmacy-elmis-adapter

# --- OpenAPI / Swagger ---
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

# --- eLMIS Adapter-specific ---
elmis:
  connector:
    mode: REST
    external-url: ${ELMIS_URL:http://localhost:9080/api}
    timeout-seconds: 30
    retry-max-attempts: 3
    retry-backoff-ms: 1000
  mapping:
    facility-code-system: urn:zw:mohcc:facility
    drug-code-system: urn:zw:mohcc:drug
  kafka:
    stock-receipt-topic: pharmacy.stock.receipt
    stock-reconcile-topic: pharmacy.reconcile.result
    order-forward-topic: elmis.order.forwarded
